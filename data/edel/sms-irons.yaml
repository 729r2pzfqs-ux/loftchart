  - "Driving Range Heroes 'Edel SMS Irons Review' — the only published full chart found: lofts 23/26/29/32/36/40/45/50, lies 60.5 to 64.0 and lengths 38.5 to 35.5 inches for 4-iron through gap wedge, plus the forged hollow body and dampening urethane foam construction."
