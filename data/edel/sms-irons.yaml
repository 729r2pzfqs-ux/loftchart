description: >
  The SMS was Edel Golf's first iron built around Swing Match Weighting, the
  adjustable system the Texas fitting specialist introduced on its wedges in
  2021: three ports on the back of every head take two 2-gram weights and one
  8-gram weight, and a fitter shifts the heavy weight toward heel, centre or
  toe to match the club's balance to the player's swing. Announced on 13 June
  2022 and at fitters from 21 July 2022 at $250 per club, it is a hollow-body
  players-distance head — forged 1025 carbon steel with a plasma-welded
  maraging steel face cup and urethane foam fill — with moderate lofts for
  the class: a 32-degree 7-iron and 45-degree pitching wedge across a 4-iron
  to 50-degree gap wedge range. Sets are fitter-built with a broad shaft menu
  rather than a single stock shaft. Still current, with the compact SMS Pro
  added alongside it in 2023.
