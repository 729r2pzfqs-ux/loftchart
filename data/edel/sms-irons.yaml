faq:
  - q: "What is the loft of an Edel SMS 7-iron?"
    a: "The Edel SMS 7-iron has a loft of 32 degrees, with a 62-degree lie and a 37-inch standard length."
  - q: "How does the weighting system on the Edel SMS irons work?"
    a: "Each head has three ports on the back holding two 2-gram weights and one 8-gram weight. During a fitting the heaviest weight is moved to heel, centre or toe, changing face angle and path delivery to match the golfer's swing."
  - q: "Are the Edel SMS irons forged?"
    a: "The body is forged 1025 carbon steel, but the head is hollow, with a plasma-welded maraging steel face cup and a urethane foam fill — a players-distance construction rather than a one-piece forging."
  - q: "What is the difference between the Edel SMS and SMS Pro irons?"
    a: "The SMS is the larger hollow-body players-distance model launched in 2022 with a 4-GW chart; the SMS Pro, added in 2023, is a compact one-piece-forged players head with the same movable-weight system, stronger 3-iron availability and the same 45-degree pitching wedge."
