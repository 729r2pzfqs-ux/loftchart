description: >
  The SMS Pro is the compact players iron in Edel Golf's Swing Match System
  line, announced on 23 January 2023 and at fitters from 24 February 2023 at
  $250 per club. Where the 2022 SMS is a hollow-body distance head, the Pro
  is forged from 1025 carbon steel in a multi-step Precision Grain Forging
  process, with a thin topline, minimal offset, a CNC-milled tri-step sole —
  leading-edge bounce, a middle bounce tier and trailing relief — and the
  same three weight ports in the muscle, stocked with two 2-gram titanium
  weights and one 8-gram tungsten weight that a fitter repositions to match
  the swing. Lofts are traditional (32-degree 7-iron, 45-degree pitching
  wedge) across a right-hand-only 3-PW range, sold fitter-built with KBS
  Tour steel as the stock shaft. Still current as of mid-2026.
