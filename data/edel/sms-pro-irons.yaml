faq:
  - q: "What is the loft of an Edel SMS Pro 7-iron?"
    a: "The Edel SMS Pro 7-iron has a loft of 32 degrees, with a 62-degree lie and a 37-inch standard length."
  - q: "When did the Edel SMS Pro irons come out?"
    a: "Edel announced the SMS Pro on 23 January 2023 and it reached select fitters and retailers on 24 February 2023 at $250 per club."
  - q: "Is the Edel SMS Pro a blade?"
    a: "No — it is a compact one-piece-forged players cavity with a thin topline and minimal offset, distinguished by three movable weight ports in the muscle and a CNC-milled tri-step sole."
  - q: "How does the SMS Pro differ from the Edel SMS?"
    a: "The SMS Pro is a compact one-piece 1025 forging for better players, while the SMS is a larger hollow-body players-distance head; both share the Swing Match movable-weight system and a 45-degree pitching wedge, but the Pro runs 3-PW where the SMS runs 4-iron to gap wedge."
