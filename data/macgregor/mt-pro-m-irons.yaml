description: >
  The MT PRO-M revived MacGregor's historic MT name for 2008 as a classic
  muscleback for the serious golfer — the company's last tour-blade before it
  ceased US operations in February 2009. The head is forged from 1025 carbon
  steel, then CNC-milled: a triangular muscle concentrates mass behind the
  strike and the face is flat-milled, in bright satin chrome with a limited
  gun-metal run. Lofts are traditional blade spec, a 35-degree 7-iron and
  47-degree pitching wedge over the 3-PW set, every club swing-weighted at D3
  on a .355 taper tip. Stock shafts were True Temper Dynamic Gold S300 or
  Nippon NS Pro 1150GH with Golf Pride DD2 grips, and left-handed sets were
  offered. It shares its loft, lie and length ladder exactly with the MT PRO-C
  cavity back so the two combine into one set.
