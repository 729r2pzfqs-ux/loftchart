faq:
  - q: "What is the loft of a MacGregor MT PRO-M 7-iron?"
    a: "The MacGregor MT PRO-M 7-iron has a loft of 35 degrees, a lie of 62.5 degrees and a length of 37 inches, swing-weighted at D3 like every club in the set."
  - q: "Can the MT PRO-M be combined with the MT PRO-C?"
    a: "Yes. MacGregor published identical loft, lie and length tables for the two 2008 MT models, so the muscleback PRO-M and cavity-back PRO-C combine into one set without bending."
  - q: "When were MacGregor MT PRO-M irons made?"
    a: "They launched for 2008 and production ended when MacGregor ceased US operations in February 2009, making the MT PRO-M the company's last muscleback of the original US era."
