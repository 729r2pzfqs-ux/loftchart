description: >
  The Tourney VIP V-FOIL 1025M was the muscleback of MacGregor's early-2000s
  V-FOIL forged pair, which MacGregor described as a modernised version of the
  1967 VIP muscleback — the Nicklaus-era icon — aimed at 15-and-under
  handicappers, and it was played on tour by Lee Janzen and Jose Maria
  Olazabal. The head is forged from 1025 carbon steel with V-FOIL weighting
  under a nickel chrome finish. Lofts are classic blade spec: a 35-degree
  7-iron and 48-degree pitching wedge across the 2-PW range, two to three
  degrees weaker through the scoring clubs than the companion 1025C cavity
  back. Stock shafts were True Temper Dynamic Gold with a Golf Pride Tour
  Velvet grip. The Maltby MPF chart dates the design 2001; the spec database
  files it as a 2002 catalogue model, recorded here on the announcement-year
  convention.
