faq:
  - q: "What is the loft of a MacGregor V-FOIL 1025M 7-iron?"
    a: "The MacGregor V-FOIL 1025M 7-iron has a loft of 35 degrees, a lie of 62.5 degrees and a steel-shaft length of 37 inches."
  - q: "Is the MacGregor V-FOIL 1025M related to the Jack Nicklaus VIP?"
    a: "MacGregor's own product copy called the 1025M a modernised version of the 1967 VIP muscleback, the model line made famous by Jack Nicklaus, and it was played on tour by Lee Janzen and Jose Maria Olazabal."
  - q: "What shaft came in the MacGregor V-FOIL 1025M?"
    a: "True Temper Dynamic Gold steel (R300, S300 or X100) with a Golf Pride Tour Velvet grip was the stock build."
