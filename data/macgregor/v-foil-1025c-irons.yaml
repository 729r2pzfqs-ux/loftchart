description: >
  The Tourney VIP V-FOIL 1025C — clubs are stamped "VIP Tourney V-FOIL Forged"
  — was the forgiving half of MacGregor's V-FOIL forged pair, sold alongside
  the 1025M muscleback. Its V-FOIL cavity is about 23 percent larger than a
  traditional blade's, and MacGregor pitched the result as forgiveness "any
  0-36 handicapper will love" while keeping a forged 1025 carbon steel head
  with progressive offset under a nickel chrome finish. Lofts are mid-era
  traditional with a 33.5-degree 7-iron and 45-degree pitching wedge across
  a 2-PW range. Stock shafts were True Temper's Pro-Pel Lite low-bend steel
  or Graphite Design Distance Series graphite; published lengths are steel,
  with graphite builds half an inch longer. The Maltby MPF chart dates the
  design 2001; the spec database files it as a 2002 catalogue model, the
  announcement-versus-model-year gap recorded here per convention.
