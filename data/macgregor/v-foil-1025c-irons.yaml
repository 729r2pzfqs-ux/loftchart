faq:
  - q: "What is the loft of a MacGregor V-FOIL 1025C 7-iron?"
    a: "The MacGregor V-FOIL 1025C 7-iron has a loft of 33.5 degrees, a lie of 62.5 degrees and a steel-shaft length of 37 inches."
  - q: "What is the difference between the MacGregor 1025C and 1025M?"
    a: "Both are forged from 1025 carbon steel with V-FOIL weighting, but the 1025C is the cavity back — a cavity about 23 percent larger than a traditional blade, slightly stronger lofts (33.5 versus 35 degrees at the 7-iron) and lighter stock shafts — while the 1025M is the muscleback for better players."
  - q: "Are MacGregor V-FOIL 1025C lengths for steel or graphite shafts?"
    a: "The published lengths are for steel shafts. MacGregor's chart notes graphite builds run half an inch longer per club."
