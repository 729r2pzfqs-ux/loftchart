description: >
  The MT PRO-C was the cavity-back half of MacGregor's 2008 MT revival, which
  the company described as an updated version of the VIP Tour iron — a compact
  players cavity sold alongside the MT PRO-M muscleback until MacGregor ceased
  US operations in February 2009. The head is forged from 1025 carbon steel
  and CNC-milled, in bright satin chrome. Lofts, lies and lengths are
  identical to the PRO-M's — a 35-degree 7-iron and 47-degree pitching wedge
  over the 3-PW set, each club at D3 on a .355 taper tip — so the two models
  combine into one blended set. Stock shafts were True Temper Dynamic Gold
  S300 or Nippon NS Pro 1150GH with Golf Pride DD2 grips, with left-handed
  sets offered.
