faq:
  - q: "What is the loft of a MacGregor MT PRO-C 7-iron?"
    a: "The MacGregor MT PRO-C 7-iron has a loft of 35 degrees, a lie of 62.5 degrees and a length of 37 inches."
  - q: "What is the difference between the MT PRO-C and MT PRO-M?"
    a: "The PRO-C is the cavity back — MacGregor called it an updated VIP Tour iron — while the PRO-M is the muscleback. Their published loft, lie and length tables are identical, so they blend into combo sets."
  - q: "When were MacGregor MT PRO-C irons made?"
    a: "They launched for 2008 and ended with MacGregor's exit from US operations in February 2009."
