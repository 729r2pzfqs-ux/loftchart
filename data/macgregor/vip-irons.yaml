faq:
  - q: "What is the loft of a MacGregor VIP (2010) 7-iron?"
    a: "The 2010 MacGregor VIP 7-iron has a loft of 35 degrees, a lie of 62.5 degrees and a length of 37 inches."
  - q: "Is the 2010 MacGregor VIP the same as the Jack Nicklaus VIP?"
    a: "No. The 1967 VIP and the 1990s VIP by Jack Nicklaus lines are earlier, unrelated designs; no verifiable factory spec tables survive for them. The 2010 VIP is a Golfsmith-era relaunch of the name on a modern forged muscle-cavity players iron."
  - q: "What shaft came in the 2010 MacGregor VIP irons?"
    a: "KBS Tour steel in regular or stiff flex was the stock shaft, per MacGregor's own product page."
