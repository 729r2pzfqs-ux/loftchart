description: >
  This VIP is the 2010 relaunch of MacGregor's most famous iron name under
  Golfsmith, which had acquired the brand rights in May 2009 after MacGregor
  ceased US operations. It is not the 1967 Nicklaus VIP or the 1990s VIP by
  Jack Nicklaus line — no verifiable factory spec table survives for those —
  but a modern players iron: forged from 1020 carbon steel on an 800-ton press
  with a precision-milled muscle cavity and a thin topline, pitched at players
  who want shot-making and feel with a little help. Lofts are traditional for
  a players iron of the era, with a 35-degree 7-iron and 47-degree pitching
  wedge across the stock 3-PW set, and KBS Tour steel was the stock shaft.
  A VIP Pro tour prototype had been spotted on tour as early as 2008 while
  the relaunch was being prepared.
