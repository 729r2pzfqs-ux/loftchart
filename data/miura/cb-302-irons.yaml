description: >
  The CB-302 is Miura's mid-size cavity-back, announced on 14 March 2023 as
  the successor to the CB-301 and billed by Miura as the longest forged
  cavity-back iron it has ever produced, with the widest sole in the
  company's history at 19 mm on the 7-iron. Heads are hand-forged from S20C
  soft carbon steel at the family factory in Himeji, Japan. Despite the
  larger profile the loft ladder stays traditional, with a 32-degree 7-iron
  and 44-degree pitching wedge, and heads run 4-iron through gap wedge.
  Miura sells heads component-style through authorized dealers and fitters,
  so there is no stock shaft; the lengths below are the standard steel
  lengths from Miura's own spec table. Miura publishes face progression
  rather than offset, and no bounce or swing weight, so those keys are
  omitted.
