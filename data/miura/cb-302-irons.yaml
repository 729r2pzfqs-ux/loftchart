faq:
  - q: "What is the loft of a Miura CB-302 7-iron?"
    a: "The Miura CB-302 7-iron has a loft of 32 degrees, with a 62.5-degree lie and a 37-inch standard steel length."
  - q: "What did the Miura CB-302 replace?"
    a: "The CB-302 succeeded the CB-301, Miura's previous mid-size cavity-back, when it was announced in March 2023."
  - q: "Is the Miura CB-302 forgiving?"
    a: "By Miura standards, yes. Miura calls it the longest forged cavity-back it has ever made, with the widest sole in company history at 19 mm on the 7-iron, though the lofts remain traditional with a 32-degree 7-iron."
  - q: "What clubs are available in the Miura CB-302?"
    a: "Heads are offered 4-iron through gap wedge (48 degrees), sold component-style through Miura's authorized dealers and fitters."
