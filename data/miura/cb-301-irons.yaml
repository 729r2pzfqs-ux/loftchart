description: >
  The CB-301, announced on 15 January 2019, was the largest and most
  distance-oriented cavity back Miura had produced to that point — the
  company's launch release called it the longest forged cavity back in its
  history and its first fully forged cavity back since the PP-9003 of 2011 —
  aimed at players who wanted the Himeji forging in a more forgiving head. Each iron
  carries a variable sole and cavity thickness so the center of gravity is
  tuned by loft, and the lofts are the strongest of the Miura irons of its era
  — a 32-degree 7-iron and 44-degree pitching wedge, with the stock range
  running 4-iron through a 48-degree gap wedge. Miura removed the model from
  its lineup around the March 2023 launch of the mid-size CB-302, which took
  over the same loft structure. Miura sells heads through authorized fitters
  and builds sets to order, so no stock shaft is recorded.
