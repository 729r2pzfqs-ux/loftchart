sources:
  - "Miura official CB-301 spec chart — the miuragolf.com/products/cb-301 page (archive.org capture of 7 August 2020) serves its specification tab as an image, cb-301-specs.jpg, still hosted on Miura's own Shopify CDN (cdn.shopify.com/s/files/1/0280/3210/6575/files/cb-301-specs.jpg): 4-iron through gap wedge, lofts 22/25/28/32/36/40/44/48, lies 61.0 to 64.0 (GW 64.0), face progression 1.0 to 4.0 mm, head weights 250 to 295 g, lengths 38.50 down to 35.50 inches. The archived page also carries the variable sole and cavity thickness copy and the $280-per-head price."
  - "Tour Shop Fresno and Usher Golf / chipandputt.com (authorized Miura dealers) CB-301 spec tables — corroborate every loft, lie, length and head weight, plus the S25C soft carbon steel material (the archived Miura page prints the garbled 'S2C'). Usher Golf alone lists the gap wedge lie as 64.5 degrees; 64.0 is recorded here per Miura's own chart."
  - "PR Newswire 'Miura Golf Launches New CB-301 Line of Cavity Back Irons', 15 January 2019 — the announcement date, the longest-forged-cavity-back and largest-sweet-spot claims, the first-fully-forged-cavity-back-since-the-PP9003 (2011) lineage behind the predecessor field, hand-forging in Himeji, and the satin nickel chrome finish."
  - "golfwrx.com and firstcallgolf.com, March 2023 — announcement of the mid-size CB-302 on 14 March 2023, which fixes year_discontinued at 2023; the CB-301 page has since been removed from miuragolf.com."
  - "Note: offset, bounce and swing weight are omitted (Miura publishes face progression in mm, not offset). Lengths are Miura's published standard assembly lengths, but Miura sells heads component-style through fitters, so built lengths vary per order. No stock shaft: Miura builds to order."
