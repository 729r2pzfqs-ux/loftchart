faq:
  - q: "What is the loft of a Miura CB-301 7-iron?"
    a: "The Miura CB-301 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "Is the Miura CB-301 discontinued?"
    a: "Yes. Miura announced the mid-size CB-302 in March 2023 and the CB-301 subsequently left the miuragolf.com lineup, though dealers continued to build remaining heads to order."
  - q: "What clubs were available in the Miura CB-301?"
    a: "4-iron through a 48-degree gap wedge, with a 44-degree pitching wedge — the strongest lofts in the Miura iron range of its era."
  - q: "What did the Miura CB-301 replace?"
    a: "Miura's launch release called it the company's first fully forged cavity back since the PP-9003 of 2011. It was succeeded by the mid-size CB-302, announced in March 2023."
