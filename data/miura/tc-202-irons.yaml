description: >
  The TC-202 is Miura's tour cavity, announced on 11 March 2025 at $350 per club
  as the successor to the 2020 TC-201, reaching retail in mid-April 2025. Heads
  are hand-forged from S20C soft carbon steel in Himeji, Japan, to the factory's
  plus-or-minus 0.5-gram weight tolerance. The generation adds a T-Weight Bar
  across the back to control mass distribution, a variable-depth cavity, and
  Miura's Y-grind leading edge, keeping the balance of muscle-back precision and
  cavity-back forgiveness that defines the TC line. The loft ladder is unchanged
  from the TC-201 through the 9-iron — a 33-degree 7-iron — but the pitching
  wedge is 45 degrees and a 50-degree gap wedge extends the set to 3-GW. Heads
  come in Satin Chrome, with QPQ and Raw finishes also offered. Miura sells
  heads through authorized dealers and fitters and builds sets to order from a
  shaft menu, so no stock shaft is recorded.
