description: >
  The MB-5005 is the blade of Miura's transitional MG Collection,
  announced for North America in July 2017 alongside the CB-1008 and
  CB-2008 and sold through fitters at $279 per head. It had first
  appeared in Japan as a limited run reported at 150 sets, and its trick
  is subtle: about 15 grams are shaved from where a conventional muscle
  pad would sit and redistributed around the head, so a club that reads
  as a blade at address carries an expanded sweet spot and a lower centre
  of gravity — "looks like a blade but plays like a cavity back" in the
  launch coverage. The head is slightly longer heel-to-toe than Miura's
  earlier blades while keeping the thin topline and sole, forged from
  S25C soft carbon steel in Himeji with the W.D.D. accurate-forging stamp
  of the MG series, in satin chrome. Lofts are Miura-traditional (34-degree
  7-iron, 47-degree pitching wedge) over a 3-PW range. Miura sold it as
  heads only, so the lengths below are Miura's standard assembly lengths
  of the era rather than a factory sheet. It left the range around 2019,
  when the MB-101 took over the flagship blade slot.
