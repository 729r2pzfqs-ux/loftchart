faq:
  - q: "What is the loft of a Miura MB-5005 7-iron?"
    a: "The Miura MB-5005 7-iron has a loft of 34 degrees and a lie of 61 degrees, with a standard-build length of 37 inches."
  - q: "How is the Miura MB-5005 different from a normal blade?"
    a: "Roughly 15 grams that would normally form the muscle pad are redistributed around the head, expanding the sweet spot and lowering the centre of gravity — Miura pitched it as a blade at address that plays like a cavity back."
  - q: "When did the Miura MB-5005 come out?"
    a: "It reached North America in July 2017 as part of the MG Collection with the CB-1008 and CB-2008, after an earlier limited Japan run, and left the range around 2019 when the MB-101 arrived."
  - q: "What clubs were offered in the Miura MB-5005?"
    a: "Heads ran 3-iron through pitching wedge (47 degrees), sold through authorized fitters who build any composition to order."
