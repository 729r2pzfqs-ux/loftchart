faq:
  - q: "What is the loft of a Miura MC-502 7-iron?"
    a: "The Miura MC-502 7-iron has a loft of 33 degrees, with a 62.5-degree lie and a 37-inch standard steel length."
  - q: "What did the Miura MC-502 replace?"
    a: "The MC-502 succeeded the MC-501 when it was announced on 15 November 2022, keeping the muscle-cavity concept but with less offset, a softer rounded top line and toe, and improved turf interaction."
  - q: "Is the Miura MC-502 a blade?"
    a: "Not quite. It is a muscle-cavity design: it looks close to a blade at address, but a shallow relief in the back adds slightly more forgiveness than Miura's pure MB muscle-backs."
  - q: "What clubs are available in the Miura MC-502?"
    a: "Heads are offered 3-iron through pitching wedge (46 degrees), sold component-style through Miura's authorized dealers and fitters in satin chrome or copper finishes."
