description: >
  The MC-502 is Miura's muscle-cavity players iron, announced on 15 November
  2022 as the successor to the MC-501 with retail orders opening in 2023 at
  roughly 350 US dollars per head. Compared with the MC-501 it carries less
  offset, a softer and more rounded top line and toe profile, and improved
  turf interaction, keeping a near-blade address look while a shallow back
  relief adds a small measure of forgiveness. Heads are hand-forged from
  S20C soft carbon steel in Himeji, Japan and offered 3-iron through
  pitching wedge in a satin chrome finish, with a copper-finish variant
  added later. Miura sells heads component-style through authorized dealers
  and fitters, so there is no stock shaft; the lengths below are the
  standard steel lengths from Miura's own spec table. Miura publishes face
  progression rather than offset, and no bounce or swing weight, so those
  keys are omitted.
