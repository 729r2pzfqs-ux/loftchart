description: >
  The MB-001 was Miura's first new blade in six years when it debuted in
  October 2013, replacing the Tournament Blade with a slightly stronger loft
  structure, a rounded leading-edge grind and increased sole camber for
  cleaner turf interaction. Nicknamed the "Baby Blade" by players for its
  compact profile, it carried traditional specs — a 34-degree 7-iron and a
  47-degree pitching wedge across a 3-PW right-hand-only range — and sold
  through authorized Miura dealers at roughly $235 per club, built to order.
  It remained the company's flagship muscle-back until Miura announced the
  MB-101 in October 2019, billed as the maker's first new blade since 2013.
  Miura sold the MB-001 as component heads through fitters and published no
  standard assembly lengths, so the length column is omitted here.
