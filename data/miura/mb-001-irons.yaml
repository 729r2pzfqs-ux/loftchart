faq:
  - q: "What is the loft of a Miura MB-001 7-iron?"
    a: "The Miura MB-001 7-iron has a loft of 34 degrees and a lie of 61 degrees. Miura published no standard length because sets were built to order through dealers."
  - q: "Why is the Miura MB-001 called the Baby Blade?"
    a: "Players nicknamed the MB-001 the Baby Blade for its compact head. It was Miura's first new blade in six years when it debuted in October 2013, replacing the Tournament Blade."
  - q: "What replaced the Miura MB-001?"
    a: "The Miura MB-101, announced in October 2019 and billed by Miura as its first new blade since 2013, with sole width and face thickness reworked from the MB-001."
  - q: "What clubs were available in the Miura MB-001?"
    a: "3-iron through pitching wedge, right handed only, with a traditional 47-degree pitching wedge. Heads were sold through authorized Miura dealers and built to order."
