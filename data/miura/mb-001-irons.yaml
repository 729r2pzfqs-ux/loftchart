sources:
  - "Usher Golf (authorized Miura dealer) MB-001 Tournament Blade spec chart (chipandputt.com/miuragolf/miuramb001tournamentblade) — lofts 21/24/27/30/34/38/42/47 and lies 59.0 to 62.5 for 3-iron through PW, head weights 244 to 295 g, the low-carbon premium Japanese steel material, Himeji precision forging and W nickel (satin) chrome finish, right hand only."
  - "Plugged In Golf 'Miura MB-001 Irons Review' spec-and-price graphic (pluggedingolf.com, image dated November 2016) — independently corroborates every loft and lie above and lists length as N/A for all clubs with 'Custom' shafts, confirming that Miura published no standard build length for this dealer-built model."
  - "miuragolf.com archived homepage (archive.org capture of 11 August 2017) — the MB-001 in Miura's official current line with material 'Premium soft carbon Japanese steel', W nickel (satin) chrome or Black Boron finish, right handed only, set makeup 3 to PW."
  - "GolfWRX 'Review: Miura MB-001 Irons', 6 February 2014, and Flagstick.com 'Masters of The Blade — The Miura MB-001', 13 January 2014 — the first-new-blade-in-six-years positioning versus the retired Tournament Blade, the rounded leading edge and revised sole camber, $235-per-club pricing and dealer-only distribution. A Kustom Clubs dealer listing dated 17 December 2013 and a MyGolfSpy forum debut thread of October 2013 fix year_introduced at 2013."
  - "golf.com 'FIRST LOOK: Miura unveils MB-101, the company's first blade iron since 2013', 3 October 2019 — the MB-101 announcement that fixes year_discontinued at 2019 and the successor field."
  - "Note: offset, bounce and length are omitted. The one dealer chart that prints offset and bounce columns (Usher Golf) is not corroborated elsewhere and its offset figures are inconsistent with Miura's face-progression convention, and Miura itself published length as N/A. Confidence is medium because the loft/lie chart comes from two agreeing dealer/press sources rather than a surviving manufacturer spec sheet."
