description: >
  The CB-1008 is a one-piece forged S25C cavity-back from Miura's CB-1000
  series, released in Japan on 22 February 2017 and brought to Western
  markets that autumn as part of the transitional MG Collection (with the
  CB-2008 and MB-5005) at $279 per club. A weight bar across the bottom
  of the cavity concentrates mass low and behind the sweet spot, and the
  19-millimetre sole at the 7-iron was the widest of any CB-1000-series
  head, making it the most forgiving and lowest-launching-friendly of
  Miura's compact players cavity-backs while keeping the thin topline,
  minimal offset and high, pointed toe of the marque. MG-series heads
  carry a W.D.D. stamp for Miura's accurate-forging process covering
  weight, dimension and density. Miura sold it through fitters as heads
  (4-PW and 3-PW make-ups, right hand only, satin chrome), so the lengths
  below are Miura's standard assembly lengths of the era rather than a
  model-specific factory sheet. It left the range around 2019, when the
  wide-sole CB-301 took over the forgiving-cavity-back slot.
