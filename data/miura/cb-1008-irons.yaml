faq:
  - q: "What is the loft of a Miura CB-1008 7-iron?"
    a: "The Miura CB-1008 7-iron has a loft of 34 degrees, with a 61-degree lie and a 37-inch length in a standard build."
  - q: "Is the Miura CB-1008 forgiving?"
    a: "By Miura standards, yes — its 19-millimetre 7-iron sole was the widest of any CB-1000-series head, and the weight bar at the bottom of the cavity keeps the centre of gravity low for easier launch, while the head stays compact with a thin topline and minimal offset."
  - q: "When did the Miura CB-1008 come out?"
    a: "It was released in Japan on 22 February 2017 and reached Western markets that October as part of the MG Collection at $279 per head. It left the line-up around 2019, when the CB-301 took over the wide-sole cavity-back role."
  - q: "What does the W.D.D. stamp on the Miura CB-1008 mean?"
    a: "Weight, dimension and density — Miura's 'accurate forging' designation applied to the MG Collection heads, denoting the tolerances held through the Himeji forging process."
