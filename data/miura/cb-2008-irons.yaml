description: >
  The CB-2008 was Miura's most forgiving iron to date when the company
  announced it on 6 June 2017, part of the transitional "MG Collection"
  launch alongside the CB-1008 and MB-5005 that reached Western retail that
  autumn. Miura's own release framed it as proof "forged irons are not
  reserved for the game's most skilled players": the 5-through-8 heads weld
  a 4 mm forged face to a SUS stainless composite pocket cavity - the first
  composite-body iron made exclusively at the Himeji factory - for the
  widest sole Miura had built, 20 mm at the 7-iron, while the 9-iron and
  pitching wedge revert to a conventional one-piece forging. It continued a
  house lineage of progressively easier-to-hit Miura irons that ran P9005,
  P9005G, then the CB-2008, before the dedicated IC-601 arrived within the
  same product cycle and took over the forgiving-iron slot; the CB-2008's
  own run appears to have been brief. Miura sells the head through
  authorised fitters built to order, so no stock shaft is recorded.
