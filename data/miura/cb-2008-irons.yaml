sources:
  - "Tour Shop Fresno 'Miura Giken CB-2008 Irons' and Usher Golf/chipandputt.com 'Miura CB-2008' spec pages (both authorized Miura dealers) — agree exactly on the 5-PW factory chart used here: lofts 25/28/32/36/40/45 degrees, lies 60.0 to 62.5 degrees, and head weights 256-293 g; neither dealer publishes a length column."
  - "Miura Golf equipment blog 'Miura Golf Debuts CB 2008 Irons For All Skill Levels' (miuragolf.com/blogs/equipment) — the 6 June 2017 announcement date, the 5-8 pocket-cavity/9-PW one-piece construction split, the 4 mm forged face welded to a SUS composite body, the 20 mm 7-iron sole (widest in Miura's history to that point) and the first-composite-body-iron-at-Himeji claim."
  - "MyGolfSpy 'Miura MG Collection – CB-1008 & CB-2008' (6 October 2017) — the shared US MG Collection launch date and pricing context for the CB-2008 alongside its CB-1008 and MB-5005 siblings, which this site's CB-1008 entry also cites."
  - "GolfWRX forum synthesis on Miura's game-improvement lineage: 'Miura Golf entered the semi game improvement iron segment starting with the P9005, followed by the P9005G, then the 2 piece CB-2008 and now the IC-601' — the basis for the predecessor/successor fields; this site's own IC-601 entry dates that model to late 2017, so the CB-2008's run inside the lineage was short. No source gives an exact CB-2008 discontinuation date, so year_discontinued 2018 is an inferred estimate, not a confirmed figure."
  - "LENGTH NOTE (confidence: medium-low): no Miura CB-2008-specific length chart was found in any dealer or archived-manufacturer source. The lengths above follow this site's Miura IC-601 entry (38.0-inch 5-iron through 35.75-inch PW) — a same-era, similarly-lofted Miura factory chart used as the best available proxy, not a CB-2008-specific figure. Offset and bounce are omitted because no source publishes either for this head."
