faq:
  - q: "What is the loft of a Miura CB-2008 7-iron?"
    a: "The Miura CB-2008 7-iron has a loft of 32 degrees and a lie of 61 degrees, per matching dealer spec charts."
  - q: "Is the Miura CB-2008 forged?"
    a: "Partly. The 5-8 irons weld a 4 mm forged carbon-steel face to a stainless composite pocket-cavity body - Miura's first composite-body iron - while the 9-iron and pitching wedge are conventional one-piece forgings."
  - q: "What replaced the Miura CB-2008?"
    a: "The IC-601, which arrived within the same product cycle as Miura's next, more dedicated step in forgiving-iron design; the CB-2008 does not appear to have stayed in the catalog long."
  - q: "How forgiving is the Miura CB-2008 compared to other Miura irons?"
    a: "Very, by Miura standards: a 20 mm sole at the 7-iron, the widest Miura had built at the time, and Miura marketed it explicitly as proof that forged irons could work for golfers of all skill levels, not just better players."
