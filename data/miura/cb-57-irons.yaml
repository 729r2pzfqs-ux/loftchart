faq:
  - q: "What is the loft of a Miura CB-57 7-iron?"
    a: "The Miura CB-57 7-iron has a loft of 34 degrees and a lie of 61 degrees. No standard length was published because Miura dealers built every set to order."
  - q: "What does the 57 in Miura CB-57 stand for?"
    a: "It references 1957, the year Katsuhiro Miura's company was founded. The Series 1957 designation is reserved for the designs the Miura family regards as its benchmarks."
  - q: "Is the Miura CB-57 forgiving?"
    a: "It is a medium-sized players cavity back — more forgiving than the MB-001 blade thanks to a progressive weight bar that repositions mass by loft, but far smaller than a modern game-improvement iron."
  - q: "Is the Miura CB-57 discontinued?"
    a: "Yes. It was still in Miura's line in 2017 but was gone by the company's 2019 relaunch, and no direct successor was named."
