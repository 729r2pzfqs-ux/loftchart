sources:
  - "The Hackers Paradise 'Miura CB57 Irons Review' — full spec chart for 3-iron through PW: lofts 22/24/27/30/34/38/42/47, lies 59.0 to 62.5, head weights 243 to 295 g, plus the progressive weight-bar construction and the Y-Grind sole detail."
  - "Driving Range Heroes 'Miura CB57 Irons Review' — an independently published chart agreeing with every loft, lie and head weight above, including the 22-degree 3-iron."
  - "Usher Golf (authorized Miura dealer) CB57 page (chipandputt.com/miuragolf/miuracb57) — corroborates lies, weights, the premium soft carbon Japanese steel material, Himeji forging, W nickel (satin) chrome or Boron finish and right hand only; its chart alone prints the 3-iron loft as 21 degrees, recorded here as 22 per the two agreeing review charts."
  - "miuragolf.com archived homepage (archive.org capture of 11 August 2017) — the CB57 in Miura's official line with set makeup 3 to PW, and GolfWRX forum debut thread 'New MIURA CB57' plus Plugged In Golf review photography dated November 2014, which together with press coverage calling it Miura's first new iron since the October 2013 MB-001 fix year_introduced at 2014."
  - "Note: year_discontinued 2019 reflects the model's absence from the iron lineup on miuragolf.com's relaunched site (archive.org capture of 19 July 2019, which lists CB-301, CB-801, IC-601, ICL and MC-501 only); no direct successor was named, so the successor field is null. Length, offset and bounce are omitted: Miura sold the CB-57 component-style through dealers and no standard length chart was published. Confidence is medium because the numbers come from agreeing secondary charts rather than a surviving manufacturer spec sheet."
