description: >
  The CB-57 was the cavity back of Miura's Series 1957 class — the "57"
  denoting the company's 1957 founding — released in late 2014 as the
  maker's first new iron after the MB-001 blade of the previous October.
  A medium-sized players cavity with a narrow top line, it carried a weight
  bar in the cavity that changes size club to club to tune the centre of
  gravity through the set, plus the leading-edge sole grind of the MB-001.
  Lofts were among the weakest in the Miura range, with a 34-degree 7-iron
  and 47-degree pitching wedge across a 3-PW right-hand-only run. The model
  was still in Miura's official line in 2017 but was gone from the lineup by
  the company's mid-2019 relaunch, with no direct successor named. Miura sold
  heads through dealers and published no standard assembly lengths, so the
  length column is omitted here.
