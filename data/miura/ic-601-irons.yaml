description: >
  The IC-601 was Miura's first genuine game-improvement iron, introduced
  in late 2017 to give mid and higher handicaps a way into the Himeji
  brand. It breaks with the house one-piece forging: an inner-cavity
  hollow construction pairs a 455 Carpenter steel face with a SUS304
  stainless body and an adjustable back weight screw, producing a low
  centre of gravity, a bigger sweet spot and a wider sole under a
  noticeably larger head with a thicker topline than any Miura forging.
  Lofts are only modestly strong — a 31-degree 7-iron and 45-degree
  pitching wedge across a 4-GW factory chart — so Miura's launch line was
  distance through CG rather than jacked lofts. It stayed in the range
  for six years and appeared in Golf.com's ClubTest in both 2018 and
  2020; the hollow-body IC-602 replaced it in March 2024. Miura sells
  through authorized fitters and builds sets to order from a shaft menu,
  so no stock shaft is recorded; the lengths below are from Miura's own
  factory chart.
