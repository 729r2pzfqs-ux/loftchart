sources:
  - "Miura Golf official IC-601 product page (miuragolf.com/products/ic-601, archive.org capture of 9 December 2022) — full factory specification table for 4-iron through GW: loft, lie, face progression 1.0-1.2 mm, head weights 249-294 g and lengths 38.50 to 35.50 inches, plus the materials line (face: 455 Carpenter steel; body: SUS304), the satin finish and the inner-cavity/back-weight-screw construction copy."
  - "TourSpecGolf 'The New Miura IC-601 Irons Initial Impressions' and Golf.com ClubTest 2018 review — the 2017 introduction window, the game-improvement positioning aimed at mid-to-higher handicaps, and lofts 2-3 degrees stronger than Miura tradition; Golf.com ran it again in ClubTest 2020, confirming its long run in the line."
  - "Miura Golf equipment blog 'IC-601 Irons: Features, Attributes and Who Should Play' — the 455 Carpenter steel face, variable weighting, wider sole and larger head with thicker topline relative to Miura's forgings."
