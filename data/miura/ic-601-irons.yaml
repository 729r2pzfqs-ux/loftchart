faq:
  - q: "What is the loft of a Miura IC-601 7-iron?"
    a: "The Miura IC-601 7-iron has a loft of 31 degrees, a lie of 61.5 degrees and a factory length of 37 inches."
  - q: "Is the Miura IC-601 forged?"
    a: "Not in the traditional Miura sense. It pairs a 455 Carpenter steel face with a SUS304 stainless body in an inner-cavity construction with a back weight screw — the point was game-improvement help rather than one-piece forging."
  - q: "Who is the Miura IC-601 for?"
    a: "Miura aimed it at mid and higher handicaps wanting extra distance and forgiveness with Miura looks — the largest head and thickest topline the company offered at the time."
  - q: "What replaced the Miura IC-601?"
    a: "The hollow-body IC-602, announced 19 March 2024 and available from 16 April 2024."
