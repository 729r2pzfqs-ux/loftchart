description: >
  The KM-700 carries founder Katsuhiro Miura's initials and is presented as his
  signature design, five years in development before its unveiling in May 2022.
  It is hand-forged from S20C soft carbon steel in Himeji, Japan, using the
  factory's third-strike forging process, and blends a blade-like profile with a
  more forgiving head: a toe-cut grind on the sole tunes camber and bounce, and
  reshaped hosel and heel geometry shifts the centre of gravity about three
  millimetres toward the toe, behind the centre of the face. Each head is
  approved with Katsuhiro Miura's red hanko stamp in the back cavity. Lofts are
  traditional for the line — a 33-degree 7-iron and 46-degree pitching wedge
  across the 4-PW range, at $2,800 for a 4-PW set of heads at launch. Miura
  sells heads through authorized dealers and fitters and builds sets to order,
  so no stock shaft is recorded.
