faq:
  - q: "What is the loft of a Miura TC-201 7-iron?"
    a: "The Miura TC-201 7-iron has a loft of 33 degrees, with a 62.5-degree lie and a 37-inch standard steel length."
  - q: "What does TC stand for in Miura TC-201?"
    a: "TC stands for Tour Cavity. The TC-201 is a shallow cavity-back that sits between Miura's MB-101 muscle-back and its larger cavity-backs, pairing a blade-like profile with modest heel-toe forgiveness."
  - q: "Is the Miura TC-201 discontinued?"
    a: "Yes. Miura announced its successor, the TC-202, on 11 March 2025, and the TC-201 has been removed from Miura's current line."
  - q: "Does the Miura TC-201 come with a stock shaft?"
    a: "No. Miura sells the TC-201 as forged heads through authorized dealers and fitters, who build them to order, so there is no factory stock shaft."
