sources:
  - "Miura official TC-201 spec chart — the miuragolf.com/products/tc-201 page (archive.org capture of 17 May 2021) serves its specification tab as an image, tc-201-specs.jpg, still hosted on Miura's own Shopify CDN (cdn.shopify.com/s/files/1/0280/3210/6575/files/tc-201-specs.jpg): lofts 21/23/26/29/33/37/41/46, lies 60.5 to 64.0, face progression 2.5 to 5.0 mm, head weights 245 to 298 g, and lengths 39.00 down to a 35.75-inch PW. The archived page also carries the product copy (progressive sole weighting, constant heel-toe weight, replacement for the CB-1008, complement to the MB-101), the S20C soft carbon steel and satin chrome callouts, and the $300-per-head price."
  - "Note on the PW length: some authorized-dealer reproductions (rocgolf.co.uk, customclubs.eu) list the PW at 35.50 inches, but Miura's own chart and tourshopfresno.com both say 35.75, and 35.75 matches the PW length Miura publishes for the MB-101 and CB-301; the manufacturer figure is recorded here. Face progression is what Miura publishes instead of offset, so the offset key is omitted; bounce and swing weight are not published."
  - "golfwrx.com 'Miura launches new TC-201 iron' and mygolfspy.com 'Miura TC-201 Irons', January 2020 — the 13 January 2020 announcement, successor to the discontinued CB-1008, Tour Cavity positioning between the MB-101 blade and full cavity-backs, and 3-PW availability at $300 per iron"
  - "thegolfwire.com and firstcallgolf.com (11 March 2025) — Miura launches the TC-202 as the TC-201's successor, fixing the discontinuation year at 2025"
