description: >
  The TC-201 ("Tour Cavity") was announced in early 2020 as Miura's shallow
  cavity-back for better players, filling the slot left by the discontinued
  CB-1008 and sitting between the MB-101 muscle-back and the larger CB-301.
  A notched cavity moves weight to heel and toe, and a progressive weight pad
  (thicker in the short irons, thinner in the long irons) shifts centre of
  gravity lower in the long irons and higher in the short irons. Heads are
  hand-forged from S20C soft carbon steel at the Miura factory in Himeji,
  Japan, and sold component-style through authorized dealers and fitters, so
  there is no stock shaft; the lengths below are the standard assembly lengths
  from Miura's own published spec chart, though built lengths vary with the
  order. It was succeeded by the TC-202, announced 11 March 2025.
