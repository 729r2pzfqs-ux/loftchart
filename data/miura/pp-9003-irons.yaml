faq:
  - q: "What is the loft of a Miura PP-9003 7-iron?"
    a: "The Miura PP-9003 7-iron has a loft of 32 degrees and a lie of 61.5 degrees, with about 4.3 mm of offset and a standard-build length of 37 inches."
  - q: "What does Passing Point mean on the Miura PP-9003?"
    a: "It is the Miura family's name for the moments a golfer passes from one stage to the next — the PP-9003 was designed as the 'friendly' Miura, a forged cavity back with a wider sole and real offset for golfers still improving."
  - q: "What is the Miura PP-9003 Straight Neck?"
    a: "A variant with the same lofts, lies and weights but roughly a third less offset (3.8 mm at the 4-iron against the regular model's 5.6), for players who liked the head but not the trajectory help."
  - q: "When was the Miura PP-9003 made?"
    a: "It was introduced worldwide on 1 April 2011 and stayed in the range until around 2019, when Miura's relaunched lineup dropped it without a named successor."
