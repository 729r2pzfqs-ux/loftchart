sources:
  - "Miura Golf official Passing Point specification page (miuragolf.com/passingpoint-PP9003straightneck.asp, archive.org capture of 17 April 2014) — the factory chart for both the 9003 REG and 9003 SN: 4-GW lofts 22/25/28/32/36/40/45/50, lies 60.0-63.5, head weights 250-296 g, face progression, offset in mm (REG: 5.6/5.4/5.1/4.3/4.3/4.3/4.1/3.5, converted to inches here) and bounce 2-13 degrees, plus the Passing Point design philosophy copy."
  - "The Golf Wire / golfshake.com 'Miura Golf Introduces Passing Point 9003 (PP-9003) Forged Cavity-Back Irons' — the worldwide introduction set for 1 April 2011, the 4-PW-plus-GW right-hand range, and the wide-sole, low-CG, high-soft-flight design brief."
  - "GolfWRX 'Review: Miura PP-9003 Straight Neck Irons' — the reduced-offset SN variant and its positioning for players who want less trajectory help."
