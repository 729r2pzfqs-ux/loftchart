description: >
  The Passing Point 9003 was Miura's invitation to golfers who wanted the
  Himeji forged feel without a tour player's precision — the friendliest
  iron the family workshop made. Designed by the Miura sons Shinei and
  Yoshitaka and introduced worldwide on 1 April 2011, it is a forged
  cavity back with perimeter weighting, a wider sole shaped to glide
  through turf, generous offset that flows into the head, and a low
  centre of gravity for a high, soft-landing flight. Lofts are
  traditional — a 32-degree 7-iron and 45-degree pitching wedge across a
  4-GW factory chart. A Straight Neck (PP-9003 SN) variant followed with
  the same lofts and lies but roughly a third less offset, for players
  who did not want the trajectory help. The PP-9003 remained in Miura's
  range through the brand's 2017 change of ownership and left the line
  around the 2019 relaunch of the lineup, with no direct successor named.
  Miura sold heads through dealers and fitters, so the lengths below are
  Miura's standard assembly lengths of the era rather than a factory
  sheet; specs are for the regular (offset) model.
