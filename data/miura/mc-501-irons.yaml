sources:
  - "Miura's official MC-501 spec chart, from the archive.org capture (17 May 2021) of miuragolf.com/products/mc-501-black-qpq — full table for 3-iron through PW: lofts 22/24/27/30/34/38/42/46, lies 59.0 to 62.5 degrees, face progression 1.5 to 4.0 mm, head weights 244 to 294 g, lengths 39.00 to 35.75 inches. Miura publishes face progression in millimetres rather than offset, and no bounce or swing weight, so those keys are omitted."
  - "Tour Shop Fresno (authorized Miura dealer) MC-501 heads page and Usher Golf / chipandputt.com MC-501 dealer table — both independently match every loft, lie and head weight above, including the flat 59.0-to-62.5-degree lie ladder; neither lists lengths, which rest on the archived manufacturer chart."
  - "Miura Golf blog 'Miura Debuts MC-501 Muscle Cavity Irons' — announcement 6 February 2018, retail orders from 20 February 2018 at 260 US dollars per head MAP, 3-PW, premium S25C soft carbon steel in copper-nickel satin, 20 grams repositioned toward the sole and the Y-grind. Note: the launch release specifies S25C, while the later Black QPQ product page listed S20C; S25C is recorded here per the launch spec."
  - "golfwrx.com 2018 PGA Show Demo Day coverage and golfdigest.com 'Miura MC-501 irons reflect a father-and-sons collaboration in what company calls the modern blade' — corroborate the 2018 launch, the muscle-cavity concept and the longest-blade-length claim. year_discontinued 2022 reflects the 15 November 2022 announcement of the successor MC-502."
