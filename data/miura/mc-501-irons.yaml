description: >
  The MC-501 launched Miura's Muscle Cavity line, announced on 6 February
  2018 with retail orders opening 20 February 2018 at 260 US dollars per
  head. Billed by Miura as "the modern blade", it paired a blade-like
  profile with a T-shaped muscle pad low in the back, about 20 grams of
  mass repositioned toward a sole wider than any previous Miura blade, and
  Yoshitaka Miura's Y-grind sole — on the longest heel-to-toe head the
  company had forged to that point. Note that Miura's published lie angles
  for this model are markedly flatter than its later irons: 61 degrees on
  the 7-iron against the 62.5 degrees of the MC-502 that replaced it
  (announced 15 November 2022). Heads came in copper-nickel satin and
  Black QPQ finishes, 3-iron through pitching wedge. Miura sells heads
  through authorized dealers and fitters and builds sets to order, so
  there is no stock shaft; specs below are Miura's published standard.
