faq:
  - q: "What is the loft of a Miura MC-501 7-iron?"
    a: "The Miura MC-501 7-iron has a loft of 34 degrees, a lie of 61 degrees and a length of 37.0 inches, per Miura's published spec chart."
  - q: "What does MC stand for in Miura MC-501?"
    a: "Muscle Cavity. The MC-501 pairs a blade-like profile with a T-shaped muscle pad and about 20 grams of mass moved low into a wider sole, giving slightly more forgiveness than Miura's pure muscle-backs."
  - q: "Is the Miura MC-501 discontinued?"
    a: "Yes. Miura announced its successor, the MC-502, on 15 November 2022, and the MC-501 has left Miura's current line."
  - q: "Why are the Miura MC-501's lie angles so flat?"
    a: "Miura's published spec for the MC-501 runs from 59 degrees on the 3-iron to 62.5 on the pitching wedge — about 1.5 degrees flatter through the set than the MC-502 that replaced it. Since Miura heads are sold through fitters who bend lie to order, the published figure is only the starting point."
