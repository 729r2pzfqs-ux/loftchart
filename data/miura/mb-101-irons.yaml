description: >
  The MB-101 is Miura's flagship muscle-back blade, unveiled on 3 October 2019 as
  the company's first new blade iron since the MB-001 of 2013, with the sole
  width and face thickness reworked from that predecessor and a smoother
  head-to-hosel transition. Each head is hand-forged from S20C
  soft carbon steel at the Miura family factory in Himeji, Japan, with the muscle
  pad redistributed relative to earlier Miura blades to sit more directly behind
  the impact area. Lofts are traditional — a 34-degree 7-iron and a 47-degree
  pitching wedge — across a 3-iron through PW range, and heads are offered in
  Satin Chrome and Black QPQ finishes. Miura sells heads through authorized
  dealers and fitters and builds sets to order from a shaft menu, so there is no
  single stock shaft; specs below are Miura's published men's steel standard.
  A limited Retro edition wearing Miura's original logo was released in August
  2022, and the standard MB-101 remains in the line at 310 dollars per head
  as of mid-2026.
