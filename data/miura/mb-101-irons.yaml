    a: "The Miura MB-101 7-iron has a loft of 34 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "When was the Miura MB-101 released?"
    a: "Miura unveiled the MB-101 on 3 October 2019. It was the company's first new blade iron since 2013 and remains in the line."
  - q: "What clubs come in a Miura MB-101 set?"
    a: "Heads are offered from 3-iron through pitching wedge (47 degrees). Miura sells them through authorized dealers and fitters, who build any composition to order — 4-PW is the most common set."
