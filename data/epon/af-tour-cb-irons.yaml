description: >
  The AF-Tour CB is a forged half-cavity players iron from Epon's Tour line,
  built as a more forgiving companion to the muscle-back AF-Tour - sharing a
  similar loft ladder but carrying more offset - from a single S20C billet
  with a nickel-chrome plated finish. A workshop blog post dated 18 February
  2015 covers a completed AF-Tour CB fitting, and Ginone Golf's custom-order
  catalogue files the model under its 2015 product year, which is earlier
  than some later marketplace descriptions imply. The AF-Tour CB2 succeeded
  it, appearing in Ginone Golf's 2023 product year. Heads are built to order
  with no fixed stock shaft; lengths below are the standard steel assembly
  lengths from the Japanese retail spec chart. Epon's gooseneck/offset figures
  for this model were not found in an accessible source, so the offset key is
  omitted here rather than estimated.
