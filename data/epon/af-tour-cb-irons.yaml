faq:
  - q: "What is the loft of an Epon AF-Tour CB 7-iron?"
    a: "The Epon AF-Tour CB 7-iron has a loft of 34 degrees, a lie of 62 degrees, and a standard steel length of 36.5 inches."
  - q: "How does the AF-Tour CB differ from the Epon AF-Tour?"
    a: "The AF-Tour CB is a half-cavity version of the muscle-back AF-Tour, sharing a similar loft ladder but built with more offset for extra forgiveness."
  - q: "When was the Epon AF-Tour CB released?"
    a: "Around February 2015 - a workshop blog documented a completed custom build that month, and Ginone Golf's catalogue files the model under its 2015 product year."
