description: >
  The AF-705 is a game-improvement iron in Epon's numbered "AF-7xx" distance
  line, forged from an S20C billet with an undercut pocket cavity and
  progressively larger offset than Epon's players and players-distance models
  to add forgiveness and easier launch. It predates the AF-706 that followed
  it - Epon's own AF-706 launch material describes the AF-706 as the brand's
  first hollow-construction iron, which means the AF-705 itself is a
  conventional one-piece forging rather than a hollow-body design. Ginone
  Golf's custom-order catalogue places the AF-705 in its 2017 product year.
  Heads are built to order with no fixed stock shaft; lengths below are the
  standard steel assembly lengths from the Japanese retail spec chart, and
  offsets are converted from the published gooseneck figures in millimetres.
  A 56-degree SW head extends the stock 5-PW set to fill the gap to the sand
  wedge, matching the wedge-extension pattern Epon carried into the AF-706.
