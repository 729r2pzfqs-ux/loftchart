faq:
  - q: "What is the loft of an Epon AF-705 7-iron?"
    a: "The Epon AF-705 7-iron has a loft of 29 degrees, a lie of 62 degrees, and a standard steel length of 37 inches."
  - q: "Is the Epon AF-705 a hollow iron?"
    a: "No. It is a conventional one-piece forged pocket-cavity iron. Epon's own material for the later AF-706 identifies that model, not the AF-705, as the brand's first hollow-construction iron."
  - q: "What wedges match the Epon AF-705 set?"
    a: "Because the pitching wedge is 43 degrees, Epon offered a 49-degree AW and a 56-degree SW in the same head style to complete the set down to the sand wedge."
