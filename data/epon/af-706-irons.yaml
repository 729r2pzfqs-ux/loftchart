description: >
  The AF-706 was Epon's first hollow-construction iron, introduced in spring
  2020 as the strong-lofted distance model in the AF line. A forged SAE8655
  spring-steel face - 1.9 mm at its thinnest - is mated to a forged S20C soft
  carbon body, with lofts starting at a 22-degree 5-iron and running to a
  40-degree pitching wedge, backed by a 45-degree TW (transition wedge), a
  50-degree AW and a 56-degree SW to fill the gap to the sand wedge. The
  AF-706S, announced on 22 January 2022, superseded it with a roughly 3
  percent lower centre of gravity. Heads are built to order with no fixed
  stock shaft; lengths below are the standard steel assembly lengths from the
  Japanese retail spec chart and offsets are converted from the published
  gooseneck figures in millimetres.
