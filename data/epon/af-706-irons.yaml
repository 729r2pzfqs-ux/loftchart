faq:
  - q: "What is the loft of an Epon AF-706 7-iron?"
    a: "The Epon AF-706 7-iron has a loft of 28 degrees, with a 62-degree lie and a 37-inch standard steel length."
  - q: "Is the Epon AF-706 a hollow iron?"
    a: "Yes - it was Epon's first hollow-body iron. A forged SAE8655 spring-steel face, 1.9 mm at its thinnest, is joined to a forged S20C soft carbon steel body."
  - q: "What wedges match the Epon AF-706 set?"
    a: "Because the pitching wedge is only 40 degrees, Epon offered a 45-degree TW, a 50-degree AW and a 56-degree SW in the same head style to complete the set."
