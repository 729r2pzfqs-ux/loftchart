description: >
  The AF-506 is Epon's one-piece forged pocket-cavity players-distance iron.
  Epon's own news release dates the start of sales to 19 February 2021 through
  the Niigata direct store and authorized dealers - some overseas listings
  round this to 2022, when the left-handed AF-506LH followed. The head is
  forged from a single S20C billet and then hollowed with an NC mill to create
  the undercut cavity, giving a sweet area Epon claimed was 27 percent larger
  than the AF-505's while keeping the loft/lie chart of its predecessor, with
  a 31-degree 7-iron. The AF-507 replaced it when announced on 20 April 2024.
  Heads are built to order with no fixed stock shaft; lengths below are the
  standard steel assembly lengths from the Japanese retail spec chart, and
  offsets are converted from Epon's gooseneck figures in millimetres. The
  50-degree AW is a special-order head outside the stock 5-PW set.
