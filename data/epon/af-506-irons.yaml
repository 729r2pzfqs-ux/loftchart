faq:
  - q: "What is the loft of an Epon AF-506 7-iron?"
    a: "The Epon AF-506 7-iron has a loft of 31 degrees, with a 62-degree lie and a 37-inch standard steel length."
  - q: "When did the Epon AF-506 come out?"
    a: "Epon began sales on 19 February 2021 in Japan. It was replaced by the AF-507, announced on 20 April 2024."
  - q: "Is the Epon AF-506 forged?"
    a: "Yes. The head is forged from a single billet of S20C soft carbon steel and the undercut pocket cavity is then NC-milled out of the completed forging - there are no welded pieces."
