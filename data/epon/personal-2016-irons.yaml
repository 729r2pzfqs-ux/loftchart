faq:
  - q: "What is the loft of an Epon Personal 2016 7-iron?"
    a: "The Epon Personal 2016 7-iron has a loft of 34 degrees and a lie of 62 degrees."
  - q: "Is the Epon Personal 2016 a blade?"
    a: "No. Despite being part of a series whose earlier generations were muscle backs, the 2016 edition was Epon's first pocket-cavity Personal iron - a compact players design, not a blade."
  - q: "How many Epon Personal 2016 sets were made?"
    a: "Roughly 800 to 850 sets, sold direct through Epon's Niigata store and authorized fitters starting 24 August 2016, priced around 27,000 yen per club."
