description: >
  Personal 2016 is the third generation of Epon's limited-edition "Personal"
  iron, released 24 August 2016 in a run of roughly 800-850 sets sold direct
  through Epon's Niigata store and authorized fitters. Unlike the first two
  Personal generations, which were muscle backs, this third generation moved
  to a pocket-cavity design - Epon's own launch copy and independent retailer
  coverage both describe it as the series' first pocket cavity - positioned
  between the AF-303 and AF-503 in Epon's own line, with a black IP-plated
  finish. Note this corrects an initial "blade" categorization: with a milled
  pocket cavity it is more accurately a compact players iron, not a blade.
  Standard steel assembly lengths were not found in an accessible source for
  this specific edition, so the 4-PW ladder here follows the same 0.5-inch
  per-club steel-length convention documented for the contemporaneous Epon
  AF-306 (also a 4-PW, players-category, Endo-forged set); this is a disclosed
  inference rather than a directly sourced figure. The "grind" figures Epon
  published for this model (converted to inches below) sit in the same 2-4 mm
  range as the gooseneck/offset figures on Epon's other forged models and are
  treated as offset here.
