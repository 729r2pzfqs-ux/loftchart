description: >
  The AF-302 is a one-piece forged cavity-back players iron from Epon, the
  house brand of Endo Manufacturing in Tsubame, Niigata. It inherits the AF-301's
  form with a refined centre-of-gravity flow between clubs and a thicker back
  section for a soft, near-muscle-back feel despite the cavity, over an S20C
  soft-iron billet forged to roughly HRB80 hardness and nickel-chrome plated. A
  Japanese equipment review dated December 2009 already covers the model and
  Ginone Golf's custom-order catalogue files it under its 2010 product line, so
  year_introduced here is 2010 - notably earlier than some marketplace listings
  imply. Lengths are inferred from the standard steel assembly-length ladder
  shared by Epon's AF-Tour CB, the model that succeeded the AF-302/AF-303 line
  in the "compact cavity" niche, anchored to an independently confirmed 7-iron
  length of 36.5 inches.
