faq:
  - q: "What is the loft of an Epon AF-302 7-iron?"
    a: "The Epon AF-302 7-iron has a loft of 34 degrees, a lie of 62 degrees, and a standard steel length of 36.5 inches."
  - q: "When was the Epon AF-302 released?"
    a: "Around 2010. A Japanese equipment review already covered the AF-302 in December 2009, and Ginone Golf's custom-order catalogue files it under its 2010 product year, making it a considerably older design than some marketplace listings suggest."
  - q: "Is the Epon AF-302 a blade or a cavity back?"
    a: "It is a one-piece forged cavity back built to feel like a muscle back - a thicker back section and low centre of gravity give it a soft, blade-like feel despite the cavity design."
