description: >
  The AF-306 is Epon's compact deep-cavity players iron, released on 26 March
  2022 to mark the 45th anniversary of the Epon golf brand. Epon is the house
  label of Endo Manufacturing in Tsubame, Niigata, and the head is forged as
  one piece from S20C soft carbon steel with a tungsten weight forged into the
  toe side - 33 percent more tungsten than the preceding AF-305, with a 10
  percent narrower sole and a fractionally shorter head. Lofts are traditional
  for the category, with a 32-degree 7-iron and 46-degree pitching wedge.
  Epon sells heads through its Niigata direct store and authorized fitters,
  built to order with no fixed stock shaft; the lengths below are the standard
  steel assembly lengths from the Japanese retail spec chart, and offsets are
  converted from Epon's published gooseneck figures in millimetres.
