faq:
  - q: "What is the loft of an Epon AF-306 7-iron?"
    a: "The Epon AF-306 7-iron has a loft of 32 degrees, with a 62-degree lie and a 36.75-inch standard steel length."
  - q: "Who makes Epon AF-306 irons?"
    a: "Epon is the house brand of Endo Manufacturing in Tsubame, Niigata, Japan - a forging house that has also made heads for many major OEMs. The AF-306 is forged in-house from S20C carbon steel with a tungsten weight forged into the toe."
  - q: "Is the Epon AF-306 a blade?"
    a: "No. It is a compact deep-cavity players iron. The one-piece forging carries a tungsten inner weight on the toe side to raise the moment of inertia while keeping a compact, minimal-offset profile."
