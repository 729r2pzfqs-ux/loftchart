faq:
  - q: "What is the loft of an Epon AF-307 7-iron?"
    a: "The Epon AF-307 7-iron has a loft of 32 degrees, with a 62-degree lie and a 37-inch length in the N.S.PRO MODUS3 TOUR 105 steel build."
  - q: "How do the Epon AF-307 lofts differ from the AF-306?"
    a: "The 4-iron through 8-iron are the same, from 23 to 36 degrees. The AF-307 9-iron is 40 degrees against 41, and the pitching wedge is 45 degrees against 46. Lies and offsets are unchanged."
  - q: "When was the Epon AF-307 released?"
    a: "Epon announced it on 31 January 2025 and put it on sale on 21 February 2025 through its Niigata direct store and authorised dealers."
  - q: "Is the Epon AF-307 forged?"
    a: "Yes. It is forged from S20C carbon steel, with tungsten weights on the toe and neck sides of the head."
