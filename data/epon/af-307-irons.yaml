description: >
  The AF-307 is Epon's compact forged cavity back, announced on 31 January
  2025 and on sale from 21 February 2025 as the replacement for the AF-306.
  Epon is the house label of Endo Manufacturing in Tsubame, Niigata. The head
  is forged from S20C carbon steel with tungsten placed on both the toe side
  and the neck side, which Epon says raises the moment of inertia while
  shortening the centre-of-gravity distance for easier face rotation; the
  face is taller than before and the blade is shaped to look lower at the
  neck. Against the AF-306 the 9-iron and pitching wedge are one degree
  stronger, at 40 and 45 degrees, with the 4- through 8-irons unchanged. The
  figures below are Epon's own chart for the N.S.PRO MODUS3 TOUR 105 (S)
  steel build; offsets are converted from Epon's millimetre figures.
length_note: >
  Epon states that club length is measured by the 60-degree method. The
  lengths here are Epon's own published figures; the AF-306 page on this site
  uses a Japanese dealer's assembly lengths, which run a quarter-inch shorter,
  so the two charts are not directly comparable.
