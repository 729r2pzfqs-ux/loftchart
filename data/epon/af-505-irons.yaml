description: >
  The AF-505 is Epon's one-piece forged pocket-cavity players-distance iron
  that preceded the AF-506, built from an S20C billet with the thinnest face
  of any one-piece forging in the line at the time - about 2 millimetres,
  roughly the thickness of a nickel - to combine forged feel with distance
  and forgiveness while carrying over the AF-503's loft/lie chart essentially
  unchanged. Epon's own AF-506 launch material describes that model as
  "keeping the loft/lie chart of its predecessor," which is the AF-505 -
  confirmed here by an identical 22-50 degree loft ladder across both models.
  Ginone Golf's custom-order catalogue places the AF-505 in its 2018 product
  year, roughly a year earlier than some marketplace descriptions suggest; the
  AF-506 succeeded it when Epon announced that model on 19 February 2021.
  Heads are built to order with no fixed stock shaft; lengths below are the
  standard steel assembly lengths from the Japanese retail spec chart, and
  offsets are converted from Epon's published gooseneck figures in millimetres.
