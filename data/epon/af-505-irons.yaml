faq:
  - q: "What is the loft of an Epon AF-505 7-iron?"
    a: "The Epon AF-505 7-iron has a loft of 31 degrees, a lie of 62 degrees, and a standard steel length of 36.75 inches."
  - q: "What replaced the Epon AF-505?"
    a: "The Epon AF-506, announced on 19 February 2021, replaced the AF-505 while explicitly carrying over its loft and lie chart."
  - q: "How thin is the face on the Epon AF-505?"
    a: "About 2 millimetres - roughly the thickness of a nickel - the thinnest face of any one-piece forged iron in Epon's line at the time, intended to blend forged feel with super-game-improvement-level ball speed."
