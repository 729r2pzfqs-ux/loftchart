description: >
  The CB24 is the cavity-back half of Bettinardi's first-generation iron line,
  announced in March 2024 alongside the MB24 muscleback after prototypes
  surfaced on the PGA Tour at the Arnold Palmer Invitational. The head is
  co-forged in one piece from 1025 carbon steel with high-density tungsten and
  military-grade ceramic matrix composite placed inside the body, shifting the
  centre of gravity progressively through the set — lower in the long irons for
  launch, higher in the scoring irons for spin control — and the cavity carries
  Bettinardi's signature honeycomb milling. Lofts are traditional, with a
  33-degree 7-iron and 45-degree pitching wedge, and the ladder is identical to
  the MB24's so the two blend into combo sets; Bettinardi's suggested split runs
  CB24 4-6 into MB24 7-PW. Sold as a 4-PW set (right- or left-handed) for
  $1,200 through bettinardi.com and authorised fitters, with around two dozen
  shaft options rather than a single stock build, which is why no stock shaft
  is recorded. 2025 added Oil Rubbed Bronze and Black Rainbow PVD finishes on
  the same head and specs.
