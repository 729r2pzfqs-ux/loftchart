faq:
  - q: "What is the loft of a Bettinardi CB24 7-iron?"
    a: "The Bettinardi CB24 7-iron has a loft of 33 degrees, a lie of 62.5 degrees and a length of 37 inches."
  - q: "Can the Bettinardi CB24 be combined with the MB24?"
    a: "Yes. The two models share an identical loft, lie and length ladder, so they blend without bending. Bettinardi's recommended combo runs the CB24 in the 4- through 6-irons and the MB24 from 7-iron to pitching wedge."
  - q: "How much do Bettinardi CB24 irons cost?"
    a: "The 4-PW set lists at $1,200 through bettinardi.com and authorised Bettinardi fitters, with around 24 shaft and 18 grip options configured at fitting rather than a single stock build."
  - q: "Are the CB24 irons Bettinardi's first irons?"
    a: "Yes. The putter maker entered the iron category for the first time in March 2024 with the CB24 cavity back and MB24 muscleback, after prototypes were spotted on the PGA Tour."
