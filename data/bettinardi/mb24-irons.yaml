faq:
  - q: "What is the loft of a Bettinardi MB24 7-iron?"
    a: "The Bettinardi MB24 7-iron has a loft of 33 degrees, a lie of 62.5 degrees and a length of 37 inches."
  - q: "Are the MB24 and CB24 lofts the same?"
    a: "Yes — Bettinardi published one identical loft, lie and length ladder for both models so they can be mixed into a combo set without bending, typically CB24 in the long irons and MB24 from the 7-iron down."
  - q: "Is the Bettinardi MB24 a true blade?"
    a: "It is a muscleback with a thin topline and compact shape, but not a one-material blade: tungsten and ceramic matrix composite are co-forged into the 1025 carbon steel body to move the centre of gravity by loft, which Bettinardi calls a differential muscleback."
  - q: "When did the Bettinardi MB24 come out?"
    a: "Bettinardi announced its first-generation irons in March 2024, with pre-orders from 26 March 2024. They were the company's first irons in its history."
