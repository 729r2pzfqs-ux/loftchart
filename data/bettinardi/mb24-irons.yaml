description: >
  The MB24 is the muscleback in Bettinardi's first-generation iron line,
  announced in March 2024 alongside the CB24 cavity back — the putter maker's
  first move into irons. The thin-topline head is co-forged in one piece from
  1025 carbon steel, with high-density tungsten and military-grade ceramic
  matrix composite set into a "differential muscleback" whose centre of gravity
  shifts progressively through the set, and the rear muscle carries Bettinardi's
  honeycomb milling. Lofts are traditional — a 33-degree 7-iron and 45-degree
  pitching wedge — and deliberately identical to the CB24's so the two blend
  into combo sets; Bettinardi suggests CB24 long irons into MB24 scoring clubs.
  Sold right-handed as a 4-PW set for $1,200 through bettinardi.com and
  authorised fitters, configured from a large shaft menu rather than one stock
  build, which is why no stock shaft is recorded. 2025 added Oil Rubbed Bronze
  and Black Rainbow PVD finishes on the same head and specs.
