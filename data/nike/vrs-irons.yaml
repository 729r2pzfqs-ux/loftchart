faq:
  - q: "What is the loft of a Nike VR_S 7-iron?"
    a: "The Nike VR_S 7-iron has a loft of 31 degrees, with a 63-degree lie and a 37.5-inch steel-shaft length."
  - q: "What is NexCOR on the Nike VR_S irons?"
    a: "NexCOR is Nike's variable-thickness face design, first used on the 2012 VR_S line. The face is thinner in some zones so more of it flexes at impact, raising ball speed on strikes across the face."
  - q: "What clubs come in a stock Nike VR_S iron set?"
    a: "The stock set is 4-iron through pitching wedge plus a 48-degree approach wedge."
