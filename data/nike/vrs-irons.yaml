description: >
  The VR_S was Nike's 2012 distance iron, the first iron to carry the NexCOR
  variable-thickness face that Nike introduced across the VR_S metalwoods and
  irons that season. A PowerBow undercut moves weight low and deep behind the
  face for a high launch, on a wide-soled cast head with a deep pocket
  cavity. Lofts are moderately strong for the period - a 31-degree 7-iron
  and a 44-degree pitching wedge - and the lies run about a degree more
  upright than Nike's players irons of the same era. The stock set is 4-iron
  through approach wedge; figures below are the standard men's steel
  specification.
