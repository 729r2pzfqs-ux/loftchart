description: >
  The Pro Combo OS is the oversized, forgiving half of the 2005 split of Nike's
  original Forged Pro Combo line, sold alongside the better-player Pro Combo Tour.
  Like the original it is a progressive set forged from soft 1030 carbon steel: the
  long irons carry a deep undercut cavity with a low centre of gravity, the mid
  irons a full cavity back, and the short irons a muscle-cavity with a higher
  centre of gravity for control. The heads are larger than the Tour version with a
  wider sole and progressive offset. Stock shafts were Nike's Speed Step steel with
  Tour Velvet-style grips. The per-club figures below are the traditional Nike
  loft/lie/length ladder shared across the Pro Combo family; period sources confirm
  individual points on that ladder for the OS (43-degree 9-iron, 35-degree 7-iron)
  but no complete manufacturer chart for the OS specifically has survived, so treat
  the numbers as the family-standard specification rather than an OS-specific sheet.
