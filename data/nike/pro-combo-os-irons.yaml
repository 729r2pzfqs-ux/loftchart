faq:
  - q: "What is the loft of a Nike Pro Combo OS 7-iron?"
    a: "The Nike Pro Combo OS 7-iron is listed at 35 degrees on the Pro Combo family spec ladder, with a 62.5-degree lie and 37-inch steel length."
  - q: "What is the difference between the Nike Pro Combo OS and Pro Combo Tour?"
    a: "Both are 2005 successors to the original Forged Pro Combo. The Tour kept compact better-player heads, while the OS used larger heads with a wider sole, more offset and a deeper undercut cavity in the long irons for extra forgiveness."
  - q: "What construction does the Nike Pro Combo OS use?"
    a: "It is forged from 1030 carbon steel as a progressive set: deep undercut-cavity long irons, full cavity-back mid irons and muscle-cavity short irons, so forgiveness is concentrated where it is needed most."
