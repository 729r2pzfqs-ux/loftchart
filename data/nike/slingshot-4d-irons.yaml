description: >
  The Slingshot 4D was the final generation of Nike's Slingshot family, named
  for four design elements that change progressively through the set: the
  position of the rear Slingback bridge, the sole width, the degree of offset
  and the overall head profile. Long irons get a wider sole and a lower,
  deeper Slingback for launch, while the short irons tighten up for control.
  Lofts carry over from the 2007 Slingshot, with a 34-degree 7-iron and a
  46-degree pitching wedge. The stock set is 4-iron through pitching wedge
  with approach and 55-degree sand wedges available; figures below are the
  standard men's steel specification (women's builds run one inch shorter).
