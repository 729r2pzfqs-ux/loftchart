faq:
  - q: "What is the loft of a Nike Slingshot 4D 7-iron?"
    a: "The Nike Slingshot 4D 7-iron has a loft of 34 degrees, with a lie around 63.5 degrees and a 37.25-inch steel-shaft length."
  - q: "What does 4D mean on the Nike Slingshot 4D irons?"
    a: "It refers to four design elements that change progressively through the set: the position of the rear Slingback bridge, the sole width, the amount of offset and the overall clubhead profile."
  - q: "What clubs come in a stock Nike Slingshot 4D set?"
    a: "The stock set is 4-iron through pitching wedge, with an approach wedge and a 55-degree sand wedge available to complete the set."
