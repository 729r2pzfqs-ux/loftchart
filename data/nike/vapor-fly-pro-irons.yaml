description: >
  The Vapor Fly Pro is the compact better-player model in Nike's final 2016 iron
  family, sold alongside the game-improvement Vapor Fly until Nike exited club
  manufacturing in August 2016. The taller, more compact head runs a hollow
  cavity in the 2- through 5-irons, an RZN-filled pocket in the 6- through
  8-irons and a full RZN cavity in the short irons. Its loft ladder is the same
  as the standard Vapor Fly's — a 32-degree 7-iron and 44-degree pitching wedge,
  strong for a compact iron of the period — with the difference coming in the
  smaller head, thinner topline and less offset, plus a set that extends up to a
  17-degree 2-iron. The set listed here is 2-iron through pitching wedge plus a
  49-degree A-wedge. Offset, bounce and swing weight figures were published only
  by a single secondary source and are omitted rather than repeated unverified.
