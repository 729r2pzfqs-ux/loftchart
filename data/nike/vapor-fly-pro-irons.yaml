faq:
  - q: "What is the loft of a Nike Vapor Fly Pro 7-iron?"
    a: "The Nike Vapor Fly Pro 7-iron has a loft of 32 degrees, with a 62.5-degree lie and a 37.75-inch steel-shaft length."
  - q: "What is the difference between the Nike Vapor Fly and Vapor Fly Pro?"
    a: "They share the same loft ladder, including a 32-degree 7-iron. The Vapor Fly Pro uses a more compact head with a thinner topline and less offset for better players, and its set extends up to a 17-degree 2-iron, while the standard Vapor Fly is the larger game-improvement model."
  - q: "Were the Nike Vapor Fly Pro irons Nike's last players iron?"
    a: "Effectively yes. The 2016 Vapor Fly family was Nike's final iron line; the company announced its exit from club manufacturing in August 2016."
