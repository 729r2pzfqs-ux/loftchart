faq:
  - q: "What is the loft of a Nike VR_S Covert 2.0 7-iron?"
    a: "The Nike VR_S Covert 2.0 7-iron has a loft of 31 degrees, with a 62-degree lie and a 37.5-inch steel-shaft length."
  - q: "What changed between the Nike VR_S Covert and Covert 2.0 irons?"
    a: "The lofts stayed the same - a 31-degree 7-iron and 44-degree pitching wedge - but the 2.0 reshaped the sole, revised the undercut cavity and cosmetics, and switched the stock steel shaft to the True Temper Dynalite 105."
  - q: "What clubs come in a stock Nike VR_S Covert 2.0 set?"
    a: "The stock set is 4-iron through pitching wedge plus a 48-degree approach wedge, with an 18-degree 3-iron available as an add-on."
