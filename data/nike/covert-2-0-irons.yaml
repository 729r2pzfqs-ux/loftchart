description: >
  The VR_S Covert 2.0 was the second-generation Covert iron, launched with the
  Covert 2.0 metalwoods for the 2014 season. It keeps the deep undercut
  cavity and thin high-strength face of the original Covert but with a
  reshaped sole and revised cosmetics. Lofts are identical to the first
  Covert - a 31-degree 7-iron and a 44-degree pitching wedge - and the offset
  remains generous, tapering from 0.193 inches at the 4-iron to 0.051 inches
  in the approach wedge. The stock set is 4-iron through approach wedge with
  a 3-iron available; figures below are the standard men's steel
  specification (graphite builds are about a quarter inch longer).
