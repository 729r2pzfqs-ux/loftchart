description: >
  The CCi Forged was announced in 2006 as the better-player half of a two-iron
  split that took over from the Forged Pro Combo/Pro Combo Tour, arriving
  alongside the more forgiving cast CCi (successor to the Pro Combo OS). "CCi"
  is Nike's name for a Composite Cavity Insert - a tungsten-and-composite bar
  running heel to toe low on the back of the head, intended to lower the
  center of gravity without the thick topline or heavy offset of a full
  cavity back. The heads are forged from soft 1025 carbon steel with a
  CNC-milled face, and reviewers described the result as closer to a
  muscleback than a cavity back, with a thin topline and minimal offset.
  Lofts are traditional for the mid-2000s, from an individually sold
  18-degree 2-iron down to a 47-degree pitching wedge, and Nike replaced the
  model in 2008 with the Victory Red Forged Split Cavity.
