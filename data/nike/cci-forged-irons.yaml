faq:
  - q: "What is the loft of a Nike CCi Forged 7-iron?"
    a: "The Nike CCi Forged 7-iron has a loft of 35 degrees, with 6 degrees of bounce and 0.095 inches of offset - a traditional, low-offset spec aimed at better players."
  - q: "What does CCi stand for on Nike's CCi Forged irons?"
    a: "CCi stands for Composite Cavity Insert - a tungsten-and-composite bar Nike ran low across the back of the head, from heel to toe, to lower the center of gravity while keeping a thin topline and minimal offset more typical of a muscleback blade."
  - q: "What is the Nike CCi Forged made of?"
    a: "The heads are forged from soft 1025 carbon steel with a CNC-milled face, paired stock with True Temper Dynamic Gold steel shafts and Golf Pride Tour Velvet ribbed grips."
  - q: "What replaced the Nike CCi Forged irons?"
    a: "Nike announced the Victory Red line in August 2008, and the Victory Red Forged Split Cavity took over the CCi Forged's role as Nike's better-player forged cavity iron at retail that November."
