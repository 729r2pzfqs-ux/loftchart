sources:
  - "The Sand Trap, 'Nike CCi Forged Irons Review' by Jeff Smith (thesandtrap.com/b/clubs/nike_cci_forged_irons_review), published 11 May 2007 - the primary source for the numeric ladder: a full club/loft/bounce/offset table for the 2-iron through PW (2I 18deg/1deg/.170in down to PW 47deg/9deg/.080in), confirms the 1025 carbon steel forging, CNC-milled face, stock Dynamic Gold steel shafts in R/S/X with Golf Pride Tour Velvet ribbed grips, and describes the head as 'more muscleback than cavity-back'. No lie or length figures are given in this source and none were found elsewhere specific to this model, so lie/length are omitted here rather than guessed."
  - "golfonline.co.uk Nike CCi Forged Irons product page - corroborates the Composite Cavity Insert Technology name, 1025 carbon steel forging and CNC-milled face, lists Stephen Ames, K.J. Choi, Stewart Cink and Paul Casey as playing them, and carries the marketing line 'Nike Golf Irons won more PGA Tour events in 2005 and 2006 than any other brand' - consistent with a 2006 introduction/announcement even though most retail reviews are dated 2007 (the usual model-year lag also seen in this repo's other Nike files)."
  - "GolfWRX thread title 'Nike Pro Combo Forged Vs. Nike CCI Forged' and user comparisons therein describe the CCi Forged as the direct next-generation model after the Pro Combo Tour/Forged Pro Combo, softer-feeling than its predecessor - the basis for predecessor 'Nike Pro Combo Tour' here, consistent with this repository's forged-pro-combo-irons.yaml (successor: Nike Pro Combo Tour) and pro-combo-os-irons.yaml (which already lists 'nike/cci-forged-irons' as its 2006 replacement)."
  - "The Golf Wire, 'Nike Golf Introduces Series of Victory Red Irons...' (thegolfwire.com/134867-2) - announced 25 August 2008, retail 1 November 2008; the Victory Red Forged Split Cavity (1025 forged carbon steel, CNC-milled face, split-back players cavity) took over the CCi Forged's slot as Nike's better-player forged iron, corroborated by The Hackers Paradise's Victory Red Forged Split Cavity review and by golfbluebook.com's CCi Forged trade-in page describing it as a superseded model - the basis for year_discontinued 2008 and the successor field."
  - "Confidence is medium: the loft/bounce/offset ladder is precise and comes from a single detailed contemporary review rather than a manufacturer chart or a spec aggregator (equip2golf/golfclubspec have no CCi Forged-specific page), and no lie or length figures could be corroborated for this model specifically."
