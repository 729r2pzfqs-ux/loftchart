sources:
  - "Confidence note up front: this is a genuinely obscure, thinly-documented budget SKU. No Nike catalog page, press release or archived Nike-hosted spec chart could be found for the Ignite IRON (as opposed to the well-documented Ignite DRIVER/fairway-wood family). Every number below rests on secondary/retailer sources, several of which look like they may have reused another Nike model's numbers, so treat the loft/lie table as indicative rather than certified."
  - "livestrongbay.blogspot.com 'Nike Ignite Irons Degree Specifications' — the only retrieved per-club loft/lie table, supplying every value in specs above (3-hybrid through sand wedge). IMPORTANT CAVEAT: this loft/lie progression is identical, club for club, to data/nike/slingshot-irons.yaml's chart (18/58.5 for the 2-iron this set omits, then 20/59.5, 23/60.5, 26/61.5, 30/62.5, 34/63, 38/63.5, 42/64, 46/64.5 for 3H through PW) except the sand wedge, which this source gives as 54 degrees vs Slingshot's 55. That could mean Nike genuinely reused one cast loft/lie ladder across its 2003-06 entry-level iron families, or it could mean this content-mill page copied the Slingshot table and relabeled it Ignite. No second, independent source was found to separate the two possibilities, which is the main reason confidence is low."
  - "2ndswing.com 'Nike Ignite Iron Set' product page — cast construction, 'deep undercut and large amount of offset', configurations sold as 4-PW, 4-PW+AW and 3H-PW, steel or graphite shafts (True Temper Ignite and Nike-branded UST-family steel, plus graphite), Uniflex/Regular flex options."
  - "golfavenue.com 'Nike Ignite Iron Set' and golflink.com 'Nike Ignite Hybrid Iron Set' reviews — corroborate the 4-PW-plus-3-hybrid set composition, wide sole, deep cavity and beginner/high-handicap market positioning; both note the line is long discontinued."
  - "southamptongolfclub.com Ignite review and zipgolfer.com 'Nike Ignite 2 Irons Set' listing, plus GolfWRX forum thread titles ('Nike Ignite-3 Irons', 'nike ignite 2 irons', 'Nike Ignite Steel Irons', 'Nike Ignite - Previous Model Year Reviews') — establish that Ignite ran as a multi-generation budget franchise (Ignite, Ignite 2, Ignite 3) into the later 2000s/early 2010s, with GolfWRX posters repeatedly noting how little official documentation exists for any generation. This is the basis for successor: Nike Ignite 2 and for the description's note on thin marketing."
  - "Year is the weakest-sourced field. This task's brief assumed a 2005 announcement, but no source found actually supports 2005 for the IRONS specifically — the only 2003-2005 Wayback Machine (web.archive.org CDX index of nike.com/nikegolf) captures of any 'ignite' path are for the Ignite 410cc/460cc drivers and the Ignite T60 fairway wood (plus a December 2003 driver press release, article 120903_pr_ignite.xml); no clubs/irons page or dedicated iron spec chart under the Ignite name appears in any capture through 2009. swingyard.com's 'Nike Irons By Year' table instead places Ignite in 2006, grouped with Nike CCi Forged and Slingshot OSS — and this repository's own independently-sourced files for those two models (data/nike/cci-forged-irons.yaml, data/nike/slingshot-oss-irons.yaml) both give year_introduced: 2006, which corroborates 2006 as the more likely year for a coordinated Nike Golf iron refresh. year_introduced is set to 2006 on that basis, overriding the brief's 2005 assumption; year_discontinued is left null because no source dates the end of the original (Ignite 1) run before Ignite 2 arrived."
  - "No source gives club length, offset or bounce for any Ignite iron, so those keys are omitted rather than estimated."
