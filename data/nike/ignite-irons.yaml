faq:
  - q: "What is the loft of a Nike Ignite 7-iron?"
    a: "The one spec table located for this model lists the Ignite 7-iron at 34 degrees with a 63-degree lie. That figure is not independently corroborated and matches the Nike Slingshot's 7-iron exactly, so it should be treated as indicative rather than certified."
  - q: "What clubs came in a stock Nike Ignite set?"
    a: "Retailer listings describe a 4-iron through pitching wedge set with a 3-hybrid (3H) in place of a traditional 3-iron, with a sand wedge and sometimes an approach wedge available as add-ons."
  - q: "When did the Nike Ignite irons come out, and how do they relate to Ignite 2 and Ignite 3?"
    a: "The exact year is poorly documented. Secondary sources point to 2006, the same year Nike refreshed its Slingshot OSS and CCi Forged irons. Ignite continued as a running budget franchise, with Ignite 2 and later Ignite 3 following as successive generations, each with little dedicated marketing."
  - q: "Where did the Nike Ignite sit in Nike's iron lineup?"
    a: "Below the Slingshot, which got a dedicated marketing mini-site and Golf Digest Hot List recognition. The Ignite was Nike's lower-price, more basic game-improvement offering aimed at beginners and high-handicap players."
