description: >
  The Ignite was Nike's value-tier game-improvement iron, sold alongside and below the
  more heavily marketed Slingshot line: a cast cavity-back head with a deep undercut,
  wide sole and pronounced offset aimed at beginners and high-handicap players rather
  than the Slingshot's broader mid-market pitch. The stock set replaced the traditional
  3-iron with a 3-hybrid (labelled 3H) ahead of 4-iron through pitching wedge, with a
  sand wedge and, on some listings, an approach wedge sold as add-ons. Nike ran the name
  as a multi-year budget franchise — Ignite, then Ignite 2 and Ignite 3 — each generation
  getting little independent marketing, which is why retailer and forum documentation is
  thin compared with Nike's flagship iron lines of the same years.
