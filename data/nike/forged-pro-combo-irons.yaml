description: >
  The Forged Pro Combo was Nike's first combo iron set, arriving in the
  company's opening seasons as a clubmaker and establishing the template its
  later Pro Combo and VR Pro Combo sets followed: full cavity-back 3- and
  4-irons with a low, deep centre of gravity, muscle-cavity 5- through
  7-irons, and bladed 8-iron through pitching wedge for feel and shot
  making. Lofts are fully traditional, with a 35-degree 7-iron and a
  47-degree pitching wedge. It is commonly catalogued as a 2003 model;
  year_introduced records the 2002 debut per the repository convention. In
  2005 Nike split the line into the Pro Combo Tour and Pro Combo OS.
  Figures below are the standard men's steel specification (graphite builds
  half an inch longer).
