faq:
  - q: "What is the loft of a Nike Forged Pro Combo 7-iron?"
    a: "The Nike Forged Pro Combo 7-iron has a loft of 35 degrees, with a 62.5-degree lie and a 37-inch steel-shaft length."
  - q: "Are the Nike Forged Pro Combo irons blades?"
    a: "Only the short irons. The 3- and 4-irons are full cavity backs, the 5- through 7-irons use a muscle cavity, and the 8-iron through pitching wedge are blades - the combo construction the set is named for."
  - q: "When did the Nike Forged Pro Combo irons come out?"
    a: "Nike debuted the set in 2002, within its first seasons of making clubs, and it is usually catalogued as a 2003 model. The identical loft ladder returned on the 2011 VR Pro Combo, and in 2005 the line split into the Pro Combo Tour and Pro Combo OS."
