description: >
  NDS stands for Nike Distance Series, an affordable game-improvement iron aimed at
  beginners and mid-to-high-handicap golfers rather than better players. The cast 431
  stainless steel body is notably softer than typical 17-4 cast stainless for extra feel,
  and a notch cut into the back cavity concentrates weight toward the heel and toe; the
  notch is wider in the long irons for maximum forgiveness and narrows through the short
  irons to raise the center of gravity for more workability. A low, deep CG and
  progressive offset (heaviest in the long irons) are built in to help get the ball
  airborne and reduce fat shots. Lofts are moderately strong for a game-improvement set of
  its era, with a 35-degree 7-iron; the standard men's set runs 3-iron through pitching
  wedge with a matching sand wedge available.
