sources:
  - "equip2golf.com 'Nike NDS Driver Review' (irons section) — confirms NDS as a game-improvement iron aimed at beginners/high handicappers, the 431 stainless steel body ('25% softer than 17-4 stainless'), the notch weight progression system (wider notch/more heel-toe weighting in long irons, narrower and higher-CG in short irons), a men's 3-PW set and women's 4-SW set in right and left hand, stock True Temper NDS steel (Uniflex) and Fujikura NDS graphite (S/R/Women's/Senior) shafts, and launch pricing ($479 steel / $599 graphite)"
  - "southamptongolfclub.com 'Nike NDS Irons Review' — independently confirms the cast 431 stainless steel cavity-back construction, perimeter weight ports in heel and toe, progressive offset and sole width, and gives a loft/lie table for the 3-iron through 9-iron (21/59.5, 24/60.5, 27/61.5, 31/62.5, 35/63, 39/63.5, 43/64) that matches the fuller table below exactly on every row it covers"
  - "TheSandTrap.com forum thread 'Lie angle' (post by user Sacman, 5 May 2012, comparing his then-seven-year-old Nike NDS irons to new Mizuno MP-53s) — supplies the complete loft/lie/length ladder used in specs above, 3-iron through sand wedge (3: 21/59.5/39, 4: 24/60.5/38.5, 5: 27/61.5/38, 6: 31/62.5/37.5, 7: 35/63/37, 8: 39/63.5/36.5, 9: 43/64/36, PW: 47/64.5/35.75, SW: 55/65/35.5); no catalog/chart attribution was given in the post, so treat the length column as secondary to the independently corroborated loft/lie figures above. Individual pre-owned club listings on golfroots.com and 2ndswing.com show real-world lengths that are close but not identical (3-iron 38.75in, 4-iron 38.0in, 8-iron 36.75in, PW 35.5in, uniflex steel) — the discrepancy of roughly a quarter to half an inch per club versus the forum chart is noted but unresolved, likely reflecting either a different measurement convention or normal used-club variance"
  - "golf-shack.blogspot.com 'Nike NDS Irons Review' (Feb 2011) and golfmonthly.com 'Nike NDS' review — both independently confirm the True Temper Uniflex stock steel shaft, cavity-back/notch design, and 35-degree 7-iron loft; golfmonthly gives UK launch pricing of GBP 349 (steel) / GBP 429 (graphite)"
  - "golfbluebook.com 'Nike NDS' research page states Year Introduced 2007 and repeats the 431-stainless/low-deep-CG/progressive-offset description and $479 MSRP; pitchmarks.com 'Nike Irons By Year' timeline independently places NDS in 2007 alongside the CCI Cast, CCI Forged and SQ Sumo irons. A competing fan-made timeline (swingyard.com) instead places NDS in 2004, and one Golf Monthly page's extracted metadata suggested 2004 as well; year_introduced 2007 is used per the two more specific/structured sources and the brief's stated announcement year, but the 2004 alternative could not be fully ruled out"
  - "No predecessor or successor could be confirmed with confidence: equip2golf's review references the earlier Nike Slingshot only as a general point of comparison, not a stated lineage, and no source states which model directly replaced NDS in Nike's cast game-improvement tier, so both fields are left null"
  - "Confidence is medium: the model's identity (Nike Distance Series), material, construction concept and 3-iron-through-9-iron loft/lie figures are corroborated across multiple independent sources, but the full spec table's length column and the PW/SW rows rest on a single uncorroborated forum repost of what looks like a manufacturer chart, and the exact introduction year has one dissenting source"
faq:
  - q: "What is the loft of a Nike NDS 7-iron?"
    a: "The Nike NDS 7-iron has a loft of 35 degrees, a 63-degree lie angle, and a 37-inch steel-shaft length."
  - q: "What does NDS stand for on Nike irons?"
    a: "NDS stands for Nike Distance Series, an affordable game-improvement iron line Nike introduced in 2007 aimed at beginners and mid-to-high-handicap golfers."
  - q: "What are Nike NDS irons made of?"
    a: "The heads are cast from 431 stainless steel, which Nike marketed as roughly 25 percent softer than the 17-4 stainless steel used in most cast iron heads, intended to give a softer feel while keeping manufacturing costs down."
  - q: "What clubs came in a stock Nike NDS iron set?"
    a: "The standard men's set ran 3-iron through pitching wedge, with a matching 55-degree sand wedge available, in either stock True Temper NDS steel (Uniflex) or Fujikura NDS graphite shafts."
