description: >
  The Slingshot Tour was the better-player member of Nike's Slingshot family,
  co-developed with input from Nike Golf's PGA Tour staff for golfers who
  wanted a classic profile with the Slingshot's game-improvement technology
  underneath. Compared with the original Slingshot and the wider, more
  forgiving Slingshot OSS, the Tour's Slingback bridge sits lower profile and
  less visible at address, the head is more compact with a thinner top-line
  and minimal offset, and the body is milled from 431 stainless steel (25%
  softer than the 17-4 stainless used in most cast irons) paired with the
  same Custom 455 stainless face as its siblings. Lofts carry over from the
  rest of the family, with an 18-degree 2-iron and a 34-degree 7-iron running
  to a 46-degree pitching wedge. The stock set was 3-iron through pitching
  wedge in steel only, with the 2-iron available as an individual order.
