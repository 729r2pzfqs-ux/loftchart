faq:
  - q: "What is the loft of a Nike Slingshot Tour 7-iron?"
    a: "The Nike Slingshot Tour 7-iron has a loft of 34 degrees, with a lie of about 62 degrees and a 37-inch steel-shaft length."
  - q: "What is the difference between the Nike Slingshot Tour and Slingshot OSS irons?"
    a: "The Tour has a more compact head, a thinner top-line, minimal offset and a Slingback bridge that sits lower and is less visible at address, aimed at better players. The Slingshot OSS has a wider sole and more visible Slingback for maximum forgiveness. Both share the same loft progression and Custom 455 stainless face."
  - q: "What clubs came in a stock Nike Slingshot Tour set?"
    a: "The stock set was 3-iron through pitching wedge, in steel shafts only (True Temper Dynamic Gold R300, S300 or X100). The 2-iron was available as an individual order."
  - q: "When did the Nike Slingshot Tour irons come out?"
    a: "Archived retailer and specification records date the Slingshot Tour to 2006, the same year as the Slingshot OSS; the earliest known review of it is archived from November 2006."
