sources:
  - "golfclubspec.com 'Nike | Slingshot Tour' specification page (golfclubspec.com/iron_results.php?id=27, also archived by the Wayback Machine at web.archive.org/web/20101031082439) - supplies the full loft/lie/length ladder for 2-iron through pitching wedge used above (18/58/39.5in through 46/64/35.75in), notes the set is steel-shaft-only with the length column specific to steel, and names the standard shaft (True Temper Dynamic Gold in R300, S300 and X100) and standard grip (Nike Slingshot Tour)."
  - "The same publisher's compiled Nike manufacturer catalogue, archived at web.archive.org/web/20101031081905/http://golfclubspec.com/irons_specs_mfg.php?mfg=Nike, lists only four Nike iron entries in its database - 'Forged 2002', 'Slingshot Tour 2006', 'Slingshot OSS 2006' and 'Forged Pro Combo 2002' - dating the Tour to 2006 alongside the OSS. This is the basis for year_introduced 2006 rather than 2007."
  - "equip2golf.com 'Nike Slingshot Tour Irons Review', earliest Wayback capture 12 November 2006 (web.archive.org/web/20061112230550/http://equip2golf.com/reviews/irons/nike_slingshot_tour.html) - confirms the 3-PW stock set with the 2-iron sold individually, the 431 stainless body ('25% softer than the more commonly used 17-4 stainless steel') with Custom 455 face and thinner top-line, the shallower and less-visible Slingback versus 'the original Slingshot and Slingshot OSS irons', minimal offset, co-development with Nike Golf's sponsored PGA Tour staff, and $799.99 set / $99.99 individual-iron pricing. The review frames the Tour as the option for 'better golfers looking for additional forgiveness' while pointing forgiveness-focused buyers to the Slingshot OSS."
  - "No independent (non-Equip2Golf-family) source with numeric lie or length figures was located, and no confirmed discontinuation date or direct Slingshot-branded successor to the Tour nameplate was found - by 2007 Nike's better-player irons shifted to the separately branded NDS and CCI Cast/Forged lines rather than a next-generation 'Slingshot Tour'. year_discontinued, predecessor and successor are therefore left null, and confidence is set to medium: the loft progression matches the well-corroborated Slingshot/OSS family ladder, but the lie/length columns and the exact 2006 dating rest on a single publisher's archived pages."
