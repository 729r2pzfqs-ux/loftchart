faq:
  - q: "What is the loft of a Nike Slingshot OSS 7-iron?"
    a: "The Nike Slingshot OSS 7-iron has a loft of 34 degrees - the same as the original Slingshot - with a lie of about 64 degrees and a steel-shaft length of about 37 inches."
  - q: "What does OSS stand for in the Nike Slingshot OSS?"
    a: "Nike marketed it as the oversize evolution of the Slingshot: the Slingback bridge moved farther from the face and the sole got wider, making it the most forgiving, super-game-improvement member of the family."
  - q: "What clubs came in a stock Nike Slingshot OSS set?"
    a: "The stock set was 4-iron through a 50-degree approach wedge. The 2-iron, 3-iron and 55-degree sand wedge were available as custom orders."
