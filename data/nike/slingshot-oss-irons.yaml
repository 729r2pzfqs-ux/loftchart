description: >
  The Slingshot OSS pushed the original Slingshot's design further toward
  maximum forgiveness: the Slingback bridge sits farther back from the face,
  the already-wide sole gets wider still, and 3-D flow weighting moves mass
  low and deep in the long irons with a progressively higher centre of
  gravity as the set shortens. Offset is generous throughout. Lofts carry
  over from the original Slingshot, with a 34-degree 7-iron and a 46-degree
  pitching wedge. The stock set is 4-iron through 50-degree approach wedge,
  with the 2-iron, 3-iron and sand wedge as custom orders. The per-club lie
  and length figures below come from a spec database that appears to round
  to whole units, so treat them as approximate; the lofts are solid.
