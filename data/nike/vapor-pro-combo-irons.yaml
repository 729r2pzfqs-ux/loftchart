sources:
  - "Nike's own 'Tech Specs' chart for the Vapor Pro Combo irons, published as an image on the store.nike.com product page and archived at https://web.archive.org/web/20160616235756im_/http://images.nike.com/is/image/DotCom/en_us_vapor_pro_combo_irons?wid=1000 (capture of 16 June 2016, retrieved 29 September 2026). It supplied every loft, length, lie, bounce, offset and swing weight above for the 2-iron through A-wedge, the RZN cavity (2-7) and muscle cavity (8-A) split, and the True Temper DG Pro shaft in R300, S300 and X100. The chart is an image, so the figures were read from it by eye rather than parsed from text."
  - "The product page that embeds that chart: https://web.archive.org/web/20160422094622/http://store.nike.com/us/en_us/pd/vapor-pro-combo-irons-4-iron-aw/pid-10260041/pgid-10995559 (capture of 22 April 2016) - 8-piece set, 4-iron through approach wedge, forged and milled 1025 carbon steel, True Temper DG Pro shaft. The chart lists the 2-iron as right-hand only; the 2- and 3-irons were not part of the boxed set."
  - "Cross-check: 2nd Swing Golf's specification table (https://www.2ndswing.com/golf-clubs/iron-sets/nike-vapor-pro-combo-iron-set, retrieved 29 September 2026) matches Nike's chart in every cell. Today's Golfer (https://www.todays-golfer.com/equipment/golf-clubs/irons/nike/vapor/nike-vapor-pro-combo-irons/) and National Club Golfer independently give the 7-iron as 34 degrees, Today's Golfer with a 37.25-inch length."
  - "Years follow the announcement-year convention. Vapor Pro, Vapor Pro Combo and Vapor Speed irons announced 19 August 2014 (https://www.golfmonthly.com/gear/gear-news/nike-vapor-irons-unveiled-56712; https://www.golfcanada.ca/articles/nike-golf-unveils-vapor-iron-franchise/), at retail from 31 October 2014 and sold as the 2015 line."
  - "year_discontinued 2016 is the year the model left the catalogue, not a successor's announcement. PGATour.com's 10 December 2015 Vapor Fly launch report says Nike chose to leave the Vapor Pro and Vapor Pro Combo alone for 2016 (https://web.archive.org/web/20151216235502/http://www.pgatour.com/equipmentreport/2015/12/10/nike-debut-vapor-fly-pro-irons.html), so the Vapor Fly Pro is not recorded as a successor. The set was still on sale on store.nike.com on 22 April 2016, and Nike announced on 3 August 2016 that it would stop making clubs, balls and bags (https://www.golfmonthly.com/gear/gear-news/nike-to-stop-making-golf-clubs-111469). Hence successor: null."
  - "Predecessor: The Hackers Paradise review of 17 November 2014 (https://www.thehackersparadise.com/nike-vapor-pro-combo-irons-review/) describes the set as the continued evolution of Nike's Pro-Combo irons; the VR Pro Combo was the Pro Combo model before it. Golfalot's review of 5 December 2014 (https://golfalot.com/equipment-review/nike-vapor-pro-combo-speed-irons-review) supplied the construction detail."
