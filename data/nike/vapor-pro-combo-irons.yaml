faq:
  - q: "What is the loft of a Nike Vapor Pro Combo 7-iron?"
    a: "The Nike Vapor Pro Combo 7-iron has a loft of 34 degrees, with a 62.5-degree lie and a 37.25-inch steel-shaft length."
  - q: "What is the pitching wedge loft on the Nike Vapor Pro Combo?"
    a: "The Vapor Pro Combo pitching wedge is 46 degrees, and the matching A-wedge is 51 degrees, a five-degree gap."
  - q: "How do the Nike Vapor Pro Combo lofts compare to the Vapor Pro?"
    a: "The Vapor Pro Combo is one degree stronger in every club: its 7-iron is 34 degrees against 35 for the Vapor Pro, and its pitching wedge 46 degrees against 47. Lengths and lies are the same, while the Pro Combo has more offset, 0.125 inches at the 7-iron against 0.080."
  - q: "Which Nike Vapor Pro Combo irons have the RZN cavity?"
    a: "The 2- through 7-irons have the RZN-filled cavity with a spring steel face. The 8-iron, 9-iron, pitching wedge and A-wedge are muscle-cavity heads."
