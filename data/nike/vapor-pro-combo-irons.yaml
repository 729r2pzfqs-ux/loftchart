description: >
  The Vapor Pro Combo is the middle model of the Vapor iron family Nike unveiled in
  August 2014 and sold as its 2015 line, sitting between the Vapor Pro blade and the
  game-improvement Vapor Speed. It is a forged 1025 carbon steel combo set: the 2- to
  7-irons have a cavity filled with Nike's RZN resin behind a spring steel face, and
  the 8-iron through A-wedge are one-piece muscle-cavity heads. Lofts are one degree
  stronger than the Vapor Pro throughout, with a 34-degree 7-iron and a 46-degree
  pitching wedge. Nike's chart runs from a right-hand-only 2-iron to a 51-degree
  A-wedge; the boxed retail set was eight clubs, 4-iron through A-wedge, with True
  Temper DG Pro steel shafts.
