sources:
  - "Nike's own Slingshot specification chart, decoded from the specs.swf Flash file archived from nikegolf's Slingshot mini-site (web.archive.org capture of nike.com/nikegolf/slingshot/specs.swf). The chart supplies every loft, lie and men's length above for 2-iron through SW, plus the women's length row (3-iron 38.25in down to SW 34.75in, no 2-iron), the standard-offering rows (men's 3-PW; men's 2-iron, AW and SW individually; women's 4-SW with women's 3-iron and AW individually; steel marked NA for the women's flex column), the custom options (+1/2in length, lie +2/-2 degrees) and the note that all options come in right and left hand"
  - "Same decoded Nike chart, shaft copy: the Constant Weight Speed Step lightweight steel shaft ('30% lighter than traditional steel shafts' with a soft tip profile), the Constant Weight Slingshot graphite shaft ('lightweight - low to mid 70 grams depending on flex', a distinct shaft per clubhead), a sub-60-gram women's graphite, and the Slingshot grip. Flex columns are Xtra Stiff, Stiff, Regular Mid Kick, Regular Low Kick and Women's; the two Regular kick profiles are collapsed to R above"
  - "Wayback CDX index: the Nike Slingshot mini-site (nike.com/nikegolf/slingshot) was captured live on 9 October 2003, including a ?specs page, which is the basis for year_introduced 2003. Golf Digest's 'Nike's timeline in golf' notes the cavity-backed Slingshot was named to the (inaugural, 2004) Golf Digest Hot List, and period reviews (equip2golf, Today's Golfer, Golflink) treat it as a 2004-season product"
  - "equip2golf.com 'Nike Slingshot Iron Review' — the cold-rolled Custom 455 stainless face milled flat to within .002in, the Tom Stites design attribution, the 3-PW set composition and the $799 steel / $899 graphite pricing. The Sand Trap's June 2006 Slingshot OSS review calls the OSS an update of 'last year's Nike Slingshot', supporting the 2006 succession used for year_discontinued"
  - "Confidence is high because the per-club numbers come from Nike's own published chart; the chart is an archived Flash asset rather than an HTML spec table, so the decode was cross-checked against the identical loft/lie/length ladder circulated for the original Slingshot by third-party spec aggregators"
faq:
  - q: "What is the loft of a Nike Slingshot 7-iron?"
    a: "The Nike Slingshot 7-iron has a loft of 34 degrees, with a 63-degree lie and a 37.25-inch steel-shaft length."
  - q: "What clubs came in a stock Nike Slingshot set?"
    a: "The men's stock set was 3-iron through pitching wedge, in steel or graphite. The 2-iron, the 50-degree A-wedge and the 55-degree sand wedge were sold individually, and a women's 4-iron-through-sand-wedge set was offered in graphite, built one inch shorter per club."
  - q: "When did the original Nike Slingshot irons come out?"
    a: "Nike's Slingshot mini-site was live by October 2003 and the set was named to Golf Digest's inaugural 2004 Hot List, so it is usually catalogued as a 2004 model. It was replaced by the Slingshot OSS in 2006."
  - q: "What made the Nike Slingshot design distinctive?"
    a: "The Slingback bridge — a bar spanning the back cavity that let Nike move weight low, deep and toward the heel in the long irons for easier launch, shifting progressively higher and toward the toe in the short irons for control. It also gave the irons their unconventional look at address."
