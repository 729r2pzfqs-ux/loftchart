description: >
  The Slingshot is the original model in Nike's longest-running iron family, designed by
  Tom Stites and built around the feature that named it: a Slingback bridge bar that
  stretches across the back cavity, moving weight low, deep and toward the heel in the
  long irons and progressively higher and toward the toe as the set shortens. The face is
  cold-rolled Custom 455 stainless steel, CNC-milled flat, on a wide-soled cavity body.
  Lofts are moderate for a game-improvement set of its era, with a 34-degree 7-iron and a
  46-degree pitching wedge. Nike's own spec chart runs 2-iron through sand wedge: the
  men's stock set is 3-PW, with the 2-iron, 50-degree A-wedge and 55-degree sand wedge
  sold individually, and a women's 4-SW set built one inch shorter. Stock shafts were
  Nike's Speed Step lightweight steel and a constant-weight Slingshot graphite. Nike's
  Slingshot mini-site was live by October 2003 and the set made Golf Digest's inaugural
  2004 Hot List, so it is commonly catalogued as a 2004 model; year_introduced records
  the 2003 public debut per the repository convention.
