description: >
  Vapor Speed is the game-improvement model of the Vapor family Nike unveiled with
  Tiger Woods and Rory McIlroy in August 2014 — the forgiving counterpart to the Vapor
  Pro and Vapor Pro Combo. Weight sits low and forward behind the face throughout the
  set for a higher, more forgiving launch, and the set is built long, at 39.75 inches
  for the 3-iron. The sand wedge is much heavier than the rest of the set, at D5.5.
