faq:
  - q: "What is the loft of a Nike Vapor Speed 7-iron?"
    a: "The Nike Vapor Speed 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a length of 37.75 inches."
  - q: "When were Nike Vapor Speed irons made?"
    a: "Nike unveiled the Vapor family in August 2014 and the Vapor Speed irons reached retail on 31 January 2015."
  - q: "Why is the Nike Vapor Speed sand wedge so much heavier?"
    a: "It is built to D5.5 against D2.5 for the rest of the set — three full swing-weight points heavier — which is normal for a wedge sold as part of an iron set but unusually large a jump here."
