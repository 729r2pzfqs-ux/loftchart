faq:
  - q: "What is the loft of a Nike VR Pro Cavity 7-iron?"
    a: "The Nike VR Pro Cavity 7-iron has a loft of 32 degrees, with a 62-degree lie and a 37-inch steel-shaft length."
  - q: "How do the VR Pro Cavity lofts compare to the VR Pro Combo?"
    a: "They are one to two degrees stronger club for club: the Cavity's 7-iron is 32 degrees against the Combo's 35, and its pitching wedge 45 degrees against the Combo's 47."
  - q: "Are the Nike VR Pro Cavity irons forged?"
    a: "No. The heads are cast - one-piece 17-4 stainless steel in the short irons, with two-piece mid irons and three-piece long irons that add high-strength AM355 steel faces and rear weighting."
