  - "qsponge.com VR Pro Cavity table lists the same lofts and lies (its 8-iron '33 degrees' row is an obvious typo for 36), corroborating the ladder."
  - "Golf Monthly 'Nike VR Pro Cavity irons' review (February 2011) - the 2011 release, 4-PW core set, Dynalite 110 stock shaft and the Opti-Mass three/two/one-piece progressive construction. The Hackers Paradise review confirms the 17-4 stainless body and AM355 long-iron faces."
