description: >
  The VR Pro Cavity was the most forgiving member of Nike's 2011 VR Pro
  family, sitting below the VR Pro Combo and VR Pro Blade. It uses Nike's
  Opti-Mass progressive construction: three-piece long irons with
  high-strength AM355 faces and added rear weight, two-piece mid irons, and
  one-piece 17-4 stainless short irons for feel, so the centre of gravity
  moves through the set. Lofts are a degree or two stronger than the Combo,
  with a 32-degree 7-iron and a 45-degree pitching wedge. The core set is
  4-iron through pitching wedge with wedges through a 60-degree lob wedge
  available to match; figures below are the standard men's steel
  specification.
