sources:
  - "InTheHoleGolf.com 'Nike VR Pro Blade Iron Set' retailer page (intheholegolf.com/NG-VRPBIS/Nike-VR-Pro-Blade-Iron-Set.html), which reproduces Nike's full spec table — club, hand, loft, lie, offset, bounce, length and D1-D3 swing weight for 2-iron through PW — plus the pocket-cavity/split-cavity/blade progression, the 3-PW set with the 2-iron sold separately, the Dynamic Gold R/S/X stock shaft with weights and the VR Tour Velvet grip. The Wayback Machine holds a capture of this page from 8 June 2011, contemporaneous with the product, with the identical table"
  - "Cross-checked against a second aggregator spec table (qsponge's Nike VR Pro Blade entry), which lists identical loft, lie, length and bounce for all nine clubs. Confidence is medium rather than high because both are reproductions of Nike's sheet rather than a retrievable nikegolf.com page — the Wayback index for Nike's own golf pages of this era returns only Flash shells"
  - "NBC Sports / Golf Channel equipment-insider article of 20 October 2010: Nike announced the VR Pro Blades with retail from 26 November 2010, $1,079.99 for 3-PW in Dynamic Gold steel, the 2-iron at $135, X3X grooves set deeper and closer together, and the same grind and profile as the predecessor VR Forged TW Blade. This is the basis for year_introduced 2010; Golfmagic's launch story confirms November availability in right and left hand"
  - "year_discontinued 2014 follows the announcement of the Nike Vapor iron family in August 2014 (GolfWRX and MyGolfSpy launch coverage; retail 31 October 2014), which ended the VR Pro iron line without a direct blade replacement — hence successor: null. Note this database records the Vapor Pro's year_introduced as 2015, the model year under which it is usually catalogued"
