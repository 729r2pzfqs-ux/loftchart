faq:
  - q: "What is the loft of a Nike VR Pro Blade 7-iron?"
    a: "The Nike VR Pro Blade 7-iron has a loft of 35 degrees, with a 62.5-degree lie and a 37-inch steel-shaft length."
  - q: "Are the Nike VR Pro Blades true blades throughout the set?"
    a: "No. The 2- through 4-irons use a pocket cavity for forgiveness, the 5- through 7-irons a split cavity, and only the 8-iron through pitching wedge are full blade designs."
  - q: "When were the Nike VR Pro Blades released?"
    a: "Nike announced them in October 2010 and they reached retail on 26 November 2010, priced at $1,079.99 for 3-PW with Dynamic Gold steel shafts. The 2-iron was sold separately."
  - q: "How do the Nike VR Pro Blade lofts compare to the VR Pro Combo?"
    a: "They are identical from the 3-iron (21 degrees) through the pitching wedge (47 degrees), and both sets carry the same progressive 2-to-9-degree bounce. The Blade additionally offered an 18-degree 2-iron and publishes offset figures."
