description: >
  The VR Pro Blade is the third blade set Nike ever made, announced in October 2010 with
  retail from 26 November 2010, and the first with the X3X groove pattern — deeper grooves
  set closer together to conform to the 2010 USGA and R&A groove rules. It keeps the same
  grind and profile as the VR Forged TW Blade it replaced, with a precision-forging
  process that delivers the head near-finished. Despite the name it is progressive: the
  2- through 4-irons carry a pocket cavity, the 5- through 7-irons a split cavity, and
  only the 8-iron through pitching wedge are full blades. Lofts are fully traditional,
  with a 35-degree 7-iron and a 47-degree pitching wedge, and bounce runs progressively
  from 2 to 9 degrees. The stock set is 3-PW with Dynamic Gold shafts, the 2-iron sold
  separately. Nike announced no further blade after it; the model line ended when the
  Vapor iron family (whose most compact model, the Vapor Pro, is a modified muscle-back
  rather than a true blade) was announced in 2014.
