faq:
  - q: "What is the loft of a Nike Forged Blades 7-iron?"
    a: "The Nike Forged Blades 7-iron has a loft of 37 degrees, with a 62.5-degree lie and a 36.75-inch steel-shaft length - a classic weak-lofted blade spec."
  - q: "How do I identify Nike's original Forged Blades?"
    a: "There is no model name on the club: the back of the muscle-back head carries only the Nike swoosh near the toe. Spec databases list them as the Nike 'Forged' or '(swoosh) blade' model, sold from 2002 in steel only."
  - q: "What clubs came in a stock Nike Forged Blades set?"
    a: "The standard set was 3-iron through pitching wedge with True Temper Dynamic Gold steel shafts. A 17-degree 1-iron and 20-degree 2-iron were on the spec chart as individual clubs."
