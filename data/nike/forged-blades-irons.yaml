description: >
  The Forged Blades were Nike's first irons, launched in 2002 alongside the Forged
  Pro Combo as the company entered the club business. They are traditional
  muscle-back blades with no model name on the head - the back carries only the
  swoosh, which is why spec databases catalogue them as the Nike "Forged" or
  "(swoosh) blade" model. The lofts are old-school weak by modern standards, with a
  37-degree 7-iron and a 49-degree pitching wedge, and the chart runs all the way to
  a 17-degree 1-iron. The standard set was 3-PW with the 1- and 2-irons available
  individually, in steel only. The published lie ladder has an odd step - 60 degrees
  at the 4-iron jumping to 62 at the 5- and 6-irons - which is transcribed here
  as printed in the source chart.
