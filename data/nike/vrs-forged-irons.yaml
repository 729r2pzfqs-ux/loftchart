description: >
  The VR_S Forged paired Nike's NexCOR variable-thickness face with a forged
  players-sized cavity back, aimed at better players who wanted the 2012
  VR_S distance story in a compact head with modest offset. Lofts are strong
  for a players iron of the era - a 31-degree 7-iron and a 45-degree pitching
  wedge - with wider gaps through the scoring clubs down to the 51-degree
  approach wedge. The stock set is 4-iron through approach wedge on the
  Nippon N.S. Pro 950GH HT steel shaft, a high-launch profile chosen to
  offset the strong lofts; a 3-iron and sand wedge were available outside
  the stock set. Figures below are the standard men's steel specification.
