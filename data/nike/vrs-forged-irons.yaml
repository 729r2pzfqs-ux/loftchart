faq:
  - q: "What is the loft of a Nike VR_S Forged 7-iron?"
    a: "The Nike VR_S Forged 7-iron has a loft of 31 degrees, with a 62-degree lie and a 37-inch steel-shaft length."
  - q: "Are the Nike VR_S Forged irons strong lofted?"
    a: "Yes, for their class. The 7-iron is 31 degrees and the pitching wedge 45 degrees - roughly two to four degrees stronger than Nike's traditional players irons like the VR Pro Combo - which is why Nike paired them with the high-launch N.S. Pro 950GH HT shaft."
  - q: "What clubs come in a stock Nike VR_S Forged set?"
    a: "The stock set is 4-iron through pitching wedge plus a 51-degree approach wedge, with a 3-iron and sand wedge available outside the stock set."
