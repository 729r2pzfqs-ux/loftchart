sources:
  - "TheSandTrap.com 'Nike Golf Releases Victory Red Irons' bag-drop article (published 18 November 2008) - the original announcement of the three-way Victory Red launch (Forged TW Blade, Forged Split Cavity, Full Cavity), giving the Split Cavity's 3-PW set composition, $999 MSRP / $899 street price, separate 2-iron (~$113), True Temper Dynamic Gold steel shafts, and forged-carbon-steel/CNC-milled-face construction shared across the family. This is the basis for year_introduced 2008; the model is commonly reviewed and catalogued through the 2009-2010 seasons."
  - "InTheHoleGolf.com 'Nike Victory Red Forged Split Cavity Irons' retailer spec page (intheholegolf.com/VRSC/Nike-Victory-Red-Forged-Split-Cavity-Irons.html) - supplies the full loft, lie, bounce and length table for 2-iron through PW used above, plus '1025 Forged Carbon Steel' construction, CNC-milled face, True Temper Dynamic Gold shaft and the Victory Red grip by Eaton. A separate aggregated web-search table circulating for this model lists the 2-iron bounce as 2 degrees rather than this page's 1 degree; the retailer page's figure is used here as the more specific single-model source."
  - "TheSandTrap.com review (published 20 June 2009) and Today's Golfer 'Nike Golf VR Split-Cavity Better Player Irons Review' (testing centred on 2009-2010, noting a Today's Golfer silver award in issue 270) both state explicitly that the Split Cavity's loft and lie are identical to the Victory Red Forged TW Blade, and describe its wider sole, thicker topline and greater offset relative to that blade - corroborating both the spec ladder and the construction description independent of the retailer table."
  - "No nikegolf.com page from this era is retrievable via the Wayback Machine (the domain's CDX index returns only unrelated redirect entries), so all per-club figures come from retailer/review reproductions rather than a Nike-original chart; confidence is set to medium for that reason. The successor field is an inference, not a Nike-stated succession: no source names a direct replacement for the Split Cavity when the VR Pro generation launched in 2011, but VR Pro Combo occupies the same players-category, combo-shaped niche and is the closest analog, matching the treatment other files in this repository give to unconfirmed model-lineage 'descendants'."
