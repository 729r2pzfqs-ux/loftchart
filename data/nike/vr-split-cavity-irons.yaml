faq:
  - q: "What is the loft of a Nike VR Split Cavity 7-iron?"
    a: "The Nike VR Split Cavity 7-iron has a loft of 35 degrees, with a 62.5-degree lie and a 37-inch steel-shaft length - identical to the Victory Red Forged TW Blade of the same generation."
  - q: "Are the Nike VR Split Cavity irons the same as the Victory Red blades?"
    a: "They share an identical loft and lie ladder, but the Split Cavity has a wider sole, thicker topline and more offset than the muscleback Victory Red Forged TW Blade, trading a little workability for added forgiveness from a split-back cavity."
  - q: "When were the Nike VR Split Cavity irons released?"
    a: "Nike announced the Victory Red iron family, including the Forged Split Cavity, on 18 November 2008, with a $999 MSRP (about $899 street) for the 3-iron through pitching wedge in True Temper Dynamic Gold steel; the 2-iron was sold separately."
