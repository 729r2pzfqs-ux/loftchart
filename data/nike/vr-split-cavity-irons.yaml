description: >
  The Victory Red Forged Split Cavity - marketed and reviewed almost universally as the
  "VR Split Cavity" - was announced on 18 November 2008 as the middle tier of Nike's
  three-way Victory Red iron launch, sitting between the muscleback Victory Red Forged TW
  Blade and the game-improvement Victory Red Full Cavity. It is forged from 1025 carbon
  steel with a CNC-milled face and a split-back cavity that moves the centre of gravity
  behind the sweet spot, giving it a wider sole, thicker topline and more offset than the
  TW Blade while sharing an identical, fully traditional loft and lie ladder - a
  35-degree 7-iron and a 47-degree pitching wedge. The stock set is 3-iron through
  pitching wedge in True Temper Dynamic Gold steel only (no graphite offered), with the
  2-iron sold separately. Nike did not announce a named successor when the VR Pro
  generation replaced the Victory Red line in 2011, but the split-cavity/combo concept
  continued most directly in the players-category VR Pro Combo.
