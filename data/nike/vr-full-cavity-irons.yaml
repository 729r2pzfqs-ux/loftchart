description: >
  The Victory Red Full Cavity - retailers and reviewers shortened it to "VR Full Cavity"
  well before Nike itself adopted the VR abbreviation for the 2010 VR Pro generation - was
  the third and most forgiving tier of Nike's three-way Victory Red iron launch, announced
  alongside the muscleback Victory Red Forged TW Blade and the mid-tier Victory Red Forged
  Split Cavity. It is cast from 431 stainless steel, about 25% softer than the 17-4
  stainless commonly used elsewhere, with a deep undercut cavity, wide sole, thick topline,
  more offset than its forged siblings, and progressive face thickness for a lower,
  deeper centre of gravity. Lofts start level with the Split Cavity and TW Blade at the
  4-iron (24 degrees) but run about two degrees stronger by the pitching wedge (45 versus
  47), consistent with its game-improvement, more distance-oriented role. The stock set is
  4-iron through approach wedge in steel or graphite, with a women's 5-iron through sand
  wedge set offered in graphite only.
