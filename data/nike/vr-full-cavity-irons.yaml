faq:
  - q: "What is the loft of a Nike VR Full Cavity 7-iron?"
    a: "The Nike VR Full Cavity 7-iron has a loft of 33 degrees, with a 62.5-degree lie and a 37-inch steel-shaft length (36.5 inches in the graphite version)."
  - q: "How does the VR Full Cavity compare to the Victory Red Split Cavity and TW Blade?"
    a: "The Full Cavity shares an identical 24-degree 4-iron with its forged siblings but runs progressively stronger from there - a 33-degree 7-iron against 35 degrees for both the Split Cavity and TW Blade, and a 45-degree pitching wedge against their 47 degrees - reflecting its game-improvement, more distance-oriented design and added offset."
  - q: "What clubs came in a stock Nike Victory Red Full Cavity set?"
    a: "The standard set was 4-iron through a 50-degree approach wedge (8 clubs), offered in steel or graphite. A women's 5-iron through sand wedge set was offered in graphite only. No 3-iron appears on the retailer specification tables found for this model."
  - q: "Was the Nike VR Full Cavity introduced in 2010?"
    a: "No. It was announced in 2008 (26 August 2008 per Nike's press release, with a 1 November 2008 retail date) as part of the same three-way Victory Red launch as the Victory Red Forged TW Blade and Forged Split Cavity. It remained in retail and resale channels well into 2010-2011, which is likely why it is sometimes associated with the 2010 VR Pro generation, but no evidence of a separate 2010 launch was found."
