sources:
  - "The Golf Wire, 'Nike Golf Introduces Series of Victory Red Irons for Golfers who Demand Tour Proven Craftsmanship, Performance and Forgiveness' (press release, 26 August 2008; retail from 1 November 2008) - names the three-model launch (Victory Red Forged TW Blades, Victory Red Forged Split Cavity, and the Full Cavity), gives the Full Cavity's 431 stainless steel construction (25% softer than 17-4), 4-AW set composition, women's 5-SW graphite set, and pricing ($799.99 steel / $999.99 graphite / $999.99 women's)"
  - "InTheHoleGolf.com 'Nike Victory Red Full Cavity Irons' retailer spec page (intheholegolf.com/VRFC/Nike-Victory-Red-Full-Cavity-Irons.html) - supplies the full loft, lie, bounce, and steel/graphite length table for 4-iron through AW used above, plus the Victory Red grip by Eaton and the undercut-cavity/perimeter-weighting description"
  - "2nd Swing Golf 'Nike Victory Red Cavity Back Iron Set' page (2ndswing.com/golf-clubs/iron-sets/nike-victory-red-cavity-back-iron-set) - independently lists an identical loft/lie/length/bounce ladder for 4-iron through PW and names the stock shaft as True Temper Dynamic Gold High Launch, confirmed in S300 by this listing and in R300 by a Walmart pre-owned listing for the same set ('Nike Victory Red Full Cavity 4-PW, AW Iron Set... TT Dynamic Gold HL R300')"
  - "Today's Golfer 'Nike Golf VR Full-Cavity Better Player Irons Review' and The Hackers Paradise 'Nike Victory Red Full Cavity Review' both describe the 431-stainless, undercut-cavity, perimeter-weighted construction and note the model has more offset than the Victory Red TW Blade and Forged Split Cavity; neither publishes a full per-club spec table"
  - "This repository's sibling file data/nike/vr-split-cavity-irons.yaml documents the same three-way 2008 Victory Red launch (TheSandTrap.com bag-drop coverage, 18 November 2008) and already lists this model as its 2008-launch sibling; that cross-reference, plus the press release above, is why year_introduced is recorded as 2008 rather than 2010 - no evidence was found for a distinct 2010 'VR Full Cavity' product launched alongside the 2010 VR Pro Blade, and forum/resale listings (GolfWRX 'Previous Model Year Reviews' board, Golf Monthly marketplace posts from March 2011, eBay/Walmart pre-owned listings) show this same 2008 set still being bought, sold and discussed through 2010-2011"
  - "No nikegolf.com page from this era is retrievable via the Wayback Machine (the domain's CDX index returns no matching captures), so all per-club figures come from retailer/review reproductions rather than a Nike-original chart; offset is not published in any source found and is omitted rather than inferred. year_discontinued and successor are inferred - no source names a direct replacement, but Nike's next cast game-improvement iron in this repository is the 2012 VR_S (data/nike/vrs-irons.yaml), which is the closest categorical descendant; confidence is medium given the retailer-table agreement offset by the lack of a manufacturer-original source"
