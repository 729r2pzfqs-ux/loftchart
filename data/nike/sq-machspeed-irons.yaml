description: >
  The SQ MachSpeed is a super-game-improvement cavity-back iron Nike Golf introduced
  for retail on February 25, 2010, carrying the "SQ" (Sasquatch) branding it had used
  since the mid-2000s on its square-headed, forgiveness-focused drivers and fairway
  woods over to an iron aimed at mid-to-high handicappers. A two-piece, off-the-face-weld
  construction pairs a stainless-steel body with a hot AM355 alloy face insert, and a deep
  undercut behind the face relocates roughly 50 grams of weight into Nike's PowerBow
  perimeter-weighting system for a low, deep center of gravity, higher launch and a
  softer landing. The stock men's steel set ran 4-iron through pitching wedge plus an
  approach/gap wedge (8 clubs), with a 3-iron and sand wedge available individually and
  a women's set substituting 5- and 6-hybrids for the longest irons. Lofts run from 20
  degrees in the 3-iron up to 50 degrees in the approach wedge, with the 7-iron at 33
  degrees.
