sources:
  - "NBC Sports / Golf Channel wire equipment-insider article 'Nike Golf introduces the SQ MachSpeed iron' - the February 25, 2010 retail date, the AM355 alloy / off-the-face weld construction, the PowerBow undercut moving 50 grams of weight, and the Tom Stites (Nike Golf Director of Club Creation) quote that 'this iron is all about helping golfers increase their ball speed in order to generate distance'"
  - "The Sand Trap 'Nike MachSpeed Irons and Hybrids Complete 2010 MachSpeed Lineup' bag-drop post - confirms the two-piece AM355/off-face-weld construction and PowerBow description, gives the True Temper Dynalite 90 (steel, 90g) and UST SQ ProForce AXIVCore (graphite, 70g) stock shaft names and weights, and situates MachSpeed alongside the concurrent Slingshot line in Nike's super-game-improvement tier; a related 2011 Sand Trap lineup post lists 'Slingshot and SQ MACHSPEED' as Nike's 2011 super-game-improvement irons, the basis for year_discontinued 2011 ahead of the 2012 VR_S launch"
  - "The Hackers Paradise 'Nike MachSpeed Irons Review - His & Hers' - confirms the men's stock set is 4-iron through pitching wedge plus an approach/gap wedge (8 clubs), describes the women's set substituting 5- and 6-hybrids for the long irons, and gives the pricing grid: steel MSRP $839.99 / street $699.99, graphite (men's and women's) MSRP $959.99 / street $799.99, all in Stiff/Regular/Senior-Uniflex ('A') flex"
  - "2ndswing.com Nike Sasquatch MachSpeed iron-set listing - full per-club loft/lie/length/bounce chart from 3-iron through AW (3i 20/60.5/39.25/2 through AW 50/65.5/36/9), matching the boxed-set options offered (3-PW+AW/SW, 4-PW+AW, 5-PW+AW, 4-9); also names a 'Nike Sasquatch Diamana' premium shaft option not corroborated elsewhere, so it is omitted from stock_shafts above"
  - "intheholegolf.com Nike SQ Machspeed Iron Set listing - independently corroborates the 4-PW+AW loft/lie/length ladder (4i 23/61.5/38.75 through AW 50/65.5/36) against the 2ndswing chart, and separately confirms the True Temper DynaLite 90 steel shaft and the SQ ProForce AXIVCore by UST Mamiya graphite shaft (+$100) as the two stock offerings"
  - "Today's Golfer 'Nike MachSpeed Irons' and 'Nike SQ Machspeed Irons' equipment-review pages - describe the club as a cavity-back with moderate offset and medium forgiveness aimed at mid-to-high handicappers (note: one of the two Today's Golfer listings mislabels the head type as 'muscle back' in a spec-table field, which conflicts with its own body text and with every other source describing PowerBow/undercut cavity construction, so 'cavity back' is used here); confirms the Gold award in Today's Golfer's irons test (issue 270) and a UK graphite-set price of GBP 540"
  - "The naming and 'SQ' branding: Nike's Sasquatch ('SQ') square-headed drivers and fairway woods predate the MachSpeed by several years and are the origin of the 'SQ' prefix; no source found describes the MachSpeed iron head itself as square-shaped, so the description treats 'SQ' as a branding carryover signaling the same forgiveness/stability positioning, not a literal geometric claim. Confirmed the model is not previously catalogued in this repository's data/nike/ directory (no existing sq-*.yaml file) before this entry was added"
confidence: high
faq:
  - q: "What is the loft of a Nike SQ MachSpeed 7-iron?"
    a: "The Nike SQ MachSpeed 7-iron has a loft of 33 degrees, with a 64-degree lie and a 37.25-inch steel-shaft length."
  - q: "What clubs came in a stock Nike SQ MachSpeed iron set?"
    a: "The men's stock steel set ran 4-iron through pitching wedge plus an approach/gap wedge (8 clubs), with a 3-iron and sand wedge sold individually. The women's set substituted 5- and 6-hybrids for the longest irons ahead of a 7-iron-through-sand-wedge graphite run."
  - q: "What does the 'SQ' in Nike SQ MachSpeed mean?"
    a: "'SQ' is short for Sasquatch, the branding Nike had already used for years on its square-headed forgiveness-focused drivers and fairway woods. Applied to the MachSpeed iron it signals the same game-improvement, forgiveness-first positioning rather than describing a square clubhead shape."
  - q: "What replaced the Nike SQ MachSpeed irons?"
    a: "Nike's SQ MachSpeed and Slingshot lines both remained in the 2011 super-game-improvement lineup before Nike replaced them with the VR_S irons for 2012."
