faq:
  - q: "What is the loft of a Proto-Concept C01 7-iron?"
    a: "The Proto-Concept C01 7-iron has a loft of 32 degrees, with a 61.5-degree lie and a 37-inch recommended steel length."
  - q: "What is special about the Proto-Concept C01?"
    a: "The 5-, 6- and 7-irons are forged with a pure titanium round rod inside the S20C billet - roughly 25 grams of titanium that deepens the centre of gravity. At the time it was the only iron on the market with titanium forged inside the head."
  - q: "Who makes Proto-Concept clubs?"
    a: "PROTOCONCEPT is a Tokyo-based premium brand created in 2019 by the Endo forging house together with the Golf Partner retail group; heads are forged to Endo's spec and clubs are assembled to order in Japan or the USA."
