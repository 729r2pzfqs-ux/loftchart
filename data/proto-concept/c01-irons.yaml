category: blade
construction: forged one-piece muscle back with forged-in titanium rod (5-7 irons)
material: S20C carbon steel with inner titanium (#5-#7), S25C carbon steel (#8-PW)
successor: Proto-Concept C01 TBic
predecessor: null
description: >
  The C01 was the muscle back in PROTOCONCEPT's original C-series - the
  premium Japanese brand established in 2019 as a collaboration between the
  Endo forging house and the Golf Partner retail group, with its first irons
  reaching the market in 2020. Its signature technology is a roughly 25-gram
  pure titanium round rod impregnated into the S20C billet before forging in
  the 5- through 7-irons; the titanium is about half the weight of the steel
  it displaces, deepening the centre of gravity to give the blade profile
  something closer to cavity-back launch, while the 8-iron to pitching wedge
  are conventional S25C forgings. Heads are sold component-style, 5-PW, and
  assembled to order in Japan or the USA. Lengths below are the manufacturer's
  recommended steel assembly lengths; PROTOCONCEPT publishes face progression
  rather than offset, so that key is omitted. The C01 TBic, which replaced the
  titanium rod with an inner ceramic, superseded it in July 2023.
