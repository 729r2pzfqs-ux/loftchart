faq:
  - q: "What is the loft of a Proto-Concept C03 TC 7-iron?"
    a: "The Proto-Concept C03 TC 7-iron has a loft of 32 degrees, a lie of 62 degrees, and a recommended steel length of 37 inches."
  - q: "When was the Proto-Concept C03 TC released?"
    a: "It was announced on 19 May 2023 - not 2022, which some listings imply by association with PROTOCONCEPT's earlier Golf Digest Hot List recognition."
  - q: "What does 'TC' mean on the Proto-Concept C03 TC?"
    a: "Tour Cavity. A CNC-milled undercut is machined into the back of the #4 through #7 heads only, giving the long irons extra forgiveness while the shorter irons keep a higher, more controlled centre of gravity."
