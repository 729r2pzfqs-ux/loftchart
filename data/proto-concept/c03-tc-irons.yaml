description: >
  The C03 TC ("Tour Cavity") is a players iron in PROTOCONCEPT's C-series,
  sitting between the muscle-back C01 and the pocket-cavity C05 - a soft-iron
  forging with a CNC-milled undercut back cavity on the #4 through #7 irons
  only, so the long irons get extra forgiveness while the short irons keep a
  higher, more compact centre of gravity for a controlled, flatter flight
  with more spin. It was announced 19 May 2023, not 2022 as sometimes listed -
  PROTOCONCEPT's own first-look coverage and MyGolfSpy's review both date the
  launch to spring 2023. Heads are sold component-style, 4-PW, and assembled
  to order in Japan or the USA. Lengths below are the manufacturer's
  recommended steel assembly lengths; PROTOCONCEPT publishes face progression
  rather than offset, so that key is omitted, consistent with the rest of the
  C-series in this dataset.
