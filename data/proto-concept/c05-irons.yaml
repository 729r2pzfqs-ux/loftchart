faq:
  - q: "What is the loft of a Proto-Concept C05 7-iron?"
    a: "The Proto-Concept C05 7-iron has a loft of 32 degrees, with a 62-degree lie and a 37.25-inch recommended steel length."
  - q: "Is the Proto-Concept C05 forged?"
    a: "The body is forged S25C carbon steel and the face is a separately forged SAE8655 chromium-molybdenum plate, 2.4 to 2.7 mm thick, welded over a milled pocket cavity."
  - q: "Can the C05 be combined with other Proto-Concept irons?"
    a: "Yes. The original C01, C03, C05 and C07 share the same loft ladder club-for-club, and PROTOCONCEPT designed them to be blended into combo sets."
