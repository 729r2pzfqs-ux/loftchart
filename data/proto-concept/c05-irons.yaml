description: >
  The C05 was the tour pocket cavity in PROTOCONCEPT's original C-series,
  released in 2020 as part of the first iron range from the brand the Endo
  forging house and the Golf Partner retail group established in 2019. A
  forged SAE8655 chromium-molybdenum face varying between 2.4 and 2.7 mm in
  thickness is welded to an S25C carbon steel body over a milled pocket
  cavity, trading blade purity for ball speed while sharing the C01's loft
  ladder - a 32-degree 7-iron and 45-degree pitching wedge - so the two blend
  into combo sets. Heads are sold component-style, 5-PW, assembled to order in
  Japan or the USA; Patty Tavatanakit and Lydia Ko helped put the brand on the
  international map. Lengths below are the manufacturer's recommended steel
  assembly lengths; PROTOCONCEPT publishes face progression rather than
  offset, so that key is omitted. The C05TP superseded it in 2024.
