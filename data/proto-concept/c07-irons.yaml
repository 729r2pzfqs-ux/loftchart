faq:
  - q: "What is the loft of a Proto-Concept C07 7-iron?"
    a: "The Proto-Concept C07 7-iron has a loft of 31 degrees, a lie of 62.5 degrees, and a recommended steel length of 37 inches."
  - q: "Is the Proto-Concept C07 forged?"
    a: "The face is forged SAE8655 chromium-molybdenum steel with three distinct thickness zones, joined to an S20C forged carbon-steel body over a pocket cavity."
  - q: "Is the Proto-Concept C07 the most forgiving model in the C-series?"
    a: "Yes - among the original C01, C03, C05 and C07 lineup, the C07's deep pocket cavity and low, deep centre of gravity make it the most game-improvement-oriented of the four."
