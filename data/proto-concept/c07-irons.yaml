description: >
  The C07 is the most forgiving model in PROTOCONCEPT's original C-series,
  part of the first iron range from the brand the Endo forging house and the
  Golf Partner retail group established in 2019, on the market from 2020
  alongside the C01 and C05. A forged SAE8655 chromium-molybdenum face with
  three distinct thickness zones - about 1.8 mm at the top blade thinning to
  2.7 mm lower on the face - is joined to an S20C carbon steel body over a
  pocket cavity, pushing weight low and deep for an easy, straight ball
  flight. Heads are sold component-style, 4-PW, assembled to order in Japan
  or the USA. Lengths below are the manufacturer's recommended steel assembly
  lengths; PROTOCONCEPT publishes face progression rather than offset, so
  that key is omitted. The loft ladder carried unchanged into PROTOCONCEPT's
  current "PC" (Premium Custom) C07PC line, which added a 49-degree gap wedge.
