faq:
  - q: "What is the loft of a Titleist DCI Black 7-iron?"
    a: "The Titleist DCI Black 7-iron is 36 degrees, with a 61.5 degree lie and a 36.5 inch standard steel length."
  - q: "What is the difference between the Titleist DCI Black and DCI Gold?"
    a: "They launched together in 1993 as the two halves of the original DCI line: the Black is the players version with a more compact head and flatter lies, while the Gold is the game-improvement version with more offset and more upright lies."
  - q: "How many clubs were in the Titleist DCI Black set?"
    a: "Titleist catalogued the DCI Black from a 1-iron through a 60 degree lob wedge, thirteen clubs in all, though most retail sets were sold as 3-PW."
