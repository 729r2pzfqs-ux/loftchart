description: >
  The DCI Black is the players model of the original 1993 DCI pairing, sold
  alongside the game-improvement DCI Gold. Both carry the Dual Cavity Iron
  design that gave the family its name, but the Black keeps a more compact
  head, flatter lies - 61.5 degrees at the 7-iron against the Gold's 63 - and
  traditional lofts with a 36 degree 7-iron and 48 degree pitching wedge.
  Titleist catalogued it from a 1-iron through lob wedge, all at D1 swing
  weight and a uniform 35.5 inch length through the scoring clubs. Its slot at
  the better-player end of the DCI range passed to the DCI 962 in 1997.
