description: >
  The third T100 keeps the tour chassis — a forged 1025 carbon steel body with
  a variable-thickness face insert and dual-density tungsten in the toe and
  heel — and refines the sole with more heel and toe relief. Lofts are
  traditional: 34 degrees at the 7-iron, 46 at the pitching wedge, one degree
  weaker than the T150 that sits beside it in the range. Offset runs from 3.4mm
  at the 3-iron down to 1.3mm at the gap wedge. Figures are the men's standard
  right-handed steel build.
