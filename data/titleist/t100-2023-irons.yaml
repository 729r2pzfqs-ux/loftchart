faq:
  - q: "What is the loft of a Titleist T100 (2023) 7-iron?"
    a: "The 2023 T100 7-iron has a loft of 34 degrees, a lie of 63.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "What is the difference between the T100 and the T150?"
    a: "The T150 is the stronger, slightly more forgiving version of the same shape — its lofts run about one degree stronger through the set than the T100's, which is 34 degrees at the 7-iron."
  - q: "When did the 2023 T100 come out?"
    a: "2023, replacing the 2021 T100 as the third generation of Titleist's tour players iron."
  - q: "What is the pitching wedge loft on the 2023 T100?"
    a: "46 degrees, with a 50-degree gap wedge available below it."
