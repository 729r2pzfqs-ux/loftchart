faq:
  - q: "What lofts do the Titleist GTS fairway woods come in?"
    a: "The GTS2 comes in 13.5, 15, 16.5, 18 and 21 degrees; the GTS3 in 15, 16.5, 18 and 21 — the 21 degree GTS3 7-wood is new, a loft the GT3 never offered."
  - q: "What is the Titleist GTS fairway adjustment chart?"
    a: "Every head uses the 16-setting SureFit hosel: loft from minus 0.75 to plus 1.5 degrees and lie from 0.75 degrees flat to 1.5 degrees upright, adjusted independently. A1 is standard for right-handers. Both heads add a dual heel-toe sole weighting system for strike and shape bias."
  - q: "What is the difference between the GTS2 and GTS3 fairway woods?"
    a: "The GTS2 is the larger head with a shallower face for players who sweep the ball; its 13.5 degree head keeps a taller face for spin control. The GTS3 is the compact, deeper-faced player's head for steeper angles of attack."
  - q: "Is there a Titleist GTS hybrid?"
    a: "No — as of October 2026 the GTS line covers drivers and fairways only, and the GT hybrids remain Titleist's current hybrid family."
