description: >
  The GTS fairway metals reached retail on 11 June 2026, replacing the GT
  fairways about ten months after the GTS drivers' debut cycle began. The
  crown composite now wraps around the body, and for the first time on a
  core Titleist fairway both heads carry a dual heel-toe sole weighting
  system of swappable flat weights for strike and shape bias. The GTS2 is
  the larger, shallower-faced head for sweepers, in five lofts from a 13.5°
  strong 3-wood (the one taller-faced head in the line); the GTS3 is the
  compact, deeper-faced player's head for steeper deliveries, and gains a
  21° 7-wood the GT3 never had. Every head keeps the 16-setting SureFit
  hosel. No GTS hybrid exists — the GT hybrids carry on as Titleist's
  current hybrid line.
variants:
  - name: GTS2
    description: >
      The core head for most players: a larger profile with a shallower face
      in every loft except the taller-faced 13.5°, for players who sweep the
      ball off the turf. Five lofts, right- and left-handed.
  - name: GTS3
    description: >
      The compact player's head with a deeper face for steeper angles of
      attack, in four lofts including a new 21° 7-wood. Left-handed stock in
      15° with the other lofts custom-order.
