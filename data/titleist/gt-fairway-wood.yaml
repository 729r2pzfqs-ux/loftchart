category: flagship
construction: steel bodies under a thermoform Matrix polymer crown; SureFit adjustable CG track on the GT3
material: forged face inserts with variable thickness; proprietary seamless thermoform crown
predecessor: Titleist TSR
successor: Titleist GTS
description: >
  The GT fairway metals reached retail in August 2024 alongside the GT
  drivers, replacing the TSR line. The GT2 is the high-launch, low-spin core
  head in five lofts from a 13.5° strong 3-wood to a 21° 7-wood; the GT3 is
  the player's head with a five-position SureFit adjustable CG track; and the
  lightweight GT1 — added in February 2025 — runs the ladder out to a 24°
  9-wood for moderate swing speeds. Every head carries the 16-setting SureFit
  hosel. The GTS fairways replaced the line in June 2026.
variants:
  - name: GT1
    description: >
      Added February 2025: the lightweight, highest-launching head for
      moderate swing speeds, in four lofts including the family's only 24°
      9-wood, with a sub-45-gram stock shaft and lighter grip.
  - name: GT2
    description: >
      The core head for most players — high launch with low spin and a fixed
      rear weight — in five lofts including a 13.5° strong 3-wood.
  - name: GT3
    description: >
      The player's head: mid launch, low spin and the SureFit Adjustable CG
      Track, a sliding 12 g (nominal) weight with five positions from H2
      (heel) to T2 (toe) for shape bias tuning.
