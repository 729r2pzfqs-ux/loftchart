faq:
  - q: "What lofts do the Titleist GT fairway woods come in?"
    a: "The GT2 comes in 13.5, 15, 16.5, 18 and 21 degrees; the GT3 in 15, 16.5 and 18; and the lightweight GT1 in 15, 18, 21 and 24."
  - q: "What is the Titleist GT fairway adjustment chart?"
    a: "Every head uses the 16-setting SureFit hosel: loft from minus 0.75 to plus 1.5 degrees and lie from 0.75 degrees flat to 1.5 degrees upright, adjusted independently. A1 is standard for right-handers. The GT3 adds a five-position sliding CG track for shape bias."
  - q: "What is the difference between the GT2 and GT3 fairway woods?"
    a: "The GT2 is the larger, higher-launching head with a fixed rear weight, in five lofts. The GT3 is the more compact player's head with the SureFit adjustable CG track, in three lofts, flighting lower with more workability."
