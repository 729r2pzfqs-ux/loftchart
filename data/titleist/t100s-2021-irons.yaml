description: >
  The second-generation T100S was announced in August 2021 alongside the 2021
  T100, and is that iron's strong-lofted variant: the same forged dual cavity
  head with denser D18 tungsten brazed into the heel and toe of the long and
  mid irons, set two degrees stronger through the whole set. That gives a 32
  degree 7-iron against the T100's 34 and a 44 degree pitching wedge against
  46, while lies, lengths and offsets stay identical to the T100. Lofts carry
  over unchanged from the original 2020 T100S. Titleist retired the T100S
  name in 2023, when the T150 took over the strong-lofted players slot.
