faq:
  - q: "What is the loft of a Titleist T100S (2021) 7-iron?"
    a: "The 2021 Titleist T100S 7-iron is 32 degrees, with a 63 degree lie and a 37 inch standard steel length."
  - q: "What changed between the 2020 and 2021 Titleist T100S?"
    a: "The lofts, lies, lengths and offsets are unchanged. The 2021 model adopts the second-generation T100 construction, with denser D18 tungsten brazed into the heel and toe instead of welded, for tighter centre-of-gravity control."
  - q: "What replaced the Titleist T100S (2021)?"
    a: "The T150, launched in 2023, replaced it and carries the same 32 degree 7-iron and 44 degree pitching wedge."
