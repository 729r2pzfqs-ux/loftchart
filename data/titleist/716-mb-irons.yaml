description: >
  The 716 MB continues Titleist's pure muscleback line without touching the
  numbers: 21 to 47 degrees from 3-iron to pitching wedge at the same lies and
  lengths the 712 and 714 used. What changed for this generation is the
  refinement of the sole and the offset progression, which is published to
  three decimal places and steps down from 0.126 inches at the 3-iron to 0.075
  at the pitching wedge. Figures are the men's standard right-handed steel
  build.
