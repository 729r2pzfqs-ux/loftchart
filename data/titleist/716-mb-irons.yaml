faq:
  - q: "What is the loft of a Titleist 716 MB 7-iron?"
    a: "The Titleist 716 MB 7-iron has a loft of 35 degrees, a lie of 63.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "When were Titleist 716 MB irons made?"
    a: "The 716 line was announced in 2015 and was replaced by the 718 line in 2017."
  - q: "Have Titleist MB lofts changed between generations?"
    a: "No. The 712, 714, 716 and 718 musclebacks all run 21, 24, 27, 31, 35, 39, 43 and 47 degrees from 3-iron to pitching wedge at the same lies and lengths."
  - q: "What is the difference between the 716 MB and the 716 CB?"
    a: "The MB is a full muscleback for the smallest head and most workability; the CB is a cavity back with a co-forged tungsten weight in the long irons for more forgiveness at the same lofts."
