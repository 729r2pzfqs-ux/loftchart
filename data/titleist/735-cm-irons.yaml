description: >
  The Forged 735.CM was Titleist's first off-the-shelf combo set, shipping to
  shops on 15 August 2005. The set blends seamlessly from cavity back long
  irons through shallow-cavity mid irons to pure muscleback short irons, with
  progressive blade heights, blade lengths, offset and center of gravity
  through the set. It was sold in two forgings: 1025 carbon steel with chrome
  plating, and unplated 410 stainless steel. Lofts are traditional - a 35
  degree 7-iron and 47 degree pitching wedge - and Titleist offered the set
  as a 19 degree 2-iron plus 3-iron through pitching wedge, in right and left
  hand. The ZB of 2008 took over the blended-set slot when the AP1/AP2/ZB/ZM
  launch replaced Titleist's forged line.
