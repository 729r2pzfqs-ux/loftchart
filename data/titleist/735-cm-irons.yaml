faq:
  - q: "What is the loft of a Titleist 735.CM 7-iron?"
    a: "The Titleist Forged 735.CM 7-iron is 35 degrees, with a 63 degree lie and a 37 inch standard steel length."
  - q: "Which clubs in the Titleist 735.CM set are cavity backs and which are blades?"
    a: "The long irons are full cavity backs, the mid irons carry a shallow cavity and the short irons from the 8-iron down are pure musclebacks, blended progressively so the transition is seamless."
  - q: "What is the difference between the chrome and stainless Titleist 735.CM versions?"
    a: "The chrome version is forged from 1025 carbon steel and chrome plated for a softer feel; the stainless version is forged from unplated 410 stainless steel, which is more durable and slightly cheaper. Specs are the same."
