faq:
  - q: "What is the loft of a Titleist DCI 962B 7-iron?"
    a: "The Titleist DCI 962B 7-iron has a loft of 36 degrees, with a 63-degree lie and a 36.75-inch standard steel length."
  - q: "What is the difference between the DCI 962 and the DCI 962B?"
    a: "Lofts, lies and lengths are identical; the 962B cuts offset for the better player — 0.120 against 0.160 inches at the 1-iron and 0.080 against 0.100 at the 7-iron — giving a squarer, more blade-like address view."
  - q: "What shafts came standard in the Titleist DCI 962B?"
    a: "True Temper Dynamic Gold in steel, with Titleist Select as the graphite option, under a Titleist Tour Wrap Full Cord grip."
