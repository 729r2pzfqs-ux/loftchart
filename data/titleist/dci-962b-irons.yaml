description: >
  The DCI 962B is the reduced-offset, better-player version of the 1997 DCI
  962, and the first of Titleist's cast B-series irons that led to the DCI
  990B. Lofts, lies and lengths are identical to the standard 962 — a
  36-degree 7-iron and a 48-degree pitching wedge from a 1-iron through
  pitching wedge range — but offset is trimmed throughout, 0.080 against
  0.100 inches at the 7-iron, with a flat 0.120 inches across the 1 to 3
  irons, for a squarer, blade-like look at address. Figures are the men's
  standard steel build.
