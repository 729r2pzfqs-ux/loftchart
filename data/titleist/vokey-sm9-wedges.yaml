faq:
  - q: "What lofts does the Titleist Vokey SM9 come in?"
    a: "The Vokey SM9 was sold from 46 to 62 degrees in 2-degree steps — 25 loft, bounce and grind combinations."
  - q: "What grinds does the Vokey SM9 offer?"
    a: "Seven: F (46-56 degrees), S (54-60), M (56-62), D (54-60), K (58-60), the low-bounce L (60 only) and the T grind (58-60), which moved from WedgeWorks into the standard line with this generation."
  - q: "Is the Vokey SM9 still in production?"
    a: "No — the SM10 replaced it in March 2024. SM9 wedges remain plentiful on the used market, and the loft, bounce and grind stamped on each head make used examples easy to identify against this chart."
  - q: "What is the difference between the SM9 L grind and T grind?"
    a: "Both carry 4 degrees of bounce at 60 degrees. The T grind has the narrowest sole in the lineup with maximum heel, toe and trailing-edge relief; the L is a slightly wider low-bounce sole for firm conditions. The SM9 was the only generation to offer both in the standard line."
