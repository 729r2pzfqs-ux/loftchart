description: >
  The SM9 is the 2022 generation of the Vokey Design line, announced in
  January 2022 and at retail from March 2022 until the SM10 replaced it in
  March 2024. It raised the forward centre of gravity further than the SM8
  for a lower, more controlled flight, and brought the low-bounce T grind
  from WedgeWorks into the standard line, giving a 25-combination matrix
  from 46 to 62 degrees across seven grinds (F, S, M, D, K, L, T) — the only
  Vokey generation with both L and T in line. Grooves are cut to the edge
  and the impact area is locally heat treated. Finishes were Tour Chrome,
  Brushed Steel, Jet Black and Raw.
grinds:
  - code: F
    name: F Grind
    description: >
      All-purpose grind suited to full shots and square-face shots — the
      traditional sole, the most played sand wedge on tour, and the only
      option at the strong lofts from 46 to 52 degrees.
  - code: S
    name: S Grind
    description: >
      A full sole narrowed by a trailing-edge grind for a faster feel
      through the turf. Best in neutral to firm conditions for players who
      control loft with their hands ahead or behind the ball.
  - code: M
    name: M Grind
    description: >
      Bob Vokey's favourite — for players who rotate the face open and
      closed to manufacture shots, with a shallower, sweeping swing.
  - code: D
    name: D Grind
    description: >
      Heel, toe and trailing-edge versatility with forgiveness from high
      measured bounce, for steeper attack angles and varied face positions.
  - code: K
    name: K Grind
    description: >
      The highest-bounce wedge in the lineup, with a wide full sole and
      enhanced camber — the ultimate bunker club, forgiving from softer
      sand and turf.
  - code: L
    name: L Grind
    description: >
      The lowest-bounce option, with heel, toe and trailing-edge relief for
      firm conditions and precise players with complete control at impact.
  - code: T
    name: T Grind
    description: >
      The narrowest sole in the SM9 lineup — a low-bounce grind with maximum
      heel, toe and trailing-edge relief for the ultimate in greenside
      versatility, newly promoted from WedgeWorks into the standard line.
