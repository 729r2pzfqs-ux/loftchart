faq:
  - q: "What is the loft of a Titleist 731.PM 7-iron?"
    a: "The Titleist 731.PM 7-iron is 33 degrees, with a 63 degree lie and a 37 inch standard steel length."
  - q: "What is special about the Titleist 731.PM irons?"
    a: "They were a 2002 limited edition built to Phil Mickelson's specifications, and they are the only cast muscleback set Titleist has ever produced - a blended run of cavity back long irons, muscle cavity mid irons and muscleback short irons in 431 stainless."
  - q: "Did Phil Mickelson win with the 731.PM irons?"
    a: "Yes. Mickelson had the 731.PM set in the bag when he won the 2004 Masters, his first major championship."
