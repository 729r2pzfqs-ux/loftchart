description: >
  The 731.PM is a 2002 limited-edition set designed around Phil Mickelson's
  personal iron specifications, and it remains the only cast muscleback set
  Titleist has produced. The run is a blended progression - shallow cavity
  back long irons flowing into muscle cavity mid irons and true muscleback
  short irons - cast in 431 stainless steel with a rounded toe, traditional
  V grooves and generous bounce to suit Mickelson's steep, aggressive
  delivery. Lofts are traditional with a 33 degree 7-iron and 45 degree
  pitching wedge, and the lies run notably upright, 61 degrees at the 2-iron
  through 64.5 at the wedge. Mickelson played the set into the 2004 Masters,
  giving the combo-set idea an early major win.
