faq:
  - q: "What is the loft of a Titleist 712 MB 7-iron?"
    a: "The Titleist 712 MB 7-iron has a loft of 35 degrees, a lie of 63.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "When were Titleist 712 MB irons made?"
    a: "The 712 generation was introduced in 2011 and replaced by the 714 line in 2013."
  - q: "What is the difference between the Titleist 712 MB and 712 CB?"
    a: "The MB is a full muscleback; the CB is a cavity back. They share the same lofts, lies and lengths from the 3-iron down, and the CB adds a 2-iron and carries slightly more offset in the long irons."
  - q: "What is the pitching wedge loft on the Titleist 712 MB?"
    a: "47 degrees — the traditional muscleback figure Titleist kept through the 714, 716 and 718 MB as well."
