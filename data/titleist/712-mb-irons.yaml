description: >
  The 712 MB is Titleist's muscleback for the 712 generation, forged from a
  single block of 1025 carbon steel with constant blade length through the set
  and minimal progressive offset. Lofts are traditional throughout — 35 degrees
  at the 7-iron, 47 at the pitching wedge — and the chart is the one Titleist
  then carried, essentially unchanged, through the 714, 716 and 718 musclebacks.
  Figures are the men's standard right-handed steel build.
