construction: titanium chassis under a Seamless Thermoform Crown wrapped to the sole, with Split Mass Construction moving crown savings low, forward and rearward
material: Proprietary Matrix Polymer (PMP) thermoform crown; titanium variable-thickness face with Speed Ring
predecessor: Titleist TSR
