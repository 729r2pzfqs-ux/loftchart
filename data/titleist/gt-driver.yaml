description: >
  The GT is Titleist's 2024 driver generation and the one that introduced the
  thermoform crown: 13 grams of Proprietary Matrix Polymer formed into a
  seamless crown that wraps to the sole, over a titanium chassis whose freed
  mass is split low-forward and rearward. The GT2 is the high-MOI distance
  head, the GT3 the fitter's head with a SureFit CG track moved closer to the
  face than the TSR3's, and the 430 cc GT4 the compact spin-killer with
  flippable 11 g/3 g weights. The ultralight GT1 joined in February 2025 —
  about 50 grams lighter all-in for moderate swing speeds — and it remains
  current even though the GTS generation replaced the GT2, GT3 and GT4 in
  June 2026, since no GTS1 exists.
variants:
  - name: GT1
    head_cc: 460
    description: >
      The ultra-light build, added February 2025: roughly 50 g lighter
      overall via a lighter head, 35-40 g shafts and a lighter grip, with a
      9 g interchangeable rear weight. High launch, neutral-to-slight-draw —
      and still current, as the GTS line has no "1" head.
  - name: GT2
    head_cc: 460
    description: >
      The high-MOI speed-and-forgiveness head: distance with stability across
      the face and a fixed (interchangeable for swing weight) sole weight.
  - name: GT3
    head_cc: 460
    description: >
      The fitting-driven player's head with the five-position SureFit CG
      track, moved closer to the face than on the TSR3 for a speed-first
      tune.
  - name: GT4
    head_cc: 430
    description: >
      The compact low-spin head. Flipping its 11 g front / 3 g aft weights
      trades maximum spin reduction for a more balanced, slightly
      higher-spinning profile.
