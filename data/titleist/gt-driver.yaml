faq:
  - q: "What lofts does the Titleist GT come in?"
    a: "The GT2 and GT3 come in 8, 9, 10 and 11 degrees, the GT4 in 8, 9 and 10, and the lightweight GT1 in 9, 10 and 12."
  - q: "What is the Titleist GT SureFit chart?"
    a: "The 16-setting SureFit hosel combines four loft positions (−0.75, standard, +0.75 and +1.5 degrees) with four lie positions (0.75 flat, standard, 0.75 upright and 1.5 upright). A1 is standard for right-handers; the left-hand chart mirrors with D4 as standard."
  - q: "Is the Titleist GT still in production?"
    a: "The GT2, GT3 and GT4 were replaced by the GTS generation in June 2026 and are now closeout and used-market buys. The GT1 is the exception — it stays in the Titleist catalogue because no GTS1 exists."
  - q: "What is special about the GT1?"
    a: "It is the moderate-swing-speed build of the family: about 50 grams lighter overall through a lighter head, 35-40 gram shafts and a lighter grip, with a more upright 59 degree lie and lofts up to 12 degrees. It launched in February 2025, a season after the rest of the line."
