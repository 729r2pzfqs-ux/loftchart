description: >
  The 710 AP1 is Titleist's dual-cavity game-improvement iron, with a tungsten weight
  low in the sole and the largest offset in the 710 range — 0.245 inches at the
  3-iron, more than twice the AP2's. Lofts are moderately strong for 2009 with a
  33-degree 7-iron, and the set carries a 50-degree gap wedge as stock. Titleist
  numbered the 710 range for its model year, so these were sold as the 2010 line.
