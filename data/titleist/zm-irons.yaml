faq:
  - q: "What is the loft of a Titleist ZM 7-iron?"
    a: "The Titleist ZM 7-iron is 35 degrees, with a 63 degree lie and a 37 inch standard steel length."
  - q: "How do the ZM lofts compare with the 695.MB it replaced?"
    a: "The long irons match, but the ZM is one degree stronger from the 6-iron down: a 35 degree 7-iron against 36 and a 47 degree pitching wedge against 48. The 710 MB then kept the ZM lofts unchanged."
  - q: "What is the difference between the Titleist ZM and ZB irons?"
    a: "The ZM is a muscleback throughout with minimal offset and a narrow sole, while the ZB blends cavity back long irons into muscle back short irons with slightly more offset and a wider sole in the 2-7 irons."
