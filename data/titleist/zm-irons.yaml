description: >
  The Z•M Forged ("Z Muscle") is the traditional muscleback of the four irons
  Titleist announced in January 2008 alongside the AP1, AP2 and ZB, at retail
  from 15 March 2008. Titleist's spec page lists it as forged 1020 mild carbon steel, with a compact head,
  constant blade length and a narrow sole with mild bounce, the Z back design
  placing the center of gravity in the middle of the face. Lofts moved one
  degree stronger than the 695.MB from the 6-iron down, to a 35 degree 7-iron
  and 47 degree pitching wedge, and the 710 MB that replaced it in 2009 kept
  the ZM specs unchanged. The stock set ran 3-iron through pitching wedge.
