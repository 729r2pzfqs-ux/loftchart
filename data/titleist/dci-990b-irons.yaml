faq:
  - q: "What is the loft of a Titleist DCI 990B 7-iron?"
    a: "The Titleist DCI 990B 7-iron has a loft of 36 degrees, with a 63-degree lie and a 36.75-inch standard steel length."
  - q: "What is the difference between the DCI 990 and the DCI 990B?"
    a: "Lofts, lies and lengths are identical. The 990B has a significantly narrower and flatter sole with more bounce, less offset — 0.092 against 0.103 inches at the 7-iron — and a more blade-like profile aimed at the low handicapper."
  - q: "Are the Titleist DCI 990B irons blades?"
    a: "Effectively yes for their era: Titleist described the 990B as a contemporary blade, using a shallow variable muscle-back cavity cast from 431 stainless steel rather than a full cavity back."
