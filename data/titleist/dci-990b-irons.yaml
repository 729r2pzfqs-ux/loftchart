description: >
  The DCI 990B is the better-player counterpart to the DCI 990, introduced in
  2000 for low handicappers and professionals. It reads as a contemporary
  blade: a variable muscle-back cavity over a sole that is significantly
  narrower and flatter than the standard 990's, with more bounce and less
  offset. The centre of gravity moves progressively through the set — lower
  in the long irons for launch, higher in the short irons for a flatter,
  controlled flight. Lofts match the DCI 990 exactly, with a 36-degree 7-iron
  and a 49-degree pitching wedge over a 1-iron through pitching wedge range.
  Davis Love III and Dottie Pepper won with it soon after launch.
