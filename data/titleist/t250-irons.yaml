description: >
  The T250 is the new name for the players-distance slot in Titleist's 2025
  T-Series, replacing the T200 when the line was announced in summer 2025 with
  pre-orders from 10 July and retail availability from 21 August 2025. The loft
  ladder is effectively the 2023 T200's — a 30.5-degree 7-iron, 43-degree
  pitching wedge and 48-degree W — with the 4-iron listed a degree stronger at
  22 and a new 18-degree 2-iron added at the top of the range. The head moves
  to a face and body made entirely of high-strength steel, with a forged
  L-Face insert using a V-Taper design, improved Max Impact technology behind
  the face and split high-density tungsten weighting. Lie and length are shared
  per club number across the whole 2025 T-Series. The stock set is 4-PW with
  heads offered 2-iron through the 48-degree W; a separate T250 Launch Spec
  version with roughly four-degree-weaker lofts (35-degree 7-iron) and a T250-U
  utility iron sit alongside it and are not recorded in this table. Titleist
  does not publish offset, bounce or swing weight for the 2025 T-Series, so
  those keys are omitted.
