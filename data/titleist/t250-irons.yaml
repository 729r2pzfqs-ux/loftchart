faq:
  - q: "What is the loft of a Titleist T250 7-iron?"
    a: "The Titleist T250 7-iron has a loft of 30.5 degrees, with a 63-degree lie and a 37-inch standard steel length."
  - q: "Did the T250 replace the Titleist T200?"
    a: "Yes. When Titleist announced the 2025 T-Series it renamed the players-distance model T250, replacing the 2023 T200. The mid and short-iron lofts carry over — 30.5 degrees at the 7-iron and 43 at the pitching wedge — while the 4-iron is listed one degree stronger at 22 and an 18-degree 2-iron joins the range."
  - q: "What is the Titleist T250 Launch Spec?"
    a: "A higher-launching variant of the T250 with lighter heads and lofts roughly four degrees weaker — 35 degrees at the 7-iron and 47 at the pitching wedge — offered 5-iron through a 52-degree W for players who need more height and stopping power."
  - q: "What clubs come in a stock Titleist T250 set?"
    a: "The stock set is 4-iron through pitching wedge, with a 2-iron, 3-iron and 48-degree W wedge available to extend it."
