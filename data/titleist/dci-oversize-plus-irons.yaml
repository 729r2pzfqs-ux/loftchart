description: >
  The DCI Oversize + is the standard, black-badged version of Titleist's 1996
  second-generation oversize DCI, sold alongside the lightweight DCI Oversize
  Gold. The head is a large investment cast cavity back with a heavy offset
  ladder - .240 inches at the 1-iron and still .180 at the 7-iron - and lofts
  about a degree and a half stronger than the standard DCI of the era, with a
  34.5 degree 7-iron and 47 degree pitching wedge. The scoring clubs are built
  progressively heavier, up to D8 at the sand wedge. Titleist catalogued it
  from a 1-iron through lob wedge; the oversize slot eventually passed to the
  2001 DCI 822 OS.
