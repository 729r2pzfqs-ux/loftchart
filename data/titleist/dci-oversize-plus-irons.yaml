faq:
  - q: "What is the loft of a Titleist DCI Oversize + 7-iron?"
    a: "The Titleist DCI Oversize + 7-iron is 34.5 degrees, with a 63 degree lie and a 36.75 inch standard steel length."
  - q: "What is the difference between the DCI Oversize + and the DCI Oversize Gold?"
    a: "The lofts and lies are identical. The black-badged Oversize + is the standard-weight version with Dynamic Gold steel and D2 swing weights, while the Gold is the lightweight build aimed at slower swing speeds, and the Gold carries a heavier offset ladder - .386 inches at the 1-iron against .240."
  - q: "How many clubs were in the Titleist DCI Oversize + set?"
    a: "Titleist catalogued it from a 1-iron through a 60 degree lob wedge, thirteen clubs, though typical retail sets were 3-PW."
