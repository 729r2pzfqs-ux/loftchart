sources:
  - "Titleist previous-models archived product page, titleist.com/golf-clubs/irons/dci-oversize-black, via the Internet Archive (full manufacturer table: length, loft, lie, offset, swing weight - Titleist's own page titles this model 'DCI Oversize + Black')"
