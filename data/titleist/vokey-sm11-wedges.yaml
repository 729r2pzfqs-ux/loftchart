description: >
  The SM11 is the 2026 generation of the Vokey Design wedge line, announced on
  19 January 2026 and at retail worldwide from 20 February 2026. The matrix
  runs 27 loft/bounce/grind combinations across 44 to 60 degrees and six
  grinds (F, S, M, D, K, T), with the low-bounce 06K lob option in the line
  from launch and a new 44.10F pitching-wedge loft. Against the SM10 the
  high-bounce K lob models drop from 14 to 12 degrees of bounce, centre of
  gravity is matched across grinds within each loft, and the faces get three
  shot-specific groove shapes with around five percent more groove volume and
  a new directional face texture. Finishes are Tour Chrome, Nickel and a new
  Jet Black, with Raw available through custom order.
grinds:
  - code: F
    name: F Grind
    description: >
      Traditional full sole for full swings and square-face shots — the
      forgiving, confidence-first grind, and the only option at the strong
      lofts from 44 to 52 degrees.
  - code: S
    name: S Grind
    description: >
      Full sole narrowed by a trailing-edge grind so it moves faster through
      the turf. For players who control loft with their hands ahead of or
      behind the ball, in neutral to firm conditions.
  - code: M
    name: M Grind
    description: >
      Bob Vokey's favourite — heel, toe and trailing-edge relief for players
      who rotate the face open and closed to manufacture greenside shots.
  - code: D
    name: D Grind
    description: >
      The player's high-bounce wedge. A forward bounce angle protects steeper
      swings in softer and grainier conditions, and opening the face lowers
      the leading edge.
  - code: K
    name: K Grind
    description: >
      Wide full sole with enhanced camber, shaped for forgiveness. The 12K is
      the bunker club that resists digging in soft sand and turf; the
      low-bounce 06K brings the same shape to tighter, firmer lies.
  - code: T
    name: T Grind
    description: >
      Low bounce with maximum heel, toe and trailing-edge relief so the club
      hugs the ground. For sharper shotmaking in firm conditions.
