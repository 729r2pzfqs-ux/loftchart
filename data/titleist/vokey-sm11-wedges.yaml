faq:
  - q: "What lofts does the Titleist Vokey SM11 come in?"
    a: "The Vokey SM11 is sold from 44 to 60 degrees in 2-degree steps — 27 loft, bounce and grind combinations in all. The 44-degree pitching wedge loft is new for SM11."
  - q: "What grinds does the Vokey SM11 offer?"
    a: "Six grinds: F (full sole, 44-56 degrees), S (narrowed full sole, 54-60), M (heel and toe relief, 54-60), D (player's high bounce, 54-60), K (wide high-bounce sole at 12 degrees plus the low-bounce 06K, 58-60) and T (low bounce, 58-60)."
  - q: "What bounce options does the SM11 have at 58 and 60 degrees?"
    a: "Six at each loft: 4 degrees (T grind), 6 degrees (K grind), 8 degrees (M), 10 degrees (S) and 12 degrees in both the D and K grinds."
  - q: "What changed from the Vokey SM10 to the SM11?"
    a: "The low-bounce 06K lob grind joined the standard line, a 44-degree F grind was added, the high-bounce K models moved from 14 to 12 degrees of bounce, centre of gravity was matched across grinds at each loft, and the grooves were recut in three shot-specific shapes with more volume."
