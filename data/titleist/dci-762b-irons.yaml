description: >
  The DCI 762B is the 2002 better-player companion to the dual-cavity DCI 762,
  continuing the B-model formula Titleist began with the DCI 962B: a smaller
  blade, a thinner topline and much less offset than the standard model. Where
  the 762 runs distance lofts with a 34 degree 7-iron, the 762B keeps a
  traditional ladder with a 36 degree 7-iron and a 48 degree pitching wedge,
  and its offset tapers from .148 inches at the 2-iron to .082 inches at the
  wedge. It was catalogued from a 2-iron through pitching wedge, every club at
  D2, and was the last of the DCI B-models before Titleist moved the line to
  the forged 690 and 704 families.
