faq:
  - q: "What is the loft of a Titleist DCI 762B 7-iron?"
    a: "The Titleist DCI 762B 7-iron is 36 degrees, with a 63 degree lie and a 37 inch standard steel length."
  - q: "What is the difference between the Titleist DCI 762 and DCI 762B?"
    a: "The 762B is the better-player version: a smaller head, thinner topline, less offset and weaker, traditional lofts. Its 7-iron is 36 degrees against 34 on the standard 762, and its pitching wedge is 48 degrees against 46."
  - q: "Was the Titleist DCI 762B a blade?"
    a: "Not a pure muscleback - it kept a shallow rear cavity - but Titleist positioned the B-models as its blade-like option for skilled players, with a compact head and minimal offset, and it played closer to a blade than any other DCI."
