model: TSR
slug: tsr-fairway-wood
club_type: fairway_wood
year_introduced: 2022
year_discontinued: 2024
category: flagship
construction: steel bodies with Titleist's open-hosel construction; SureFit adjustable CG track on the TSR3
material: high-strength steel faces with variable thickness
predecessor: Titleist TSi
successor: Titleist GT
description: >
  The TSR fairway metals reached retail in late 2022 alongside the TSR
  drivers. The TSR2 is the core four-loft head; the TSR2+ is a single 13°
  tee-biased strong 3-wood with a taller face; the TSR3 is the compact
  player's head with a five-position SureFit adjustable CG track, sold down
  to 13.5°; and the lightweight TSR1 — added with the TSR1 driver in February
  2023 — runs weaker lofts for moderate swing speeds. Every head carries the
  16-setting SureFit hosel. The GT fairways replaced the line in August 2024.
variants:
  - name: TSR1
    description: >
      Added with the TSR1 driver in February 2023: the lightweight
      high-launch model for moderate swing speeds, in 15, 18, 20 and 23
      degrees with sub-50-gram stock shafts.
  - name: TSR2
    description: >
      The core head for most players — deep CG, high launch — in 15, 16.5, 18
      and 21 degrees (21° left-handed by custom order only).
  - name: TSR2+
    description: >
      A single 13° strong 3-wood with a larger profile and taller face, built
      as a forgiving tee club and second driver.
  - name: TSR3
    description: >
      The compact player's head with the five-position SureFit adjustable CG
      track, in 13.5, 15, 16.5 and 18 degrees (15 and 16.5 left-handed).
