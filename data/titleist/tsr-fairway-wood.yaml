faq:
  - q: "What lofts do the Titleist TSR fairway woods come in?"
    a: "The TSR2 comes in 15, 16.5, 18 and 21 degrees; the TSR2+ in a single 13; the TSR3 in 13.5, 15, 16.5 and 18; and the lightweight TSR1 in 15, 18, 20 and 23."
  - q: "What is the difference between the TSR2 and TSR2+ fairway woods?"
    a: "The TSR2+ is a single 13 degree head with a larger profile and taller face, built as a tee-biased strong 3-wood — closer to a mini driver in intent. The TSR2 is the conventional fairway line from 15 degrees up."
  - q: "Is the Titleist TSR fairway wood adjustable?"
    a: "Yes — every head uses the 16-setting SureFit hosel (loft minus 0.75 to plus 1.5 degrees, lie 0.75 flat to 1.5 upright, independently). The TSR3 adds a five-position sliding CG track for shape bias."
