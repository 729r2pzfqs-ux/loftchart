faq:
  - q: "What is the loft of a Titleist 712 CB 7-iron?"
    a: "The Titleist 712 CB 7-iron has a loft of 35 degrees, a lie of 63.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "When were Titleist 712 CB irons made?"
    a: "The 712 generation was introduced in 2011 and replaced by the 714 line in 2013."
  - q: "Does the Titleist 712 CB come in a 2-iron?"
    a: "Yes. The CB set extends to an 18-degree 2-iron at 39.50 inches, which the 712 MB does not offer."
  - q: "How much more offset does the 712 CB have than the 712 MB?"
    a: "About 0.015 inches in the long irons — 0.140 against 0.125 at the 3-iron — converging to identical figures from the 6-iron down."
