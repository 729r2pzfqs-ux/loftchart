description: >
  The 712 CB is the cavity back that sits alongside the 712 MB, forged from
  1025 carbon steel with a high-density tungsten weight co-forged into the toe
  of the long irons. It shares the muscleback's loft, lie and length chart
  exactly from the 3-iron down and extends the set upward with an 18-degree
  2-iron. Offset is marginally greater than the MB's, 0.140 inches at the
  3-iron against 0.125. Figures are the men's standard right-handed steel build.
