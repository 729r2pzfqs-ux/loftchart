faq:
  - q: "What lofts does the Titleist Vokey SM8 come in?"
    a: "The Vokey SM8 was sold from 46 to 62 degrees in 2-degree steps — 23 loft, bounce and grind combinations."
  - q: "What grinds does the Vokey SM8 offer?"
    a: "Six in the standard line: F (46-56 degrees), S (54-60), M (56-62), D (54-60), K (58-60) and the low-bounce L at 60 degrees only. The T grind was a WedgeWorks custom in this generation."
  - q: "Is the Vokey SM8 still in production?"
    a: "No — the SM9 replaced it in early 2022, two generations ago. The used market is the only source, and SM8s remain among the most traded wedges on it."
  - q: "What bounce options does the SM8 have at 58 and 60 degrees?"
    a: "At 58 degrees: 8 (M), 10 (S), 12 (D) and 14 (K). At 60 degrees those four plus the 4-degree L grind."
