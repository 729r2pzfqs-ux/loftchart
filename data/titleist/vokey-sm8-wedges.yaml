description: >
  The SM8 is the 2020 generation of the Vokey Design line, at retail from
  March 2020 until the SM9 replaced it in early 2022. Its reimagined
  progressive centre of gravity — pushed forward ahead of the face — made it
  the most accurate and forgiving Vokey to that point, with grooves cut to
  the edge and a heat-treated impact area for durability. The standard
  matrix ran 23 loft/bounce/grind combinations from 46 to 62 degrees across
  six grinds (F, S, M, D, K, L); the low-bounce T grind was still a
  WedgeWorks custom in this generation. Finishes were Tour Chrome, Brushed
  Steel, Jet Black, Raw and a premium Slate Blue.
grinds:
  - code: F
    name: F Grind
    description: >
      The all-purpose wedge grind for full wedge shots — a traditional sole
      suited to square-face swings, and the only option at the strong lofts
      from 46 to 52 degrees.
  - code: S
    name: S Grind
    description: >
      A narrow and versatile grind — a full sole trimmed by a trailing-edge
      grind, best in neutral to firm conditions.
  - code: M
    name: M Grind
    description: >
      The multi-purpose grind for versatility — Bob Vokey's favourite, for
      players who rotate the face to manufacture greenside shots.
  - code: D
    name: D Grind
    description: >
      The player's high-bounce grind — heel, toe and trailing-edge
      versatility with forgiveness from high measured bounce, for steeper
      attack angles.
  - code: K
    name: K Grind
    description: >
      The ultimate bunker club — the highest bounce in the lineup on a
      wide, cambered full sole.
  - code: L
    name: L Grind
    description: >
      Precision for skilled shotmakers — the lowest-bounce option, offered
      only as the 60.04, for firm conditions and complete control at impact.
