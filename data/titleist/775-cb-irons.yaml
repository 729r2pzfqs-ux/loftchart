description: >
  The Forged 775.CB is the largest and most forgiving iron of Titleist's
  2006 forged line, announced alongside the 695.CB and 695.MB and in shops
  from spring 2006. It extends the blended-set concept of the 735.CM to an
  oversize chassis: multi-material channel back long irons with pronounced
  offset transition seamlessly to mid-size, more traditional short irons.
  Forged from 410 stainless steel rather than carbon steel, it is more durable
  and can be bent for custom fitting. Lofts are the strongest of the era's
  Titleist irons, with a 33 degree 7-iron and a 45 degree pitching wedge, and
  the stock set ran 3-iron through a 50 degree gap wedge - a ladder the AP1
  that replaced it in 2008 kept unchanged.
