faq:
  - q: "What is the loft of a Titleist 775.CB 7-iron?"
    a: "The Titleist Forged 775.CB 7-iron is 33 degrees, with a 63 degree lie and a 37 inch standard steel length."
  - q: "Is the Titleist 775.CB forged from carbon steel?"
    a: "No. It is forged from 410 stainless steel, which is harder and more durable than the 1025 carbon steel Titleist used elsewhere, and needs no chrome plating."
  - q: "How much offset does the Titleist 775.CB have?"
    a: "A lot for a Titleist forging: 0.295 inches at the 3-iron tapering to 0.095 inches at the gap wedge, roughly double the 695.CB and the most of any Titleist iron of its generation apart from the AP1 that replaced it."
