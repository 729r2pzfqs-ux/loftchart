description: >
  The 718 T-MB carries the hollow-body concept of the 716 T-MB into Titleist's
  718 line, keeping the muscleback-style profile over a thin, fast face while
  adding more high-density tungsten in the heel and toe for a lower centre of
  gravity and higher MOI. Unlike its predecessor, which was pitched mainly as
  a utility long iron, the 718 T-MB was offered worldwide as a full set from a
  17-degree 2-iron through the 45-degree pitching wedge and a 50-degree wedge.
  Lofts, lies and lengths carry over unchanged from the 716 T-MB, with a
  33-degree 7-iron sitting two degrees stronger than the 718 MB and CB. It
  left the line when the 2019 T-Series arrived, with the U500 utility iron
  taking over the hollow-body long-iron role. Figures are the men's standard
  right-handed steel build.
