faq:
  - q: "What is the loft of a Titleist 718 T-MB 7-iron?"
    a: "The 718 T-MB 7-iron has a loft of 33 degrees, a lie of 63 degrees and a steel-shaft length of 37 inches — two degrees stronger than the 718 MB and CB."
  - q: "Was the 718 T-MB sold as a full set?"
    a: "Yes. Unlike the 716 T-MB, which Titleist pitched mainly as a utility long iron, the 718 T-MB was offered worldwide from a 17-degree 2-iron through the 45-degree pitching wedge, plus a 50-degree W."
  - q: "What changed from the 716 T-MB to the 718 T-MB?"
    a: "The lofts, lies and lengths carried over unchanged; the 718 added more high-density tungsten in the heel and toe for a lower centre of gravity and higher MOI, and full sets became available in all markets."
  - q: "What replaced the Titleist 718 T-MB?"
    a: "The 2019 T-Series. Titleist's U500 utility iron took over the hollow-body long-iron role, with the T200 covering the players-distance set."
