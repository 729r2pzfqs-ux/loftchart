faq:
  - q: "What lofts do the Titleist GT hybrids come in?"
    a: "The GT2 comes in 18, 21 and 24 degrees; the GT3 in 19, 21 and 24; and the lightweight GT1 in 20, 23, 26 and 29."
  - q: "Are the Titleist GT hybrids adjustable?"
    a: "Yes — every head uses the 16-setting SureFit hosel, with loft from minus 0.75 to plus 1.5 degrees and lie from 0.75 degrees flat to 1.5 degrees upright, adjusted independently. The GT3 also swaps an 11 gram aft weight and 3 gram forward weight to tune flight."
  - q: "What is the difference between the GT2 and GT3 hybrids?"
    a: "The GT2 is the larger, higher-launching head starting at 18 degrees. The GT3 is the compact player's shape starting at 19 degrees, flighting lower, with the interchangeable sole weights the GT2 does not have."
