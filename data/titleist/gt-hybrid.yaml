description: >
  The GT hybrids followed the GT woods to retail in late 2024, with the
  lightweight GT1 joining in February 2025. The GT2 is the larger,
  easier-launching head in 18°, 21° and 24°; the GT3 is the compact player's
  head in 19°, 21° and 24° with an 11 g aft / 3 g forward interchangeable
  weight pair for flight tuning; and the GT1 is the lightweight high-launch
  model running 20° to 29° for moderate swing speeds. Every head carries the
  16-setting SureFit hosel. The GTS generation has so far covered drivers and
  fairways only, so the GT hybrids remain Titleist's current line.
variants:
  - name: GT1
    description: >
      The lightweight high-launch head for moderate swing speeds, in four
      lofts from 20° to 29°, built with sub-50-gram stock shafts.
  - name: GT2
    description: >
      The core head: a touch larger, higher-launching, built to replace long
      irons directly, in 18°, 21° and 24°.
  - name: GT3
    description: >
      The compact player's head in 19°, 21° and 24° (108, 109 and 106 cc),
      with interchangeable 11 g aft and 3 g forward weights to move flight
      and spin.
