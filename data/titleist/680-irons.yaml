description: >
  The Forged 680 is the compact tour blade Titleist released in 2003 to run
  alongside the larger 690.MB, aimed at players wanting a smaller head for
  workability and trajectory control. It carries a slightly higher muscle
  position than the 690.MB for a slightly flatter ball flight, reduced
  offset, a classic profile with a thin topline and shallow heel, and a
  narrow sole with reduced bounce and moderate camber for players who pick
  the ball. Lofts are fully traditional - a 36 degree 7-iron and 48 degree
  pitching wedge - and the set ran from a 19 degree 2-iron through the
  pitching wedge, in right hand only. Long a favourite of tour players such
  as Adam Scott and Webb Simpson, it became a custom-order-only model by late
  2005 and left the line as the 695 generation took over; Titleist reissued
  it as a limited-edition custom order in June 2025.
