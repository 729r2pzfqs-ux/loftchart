faq:
  - q: "What is the loft of a Titleist Forged 680 7-iron?"
    a: "The Titleist Forged 680 7-iron is 36 degrees, with a 63 degree lie and a 37 inch standard steel length."
  - q: "What is the difference between the Titleist Forged 680 and the 690.MB?"
    a: "The 680 is more compact with reduced offset and a slightly higher muscle position, producing a flatter, more workable flight; the 690.MB is the slightly larger, more conventional muscleback of the same era. The 680 also runs one degree weaker through the mid irons, with a 36 degree 7-iron."
  - q: "Which tour players used the Titleist 680 irons?"
    a: "Adam Scott put them in play when they debuted around 2003 and used them for well over a decade, and Webb Simpson carried 680 MB mid and short irons long after the model was discontinued. Titleist reissued the 680 as a limited edition in 2018."
