description: >
  The 620 MB is Titleist's muscle back, a single-piece 1025 carbon forging with the
  least offset in the range — 2.3 mm at the 3-iron falling to under a millimetre at
  the pitching wedge. Lofts are the weakest Titleist sells, and identical to the 620 CB
  sold alongside it: a 35-degree 7-iron and a 47-degree pitching wedge, six degrees
  weaker at the 7-iron than the T200 of the same period. It is sold 4-PW as standard,
  with a 3-iron available.
