description: >
  The fourth-generation T100 is the tour players model of the 2025 T-Series,
  announced in summer 2025 with pre-orders from 10 July and retail availability
  from 21 August 2025. It is the first T100 to change its loft ladder: every
  club is one degree stronger than the previous three generations, giving a
  33-degree 7-iron and a 45-degree pitching wedge, which closes the old
  two-degree gap to the T150 to a single degree. The fully forged head keeps a
  progressive dual-cavity construction with split high-density tungsten
  weighting, adds a new muscle channel in the 3- and 4-irons to lower long-iron
  CG, and pairs a variable face thickness design with more aggressive grooves
  in the mid and short irons. Lie and length are shared per club number across
  the whole 2025 T-Series, so a T100 7-iron sits at 63 degrees and 37 inches
  like every other model in the range. Heads run 3-iron through a 49-degree W
  wedge (recorded here as GW to match the earlier T100 records), with 4-PW the
  stock set. Titleist does not publish offset, bounce or swing weight for the
  2025 T-Series, so those keys are omitted.
