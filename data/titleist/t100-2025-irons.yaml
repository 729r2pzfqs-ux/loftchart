faq:
  - q: "What is the loft of a Titleist T100 (2025) 7-iron?"
    a: "The 2025 T100 7-iron has a loft of 33 degrees, with a 63-degree lie and a 37-inch standard steel length."
  - q: "Are the 2025 T100 lofts stronger than the 2023 T100?"
    a: "Yes, by one degree at every club — the first loft change in the T100's history. The 7-iron moves from 34 to 33 degrees and the pitching wedge from 46 to 45."
  - q: "What is the difference between the 2025 T100 and T150?"
    a: "The T150 is the same forged dual-cavity concept in a slightly larger head with a muscle channel through the 7-iron rather than just the long irons, and its lofts run one degree stronger — 32 degrees at the 7-iron against the T100's 33."
  - q: "What clubs come in a stock Titleist T100 (2025) set?"
    a: "The stock set is 4-iron through pitching wedge, with a 3-iron and a 49-degree W wedge available to extend it."
