predecessor: Titleist TS
successor: Titleist TSR
description: >
  The TSi is Titleist's 2020-2022 driver generation, remembered for its ATI
  425 aerospace-titanium face — an alloy from a single Pittsburgh foundry,
  roughly 30% more ductile than standard 6-4 titanium, used across all four
  heads. The TSi2 (high launch, forgiveness-first) and TSi3 (traditional
  pear shape, and Titleist's first driver with the five-position SureFit CG
  track) arrived in November 2020; the ultralight TSi1 and the compact
  low-spin TSi4 followed in early 2021. The TSi3 in particular became one of
  the most-played drivers on tour of its era. The TSR generation replaced
  the family in late 2022.
variants:
  - name: TSi1
    head_cc: 460
    description: >
      The ultra-lightweight head — about 40 g lighter than a standard build —
      with high launch and slight draw bias for swing speeds up to roughly
      90 mph. 9° and 12° are right-hand only; left-hand stock is 10°.
  - name: TSi2
    head_cc: 460
    description: >
      The high-launch, forgiveness-first distance head. The 8° head had
      limited availability and was dropped from later catalogues.
  - name: TSi3
    head_cc: 460
    description: >
      The mid-launch, pear-shaped fitter's head — Titleist's first driver
      with the five-position SureFit CG track (two heel, neutral, two toe
      positions).
  - name: TSi4
    head_cc: 430
    description: >
      The smallest, lowest-spinning head of the family for high-spin fast
      swingers, with a −4 g to +4 g interchangeable headweight kit. 8° and
      10° are right-hand only; left-hand stock is 9°.
