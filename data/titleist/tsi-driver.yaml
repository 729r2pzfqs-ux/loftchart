faq:
  - q: "What lofts does the Titleist TSi come in?"
    a: "The TSi2 came in 8, 9, 10 and 11 degrees (the 8 was later dropped); the TSi3 and TSi4 in 8, 9 and 10; and the lightweight TSi1 in 9, 10 and 12."
  - q: "What is the Titleist TSi SureFit chart?"
    a: "The 16-setting SureFit hosel combines four loft positions (−0.75, standard, +0.75 and +1.5 degrees) with four lie positions (0.75 flat, standard, 0.75 upright and 1.5 upright). A1 is standard for right-handers; the left-hand chart mirrors with D4 as standard."
  - q: "What was special about the TSi face?"
    a: "All four TSi heads used ATI 425 aerospace titanium, an alloy about 30% more ductile than the usual 6-4 titanium, which let Titleist push a thinner, faster face while staying within the rules. Titleist stopped naming the face alloy in later generations."
  - q: "Is the Titleist TSi still in production?"
    a: "No — it ran from late 2020 to 2022, when the TSR replaced it. It remains common on the used market, and its SureFit sleeve means shafts from any TS through GTS generation fit."
