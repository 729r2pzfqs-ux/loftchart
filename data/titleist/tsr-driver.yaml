faq:
  - q: "What lofts does the Titleist TSR come in?"
    a: "The TSR2 comes in 8, 9, 10 and 11 degrees; the TSR3 and TSR4 in 8, 9 and 10; and the lightweight TSR1 in 9, 10 and 12."
  - q: "What is the Titleist TSR SureFit chart?"
    a: "The 16-setting SureFit hosel combines four loft positions (−0.75, standard, +0.75 and +1.5 degrees) with four lie positions (0.75 flat, standard, 0.75 upright and 1.5 upright). A1 is standard for right-handers; the left-hand chart mirrors with D4 as standard."
  - q: "What is the difference between the TSR2 and TSR3?"
    a: "The TSR2 is the forgiveness-first distance head with a fixed weight and a Multi-Plateau variable-thickness face; the TSR3 is the smaller precision head with the five-position SureFit CG track for heel-to-toe bias fitting."
  - q: "Is the Titleist TSR still in production?"
    a: "No — it ran from 2022 to 2024, when the GT replaced it, so the used market is the main source. Its SureFit sleeve interchanges with both older TSi/TS and newer GT/GTS shafts."
