construction: all-titanium construction with per-head aerodynamic shaping; SureFit CG track on the TSR3, flippable front/back weights on the TSR4
material: titanium body and variable-thickness titanium face (Multi-Plateau VFT on the TSR2)
predecessor: Titleist TSi
successor: Titleist GT
description: >
  The TSR is Titleist's 2022-2024 driver generation — the last all-titanium
  one before the thermoform-crowned GT. The TSR2 is the straight-distance
  head with a Multi-Plateau variable-thickness face that keeps speed on
  off-centre strikes; the TSR3 is the precision head with the five-position
  SureFit CG track; and the 430 cc TSR4 is the ultra-low-spin head whose
  front weight can be flipped rearward for a more forgiving profile. The
  ultralight TSR1 joined in February 2023 for swing speeds under about
  90 mph. The TSR2, TSR3 and TSR4 reached shops in late September 2022 and
  the family was replaced by the GT in August 2024, making it a staple of
  the current used market.
variants:
  - name: TSR1
    head_cc: 460
    description: >
      The ultra-lightweight aero head, about 40 g lighter than a standard
      build, for swing speeds under roughly 90 mph; high launch at a longer
      45.75 inch build. Left-handed stock is 10° only.
  - name: TSR2
    head_cc: 460
    description: >
      The straight-distance head: high launch, low spin and maximum
      forgiveness from the Multi-Plateau VFT face.
  - name: TSR3
    head_cc: 460
    description: >
      The precision head for consistent strikers — mid launch, low spin, with
      the five-position SureFit CG track for bias tuning.
  - name: TSR4
    head_cc: 430
    description: >
      The compact spin-killer. Weight forward is maximum spin reduction;
      flipped rearward it plays closer to a "TSR3.5". The left-hand model
      arrived in spring 2023.
