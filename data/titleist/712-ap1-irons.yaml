description: >
  The 712 AP1 is the second-generation model of Titleist's Advanced Performance
  game-improvement iron, announced on 13 September 2011 and at retail from 18
  November 2011 as the 2012 line. It keeps the multi-material dual-cavity
  construction of the 710 AP1, with a redesigned stainless steel soleplate and
  an integrated tungsten nickel sole weight that Titleist credited with a 4
  percent MOI increase in the long irons, plus a co-moulded elastomer and
  aluminium Tuned Feel insert. The short irons gained a progressively reduced
  blade length for a more traditional look. Lofts carried over from the 710
  AP1 unchanged — a 33-degree 7-iron, 45-degree pitching wedge and a 50-degree
  wedge that Titleist badged W, recorded here as GW to match the neighbouring
  AP1 records. Unusually, Titleist published per-club bounce for this set,
  running from 1 degree at the 3-iron to 7 at the gap wedge. The 714 AP1
  replaced it in 2013.
