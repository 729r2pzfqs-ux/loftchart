faq:
  - q: "What is the loft of a Titleist 712 AP1 7-iron?"
    a: "The Titleist 712 AP1 7-iron has a loft of 33 degrees, a lie of 63 degrees and a standard steel length of 37 inches."
  - q: "Did the 712 AP1 change lofts from the 710 AP1?"
    a: "No. The ladder carried over unchanged — 20 degrees at the 3-iron, 33 at the 7-iron, 45 at the pitching wedge and a 50-degree gap wedge — with the changes coming in weighting, MOI and the reshaped short irons."
  - q: "What shafts came stock on the Titleist 712 AP1?"
    a: "True Temper Dynalite Gold XP in steel and a Tour AD by Graphite Design made exclusively for Titleist in graphite, with a Golf Pride-made Titleist Tour Velvet grip."
  - q: "When were Titleist 712 AP1 irons made?"
    a: "Titleist announced them on 13 September 2011 with retail availability from 18 November 2011, selling them as the 2012 line until the 714 AP1 arrived in 2013."
