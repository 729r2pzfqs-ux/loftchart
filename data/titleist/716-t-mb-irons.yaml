faq:
  - q: "What is the loft of a Titleist 716 T-MB 7-iron?"
    a: "The Titleist 716 T-MB 7-iron has a loft of 33 degrees, a lie of 63.0 degrees and a steel-shaft length of 37.00 inches — two degrees stronger than the 716 MB and CB."
  - q: "What is the Titleist 716 T-MB?"
    a: "A hollow-body iron in the 716 line that looks like a muscleback at address but hides a thin, fast face and high-density tungsten heel and toe weights, making it far more forgiving and longer than its size suggests. Titleist pitched it mainly as a long-iron and hybrid replacement."
  - q: "Was the 716 T-MB sold as a full set?"
    a: "The spec chart runs from a 17-degree 2-iron to a 45-degree pitching wedge, but Titleist marketed it primarily as individual long irons; full sets were available in some markets such as Japan. Its successor, the 718 T-MB, was offered as a full set worldwide."
  - q: "When was the Titleist 716 T-MB made?"
    a: "The 716 line reached retail in September 2015 and was replaced by the 718 line, including a new 718 T-MB, in 2017."
