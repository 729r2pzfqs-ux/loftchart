description: >
  The 716 T-MB is the hollow-body model of Titleist's 716 line — a head with the
  blade length and profile of the 716 AP2 but a hollow structure behind a thin,
  high-strength face, with high-density tungsten packed into the heel and toe to
  drop the centre of gravity and raise MOI. Titleist marketed it primarily as a
  long-iron and hybrid replacement, though the spec chart runs a full 2-iron
  through pitching wedge and full sets were sold in some markets, notably Japan.
  Lofts are stronger than the 716 MB and CB — a 33-degree 7-iron and 45-degree
  pitching wedge against the musclebacks' 35 and 47 — with a 17-degree 2-iron at
  the top of the range that became a popular tour driving iron. The 716 line
  reached retail in the autumn of 2015 and was replaced by the 718 line in 2017,
  where the T-MB continued with more tungsten and worldwide full-set
  availability. Figures are the men's standard right-handed steel build.
