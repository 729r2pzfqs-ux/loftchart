description: >
  The second-generation T350 is the game-improvement model of the 2025
  T-Series, announced in summer 2025 with pre-orders from 10 July and retail
  availability from 21 August 2025. The loft ladder carries over from the 2023
  T350 unchanged — a 29-degree 7-iron, 43-degree pitching wedge and wedges at
  48 and 53 degrees — while the head is re-engineered with a high-strength
  steel face and body around a hollow construction, a forged L-Face insert
  with a multi-zone taper, improved Max Impact technology and split
  high-density tungsten perimeter weighting in a sleeker shape than before.
  Lie and length are shared per club number across the whole 2025 T-Series.
  Titleist sells it 5-iron through pitching wedge as stock, with a 4-iron and
  the two wedges (badged W and W2, recorded here as W48 and W53 to match the
  earlier T350 record) available to extend the set. Titleist does not publish
  offset, bounce or swing weight for the 2025 T-Series, so those keys are
  omitted.
