faq:
  - q: "What is the loft of a Titleist T350 (2025) 7-iron?"
    a: "The 2025 T350 7-iron has a loft of 29 degrees, with a 63-degree lie and a 37-inch standard steel length."
  - q: "Did the T350 lofts change for 2025?"
    a: "No. The 2025 T350 keeps the 2023 ladder exactly, from 20 degrees at the 4-iron through the 29-degree 7-iron to the 48 and 53-degree wedges."
  - q: "What is the difference between the T350 and the T250?"
    a: "Both use a hollow high-strength steel body with a forged L-Face insert, but the T350 is the larger, more forgiving head with weaker lofts (29 degrees at the 7-iron against 30.5), a lower CG and higher launch, aimed at mid-to-high handicaps."
  - q: "What clubs come in a stock Titleist T350 (2025) set?"
    a: "The stock set is 5-iron through pitching wedge, with a 4-iron and 48 and 53-degree wedges available to extend it."
