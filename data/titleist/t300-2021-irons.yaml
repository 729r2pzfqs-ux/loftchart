description: >
  The second-generation T300 is the game-improvement iron of Titleist's 2021
  T-Series. It keeps the first generation's loft ladder unchanged — a
  29-degree 7-iron and 43-degree pitching wedge — while adding roughly 40
  percent more tungsten weighting and an updated Max Impact face support for
  higher launch and more forgiveness. The set runs 4-iron through pitching
  wedge plus two matching wedges at 48 and 53 degrees. It was replaced by the
  T350 in 2023.
