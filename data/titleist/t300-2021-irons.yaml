faq:
  - q: "What is the loft of a 2021 Titleist T300 7-iron?"
    a: "The 2021 Titleist T300 7-iron has a loft of 29 degrees, with a 63-degree lie and a 37-inch steel-shaft length."
  - q: "What changed between the 2019 and 2021 Titleist T300?"
    a: "Lofts are identical between the generations. The 2021 model adds about 40 percent more tungsten weighting and an updated Max Impact core for higher launch and more forgiveness, and its published lie angles run half a degree more upright in the 4 and 5 irons."
  - q: "What wedges came with the 2021 Titleist T300 set?"
    a: "Beyond the 43-degree pitching wedge, Titleist offered two matching wedges: W1 at 48 degrees and W2 at 53 degrees, both at a 64-degree lie."
