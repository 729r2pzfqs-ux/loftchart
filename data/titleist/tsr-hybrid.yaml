faq:
  - q: "What lofts do the Titleist TSR hybrids come in?"
    a: "The TSR2 comes in 18, 21 and 24 degrees; the TSR3 in 19, 21 and 24; and the lightweight TSR1 in 20, 23, 26 and 29."
  - q: "Are the Titleist TSR hybrids adjustable?"
    a: "Yes — every head uses the 16-setting SureFit hosel, with loft from minus 0.75 to plus 1.5 degrees and lie from 0.75 degrees flat to 1.5 degrees upright. The TSR3 also carries a sliding CG track for shape bias."
  - q: "What is the difference between the TSR2 and TSR3 hybrids?"
    a: "The TSR2 is the larger, higher-launching head starting at 18 degrees. The TSR3 is the compact player's shape starting at 19 degrees with the adjustable CG track, flighting lower and favouring workability."
