category: flagship
construction: steel bodies with high-strength forged faces; adjustable CG track on the TSR3
material: forged variable-thickness face
predecessor: Titleist TSi
successor: Titleist GT
description: >
  The TSR2 and TSR3 hybrids launched in November 2022, a few months after the
  TSR drivers and fairways, and the lightweight TSR1 hybrid followed with the
  TSR1 line in February 2023. The TSR2 is the larger, easier-launching head
  in 18°, 21° and 24°; the TSR3 is the compact player's head in 19°, 21° and
  24° with a sliding CG track for shape bias; and the TSR1 runs 20° to 29° at
  a lighter overall build for moderate swing speeds. Every head carries the
  16-setting SureFit hosel. The GT hybrids replaced the line in late 2024.
variants:
  - name: TSR1
    description: >
      The lightweight high-launch head for moderate swing speeds, in four
      lofts from 20° to 29° with sub-50-gram stock shafts.
  - name: TSR2
    description: >
      The core head: larger profile, deep CG and high launch, built to
      replace long irons directly, in 18°, 21° and 24°.
  - name: TSR3
    description: >
      The compact player's head in 19°, 21° and 24°, with a sliding SureFit
      CG track for fade-to-draw bias tuning and a flatter, more workable
      flight.
