faq:
  - q: "What lofts does the Titleist Vokey SM10 come in?"
    a: "The Vokey SM10 is sold from 46 to 62 degrees — 27 loft, bounce and grind combinations in all, including the low-bounce 58.06K and 60.06K lob models added in March 2025."
  - q: "What grinds does the Vokey SM10 offer?"
    a: "Six grinds: F (full sole, 46-56 degrees), S (narrowed full sole, 54-60), M (heel and toe relief, 54-62), D (player's high bounce, 54-60), K (wide high-bounce sole at 14 degrees plus the low-bounce 06K, 58-60) and T (low bounce, 58-60)."
  - q: "Is the Vokey SM10 still in production?"
    a: "No — the SM11 replaced it as Titleist's current wedge line in early 2026. The SM10 remains widely available as closeout and used stock, and through the Titleist Certified pre-owned programme."
  - q: "What is the difference between the SM10 K grind and 06K?"
    a: "Both use the wide, cambered K sole. The standard K carries 14 degrees of bounce for soft sand and turf; the 06K, added in 2025, carries 6 degrees for shallow swings and firmer conditions."
