description: >
  The SM10 is the 2024 generation of the Vokey Design line, announced on
  22 January 2024 and at retail worldwide from 8 March 2024. It launched with
  25 loft/bounce/grind combinations across 46 to 62 degrees in six grinds
  (F, S, M, D, K, T); the low-bounce 58.06K and 60.06K lob models were added
  in March 2025, bringing the matrix to the 27 combinations charted here.
  Faces carry TX9 grooves cut individually by loft and finish over a
  high-frequency heat-treated impact area. Finishes are Tour Chrome, Jet
  Black and a Nickel finish new for this generation, with Raw available
  through WedgeWorks custom order. The SM11 replaced it at the top of the
  Titleist wedge catalogue in early 2026, making the SM10 the value buy
  while remaining stock lasts.
grinds:
  - code: F
    name: F Grind
    description: >
      All-purpose traditional full sole for full swings and square-face
      shots — the only option at the strong lofts from 46 to 52 degrees.
  - code: S
    name: S Grind
    description: >
      Full sole narrowed by a trailing-edge grind. For neutral to firm
      conditions and players who control loft with their hands ahead of or
      behind the ball.
  - code: M
    name: M Grind
    description: >
      Bob Vokey's favourite — rotate the face open and closed to manufacture
      shots. Suits shallower, sweeping swings.
  - code: D
    name: D Grind
    description: >
      Heel, toe and trailing-edge grind with high measured bounce, for
      steeper attack angles and varied face positions.
  - code: K
    name: K Grind
    description: >
      The highest-bounce wedge in the lineup and the ultimate bunker club — a
      wide full sole with enhanced camber for softer sand and turf. The 06K
      variant added in 2025 brings a 6-degree effective bounce version for
      shallow swings and firm turf.
  - code: T
    name: T Grind
    description: >
      Low bounce with a narrow sole that hugs the ground and maximum heel,
      toe and trailing-edge relief. The ultimate shotmaking grind.
