description: >
  The second-generation T150 is the faster players model of the 2025 T-Series,
  announced in summer 2025 with pre-orders from 10 July and retail availability
  from 21 August 2025. Its loft ladder carries over unchanged from the 2023
  T150 — a 32-degree 7-iron and a 44-degree pitching wedge — but because the
  2025 T100 went one degree stronger, the two models now sit a single degree
  apart instead of two. The forged head is slightly larger than the T100 and
  uses the same progressive dual-cavity construction with split high-density
  tungsten, extending the muscle channel through the 7-iron rather than only
  the long irons, with a variable face thickness design and more aggressive
  mid and short-iron grooves. Lie and length are shared per club number across
  the whole 2025 T-Series. Heads run 3-iron through a 48-degree W wedge
  (recorded here as GW to match the earlier T150 record), with 4-PW the stock
  set. Titleist does not publish offset, bounce or swing weight for the 2025
  T-Series, so those keys are omitted.
