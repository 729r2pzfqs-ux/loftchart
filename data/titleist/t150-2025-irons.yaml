faq:
  - q: "What is the loft of a Titleist T150 (2025) 7-iron?"
    a: "The 2025 T150 7-iron has a loft of 32 degrees, with a 63-degree lie and a 37-inch standard steel length."
  - q: "Did the T150 lofts change for 2025?"
    a: "No. The 2025 T150 keeps the 2023 ladder exactly — 19 degrees at the 3-iron, 32 at the 7-iron, 44 at the pitching wedge — but the gap to the T100 shrank to one degree because the 2025 T100 went a degree stronger."
  - q: "What is the difference between the T150 and the T250?"
    a: "The T150 is a forged players iron with a dual-cavity back and moderate forgiveness; the T250 is the larger players-distance model with a hollow high-strength steel body, a forged L-Face insert and stronger lofts (30.5 degrees at the 7-iron against 32)."
  - q: "What clubs come in a stock Titleist T150 (2025) set?"
    a: "The stock set is 4-iron through pitching wedge, with a 3-iron and a 48-degree W wedge available to extend it."
