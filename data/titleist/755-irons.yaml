faq:
  - q: "What is the loft of a Titleist Forged 755 7-iron?"
    a: "The Forged 755 7-iron has a loft of 35 degrees, with a 63-degree lie and a 37-inch steel-shaft length."
  - q: "Are the Titleist 755 irons forged?"
    a: "Yes — from soft 410 stainless steel in a multi-step patented forging process, with a forged 6061 T-6 aluminum insert in the cavity acting as a vibration dampener."
  - q: "What replaced the Titleist Forged 755?"
    a: "Titleist's AP1 and AP2, announced in January 2008. The AP2 took over the 755's slot as the technology-infused forged players iron."
  - q: "What shaft did the Titleist 755 come with?"
    a: "The stock shaft was Titleist's Tri-Spec steel shaft in regular or stiff flex, a lightweight design that plays softer than a Dynamic Gold S300."
