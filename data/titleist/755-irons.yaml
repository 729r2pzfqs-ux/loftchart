description: >
  The Forged 755 was announced on 14 August 2006 as a new flagship iron in
  Titleist's 700 series, replacing the Forged 704.CB and slotting between the
  735.CM combo set and the more forgiving 775.CB. The head is forged from soft
  410 stainless steel in a multi-step patented process, with a red-and-silver
  6061 T-6 forged aluminum insert in the cavity to damp vibration and a weight
  shelf that moves mass into the heel and toe. A dual-hosel design uses a
  shorter hosel in the 2-7 irons for higher launch and a longer hosel in the
  8-PW for a flatter, controlled flight. Lofts are traditional — a 35-degree
  7-iron and 47-degree pitching wedge — and the line gave way to the AP1 and
  AP2 announced in January 2008. Figures are the men's standard right-handed
  steel build.
