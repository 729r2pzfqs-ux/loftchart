description: >
  The AP1 is the first generation of Titleist's Advanced Performance line,
  announced in January 2008 and at retail from 15 March that year alongside
  the forged AP2, ZB and ZM. Titleist described it as a multi-material, dual
  cavity cast iron: a 431 stainless steel body with a tungsten-nickel box low
  in the head and an elastomer cushion behind the face, aimed at aspiring
  players wanting forgiveness and higher flight. Lofts are two degrees
  stronger than the AP2, with a 33 degree 7-iron and a 45 degree pitching
  wedge, and the stock set ran 3-iron through a 50 degree gap wedge. The 710
  AP1 that replaced it in 2009 kept the loft ladder unchanged.
