faq:
  - q: "What is the loft of a Titleist AP1 (2008) 7-iron?"
    a: "The 2008 Titleist AP1 7-iron is 33 degrees, with a 63 degree lie and a 37 inch standard steel length."
  - q: "How do the 2008 AP1 lofts compare with the AP2?"
    a: "The AP1 is two degrees stronger throughout: a 33 degree 7-iron against 35 and a 45 degree pitching wedge against 47, with a 50 degree gap wedge completing the stock set."
  - q: "Is the first-generation Titleist AP1 forged or cast?"
    a: "Cast. The AP1 body is cast 431 stainless steel with a tungsten-nickel weight and elastomer cushion; only the AP2, ZB and ZM of the 2008 launch were forged."
