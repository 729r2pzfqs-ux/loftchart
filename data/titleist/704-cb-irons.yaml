description: >
  The Forged 704.CB is the mid-handicap forged cavity back Titleist launched
  in 2004 and catalogued as its 2005 model, positioned to give serious
  and aspiring golfers a more forgiving route into forged irons than the
  compact 600-series blades while drawing on the playability of the earlier
  DCI models. Unusually for the era it is forged from stainless steel rather
  than carbon steel, so the heads are unplated and can be bent freely for
  custom fitting. Lofts are traditional with a 35 degree 7-iron and a 47
  degree pitching wedge, and the manufacturer table ran from a 19.5 degree
  2-iron through a 51 degree gap wedge. The Forged 755 replaced it in 2006.
