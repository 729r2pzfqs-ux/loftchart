faq:
  - q: "What is the loft of a Titleist 704.CB 7-iron?"
    a: "The Titleist Forged 704.CB 7-iron is 35 degrees, with a 63 degree lie and a 37 inch standard steel length."
  - q: "Is the Titleist 704.CB forged from carbon steel?"
    a: "No. It is forged from stainless steel, so the heads are unplated, more durable than chromed carbon steel and freely bendable for custom fitting."
  - q: "What year is the Titleist 704.CB from?"
    a: "It launched in 2004 and was sold as Titleist's 2005 model, remaining in the line until the Forged 755 replaced it in 2006."
