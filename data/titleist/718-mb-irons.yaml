description: >
  The 718 MB is the last of Titleist's numbered musclebacks before the line
  became the 620 MB. It is forged from 1025 carbon steel with a slightly
  narrower sole and a refined leading edge over the 716, and once again does
  not move a single loft, lie, length or offset figure — the chart is identical
  to the 716 MB club for club. Figures are the men's standard right-handed
  steel build.
