faq:
  - q: "What is the loft of a Titleist 718 MB 7-iron?"
    a: "The Titleist 718 MB 7-iron has a loft of 35 degrees, a lie of 63.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "When were Titleist 718 MB irons made?"
    a: "The 718 line was announced in 2017 and gave way to the 620 MB and 620 CB in 2019."
  - q: "Are 716 MB and 718 MB specs identical?"
    a: "Yes — same lofts, lies, lengths and offsets club for club. The 718 refines the sole width and leading edge rather than the numbers."
  - q: "How does the 718 MB compare with the 718 AP2?"
    a: "The AP2 is stronger and more forgiving: a 34-degree 7-iron in a multi-material cavity back against the MB's 35-degree solid forging."
