description: >
  The Z•B Forged ("Z Blend") is one of the four irons Titleist announced in
  January 2008 alongside the AP1, AP2 and ZM, at retail from 15 March 2008,
  taking over the blended-set slot from the Forged 735.CM. It is a blended
  set that Titleist's spec page lists as forged 1020 mild carbon steel: full
  cavity back long irons, partial cavity mid irons and muscle back short
  irons, with the back design placing the center of gravity in the middle of
  the face. Against the ZM it carries slightly more offset in the long and
  mid irons. The stock set ran 3-iron through pitching wedge with the 18
  degree 2-iron available, and the 710 CB that replaced it in 2009 kept these
  specs unchanged.
