faq:
  - q: "What is the loft of a Titleist ZB 7-iron?"
    a: "The Titleist ZB 7-iron is 35 degrees, with a 63 degree lie and a 37 inch standard steel length."
  - q: "What is the difference between the Titleist ZB and ZM irons?"
    a: "Lofts, lies and lengths are identical, but the ZB is a blended set - cavity back long irons to muscle back short irons - with slightly more offset in the long and mid irons, while the ZM is a muscleback throughout. The ZB also offers an 18 degree 2-iron, which the ZM does not."
  - q: "How do the ZB lofts compare with the 710 CB that replaced it?"
    a: "They are identical: an 18 degree 2-iron, 35 degree 7-iron and 47 degree pitching wedge, with the same offsets and bounce angles."
