description: >
  The 714 MB is the 2014-model-year muscleback in Titleist's numbered line,
  forged from a block of 1025 carbon steel with tour-preferred constant blade
  lengths and minimal progressive offset. Lofts, lies, lengths and offsets are
  unchanged from the 712 MB, and Titleist publishes a progressive bounce for
  this generation running 2 degrees at the 3-iron to 8 at the pitching wedge.
  Figures are the men's standard right-handed steel build.
