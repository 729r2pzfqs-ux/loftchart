faq:
  - q: "What is the loft of a Titleist 714 MB 7-iron?"
    a: "The Titleist 714 MB 7-iron has a loft of 35 degrees, a lie of 63.0 degrees, a steel-shaft length of 37.00 inches and 5 degrees of bounce."
  - q: "When were Titleist 714 MB irons made?"
    a: "The 714 line was announced in 2013 as the 2014 range and was replaced by the 716 line in 2015."
  - q: "Are 712 MB and 714 MB specs the same?"
    a: "Yes for loft, lie, length and offset — both run 21 to 47 degrees from 3-iron to pitching wedge at identical lengths. The 714 generation is where Titleist published the progressive bounce figures for the muscleback."
  - q: "How much offset does a Titleist 714 MB have?"
    a: "0.125 inches at the 3-iron tapering to 0.075 inches at the pitching wedge — minimal and progressive, as Titleist describes it."
