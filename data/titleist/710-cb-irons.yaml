description: >
  The 710 CB is the forged cavity back Titleist introduced in the autumn of
  2009 for the 2010 season, alongside the 710 MB, AP1 and AP2. It is forged
  from 1025 carbon steel with a full cavity and an optimized inner cavity
  muscle behind the impact area, slightly longer constant blade lengths and a
  softer topline, giving more inertia and forgiveness than the MB while
  keeping a players profile. The specs carry over unchanged from the ZB it
  replaced - a 35 degree 7-iron, 47 degree pitching wedge and minimal
  progressive offset - with the stock set a 3-iron through pitching wedge and
  an 18 degree 2-iron available.
