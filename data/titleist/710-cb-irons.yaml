faq:
  - q: "What is the loft of a Titleist 710 CB 7-iron?"
    a: "The Titleist 710 CB 7-iron is 35 degrees, with a 63 degree lie and a 37 inch standard steel length."
  - q: "What is the difference between the Titleist 710 CB and 710 MB?"
    a: "Lofts, lies and lengths are identical, but the CB is a full cavity back with more inertia and forgiveness, slightly longer blade lengths and marginally more offset (0.140 to 0.075 inches against 0.125 to 0.075), while the MB is a pure muscleback."
  - q: "Did Titleist change the specs from the ZB to the 710 CB?"
    a: "No. The 710 CB kept the ZB table unchanged: an 18 degree 2-iron, 35 degree 7-iron and 47 degree pitching wedge with the same offsets and bounce angles."
