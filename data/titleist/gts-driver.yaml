faq:
  - q: "What lofts does the Titleist GTS come in?"
    a: "The GTS2 and GTS3 come in 8, 9, 10 and 11 degrees; the GTS4 in 8, 9 and 10. Titleist uses whole-degree lofts rather than the 9/10.5/12 ladder most brands sell."
  - q: "What is the GTS SureFit chart?"
    a: "The 16-setting SureFit hosel combines four loft positions (−0.75, standard, +0.75 and +1.5 degrees) with four lie positions (0.75 flat, standard, 0.75 upright and 1.5 upright). A1 is standard for right-handers; the left-hand chart mirrors with D4 as standard."
  - q: "Is there a GTS1 driver?"
    a: "No — as of October 2026 Titleist has not released a GTS1. The lightweight GT1 from the 2024-25 generation remains in the catalogue as the moderate-swing-speed option, just as the GT1 itself arrived a season after the GT2-GT4."
  - q: "What changed from the Titleist GT to the GTS?"
    a: "The GTS doubles the thermoform polymer share (26 g of PMP versus 13), adds the Speed Sync face with a reinforced perimeter, gives every head dual front/back weights, and grows the GTS4 to 460 cc from the GT4's 430 cc. Lofts, lie and the SureFit chart carry over unchanged."
