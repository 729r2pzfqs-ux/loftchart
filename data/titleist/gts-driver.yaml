description: >
  The GTS is Titleist's 2026 driver generation, announced on 13 May and in
  golf shops worldwide from 11 June 2026. It doubles down on the GT's
  thermoform construction: 26 grams of Proprietary Matrix Polymer — twice the
  GT's share — covers about 60% of the head's surface at only 13% of its
  mass, wrapped around a titanium Split Mass Frame and the new Speed Sync
  face. Every head carries dual front/back weighting, and the GTS3 and GTS4
  add the five-position SureFit CG track. There is no GTS1: the lightweight
  GT1 from the previous generation stays in the catalogue as the
  moderate-swing-speed option. Lofts run on Titleist's whole-degree ladder —
  8° to 11° — rather than the industry's 9/10.5/12 convention.
variants:
  - name: GTS2
    head_cc: 460
    description: >
      The max-stability head for power and consistency across the face: high
      launch, mid spin, with fixed-position front and back flat weights (11 g
      forward, 5 g aft as standard — flip them for more MOI and launch).
  - name: GTS3
    head_cc: 460
    description: >
      The precision head — more compact, deeper-faced, mid launch and low
      spin — with an 8 g weight in the five-position SureFit CG track plus a
      5 g aft weight.
  - name: GTS4
    head_cc: 460
    description: >
      The spin-killer, now grown from the GT4's 430 cc to a full 460 cc for
      more off-centre forgiveness while keeping the most aggressive spin
      reduction in the line. 8 g CG-track weight plus 5 g aft.
