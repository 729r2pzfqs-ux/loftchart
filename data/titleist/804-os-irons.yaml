description: >
  The 804.OS is the oversize game-improvement member of Titleist's mid-2000s
  forged range, built with the same heat-treated forged stainless steel as the
  704.CB so a larger, easier iron could keep a forged feel. The head carries a
  deep cavity, a wide sole and the heaviest offset Titleist published in the
  era - .300 inches at the 2-iron tapering to .120 at the gap wedge - with
  lofts of 34 degrees at the 7-iron and 46 at the pitching wedge. Titleist
  marketed it as a 2005-model-year club announced in late 2004, and catalogued
  it from a 2-iron through a 50 degree gap wedge, every club at D2. The
  forgiving end of the forged line passed to the 775.CB in 2006.
