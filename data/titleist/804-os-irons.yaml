faq:
  - q: "What is the loft of a Titleist 804.OS 7-iron?"
    a: "The Titleist 804.OS 7-iron is 34 degrees, with a 63 degree lie and a 37 inch standard steel length."
  - q: "Are the Titleist 804.OS irons forged or cast?"
    a: "Forged. Titleist used the same heat-treated forged stainless steel as the 704.CB, which is why the model was marketed as 'Forged 804.OS' - unusual for an oversize game-improvement iron of the era."
  - q: "What year did the Titleist 804.OS come out?"
    a: "It reached shops in late 2004 as a 2005-model-year club and stayed in the line until the 775.CB replaced it in 2006."
