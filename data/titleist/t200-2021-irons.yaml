description: >
  The 2021 T200 is the second generation of Titleist's players-distance iron,
  redesigned around a cleaner, more compact look with a shorter blade length
  and a squarer topline than the 2019 original. It keeps the hollow-body
  construction with a forged SUP-10 face, Max Impact support and high-density
  tungsten, but the lofts back off a full degree in the middle of the set —
  a 31-degree 7-iron against the 2019 model's 30 — while the pitching wedge
  stays at 43 degrees. The stock set is 4-iron through pitching wedge, with
  17 and 20 degree T200 utility long irons sold separately for the top of the
  bag. Figures are the men's standard right-handed steel build.
