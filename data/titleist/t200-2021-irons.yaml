faq:
  - q: "What is the loft of a 2021 Titleist T200 7-iron?"
    a: "The 2021 T200 7-iron is 31 degrees, with a 63-degree lie and a 37-inch standard steel length."
  - q: "How does the 2021 T200 differ from the 2019 T200?"
    a: "The 2021 model is more compact and a degree weaker in the middle of the set — a 31-degree 7-iron against 30, and a 35-degree 8-iron against 34 — while the 43-degree pitching wedge carries over."
  - q: "Did the 2021 T200 come in long-iron lofts?"
    a: "The stock set runs 4-PW, but Titleist offered 17-degree 2-iron and 20-degree 3-iron T200 utility builds separately for the top of the bag."
  - q: "What shafts came stock on the 2021 T200?"
    a: "True Temper AMT Black in steel and the Mitsubishi Tensei AV Blue AM2 in graphite."
