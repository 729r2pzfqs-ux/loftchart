description: >
  AP1 is Titleist's game-improvement iron, and the 714 is the 2014-model-year
  version — a hollow-soled cast head with a large undercut cavity and a
  high-density tungsten weight low in the sole. Lofts are three degrees stronger
  than the 714 MB through the set, 32 degrees at the 7-iron against 35, and
  offset is roughly twice as much. The stock set runs down to two wedges, listed
  by Titleist as W and W2 at 48 and 52 degrees. Figures are the men's standard
  right-handed steel build.
