faq:
  - q: "What is the loft of a Titleist 714 AP1 7-iron?"
    a: "The Titleist 714 AP1 7-iron has a loft of 32 degrees, a lie of 63.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "Is the 714 AP1 the 2014 model?"
    a: "Yes. Titleist announced the 714 line in 2013 and sold it as the 2014 range, so the same clubs are commonly listed as either 714 AP1 or AP1 (2014)."
  - q: "What is the difference between the Titleist AP1 and AP2?"
    a: "AP1 is the game-improvement model — larger head, more offset and stronger lofts. The 714 AP1 7-iron is 32 degrees against the 714 AP2's 34, and offset at the 7-iron is 0.145 inches against roughly half that."
  - q: "What wedges came with the 714 AP1?"
    a: "Titleist catalogued two, a 48-degree W and a 52-degree W2, below the 44-degree pitching wedge."
