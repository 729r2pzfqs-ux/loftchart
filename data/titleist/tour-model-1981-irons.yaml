description: >
  The 1981 Tour Model is one of the classic forged Titleist blades from the
  era before the DCI family, a refinement of the 1979 original that Titleist
  itself archives as a distinct model. It is a traditional carbon steel blade
  with the flat lies of its day - 62 degrees at the 7-iron, two to three
  degrees flatter than a modern iron - and classic lofts, a 37 degree 7-iron
  and 49 degree pitching wedge, on slightly shorter-than-modern shaft
  lengths that step in three-eighths-inch increments through the scoring
  clubs. Titleist catalogued it from a 1-iron through sand wedge. It remains
  a collector item, and Titleist revised the Tour Model again in 1982.
