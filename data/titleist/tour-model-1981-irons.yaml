faq:
  - q: "What is the loft of a Titleist Tour Model (1981) 7-iron?"
    a: "The 1981 Titleist Tour Model 7-iron is 37 degrees, with a 62 degree lie and a 36.625 inch length - classic blade specs, about five degrees weaker than a modern players iron."
  - q: "Were the 1981 Titleist Tour Model irons forged?"
    a: "Yes. The Tour Model series were traditional forged carbon steel blades, the line Titleist offered to better players before the cast DCI family arrived in the early 1990s."
  - q: "How do the 1981 Tour Model lies compare with modern irons?"
    a: "They are flat by modern standards: 62 degrees at the 7-iron against roughly 63 to 64 on current irons, and the whole set runs about two degrees flatter club for club."
