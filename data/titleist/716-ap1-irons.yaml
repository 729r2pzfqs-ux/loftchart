description: >
  The 716 AP1 is the game-improvement model of Titleist's 716 range, announced
  in September 2015 and sold as the 2016 line, which Titleist billed as its
  longest, most forgiving iron ever. An extreme 360-degree undercut cavity
  leaves a large, thin unsupported face for speed and launch, while extreme
  high-density tungsten drives the centre of gravity low and pushes weight to
  the perimeter for a high moment of inertia. Lofts moved about a degree
  stronger than the 714 AP1 through most of the set — 31 degrees at the 7-iron
  against 32, and a 43-degree pitching wedge against 44 — with the set running
  3-iron through two wedges badged W at 47 degrees and W2 at 52. The whole set
  is built to a D1 swing weight, and Titleist published per-club offset in
  inches. The 718 AP1 replaced it in 2017.
