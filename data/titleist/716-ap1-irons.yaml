faq:
  - q: "What is the loft of a Titleist 716 AP1 7-iron?"
    a: "The Titleist 716 AP1 7-iron has a loft of 31 degrees, a lie of 63 degrees and a standard steel length of 37 inches."
  - q: "How do the 716 AP1 lofts compare with the 714 AP1?"
    a: "About a degree stronger through most of the set. The 7-iron went from 32 to 31 degrees and the pitching wedge from 44 to 43, with the two set wedges dropping from 48 and 52 to 47 and 52 degrees."
  - q: "What wedges came with the Titleist 716 AP1?"
    a: "The set ran to two gap-style wedges below the 43-degree pitching wedge: a 47-degree W and a 52-degree W2, both at 35.5 inches with 64-degree lies."
  - q: "When were Titleist 716 AP1 irons made?"
    a: "Titleist announced the 716 range in September 2015 and sold it as the 2016 line; the 718 AP1 replaced it in 2017."
