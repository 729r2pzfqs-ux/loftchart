faq:
  - q: "What is the loft of a Titleist DCI 981SL 7-iron?"
    a: "The Titleist DCI 981SL 7-iron is 33 degrees, with a 63 degree lie and a 36.75 inch length - two degrees stronger than the standard DCI 981."
  - q: "What does SL mean on the Titleist DCI 981SL?"
    a: "It marks the superlight version of the DCI 981: the set is built to C9 swing weights with lightweight shafts, stronger lofts and extra offset so golfers with slower swing speeds can keep their distance."
  - q: "How does the DCI 981SL differ from the standard DCI 981?"
    a: "Three ways: it is much lighter (C9 swing weights against D1), its lofts are about two degrees stronger through the set, and it carries more offset - .300 inches at the 2-iron against .250 - with a wider sole and lower centre of gravity."
