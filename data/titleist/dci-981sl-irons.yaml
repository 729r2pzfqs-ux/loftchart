description: >
  The DCI 981SL is the superlight variant of the 1998 DCI 981, built for
  golfers with slower swing speeds. The whole set is assembled to C9 swing
  weights with lightweight shafts, and the heads carry even more offset than
  the already generous 981 - .300 inches at the 2-iron against .250 - with a
  wider sole and lower centre of gravity. Lofts run two degrees stronger than
  the standard 981, with a 33 degree 7-iron and a 45 degree pitching wedge,
  to convert the lighter build into distance. Titleist catalogued it from a
  2-iron through a 57 degree lob wedge; the wedges are built heavier at D1
  and D3.
