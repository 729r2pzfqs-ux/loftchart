description: >
  The Idea Black CB2 is a players' cavity-back forged from 8620 carbon steel and
  finished in black nickel-chromium plate, announced on 21 April 2010 and shipping
  from 14 May 2010 at 899.99 USD in steel. It pairs a vibration-absorbing cavity badge
  with dual perimeter weighting, a four-way cambered mid-width sole, progressive
  offset and grooves milled to the 2010 USGA condition-of-competition rules. The stock
  set runs 4-iron through gap wedge; the 3-iron listed below was available to order.
  Unlike most of the Idea line it is a conventional all-iron set with no hybrids in
  the make-up, sitting between the slimmer Idea Pro Black CB1 and the more forgiving
  hybrid-iron sets in Adams' range.
