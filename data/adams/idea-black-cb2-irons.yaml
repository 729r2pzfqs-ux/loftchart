faq:
  - q: "What is the loft of an Adams Idea Black CB2 7-iron?"
    a: "The Adams Idea Black CB2 7-iron has a loft of 33 degrees, with a 62.25-degree lie and a 37-inch length."
  - q: "What clubs come in a stock Adams Idea Black CB2 set?"
    a: "Eight clubs, 4-iron through gap wedge. A 21-degree 3-iron was available to order."
  - q: "Are Adams Idea Black CB2 irons forged?"
    a: "Yes. The heads are forged from soft 8620 carbon steel and finished in black nickel-chromium plate, with a vibration-absorbing cavity badge and dual perimeter weighting."
