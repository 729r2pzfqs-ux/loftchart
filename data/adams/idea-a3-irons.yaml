description: >
  The Idea a3 is the third-generation Idea hybrid-iron combo set and the first built
  around Adams' Boxer hybrid shaping, announced on 8 May 2007. The stock eight-club
  make-up is a 19-degree 3 Boxer hybrid, 22-degree 4 hybrid and 25-degree 5 hybrid in
  place of the long irons, then two hollow-back mid irons and three cavity-back short
  irons from the 6-iron to the pitching wedge. Adams claimed the Boxer hybrids carried
  up to 70 percent higher MOI than rival hybrids. Lofts stay traditional with a
  33-degree 7-iron and a 45-degree pitching wedge, and a 2 hybrid, 4- and 5-irons and
  GW, SW and LW heads were available through custom fitting. Only the iron clubs are
  listed below; the stock hybrids are Boxer hybrids rather than irons. The men's set
  listed at 699.99 USD in steel and 799.99 USD in graphite.
