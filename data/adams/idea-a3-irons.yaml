faq:
  - q: "What is the loft of an Adams Idea a3 7-iron?"
    a: "The Adams Idea a3 7-iron has a loft of 33 degrees, with a 62-degree lie and a 37.25-inch length."
  - q: "What clubs come in a stock Adams Idea a3 set?"
    a: "Eight clubs: 19-, 22- and 25-degree Boxer hybrids replace the 3-, 4- and 5-irons, followed by hollow-back 6- and 7-irons and cavity-back 8-iron through pitching wedge. A 2 hybrid, conventional 4- and 5-irons and GW, SW and LW heads were custom options."
  - q: "What is Boxer Technology on the Idea a3?"
    a: "Boxer is Adams' rounded, high-MOI hybrid head shape introduced with the a3 generation. Adams claimed the a3's Boxer hybrids had up to 70 percent higher MOI than other leading hybrids of the time."
