faq:
  - q: "What is the loft of an Adams Idea a3 OS 7-iron?"
    a: "The Adams Idea a3 OS '7' is a 32-degree iron-like hybrid rather than a conventional iron, with a 61.75-degree lie and a 37.5-inch length."
  - q: "What clubs come in a stock Adams Idea a3 OS set?"
    a: "Eight clubs: 19-, 22- and 25-degree Boxer hybrids (3H, 4H, 5H), three iron-like hybrids numbered 6, 7 and 8 (28, 32 and 36 degrees), then a 40-degree 9-iron and 44-degree pitching wedge. A senior's set was also offered."
  - q: "How does the Idea a3 OS differ from the standard Idea a3 and the Idea a2 OS?"
    a: "The a3 OS replaces six clubs with hybrid or iron-like hybrid heads and leaves only the 9-iron and pitching wedge as conventional irons, versus three hybrids in the standard Idea a3 and four hybrid clubs in the previous Idea a2 OS. Golf Digest's 2008 Hot List singled out the a3 OS for pushing the hybrid-iron count further than earlier Adams sets."
