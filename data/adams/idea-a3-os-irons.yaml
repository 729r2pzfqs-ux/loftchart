sources:
  - "Adams Golf official Idea a3OS product page, October 2007 capture (https://web.archive.org/web/20071014000752/http://www.adamsgolf.com/ir_idea_a3OS.htm) - contemporaneous manufacturer page giving the six-hybrid/two-iron set make-up (3-8 hybrids, 9-iron and PW) and the 'easiest-to-hit hybrid irons ever' marketing line"
  - "Adams Golf official Idea a3OS specs page on the relaunched site, September 2008 capture (https://web.archive.org/web/20080917085927/http://www.adamsgolf.com/products/irons/a3os.php?page=specs) - full manufacturer spec table with loft, lie, length and graphite/steel swing weight for the 3-8 hybrids, 9-iron and PW, the Grafalloy ProLaunch Platinum 80-gram graphite and True Temper Performance Lite 105-gram steel stock shafts, and the Golf Digest 2008 Hot List quote about the set's expanded hybrid count"
  - "Note: the manufacturer spec table lists the 6, 7 and 8 as 'iron-like hybrid' heads rather than conventional irons; they are recorded here as club rows 6/7/8 because Adams numbered and sold them as part of the iron set, consistent with how the sibling Idea a2 OS and Idea a7 OS files in this database treat their own iron-like hybrid rows. The 3, 4 and 5 are quoted as '3H'/'4H'/'5H' since they are wood-like Boxer hybrids"
  - "Wayback Machine CDX index for adamsgolf.com - confirms the old-site product page (ir_idea_a3OS.htm) was live from at least October 2007 through early September 2008, when the site relaunched under the products/irons/a3os.php URL structure carrying an identical set make-up and spec table"
