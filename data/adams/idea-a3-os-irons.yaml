description: >
  The Idea a3 OS is the oversize, maximum-forgiveness half of the third-generation
  Idea hybrid-iron combo set, sold alongside the standard Idea a3 from 2007. Where
  the base a3 keeps five conventional irons, the a3 OS integrates six progressively
  shaped hybrids - 19-, 22- and 25-degree Boxer hybrids plus 28-, 32- and 36-degree
  iron-like hybrids - ahead of just two cavity-back short irons, the 9-iron and
  pitching wedge, for a wide-sole, high-MOI set Adams marketed as its "easiest-to-hit
  hybrid irons ever." That is two more hybrid clubs than the four-hybrid Idea a2 OS
  it replaced, and four more than the three-hybrid standard Idea a3. Golf Digest's
  2008 Hot List praised Adams for pushing the hybrid-iron concept further by
  "increasing the number of wood like hybrid and iron-like hybrids and leaving just
  two irons in the set."
