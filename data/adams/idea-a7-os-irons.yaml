description: >
  The Idea a7 OS is the maximum-forgiveness half of the 2009 a7 generation, announced
  alongside the standard Idea a7 on 6 August 2009. The stock eight-club make-up is
  three full hybrids (19-degree 3, 22-degree 4 and 25-degree 5), two iron-like
  mid-hybrids (28-degree 6 and 32-degree 7) and three short irons (8-iron, 9-iron and
  pitching wedge), with a 2 hybrid, GW, SW and LW offered to extend the set. Lofts use
  Adams' gapping ladder with a 32-degree 7 and a 44-degree pitching wedge. The 6 and 7
  below are the mid-hybrid heads Adams numbered as part of the iron set; the 2-5
  hybrids are not listed. The set won Golf Digest Hot List gold in the
  super-game-improvement category in 2010 and 2011 and listed at 699.99 USD in steel
  and 799.99 USD in graphite.
