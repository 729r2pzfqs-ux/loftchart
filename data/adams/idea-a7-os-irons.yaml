faq:
  - q: "What is the loft of an Adams Idea a7 OS 7-iron?"
    a: "32 degrees, with a 62.25-degree lie and a 37.5-inch length. Note that the 7 in this set is an iron-like mid-hybrid rather than a conventional iron."
  - q: "What clubs come in a stock Adams Idea a7 OS set?"
    a: "Eight clubs: 3, 4 and 5 hybrids, 6 and 7 mid-hybrids, then 8-iron, 9-iron and pitching wedge. A 17-degree 2 hybrid plus GW, SW and LW heads were offered to extend the set."
  - q: "What is the difference between the Idea a7 and the Idea a7 OS?"
    a: "The a7 uses two hybrids and a hollow 5-iron ahead of conventional cavity-back irons with a 33-degree 7-iron; the a7 OS replaces five clubs with hybrid or mid-hybrid heads and runs one degree stronger, with a 32-degree 7. The OS version won Hot List super-game-improvement gold in 2010 and 2011."
