faq:
  - q: "What is the loft of an Adams Blue 7-iron?"
    a: "31.5 degrees, with a 63-degree lie and a 36.75-inch steel-shaft length (37 inches in graphite)."
  - q: "What clubs come in a stock Adams Blue iron set?"
    a: "Eight clubs: 5, 6, 7, 8, 9, PW, AW and SW. Adams did not offer a 4-iron head in the Blue line, pairing the set instead with the separate Blue hybrid (19-25 degrees) for the long-iron slots."
  - q: "Was the Adams Blue the last iron model Adams Golf released?"
    a: "As far as can be verified, yes. Launched 3 April 2015, it appears to be the final new Adams-branded iron line before TaylorMade stopped developing new Adams products and took down adamsgolf.com around 2016, ahead of adidas selling both TaylorMade and Adams to KPS Capital Partners in 2017."
