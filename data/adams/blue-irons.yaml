description: >
  The Blue was Adams Golf's last new iron release, launched on 3 April 2015 as a
  super-game-improvement set sold alongside a matching driver, fairway wood and hybrid.
  The 8-club stock set runs 5-iron through sand wedge; rather than offer a 4-iron, Adams
  steered golfers toward the companion Blue hybrid (19-25 degrees) for the long-iron
  slots. Velocity Slot Technology in the sole lets the cast, one-piece face flex more at
  impact for higher ball speed on mishits, paired with a low, rearward center of gravity,
  a thick top line and generous offset aimed at high-handicap and beginner golfers. It
  reached shops only months before TaylorMade quietly stopped developing new Adams
  products and shut down adamsgolf.com, marking the effective end of the Adams iron line.
