description: >
  The Idea a2 OS is the oversize, maximum-game-improvement version of the a2
  generation and the first of Adams' OS hybrid-iron sets. The stock men's make-up runs
  four progressively shaped hybrid clubs - a 19-degree 3 i-Wood and 23-degree 4 i-Wood,
  then the iron-like 5 and 6 hybrid irons - ahead of hollow-back 7- and 8-irons and
  large-sweetspot 9-iron and pitching wedge, with a 17-degree 2 i-Wood offered to
  extend the set. Adams claimed a centre of gravity 11 percent lower and 2.5 times
  deeper than conventional irons. Lofts are slightly stronger than the standard a2
  from the 8-iron down, with a 33-degree 7-iron and a 44-degree pitching wedge. The
  5 and 6 below are the hybrid-iron heads that Adams numbered as part of the iron set;
  the 2, 3 and 4 i-Woods (17, 19 and 23 degrees) are wood-like hybrids rather than
  irons and are not listed. Tom Watson fronted the a2 OS advertising.
