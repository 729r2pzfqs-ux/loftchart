faq:
  - q: "What is the loft of an Adams Idea a2 OS 7-iron?"
    a: "The Adams Idea a2 OS 7-iron has a loft of 33 degrees, with a 62-degree lie and a 37.5-inch length."
  - q: "What clubs come in a stock Adams Idea a2 OS set?"
    a: "The stock men's set is a 19-degree 3 i-Wood, 23-degree 4 i-Wood, iron-like 5 and 6 hybrid irons, hollow-back 7- and 8-irons, and cavity-back 9-iron and pitching wedge. A 17-degree 2 i-Wood plus GW, SW and LW heads extended the set."
  - q: "How does the Idea a2 OS differ from the standard Idea a2?"
    a: "The OS replaces two more of the mid irons with hybrid heads (four hybrid clubs in total versus two), uses wider soles, and runs about a degree stronger in the short irons with a 44-degree pitching wedge against the a2's 45 degrees."
