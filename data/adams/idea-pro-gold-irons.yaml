faq:
  - q: "What is the loft of an Adams Idea Pro Gold 7-iron?"
    a: "The Adams Idea Pro Gold 7-iron has a loft of 34 degrees, with a 62.5-degree lie and a 37-inch length."
  - q: "What clubs come in a stock Adams Idea Pro Gold set?"
    a: "Eight clubs: 20-degree 3 and 23-degree 4 Boxer hybrids, then forged 5-iron through pitching wedge. 1, 2 and 5 hybrids and forged 3, 4, GW, SW and LW heads were available through custom order."
  - q: "What changed from the Idea Pro Forged to the Idea Pro Gold?"
    a: "The hybrids adopted Adams' Boxer shaping, the forged irons gained a mirror-chrome finish and roughly one degree more upright lie through the set, the 5-iron strengthened from 26 to 27 degrees, and the stock iron shaft changed from True Temper Black Gold to Rifle Project X Flighted."
