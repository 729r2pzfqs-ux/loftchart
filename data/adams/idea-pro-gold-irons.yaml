description: >
  The Idea Pro Gold is the second generation of Adams' forged players' hybrid-iron
  set, released in mid-2008. The eight-club stock make-up pairs 20-degree 3 and
  23-degree 4 Idea Pro Gold Boxer hybrids with six forged 8620 carbon steel irons from
  the 5-iron to the pitching wedge, now finished in mirror chrome with a thin topline
  and sole. Against the original Pro Forged the irons sit about a degree more upright
  through the set and the 5-iron strengthens to 27 degrees, while the 7-iron stays at
  34 degrees and the pitching wedge at 46. Only the irons are listed below; the two
  Boxer hybrids are not irons. 1, 2 and 5 hybrids and forged 3, 4, GW, SW and LW heads
  were available custom, and the set listed at 899 USD in steel and 1,099 USD in
  graphite.
