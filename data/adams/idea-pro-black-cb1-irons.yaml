faq:
  - q: "What is the loft of an Adams Idea Pro Black CB1 7-iron?"
    a: "The Adams Idea Pro Black CB1 7-iron has a loft of 34 degrees, with a 62.25-degree lie and a 37-inch length."
  - q: "What clubs come in a stock Adams Idea Pro Black CB1 set?"
    a: "Eight clubs, 4-iron through gap wedge. The CB1 was not offered with a 3-iron."
  - q: "What is the difference between the Adams Idea Pro Black CB1 and Idea Black CB2 irons?"
    a: "The two share nearly identical lies and lengths through the set, but the CB2 (announced about three weeks after the CB1 shipped) strengthened every shared loft by roughly one degree - for example the 7-iron moved from 34 degrees on the CB1 to 33 degrees on the CB2."
