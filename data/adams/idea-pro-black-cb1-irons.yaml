description: >
  The Idea Pro Black CB1 is the cavity-back sibling of the Idea Pro Black
  muscle-back blade (sold simply as "Idea Pro Black" when it launched in 2009,
  later relabelled "Idea Pro Black MB" once Adams reused the Idea Pro Black name
  for a hybrid). Announced 31 March 2010 and shipping from 15 April 2010 at
  899.99 USD in steel, the CB1 is forged from 8620 carbon steel with a
  nickel-chrome and black PVD finish, using a milled cavity and precisely
  located center of gravity that Adams said was originally developed for its
  own tour staff, including Tom Watson, before joining the retail Idea range.
  It shipped only as a 4-iron through gap wedge set with no 3-iron offered, and
  within about three weeks was effectively superseded at the top of Adams'
  lineup by the Idea Black CB2 (announced 21 April 2010): CB2 keeps almost the
  same lies and lengths but strengthens every shared loft by roughly a degree,
  pointing to the CB2 being a fast running refinement of the CB1 rather than a
  full redesign.
