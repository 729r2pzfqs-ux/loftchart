faq:
  - q: "What is the loft of an Adams Idea MB2 7-iron?"
    a: "The Adams Idea MB2 7-iron has a loft of 34 degrees, with a 62.5-degree lie and a 37-inch length."
  - q: "What clubs come in a stock Adams Idea MB2 set?"
    a: "The stock set is 3-iron through pitching wedge, with a 50-degree gap wedge available. It was the only set in Adams' 2012 line-up to include a 3-iron."
  - q: "Do Adams Idea MB2 irons rust?"
    a: "Yes, by design. The forged 8620 carbon steel heads are left with a raw, unplated finish that develops rust with use, which Adams said preserved groove volume and feel."
