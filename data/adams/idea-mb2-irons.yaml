description: >
  The Idea MB2 is Adams' 2011 muscle-back blade, forged from 8620 carbon steel and
  left in a raw, unplated finish that rusts with use. Brass weight plugs in the sole
  lower the centre of gravity, which Adams pitched at shot shaping and control rather
  than forgiveness. The stock set runs 3-iron through pitching wedge - the only set in
  Adams' 2012 line-up to include a 3-iron - with a 50-degree gap wedge available, and
  lofts follow a classic blade ladder with a 34-degree 7-iron and a 46-degree pitching
  wedge. It sat above the Idea Pro a12 and Idea Black CB2 as the best-player option in
  the range and retailed around 999.95 USD in steel.
