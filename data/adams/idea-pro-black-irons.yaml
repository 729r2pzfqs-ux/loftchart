faq:
  - q: "What is the loft of an Adams Idea Pro Black 7-iron?"
    a: "The Adams Idea Pro Black 7-iron has a loft of 35 degrees, with a 62.5-degree lie and a 37-inch length."
  - q: "What clubs come in a stock Adams Idea Pro Black set?"
    a: "The set was offered in two configurations, 3-PW or 4-GW, all built on KBS Black Tour steel shafts in regular, stiff or extra-stiff flex."
  - q: "Is the Adams Idea Pro Black the same iron as the Idea Pro Black MB?"
    a: "Yes. Adams released it in spring 2009 simply as the Idea Pro Black. Once the company later reused the Idea Pro Black name for a hybrid, its own site navigation began calling this iron the Idea Pro Black MB to tell the two product lines apart, but the specs, shape and construction are identical."
