sources:
  - "Adams Golf official Idea Pro Black specs page, archived 16 April 2009 (https://web.archive.org/web/20090416225240/http://www.adamsgolf.com/products/irons/problack.php?page=specs was not separately captured that day, but the same overview page at that URL/date carries the identical spec table reproduced by the later capture below) and again at https://web.archive.org/web/20110515131745/http://adamsgolf.com/products/irons/problack.php?page=specs - manufacturer spec table for the 3-iron through GW giving loft, lie, length and swing weight, the KBS Black Tour stock steel shaft in R/S/X flex, the Adams Golf Tour Velvet grip, and the 'Idea Pro Black Muscle-Back Irons' product name; both captures show identical figures"
  - "Adams Golf official Idea Pro Black overview page, archived 16 April 2009 (https://web.archive.org/web/20090416225240/http://www.adamsgolf.com/products/irons/problack.php) - earliest known capture, confirms 'new for 2009' framing, 'played on the 2009 PGA, Champions and Nationwide Tours,' the 40% forgiveness rating, narrow sole and constant/low offset, and that the site's Irons navigation at this early date lists the model simply as 'IDEA PRO BLACK' with no MB suffix"
  - "Adams Golf official product page, archived 15 May 2011 (https://web.archive.org/web/20110515131745/http://adamsgolf.com/products/irons/problack.php?page=specs) - by this date the same page is filed under Irons navigation as 'IDEA PRO BLACK MB' alongside 'IDEA PRO BLACK CB1' and 'IDEA BLACK CB2', while a separate 'IDEA PRO BLACK' entry appears under Hybrids - confirms the MB suffix was added later purely to disambiguate the iron from the like-named hybrid, not because it is a different iron model"
  - "web.archive.org CDX index for adamsgolf.com/products/irons/problack.php - shows continuous captures from 16 April 2009 through 2012, with the page's own '(c) 2009 Adams Golf' footer on the earliest capture supporting a spring 2009 launch"
  - "year_discontinued 2011 reflects the launch of the Idea MB2, whose own predecessor field in this database names 'Adams Idea Pro Black MB' - i.e. this exact model - as its direct predecessor"
  - "Material listed as 'carbon steel' per the manufacturer page's own wording ('classically shaped from forged carbon steel'); the specific 8620 alloy is not stated on this page, but is used consistently across every other forged iron in Adams' Idea Pro/Idea Black lineage (Idea Pro Gold, Idea Pro Black CB1, Idea Black CB2, Idea MB2) per their manufacturer sources, so 8620 is very likely but not directly confirmed for this specific model - treat the alloy figure as medium confidence"
  - "Confidence note: no manufacturer bounce or offset figures were published for this model (Adams' site only rated offset qualitatively as 'Constant'), so those fields are omitted rather than estimated"
