description: >
  The Idea Pro Black is a traditionally-shaped muscle-back blade, forged from
  carbon steel and finished in black nickel ion plating, that Adams brought to
  the PGA, Champions and Nationwide Tours for the 2009 season before a full
  retail release that spring. Adams' own materials rated it just 40% on its
  forgiveness scale with a narrow sole and constant, minimal offset, putting it
  at the workability end of the "Idea Pro Black" family - a year later Adams
  added the Idea Pro Black CB1 as a cavity-back, perimeter-weighted companion
  for players wanting some of the blade's look with more forgiveness, and
  retailer and site navigation began labelling this original blade "Idea Pro
  Black MB" to keep the two apart. It is the same muscle-back model that the
  Idea MB2's own predecessor field calls "Adams Idea Pro Black MB."
