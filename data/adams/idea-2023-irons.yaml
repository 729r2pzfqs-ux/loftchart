  - "adamsgolf.com official 'Idea Irons' product page (adamsgolf.com/Idea-Irons/DW-TA289.html), Wayback Machine capture of 16 May 2023 — the 'STANDARD (R,S,A)' specification table with loft, lie, length, D1 swing weight and RH/LH availability for 4-iron through AW, the shorter RH-only 'LITE (L)' build at C3, and the KBS Max 85 / UST Helium Nanocore Black 6 and 5 stock shaft listings."
