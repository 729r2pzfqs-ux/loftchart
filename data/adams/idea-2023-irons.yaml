description: >
  The 2023 Idea marks TaylorMade's revival of the dormant Adams brand as a
  value-priced, direct-to-consumer line, roughly a decade after the last
  original Idea sets. The hollow-body head pairs a variable-thickness face and
  360-degree undercut with a low centre of gravity and the three-way "Tri-Sole"
  for cleaner turf interaction. Unlike most of the 2023 game-improvement field
  the lofts are not chased: the 7-iron is 30 degrees and the pitching wedge
  44.5, closing with a 50-degree A-wedge. The set runs 4-iron through A-wedge
  and is sold in full and shorter package configurations. Figures below are
  Adams' published standard men's specification, shared by the KBS Max 85 steel
  and UST Helium Nanocore graphite builds; a separate "Lite" build is one inch
  shorter per club at a C3 swing weight.
