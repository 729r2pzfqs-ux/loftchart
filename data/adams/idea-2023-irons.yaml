faq:
  - q: "What is the loft of a 2023 Adams Idea 7-iron?"
    a: "The 2023 Adams Idea 7-iron has a loft of 30 degrees, with a 62.5-degree lie and a 37.25-inch length in the standard build."
  - q: "Are the 2023 Adams Idea irons made by TaylorMade?"
    a: "Yes. TaylorMade has owned Adams Golf since 2012 and revived the brand in 2023 as a value-priced, direct-to-consumer line, with the Idea irons as its first new release."
  - q: "What clubs come in a 2023 Adams Idea set?"
    a: "The line runs 4-iron through a 50-degree A-wedge, sold in full-set and shorter package configurations rather than a single fixed make-up."
  - q: "Are the 2023 Adams Idea lofts strong?"
    a: "No. At 30 degrees on the 7-iron and 44.5 on the pitching wedge they are one to three degrees weaker than most 2023 game-improvement irons, a deliberate choice to keep flight high."
