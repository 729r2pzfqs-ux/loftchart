description: >
  The Idea a2 is the second generation of Adams' hybrid-iron combo set, aimed at what
  Adams called the aspirational player. The stock make-up replaces the long irons with
  a 20-degree 3 i-Wood and a 23-degree 4 i-Wood in a tour-derived shape, runs
  hollow-back 5-, 6- and 7-irons through the middle, and finishes with cavity-back
  8-iron through pitching wedge. Lofts stay traditional, with a 33-degree 7-iron and a
  45-degree pitching wedge, and 1 and 2 i-Woods, a 3- or 4-iron and GW, SW and LW heads
  were available through custom fitting. Only the iron clubs are listed below; the
  stock 3 i-Wood (20 degrees, 59-degree lie, 40 inches) and 4 i-Wood (23 degrees,
  60-degree lie, 39.25 inches) are hybrids rather than irons.
