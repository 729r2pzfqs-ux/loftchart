faq:
  - q: "What is the loft of an Adams Idea a2 7-iron?"
    a: "The Adams Idea a2 7-iron has a loft of 33 degrees, with a 62-degree lie and a 37.25-inch length."
  - q: "What clubs come in a stock Adams Idea a2 set?"
    a: "Eight clubs: a 20-degree 3 i-Wood and 23-degree 4 i-Wood replace the long irons, followed by hollow-back 5-, 6- and 7-irons and cavity-back 8-iron through pitching wedge. GW, SW and LW heads plus 1 and 2 i-Woods were available through custom fitting."
  - q: "What is the difference between the Idea a2 and the Idea a2 OS?"
    a: "The a2 is the standard game-improvement set with two hybrids and traditional lofts. The a2 OS is the oversize, maximum-game-improvement version with four hybrid clubs, slightly weaker top-end lofts in the scoring clubs and graphite-first stock shafts."
