faq:
  - q: "What is the loft of an Adams Idea Tech a4OS 7-iron?"
    a: "32 degrees, with a 62.25-degree lie and a 37.5-inch length. Like the rest of the mid-set, this '7' is an iron-like hybrid head rather than a conventional forged iron."
  - q: "What clubs come in a stock Adams Idea Tech a4OS set?"
    a: "Eight clubs, described by Adams as '3-PW, including seven hybrids': full 3, 4 and 5 hybrids, then iron-like hybrid heads at 6, 7, 8 and 9, and a conventional pitching wedge. Matching GW, SW and LW heads were sold separately to extend the set."
  - q: "What is the difference between the Idea Tech a4 and the Idea Tech a4OS?"
    a: "The standard Idea Tech a4 uses only a 3-hybrid and 4-hybrid ahead of six forged 8620 carbon-steel irons running 26 degrees at the 5-iron. The a4OS is the far more forgiving cast version, replacing five more clubs with hybrid or hybrid-style heads and running one to four degrees stronger through the set, with a 19-degree 3-hybrid and a 44-degree pitching wedge."
