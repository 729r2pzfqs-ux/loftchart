description: >
  The Idea Tech a4OS is the maximum-forgiveness half of Adams' 2008 a4 generation,
  launched 1 November 2008 as the successor to the Idea a3 OS and the far more
  forgiving sibling of the standard Idea Tech a4 (recorded in this dataset as Idea
  a4). It is a hybrid-iron combo set built around Boxer Technology, a magnesium
  crown and dual tungsten heel-toe weighting: the stock eight-club make-up is
  described by Adams as "3-PW, including seven hybrids" - full 3, 4 and 5 hybrids
  followed by iron-like hybrid heads at 6, 7, 8 and 9 and a conventional pitching
  wedge. Lofts run from 19 degrees at the 3-hybrid to 44 degrees at the pitching
  wedge, one to four degrees stronger through the set than the standard Idea Tech
  a4, which uses only two hybrids ahead of six forged irons. The set won a Golf
  Digest 2009 Hot List gold award as a Category Leader in Innovation in the
  super-game-improvement group before Adams replaced it with the Idea a7 OS in
  August 2009.
