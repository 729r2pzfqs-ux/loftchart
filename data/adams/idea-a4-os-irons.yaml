sources:
  - "Adams Golf official Idea Tech a4OS page, specs tab, 14 November 2008 capture (https://web.archive.org/web/20081114185434/http://www.adamsgolf.com/products/irons/a4os.php?page=specs) - contemporaneous manufacturer spec table giving loft, lie, length and graphite/steel swing weight for the 3-hybrid through PW, the eight-club '3-PW, including seven hybrids' set makeup, the Graphite Design Tour AD YSQ-HL and True Temper GS 75 stock shafts, and the Adams Traction Tour Velvet grip. Swing weights above use the graphite (SW-G) column, the only option offered on the 3, 4 and 5 hybrids; steel is offered only on the 6 through PW positions and runs one point heavier, building to D2 uniformly across 6 through 9 and matching the pitching wedge's D2"
  - "GlobeNewswire, 'Adams Golf Unveils Super Premium and Easy-to-Hit Idea Tech a4OS Hybrid Irons and Insight Tech a4OS Woods', 9 September 2008 (https://www.globenewswire.com/news-release/2008/09/09/384375/10185/en/Adams-Golf-Unveils-Super-Premium-and-Easy-to-Hit-Idea-Tech-a4OS-Hybrid-Irons-and-Insight-Tech-a4OS-Woods.html) - product-unveiling date, construction/material detail (Boxer Technology, magnesium crown, dual tungsten perimeter weighting, maraging-steel face, TPU vibration-dampening insert), and pricing (249.99 USD per individual hybrid, 999.99 USD full graphite set, 899.99 USD full steel set). The 1 November 2008 on-sale date is corroborated by the 3 November 2008 earliest Wayback capture of the product page"
  - "InTheHoleGolf.com Adams Idea Tech a4OS Iron Set page (https://www.intheholegolf.com/AGA4OSIS/Adams-Idea-Tech-a4OS-Iron-Set.html) - independent retailer corroboration of the same loft/lie/length/swing-weight table and the '3-PW, including seven hybrids' makeup. One conflict: this page lists the 3-hybrid length as 40.25 inches against the manufacturer capture's 40.5 inches; the manufacturer figure is used above"
  - "The Golf Wire, 'Adams Golf's Leadership Position Recognized with Four 2009 Hot List Gold Awards' (https://thegolfwire.com/140145-2/) - Golf Digest 2009 Hot List gold award for the Idea Tech a4OS as Category Leader in Innovation in the super-game-improvement group"
  - "year_discontinued is 2009, the year Adams announced the successor Idea a7 OS (6 August 2009, per the sourcing on data/adams/idea-a7-os-irons.yaml, whose predecessor field records this model as 'Adams Idea Tech a4OS'). Individual GW, SW and LW extension heads (approximately 49, 55 and 58 degrees per secondhand marketplace listings on eBay and SidelineSwap) were sold separately to extend the set, but no manufacturer table corroborating their lie/length/bounce was found, so they are omitted from specs above rather than estimated"
