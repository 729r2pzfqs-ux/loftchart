description: >
  The original Idea set launched Adams' integrated hybrid-iron concept: the stock men's
  make-up replaces the long irons with a 17-degree 3 i-Wood and a 21-degree 4 i-Wood,
  runs hollow-back mid irons through the middle of the set and finishes with cavity-back
  short irons. A 25-degree 5 i-Wood was offered with identical loft, lie and length to
  the 5-iron so the two could be swapped without changing the gapping. Lofts are
  traditional for the era, with a 33-degree 7-iron and a 45-degree pitching wedge, and
  matching GW, SW and LW extended the set. Only the iron clubs are listed below; the
  3 i-Wood (17 degrees, 58.5-degree lie, 40.5 inches) and 4 i-Wood (21 degrees,
  59.25-degree lie) are hybrids rather than irons. The set was retroactively referred
  to as the Idea a1 once the a2 generation arrived in 2005, and the name was revived
  for an unrelated hollow-body set in 2023.
