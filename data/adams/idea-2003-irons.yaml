  - "Adams Golf official iron specifications page, October 2005 capture (https://web.archive.org/web/20051028022405/http://www.adamsgolf.com/ir_spec.htm) - later capture of the same manufacturer chart, used to cross-check every row"
  - "Adams Golf Idea irons product page (https://web.archive.org/web/20041213021955/http://www.adamsgolf.com/ir_idea.htm) - set concept (i-Woods, hollow-back mid irons, cavity-back short irons) and target-player copy"
  - "Adams Golf 'Idea Irons' showcase page, 7 December 2002 Wayback capture (http://web.archive.org/web/20021207125540/http://www.adamsgolf.com/showcase/idea/idea_irons.asp) - shows the line was unveiled on the Adams site in late 2002 ahead of its 2003 retail launch; 2003 is used here as the introduction year, matching how period retail listings and secondary references date the set"
  - "Conflicts between the two spec captures: the 2004 table gives the 9-iron lie as 63.5 degrees (equal to the PW) and the LW length as 35.25 inches, while the 2005 table gives 63 degrees and 35.5 inches. The 63-degree 9-iron lie is used because it fits the per-club progression; the 35.25-inch LW length is used because it matches the SW step. Swing weights also differ slightly between captures (i-Woods D2 in 2004, D0 in 2005); the iron rows above are consistent across both."
  - "Confidence is medium: both sources are manufacturer tables, but they disagree in the small ways noted above and no printed Adams catalog is available to break the ties."
