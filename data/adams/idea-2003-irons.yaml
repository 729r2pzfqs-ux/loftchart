faq:
  - q: "What is the loft of an original Adams Idea 7-iron?"
    a: "The 2003 Adams Idea 7-iron has a loft of 33 degrees, with a 61.5-degree lie and a 37.5-inch length."
  - q: "What clubs come in an original Adams Idea set?"
    a: "The stock men's set replaces the long irons with a 17-degree 3 i-Wood and a 21-degree 4 i-Wood, then runs 5-iron through pitching wedge. A 25-degree 5 i-Wood could be swapped for the 5-iron, and matching GW, SW and LW heads extended the set."
  - q: "Is the original Adams Idea the same as the Idea a1?"
    a: "Yes. After the Idea a2 arrived in 2005, Adams' own site referred to the original set as the Idea a1. It is unrelated to the hollow-body Adams Idea irons that TaylorMade revived the name for in 2023."
