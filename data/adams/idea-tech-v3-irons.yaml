faq:
  - q: "What is the loft of an Adams Idea Tech V3 7-iron?"
    a: "33 degrees, with a 62.25-degree lie and a 37.5-inch length. The 7 in this set is a mid-hybrid head rather than a conventional iron."
  - q: "What clubs come in a stock Adams Idea Tech V3 set?"
    a: "Eight clubs in either configuration: 4, 5 and 6 hybrids and a 7 mid-hybrid, then 8-iron through gap wedge - forged cavity-back irons in the Forged set, or hollow hybrid-iron heads in the All Hybrid set."
  - q: "Are Adams Idea Tech V3 irons forged?"
    a: "In the Forged configuration the 8-iron through gap wedge are oversized cavity-back forged irons; the hybrids and the All Hybrid configuration's heads are cast stainless steel with tungsten weighting."
