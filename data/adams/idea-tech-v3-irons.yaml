description: >
  The Idea Tech V3 is Adams' 2010 hybrid-iron set, sold in two eight-club
  configurations: a Forged set of 4, 5 and 6 hybrids and a 7 mid-hybrid ahead of four
  oversized cavity-back forged irons from 8-iron to gap wedge, and an All Hybrid set
  that runs hollow hybrid-iron heads all the way down (with a 49.5-degree GW in place
  of the forged set's 50). The hybrids carry tungsten weighting in stainless steel
  heads with ultra-thin faces, finished in nickel-chromium plate with PVD black
  accents. Lofts run 33 degrees at the 7 and 45 at the pitching wedge, and 2 and 3
  hybrids, SW and LW extended the range. The forged-set clubs from the 7 mid-hybrid
  down are listed below; the 4-6 hybrids (22, 25 and 29 degrees) are hybrids rather
  than irons. It won a 2011 Golf Digest Hot List gold award and retailed around
  799.95 USD before the Idea Tech V4 replaced it in late 2011.
