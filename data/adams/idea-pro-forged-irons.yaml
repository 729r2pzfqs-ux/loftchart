description: >
  The Idea Pro Forged is the first forged players' set in the Idea line, announced on
  19 September 2006 and shipping from 1 October 2006 at 899 USD in steel and 1,099 USD
  in graphite. The eight-club stock make-up pairs the tour-proven 20-degree 3 and
  23-degree 4 Idea Pro i-Woods - then the most-played hybrids across the PGA,
  Champions and Nationwide Tours - with six compact cavity-back irons forged from soft
  8620 carbon steel, with minimal offset and a satin finish. Lofts are traditional for
  a players' iron, with a 34-degree 7-iron and a 46-degree pitching wedge. Only the
  irons are listed below; the two i-Woods are hybrids. Conventional 3- and 4-irons, a
  TriTech 4-iron and GW, SW and LW heads were available to order, and Allen Doyle won
  the 2006 U.S. Senior Open with the set's hybrids in play.
