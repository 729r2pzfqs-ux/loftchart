faq:
  - q: "What is the loft of an Adams Idea Pro Forged 7-iron?"
    a: "The Adams Idea Pro Forged 7-iron has a loft of 34 degrees, with a 61.5-degree lie and a 37-inch length."
  - q: "What clubs come in a stock Adams Idea Pro Forged set?"
    a: "Eight clubs: 20-degree 3 and 23-degree 4 Idea Pro i-Wood hybrids, then forged 5-iron through pitching wedge. Conventional forged 3- and 4-irons, a TriTech 4-iron and GW, SW and LW heads were custom options."
  - q: "Are Adams Idea Pro Forged irons really forged?"
    a: "Yes. The 5-iron through pitching wedge are forged from soft 8620 carbon steel with a compact cavity-back shape, minimal offset and a satin finish; the two i-Wood hybrids in the set are not forged irons."
