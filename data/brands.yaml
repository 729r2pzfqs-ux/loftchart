brands:
  - name: Ping
    slug: ping
    founded: 1959
    hq: "Phoenix, Arizona, USA"
    color: "#B01C2E"
    # Families named in the brand-page meta description — these are the terms
    # people search ("Ping G series"), not individual model names.
    families:
      - "Eye 2"
      - "Zing"
      - "G-series"
      - "i-series"
      - "S-series"
      - "Blueprint"
    blurb: >
      Founded by Karsten Solheim, Ping pioneered perimeter weighting and
      investment-cast irons. Ping's colour-code lie system and long production
      runs make its vintage sets among the most searched-for specs in golf.

  - name: Titleist
    slug: titleist
    founded: 1932
    hq: "Fairhaven, Massachusetts, USA"
    color: "#C8102E"
    families:
      - "DCI"
      - "690/695 forged"
      - "AP2"
      - "CB"
      - "T-Series"
    blurb: >
      Titleist's iron line has run from the DCI and Tour Model era through the
      AP/CB/MB numbered generations to the current T-Series, with a consistent
      focus on traditional lofts and tour-validated shaping.

  - name: TaylorMade
    slug: taylormade
    founded: 1979
    hq: "Carlsbad, California, USA"
    color: "#111111"
    families:
      - "rac"
      - "r7"
      - "Burner"
      - "RSi"
      - "M-series"
      - "P-series"
      - "SIM"
      - "Stealth"
    blurb: >
      TaylorMade built its name on metalwoods and later drove the strong-loft
      distance-iron trend with the Burner, RocketBladez and M families.

  - name: Callaway
    slug: callaway
    founded: 1982
    hq: "Carlsbad, California, USA"
    color: "#00447C"
    families:
      - "Big Bertha"
      - "X-series"
      - "Apex"
      - "Rogue"
      - "Mavrik"
      - "Paradym"
    blurb: >
      Callaway's X-series irons defined mainstream game improvement through the
      2000s, while the Apex line carries the forged players-distance side of
      the range.

  - name: Mizuno
    slug: mizuno
    founded: 1906
    hq: "Osaka, Japan"
    color: "#00447C"
    families:
      - "MP series"
      - "JPX"
      - "Pro series"
    blurb: >
      Mizuno's Grain Flow Forged MP irons are the reference point for forged
      feel. The MP-series blades and cavity backs of the 2000s remain in
      active demand on the used market.

  - name: Cleveland
    slug: cleveland
    founded: 1979
    hq: "Huntington Beach, California, USA"
    color: "#D6001C"
    blurb: >
      Best known for wedges, Cleveland's CG and Launcher iron families covered
      both tour-style cavity backs and high-launch game-improvement designs.

  - name: Cobra
    slug: cobra
    founded: 1973
    hq: "Carlsbad, California, USA"
    color: "#F5A800"
    blurb: >
      Cobra's King line spans forged players-distance irons and oversized
      game-improvement sets, often with distinctive colourways and
      progressive set construction.
    families:
      - "King"
      - "Speedzone"
      - "Radspeed"
      - "Aerojet"
      - "Darkspeed"

  - name: Srixon
    slug: srixon
    founded: 1930
    hq: "Kobe, Japan"
    color: "#004B8D"
    families:
      - "Z-Series"
      - "ZX"
      - "ZX MkII"
    blurb: >
      Srixon's Z and ZX irons pair Tour-grade forging with a progressive set
      design, running a compact players head and a wider-soled cavity back off
      the same generation number.

  - name: Wilson
    slug: wilson
    founded: 1914
    hq: "Chicago, Illinois, USA"
    color: "#E4002B"
    families:
      - "Staff Ci"
      - "Staff D-series"
      - "Staff Model"
      - "Dynapower"
    blurb: >
      Wilson Staff has made irons continuously for over a century, from the
      Dyna-Powered blades of the 1950s to the Staff Model forgings and D-series
      game-improvement sets on sale today.

  - name: Takomo
    slug: takomo
    founded: 2019
    hq: "Helsinki, Finland"
    color: "#1D3B32"
    families:
      - "101"
      - "201"
      - "301"
      - "MKII"
    blurb: >
      Takomo is a Finnish direct-to-consumer brand that sells forged S20C irons
      without a retail markup. The 101 blades, 201 cavity backs and 301 series
      built the company a following well beyond the Nordics.

  - name: Nike
    slug: nike
    founded: 1984
    hq: "Beaverton, Oregon, USA"
    color: "#111111"
    families:
      - "VR Pro"
      - "Covert"
      - "Vapor"
    blurb: >
      Nike Golf made clubs from 2002 until it exited hardware in 2016. Its VR
      and Vapor irons were built around Tour feedback from Tiger Woods and Rory
      McIlroy, and the specs are now hard to find outside archives.

  - name: Ben Hogan
    slug: ben-hogan
    founded: 1953
    hq: "Fort Worth, Texas, USA"
    color: "#000000"
    families:
      - "Apex"
      - "Edge"
      - "PTx"
      - "Icon"
    blurb: >
      The Ben Hogan Golf Equipment Company was relaunched in 2015 selling
      direct to consumers, and broke with convention by stamping its irons with
      loft in degrees rather than a club number.

  - name: PXG
    slug: pxg
    founded: 2014
    hq: "Scottsdale, Arizona, USA"
    color: "#111111"
    families:
      - "0311"
      - "0311 GEN series"
      - "0317"
      - "0211"
    blurb: >
      Parsons Xtreme Golf was founded by Bob Parsons in 2014 and sells direct,
      built to order. The 0311 line runs a T/P/XP family off one generation
      number, and PXG publishes a full loft, lie, length, offset and bounce
      chart for every head.

  - name: Honma
    slug: honma
    founded: 1959
    hq: "Sakata, Yamagata, Japan"
    color: "#B8860B"
    families:
      - "Tour World"
      - "TW747"
      - "TR20"
      - "TR21"
      - "Beres"
    blurb: >
      Honma has forged clubs in Sakata since 1959 and makes its own shafts.
      The Tour World line is the competition range, sold with VIZARD graphite
      as the stock shaft, so published lengths differ by shaft choice.

  - name: XXIO
    slug: xxio
    founded: 2000
    hq: "Kobe, Japan"
    color: "#0F4C81"
    families:
      - "XXIO numbered series"
      - "XXIO X"
      - "XXIO Prime"
      - "XXIO Forged"
    blurb: >
      XXIO is Dunlop Sports' lightweight premium line, built around
      counterbalanced heads and light graphite shafts for moderate swing
      speeds. Sets are typically sold 5-PW rather than from a 4-iron.

  - name: Adams
    slug: adams
    founded: 1987
    hq: "Plano, Texas, USA"
    color: "#0057B8"
    families:
      - "Idea"
      - "Idea Tech"
      - "XTD"
      - "Tight Lies"
    blurb: >
      Adams Golf built its reputation on the Tight Lies fairway wood and then
      on hybrid-iron combo sets, where the long irons are replaced by hybrids in
      the stock make-up. TaylorMade acquired the brand in 2012.

  # Brands below this line are kept in alphabetical order. The list above is
  # ordered by prominence because foot() links the first seven, so new entries
  # append here rather than interleaving and silently rewriting the footer.

  - name: Bridgestone
    slug: bridgestone
    founded: 1935
    hq: "Covington, Georgia, USA"
    color: "#E60012"
    families:
      - "J-series"
      - "Tour B"
      - "B-Series"
    blurb: >
      Bridgestone has made golf balls since 1935 and forges its tour irons
      through Bridgestone Sports in Tokyo, with Bridgestone Golf in Covington
      running the US side. The numbered CB and MB models are announced for Japan
      first, so several reach the US line a year or more after their release.

  - name: Kirkland Signature
    slug: kirkland-signature
    founded: 1995
    hq: "Issaquah, Washington, USA"
    color: "#005DAA"
    blurb: >
      Kirkland Signature is Costco's own label, and its golf clubs are sold as
      fixed boxed sets with a single shaft and grip option rather than a fitted
      build. Costco publishes set composition but not a per-club spec table, so
      the numbers here come from measured retail sets.

  - name: Miura
    slug: miura
    founded: 1957
    hq: "Himeji, Hyogo, Japan"
    color: "#2E4756"
    families:
      - "MB series"
      - "MC series"
      - "CB series"
      - "TC series"
      - "Passing Point"
    blurb: >
      Miura Giken has forged irons in Himeji since 1957, and the heads are still
      hand-forged from S20C by the Miura family workshop. Heads are sold
      component-style through authorised fitters rather than as stock sets, so
      published charts cover loft, lie and length but rarely a stock shaft.

  - name: New Level
    slug: new-level
    founded: 2017
    hq: "Scottsdale, Arizona, USA"
    color: "#0B7A75"
    families:
      - "623 series"
      - "702 series"
      - "902 series"
      - "PF series"
    blurb: >
      New Level Golf sells forged irons direct and through fitters, building
      every set to order from its own shaft menu. Founder Eric Burch came to the
      company from club fitting, and the 623 series put the brand on the map when
      it won MyGolfSpy's 2022 players-iron test.

  - name: Sub 70
    slug: sub-70
    founded: 2018
    hq: "Sycamore, Illinois, USA"
    color: "#C8462C"
    families:
      - "639"
      - "659"
      - "669"
      - "699"
    blurb: >
      Sub 70 is a direct-to-consumer maker that hand-builds every club in
      Sycamore, Illinois, and prices sets at roughly half the big-OEM figure by
      cutting retail and advertising out. Its 659 players heads share one loft
      and lie chart so they can be blended into combo sets.

  - name: Tommy Armour
    slug: tommy-armour
    founded: 1985
    hq: "Morton Grove, Illinois, USA"
    color: "#8C7853"
    families:
      - "Silver Scot"
      - "845 series"
      - "Atomic"
    blurb: >
      PGA Golf took the Tommy Armour name in 1985, licensing it from the family
      of the Scottish major winner, and the 845s Silver Scot that followed became
      one of the best-selling iron sets ever made. The brand changed hands
      repeatedly after the 1990s and is now a Dick's Sporting Goods label.

  - name: Tour Edge
    slug: tour-edge
    founded: 1986
    hq: "Batavia, Illinois, USA"
    color: "#A6192E"
    families:
      - "Exotics"
      - "Hot Launch"
      - "Bazooka"
    blurb: >
      Tour Edge runs two iron lines in parallel: Exotics for the premium
      hollow-body and forged models, and Hot Launch for the value and
      game-improvement end. The company does not publish offset or bounce for
      most models, so those columns are often blank.
