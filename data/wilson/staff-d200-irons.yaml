faq:
  - q: "What is the loft of a Wilson Staff D200 7-iron?"
    a: "The Wilson Staff D200 7-iron has a loft of 31 degrees, with a 62-degree lie and a 37.5-inch steel-shaft length."
  - q: "What clubs come in a stock Wilson Staff D200 set?"
    a: "The core set is 4-iron through pitching wedge, with a 47-degree gap wedge and a 55-degree sand wedge available to complete the bottom of the bag."
  - q: "What changed from the Wilson D100 to the D200?"
    a: "The D200 kept the D100's large undercut cavity but thinned the cavity bottom for more face flex, added heel and toe weight pods for about five percent more MOI, and raised and narrowed the sole slightly."
