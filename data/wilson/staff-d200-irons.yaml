description: >
  The D200 continued Wilson's superlight D-series game-improvement line,
  keeping the large undercut cavity of the D100 but thinning the cavity bottom
  so the face could flex faster and adding weight pods in the heel and toe that
  Wilson claimed raised MOI by five percent. The sole was raised and narrowed
  slightly compared with the D100. Lofts are moderate-strong for the class,
  with a 31-degree 7-iron and a 43-degree pitching wedge, and the 47-degree gap
  wedge fills the large gap to the 55-degree sand wedge. Figures below are the
  standard men's steel specification for the 4-iron through sand wedge ladder.
