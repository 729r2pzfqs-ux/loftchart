description: >
  The Staff Model XB is an all-new hollow-body model announced 27 January
  2026 alongside a refreshed Staff Model Blade and Staff Model CB, positioned
  as a players-distance iron with a tour-inspired profile rather than a
  successor to any earlier Wilson Staff line. It is forged from 8620 carbon
  steel with a hollow-body construction that shifts weight to the perimeter
  for higher MOI, an internal urethane injection to damp vibration, and
  tungsten weighting; Wilson's Fluid Feel Hosel and a precision-milled face
  carry over from the Blade and CB. Lofts are meaningfully stronger than the
  Blade/CB pair — a 32-degree 7-iron and 46-degree pitching wedge, versus 34
  and 46 on those models — while lies and lengths match the rest of the 2026
  family. The stock set runs 2-iron through gap wedge (ten clubs, with the
  2-iron offered right-handed only); the retailer spec table lists this as a
  4-PW stock configuration for pricing purposes, with a seven-piece steel set
  at $1,399.99 / £1,169. Figures below are the standard men's steel-shaft
  specification.
