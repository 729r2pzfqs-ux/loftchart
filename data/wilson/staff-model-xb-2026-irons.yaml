sources:
  - "2nd Swing Golf 'Wilson Staff 2026 Staff Model XB Iron Set' (2026 STAFF XB STS) product page, retrieved directly (rendered page, not a search summary) August 2026 — full loft/length/lie/bounce/offset/swing-weight table for 2-iron through GW (2-iron right-handed only), 4-PW stock set makeup, Nippon NS Pro Modus 3 Tour 110 stock steel shaft (R/S) and Golf Pride Z-Grip Standard stock grip. Retailer-published table, not a Wilson spec sheet."
  - "Today's Golfer, 'Wilson Staff Model Irons 2026: Everything You Need to Know', published 27 January 2026 — independently matching 7-iron loft/lie/length (32°/62°/37.25\"), 2-GW availability, Nippon Modus Tour 110 stock shaft, and $1,399.99 / £1,169 seven-piece pricing. Describes XB as a 'players' distance iron' for 'a wide range of golfers seeking forgiveness with distance'."
  - "Golfmagic, 'Wilson gets serious about its irons with three new forged Staff Models for 2026' — 27 January 2026 announcement date, describes XB as a new hollow-body 'Players Performance' model with a thicker topline and larger profile than the CB, internal urethane insert, engineered rib supports, a parabolic mass pad and tungsten weights for MOI and ball speed."
  - "Golfalot and Plugged In Golf 2026 XB reviews (search-indexed) corroborate the forged 8620 carbon steel hollow-body construction, urethane injection for sound/feel, and positioning as a distance-and-forgiveness option built around a tour-inspired shape; full review text could not be retrieved directly (403 responses) so these are counted as secondary corroboration only, not a primary source for the numeric spec table."
  - "The XB has no direct predecessor in Wilson's Staff Model line; it is reported everywhere consulted as an all-new addition, not a renamed or relaunched prior model, so predecessor is left null rather than guessed."
