faq:
  - q: "What is the loft of a Wilson Staff Model XB 7-iron?"
    a: "The Staff Model XB 7-iron has a loft of 32 degrees, a 62-degree lie and a 37.25-inch steel-shaft length — two degrees stronger than the 34-degree 7-iron on the companion 2026 Staff Model Blade and CB."
  - q: "Is the Staff Model XB a new model or a relaunch of an older Wilson iron?"
    a: "It is an all-new model, introduced alongside the refreshed Staff Model Blade and CB on 27 January 2026. It has no prior-generation predecessor in Wilson's lineup."
  - q: "What clubs come in a Wilson Staff Model XB set?"
    a: "The model is built from 2-iron (right-handed only) through a 50-degree gap wedge, ten clubs in total, with 4-PW as the retailer's stock configuration and a seven-piece steel set priced at $1,399.99 (about £1,169)."
  - q: "How is the Staff Model XB different from the Staff Model CB?"
    a: "The XB is a hollow-body construction with an internal urethane insert and tungsten weighting for higher MOI, aimed at a players-distance category, while the CB is a solid forged cavity back. The XB also runs meaningfully stronger lofts — a 32-degree 7-iron versus the CB's 34 degrees."
