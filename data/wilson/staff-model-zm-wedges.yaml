description: >
  The Staff Model ZM is Wilson's 2024 tour wedge, announced on 19 March 2024
  and at retail from 2 April. The forged 8620 head carries deeper ZM grooves
  cut into a precision-milled, garnet-blasted face for wet-condition spin, a
  straighter leading edge than the previous Staff Model, and a centre of
  gravity that rises with loft. Wilson names no grinds — the line is sold by
  bounce tier instead, low (6 degrees), mid (8 to 10) and high (12) — in 10
  loft/bounce combinations from 50 to 60 degrees, with 46 and 48 degree
  heads available by custom order. A high-toe ZM HT variant with full-face
  grooves is sold alongside and is not charted here.
