faq:
  - q: "What lofts does the Wilson Staff Model ZM come in?"
    a: "The standard line runs from 50 to 60 degrees — 10 loft and bounce combinations — with 46 and 48 degree heads available by custom order."
  - q: "What bounce options does the Wilson Staff Model ZM offer?"
    a: "Wilson sells it by bounce tier rather than named grinds: low (6 degrees, at 58 and 60), mid (8 degrees at 50-54 and 10 degrees at 56-60) and high (12 degrees, at 56 and 60)."
  - q: "Is the Wilson Staff Model ZM forged?"
    a: "Yes — forged from soft 8620 carbon steel, with the ZM grooves cut into a precision-milled, garnet-blasted face."
