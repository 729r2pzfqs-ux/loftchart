sources:
  - "wilson.com official 'Launch Pad 2 STL' product page (wilson.com/en-us/product/launch-pad-2-stl-wg1p0262), Wayback Machine capture of 14 March 2023 — the full '2022 Launch Pad - USA Men's Irons' table supplying loft, lie, length and hosel offset for 5-iron through SW, the RH/LH row showing the SW as right hand only with the '*Custom Option' footnote, the two swing-weight rows (D1 and D0), and the stock KBS Max Ultralite steel / Project X Evenflow graphite / Wilson Staff Midsize grip listing. The page's Magento data also lists '5-PW, GW' as the set composition"
  - "Same archived Wilson page, technology copy: 'LOW CG MEANS HIGHER FLIGHT — Weight has been removed and mass lowered, creating an iron that launches the ball higher and helps it fly farther with less effort' and the 'OPTIMIZED TURF INTERACTION SOLE' section on the 2022 sole reshape that keeps the head out of the grass"
  - "The two swing-weight rows in Wilson's table are not labelled in the archived capture, so no per-club swing_weight is recorded; D1/D0 most plausibly correspond to the steel and graphite builds and are noted in the description only"
  - "Launch announcement in early 2022 per Wilson's Launch Pad family press coverage (MyGolfWay 'New Launch Pad irons, woods and hybrids', Breaking Eighty notes the line was announced in March 2022) and National Club Golfer's Launch Pad 2 irons review; the category follows National Club Golfer, which classes it as a super game improvement iron for high handicappers and new players. year_discontinued is null because Wilson still lists no successor to the Launch Pad 2 irons"
