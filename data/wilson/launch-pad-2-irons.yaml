description: >
  The Launch Pad 2 is the second generation of Wilson's lightest, easiest-launching iron
  family, announced in early 2022 as part of a full Launch Pad line of driver, woods,
  hybrids and irons aimed at new golfers and players who struggle with contact. Weight is
  removed and mass lowered for a lower centre of gravity, and the wide sole is optimised
  for turf interaction to resist digging and chunking. Lofts are moderate rather than
  chased for distance — a 30-degree 7-iron and a 44-degree pitching wedge — which keeps
  flight high. Wilson's spec table runs 5-iron through sand wedge; the stock set is
  5-PW plus gap wedge, with the 55-degree sand wedge a custom option offered right hand
  only. Stock builds were the KBS Max Ultralite steel shaft or Project X Evenflow
  graphite with a Wilson Staff midsize grip; the published table carries two unlabelled
  swing-weight rows, D1 and D0, matching the steel and graphite builds. Lengths and
  offsets below are Wilson's published figures (offset is published in inches).
