faq:
  - q: "What is the loft of a Wilson Launch Pad 2 7-iron?"
    a: "The Wilson Launch Pad 2 7-iron has a loft of 30 degrees, with a 63-degree lie and a 37.5-inch length."
  - q: "What clubs come in a stock Wilson Launch Pad 2 set?"
    a: "The stock set is 5-iron through pitching wedge plus a 49-degree gap wedge, in right or left hand. A 55-degree sand wedge is available as a custom option, right hand only."
  - q: "Are the Wilson Launch Pad 2 lofts strong?"
    a: "No — Wilson kept them moderate to preserve height. The 30-degree 7-iron and 44-degree pitching wedge are one to two degrees weaker than most distance-focused game-improvement irons of 2022, such as the 29-degree 7-iron on the Cleveland Launcher XL."
