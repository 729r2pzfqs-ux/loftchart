description: >
  The Deep Red irons carried Wilson's early-2000s Deep Red brand into the iron
  category from February 2002, pairing oversized stainless cavity-back heads with
  the company's signature Fat Shaft — a nearly half-inch shaft tip running straight
  into the head to stiffen the joint and resist twisting. A urethane-filled "fluid
  feel" insert in the cavity damps the sting of mishits. The published range ran
  from a 1-iron to a lob wedge; stock sets were sold 3-PW or 4-SW. The Deep Red II
  family replaced it in 2003.
