faq:
  - q: "What is the loft of a Wilson Deep Red 7-iron?"
    a: "The Wilson Deep Red 7-iron has a loft of 32 degrees, a lie of 62 degrees and a length of 37.5 inches."
  - q: "What is the Fat Shaft on Wilson Deep Red irons?"
    a: "It is Wilson's oversized shaft tip — nearly half an inch in diameter where it meets the head — designed to stiffen the hosel joint and reduce head twisting on off-centre strikes."
  - q: "When were Wilson Deep Red irons made?"
    a: "The original Deep Red irons launched in February 2002 and were replaced by the Deep Red II family in 2003."
