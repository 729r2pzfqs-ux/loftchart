faq:
  - q: "What lofts do the 2025 Wilson Dynapwr fairway woods come in?"
    a: "The Dynapwr Carbon comes in 13.5, 15, 16.5, 18 and 21 degrees; the Dynapwr Max in 15, 18 and 21."
  - q: "Is the Wilson Dynapwr fairway wood adjustable?"
    a: "Only the Carbon, which carries Wilson's six-way adjustable hosel. The Max has a bonded hosel and plays at its stamped loft."
  - q: "What is the difference between the Dynapwr Carbon and Max fairway woods?"
    a: "The Carbon is the lower-spinning player's head — carbon crown, 30 grams of forward tungsten, adjustable hosel, flatter lies. The Max is the bonded game-improvement head with a rear weight for high launch, at 50 dollars less."
