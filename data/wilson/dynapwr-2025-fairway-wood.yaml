description: >
  Wilson's 2025 Dynapwr fairway woods launched in February 2025 with the
  second-generation Dynapwr drivers. The Carbon is the player's head — carbon
  crown, 30 g of low-forward tungsten and a six-way adjustable hosel — in
  five lofts from a 13.5° 3+ wood; the Max is the bonded, higher-launching
  forgiveness head with a 12 g rear weight, in three lofts. As of October
  2026 the line is still current, with no 2027 replacement announced.
variants:
  - name: Dynapwr Carbon
    description: >
      The adjustable player's head with a carbon crown and 30 g tungsten
      weight for a penetrating flight, in five lofts; the 3+ (13.5°), 4-wood
      and 7-wood are right-hand only.
  - name: Dynapwr Max
    description: >
      The bonded forgiveness head with a thin-cast steel crown and 12 g rear
      weight for high, towering flight, in three lofts; the 7-wood is
      right-hand only.
