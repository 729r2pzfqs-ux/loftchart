description: >
  Wilson's 2025 Dynapwr generation reached retail on 12 February 2025 as a
  three-head family — Carbon, LS and Max — and grew to four on 29 January
  2026 when the Dynapwr Max+ arrived as Wilson's first driver past 10,000
  g·cm² of combined MOI. All use the PKR-360 variable-thickness face and
  Wilson's Open Hosel Construction, which removes material behind the
  six-way adjustable hosel so the face can flex more freely. The Carbon is
  the tour-inspired head Wilson says fits the most golfers, the compact
  445 cc LS carries the heaviest movable weights for the biggest CG shift,
  the all-titanium Max is the big-footprint forgiveness head, and the Max+
  sits above it with a carbon crown and the 10K MOI figure. Lite builds at
  44.75 inches and D0 cover slower swing speeds.
variants:
  - name: Dynapwr Carbon
    head_cc: 460
    description: >
      The tour-inspired middle head balancing workability and forgiveness —
      the one Wilson says fits the most golfers — with swappable 3 g front
      and 9 g back weights. 8° is right-hand only.
  - name: Dynapwr LS
    head_cc: 445
    description: >
      The most compact, fade-biased low-spin head, carrying the heaviest
      movable weights in the family (6 g and 12 g front-back) for the
      biggest CG shift. 8° is right-hand only.
  - name: Dynapwr Max
    head_cc: 460
    description: >
      The largest-footprint, highest-MOI head of the 2025 trio —
      all-titanium, with a 19 g flippable asymmetric rear weight set neutral
      or heel-side for draw.
  - name: Dynapwr Max+
    head_cc: 460
    description: >
      Added January 2026: Wilson's first 10K-MOI driver, with a carbon crown,
      a re-engineered lighter PKR-360 face and an adjustable rear weight. A
      12° Lite build (44.75 inches, D0, UST Helium NCT 4) serves slower
      swings.
