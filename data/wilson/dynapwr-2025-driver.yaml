faq:
  - q: "What lofts does the Wilson Dynapwr come in?"
    a: "The 2025-26 generation: Dynapwr Carbon and LS in 8, 9 and 10.5 degrees (8s right-hand only), and the Dynapwr Max and Max+ in 9, 10.5 and 12."
  - q: "How adjustable is the Wilson Dynapwr hosel?"
    a: "Six positions spanning minus 1 to plus 2 degrees of loft in half-degree steps. Unusually, the lie never changes — only loft and, with it, face angle, which closes up to about 2 degrees as loft is added."
  - q: "What is the difference between the Dynapwr Max and Max+?"
    a: "The 2025 Max is all-titanium with a 19 gram flippable rear weight; the 2026 Max+ adds a carbon crown and a lighter PKR-360 face to push combined MOI past 10,000 g·cm² — Wilson's first 10K driver — while keeping the same loft menu."
  - q: "Which Dynapwr suits a slower swing speed?"
    a: "The 12 degree Max or Max+ in the Lite build — 44.75 inches, D0 swing weight and the lightweight UST Helium NCT 4 shaft — is Wilson's package for swings well under 90 mph."
