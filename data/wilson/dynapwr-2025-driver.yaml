hosel:
  system: "Six-way adjustable hosel"
  loft_range: "−1° to +2°"
  positions: 6
  lie_effect: >
    None — Wilson's hosel changes loft and face angle only, with no lie
    adjustment at any position.
  face_note: >
    Face angle shifts with loft, up to about 2°: adding loft closes the
    face, so a 9° head set to 11° sits visibly closed at address.
  notes: >
    The six positions span −1° to +2° in half-degree steps. Wilson does not
    publish the full position-by-position table online, so the exact six
    labels are not reproduced here — the confirmed anchors are the range,
    the half-degree increments, zero lie change and the face-angle shift.
