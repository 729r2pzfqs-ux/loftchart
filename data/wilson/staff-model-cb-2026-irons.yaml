description: >
  The second-generation Staff Model CB was announced 27 January 2026 as part
  of a refreshed forged Staff Model family alongside the Blade and the new
  hollow-body XB, with US retail following in early February 2026. The head
  is forged from 8620 carbon steel with a precision-milled face and Wilson's
  Fluid Feel Hosel, which strips mass from the hosel and shifts it toward the
  toe; the compact cavity-back shape carries a shorter blade length, softened
  edges and a tighter offset than the 2020 original (0.110 inches at the
  3-iron tapering to 0.040 at the gap wedge), plus a brushed satin finish in
  place of the earlier chrome look. Sources describing the 2026 model do not
  repeat the 2020 version's Tri-Brace stabiliser or tungsten toe-weighting
  language, so those features are not assumed to carry over. Lofts, lies and
  lengths are unchanged from the 2020 CB, with a 34-degree 7-iron and
  46-degree pitching wedge. The stock set runs 3-iron through gap wedge (nine
  clubs); a seven-piece steel set lists at $1,399.99 / £1,169. Figures below
  are the standard men's steel-shaft specification.
