  - "2nd Swing Golf 'Wilson Staff 2026 Staff Model CB Iron Set' (2026 STAFF CB STS) product page, retrieved directly (rendered page, not a search summary) August 2026 — full loft/length/lie/bounce/offset/swing-weight table for 3-iron through GW, 4-PW stock set makeup, True Temper Dynamic Gold Mid 115 stock steel shaft (R/S/X) and Golf Pride Z-Grip Standard stock grip. Note this is a different product page from the still-listed 2020 CB (2ndswing.com/staff-mod-cb-new-sts), which was checked separately to avoid conflating the two generations' tech descriptions. Retailer-published table, not a Wilson spec sheet."
