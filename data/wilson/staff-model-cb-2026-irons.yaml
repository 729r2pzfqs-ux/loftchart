faq:
  - q: "What is the loft of a 2026 Wilson Staff Model CB 7-iron?"
    a: "The 2026 Staff Model CB 7-iron has a loft of 34 degrees, a 62-degree lie and a 37.25-inch steel-shaft length — the same numbers as the 2020 Staff Model CB and the 2026 Staff Model Blade."
  - q: "What clubs come in a 2026 Wilson Staff Model CB set?"
    a: "The model is built from 3-iron through a 50-degree gap wedge (nine clubs), with 4-PW as the typical stock set makeup and a seven-piece steel set priced at $1,399.99 (about £1,169)."
  - q: "How is the 2026 Staff Model CB different from the 2020 version?"
    a: "Lofts, lies and lengths are unchanged, but the 2026 CB has a more compact head, tighter offset through the set, and a brushed satin finish rather than chrome. Descriptions of the 2026 model do not repeat the 2020 version's Tri-Brace stabiliser or tungsten toe-weighting claims."
  - q: "How is the 2026 Staff Model CB different from the 2026 Staff Model Blade?"
    a: "Both share the same 34-degree 7-iron and 46-degree pitching wedge lofts and lengths, but the CB is a cavity back with a touch more offset and forgiveness and adds a 50-degree gap wedge that the Blade does not have."
