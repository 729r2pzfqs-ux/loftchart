description: >
  The FG Tour V2 is the second generation of Wilson's forged players cavity back,
  announced with the 2012 line on 10 November 2011 and developed with Padraig
  Harrington, Ricky Barnes and Kevin Streelman. Forged from 8620 mild carbon steel
  with the mass concentrated directly behind the impact zone, it carries a thinner
  topline and less offset than the original FG Tour while keeping the identical
  traditional loft ladder — a 35-degree 7-iron and 47-degree pitching wedge.
  Retailers commonly list it as a 2012 model; this entry uses the announcement year
  per this database's convention.
