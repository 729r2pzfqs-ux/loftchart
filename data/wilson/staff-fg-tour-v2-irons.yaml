faq:
  - q: "What is the loft of a Wilson Staff FG Tour V2 7-iron?"
    a: "The Wilson Staff FG Tour V2 7-iron has a loft of 35 degrees, a lie of 62 degrees and a length of 37.25 inches."
  - q: "When did the Wilson Staff FG Tour V2 irons come out?"
    a: "Wilson announced them on 10 November 2011 as part of its 2012 line, with full retail availability from Spring 2012. The FG Tour V4 replaced them in 2014."
  - q: "What shaft came stock in the FG Tour V2 irons?"
    a: "The stock steel shaft was the KBS Tour, fitted with a Lamkin Crossline grip."
