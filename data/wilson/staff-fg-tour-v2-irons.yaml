sources:
  - "2nd Swing Golf specification table for the Wilson Staff FG Tour V2 single irons (https://www.2ndswing.com/golf-clubs/single-irons/wilson-staff-fg-tour-v2-single-iron) — supplied the 2-PW loft, lie, length and D2 swing weight data. The table prints the 8-iron loft as 36 degrees, an evident typo corrected to 39 here: the surrounding ladder runs 35-39-43 in every other FG Tour generation (original, V4) and a 36-degree 8-iron would leave a 1-degree gap to the 7-iron and a 7-degree gap to the 9-iron"
  - "The Golf Wire 'Wilson Golf Introduces New Line Of Premium Golf Equipment For 2012', 10 November 2011 — announcement date, development with Harrington/Barnes/Streelman, thinner topline and reduced offset versus the original FG Tour, retail availability from Spring 2012 (hence the common 2012 model-year designation)"
  - "GolfWRX and Independent Golf Reviews FG Tour V2 reviews — 8620 mild carbon steel forging with mass behind the impact zone, KBS Tour stock steel shaft with Lamkin Crossline grip"
  - "Offset and bounce were not published in the surviving tables and are omitted; confidence is medium"
