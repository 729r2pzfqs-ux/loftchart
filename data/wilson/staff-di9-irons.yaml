faq:
  - q: "What is the loft of a Wilson Staff Di9 7-iron?"
    a: "The Wilson Staff Di9 7-iron has a loft of 32 degrees, a lie of 62 degrees and a steel-shaft length of 37.5 inches."
  - q: "What is the Di9's 3.5-degree loft strategy?"
    a: "From the 4-iron down to the gap wedge every loft gap is exactly 3.5 degrees, and Wilson added a 46-degree approach wedge between the pitching wedge and gap wedge so distance gaps stay even through the scoring clubs."
  - q: "When did the Wilson Staff Di9 irons come out?"
    a: "Wilson announced them on 27 August 2008 as its powerful, forgiving distance iron for 2009, and the Di11 replaced them in 2010."
