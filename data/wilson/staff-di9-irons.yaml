description: >
  Announced on 27 August 2008 for the 2009 season, the Di9 is Wilson Staff's
  distance iron built around a deliberate 3.5-degree loft strategy: every gap from
  the 4-iron to the gap wedge is exactly 3.5 degrees, with an approach wedge slotted
  in to keep short-iron gapping even. The low-profile, wide-sole head adds a longer
  hosel for higher MOI, a toe-biased cavity that widens the sweet spot, and a
  urethane "shock trap" insert in the heel to damp mishit vibration. The stock
  wide-tip True Temper TX-99 steel shaft was the lightest Wilson had produced at 99
  grams.
