description: >
  The C200 launched Wilson's C (crossover) category, sitting between the
  distance-first D line and the tour-focused FG Tour models. Its FLX Face
  construction cuts material away where the face meets the body - Wilson
  claimed 76 percent of the face is not touching the chassis - with the
  resulting Power Holes filled by black TE031 urethane, letting the whole
  face flex for ball speed in a mid-sized head a better player can still
  work. Lofts are only moderately strong, with a 32-degree 7-iron and a
  44-degree pitching wedge. The stock set is 4-iron through gap wedge with
  an optional 3-iron for right-handers; figures below are the standard
  men's steel specification.
