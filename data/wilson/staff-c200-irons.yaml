faq:
  - q: "What is the loft of a Wilson Staff C200 7-iron?"
    a: "The Wilson Staff C200 7-iron has a loft of 32 degrees, with a 62-degree lie and a 37.5-inch steel-shaft length."
  - q: "What does the C stand for in the Wilson Staff C200?"
    a: "Crossover. Wilson positioned the C line between its D (distance/game-improvement) and F (feel/tour) lines, aimed at players who want distance technology in a more compact, workable head."
  - q: "What is FLX Face technology on the Wilson C200?"
    a: "Wilson cut material away where the face joins the body - claiming 76 percent of the face does not touch the chassis - and filled the resulting Power Holes with TE031 urethane, so more of the face flexes at impact for ball speed."
