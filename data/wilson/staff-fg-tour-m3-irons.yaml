faq:
  - q: "What is the loft of a Wilson Staff FG Tour M3 7-iron?"
    a: "The Wilson Staff FG Tour M3 7-iron has a loft of 35 degrees, with a 62-degree lie and a 37.25-inch steel-shaft length."
  - q: "Are the Wilson FG Tour M3 irons forged?"
    a: "Yes. The heads are forged from 8620 carbon steel and finished in matte black PVD, with a progressive cavity that gets more compact through the scoring clubs."
  - q: "What year did the Wilson FG Tour M3 irons come out?"
    a: "Wilson unveiled the FG Tour M3 in late 2013 and sold it as a 2014-season model. It was replaced by the FG Tour V4 in late 2014."
