description: >
  The FG Tour M3 was the third generation of Wilson's FG Tour players cavity,
  forged from 8620 carbon steel and finished in a matte black PVD that broke
  from the chrome of the earlier FG Tour models. The design is progressive: a
  larger cavity and heel-toe weighting in the long irons shrinking toward a
  more compact, thicker-faced head in the scoring clubs. Lofts are fully
  traditional, with a 35-degree 7-iron and a 47-degree pitching wedge. The
  stock set is 4-iron through gap wedge. The M3 was unveiled in late 2013 and
  sold as a 2014-season model; year_introduced records the announcement year
  per the repository convention. Figures below are the standard men's steel
  specification.
