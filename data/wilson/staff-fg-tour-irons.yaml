description: >
  The original FG Tour launched Wilson's modern forged players line in 2010, a
  precision-forged mild carbon steel cavity back play-tested for more than 18 months
  on tour by Padraig Harrington and Ricky Barnes before release. The head carries a
  square toe, thin topline and minimally progressive offset in the tradition of
  Wilson forged classics like the FG-51, with a tour-configured sole for clean turf
  interaction. Lofts are traditional — a 35-degree 7-iron and 47-degree pitching
  wedge — and the same ladder carried through the V2, M3 and V4 that followed.
