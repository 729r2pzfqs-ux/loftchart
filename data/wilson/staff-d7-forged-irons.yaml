faq:
  - q: "What is the loft of a Wilson Staff D7 Forged 7-iron?"
    a: "The Wilson Staff D7 Forged 7-iron has a loft of 30.5 degrees, with a 62-degree lie and a 37.25-inch steel-shaft length."
  - q: "What is the difference between the Wilson D7 and D7 Forged irons?"
    a: "The standard D7 is a cast game-improvement iron with Power Holes around the sole and toe; the D7 Forged uses a forged 8620 carbon steel head with a urethane-filled Power Chamber and sole-only Power Holes, in a smaller players-distance shape with slightly stronger lofts club for club."
  - q: "What clubs come in a stock Wilson Staff D7 Forged set?"
    a: "The stock set is 4-iron through pitching wedge, with a 49-degree gap wedge available as a matching add-on."
