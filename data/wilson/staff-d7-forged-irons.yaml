description: >
  The D7 Forged took the Power Hole concept from the cast D7 and moved it into a
  forged 8620 carbon steel head aimed at players who want distance in a more
  compact package. A urethane-filled Power Chamber sits behind the face and the
  Power Holes are limited to the sole, so the look at address is much cleaner
  than the standard D7. Lofts are strong for the players-distance class, with a
  30.5-degree 7-iron and a 44-degree pitching wedge. The stock set is 4-iron
  through pitching wedge, with a 49-degree gap wedge available to match; the
  figures below are the standard men's steel specification.
