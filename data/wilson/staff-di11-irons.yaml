description: >
  The Di11 closed out Wilson Staff's Di distance line in 2010, built around what
  Wilson called the largest sweet spot of any iron it had made: weight stripped
  from the face perimeter and cavity leaves a large unsupported face, with mass
  moved low for launch and rearward for stability. Reviewers classed it at the
  most forgiving end of game improvement, and its spec sheet is unconventional —
  a 46-degree gap wedge sits only three degrees under the pitching wedge, leaving
  a nine-degree jump to the sand wedge.
