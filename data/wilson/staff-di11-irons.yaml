faq:
  - q: "What is the loft of a Wilson Staff Di11 7-iron?"
    a: "The Wilson Staff Di11 7-iron has a loft of 32 degrees, a lie of 62 degrees and a steel-shaft length of 37.5 inches."
  - q: "Are the Wilson Di11 irons forgiving?"
    a: "Yes — Wilson claimed the largest sweet spot of any iron it had produced, and reviewers placed the Di11 at the super-game-improvement end of the spectrum."
  - q: "Why is the Di11 gap wedge only 46 degrees?"
    a: "Wilson published a 43-degree pitching wedge and 46-degree gap wedge, an unusually tight 3-degree gap that leaves 9 degrees to the 55-degree sand wedge; players wanting even gapping often bent the GW weaker or added a wedge."
