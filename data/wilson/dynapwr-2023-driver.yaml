description: >
  The 2023 Dynapwr revived Wilson's Dynapower name roughly seventy years
  after the original irons, as a two-head driver family. The Dynapwr
  Titanium is the forgiveness model — a 16 g rear weight pulls the centre of
  gravity low and deep for a higher, neutral-to-draw flight, with lofts up
  to 13 degrees — while the Dynapwr Carbon trades the crown and sole for
  carbon panels and moves mass forward for lower spin. Both use a
  machine-learning-optimised variable-thickness face and Wilson's six-way
  adjustable hosel. The three-head 2025 Dynapwr generation replaced the
  pair.
variants:
