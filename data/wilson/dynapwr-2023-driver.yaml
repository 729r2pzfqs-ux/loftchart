      higher launch with neutral-to-draw bias, and a 13° top loft rare among
      flagship drivers.
  - name: Dynapwr Carbon
    head_cc: 460
    description: >
      The lower-spin distance head, with carbon crown and sole panels and a
      forward CG; D2 swing weight.
