faq:
  - q: "What lofts does the 2023 Wilson Dynapwr come in?"
    a: "The Dynapwr Titanium comes in 9, 10.5 and 13 degrees; the Dynapwr Carbon in 9, 10.5 and 12. The six-way hosel extends each a further minus 1 to plus 2 degrees."
  - q: "What is the difference between the Dynapwr Titanium and Carbon?"
    a: "The Titanium is the forgiveness model — a 16 gram rear weight for a low, deep CG and higher flight, up to a 13 degree loft. The Carbon swaps crown and sole for carbon panels and moves mass forward for a lower-spinning, lower flight."
  - q: "Is the 2023 Wilson Dynapwr adjustable?"
    a: "Yes — the same six-way hosel as the 2025 generation: minus 1 to plus 2 degrees of loft in half-degree steps, with no lie change at any position."
  - q: "Is the 2023 Dynapwr still in production?"
    a: "No — the 2025 Dynapwr generation (Carbon, LS and Max) replaced it. It is a used-market buy, usually at bargain prices for a machine-learning-faced driver."
