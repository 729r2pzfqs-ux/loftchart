sources:
  - "Two retailer specification tables: Golfio 'Wilson Staff Model CB Forged Iron Set - 24' (https://www.golfio.com/products/wilson-staff-model-cb-forged-iron-set-24-men, retrieved 29 September 2026) and 2nd Swing 'Wilson Staff 2024 Staff Model CB Iron Set' (https://www.2ndswing.com/golf-clubs/iron-sets/wilson-staff-2024-staff-model-cb-iron-set, retrieved 29 September 2026). They agree on every loft, lie, length and swing weight above for the 4-iron through pitching wedge, and on every offset except the 6-iron, where Golfio prints 0.00 and 2nd Swing 0.09; 0.09 fits the progression and is used. Neither is a Wilson spec sheet: wilson.com could not be read, so confidence is medium."
  - "golf.com 'Wilson Staff Model Blades, CB irons: Everything you need to know', published 11 January 2024 (https://golf.com/gear/irons/wilson-staff-model-blade-cb-irons-2024/) — announcement date, retail from 24 January 2024, the 4-PW stock set, forged 8620 carbon steel, the Fluid Feel hosel and the Dynamic Gold Mid 115 stock shaft."
  - "Plugged In Golf '2024 Wilson Staff Model CB Irons Review', published 19 June 2024 (https://pluggedingolf.com/2024-wilson-staff-model-cb-irons-review/) — the milled cavity back, and an offset difference from the Blade of at most 0.01 inches in the longer irons, which matches the two tables."
  - "Succession: Wilson announced a new family of Staff Model irons on 27 January 2026 (https://golfwrx.com/772458/wilson-introduces-new-family-of-staff-irons/), which sets year_discontinued."
  - "Note: bounce appears in only one of the two tables and is omitted. 2nd Swing also lists a 2-iron, a 3-iron and a 50-degree gap wedge; they are left out because no second source confirms them."
