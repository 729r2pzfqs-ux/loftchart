faq:
  - q: "What is the loft of a Wilson Staff Model CB (2024) 7-iron?"
    a: "The 2024 Staff Model CB 7-iron has a loft of 34 degrees, a lie of 62 degrees and a steel-shaft length of 37.25 inches."
  - q: "Did the lofts change from the 2020 Staff Model CB?"
    a: "No. The 4-iron through pitching wedge run 23, 26, 30, 34, 38, 42 and 46 degrees on both, with the same lies, lengths and offsets."
  - q: "How does the 2024 Staff Model CB differ from the 2024 Staff Model Blade?"
    a: "Lofts, lies and lengths are the same. The CB has a milled cavity back and slightly more offset in the longer irons, 0.11 inches at the 4-iron against 0.10 on the Blade."
  - q: "What is the pitching wedge loft on the 2024 Staff Model CB?"
    a: "46 degrees."
