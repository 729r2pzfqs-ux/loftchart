description: >
  The second Staff Model CB was announced on 11 January 2024 with a new Staff
  Model Blade, both forged from 8620 carbon steel with Wilson's Fluid Feel
  hosel and extra mass in the toe; the CB adds a milled cavity back. Lofts,
  lies, lengths and offsets are unchanged from the 2020 original, with a
  34-degree 7-iron and a 46-degree pitching wedge. The stock set was 4-iron to
  pitching wedge with True Temper Dynamic Gold Mid 115 shafts; a retailer
  table also lists 2- and 3-irons and a gap wedge, which are not recorded here
  because only one source gives them. Wilson replaced the model with the 2026
  Staff Model CB.
