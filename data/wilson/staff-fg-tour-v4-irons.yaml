faq:
  - q: "What is the loft of a Wilson Staff FG Tour V4 7-iron?"
    a: "The Wilson Staff FG Tour V4 7-iron has a loft of 35 degrees, a lie of 62.0 degrees and a length of 37.25 inches."
  - q: "When were Wilson Staff FG Tour V4 irons made?"
    a: "They were revealed in 2014 and reached retail from January 2015, and were replaced by the FG Tour V6 in 2016."
  - q: "Are FG Tour V4 lofts weak?"
    a: "By modern standards, yes — deliberately so. The 35-degree 7-iron is a traditional players loft, five degrees weaker than a distance iron of the same period."
