description: >
  The FG Tour V4 is Wilson's forged players cavity back of the mid-2010s, with a
  traditional loft chart — 35 degrees at the 7-iron, weaker than almost anything sold
  beside it — and a set that runs 4-iron through gap wedge. Lie angles step in
  irregular increments, from 60 degrees at the 4-iron to 64.25 at the gap wedge,
  rather than the even half-degree progression most makers use.
