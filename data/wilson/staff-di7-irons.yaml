description: >
  The Di7 was the distance model in Wilson Staff's mid-2000s D/C/F fitting system,
  a stainless steel undercut-cavity iron with a low-profile head and wide sole that
  drops the centre of gravity for a high initial launch. Like the rest of the line
  it used Wilson's wide-tip shaft to resist twisting on mishits. Lofts sit roughly
  a degree strong of the companion Ci6 through the middle irons, with half-degree
  steps built into the 5-7 irons rather than the usual whole-degree ladder.
