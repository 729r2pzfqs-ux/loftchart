faq:
  - q: "What is the loft of a Wilson Staff Di7 7-iron?"
    a: "The Wilson Staff Di7 7-iron has a loft of 31.5 degrees, a lie of 62 degrees and a steel-shaft length of 37.5 inches."
  - q: "What kind of golfer were the Wilson Di7 irons for?"
    a: "The Di7 was the distance-focused game-improvement model in Wilson's D/C/F system, aimed at mid-to-high handicappers wanting high launch and forgiveness from a wide-soled, low-CG head."
  - q: "What is special about the Di7's shafts?"
    a: "The Di7 used Wilson's wide-tip shaft design — a fatter tip section intended to reduce head twisting on off-centre hits."
