faq:
  - q: "What is the loft of a 2026 Wilson Staff Model Blade 7-iron?"
    a: "The 2026 Staff Model Blade 7-iron has a loft of 34 degrees, a 62-degree lie and a 37.25-inch steel-shaft length — unchanged from the original 2019 Staff Model Blade."
  - q: "What is different about the 2026 Wilson Staff Model Blade versus the 2019 original?"
    a: "Lofts, lies and lengths carry over unchanged, but the 2026 version has a more compact head with a shorter blade length, noticeably tighter offset through the set, and a brushed satin finish in place of the original's bright chrome."
  - q: "What clubs come in a 2026 Wilson Staff Model Blade set?"
    a: "The stock set is 3-iron through pitching wedge, eight clubs, sold as a set for $1,399.99 (about £1,169) in steel."
  - q: "When was the 2026 Wilson Staff Model Blade released?"
    a: "Wilson announced the Blade alongside the refreshed CB and new XB on 27 January 2026, with US retail following in early February 2026."
