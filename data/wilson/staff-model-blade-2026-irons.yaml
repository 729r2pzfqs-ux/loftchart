description: >
  The second-generation Staff Model Blade was announced 27 January 2026
  alongside a refreshed Staff Model CB and the all-new hollow-body Staff Model
  XB, with the three positioned as one forged family designed together rather
  than separate projects; US retail followed in early February 2026. The head
  is forged from 8620 carbon steel with a precision-milled face and Wilson's
  Fluid Feel Hosel, which strips mass from the hosel and shifts it toward the
  toe. Compared with the 2019 Blade, the profile is more compact with a
  shorter blade length and noticeably tighter offset (0.105 inches at the
  3-iron tapering to 0.045 at the pitching wedge, versus an unpublished offset
  on the original), and the bright chrome finish is replaced by a brushed
  satin look. Lofts, lies and lengths carry over unchanged from the 2019
  model, with a 34-degree 7-iron and 46-degree pitching wedge. The stock set
  is 3-iron through pitching wedge (eight clubs); a seven-piece steel set
  lists at $1,399.99 / £1,169. Figures below are the standard men's
  steel-shaft specification.
