description: >
  The C300 Forged is the compact version of Wilson's C300, keeping the Power Hole
  idea — urethane-filled slots cut through the sole and topline so the face can flex
  further — in a forged head with a thinner topline. Lofts are moderately strong for a
  forged iron at 33 degrees for the 7-iron, and the set is built long, at 38.75 inches
  for the 4-iron.
