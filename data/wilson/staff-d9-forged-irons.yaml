description: >
  The D9 Forged is the players-distance companion to the cast Staff D9, launched
  in 2022 with a two-piece forged 8620 carbon steel head. It carries Wilson's
  urethane-filled Power Holes in an asymmetric, heel-biased layout adapted for
  the forged construction, in a slimmer head with less offset than the standard
  D9. Lofts are about three degrees weaker than the cast D9 through the mid
  irons — a 30.5-degree 7-iron and a 44-degree pitching wedge against 27 and 42
  — with a 5-PW stock set and a 4-iron and 49-degree gap wedge available to
  match. Figures below are the standard men's steel-shaft specification.
