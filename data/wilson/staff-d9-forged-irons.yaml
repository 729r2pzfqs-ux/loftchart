faq:
  - q: "What is the loft of a Wilson Staff D9 Forged 7-iron?"
    a: "The Wilson Staff D9 Forged 7-iron has a loft of 30.5 degrees, with a 62-degree lie and a 37.25-inch steel-shaft length."
  - q: "What is the difference between the Wilson Staff D9 and D9 Forged?"
    a: "The standard D9 is a cast stainless steel game-improvement iron with strong lofts (27-degree 7-iron). The D9 Forged is a forged 8620 carbon steel players-distance iron with a slimmer head, less offset and lofts about three degrees weaker, including a 30.5-degree 7-iron."
  - q: "What clubs come in a stock Wilson Staff D9 Forged set?"
    a: "The stock set is 5-iron through pitching wedge. A 21.5-degree 4-iron and a 49-degree gap wedge were available to extend the set."
