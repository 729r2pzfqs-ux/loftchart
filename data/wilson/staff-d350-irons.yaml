description: >
  The D350 was the superlight companion to the Staff D300 in Wilson's 2017
  distance line, built around the same Speed Sole thin-face technology but with
  lighter head, shaft and grip weights while keeping a standard D2 swing weight.
  It was sold primarily as a hybrid-iron blend: the stock iron set is 5-iron
  through gap wedge, with matching hybrids offered in place of the long irons
  and an approach and sand wedge available to extend the set. Lofts match the
  D300 through most of the bag, with a 31-degree 7-iron and a 43-degree pitching
  wedge. Figures below are the standard men's specification for the 5-GW irons.
