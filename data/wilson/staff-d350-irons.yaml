faq:
  - q: "What is the loft of a Wilson Staff D350 7-iron?"
    a: "The Wilson Staff D350 7-iron has a loft of 31 degrees, with a 62-degree lie and a 37.5-inch steel-shaft length."
  - q: "What is the difference between the Wilson D300 and D350 irons?"
    a: "The D350 is the superlight version of the D300: same Speed Sole distance technology and essentially the same lofts, but with lighter head, shaft and grip weights, and it was sold as a hybrid-iron blend with matching hybrids replacing the long irons."
  - q: "What clubs come in a stock Wilson Staff D350 set?"
    a: "The stock iron set is 5-iron through gap wedge. Matching hybrids were offered in 3 through 6 to fill the top of the bag, and a 55-degree sand wedge was available to extend the bottom."
