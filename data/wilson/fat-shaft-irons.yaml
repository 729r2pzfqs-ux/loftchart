description: >
  The Fat Shaft irons introduced Wilson's best-known late-90s technology: a shaft
  with a hugely oversized tip — .500 inch against the conventional .370 — running
  straight into the head to stiffen the hosel zone and cut head twist on mishits.
  The heads themselves are oversized stainless cavity backs with upright lies by
  the standards of the day. Wilson kept the recipe through several catalog years
  (FS Fat Shaft, Fat Shaft, and Fat Shaft RM/Tour variants) before folding the
  technology into the Deep Red line from 2002.
