faq:
  - q: "What is the loft of a Wilson Fat Shaft 7-iron?"
    a: "The Wilson Fat Shaft 7-iron has a loft of 33 degrees, a lie of 63 degrees and a length of 37.5 inches."
  - q: "What made the Wilson Fat Shaft irons different?"
    a: "The shaft tip measured .500 inch — far larger than the conventional .370 — which stiffened the hosel area and reduced head twisting on off-centre hits. Replacement shafts must be Fat Shaft-specific because of that tip diameter."
  - q: "Are Fat Shaft lies upright?"
    a: "Yes. At 63 degrees on the 7-iron and 65 on the wedges, the Fat Shaft ladder runs one to two degrees more upright than the typical late-90s spec."
