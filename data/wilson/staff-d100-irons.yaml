description: >
  The D100 opened Wilson's modern D-series and its Super Light concept:
  reduced weight in the head, shaft and grip, paired with an 85-gram True
  Temper SL85 steel shaft, to help moderate-speed players swing faster.
  The head uses an undercut cavity with what Wilson called Exoskeleton
  perimeter weighting, moving around 35 percent more mass to the sole, heel
  and toe, with a face about seven percent thinner than its predecessor.
  Lofts are moderate for a distance iron, with a 31-degree 7-iron and a
  43-degree pitching wedge. The set ran 4-iron through sand wedge; figures
  below are the standard men's steel specification.
