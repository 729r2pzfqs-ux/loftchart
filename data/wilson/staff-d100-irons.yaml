faq:
  - q: "What is the loft of a Wilson Staff D100 7-iron?"
    a: "The Wilson Staff D100 7-iron has a loft of 31 degrees, with a 62-degree lie and a 37.5-inch steel-shaft length."
  - q: "What made the Wilson Staff D100 irons 'superlight'?"
    a: "Wilson reduced weight across the whole club - head, shaft and grip - and fitted an 85-gram True Temper SL85 steel shaft, so the total club weight was well below a conventional game-improvement iron of the period."
  - q: "What clubs came in a stock Wilson Staff D100 set?"
    a: "The ladder ran 4-iron through sand wedge, with the gap wedge at 47 degrees and the sand wedge at 55 degrees; typical retail sets were 4-PW or 5-PW with the wedges as add-ons."
