description: >
  Wilson's 2025 Dynapwr hybrid launched in February 2025 with the Dynapwr
  woods — a single compact head with an extended toe, in five lofts from a
  17° 2-hybrid to a 28° 6-hybrid, plus lightweight LITE builds of the 4-, 5-
  and 6-hybrids. The hosel is glued, so each head plays at its stamped loft.
  As of October 2026 the line is still current, with no replacement
  announced.
