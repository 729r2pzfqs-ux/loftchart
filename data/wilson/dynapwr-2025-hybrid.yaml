faq:
  - q: "What lofts does the 2025 Wilson Dynapwr hybrid come in?"
    a: "Five lofts: 17, 19, 22, 25 and 28 degrees — the 2-hybrid through 6-hybrid. LITE builds are offered in the 22, 25 and 28 degree heads."
  - q: "Is the Wilson Dynapwr hybrid adjustable?"
    a: "No — the hosel is glued and each head plays at its stamped loft. In the 2025 Dynapwr family only the drivers and the Carbon fairway carry an adjustable hosel."
