faq:
  - q: "What is the loft of a 1987 Wilson Staff Tour Blade 7-iron?"
    a: "Approximately 38 degrees per the 1982-published Maltby tables — though a collector's reading of the 1988 Wilson catalog suggests 39 degrees, matching the older 1974 ladder. Either way it is roughly three clubs weaker than a modern distance iron."
  - q: "What is the Fluid Feel on Wilson Staff Tour Blades?"
    a: "Fluid Feel is Wilson's drill-through hosel: the shaft bore runs through to the sole (capped with a small plug), a construction revived on this model from the 1957-75 Staff Dynapower blades. It also makes these irons notoriously difficult to reshaft."
  - q: "When was this Wilson Staff Tour Blade model sold?"
    a: "Catalog records show it on sale from 1986 through 1988, with a W/S shield stamp added for 1989-90; it is popularly known as the '87-88 Fluid Feel'. Wilson revised the blade with the 1991 Tour Blade."
