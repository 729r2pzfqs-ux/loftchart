description: >
  The late-80s Staff Tour Blade — the "Fluid Feel" model collectors know by the red
  plug in the heel of the sole and the tapered muscle bar — revived the drill-through
  hosel of Wilson's 1957-75 Staff Dynapower era. Catalog records show the model on
  sale from 1986 through 1988 (the W/S shield stamp was added in 1989), and Wilson
  had kept its blade specification essentially unchanged since the 1970s, so the
  numbers below follow the ladder Ralph Maltby recorded for the Wilson Staff blade in
  his 1982-published tables: a 38-degree 7-iron and 50-degree pitching wedge, one
  degree stronger than the 1974-published ladder. Wilson tweaked the specs again with
  the 1991 Tour Blade.
