sources:
  - "Ralph Maltby, 'Golf Club Design, Fitting, Alteration & Repair' 4th ed. p.844, as transcribed on GolfWRX ('Late 70s-Early 80s Wilson Staff Tour Blades' thread): the 1974-published Wilson Staff ladder (2i 21/38.5/57 through PW 51 and SW 55), with the next listing, published 1982, showing every loft one degree stronger except the 55-degree SW, lies on the 6-9 irons one degree flatter, and PW/SW a quarter-inch shorter — the 1982 ladder is what appears above"
  - "GolfWRX 'Wilson Staff Fluid Feel 87-88?' thread — a collector with the 1980 and 1988 Wilson catalogs states the 1988 specs match 1980 and that specs were tweaked with the 1991 Tour Blade; the same thread dates this model's availability from 1986, the drill-through Fluid Feel hosel revival, and the 1989 addition of the W/S shield stamp. Note his reading supports the weaker 1974 ladder (39-degree 7-iron), so the two period sources disagree by one degree through the set"
  - "Because the surviving evidence is a book transcription and catalog testimony that differ by one degree, confidence is low; the 1982-published Maltby ladder is used as the more precisely documented of the two"
