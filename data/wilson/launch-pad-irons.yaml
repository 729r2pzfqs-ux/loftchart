description: >
  The original Launch Pad is Wilson's lightweight, anti-chunk iron for new
  golfers and chronic fat-hitters, announced on 10 December 2019 and in shops
  from 13 January 2020, so it sold as Wilson's 2020 line. A hollow construction
  supports a thin face, and the wide "Launch Pad" sole is designed to float over
  the turf instead of digging. Lofts are deliberately moderate for the category
  — a 30-degree 7-iron and a 44-degree pitching wedge — to keep flight high.
  The stock set is 4-iron through pitching wedge; the 49-degree gap wedge and
  55-degree sand wedge are custom options. Figures below are Wilson's published
  men's specification with the steel-shaft D0 swing weight; the graphite build
  was listed at C9.5.
