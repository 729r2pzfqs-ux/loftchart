faq:
  - q: "What is the loft of a Wilson Launch Pad 7-iron?"
    a: "The Wilson Launch Pad 7-iron has a loft of 30 degrees, with a 62-degree lie and a 37.5-inch steel-shaft length."
  - q: "What clubs come in a stock Wilson Launch Pad set?"
    a: "The stock set is 4-iron through pitching wedge. A 49-degree gap wedge and a 55-degree sand wedge were offered as custom options to match."
  - q: "Are the Wilson Launch Pad lofts strong?"
    a: "No. Wilson kept the lofts moderate for a super-game-improvement iron — a 30-degree 7-iron and 44-degree pitching wedge — so the wide-soled, hollow heads launch high rather than chasing distance."
  - q: "When did the Wilson Launch Pad irons come out?"
    a: "Wilson announced them on 10 December 2019 and they reached shops on 13 January 2020, selling as the 2020 line until the Launch Pad 2 replaced them in early 2022."
