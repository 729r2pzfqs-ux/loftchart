faq:
  - q: "What is the loft of a Ping Blueprint S 7-iron?"
    a: "The Ping Blueprint S 7-iron has a loft of 33 degrees, a standard (black dot) lie of 62.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "What is the difference between Ping Blueprint S and Blueprint T?"
    a: "Blueprint T is the muscleback; Blueprint S is the cavity back, with a pocket forged into the back of the 3, 4 and 5 irons to move about 10 grams to the perimeter for extra long-iron stability."
  - q: "Are Blueprint S lofts the same as the Ping i230?"
    a: "Yes — 19, 22.5, 26, 29.5, 33, 37, 41 and 45 degrees at identical lies and lengths. Blueprint S is the forged version of that chart, with slightly less offset."
  - q: "Is the Ping Blueprint S forged?"
    a: "Yes, from 8620 carbon steel, unlike the cast 431 stainless i230 that shares its loft chart."
