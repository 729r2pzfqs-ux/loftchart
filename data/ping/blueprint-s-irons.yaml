description: >
  Blueprint S is the cavity-back half of Ping's forged Blueprint pair, sold
  alongside the Blueprint T muscleback. Ping hollows a pocket into the back of
  the 3, 4 and 5 irons — its Precision Pocket Forging — to free around 10 grams
  for perimeter weighting, so the long irons gain stability without changing
  the shape at address. Lofts, lies and lengths match the cast i230 exactly, at
  33 degrees and 37.00 inches for the 7-iron, but offset is roughly 0.01 to
  0.02 inches tighter club for club. Lies below are the black (standard) code.
