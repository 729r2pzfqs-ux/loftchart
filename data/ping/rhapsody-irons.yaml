description: >
  The 2007 Rhapsody launched Ping's modern line of dedicated women's clubs, a
  complete driver-through-putter family whose irons are deep cavity backs
  built light and upright for slower swing speeds. The set blends hybrids
  into the top end, with matching Rhapsody hybrids replacing the long irons
  above the 5-iron, and the irons run generous offset - .28 inches at the
  5-iron - with a 34 degree 7-iron and 46 degree pitching wedge on women's
  standard lengths about an inch under men's. Specs below are the women's
  standard build with the stock ULT 129i graphite. Ping revived the Rhapsody
  name for an unrelated second-generation set in 2015; this entry is the
  original. The Faith replaced it in 2011.
