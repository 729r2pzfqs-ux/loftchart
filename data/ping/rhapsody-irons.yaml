faq:
  - q: "What is the loft of a Ping Rhapsody 7-iron?"
    a: "The 2007 Ping Rhapsody 7-iron has a loft of 34 degrees, a 62.25 degree lie and a 36.25 inch women's standard graphite length."
  - q: "Are Ping Rhapsody irons for women?"
    a: "Yes. The Rhapsody was Ping's dedicated women's line, launched in 2007 as a complete set - driver, fairways, hybrids, irons and putter - built light and upright for slower swing speeds."
  - q: "Are there two generations of Ping Rhapsody irons?"
    a: "Yes. The original Rhapsody launched in 2007; Ping reused the name in 2015 for a different second-generation women's set with 24 to 58 degree lofts and ULT 220 shafts. This page covers the 2007 original."
