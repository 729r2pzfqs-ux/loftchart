faq:
  - q: "What is the loft of a Ping Rapture 7-iron?"
    a: "The Ping Rapture 7-iron has a loft of 34 degrees, with a 62.28-degree standard lie and a 36.75-inch steel-shaft length."
  - q: "What are Ping Rapture irons made of?"
    a: "They were Ping's first multi-material irons: a stainless steel body with a titanium face structure and high-density tungsten sole weights that drop the centre of gravity."
  - q: "How do the Ping Rapture lofts compare with the Ping G5 and G10?"
    a: "They are the same through the middle of the set — all three use a 34-degree 7-iron — with the Rapture's advantage coming from its multi-material weighting rather than stronger lofts."
