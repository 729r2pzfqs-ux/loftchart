description: >
  The Rapture was Ping's first multi-material iron, launched in 2006 as a
  premium maximum-forgiveness line above the G5. Each head combines a
  stainless steel body with a titanium face structure and high-density
  tungsten sole weights, pushing weight low and to the perimeter of a large
  head. Lofts are traditional — 34 degrees at the 7-iron and 46 at the
  pitching wedge — with Ping's precise machine-spec lie angles and a full
  2-iron through lob wedge range. Lies below are the BLACK (standard) colour
  code; Ping's dot system adjusts lie in steps around it.
