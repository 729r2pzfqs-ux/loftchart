description: >
  The Faith was Ping's women's line of the early 2010s, replacing the 2007
  Rhapsody. The irons carry extra toe weighting and a Custom Tuning Port to
  drive the centre of gravity low for a high launch at slower swing speeds,
  and the stock set replaces the long and mid irons entirely: Faith hybrids
  at 26 and 30 degrees cover the 5H and 6H slots, and the irons run only
  from the 32 degree 7-iron to a 54 degree sand wedge. Lengths are women's
  standard, about an inch under men's, with the whole family shafted in
  Ping's ULT 200 ladies graphite. The Serene replaced it in 2013.
