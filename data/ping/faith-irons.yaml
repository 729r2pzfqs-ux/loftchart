faq:
  - q: "What is the loft of a Ping Faith 7-iron?"
    a: "The Ping Faith 7-iron has a loft of 32 degrees, a 62.25 degree lie and a 36.25 inch women's standard graphite length."
  - q: "Why does the Ping Faith set start at the 7-iron?"
    a: "The Faith was sold as a hybrid-iron combo for moderate swing speeds: Faith hybrids at 26 and 30 degrees take the 5H and 6H slots, and the irons run from the 7-iron down to a 54 degree sand wedge."
  - q: "When were Ping Faith irons made?"
    a: "The Faith line launched in 2011 as the successor to the 2007 Rhapsody and was replaced by the Serene in 2013."
