sources:
  - "2ndswing.com Ping Faith iron set spec table and qsponge.com 'What is loft angle of Ping FAITH Irons' - matching loft, lie and length rows for the 5H, 6H and 7-iron through SW. Neither source publishes offset, bounce or swing weight for the irons, so those keys are omitted. Compiled from secondary spec databases because the Flash-era ping.com Faith pages are not recoverable from the Internet Archive."
  - "thesandtrap.com 'PING Expands Lineup for 2011' - the Faith launch as Ping's women's family for 2011, the toe-area weighting and Custom Tuning Port design, the ULT 200 Ladies graphite across the set, and the iron/hybrid combo set composition at $112.50 per club"
