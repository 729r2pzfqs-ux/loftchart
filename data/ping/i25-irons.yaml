faq:
  - q: "What is the loft of a Ping i25 7-iron?"
    a: "The Ping i25 7-iron has a loft of 33 degrees, a standard (black dot) lie of 62.25 degrees and a steel-shaft length of 36.75 inches."
  - q: "When were Ping i25 irons released?"
    a: "Ping announced the i25 line on 2 January 2014, with pre-orders opening the same day. The irons were replaced in 2015 by the Ping i (iE1)."
  - q: "What clubs were available in the Ping i25 set?"
    a: "Heads ran from the 3-iron through the lob wedge — 3-9, a 46-degree pitching wedge, plus matching 50-degree UW, 54-degree SW and 58-degree LW."
