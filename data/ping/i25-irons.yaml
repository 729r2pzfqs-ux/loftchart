sources:
  - "Morton Golf Sales (Ping-authorised dealer) i25 individual irons page (mortongolfsales.com/ping-golf-i25-individual-irons-replacement-irons-only) — supplied the loft, lie, length, offset and bounce for every club 3-iron through LW above, and the SR/R/S/X flex options. Its swing-weight column (a flat D0 for 3-9) looked like a placeholder and is omitted here."
  - "Second retail spec table surfaced in search (qsponge Ping i25 loft listing) — corroborated the loft, lie and length figures for 3-iron through LW, including the 33-degree/62.25-degree/36.75-inch 7-iron and the 35.25-inch sand wedge (Morton's page printed 35.20 for the SW; the corroborating table's 35.25 is used, matching Ping's usual quarter-inch steps)."
