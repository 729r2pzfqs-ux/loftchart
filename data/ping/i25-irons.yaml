description: >
  The i25 was Ping's better-player iron of 2014, announced on 2 January 2014
  alongside the i25 driver, fairways and hybrids and the Karsten hybrid/iron set. It
  is cast from 17-4 stainless steel with a progressive set design: the long irons
  carry larger heads and wider soles than the i20 to raise launch and forgiveness,
  while the mid and short irons are more compact with thinner top rails, narrower
  soles and less offset for control into the green. The pitching wedge is a
  traditional-for-the-time 46 degrees, and Ping built matching UW, SW and LW heads so
  the set runs 3-iron through lob wedge. The stock shaft was Ping's own CFS steel.
  The i25 was replaced in 2015 when Ping dropped the numbering and launched the i
  iron (also catalogued as the iE1). Ping's colour-code (dot) system sets lie angle
  relative to standard; the lies below are the BLACK (standard) lies.
