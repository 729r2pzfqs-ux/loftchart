  - "Ping press release 'PING Introduces 2014 Line of Products' (via buffalogolfer.com, plus Golf Channel coverage) — announcement date of 2 January 2014, the progressive head design description, and pre-orders opening the same day. year_introduced follows the announcement year."
  - "GolfWRX 'Ping i irons: What you need to know' and MyGolfSpy 'PING Reinvents i-series with i iron' — the 431 stainless Ping i iron (iE1) replaced the i25 in 2015, which is the year_discontinued recorded here."
