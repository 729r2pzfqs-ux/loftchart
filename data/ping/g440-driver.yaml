description: >
  The G440 is Ping's 2025 driver family, at US retail from 30 January 2025.
  It trims weight with a shallower face, a composite Carbonfly Wrap crown and
  a new "Free Hosel" design, then spends the savings on a movable tungsten
  backweight in every head. The Max is the core high-MOI model, the LST a
  notably larger 450 cc low-spin head than past LSTs, and the SFT the draw
  model with Draw and Draw+ weight positions worth up to 20 yards of
  correction. In January 2026 Ping added the G440 K — its highest-MOI
  adjustable driver yet, a 10K-class head with a 32 g CG-shifter backweight
  and a dual Carbonfly Wrap crown and sole — effectively the successor to
  the fixed-weight G430 Max 10K. High-launch (HL) builds of the Max, SFT and
  K pair lighter backweights with the ALTA Quick 35/45 shafts.
variants:
  - name: G440 Max
    head_cc: 460
    description: >
      The core high-MOI head for most players, with a 29 g movable tungsten
      backweight in Draw, Neutral and Fade positions. Head weight 203 g,
      swing weight D3.
  - name: G440 LST
    head_cc: 450
    description: >
      The low-spin head for faster swings — at 450 cc, much larger than
      earlier LSTs — with the same 29 g three-position backweight. Head
      weight 205 g, swing weight D4.
  - name: G440 SFT
    head_cc: 460
    description: >
      The draw-biased slice corrector: a 23 g backweight with Draw (about a
      13-yard bias) and Draw+ (about 20 yards) positions. Head weight 199 g,
      swing weight D0.
  - name: G440 K
    head_cc: 460
    description: >
      Added January 2026: Ping's highest-MOI driver, a 10K-class head that
      keeps movable weighting — a 32 g tungsten CG shifter in Neutral, Draw
      and Fade positions — under a dual Carbonfly Wrap carbon crown and sole,
      on the largest front-to-back profile in the line.
