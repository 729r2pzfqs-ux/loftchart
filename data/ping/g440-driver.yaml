faq:
  - q: "What lofts does the Ping G440 come in?"
    a: "The G440 Max and G440 K come in 9, 10.5 and 12 degrees; the G440 LST and G440 SFT in 9 and 10.5."
  - q: "What is the G440 adjustment chart?"
    a: "Ping's Trajectory Tuning 2.0 hosel has eight settings: standard, +1, +1.5, −1 and −1.5 degrees of loft at the standard lie, plus flat versions of standard, +1 and −1 that sit up to 3 degrees flatter. There is no upright setting."
  - q: "What is the difference between the G440 Max and G440 K?"
    a: "Both are 460 cc forgiveness heads with movable weights. The K, added in January 2026, is the 10K-MOI model — a larger front-to-back profile, a heavier 32 gram CG shifter and a carbon sole as well as crown — while the Max is the lighter, slightly more conventional core head."
  - q: "Why is the G440 46 inches long?"
    a: "Only with the stock counter-balanced ALTA CB Blue 50 shaft, whose balance point lets Ping build longer without the swing weight ballooning. With the Tour 2.0, Tensei 1K or Denali Red shafts the standard build is 45.5 inches."
