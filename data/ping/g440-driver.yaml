length_note: >
  46 inches is the standard build with the stock ALTA CB Blue 50; builds with
  the Tour 2.0 Chrome/Black, Tensei 1K Black or Denali Red are 45.5 inches.
  Ping publishes lie as the average across the five neutral-lie hosel
  positions.
hosel:
  system: "Trajectory Tuning 2.0"
  loft_range: "±1.5°"
  positions: 8
  lie_effect: >
    Three flat positions sit up to 3° flatter than standard; there is no
    upright setting.
  face_note: >
    Lowering loft opens the face slightly and adding loft closes it, as on
    any hosel-based adjuster.
  notes: >
    The same eight-position chart has carried unchanged through the G425,
    G430 and G440 generations, so sleeves and settings interchange. The
    ±1.5° "big" settings exist only at the standard lie; the flat positions
    offer 0 and ±1° of loft.
  settings:
    - { setting: "Standard", loft: "std", lie: "std" }
    - { setting: "+1", loft: "+1°", lie: "std" }
    - { setting: "Big +", loft: "+1.5°", lie: "std" }
    - { setting: "−1", loft: "−1°", lie: "std" }
    - { setting: "Big −", loft: "−1.5°", lie: "std" }
    - { setting: "Standard Flat", loft: "std", lie: "3° flat" }
    - { setting: "+1 Flat", loft: "+1°", lie: "3° flat" }
    - { setting: "−1 Flat", loft: "−1°", lie: "3° flat" }
