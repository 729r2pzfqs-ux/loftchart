description: >
  The i540 is Ping's players-distance iron, launched on 10 March 2026 as the
  replacement for the i530. It keeps the hollow-body, blade-style formula but the
  forged variable-thickness maraging steel face is about 9 percent thinner than the
  i530's, and tungsten weights sit along the sole of the 4- through 7-irons to lower
  the centre of gravity. Two additions are new to the model: Ping's patent-pending
  inR-Air technology, an internal air chamber that tunes frequency for better sound
  and feel in a hollow head, and an i-Beam brace across the cavity for structural
  support. Lofts, lies, bounce and swing weights carry over from the i530 unchanged —
  a 29-degree 7-iron and 42-degree pitching wedge — though the published lengths of
  the 4- through 6-irons run about a quarter to three-eighths of an inch longer, and
  Power Spec and Retro Spec loft options are offered. Ping's colour-code (dot) system
  sets lie angle relative to standard; the lies below are the BLACK (standard) lies
  quoted at standard length.
