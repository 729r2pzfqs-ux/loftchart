faq:
  - q: "What is the loft of a Ping i3 Blade 7-iron?"
    a: "The Ping i3 Blade 7-iron has a loft of 34.5 degrees, a standard (black dot) lie of 62.5 degrees and a steel-shaft length of 36.75 inches — the same chart as the i3 O-Size."
  - q: "Is the Ping i3 Blade a real muscle-back blade?"
    a: "No. It is a compact investment-cast head with a Custom Tuning Port and perimeter weighting. Ping used the Blade name for the smaller, lower-offset head of the i3 pair aimed at better players."
  - q: "What is the difference between the Ping i3 Blade and i3 O-Size?"
    a: "They share the same lofts, lies and lengths. The O-Size head is larger and more forgiving with roughly two to three times the offset (0.21 inches at the 7-iron against the Blade's 0.07) and more bounce through the irons; the Blade is the compact players' version. The wedge specs converge across the two heads."
  - q: "When were Ping i3 Blade irons made?"
    a: "The i3 range launched in 2000 and was replaced by the i3+ in 2002."
