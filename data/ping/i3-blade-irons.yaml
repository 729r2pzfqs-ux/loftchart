description: >
  The i3 arrived in 2000 in two head sizes — the larger i3 O-Size and the
  compact i3 Blade documented here, Ping's players' head of the pair with a
  smaller profile, less offset and less bounce. Despite the Blade name it is
  still an investment-cast head with Ping's Custom Tuning Port in the back
  cavity moving discretionary weight low and to the perimeter. It shares the
  O-Size's loft, lie and length chart exactly, running from an optional
  15.5-degree 1-iron to a 60-degree lob wedge with the 7-iron at 34.5
  degrees, but Ping published separate offset and bounce columns for the two
  heads: at the 7-iron the Blade carries 0.07 inches of offset and 7 degrees
  of bounce against the O-Size's 0.21 and 10.5. Ping's colour-code (dot) system sets lie angle relative to
  standard: gold 4 flat, brown 3 flat, orange 2 flat, red 1 flat, BLACK
  standard, blue 1 upright, green 2 upright, white 3 upright, silver 4
  upright, maroon 5 upright. The lies listed below are the BLACK (standard)
  lies. The i3+ update replaced both i3 heads in 2002.
