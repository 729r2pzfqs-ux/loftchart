sources:
  - "Ping's own archived 'i3 Iron Specifications' chart (http://web.archive.org/web/20030214111004/http://www.pinggolf.com/popups/i3specs.html) — a combined Blade & O-Size table that supplied every loft, black-dot lie, length and the Blade offset and bounce columns above (the O-Size columns run 0.35 to 0.15 inches of offset and 6 to 18 degrees of bounce), with footnotes that lie is based on the black colour code, degree measurements are rounded to the nearest half degree and offset to the nearest 1/100 inch. The chart uses Ping's PW/UW/SW/LW wedge naming, followed here."
  - "equip2golf.com Ping i3 Blade specification page — an independent match on the lofts and lengths for the 1-iron through lob wedge, and the Ping JZ steel / Ping 350 Series graphite stock shafts"
  - "qsponge.com Ping i3 Blade loft/lie table — black-dot lie angles for every club; lofts and lies match Ping's chart exactly"
  - "MyGolfSpy 'PING Irons: Model by Model' — the i3 launched Ping's i-series in 2000 in Blade and O-Size versions, the basis for year_introduced (equip2golf dates its chart 1999, the model-year convention also noted on the ping/i3-o-size-irons record)"
  - "Note: year_discontinued is taken as 2002, the year the i3+ update was introduced per ping/i3-plus-irons.yaml; the i3+ Blade that replaced this head carries slightly more offset (0.26 inches at the 2-iron to 0.08 at the 9-iron) on Ping's i3+ chart."
