faq:
  - q: "What lofts does the Ping Glide 4.0 come in?"
    a: "46 to 60 degrees — 17 loft/grind combinations. There is no 48-degree option; that loft arrived with the s159."
  - q: "What grinds does the Ping Glide 4.0 offer?"
    a: "Four: the all-round S at every loft, the high-bounce W (54-60 at 14 degrees), the low-bounce T (58 and 60 at 6 degrees) and the Eye2-inspired high-toe E (54-60)."
  - q: "What replaced the Ping Glide 4.0?"
    a: "The s159, announced in February 2024, which widened the lineup to 25 combinations and added the low-bounce B grind."
