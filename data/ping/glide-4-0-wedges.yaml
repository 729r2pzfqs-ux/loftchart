description: >
  The Glide 4.0 is the last of Ping's Glide wedge line, announced on
  15 March 2022 and replaced by the s159 in February 2024. Its
  multi-material head pairs 8620 carbon steel with a larger, softer
  activated elastomer insert for a muted feel, under a Hydropearl 2.0
  chrome finish. The 46-52 heads carry wheel-cut grooves with a 20-degree
  sidewall for full shots, while the 54-60 heads are milled with a tighter
  28-degree sidewall for spin on finesse shots. The line runs 17 loft/grind
  combinations from 46 to 60 degrees across four grinds, with a new Emery
  blast face texture.
grinds:
  - code: S
    name: S Grind
    description: >
      Fits most golfers — ample bounce through the mid-sole with trailing
      edge and heel relief, offered at every loft from 46 to 60 degrees.
  - code: W
    name: W Grind
    description: >
      Traditional full-sole, high-bounce design — the most forgiving grind
      through the turf, for softer conditions and steeper attack angles.
  - code: T
    name: T Grind
    description: >
      Low-bounce half-moon sole shaping with high lead-edge bounce, for
      precise shot-making from firm turf at 58 and 60 degrees.
  - code: E
    name: E Grind
    description: >
      High-toe design with a dished sole inspired by the PING Eye2 sand
      wedge — a bunker specialist.
