faq:
  - q: "What lofts does the Ping G430 come in?"
    a: "The G430 Max and Max 10K come in 9, 10.5 and 12 degrees; the G430 LST in 9 and 10.5; and the G430 SFT in 10.5 only."
  - q: "What is the G430 adjustment chart?"
    a: "Ping's Trajectory Tuning 2.0 hosel has eight settings: standard, +1, +1.5, −1 and −1.5 degrees of loft at the standard lie, plus flat versions of standard, +1 and −1 that sit up to 3 degrees flatter. There is no upright setting."
  - q: "What is the difference between the G430 Max and G430 Max 10K?"
    a: "The Max has a 25 gram movable backweight with Draw, Neutral and Fade positions; the Max 10K trades the movable weight for a fixed 28 gram one and a carbon crown, pushing combined MOI past 10,000 g·cm² — more forgiveness, less adjustability."
  - q: "Is the Ping G430 still in production?"
    a: "The G440 replaced it in January 2025, so the G430 is a closeout and used-market buy. Its hosel chart and sleeve are identical to the G425 and G440, so shafts interchange across all three generations."
