construction: titanium body with internal rib structure, shallower variable-thickness face and tungsten backweight; Carbonfly Wrap composite crown on the LST and Max 10K
material: titanium body; forged T9S+ titanium face with Spinsistency variable roll radius
predecessor: Ping G425
successor: Ping G440
description: >
  The G430 is Ping's 2023-2024 driver family. The Max is the mainline
  high-MOI head with a 25 g movable tungsten backweight; the 440 cc LST
  introduced Ping's Carbonfly Wrap composite crown and is the low-spin pick
  for fast swings; and the SFT is the draw model, sold in 10.5° only with
  Draw and Draw+ weight settings worth up to about 20 yards of right-to-left
  correction. In January 2024 Ping added the G430 Max 10K — its first driver
  over 10,000 g·cm² of combined MOI, achieved with a fixed 28 g backweight
  and the carbon crown. High-launch (HL) builds across the Max, SFT and 10K
  paired lighter backweights with ALTA Quick shafts at 46 inches. The G440
  replaced the family in 2025.
variants:
  - name: G430 Max
    head_cc: 460
    description: >
      The mainline high-MOI head: a 25 g movable tungsten backweight with
      Draw, Neutral and Fade positions worth about ±8 yards of shot shape.
      Head weight 206 g, swing weight D3.
  - name: G430 LST
    head_cc: 440
    description: >
      The compact low-spin head and the first Ping with the Carbonfly Wrap
      carbon crown; a 22 g three-position backweight gives about ±7 yards of
      bias. Head weight 208 g, swing weight D4.
  - name: G430 SFT
    head_cc: 460
    description: >
      The draw-biased model, 10.5° only, with Draw and Draw+ backweight
      settings for up to roughly 20 yards of slice correction. Head weight
      200 g, swing weight C9.
  - name: G430 Max 10K
    head_cc: 460
    description: >
      Added January 2024: Ping's first driver past 10,000 g·cm² combined MOI,
      via a fixed 28 g tungsten backweight (no movable positions) and the
      Carbonfly Wrap crown. Head weight 206 g, swing weight D3.
