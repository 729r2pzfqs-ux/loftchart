description: >
  The G700 was Ping's first hollow-body distance iron, built like a metalwood:
  a thin maraging C300 face plasma-welded to a hollow 17-4 stainless body with
  internal metal-injection-moulded weighting. It sits a full club stronger than
  the G400 of the same period, with a 29.5-degree 7-iron and a 44-degree
  pitching wedge, and is built long — the 4-iron measures 38.875 inches. Head
  weight is light enough that the stock steel build comes out at C9. Lies below
  are the black (standard) colour code.
