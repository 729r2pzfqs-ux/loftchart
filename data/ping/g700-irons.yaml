faq:
  - q: "What is the loft of a Ping G700 7-iron?"
    a: "The Ping G700 7-iron has a loft of 29.5 degrees, a standard (black dot) lie of 62.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "When were Ping G700 irons made?"
    a: "The G700 was introduced in 2018 and was replaced by the G710 in 2020."
  - q: "How strong are Ping G700 lofts?"
    a: "Very strong for the period. The 7-iron is 29.5 degrees and the pitching wedge 44 degrees, about a club stronger than the G400 of the same era."
  - q: "Why is the Ping G700 swing weight only C9?"
    a: "The hollow head is light and the set is built long — 38.875 inches at the 4-iron — so the stock steel build measures C9 through the mid irons and rises to D1 in the wedges."
