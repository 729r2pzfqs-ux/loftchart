description: >
  Launched alongside the G15 in the autumn of 2009, the i15 is the tour-shaped
  half of that pair: a smaller cast head with a machined face, a thinner top
  line and a tungsten toe weight. Lofts step back from the i10 through the mid
  and short irons — 33 degrees at the 7-iron against 34, 41 at the 9-iron
  against 42 — while the lie, length and bounce chart carries over. The long
  irons run negative bounce, minus 2.7 degrees at the 3-iron. Lies below are
  the black (standard) colour code.
