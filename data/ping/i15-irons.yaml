faq:
  - q: "What is the loft of a Ping i15 7-iron?"
    a: "The Ping i15 7-iron has a loft of 33 degrees, a standard (black dot) lie of 62.25 degrees and a steel-shaft length of 36.75 inches."
  - q: "When were Ping i15 irons made?"
    a: "The i15 launched in 2009 alongside the G15 and was replaced by the i20 in 2012."
  - q: "Why do Ping i15 long irons have negative bounce?"
    a: "The 3-iron and 4-iron are published at minus 2.7 and minus 1.8 degrees of bounce, meaning the leading edge sits below the trailing edge at address. It is a tour-style sole intended to cut into the turf rather than skid off it."
  - q: "What is the difference between the Ping i15 and the i10?"
    a: "Lie, length and offset geometry carry over, but the i15 weakens the mid and short irons by a degree — 33 degrees at the 7-iron against the i10's 34 — and adds a machined face and a tungsten toe weight."
