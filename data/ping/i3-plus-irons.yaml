faq:
  - q: "What is the loft of a Ping i3+ 7-iron?"
    a: "The Ping i3+ 7-iron has a loft of 34.4 degrees, a standard (black dot) lie of 62.3 degrees and a steel-shaft length of 36.75 inches. Ping published the i3+ chart unrounded, so the figures sit a fraction off the i3's half-degree values."
  - q: "What is the difference between the Ping i3+ and the i3+ Blade?"
    a: "They share the same lofts, lies and lengths. The standard i3+ carries more offset (0.30 inches at the 3-iron against the Blade's 0.21) and more bounce (7.5 degrees at the 3-iron against 1), while the Blade's smaller head and reduced offset target better players. The wedge specs are identical across the two."
  - q: "When were Ping i3+ irons made?"
    a: "The i3+ was introduced in 2002 as the update of the 2000 i3 and remained in Ping's line until the i5 replaced it in 2005."
  - q: "Are Ping i3+ lofts the same as the Ping i3?"
    a: "Effectively yes — Ping published the i3+ chart unrounded, so the 34.5-degree i3 7-iron reads 34.4 on the i3+ chart, with the same lengths and near-identical lies throughout."
