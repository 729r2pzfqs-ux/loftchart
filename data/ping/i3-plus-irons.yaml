  - "MyGolfSpy 'PING Irons: Model by Model' — the i3 launched the i-series in 2000 and the i3+ followed two years later, supporting the 2002 introduction"
  - "Note: year_discontinued is taken as 2005, the year the successor i5 was introduced per ping/i5-irons.yaml; Ping's April 2004 site still listed the i3+ as a current model alongside the G2 and S59"
