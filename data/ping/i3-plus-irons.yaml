sources:
  - "Ping's own archived 'i3+ and i3+ Blade Specifications' chart (http://web.archive.org/web/20030213174619/http://www.pinggolf.com:80/popups/i3plus_specs.html, also captured 2002-11-07 on ww1.pinggolf.com) — supplied every loft, lie, length, offset and bounce above, the i3+ Blade offset/bounce columns quoted in the description, and the notes that lie is based on the black colour code and offset is rounded to the nearest 1/100 inch"
  - "Ping's archived i3+ Series product page (web.archive.org captures of pinggolf.com/products_irons_i3plus.html from October 2002 onward, later mirrored at ping.com) — the two-model line-up, the enlarged Custom Tuning Port, lead edge and notched/flat-top hosel descriptions, and the note that the Blade gained slightly more short-iron offset than the original i3 Blade"
