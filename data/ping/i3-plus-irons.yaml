description: >
  The i3+ is the 2002 update of the i3, sold in two head styles: the standard
  i3+, the more forgiving perimeter-weighted model documented in the offset and
  bounce figures below, and the smaller i3+ Blade with less offset and less
  bounce. Both share the same loft, lie and length chart, which Ping published
  unrounded — the 7-iron is 34.4 degrees rather than the i3's 34.5. The series
  kept the Custom Tuning Port, enlarged for more perimeter weighting, added a
  lowered lead edge for cleaner turf contact, and revised the notched, flat-top
  hosel. On Ping's chart the i3+ Blade offsets run 0.26 inches at the 2-iron
  down to 0.08 at the 9-iron, with iron bounce of 0 to 7 degrees against the
  standard model's 6.75 to 12; the wedges share their specs across both models.
  Ping's colour-code (dot) system sets lie angle relative to standard; the lies
  below are the BLACK (standard) lies. The i3+ stayed in the line alongside the
  G2 until the i5 arrived in 2005.
