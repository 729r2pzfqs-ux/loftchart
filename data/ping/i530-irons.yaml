description: >
  The i530 is Ping's players-distance iron in a blade-style package: a hollow body
  with a forged maraging steel face, internal tungsten toe and shaft-tip weights and
  a shorter blade than the i525 it replaced. Lofts are strong for the shape — the
  7-iron is 29 degrees, four stronger than the i230 — but the set carries far more
  bounce than a players iron, up to 13 degrees in the wedges. Ping's colour-code (dot) system sets lie angle relative to standard: gold 4 flat,
  brown 3 flat, orange 2 flat, red 1 flat, BLACK standard, blue 1 upright, green 2
  upright, white 3 upright, silver 4 upright, maroon 5 upright. The lies below are the
  BLACK (standard) lies.
