faq:
  - q: "What is the loft of a Ping i 7-iron?"
    a: "The 2015 Ping i 7-iron has a loft of 32 degrees and a steel-shaft length of 37 inches. Ping's published lie is 62.63 degrees, which its chart bases on the blue colour code at standard length."
  - q: "What is the Ping iE1?"
    a: "iE1 is the catalogue designation for the 2015 Ping i iron — the model was spotted on tour under that name at the Greenbrier Classic in July 2015 before launching simply as the Ping i."
  - q: "What is the difference between the Ping i25 and the Ping i irons?"
    a: "The i switched from 17-4 to softer 431 stainless steel, added tungsten toe weighting, and runs about a quarter inch longer and one degree stronger through most of the set — the 7-iron went from 33 degrees at 36.75 inches to 32 degrees at 37 inches."
  - q: "When were Ping i irons made?"
    a: "The i was introduced in 2015 as the replacement for the i25 and was itself replaced by the i200 in 2017."
