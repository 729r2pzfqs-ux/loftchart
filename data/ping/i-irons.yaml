sources:
  - "Ping's own i irons product page, Specifications table (http://web.archive.org/web/20160304235504/http://www.ping.com/clubs/ironsdetail.aspx?id=19659) — supplied every loft, length, offset, lie and swing weight above, the RH/LH availability for all nine clubs, the 431 stainless description, and the stock shaft line-up of Ping CFS Distance steel and CFS Graphite plus four after-market stock options. Graphite builds are two swing-weight points lighter per the same chart."
  - "IMPORTANT lie-angle note: the same Ping chart states 'Lie angle based on Blue Color Code at standard length' — not the black colour code used on Ping's i25 and i200 charts. The published figures are recorded verbatim; no black-dot conversion has been attempted because Ping did not publish one for this model."
  - "Morton Golf Sales (Ping-authorised dealer) i-E1 individual irons page — corroborates every loft, length, offset and swing weight, and lists the SR/R/S/X flex options. Its per-club bounce column (4 to 13 degrees) is not carried on Ping's own chart, which instead lists 'bounce width' in inches (a sole-width figure), so bounce is deliberately omitted here rather than taken from a single secondary source."
  - "qsponge.com Ping i-Series E1 spec table — corroborates the loft, lie and length figures exactly, including the 59.63-to-64.75-degree lie progression."
  - "GolfWRX 'Spotted: Ping iE1 irons' (7 July 2015, Greenbrier Classic) and 'Ping i irons: What you need to know' (September 2015), plus MyGolfSpy 'PING Reinvents i-series with i iron' — the iE1 designation, the 2015 announcement used for year_introduced, the first-431-steel claim and the positioning as the i25's replacement."
  - "Note: year_discontinued is 2017, the year the successor i200 was announced per ping/i200-irons.yaml."
