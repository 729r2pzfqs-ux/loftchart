description: >
  In 2015 Ping dropped the numbering from its players line and launched the iron
  simply called i, also catalogued as the iE1 — the name under which it was first
  spotted on tour at the Greenbrier Classic in July 2015. It was the first Ping
  iron cast from 431 stainless steel, chosen for its softer feel and high
  strength-to-weight ratio, with tungsten toe weighting for forgiveness in a
  compact players head. Lengths and lofts were pushed about a quarter inch longer
  and one degree stronger than the i25 in the scoring clubs — the 7-iron is 32
  degrees at 37 inches — and the set runs 3-iron to pitching wedge plus a
  50-degree UW, in right and left hand. One caution on the lies below: unlike
  Ping's charts for the i25 and i200, which are based on the black colour code,
  Ping's own specification chart for this model states the lie angles are 'based
  on Blue Color Code at standard length', and the figures are recorded here
  exactly as Ping published them, without conversion.
