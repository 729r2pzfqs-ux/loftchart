description: >
  The i5 was Ping's mid-size cast players iron of the mid-2000s, sold as the
  smaller, lower-offset counterpart to the G5. The head is a shorter blade with
  a thinner top line and narrower sole than the G-series equivalent, and offset
  runs about 0.03 inches tighter club for club. The set was catalogued all the
  way from a 2-iron to a lob wedge. Ping's colour-code (dot) system sets lie
  angle relative to standard, and the lies below are the black (standard) lies.
