faq:
  - q: "What is the loft of a Ping i5 7-iron?"
    a: "The Ping i5 7-iron has a loft of 34 degrees, a standard (black dot) lie of 62.28 degrees and a steel-shaft length of 36.75 inches."
  - q: "When were Ping i5 irons made?"
    a: "The i5 was introduced in 2005 and was replaced by the i10 in 2007."
  - q: "What is the difference between the Ping i5 and the G5?"
    a: "The i5 is the smaller head of the pair — shorter blade, thinner top line, narrower sole and roughly 0.03 inches less offset per club than the G5, which is the game-improvement model of the same generation."
  - q: "How many clubs were in a Ping i5 set?"
    a: "The i5 was catalogued from a 2-iron through to a lob wedge — 2 to 9, pitching wedge, utility wedge, sand wedge and lob wedge — though most retail sets were built 3-PW or 4-PW."
