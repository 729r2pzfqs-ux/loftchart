successor: Ping G Le2
predecessor: Ping Rhapsody (2015)
description: >
  The G Le launched in late 2016 as the first generation of Ping's current
  women's line, replacing the second-generation Rhapsody and borrowing the
  G family's COR-Eye technology: a face 11 percent thinner that flexes for
  higher launch and more ball speed at moderate swing speeds. Ping claimed
  19 percent tighter dispersion than the Rhapsody irons, helped by enhanced
  perimeter weighting and lighter C2 to C8 swing weights. The stock set
  blends G Le hybrids at 22, 26 and 30 degrees into the 4H-6H slots above
  irons running from a 24 degree 5-iron to a 58 degree sand wedge, with a
  30.5 degree 7-iron. Lies are based on the Red colour code at standard
  ladies length. The G Le2 replaced it in 2019.
