faq:
  - q: "What is the loft of a Ping G Le 7-iron?"
    a: "The Ping G Le 7-iron has a loft of 30.5 degrees, a Red colour code lie of 61.88 degrees and a 36.5 inch standard ladies graphite length."
  - q: "Why does the Ping G Le set start at the 5-iron?"
    a: "The G Le was sold as a hybrid-iron combo: matching G Le hybrids at 22, 26 and 30 degrees fill the 4H, 5H and 6H slots above the 5-iron through sand wedge irons."
  - q: "What replaced the Ping G Le irons?"
    a: "The G Le2, launched in 2019, replaced the G Le, and the line has continued through the G Le3 introduced in 2023."
