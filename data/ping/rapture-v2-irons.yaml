description: >
  The Rapture V2 is the 2008 second generation of Ping's premium multi-material
  line, announced in late summer 2008 with retail into 2009, when it took a
  Golf Digest Hot List silver medal in the maximum-forgiveness class. The
  three-part head — stainless steel body, titanium face, tungsten sole weight
  — returns with lofts strengthened two degrees over the original Rapture, to
  32 degrees at the 7-iron and 45 at the pitching wedge, for more distance
  from the same high-launch weighting. The catalogued range is 3-iron through
  lob wedge. Lies below are the BLACK (standard) colour code of Ping's dot
  fitting system.
