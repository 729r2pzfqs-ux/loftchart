faq:
  - q: "What is the loft of a Ping Rapture V2 7-iron?"
    a: "The Ping Rapture V2 7-iron has a loft of 32 degrees, with a 62.25-degree standard lie and a 36.75-inch steel-shaft length."
  - q: "How do the Rapture V2 lofts compare with the original Rapture?"
    a: "They are two degrees stronger through the set — a 32-degree 7-iron against 34, and a 45-degree pitching wedge against 46 — which, combined with the low tungsten weighting, was Ping's route to more distance at the same launch."
  - q: "What are Ping Rapture V2 irons made of?"
    a: "Each head is a three-part multi-material design: a stainless steel body, a titanium face and a tungsten sole weight, giving a high moment of inertia in an oversize head."
