faq:
  - q: "What is the loft of a Ping GMax 7-iron?"
    a: "The Ping GMax 7-iron has a loft of 30.5 degrees, a standard (black dot) lie of 62.0 degrees and a steel-shaft length of 37.0 inches."
  - q: "When were Ping GMax irons released?"
    a: "Ping introduced the GMax in July 2015 as its maximum-forgiveness iron, sold alongside the G30 rather than replacing it. The hollow-body G700 replaced it in January 2018."
  - q: "Why are Ping GMax swing weights so light?"
    a: "Ping built the 4-9 irons deliberately light — C6 to C9 rather than the usual D-range — to help moderate swing speeds square the face and launch the ball; the wedges return to D1-D2."
  - q: "Are Ping GMax lofts the same as the G30?"
    a: "Yes, club for club: 21, 24, 27, 30.5, 35, 40 and 45 degrees from 4-iron to pitching wedge. The GMax UW is 50.5 degrees against the G30's 50, its sand wedge 56 against 54, and there is no GMax lob wedge."
