sources:
  - "Official Ping GMax specification page (ping.com/clubs/irons/gmax, archive.org captures of 18 July 2018 and 22 August 2019, identical tables) — supplied every length, loft, lie, offset, bounce and swing weight above for the 4-iron through SW, the note that 'Lie angle is based on Black Color Code at standard length', the Power Spec loft column, and the CFS Distance steel (SR/R/S/X, 95-115g) and CFS Graphite shaft tables."
  - "Note on the 6-iron lie: Ping's own table prints 61.6 degrees on both captures, even though it sits above the otherwise smooth 59.2/60.1/…/62.0 progression; the published figure is recorded rather than a smoothed one. Retail tables (Morton Golf Sales, Golfstead) circulate a more upright lie column that Morton labels as the Yellow Colour Code and it is not used here."
  - "Ping press material 'A look inside the new GMax iron and its COR-Eye Technology' (via mygolfway.com) and GolfWRX 'Ping GMax irons: What you need to know' — the COR-Eye claim of up to 3 mph more ball speed, and the 4-8 iron faces heat treated roughly 40% stronger into Hyper 17-4."
  - "Golfalot 'Ping GMax Irons Review' and golftec.com 'First Look: PING i & GMax irons' (July 2015) — the July 2015 introduction alongside the Ping i irons, retail availability from 30 July 2015, the Custom Tuning Port and the positioning alongside (not replacing) the G30."
  - "essential.golf 'Ping G700 Irons Launched' — the G700, announced 15 January 2018, 'launched for sale as a replacement for the GMax irons', which sets year_discontinued to 2018 on the successor-announcement convention."
