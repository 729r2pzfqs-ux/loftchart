description: >
  The GMax was the maximum-forgiveness iron Ping introduced in July 2015, sold
  alongside the G30 rather than replacing it, and it was the first Ping iron with
  the COR-Eye face structure, which activates the sole, face and top rail together
  for up to a claimed 3 mph more ball speed. The 4- through 8-iron faces are heat
  treated into a roughly 40 per cent stronger Hyper 17-4 alloy so they can be cast
  thinner, and a concealed Custom Tuning Port connects the cavity structure to the
  wide sole, pushing the CG low and back for a high-MOI head. The set is built
  deliberately light — swing weights run C6 to C9 from the 4-iron through the
  9-iron to help moderate swing speeds square the face — with lofts matching the
  G30 at 21 degrees for the 4-iron, 30.5 for the 7-iron and 45 for the pitching
  wedge, and a 56-degree sand wedge closing the 4-SW stock set. The hollow-body
  G700, announced in January 2018, replaced it. Ping's colour-code (dot) system
  sets lie angle relative to standard: gold 4 flat, brown 3 flat, orange 2 flat,
  red 1 flat, BLACK standard, blue 1 upright, green 2 upright, white 3 upright,
  silver 4 upright, maroon 5 upright. The lies below are the BLACK (standard) lies.
