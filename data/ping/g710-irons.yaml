faq:
  - q: "What is the loft of a Ping G710 7-iron?"
    a: "The Ping G710 7-iron has a loft of 29.5 degrees, a standard (black dot) lie of 62.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "When were Ping G710 irons made?"
    a: "The G710 arrived in 2020, following the G700, and was replaced by the G730 in 2024."
  - q: "Are Ping G700 and G710 lofts the same?"
    a: "Yes. Both run 20, 23, 26, 29.5, 34, 39, 44, 49 and 54 degrees from 4-iron to sand wedge, at the same lies, lengths and offsets. The G710's gains come from tungsten toe and hosel weighting and a machined face, not from stronger lofts."
  - q: "What is the pitching wedge loft on the Ping G710?"
    a: "44 degrees, with a 49-degree utility wedge and a 54-degree sand wedge completing the set."
