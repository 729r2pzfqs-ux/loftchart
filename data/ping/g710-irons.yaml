description: >
  The G710 is the second generation of Ping's hollow-body distance iron and
  carries the G700's loft, lie, length and offset chart over unchanged — a
  29.5-degree 7-iron at 37.00 inches. What changed is the mass: tungsten toe
  and hosel weights push the moment of inertia about 5 per cent above the G700,
  the maraging face is machined rather than only plasma-welded, and the body
  gets a hydropearl chrome finish. Lies below are the black (standard) code.
