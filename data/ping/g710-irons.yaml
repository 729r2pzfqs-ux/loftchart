sources:
  - "2ndswing.com Ping G710 Iron Set specification table — loft, lie, length, offset and swing weight for the 4-iron through sand wedge, and the AWT 2.0 stock shaft."
  - "golfalot.com and todays-golfer.com G710 reviews — confirm the 29.5-degree 7-iron, the 4-iron-to-SW set range, the tungsten toe and hosel weights, the machined maraging face, the roughly 5 per cent MOI gain over the G700, and the 2020 launch."
  - "Note on the chart: the G710 table published by 2ndswing is identical to its G700 table in every column. That matches Ping's positioning of the G710 as a same-spec mass-properties update, and the 7-iron loft is independently corroborated, but no Ping spec sheet was located, so confidence is medium."
