faq:
  - q: "What lofts does the Ping s259 come in?"
    a: "The s259 is sold from 46 to 62 degrees in 2-degree steps — 25 loft, bounce and grind combinations."
  - q: "What grinds does the Ping s259 offer?"
    a: "Six, carried over from the s159: S (every loft, 46-60), W (50-60, newly extended to 50 and 52 degrees), H (54-60), and the lob-wedge trio of T (58-62), B (58-60) and the Eye2-inspired E (58-60)."
  - q: "What do the numbers in Ping s259 model names mean?"
    a: "Ping stamps the effective bounce into the name — an s259 58 T-6 is the 58-degree T grind with 6 degrees of effective bounce. The bounce column in the chart uses those published figures."
  - q: "What bounce options does the s259 have at 58 and 60 degrees?"
    a: "Six at each loft: 6 degrees (T grind), 8 degrees in three different soles (B, E and H grinds), 10 degrees (S) and 14 degrees (W)."
