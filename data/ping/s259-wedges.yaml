description: >
  The s259 is Ping's 2026 tour wedge line, built on the s159 platform and
  announced in mid-January 2026 with custom fitting from 13 January. The cast
  8620 head carries a larger reshaped elastomer insert behind the face, and
  the grooves change by loft — tighter-spaced MicroMax grooves from 54 to 62
  degrees, milled full-shot grooves from 46 to 52. The matrix runs 25
  loft/bounce/grind combinations from 46 to 62 degrees across the six
  s159-era grinds (S, H, W, T, B, E), with the W grind newly extended down to
  50 and 52 degrees. Ping stamps the bounce into each model name, so a
  58 T-6 is the 58-degree T grind at 6 degrees of effective bounce. Bounce
  figures here are Ping's published effective bounce.
grinds:
  - code: S
    name: S Grind
    description: >
      The mid-to-higher-bounce all-rounder, offered at every loft. Square-face
      full shots plus heel and trailing-edge relief for greenside creativity;
      blends into the back of an iron set.
  - code: H
    name: H Grind
    description: >
      Based on a Ping Wrx half-moon tour grind. Versatility in softer
      conditions and for steeper swings or players who manipulate the handle.
  - code: W
    name: W Grind
    description: >
      Maximum forgiveness through the turf — high bounce for soft turf and
      sand, steep attack angles and shaft lean. New for s259, it extends down
      to 50 and 52 degrees.
  - code: T
    name: T Grind
    description: >
      The lowest effective bounce in the line at 6 degrees, with steeper
      trailing-edge relief so the face sits lower when opened. For open-face
      shots from tight lies.
  - code: B
    name: B Grind
    description: >
      Low bounce for shallow attack angles and square setups, with a wider
      sole for forgiveness in firm conditions.
  - code: E
    name: E Grind
    description: >
      Eye2-inspired sole with mid-sole dishing for soft shots from tight
      turf and wider back-edge bounce for bunkers and open-face shots,
      reshaped for a more traditional look at address.
