faq:
  - q: "What is the loft of a Ping G Le3 7-iron?"
    a: "The Ping G Le3 7-iron has a loft of 29.5 degrees, a lie of 62 degrees and a graphite-shaft length of 36.5 inches."
  - q: "Why does the Ping G Le3 set start at the 6-iron?"
    a: "Ping designed the G Le3 for moderate swing speeds and replaced the long and mid irons with matching G Le3 hybrids of 22, 26, 30 and 34 degrees (4H-7H), so a full set blends hybrids into the 6-iron through sand wedge."
  - q: "Are Ping G Le3 irons only for women?"
    a: "Ping engineered the G Le3 family specifically for women — lighter heads, lighter ULT 250 i shafts and swing weights around C1-C6 — though anyone with a moderate swing speed can play them."
  - q: "When was the Ping G Le3 released and replaced?"
    a: "The G Le3 family launched on 18 July 2023 and was replaced by the G Le4 family in 2026."
