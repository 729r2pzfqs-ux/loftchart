description: >
  The G Le3 is the third generation of Ping's club line engineered specifically
  for women, launched on 18 July 2023. The irons are lightweight,
  perimeter-weighted 17-4 stainless steel heads with a metal-wood-style face
  structure and a multi-material PurFlex cavity badge for more face flexing,
  with high-density heel and toe weights providing the forgiveness while
  keeping overall weight and swing weight low. The set runs 6-iron through
  sand wedge, with matching G Le3 hybrids (22 to 34 degrees) covering the 4H
  to 7H slots above it. Ping custom-engineered the loft progression for
  slower swing speeds — 29.5 degrees at the 7-iron with a wide 4.5-degree gap
  down to the 25-degree 6-iron — and the specs below are the women's standard
  graphite build with Ping's ULT 250 i shaft. Ping's colour-code (dot) system
  sets lie angle relative to standard; the lies below are the standard lies.
  The G Le4 family replaced it in 2026.
