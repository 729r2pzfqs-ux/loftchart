faq:
  - q: "What lofts do the Ping G430 fairway woods come in?"
    a: "The G430 Max comes in 15, 18, 21 and 24 degrees; the G430 SFT in 16, 19 and 22; and the titanium G430 LST in a single 15 degree 3-wood."
  - q: "Is the Ping G430 fairway wood adjustable?"
    a: "Yes — every head uses Ping's eight-position Trajectory Tuning 2.0 hosel, with ±1.5 degrees of loft and flat positions up to 3 degrees flatter than standard."
  - q: "What is special about the G430 LST 3-wood?"
    a: "It is a titanium fairway: a 2041 beta-titanium face and Ti 8-1-1 body with an 80 gram tungsten sole plate and Carbonfly Wrap crown. Ping claimed about seven yards over the steel Max 3-wood from faster ball speed and less spin, at a 600 dollar premium price."
