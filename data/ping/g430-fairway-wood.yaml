length_note: >
  Standard lengths are based on the stock ALTA CB Black 65 shaft. Ping
  publishes lie as the average across the five neutral-lie hosel positions;
  no average lie was published for the LST 3-wood.
hosel:
  system: "Trajectory Tuning 2.0"
  loft_range: "±1.5°"
  positions: 8
  lie_effect: >
    Three flat positions sit up to 3° flatter than standard; there is no
    upright setting.
  face_note: >
    Lowering loft opens the face slightly and adding loft closes it.
  notes: >
    The same eight-position chart as the G430 drivers — unchanged from the
    G425 generation and carried on into the G440, so sleeves and settings
    interchange across Ping's woods.
