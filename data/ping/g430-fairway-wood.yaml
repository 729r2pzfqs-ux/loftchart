construction: steel bodies with Carbonfly Wrap on the LST; shallower Facewrap faces with Spinsistency variable roll
predecessor: Ping G425
successor: Ping G440
description: >
  The G430 fairway woods reached retail in January 2023 with the G430
  drivers, led by a thinner, shallower Facewrap maraging steel face and
  Spinsistency variable roll for more ball speed low on the face. The Max is
  the core four-loft head, the SFT the draw-biased slice corrector, and both
  are offered in High Launch (HL) builds with an ALTA Quick shaft and lighter
  head. A titanium G430 LST 3-wood — 2041 beta-titanium face, 80 g tungsten
  sole plate and Carbonfly Wrap crown — followed in June 2023 after
  manufacturing delays. The G440 fairways replaced the line in January 2025.
variants:
  - name: G430 Max
    description: >
      The core head for most players in four lofts, 176 cc (3-wood) down to
      148 cc (9-wood) at a D1 swing weight. The HL build swaps to a lighter
      head and the 38-44 g ALTA Quick shaft at C8.
  - name: G430 LST
    description: >
      Added June 2023: a 169 cc titanium 3-wood with a 2041 beta-titanium
      face, Ti 8-1-1 body, 80 g tungsten sole plate and Carbonfly Wrap crown
      — Ping's low-spin tour fairway, 15° only, at D2.
  - name: G430 SFT
    description: >
      The draw-biased slice corrector with heel-side CG, in three lofts at a
      lighter D0 swing weight.
