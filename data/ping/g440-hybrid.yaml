description: >
  The G440 hybrids launched on 30 January 2025 with the G440 woods, on a
  single six-loft head that runs from a 17° 2-hybrid to a 34° 7-hybrid —
  Ping's chart maps them to the 2-iron through 7-iron slots. A shallower,
  thinner face and the internal Free Hosel lower the CG for easier launch,
  and every head takes the eight-position Trajectory Tuning 2.0 hosel. A High
  Launch (HL) build pairs an aluminium backweight with the ALTA Quick shaft
  at a C7 swing weight, offered in the 3H through 7H.
variants:
  - name: G440
    description: >
      The single hybrid head, in six lofts from 17° to 34° at a D1 swing
      weight. Ping's own gapping chart pairs the 2H with a 5-wood and 2-iron,
      the 3H with a 7-wood and 3-iron, and the 4H with a 9-wood and 4-iron.
