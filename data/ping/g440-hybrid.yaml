faq:
  - q: "What lofts does the Ping G440 hybrid come in?"
    a: "Six lofts: 17, 20, 23, 26, 30 and 34 degrees — the 2-hybrid through 7-hybrid. Ping maps them to the 2-iron through 7-iron slots."
  - q: "Is the Ping G440 hybrid adjustable?"
    a: "Yes — every loft uses Ping's eight-position Trajectory Tuning 2.0 hosel, with ±1.5 degrees of loft and flat positions up to 3 degrees flatter than standard."
  - q: "Which G440 hybrid replaces which iron?"
    a: "Ping's own chart pairs the 17 degree 2H with a 2-iron, 20 degree 3H with a 3-iron, 23 degree 4H with a 4-iron, 26 degree 5H with a 5-iron, 30 degree 6H with a 6-iron and 34 degree 7H with a 7-iron — though hybrids fly further than the iron they replace for most players."
