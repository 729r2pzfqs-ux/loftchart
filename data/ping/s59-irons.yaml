description: >
  The S59 started Ping's counting-down S series of compact players irons in
  2003, sold alongside the game-improvement G2 and i3+. It is a small cast
  head with a shallow bar-crossed cavity that keeps some perimeter
  forgiveness while offering the feel, distance control and penetrating
  flight of a players club, with a slim top line, beveled sole and minimal
  offset — 0.09 inches at the 7-iron. Ping published the chart unrounded —
  the 7-iron reads 34.3 degrees on ping.com's table, 34.25 on the launch-era
  chart — and the long irons carry negative or zero bounce. The stock build used Ping's 108-gram Z-Z65 steel shaft. Ping's
  colour-code (dot) system sets lie angle relative to standard; the lies
  below are the BLACK (standard) lies. The S58 replaced it in 2006 with a
  near-identical chart.
