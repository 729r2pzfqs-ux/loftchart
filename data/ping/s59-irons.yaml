faq:
  - q: "What is the loft of a Ping S59 7-iron?"
    a: "The Ping S59 7-iron has a loft of 34.3 degrees, a standard (black dot) lie of 62.28 degrees and a steel-shaft length of 36.75 inches. Ping published the S59 chart unrounded; its launch-era chart prints the loft as 34.25 degrees."
  - q: "Was the Ping S59 a blade?"
    a: "Not quite. It is Ping's most compact cast players iron of its era, with a small head, slim top line and only a shallow bar-crossed cavity for forgiveness — the closest thing to a blade Ping offered at the time."
  - q: "What came after the Ping S59?"
    a: "The S58 in 2006, which kept an almost identical loft, lie and length chart and continued the counting-down S series through the S57, S56 and S55."
  - q: "Why do the Ping S59 long irons have negative bounce?"
    a: "Ping ground the 2- and 3-iron soles with -1 and 0 degrees of bounce for a cleaner leading edge and a more penetrating strike, rising progressively to 10 degrees at the pitching wedge."
