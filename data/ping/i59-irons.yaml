  - "2nd Swing Golf specification table for the Ping i59 iron set (https://www.2ndswing.com/golf-clubs/iron-sets/ping-i59-iron-set) — supplied every loft, lie, length, offset and swing weight above, the stock shaft list and the 3-PW set makeup."
