description: >
  The i59 is Ping's compact forged players iron, built from a 1025 carbon steel body
  with a laser-cut 17-4 stainless face and a light aluminium insert filling the cavity,
  which frees mass for tungsten toe weighting without growing the head. Lofts are
  traditional — the 7-iron is 34 degrees, a degree weaker than the i230 of the same
  period — and offset runs tighter than the cast i-series at every club. Ping's colour-code (dot) system sets lie angle relative to standard: gold 4 flat,
  brown 3 flat, orange 2 flat, red 1 flat, BLACK standard, blue 1 upright, green 2
  upright, white 3 upright, silver 4 upright, maroon 5 upright. The lies below are the
  BLACK (standard) lies.
