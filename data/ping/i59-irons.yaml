faq:
  - q: "What is the loft of a Ping i59 7-iron?"
    a: "The Ping i59 7-iron has a loft of 34 degrees, a standard (black dot) lie of 62.0 degrees and a steel-shaft length of 37.0 inches."
  - q: "When were Ping i59 irons made?"
    a: "Ping announced the i59 on 24 August 2021 and it reached retail on 2 September 2021, replacing the iBlade."
  - q: "How do Ping i59 lofts compare with the i230?"
    a: "The i59 is a degree weaker at the 7-iron, 34 against 33, and carries about a hundredth of an inch less offset at each club."
