description: >
  The G Le2 is the second generation of Ping's line engineered specifically
  for women, launched on 2 July 2019. The irons use Ping's COR-Eye face
  technology with a deep top-rail undercut for more face flexing, a tungsten
  toe weight that lifts MOI about ten percent over the original G Le, and a
  lightweight overall build with C-range swing weights. The iron set runs
  6-iron through sand wedge, with matching G Le2 hybrids covering the 4H to
  7H slots above it. Specs below are the women's standard graphite build with
  the ULT 240 i shaft; Ping's colour-code system sets lie relative to the
  standard lies listed. The G Le3 replaced it in 2023.
