faq:
  - q: "What is the loft of a Ping G Le2 7-iron?"
    a: "The Ping G Le2 7-iron has a loft of 30.5 degrees, a lie of 62 degrees and a length of 36.5 inches in the women's standard graphite build."
  - q: "What clubs came in the Ping G Le2 iron set?"
    a: "The iron set ran 6-iron through sand wedge — 6-9, PW (45 degrees), UW (52 degrees) and SW (58 degrees) — with G Le2 hybrids covering the 4H to 7H slots above it."
  - q: "When were the Ping G Le2 irons made?"
    a: "They launched on 2 July 2019 as the second generation of Ping's women's line and were replaced by the G Le3 in July 2023."
