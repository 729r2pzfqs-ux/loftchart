description: >
  The G440 fairway woods launched on 30 January 2025 with the G440 drivers,
  carrying the same Carbonfly Wrap crown and weight-saving Free Hosel. The
  Max is the core head for most players and adds a new 17° 4-wood to the
  familiar 3-9-wood ladder; the LST is the compact titanium-bodied low-spin
  head for faster swings; and the SFT is the draw-biased slice corrector with
  a taller face for tee use. High Launch (HL) builds of the Max and SFT pair
  an aluminium backweight with the 38-44 g ALTA Quick shaft at a C7-C8 swing
  weight.
variants:
  - name: G440 Max
    description: >
      The core head for most players, in five lofts including a new 17°
      4-wood. Head sizes run 186 cc (3-wood) down to 157 cc (9-wood), all at
      a D2 swing weight.
  - name: G440 LST
    description: >
      The low-spin head: HST titanium face, Ti 8-1-1 body, tungsten sole
      plate and Carbonfly Wrap crown for a penetrating flight. 190 cc 3-wood
      and 176 cc 5-wood at a D3 swing weight.
  - name: G440 SFT
    description: >
      The draw-biased slice corrector with heel-side CG and a taller face for
      confidence off the tee. 193-174 cc heads at a lighter D0 swing weight.
