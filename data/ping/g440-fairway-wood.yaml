faq:
  - q: "What lofts do the Ping G440 fairway woods come in?"
    a: "The G440 Max comes in 15, 17, 19, 21 and 24 degrees — including a new 17 degree 4-wood; the G440 LST in 15 and 19; and the G440 SFT in 16, 19 and 22."
  - q: "Is the Ping G440 fairway wood adjustable?"
    a: "Yes — every head uses Ping's eight-position Trajectory Tuning 2.0 hosel, with ±1.5 degrees of loft and flat positions up to 3 degrees flatter than standard. There is no upright setting."
  - q: "What is the difference between the G440 Max and G440 LST fairway woods?"
    a: "The Max is the steel-faced core head in five lofts at D2. The LST is a titanium head with an HST titanium face and tungsten sole plate, built for faster swings that need less spin, in 15 and 19 degrees at D3."
