length_note: >
  45.75 inches is the standard build with the stock counter-balanced ALTA CB
  55 Slate; builds with the Ping Tour, Tensei AV Raw or Aldila Rogue shafts
  are 45.25 inches. Ping publishes lie as the average across the five
  neutral-lie hosel positions.
hosel:
  system: "Trajectory Tuning 2.0"
  loft_range: "±1.5°"
  positions: 8
  lie_effect: >
    Three flat positions sit 3° flatter than standard; there is no upright
    setting.
  face_note: >
    Lowering loft opens the face slightly and adding loft closes it, as on
    any hosel-based adjuster.
  notes: >
    The chart comes from Ping's own adjustability diagram and carried
    unchanged into the G430 and G440, so sleeves and settings interchange
    across the generations.
