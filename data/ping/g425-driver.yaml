faq:
  - q: "What lofts does the Ping G425 come in?"
    a: "The G425 Max comes in 9, 10.5 and 12 degrees; the G425 LST in 9 and 10.5; and the G425 SFT in 10.5 only."
  - q: "What is the G425 adjustment chart?"
    a: "Ping's Trajectory Tuning 2.0 hosel has eight settings: standard, +1, +1.5, −1 and −1.5 degrees of loft at the standard lie, plus flat versions of standard, +1 and −1 that sit 3 degrees flatter. There is no upright setting."
  - q: "Is the Ping G425 Max still worth buying used?"
    a: "It remains one of the best value used drivers: its near-10K MOI is still competitive with current forgiveness heads, its hosel chart matches the newer G430 and G440, and used prices sit far below either. Check the stamped loft and hosel setting against this chart before buying."
  - q: "What is the difference between the G425 Max and G425 LST?"
    a: "The Max is the 460 cc forgiveness head with a 26 gram movable backweight; the LST is a smaller 445 cc head whose 17 gram CG shifter and forward balance cut spin by roughly 500-700 rpm for faster swings."
