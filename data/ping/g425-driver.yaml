club_type: driver
year_introduced: 2021
year_discontinued: 2023
category: flagship
construction: cast titanium body with ultra-thin Ti 8-1-1 crown, internal Dragonfly rib structure, crown turbulators and a tungsten backweight (movable on the Max and LST)
material: cast Ti 8-1-1 titanium body and crown; precision-machined forged T9S+ titanium face
predecessor: Ping G410
successor: Ping G430
description: >
  The G425 is Ping's 2021-2022 driver family and was the forgiveness
  benchmark of its day: the G425 Max's combined MOI approached 10,000 g·cm²
  years before "10K" became a marketing category. The Max carries a 26 g
  movable tungsten backweight with Neutral, Draw and Fade positions; the
  445 cc LST cuts several hundred rpm of spin with a 17 g CG shifter; and the
  SFT is the fixed-weight draw model, sold in 10.5° only. Announced for
  pre-sale on 11 January 2021, the family ran until the G430 replaced it in
  2023, and it remains one of the most recommended used drivers for its
  price-to-forgiveness ratio.
variants:
  - name: G425 Max
    head_cc: 460
    description: >
      The MOI flagship of its generation — total MOI near 10,000 g·cm² — with
      a 26 g movable tungsten backweight in Neutral, Draw and Fade positions.
      Head weight 206 g, swing weight D3.
  - name: G425 LST
    head_cc: 445
    description: >
      The low-spin head: about 200 rpm less than the G410 LST and 500-700 rpm
      less than the G425 Max, with a 17 g three-position CG shifter. Head
      weight 208 g, swing weight D4.
  - name: G425 SFT
    head_cc: 460
    description: >
      The draw model, 10.5° only, with a fixed 23 g tungsten heel-side
      backweight worth roughly 25 yards of right-to-left versus the Max.
      Head weight 202 g, swing weight D1.
