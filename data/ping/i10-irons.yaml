faq:
  - q: "What is the loft of a Ping i10 7-iron?"
    a: "The Ping i10 7-iron has a loft of 34 degrees, a standard (black dot) lie of 62.25 degrees and a steel-shaft length of 36.75 inches."
  - q: "When were Ping i10 irons made?"
    a: "The i10 was introduced in 2007 and was replaced by the i15 in 2009."
  - q: "Are Ping i10 and i5 lofts the same?"
    a: "Yes. Both run 21, 24, 27, 30.5, 34, 38, 42 and 46 degrees from 3-iron to pitching wedge. The i10 differs in offset — about 0.05 inches less at the 3-iron — and in its lie progression."
  - q: "How much offset does a Ping i10 have?"
    a: "Offset runs from 0.19 inches at the 3-iron down to 0.05 inches at the pitching wedge, roughly 0.05 inches less than the i5 through the long irons."
