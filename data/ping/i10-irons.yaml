sources:
  - "qsponge.com Ping i10 iron spec listing — loft, lie, length, bounce and offset for the 2-iron through lob wedge. This is the only source found that carries the full chart."
  - "swingyard.com 'PING Irons by Year' — dates the i10 to 2007, between the i5 (2005) and the i15."
  - "Corroboration: Ping's own G10 specification chart (the archived ping.com spec page, recorded elsewhere in this database) carries exactly the same lofts, lies and lengths for the same generation, with roughly 0.13 inches more offset per club and a different bounce progression. That is consistent with contemporary reviews describing the i10 as the G10 shape with less offset and a narrower sole, and it independently supports the loft, lie and length figures above."
  - "Conflict note: 2ndswing.com's Ping i10 page publishes a different table (3-iron at 39.0 inches and a 60.0-degree lie) that is identical to the table it publishes for the i15 and does not match the i15's own published chart, so it appears to be a mis-keyed record and was not used. Confidence is medium because no Ping chart for the i10 itself was located."
