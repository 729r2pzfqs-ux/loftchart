description: >
  The i10 replaced the i5 as Ping's cast players iron, cutting offset again and
  narrowing the sole relative to the G10 of the same generation. It keeps the
  i5's loft chart exactly — 21 degrees at the 3-iron, 34 at the 7-iron — but
  moves to the flatter, shorter-hosel geometry Ping then carried through the
  i15 and i20, so the lies are a straight half-degree progression from 59.25.
  Lies below are the black (standard) colour code.
