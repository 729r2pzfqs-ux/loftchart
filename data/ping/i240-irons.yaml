description: >
  The i240 follows the i230 and carries its loft, lie, length and offset chart over
  unchanged, club for club: the 7-iron is still 33 degrees at 62.0 lie and 37 inches.
  What changes is around the numbers — a 3-iron on the published chart, AWT 3.0 as the
  stock steel shaft in place of AWT 2.0, and a softer bounce progression, with a
  degree less bounce in the 8 and 9-irons than the i230 carried. Ping's colour-code (dot) system sets lie angle relative to standard: gold 4 flat,
  brown 3 flat, orange 2 flat, red 1 flat, BLACK standard, blue 1 upright, green 2
  upright, white 3 upright, silver 4 upright, maroon 5 upright. The lies below are the
  BLACK (standard) lies.
