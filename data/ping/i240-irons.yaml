faq:
  - q: "What is the loft of a Ping i240 7-iron?"
    a: "The Ping i240 7-iron has a loft of 33 degrees, a standard (black dot) lie of 62.0 degrees and a steel-shaft length of 37.0 inches — the same as the i230 before it."
  - q: "When were Ping i240 irons released?"
    a: "In 2025, following the i230. They were spotted in play on tour at the Memorial Tournament earlier that year."
  - q: "What changed between the Ping i230 and i240?"
    a: "Loft, lie and length are unchanged through the set. The i240 publishes a 3-iron, uses AWT 3.0 rather than AWT 2.0 as the stock steel shaft, and softens the bounce slightly in the 8 and 9-irons."
