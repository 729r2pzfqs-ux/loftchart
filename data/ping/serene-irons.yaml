faq:
  - q: "What is the loft of a Ping Serene 7-iron?"
    a: "The Ping Serene 7-iron has a loft of 31.5 degrees, a Red colour code lie of 62.25 degrees and a 36.25 inch standard ladies graphite length."
  - q: "Why does the Ping Serene set start at the 5-iron?"
    a: "The Serene was sold as a hybrid-iron combo: matching Serene hybrids at 22, 26 and 30 degrees fill the 4H, 5H and 6H slots above the 5-iron through lob wedge irons."
  - q: "When were Ping Serene irons made?"
    a: "The Serene launched in late 2013 as the successor to the Faith and was replaced by the second-generation Rhapsody in 2015."
