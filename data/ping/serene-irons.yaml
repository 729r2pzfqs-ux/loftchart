sources:
  - "Ping's own Serene product page, Specifications tab (web.archive.org capture of ping.com/clubs/ironsdetail.aspx?id=14105, February 2014) - supplied every loft, length, offset, lie, bounce and swing weight above, the 4H/5H/6H hybrid specs (22, 26 and 30 degrees, C5), the ULT 210i Lite (51g) and Ultra Lite (44g) shaft table, the Purple 360 ID8 stock grip, and the note that lie angle is based on the Red colour code at standard ladies length"
  - "Same archived page - set composition '5 through pitching wedge, plus a 52 degree sand wedge and a 58 degree lob wedge', with perimeter and back-flange weighting and a floating CTP weight"
  - "The archived page's navigation lists the Serene alongside the G25, i25, S55 and Anser generation, dating the line to late 2013; the second-generation Rhapsody announced in early 2015 replaced it, which sets year_discontinued on the successor convention"
