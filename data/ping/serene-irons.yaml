description: >
  The Serene was Ping's women's line between the Faith and the 2015 Rhapsody
  revival. Perimeter and back-flange weighting drive the centre of gravity
  low and back for a high, easy trajectory, with a floating CTP weight in the
  cavity for distance control. The stock set blends Serene hybrids at 22, 26
  and 30 degrees into the 4H-6H slots above the irons, which run from a 25
  degree 5-iron to a 58 degree lob wedge with a 31.5 degree 7-iron. Ping
  published the lie angles unrounded, based on the Red colour code at
  standard ladies length, half an inch under men's standard, with light C4
  to D0 swing weights on the stock ULT 210 graphite.
