description: >
  The Eye 2 Plus (stamped EYE2+) is the final major revision of the Eye 2, which
  Ping says underwent dozens of minor and a few major changes before the EYE2+
  was introduced in April 1990 — the same month Ping's groove settlement with
  the USGA took effect. Lofts through the irons are about one degree stronger
  than the classic Eye 2 chart (35 degrees at the 7-iron against 36), and the
  wedges were re-spaced to a 48.5-degree PW, 53-degree SW and 58-degree LW in
  place of the old 50.5 / 57.5 / 61 set-up. Ping's colour-code (dot) system sets
  lie angle relative to standard, with BLACK the standard lie; the lies below
  are the black-dot lies, and Ping notes loft and lie are rounded to the nearest
  0.5 degree. Ping's own chart adds that Eye 2 irons built after January 1998
  were made to this same EYE2+ specification.
