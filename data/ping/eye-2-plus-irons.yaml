faq:
  - q: "What is the loft of a Ping Eye 2 Plus 7-iron?"
    a: "The Ping Eye 2 Plus 7-iron has a loft of 35 degrees, a standard (black dot) lie of 62.5 degrees and a steel-shaft length of 36.75 inches — one degree stronger than the 36-degree 7-iron of the original Eye 2."
  - q: "What is the difference between the Ping Eye 2 and the Eye 2 Plus?"
    a: "The Eye 2 Plus, introduced in April 1990, strengthened the iron lofts by roughly one degree (7-iron from 36 to 35 degrees) and re-spaced the wedges to 48.5, 53 and 58 degrees from the Eye 2's 50.5, 57.5 and 61. Lie angles and lengths are unchanged. Ping also notes that Eye 2 irons built after January 1998 use the Eye 2 Plus specification."
  - q: "When were Ping Eye 2 Plus irons made?"
    a: "Ping introduced the EYE2+ in April 1990 as the final revision of the Eye 2 line. The Zing, announced in 1992, took over as Ping's mainstream game-improvement iron, though Eye 2-family irons remained orderable for years afterwards."
  - q: "What shaft came in the Ping Eye 2 Plus?"
    a: "The stock steel shaft was Ping's KT ('Karsten Tour'), introduced with the Eye 2+ and later reinforced with a heavier tip as the KT-M."
