sources:
  - "Ping's own archived Classics spec page for the Eye 2 (http://web.archive.org/web/20040607003749/http://ping.com:80/classics/irons/eye2.html) — the page carries a dedicated 'EYE2 (built after Jan. 1998) and EYE2+ Specifications' table used for every loft, black-dot lie and length above, states that the EYE2+ was introduced in April 1990 as the final revision of the Eye 2, and notes loft and lie are rounded to the closest 0.5 degree"
  - "Note on the year: some secondary references date the Eye 2 Plus to 1989, but Ping's own Classics page says the model 'was introduced in April 1990', and that manufacturer date is used for year_introduced. year_discontinued is taken as 1992, the year the successor Zing was introduced per the chronology recorded in ping/zing-irons.yaml"
  - "GolfWRX Classic Golf forum threads ('ping KT vs KT-M shafts', 'Explain this: Ping Eye2+/KT-M') — the KT ('Karsten Tour') steel shaft was introduced with the Eye 2+ and was later reinforced as the KT-M; corroborated by period Eye 2+ retail listings (2nd Swing, ProClubs, Mike's Golf Shop), which consistently show KT and KT-M shafts"
  - "Mike's Golf Shop listing of a BeCu Eye 2 + set — the Plus, like the Eye 2, was also offered in beryllium copper heads"
  - "Note: Ping never published per-club offset, bounce or swing weight for the Eye 2 Plus; those keys are deliberately omitted"
