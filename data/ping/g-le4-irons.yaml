description: >
  The G Le4 is the fourth generation of Ping's club line engineered
  specifically for women, announced on 10 March 2026 as the replacement for the
  G Le3. The irons are lightweight, perimeter-weighted stainless steel heads
  with a thin face, high-density tip and toe weights and a PurFlex cavity
  badge, sold as an iron/hybrid combination: the irons run 6-iron through sand
  wedge, with G Le4 hybrids of 22, 26.5, 31 and 36 degrees (5H to 8H) available
  above and alongside them. Lofts, lies and lengths are close to the G Le3 —
  29.5 degrees at the 7-iron — with the pitching wedge half a degree weaker at
  46.5 and the utility wedge half a degree stronger at 51.5. The specs below
  are the women's standard graphite build with Ping's ALTA Le i shaft; no steel
  shaft is offered. Ping also publishes Power Spec and Retro Spec loft options;
  the figures below are the standard lofts only, with lies for the black
  (standard) colour code.
