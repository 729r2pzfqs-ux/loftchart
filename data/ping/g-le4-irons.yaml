faq:
  - q: "What is the loft of a Ping G Le4 7-iron?"
    a: "The Ping G Le4 7-iron has a standard loft of 29.5 degrees, a standard (black dot) lie of 62.0 degrees and a graphite-shaft length of 36.5 inches."
  - q: "What clubs are in the Ping G Le4 iron set?"
    a: "The irons run from a 25-degree 6-iron to a 41-degree 9-iron, with a 46.5-degree pitching wedge, a 51.5-degree utility wedge and a 56-degree sand wedge. Matching G Le4 hybrids of 22, 26.5, 31 and 36 degrees (5H to 8H) fill the longer slots."
  - q: "How do the Ping G Le4 lofts differ from the G Le3?"
    a: "The 6-iron to 9-iron and the sand wedge keep the same standard lofts. The pitching wedge is half a degree weaker at 46.5 degrees and the utility wedge half a degree stronger at 51.5, which evens the gaps between the 9-iron and the sand wedge."
  - q: "When were Ping G Le4 irons released?"
    a: "Ping announced the G Le4 family on 10 March 2026, with custom fittings and pre-orders opening the same day."
