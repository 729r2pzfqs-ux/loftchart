description: >
  The G730 replaces the G710 and is the strongest-lofted iron Ping has made:
  28 degrees at the 7-iron and 40 at the pitching wedge, four degrees stronger
  through the set than the G710. The set starts at a 5-iron rather than a
  4-iron and is filled out with a 45-degree utility and 50- and 56-degree
  wedges, which is how Ping keeps the gapping usable underneath a 40-degree
  pitching wedge. Lies below are the black (standard) colour code.
