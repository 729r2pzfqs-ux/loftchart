faq:
  - q: "What is the loft of a Ping G730 7-iron?"
    a: "The Ping G730 7-iron has a loft of 28 degrees, a standard (black dot) lie of 62.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "How much stronger is the G730 than the G710?"
    a: "Four degrees through the set. The G730 7-iron is 28 degrees against 29.5 on the G710 at the same 37.00-inch length, and the pitching wedge is 40 degrees against 44."
  - q: "Does the Ping G730 come with a 4-iron?"
    a: "No. The set runs from a 5-iron at 21.5 degrees, then pitching wedge, utility wedge and 50- and 56-degree wedges. Ping expects the top of the bag to be covered by a hybrid or crossover."
  - q: "What is the pitching wedge loft on the Ping G730?"
    a: "40 degrees — the strongest pitching wedge Ping has catalogued — with a 45-degree utility wedge below it."
