faq:
  - q: "What is the loft of a Ping G740 7-iron?"
    a: "The Ping G740 7-iron has a standard loft of 28 degrees, a standard (black dot) lie of 63.0 degrees and a steel-shaft length of 37.0 inches. Ping's optional Power Spec and Retro Spec builds are 26.5 and 30.0 degrees."
  - q: "What is the pitching wedge loft on the Ping G740?"
    a: "40 degrees in the standard loft, followed by a 45-degree utility wedge and 50- and 56-degree wedges."
  - q: "How do the Ping G740 lofts compare with the G730?"
    a: "They are nearly identical. The 6-iron through 56-degree wedge have the same standard lofts as the G730, and the 5-iron is half a degree stronger at 21 degrees. The published standard lies are about one degree more upright, 63.0 degrees at the 7-iron against 62.0."
  - q: "When were Ping G740 irons released?"
    a: "Ping announced the G740 on 10 March 2026, with custom fittings and pre-orders opening the same day."
