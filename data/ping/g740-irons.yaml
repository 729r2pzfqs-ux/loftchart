description: >
  The G740 is Ping's super-game-improvement iron, announced on 10 March 2026 as
  the replacement for the G730. It is a perimeter-weighted cavity-back head in
  heat-treated 17-4 stainless steel with a wider dual-camber sole, a longer
  blade, a thicker topline and a PurFlex cavity badge with three flex zones.
  The standard lofts are almost unchanged from the G730 — 28 degrees at the
  7-iron and 40 at the pitching wedge, with the 5-iron half a degree stronger
  at 21 — while the published standard lies are about one degree more upright
  through the set. The set runs 5-iron to pitching wedge with a 45-degree
  utility wedge and 50- and 56-degree wedges. Ping also publishes Power Spec
  and Retro Spec loft options; the figures below are the standard lofts only,
  with lies for the black (standard) colour code.
