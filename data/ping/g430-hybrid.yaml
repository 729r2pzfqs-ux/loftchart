description: >
  The G430 hybrid reached retail in January 2023 with the G430 woods, the
  first Ping hybrid with a Carbonfly Wrap composite crown — the saved weight
  moved the CG lower for more ball speed and a shallower landing flight. One
  head covers six lofts from a 17° 2-hybrid to a 34° 7-hybrid, every loft
  takes the eight-position Trajectory Tuning 2.0 hosel, and a High Launch
  (HL) build pairs a lighter head with the ALTA Quick shaft in the 3H-7H. The
  G440 hybrids replaced the line in January 2025.
variants:
  - name: G430
    description: >
      The single hybrid head, in six lofts from 17° to 34° at a D1 swing
      weight, with head weights stepping from 235 g to 260 g down the set.
