faq:
  - q: "What lofts does the Ping G430 hybrid come in?"
    a: "Six lofts: 17, 19, 22, 26, 30 and 34 degrees — the 2-hybrid through 7-hybrid. Note the 3H is 19 degrees, a degree stronger than the G440 generation's 20 degree 3H."
  - q: "Is the Ping G430 hybrid adjustable?"
    a: "Yes — every loft uses Ping's eight-position Trajectory Tuning 2.0 hosel, with ±1.5 degrees of loft and flat positions up to 3 degrees flatter than standard."
  - q: "What changed from the G430 hybrid to the G440 hybrid?"
    a: "The G440 moved to a shallower, thinner face with an internal Free Hosel and re-spaced the strong end of the ladder: the 19 degree 3H and 22 degree 4H became 20 and 23 degrees. The adjustment chart is unchanged."
