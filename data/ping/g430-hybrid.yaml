length_note: >
  Standard lengths are based on the stock ALTA CB Black 70 shaft. Ping
  publishes lie as the average across the five neutral-lie hosel positions.
hosel:
  system: "Trajectory Tuning 2.0"
  loft_range: "±1.5°"
  positions: 8
  lie_effect: >
    Three flat positions sit up to 3° flatter than standard; there is no
    upright setting.
  face_note: >
    Lowering loft opens the face slightly and adding loft closes it.
  notes: >
    The same eight-position chart as the G430 drivers and fairways. The
    ±1.5° "big" settings exist only at the standard lie; the flat positions
    offer 0 and ±1° of loft.
