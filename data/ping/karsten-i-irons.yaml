description: >
  The Karsten I was Ping's first full iron line and the club that brought
  Karsten Solheim's investment-cast, perimeter-weighted cavity back to market
  in 1969, predating the Ping Eye by nearly a decade. Early heads are stamped
  KARSTEN MFG. CO. PHOENIX ARIZ. with PAT PEND; later production carries the
  KARSTEN I name, Ping's colour-dot lie system and the number of US Patent
  3,655,188 — Solheim's "correlated golf club set" patent, filed in July 1969
  and granted in April 1972. Ping never published a factory spec sheet for the
  Karsten series, so the chart below is the per-club loft and lie table from
  that patent, which collectors treat as the intended spec for the Karsten
  family; the patent itself calls it an exemplary set whose lofts "may be
  varied slightly", and a machine-measured surviving set runs within a degree
  or two of it. The set ran 1-iron through 9-iron plus the two wedges stamped
  W and S (listed as PW and SW below). No lengths appear in the patent or any
  other primary source, so none are listed. The design was revised as the
  Karsten II in the early 1970s, with the III and IV following before the Eye
  replaced the family in 1978.
