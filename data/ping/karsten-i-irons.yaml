faq:
  - q: "What is the loft of a Ping Karsten I 7-iron?"
    a: "Per Karsten Solheim's 1969 patent table — the only primary spec source for the model — the 7-iron loft is 36 degrees 30 minutes (36.5 degrees) with a 63.3-degree lie. Ping never published a retail spec sheet, and the patent notes production lofts could vary slightly."
  - q: "When were Ping Karsten I irons made?"
    a: "The Karsten I launched in 1969 as Ping's first full iron line and ran into the early 1970s — a surviving set has a Ping build date of July 1971 — before being revised as the Karsten II. The Karsten family (I through IV) preceded the Ping Eye of 1978."
  - q: "Why are there no lengths listed for the Ping Karsten I?"
    a: "No primary source records them. The patent table behind this chart specifies only lofts and lies, and Ping's archived Classics spec pages never covered the Karsten series."
  - q: "What do the stampings on Karsten I irons mean?"
    a: "The earliest heads read KARSTEN MFG. CO. PHOENIX ARIZ. with PAT PEND; later heads add the KARSTEN I name, Ping's colour-dot lie code and the number of patent 3,655,188, the Solheim patent whose loft table is reproduced above. The wedges are stamped W and S rather than PW and SW."
