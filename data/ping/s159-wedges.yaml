faq:
  - q: "What lofts does the Ping s159 come in?"
    a: "46 to 62 degrees — 25 loft/grind combinations, including the 48-degree S added for gapping and the 62-degree T added at the request of Ping's tour players."
  - q: "What grinds does the Ping s159 offer?"
    a: "Six: the all-round S at every loft from 46 to 60, the high-bounce W (54-60), the Eye2 high-toe (54-60), the half-moon H (54-60), the low-bounce T (58-62) and the new wide low-bounce B (58-60)."
  - q: "Is the Ping s159 still sold?"
    a: "Yes — as of October 2026 it remains in Ping's catalogue alongside the 2026 S259 that succeeded it at the top of the line."
  - q: "What finishes does the s159 come in?"
    a: "Hydropearl 2.0 Chrome and Midnight, both available in all 25 loft/grind combinations."
