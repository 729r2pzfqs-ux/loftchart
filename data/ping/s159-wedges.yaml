description: >
  The s159 is Ping's 2024 tour wedge, announced on 13 February 2024 as the
  replacement for the Glide 4.0 and still in the catalogue alongside the
  2026 S259. It widened the line to 25 loft/grind combinations by adding
  the low-bounce B grind, a 48-degree S and a 62-degree T, and paired the
  launch with Ping's WebFit Wedge fitting app. The 46-52 heads are milled
  for maximum groove volume on full shots while the 54-62 heads carry
  tighter-spaced MicroMax grooves; both Hydropearl 2.0 Chrome and Midnight
  finishes are offered in every combination. Bounce figures below are
  Ping's published effective bounce.
grinds:
  - code: S
    name: S Grind
    description: >
      Fits a wide variety of conditions and techniques — ample mid-sole
      bounce for full shots with heel and trailing-edge relief for
      greenside versatility. The grind offered at every loft, including
      the new 48-degree gapping option.
  - code: W
    name: W Grind
    description: >
      Traditional full-sole, high-bounce design — the most forgiving
      through the turf and the pick for softer conditions and steeper
      swings.
  - code: Eye2
    name: Eye2 Grind
    description: >
      High-toe shape and dished sole inspired by the PING Eye2 sand wedge,
      long a tour favourite out of bunkers.
  - code: H
    name: H Grind
    description: >
      Half-moon grind for players with steeper angles of attack who like to
      manipulate the handle — a shot-saver that performs best in softer
      conditions.
  - code: T
    name: T Grind
    description: >
      The most versatile option for shot-making around the greens in medium
      to firm conditions, with a 62-degree loft added at the request of
      Ping's tour pros.
  - code: B
    name: B Grind
    description: >
      New for the s159 — a low-bounce, wide sole that sits low to the turf
      on square-face shots, for shallow attack angles and neutral face
      delivery in firmer conditions.
