sources:
  - "Ping's own Karsten product page, Specifications tab (http://web.archive.org/web/20140208032315/http://ping.com/clubs/ironsdetail.aspx?id=16428) — supplied every loft, length, offset, lie, bounce and swing weight above, the 3H/4H/5H hybrid specs (19, 22 and 25.5 degrees, D1), the KS 401 graphite (61-76g, SR/R/S) and CFS Distance steel (95-115g, SR/R/S/X) shaft tables, the 17-4 stainless construction and the note that iron lie angle is based on the black colour code in the standard-length CFS Distance steel shaft."
  - "qsponge.com 'What is loft angle of Ping 2014 Karsten Irons' and 2ndswing.com Ping 2014 Karsten Iron Set spec tables — independently reproduce the same rows (2nd Swing rounds the lies to the nearest half degree)."
