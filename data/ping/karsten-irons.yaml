description: >
  The 2014 Karsten revived the first name of Ping founder Karsten Solheim on a
  hybrid-iron combo set built for maximum height and distance. The heads have
  the longest heel-to-toe length Ping had produced to that point, with very
  wide soles, a deep centre of gravity and prominent offset, and the set
  replaces the long irons entirely: it starts at the 5-iron, with 19-, 22- and
  25.5-degree Karsten hybrids covering the 3H-5H slots above it. Lofts are
  distance-spec for 2014 — a 30.5-degree 7-iron and 45-degree pitching wedge —
  and Ping published the lie angles unrounded, as listed below. Ping's
  colour-code (dot) system sets lie angle relative to standard; the lies below
  are the BLACK (standard) lies. The GMax replaced it in Ping's
  game-improvement slot in 2015.
