faq:
  - q: "What is the loft of a Ping Karsten 7-iron?"
    a: "The 2014 Ping Karsten 7-iron has a loft of 30.5 degrees, a standard (black dot) lie of 61.88 degrees and a steel-shaft length of 37 inches."
  - q: "Why does the Ping Karsten set start at the 5-iron?"
    a: "The Karsten was sold as a hybrid-iron combo. Ping replaced the long irons with matching Karsten hybrids — 3H, 4H and 5H at 19, 22 and 25.5 degrees — above the 5-iron through sand wedge irons."
  - q: "Who is the Ping Karsten iron named after?"
    a: "Karsten Solheim, the founder of Ping. The 2014 model revived his first name for a modern, wide-soled distance iron rather than reissuing any classic Karsten-era head."
  - q: "When was the Ping Karsten iron made?"
    a: "It was introduced in 2014 and remained in the line until the GMax replaced it in 2015, though sets stayed at retail into 2016."
