description: >
  The i20 keeps the i15's loft, lie and length chart unchanged and reworks
  everything around it: a matte black finish, a slightly larger but thinner
  profile, and a sole that swaps the i15's negative long-iron bounce for a
  conventional progressive one running 4 degrees at the 3-iron to 14 at the
  sand wedge. Offset is cut throughout, from 0.26 to 0.24 inches at the 3-iron
  and 0.14 to 0.10 at the 7-iron. Lies below are the black (standard) code.
