faq:
  - q: "What is the loft of a Ping i20 7-iron?"
    a: "The Ping i20 7-iron has a loft of 33 degrees, a standard (black dot) lie of 62.25 degrees and a steel-shaft length of 36.75 inches."
  - q: "When were Ping i20 irons made?"
    a: "The i20 was the 2012 model in Ping's i-series, following the i15 and preceding the i25."
  - q: "Are Ping i15 and i20 lofts the same?"
    a: "Yes, club for club: 21, 24, 27, 30, 33, 37, 41 and 46 degrees from 3-iron to pitching wedge, at the same lies and lengths. The i20 carries less offset and a conventional positive-bounce sole where the i15 ran negative bounce in the long irons."
  - q: "How much offset does a Ping i20 7-iron have?"
    a: "0.10 inches, against 0.14 inches on the i15."
