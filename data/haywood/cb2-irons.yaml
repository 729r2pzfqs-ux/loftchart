faq:
  - q: "What is the loft of a Haywood CB2 7-iron?"
    a: "The Haywood CB2 7-iron has a loft of 34 degrees, with a 62-degree lie, a 37-inch length and 0.08 inches of offset."
  - q: "Did the lofts change from the Haywood CB to the CB2?"
    a: "No. The 4-iron through pitching wedge keep the same lofts, lies, lengths and offsets as the original CB, from a 23-degree 4-iron to a 46-degree pitching wedge. The CB2 chart adds a 50-degree approach wedge."
  - q: "Is the Haywood CB2 forged?"
    a: "Yes. Heads are forged from 1020 carbon steel and 100% CNC-milled, with a hidden undercut cavity added for stability."
  - q: "Can the Haywood CB2 be combined with the MB2?"
    a: "Yes. The CB2 and MB2 share the same lofts, lies and lengths club-for-club, and Haywood sells a CB2 + MB2 combo set."
