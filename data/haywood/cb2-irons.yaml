description: >
  The CB2 is the second generation of Haywood's forged players cavity back,
  published on the Vancouver direct-to-consumer brand's site on 24 July 2026
  alongside the MB2. Heads are forged from 1020 carbon steel and fully
  CNC-milled like the original CB, but add a hidden undercut cavity that
  Haywood says makes this its most forgiving CB to date. The loft, lie, length
  and offset chart is unchanged from the original CB - a 34-degree 7-iron and
  46-degree pitching wedge - with a 50-degree approach wedge added to the
  published range, and it matches the MB2 club-for-club for combo sets. Built
  to order from Haywood's shaft menu rather than with a single stock shaft;
  swing weights are Haywood's figures for a 110-gram shaft at standard length.
