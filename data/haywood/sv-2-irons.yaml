description: >
  The SV.2 is the second generation of Haywood's Signature iron, the hollow
  game-improvement model in the Vancouver direct-to-consumer brand's range.
  It keeps a 431 stainless body but moves to a thinner S450 face, with 18
  grams of foam injected into the head for sound and feel and a fog silver
  finish. Lofts are strong, with a 29.5-degree 7-iron and 43-degree pitching
  wedge, and offset is progressive from 0.20 inches in the 4-iron to 0.06
  inches in the approach wedge. Haywood's store published the model on 10
  July 2024 together with the PD.1 players-distance iron. Built to order from
  Haywood's shaft menu; swing weights are Haywood's figures for a 110-gram
  shaft at standard length.
