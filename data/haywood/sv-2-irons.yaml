faq:
  - q: "What is the loft of a Haywood SV.2 7-iron?"
    a: "The Haywood SV.2 7-iron has a loft of 29.5 degrees, with a 63-degree lie, a 37-inch length and 0.13 inches of offset."
  - q: "How do the Haywood SV.2 lofts compare with the Signature?"
    a: "They are stronger through most of the set: the 4-iron goes from 20.5 to 19 degrees, the 7-iron from 30 to 29.5 and the pitching wedge from 44 to 43. Lies are half a degree more upright, and the SV.2 chart adds a 48-degree approach wedge."
  - q: "Is the Haywood SV.2 forged?"
    a: "No. It is a hollow game-improvement iron with a 431 stainless steel body, an S450 steel face and 18 grams of injected foam. Haywood's forged models are the CB2 and MB2."
