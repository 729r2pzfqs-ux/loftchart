description: >
  The Haywood CB is the Canadian direct-to-consumer brand's forged cavity
  back, announced on 2 November 2021 alongside the second-generation MB as the
  "2022 Haywood CB & MB". Heads are forged from 1020 carbon steel and then
  fully CNC-milled to final spec, which Haywood credits with some of the
  tightest weight tolerances in the industry. Perimeter weighting and a
  slightly wider sole than the MB add forgiveness while sharing the MB's
  traditional loft ladder - a 34-degree 7-iron and 46-degree pitching wedge -
  so the two blend cleanly into combo sets. Sold 4-PW, built to order with
  Haywood's shaft menu rather than a single stock shaft. Swing weights below
  are from the launch spec sheet; Haywood's current chart restates them as
  D1/D2 for a 110-gram shaft build.
