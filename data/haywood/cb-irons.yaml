faq:
  - q: "What is the loft of a Haywood CB 7-iron?"
    a: "The Haywood CB 7-iron has a loft of 34 degrees, with a 62-degree lie, 37-inch length and 0.08 inches of offset."
  - q: "Is the Haywood CB forged or cast?"
    a: "Forged. Heads are forged from 1020 carbon steel and then 100% CNC-milled to final shape and weight."
  - q: "Can the Haywood CB be combined with the MB?"
    a: "Yes. The CB and MB share the same lofts, lies and lengths club-for-club, so Haywood sells them as CB/MB combo sets - typically CB long irons into MB short irons."
