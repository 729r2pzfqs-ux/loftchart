description: >
  The Haywood MB is the direct-to-consumer brand's forged muscle back,
  announced on 2 November 2021 alongside the CB as the "2022 Haywood CB & MB" -
  a redesigned second iteration of the original MB that Haywood had sold since
  2020. Heads are forged from 1020 carbon steel and 100% CNC-milled, with
  minimal offset, a thin topline and a narrow sole in the classic blade mould.
  Lofts are traditional - a 34-degree 7-iron and 46-degree pitching wedge -
  and match the CB club-for-club so the two blend into combo sets; the MB
  alone extends to a 20-degree 3-iron. Sold 3-PW and built to order from
  Haywood's shaft menu. Swing weights below are from Haywood's chart for a
  110-gram shaft at standard length.
