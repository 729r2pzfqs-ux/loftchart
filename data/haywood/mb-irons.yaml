faq:
  - q: "What is the loft of a Haywood MB 7-iron?"
    a: "The Haywood MB 7-iron has a loft of 34 degrees, with a 62-degree lie, 37-inch length and just 0.07 inches of offset."
  - q: "Is the Haywood MB a true blade?"
    a: "Yes. It is a forged 1020 carbon steel muscle back with a thin topline, narrow sole and minimal offset, CNC-milled to final spec after forging."
  - q: "How does the Haywood MB differ from the CB?"
    a: "The two share identical lofts, lies and lengths; the CB adds perimeter weighting and a slightly wider sole for forgiveness, while the MB is the full muscle back and is the only one offered in a 3-iron."
