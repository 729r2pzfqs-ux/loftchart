faq:
  - q: "What is the loft of a Haywood MB2 7-iron?"
    a: "The Haywood MB2 7-iron has a loft of 34 degrees, with a 62-degree lie, a 37-inch length and 0.07 inches of offset."
  - q: "Did the lofts change from the Haywood MB to the MB2?"
    a: "No. The 4-iron through pitching wedge keep the same lofts, lies, lengths and offsets as the previous MB. The MB2 chart adds a 50-degree approach wedge and no longer lists a 3-iron."
  - q: "How does the Haywood MB2 differ from the CB2?"
    a: "The two share identical lofts, lies and lengths. The MB2 is the muscle back, with a narrower 0.6-inch sole and 0.01 inches less offset per club; the CB2 adds a hidden undercut cavity and a 0.7-inch sole."
