description: >
  The MB2 is Haywood's forged muscle back, published on the Vancouver
  direct-to-consumer brand's site on 24 July 2026 alongside the CB2. Heads are
  forged from 1020 carbon steel and fully CNC-milled, with a new V-Sole for
  turf interaction, a thinner topline and a compact blade length. Lofts are
  traditional - a 34-degree 7-iron and 46-degree pitching wedge - and match
  the CB2 club-for-club for combo sets. The published chart runs 4-iron
  through a 50-degree approach wedge; unlike the previous MB it lists no
  3-iron. Built to order from Haywood's shaft menu; swing weights are
  Haywood's figures for a 110-gram shaft at standard length.
