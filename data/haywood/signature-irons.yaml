faq:
  - q: "What is the loft of a Haywood Signature 7-iron?"
    a: "The Haywood Signature 7-iron has a loft of 30 degrees, with a 62.5-degree lie, 37-inch length and 0.13 inches of offset."
  - q: "Is the Haywood Signature forged?"
    a: "No. It is a two-piece hollow-body iron - a cast 431 stainless steel body welded to a heat-treated 17-4 stainless steel face. Haywood's forged models are the CB and MB."
  - q: "When was the Haywood Signature sold?"
    a: "It launched Haywood's iron line in 2020 and remained the brand's game-improvement-leaning distance iron until the SV.2 replaced it in 2025."
