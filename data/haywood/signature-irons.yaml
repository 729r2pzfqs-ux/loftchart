description: >
  The Signature Series was Haywood Golf's first iron - the hollow-body model
  that launched the Vancouver direct-to-consumer brand's club line. A 431
  stainless body is welded to a heat-treated 17-4 stainless face, giving a
  high-launching, distance-first head with generous progressive offset behind
  a fairly clean topline. It was on sale by mid-2020 and stayed in the line
  until the SV.2 replaced it in 2025. Lofts are strong, with a 30-degree
  7-iron and 44-degree pitching wedge. The specs below are Haywood's revised
  2022 chart; at launch the published lengths ran a quarter-inch longer in
  4-iron through 9-iron (38.75 to 36.25 inches) with the same lofts, lies and
  offsets, and launch-era swing weights were listed one point heavier at
  D2/D3.
