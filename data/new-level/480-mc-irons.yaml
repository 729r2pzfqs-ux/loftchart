description: >
  The 480-MC (Muscle Cavity) was the compact players iron of New Level's 2024
  480 series, forged from 1020 carbon steel with a weight port centred
  directly behind the hitting area — there for the company's builders to
  control finished swing weight, not for the player to adjust. The profile is
  the smallest of the three 480 models, with a short heel-to-toe length, thin
  topline and narrow sole, and the lofts are strikingly traditional: a
  35-degree 7-iron and 47-degree pitching wedge, weaker at the 4-iron than a
  TaylorMade P7MB. It reached retail in February 2024, two months before the
  480-TC and 480-DB, sold right-handed only, direct and through fitters at
  about $149 a club and built to order from New Level's shaft menu, so no
  stock shaft or swing weight is recorded. New Level began selling the 480
  series off in March 2025 as the 702 line took over; no 702 model maps
  directly onto the MC's compact muscle-cavity slot.
