faq:
  - q: "What is the loft of a New Level 480-MC 7-iron?"
    a: "The New Level 480-MC 7-iron has a loft of 35 degrees, a lie of 62 degrees and a length of 37 inches."
  - q: "Can the weight port in the 480-MC be adjusted by the player?"
    a: "No. The centred weight port exists so New Level's builders can set the finished swing weight during assembly; the company states changing it has minimal effect on launch and spin and that it is not intended to be changed by the player."
  - q: "When was the New Level 480-MC made?"
    a: "It reached retail in February 2024, ahead of the 480-TC and 480-DB, and was sold off from March 2025 when the 702 series replaced the 480 line."
