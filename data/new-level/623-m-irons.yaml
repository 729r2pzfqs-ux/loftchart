description: >
  The 623-M was the tour iron of New Level's early lineup — the model founder Eric
  Burch cites as the company's first iron played on professional tours — and it was
  in reviewers' hands by December 2018. The head is a compact muscle design forged
  from 1020 carbon steel and CNC milled after forging, with a thin topline, minimal
  offset, a slightly wider-than-average sole and a milled tuning slot in the muscle
  that lowers the centre of gravity for more launch than a conventional blade.
  Lofts are traditional: a 33-degree 7-iron and a 45-degree pitching wedge across
  the stock 4-PW composition. New Level sells direct and through fitters and builds
  every set to order from a large shaft menu, so no stock shaft is recorded. The
  standard model left the range as the 702 series took over in 2025; a matte-black
  623-M "Dead Golfer Edition", a 2023 collaboration with TRUE Linkswear built to
  these same standard specs, remained on newlevelgolf.com after the standard
  chrome model was gone.
