sources:
  - "New Level Golf official 623-M Dead Golfer Edition product page (newlevelgolf.com/products/dead-golfer-iron-set) — full manufacturer spec table for 4-PW (loft, lie, offset, bounce, length, 1020 CS material). The page states the edition is 'built to standard loft and lie specs', i.e. these are the standard 623-M numbers. Offsets are published in millimetres (2.8 down to 1.9) and converted to inches here."
  - "2nd Swing Golf spec table for the New Level 623 Forged (623-M) iron set (2ndswing.com/golf-clubs/iron-sets/new-level-623-forged-iron-set) — identical loft/lie/length/offset/bounce table for the standard chrome model, corroborating the manufacturer page, plus the 1020 carbon steel forging, thin topline and milled tuning slot copy."
  - "GolfWRX forum review 'New Level Golf 623 M Forged Iron Review' as republished by fogolf.com, dated 11 December 2018 — establishes the model was at retail by late 2018, which is why year_introduced reads 2018."
  - "Note: year_discontinued 2025 is inferred — the 702-MB announced in 2025 took the muscle-back slot and the standard 623-M no longer appears on newlevelgolf.com as of July 2026; New Level publishes no discontinuation dates. No stock shaft or swing weight is recorded because New Level builds every set to order from its shaft menu."
