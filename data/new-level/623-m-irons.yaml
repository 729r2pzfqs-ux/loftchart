faq:
  - q: "What is the loft of a New Level 623-M 7-iron?"
    a: "The New Level 623-M 7-iron has a loft of 33 degrees, a lie of 62 degrees and a length of 37 inches."
  - q: "Is the New Level 623-M a blade?"
    a: "Nearly — it is a compact forged muscle back with a thin topline and minimal offset, but a milled tuning slot in the muscle and a slightly wider sole lower the centre of gravity, so it launches higher and plays a touch more forgiving than a conventional blade."
  - q: "What is the 623-M Dead Golfer Edition?"
    a: "A 2023 limited collaboration with TRUE Linkswear: the same 623-M head in a matte black finish, built only to the standard loft and lie specs listed here because bending the finished head would blemish the coating."
