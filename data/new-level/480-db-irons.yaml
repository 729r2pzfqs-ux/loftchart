faq:
  - q: "What is the loft of a New Level 480-DB 7-iron?"
    a: "The New Level 480-DB 7-iron has a loft of 33 degrees, a lie of 62 degrees and a length of 37 inches."
  - q: "How does the 480-DB differ from the 902-OS it replaced?"
    a: "The 480-DB is slightly larger than the 480-TC but carries weaker lofts and less offset than the 902-OS, with an enhanced cavity and angled weight port; New Level reported only minimal distance and ball-speed loss in testing despite the weaker lofts."
  - q: "When was the New Level 480-DB made?"
    a: "It reached retail in April 2024 and was sold off from March 2025 as the 702 series replaced the 480 line; New Level names it among the 702+'s previous models."
