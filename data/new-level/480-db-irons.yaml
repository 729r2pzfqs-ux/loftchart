description: >
  The 480-DB (Dynamic Balance) was the largest model in New Level's 2024 480
  series, the company's replacement for the long-running 902-OS. Rather than
  enlarging that head further, New Level gave the 480-DB an enhanced cavity
  with the series' angled weight port, reduced the offset and weakened the
  lofts relative to the 902-OS — a 33-degree 7-iron and 45-degree pitching
  wedge — while reporting minimal loss of ball speed in testing, and kept a
  thin topline and player-style sole on the slightly larger platform. The
  one-piece head is forged from 1020 carbon steel in satin chrome. It reached
  retail in April 2024, right-handed only, sold direct and through fitters at
  about $149 a club and built to order from New Level's shaft menu, so no
  stock shaft or swing weight is recorded. New Level began selling the 480
  series off in March 2025 as the 702 line took over, and the company's 702+
  page names the 480-DB among its previous models.
