sources:
  - "phil-mickelson.com 'New Level 623-CB Review' — reproduces New Level's spec table in the manufacturer's house format (loft, lie, offset in mm, bounce, length, '1020 CS' material, satin chrome finish) for 4-PW; the lie and length ladders are identical to the ones New Level itself publishes for the 623-M, which is why the table is treated as the manufacturer chart. Offsets 2.8 mm down to 2.0 mm converted to inches here. Confidence is medium because New Level's own 623-CB page is no longer live to verify against."
  - "progolfadvisor.com 'New Level 623 CB Review' (April 2023) — corroborates every 4-PW loft (24 through 46 degrees) and the 1020 forging. Its lie/length columns run half a degree flatter and a quarter inch off the manufacturer ladder and it adds 2-iron (19 degrees) and 3-iron (21 degrees) build-to-order options; the manufacturer-format table is preferred where they disagree."
  - "New Level Golf Co. on X/Twitter, late October 2021: 'All-new, 623-CB Forged irons. Coming in January 2022.' — the announcement (2021) and retail (January 2022) dates."
  - "mygolfspy.com 2022 Most Wanted testing — the 623-CB placed first overall among player's irons ('Best Player's Iron 2022')."
  - "Note: year_discontinued 2025 is inferred — the 702-CB announced in 2025 occupies the slot and the 623-CB no longer appears on newlevelgolf.com as of July 2026. No stock shaft or swing weight is recorded because New Level builds every set to order."
