faq:
  - q: "What is the loft of a New Level 623-CB 7-iron?"
    a: "The New Level 623-CB 7-iron has a loft of 34 degrees, a lie of 62 degrees and a length of 37 inches."
  - q: "How does the 623-CB differ from the 623-M?"
    a: "Same compact 623 shaping, thin topline and lie/length ladder, but the CB is a cavity back rather than a muscle back and its lofts are one degree weaker at every club — 34 versus 33 degrees at the 7-iron — trading a little flight for stability."
  - q: "When did the New Level 623-CB come out?"
    a: "New Level announced it in late October 2021 and it reached retail in January 2022. It went on to win MyGolfSpy's 2022 Most Wanted player's-iron test."
