description: >
  The 623-CB is the cavity-back companion to New Level's 623-M muscle iron, teased
  by the company in late October 2021 and at retail from January 2022 — record the
  announcement year, 2021, against the 2022 retail date. It keeps the 623 family's
  compact shape, thin topline and minimal offset but swaps the muscle for a forged
  cavity, adding stability for what New Level pitches as a player's iron with a
  little help. Lofts sit one degree weaker than the 623-M throughout: a 34-degree
  7-iron and 46-degree pitching wedge across the stock 4-PW run, with 2- and
  3-irons offered to order. The model's profile rose sharply when it finished
  first overall in MyGolfSpy's 2022 Most Wanted player's-iron test. New Level
  sells direct and through fitters and builds each set to order from its shaft
  menu, so no stock shaft is recorded; the 702-CB took over the cavity-back slot
  when the 702 series arrived in 2025.
