faq:
  - q: "What is the loft of a New Level 702+ 7-iron?"
    a: "The New Level 702+ 7-iron has a loft of 33 degrees, a lie of 62 degrees and a length of 37 inches — the same ladder as the 702-CB and 702-MB."
  - q: "How does the 702+ differ from the 702-CB?"
    a: "Same lofts, lies and lengths, but the 702+ head is slightly larger with substantially more offset in the 4- through 6-irons — 5.5 mm at the 4-iron against the CB's 2.8 — trading a little compactness for forgiveness and launch."
  - q: "What did the New Level 702+ replace?"
    a: "New Level's own comparison chart names the 902-OS and the 480-DB as the previous models in its slot; the 702 series succeeded the 480 line in 2025."
