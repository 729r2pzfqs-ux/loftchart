description: >
  The 702+ is the largest and most forgiving model in New Level's 702 series,
  a players-distance iron whose launch coverage ran in late January 2025 —
  New Level's own comparison chart names the 902-OS and 480-DB as its
  previous models. The midsize head is forged in one piece from 1020 carbon
  steel with the series' SPT (Strategically Placed Tungsten) toe plug and a
  thin topline and sole, and it carries substantially more offset than the
  702-CB and 702-MB in the 4- through 6-irons while sharing their exact loft,
  lie and length ladder — a 33-degree 7-iron and 45-degree pitching wedge
  over the 4-PW run — so the three blend into combo sets. The shared lofts
  are stronger than New Level's previous models but still about three
  degrees weaker than a TaylorMade P790, in keeping with the company's
  launch-it-properly philosophy. Sold direct and through fitters at about
  $150 a club, right-handed, built to order from New Level's shaft menu with
  no stock shaft or swing weight by design.
