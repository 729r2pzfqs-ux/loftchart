description: >
  The 1031 Forged was the more forgiving half of New Level Golf's 2018
  launch lineup, sold alongside the compact 902 by the direct-to-consumer
  maker Eric Burch founded in Scottsdale, Arizona. The mid-size head is
  forged from 1020 carbon steel and carries noticeably more offset than
  the 902 — a near-constant 4.8 mm across the set against the 902's
  taper from 3.5 to 2 mm — with slightly stronger long-iron lofts (22
  degrees at the 4-iron) that converge on the same 32-degree 7-iron
  before finishing at a 44-degree pitching wedge. Hooked On Golf Blog
  reviewed the set in August 2018, its first season. The chart runs 4-PW,
  right hand only, in chrome; New Level assembled every set to order from
  its shaft menu, so no stock shaft or swing weight is recorded. The
  model left the range as New Level rebuilt its iron line around the
  902-PD/902-OS generation in 2021, and its factory spec sheet now sits
  on the company's Archives page.
