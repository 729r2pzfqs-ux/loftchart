sources:
  - "New Level Golf official 1031 club spec sheet (newlevelgolf.com/cdn/shop/files/1031_Club_Specs.png, linked from the manufacturer's 'The NL Archives' club spec history page at newlevelgolf.com/pages/the-nl-archives, retrieved July 2026) — loft, lie, offset in mm (4.8 on every club except 4.5 at the 8-iron, converted to inches here and reproduced as printed), bounce, length, .370 hosel bore and chrome finish for 4-iron through PW, right hand only, with the footnote that New Level has no stock club configuration and therefore no stock swing weights. The sheet is headed '2018', which fixes year_introduced."
  - "Hooked On Golf Blog 'Review: New Level Golf 1031 Forged Irons', 6 August 2018 — confirms the model was on the market in 2018 and corroborates the forged 1020 carbon steel mid-size head aimed at players wanting more forgiveness than the 902."
  - "year_discontinued 2021 is recorded on the same basis as the 902: New Level's iron range was rebuilt around the 902-PD and 902-OS that year, the 1031 product page is gone from newlevelgolf.com, and its spec sheet sits on the Archives ('specs of our previous generations') page. No direct successor was named, so the successor field is null."
faq:
  - q: "What is the loft of a New Level 1031 7-iron?"
    a: "The New Level 1031 7-iron has a loft of 32 degrees, with a 61.5-degree lie, 4.8 mm of offset and a 37-inch length."
  - q: "What is the difference between the New Level 1031 and the 902?"
    a: "Both launched in 2018 with a 32-degree 7-iron, but the 1031 is the friendlier head: a mid-size profile forged from 1020 carbon steel with roughly twice the offset of the compact 902, and a 44-degree pitching wedge to the 902's 45."
  - q: "Is the New Level 1031 forged?"
    a: "Yes. The head is forged from 1020 carbon steel; New Level positioned it as a forged iron with game-improvement levels of help."
  - q: "Is the New Level 1031 still in production?"
    a: "No. It left the line around New Level's 2021 range refresh, and its spec sheet now lives on the company's Archives page."
