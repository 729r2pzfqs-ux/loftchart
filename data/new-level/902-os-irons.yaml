description: >
  The 902-OS Forged was the oversized players-distance model from New Level Golf, the
  direct-to-consumer maker in Scottsdale, Arizona, built as a larger heel-to-toe version of
  its original 902 Forged iron for players wanting the balance between a player's iron and
  forgiveness. The head is one-piece forged carbon steel — 1020 on New Level's
  own per-club spec table, though retail copy says soft 1025 — and
  carries a removable precision-weighting screw in the back of the iron that New Level's
  builders use to control swing weight - the company publishes no stock swing weights because
  it has no stock configuration, and every set is assembled to order from a shaft menu
  (KBS Tour Lite, KBS Tour, Nippon Modus and True Temper Dynamic Gold options among others)
  rather than with a single stock shaft. Lofts are moderately strong for the category, with a
  31-degree 7-iron and 43-degree pitching wedge, and heads ran 4-iron through a 47-degree
  approach wedge at about $130 per club. It placed 3rd overall in MyGolfSpy's 2023 players
  distance iron test, tying as best for feel. New Level marketed it as a brand-new offering
  for 2022; the model was retired around the launch of the 2025 702 series, after which its
  spec sheet moved to New Level's Archives page with only leftover left-handed stock listed.
