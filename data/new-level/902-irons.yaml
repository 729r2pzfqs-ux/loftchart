sources:
  - "New Level Golf official 902 club spec sheet (newlevelgolf.com/cdn/shop/files/902_Club_Specs.png, linked from the manufacturer's 'The NL Archives' club spec history page at newlevelgolf.com/pages/the-nl-archives, retrieved July 2026) — loft, lie, offset in mm (3.5/3/3/2.5/2.5/2/2, converted to inches here), bounce, length, .370 hosel bore and chrome finish for 4-iron through PW, right hand only, with the footnote that New Level has no stock club configuration and therefore no stock swing weights. The sheet is headed '2018', which fixes year_introduced."
  - "newlevelgolf.com 902 product copy (retail listings and archived captures) — forged from 1025 carbon steel, hollow body design to maximise forgiveness and launch, and CNC milling to final state for superior club-to-club quality; The Hackers Paradise forum long-term test thread 'New Level Golf - 902 Forged Irons' corroborates the 2018 launch window."
  - "year_discontinued 2021 is the introduction of the 902-PD Forged, which New Level's copy describes as the enhanced sequel to the original 902 Forged; the 902 page is gone from newlevelgolf.com and its spec sheet sits on the company's Archives ('specs of our previous generations') page."
faq:
  - q: "What is the loft of a New Level 902 7-iron?"
    a: "The New Level 902 7-iron has a loft of 32 degrees, with a 62-degree lie, 2.5 mm of offset and a 37-inch length."
  - q: "Is the New Level 902 forged?"
    a: "Yes — forged from 1025 carbon steel and then CNC-milled to its final state, with a hollow body for launch and forgiveness."
  - q: "What replaced the New Level 902?"
    a: "The 902-PD Forged of 2021, a hollow-body sequel with the same 32-degree 7-iron loft, sold alongside the larger 902-OS."
  - q: "Did the New Level 902 come in left hand?"
    a: "No. The factory spec sheet lists the 902 as right hand only, in chrome."
