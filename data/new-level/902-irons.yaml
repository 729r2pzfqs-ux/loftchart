description: >
  The 902 Forged was the iron that launched New Level Golf, the
  direct-to-consumer maker founded in Scottsdale, Arizona in 2018 by
  longtime club builder Eric Burch. The head is forged from 1025 carbon
  steel, then CNC-milled to its final state for club-to-club consistency,
  and carries a hollow-body design to lift launch and forgiveness while
  presenting a compact players profile. Lofts are traditional for the
  class — a 32-degree 7-iron and 45-degree pitching wedge across a 4-PW,
  right-hand-only chart in chrome — with modest offset that tapers from
  3.5 mm at the 4-iron to 2 mm in the scoring clubs. New Level's own spec
  sheet is headed 2018, and the company built every set to order from its
  shaft menu, so no stock shaft or swing weight is recorded. The 902-PD
  Forged of 2021 was built as its enhanced sequel, and the original's
  spec sheet now sits on New Level's Archives page.
