description: >
  The 702-MB is the muscleback of New Level's 702 series, the generation that
  replaced the 623 and 480 lines when launch coverage ran in late January
  2025 — New Level's own comparison chart names the 623-M and 623-MB as its
  previous models. The compact blade is forged in one piece from 1020 carbon
  steel with the series' SPT (Strategically Placed Tungsten) plug in the toe,
  a roughly 20-gram weight that balances the centre of gravity for neutral
  face control, and a blunted leading-edge bevel that works like bounce
  through the turf. Unusually for a blade, New Level publishes the same
  offset and bounce ladder as the 702-CB — the two share one chassis — and
  all three 702 models carry identical lofts, a 33-degree 7-iron and
  45-degree pitching wedge over the 4-PW run, so they blend into combo sets.
  Sold direct and through fitters at about $150 a club, right-handed, built
  to order from New Level's shaft menu with no stock shaft or swing weight
  by design.
