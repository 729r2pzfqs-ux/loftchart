faq:
  - q: "What is the loft of a New Level 702-MB 7-iron?"
    a: "The New Level 702-MB 7-iron has a loft of 33 degrees, a lie of 62 degrees and a length of 37 inches — identical to the 702-CB and 702+, since all three share one ladder."
  - q: "Is the New Level 702-MB a true blade?"
    a: "It is a compact muscleback, but with the series' tungsten toe plug forged into the one-piece 1020 head for balance, and it carries the same published offset and bounce ladder as the 702-CB."
  - q: "What did the 702-MB replace?"
    a: "New Level's own comparison chart names the 623-M and 623-MB musclebacks as its previous models; the 702 series as a whole succeeded the 623 and 480 lines in 2025."
