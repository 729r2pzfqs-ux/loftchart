description: >
  The 702-CB is the players cavity back of New Level's 702 series, the
  generation that replaced the 480 line — launch coverage ran in late January
  2025, with the company comparing it directly to its own 480-TC, 623-CB and
  PF-2. Each head is forged in one piece from 1020 carbon steel and carries
  New Level's SPT (Strategically Placed Tungsten) plug in the toe, a roughly
  20-gram weight that balances the centre of gravity behind the face and
  steadies toe strikes, while a shallow undercut cavity moves mass to the
  perimeter. Lofts are one degree stronger than the 623-CB it displaced — a
  33-degree 7-iron and 45-degree pitching wedge over the 4-PW run — and all
  three 702 models share one ladder so they combine into combo sets. Sold
  direct and through fitters at about $150 a club, built to order from New
  Level's shaft menu in right- or left-handed, with no stock shaft or swing
  weight by design.
