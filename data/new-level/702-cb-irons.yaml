faq:
  - q: "What is the loft of a New Level 702-CB 7-iron?"
    a: "The New Level 702-CB 7-iron has a loft of 33 degrees, a lie of 62 degrees and a length of 37 inches."
  - q: "Can the 702-CB be mixed with the 702-MB and 702+?"
    a: "Yes. All three 702 models share the same loft, lie and length ladder, so they combine into combo sets without bending — New Level designed the series around it."
  - q: "What replaced the New Level 480-TC and 623-CB?"
    a: "The 702-CB. New Level's own comparison chart names the PF-2, 623-CB and 480-TC as the previous models in its slot, with the 702-CB running one degree stronger lofts than the 623-CB."
  - q: "What is SPT in New Level 702 irons?"
    a: "Strategically Placed Tungsten — a roughly 20-gram tungsten plug in the toe that centres the balance of the head behind the strike and keeps ball speed up on toe hits."
