description: >
  The 480-TC (Tour Cavity) led New Level's 2024 480 series, built on the
  platform of the award-winning 623-CB with a weight port machined into the
  cavity at an angle, bringing mass closer to the face to enlarge the sweet
  spot while leaving the builder perimeter-weighted balance control. The head
  is forged from 1020 carbon steel in satin chrome. Lofts are traditional
  players spec — a 34-degree 7-iron and 46-degree pitching wedge over the
  4-PW run, matching the 623-CB ladder — with modest offset and a low-bounce
  sole. It reached retail in April 2024 in right- and left-handed builds,
  sold direct and through fitters at about $149 a club and built to order
  from New Level's shaft menu, so no stock shaft or swing weight is recorded.
  New Level began selling the 480 series off in March 2025 as the 702 line
  took over, and the company's 702-CB page names the 480-TC among its
  previous models.
