faq:
  - q: "What is the loft of a New Level 480-TC 7-iron?"
    a: "The New Level 480-TC 7-iron has a loft of 34 degrees, a lie of 62 degrees and a length of 37 inches."
  - q: "What does TC stand for in the New Level 480-TC?"
    a: "Tour Cavity. The model took the 623-CB's platform and added a weight port machined into the cavity at an angle, moving mass closer to the face for a larger effective sweet spot."
  - q: "When was the New Level 480-TC made?"
    a: "It reached retail in April 2024 and was sold off from March 2025 as the 702 series replaced the 480 line; New Level names it among the 702-CB's previous models."
