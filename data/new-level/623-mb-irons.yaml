description: >
  The 623-MB is the compact muscle-back at the top of New Level's original
  623 family, aimed at elite amateurs and professionals rather than the
  wider-market 623-M. New Level teased the 623 line in late October 2021
  with a January 2022 retail date — the same announcement that introduced
  the 623-CB — and pitched the MB as a true player's iron: a traditional
  muscle-back shape with a thin topline, narrow sole and minimal offset for
  precise turf interaction and full workability, built from forged 1025
  carbon steel for a soft, forged feel. New Level's retail spec chart lists
  the 623-MB on the same loft, lie and bounce ladder as the 623-CB — a
  34-degree 7-iron and 46-degree pitching wedge across the stock 4-PW run —
  so the MB and CB share one set of numbers and are differentiated by head
  shape rather than loft, while the 623-M runs one degree weaker throughout.
  Sold right- and left-handed, built to order from New Level's shaft menu, so
  no stock shaft is recorded. It left the range when the 702 series,
  including a direct 702-MB successor, arrived in 2025.
