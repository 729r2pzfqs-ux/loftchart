faq:
  - q: "What is the loft of a New Level 623-MB 7-iron?"
    a: "The New Level 623-MB 7-iron has a loft of 34 degrees, a lie of 62 degrees and a length of 37 inches — the same numbers as the 623-CB."
  - q: "How does the 623-MB differ from the 623-CB and 623-M?"
    a: "The MB and CB share an identical loft, lie, offset and bounce ladder and are differentiated by head shape: the MB is a compact muscle-back for elite ball-strikers, the CB a cavity-back with a little more forgiveness. The 623-M sits one degree weaker throughout and is New Level's own description of a 'nearly a blade' muscle iron for a broader market."
  - q: "When did the New Level 623-MB come out?"
    a: "New Level announced the 623 family in late October 2021, with the 623-MB and 623-CB reaching retail together in January 2022. It was discontinued when the 702 series, including a 702-MB, arrived in 2025."
