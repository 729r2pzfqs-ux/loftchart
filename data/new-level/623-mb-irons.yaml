sources:
  - "2nd Swing Golf 'New Level 623-MB Forged Iron Set' spec table (2ndswing.com/golf-clubs/iron-sets/new-level-623-mb-forged-iron-set/) — the full manufacturer-format chart used here: 4-PW lofts 24/27/30/34/38/42/46 degrees, lies 60.5-63.5, offsets 2.8 down to 2.0 mm (converted to inches), bounces 0-5 degrees, lengths 38.5 down to 35.75 inches, right- and left-hand available. These figures are identical to this site's New Level 623-CB entry, which follows the same manufacturer-format retailer chart — consistent with New Level building the CB and MB off one shared loft/lie/bounce ladder and differentiating them by head shape and offset feel rather than by numbers."
  - "MyGolfSpy 'New Level Irons: Model By Model' — describes the 623-MB as a compact muscle-back with limited offset and a narrow sole for elite amateurs and professionals, dates its release to January 2022, and confirms a 4-PW, right-hand-only stock configuration (steel or graphite); other retailer listings (Golf Avenue) show left-hand availability as well."
  - "Retailer product copy (oldiegolf.com, golfavenue.com listings) — 'forged from 1025 carbon steel,' minimal offset, thin topline and narrow sole, and the true-player's-iron positioning against the more forgiving 623-CB."
  - "New Level Golf Co. on X/Twitter, late October 2021, announcing the 623 family (cited in this site's 623-CB entry) — the basis for year_introduced 2021 as the announcement year, against the January 2022 retail date."
  - "Note: year_discontinued 2025 is inferred, as with this site's other 623-series entries — newlevelgolf.com's current catalog (checked July 2026) lists only the 702 series (including a 702-MB) plus 623-M Dead Golfer Edition and 902/GI22 models; the standard 623-MB is no longer offered. No stock shaft or swing weight is recorded because New Level builds every set to order from its shaft menu."
