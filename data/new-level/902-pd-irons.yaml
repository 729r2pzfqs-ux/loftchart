  - "year_discontinued is recorded as 2025 on the same basis as the 902-OS: New Level's current range is the 702 and 480 series, the 902-PD product page has been removed from newlevelgolf.com (the URL now 404s), and the model's spec sheet sits on New Level's Archives ('specs of our previous generations') page. No direct successor was named, so the successor field is null"
faq:
  - q: "What is the loft of a New Level 902-PD 7-iron?"
    a: "The New Level 902-PD 7-iron has a loft of 32 degrees, with a 62-degree lie, 2.5 mm of offset and a 37-inch length."
  - q: "Is the New Level 902-PD a hollow-body iron?"
    a: "Yes. It is forged from 1025 carbon steel with a hollow body for launch and forgiveness — unlike its one-piece-forged stablemate, the 902-OS."
  - q: "How did the New Level 902-PD do in testing?"
    a: "It finished fifth overall in MyGolfSpy's 2022 Most Wanted players distance iron test and was ranked best in the category for forgiveness."
  - q: "Is the New Level 902-PD still in production?"
    a: "No. New Level replaced its iron range with the 702 series in 2025, removed the 902-PD product page and moved its spec sheet to the company's Archives page."
