description: >
  The 902-PD Forged was the hollow-body players-distance iron from New Level
  Golf, the direct-to-consumer maker in Scottsdale, Arizona, built as the
  sequel to the company's original 902 Forged with a progressive design —
  wider soles in the long irons, thinner toplines in the scoring clubs.
  The head is forged from 1025 carbon steel and hollow to raise launch and
  forgiveness, yet the lofts are traditional for the category: a 32-degree
  7-iron and a 44-degree pitching wedge across a 4-PW, right-hand-only chart.
  New Level's own spec sheet is headed 2021 and the model was in MyGolfSpy's
  2022 Most Wanted players distance test by early 2022, where it finished
  fifth overall and ranked best for forgiveness. Like the 902-OS it was
  retired around the launch of the 2025 702 series, its spec sheet moving to
  New Level's Archives page; every set was assembled to order from a shaft
  menu, so no stock shaft or swing weight is recorded.
