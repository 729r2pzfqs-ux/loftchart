sources:
  - "New Level Golf official 902-PD club spec sheet (newlevelgolf.com/cdn/shop/files/902-PD_Club_Specs.png, linked from the manufacturer's 'The NL Archives' club spec history page at newlevelgolf.com/pages/the-nl-archives, retrieved July 2026) — loft, lie, offset in mm (3.5/3/3/2.5/2.5/2/2, converted to inches here), bounce, length and .370 hosel bore for 4-iron through PW, right hand only in chrome, with the footnote that New Level has no stock club configuration and therefore no stock swing weights. The sheet is headed '2021', which fixes year_introduced"
