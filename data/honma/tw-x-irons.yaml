sources:
  - "Honma's own US product page 'T//World-X Irons' (us.honmagolf.com/products/t-world-x-irons, retrieved via Wayback Machine snapshot of 20 November 2019) — the full manufacturer spec table for clubs 3-11: every loft, lie, offset (3.6 down to 2.4 mm, converted to inches) and length recorded here, plus swing weights (Vizard D0-D1, Modus3 R D1-D2) and the Vizard for 747 85 / Modus3 shaft matrix. MATERIAL CONFLICT NOTE: the head row of that spec table reads 'SUS 630 (body) / HMT titanium (face)', which contradicts the same page's own feature copy and all press coverage ('forged 25C body with high-strength MS300 forged face'); the S25C/MS300 description is recorded here as it is corroborated by Golf Digest's interview with Honma's VP of product."
  - "Golf Digest, 'Honma T//World-X irons bring Justin Rose's utility irons to the rest of the set' (5 June 2019, Mike Stachura) — the 18-degree 3-iron through 49-degree 11, the 4-10 and 5-11 retail configurations, the S25C forged body with lightly welded then co-forged MS300 face and plasma-welded back, the two internal heel/toe steel weights, the near-constant wide cambered sole, the Modus3 105 standard steel shaft, the June 17 2019 retail date and $175/$200 per-club pricing, and the players-distance positioning."
  - "Year note: year_discontinued 2021 reflects Honma's 'TW-X 2021' (honmagolf.com/int/product-details/8928), a refreshed model that replaced this original within the 2021 T//World lineup."
