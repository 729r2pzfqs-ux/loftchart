description: >
  The T//World-X (TW-X) grew out of the TW-U utility iron that Justin Rose and
  other tour players carried as a driving iron: for June 2019 Honma extended the
  forged hollow-body, muscleback-look construction into a full set within the
  T//World 747 lineup. An S25C forged body carries a co-forged MS300
  high-strength steel face plate and two internal steel weights in the heel and
  toe, and every head keeps a near-constant wide, cambered sole for a low, deep
  centre of gravity. Honma numbers the scoring clubs — the 44-degree 10 is the
  pitching wedge and the 49-degree 11 the gap wedge — and sold the set in 4-10
  and 5-11 configurations at $175 per club in steel, with the long irons also
  available individually as utilities. Lengths below are the Vizard graphite
  build; Modus3 steel builds used the same lengths from the 4-iron down.
