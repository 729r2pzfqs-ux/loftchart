faq:
  - q: "What is the loft of a Honma TW-X 7-iron?"
    a: "The Honma TW-X 7-iron has a loft of 31 degrees, a lie of 62.5 degrees and a length of 37 inches."
  - q: "How is the Honma TW-X related to Justin Rose?"
    a: "The set grew out of the TW-U utility iron Rose carried on the PGA Tour — he used one as his 2-iron when winning the 2019 Farmers Insurance Open. Honma extended that forged hollow-body construction into the full TW-X set launched in June 2019."
  - q: "What set configurations did the Honma TW-X come in?"
    a: "Two stock configurations: 4-iron through the 10 (pitching wedge), or 5-iron through the 11 (49-degree gap wedge). The 2, 3, 4 and 5 irons were also sold individually as utility irons."
