description: >
  The eighth-generation Beres is Honma's ultra-premium lightweight line, built in
  Sakata for golfers with moderate swing speeds who pay for hand-finished
  craftsmanship: a forged mild-steel body carries a cast AM355P face in a 3D
  L-Cup structure with inside and outside sole slots in the 5- through 9-irons,
  and an ES235 rolled face in the scoring clubs. Lofts are strong for the
  category (27-degree 7-iron) because the deep, low centre of gravity is tuned
  to launch high anyway. Stock shafts are Honma's hand-rolled ARMRQ MX graphite
  in ascending 2-Star to 5-Star grades at very light C9-D0 swing weights, with
  matching grades of finish and price. Honma numbers the scoring clubs: the
  40-degree 10 is the pitching wedge and the 45-degree 11 the gap wedge, ahead
  of 50-degree AW and 55-degree SW.
