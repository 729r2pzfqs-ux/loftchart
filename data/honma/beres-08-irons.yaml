faq:
  - q: "What is the loft of a Honma Beres 08 7-iron?"
    a: "The Honma Beres 08 7-iron has a loft of 27 degrees, a lie of 62 degrees and a length of 37.25 inches — strong lofts that the deep, low centre of gravity is designed to launch high despite the number."
  - q: "What do the star ratings on Honma Beres 08 clubs mean?"
    a: "The 2-Star through 5-Star grades refer to the ARMRQ MX shaft and finish level: higher star counts get more advanced shaft layups (M40X and T1100G plies, lower torque) and more elaborate plating and gold detailing, at sharply higher prices. The head specifications are the same."
  - q: "Who are Honma Beres 08 irons for?"
    a: "Golfers with moderate swing speeds who struggle to accelerate a standard-weight club: the ARMRQ MX graphite builds run very light C9-D0 swing weights so the club is easy to swing fast, wrapped in hand-finished Sakata craftsmanship."
