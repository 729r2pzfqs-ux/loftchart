sources:
  - "Honma's Beres 08 specification table as reproduced on Golfio's 'HONMA Beres 08 Black Iron Set' product page — every loft, lie, length and offset recorded here (offsets 4.0/3.7/3.5/3.0/2.0 mm converted to inches; the lie and offset columns use merged cells, read here as 63.0 degrees for the 9 through AW and 3.5 mm for the 7 through 10, matching the identically structured table on Honma's own Beres 09 page), plus the forged mild-steel body with AM355P cast face (5-9) and ES235 rolled face (10-SW), the ARMRQ MX shaft matrix at C9-D0 swing weights and the GR Honma Rubber 41 grip. The Black edition shares the standard 08 head; Amazon 'Beres 08 Aizu' listings corroborate the 5-11/AW/SW set makeup and 27-degree, 37.25-inch 7-iron."
  - "Confidence note: medium because the manufacturer table was retrieved via a retailer reproduction (the standard 08 page is no longer live on Honma's international site) — every value is Honma's own published spec, and the chart is identical to the Beres 09 table on Honma's live site, but the standard-model page itself could not be archived."
  - "Year note: the Beres 08 generation was announced in 2021 on Honma's roughly two-year Beres cycle (07 in 2019, 09 in 2023); year_discontinued 2023 is the Beres 09 announcement. The Aizu and Black limited editions (2022) use the same head specifications."
