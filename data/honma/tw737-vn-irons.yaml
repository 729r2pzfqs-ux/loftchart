description: >
  The Vn is the near-blade head of Honma's 2016 Tour World 737 range: a forged
  mild-steel muscle-back-leaning shape aimed at better players who want a
  compact, workable look, but with the weakest lofts of the three 737 heads
  (34-degree 7-iron, versus 32 for the V and 30 for the Vs) to keep flight
  height and forgiveness in check for that shape. The set runs 3 through 10 —
  Honma numbers the pitching wedge as the 10-iron at 46 degrees. Lengths below
  are the Dynamic Gold steel build; Vizard IB95 graphite builds ran 0.375 inch
  longer. Honma did not carry the Vn head forward into the TW747 range, which
  shipped only V, Vx and P heads.
