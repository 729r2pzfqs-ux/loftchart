faq:
  - q: "What is the loft of a Honma TW737 Vn 7-iron?"
    a: "The Honma TW737 Vn 7-iron has a loft of 34 degrees, a lie of 61.5 degrees and a Dynamic Gold steel length of 36.75 inches."
  - q: "What does the 'n' in Honma TW737 Vn mean?"
    a: "It marks the near-blade head of the TW737 range — a compact, forged shape for better players with the weakest (highest-degree) lofts of the three 737 heads, so it keeps a traditional flight and feel despite the workable shape."
  - q: "How does the Honma TW737 Vn compare to the V and Vs?"
    a: "All three share the same forged mild-steel construction and 3-10 set makeup, but the Vn has the weakest lofts (34-degree 7-iron) and most compact, blade-like shape, the V sits in the middle (32-degree 7-iron), and the Vs has the strongest lofts (30-degree 7-iron) in a slightly larger head."
