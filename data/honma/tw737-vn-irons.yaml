  - "Honma's own TW737 Vn product page, specification table (honmagolf.com/sea/product-details/215) — every loft, lie and Dynamic Gold length recorded here (38.75 down to 35.25 inches), the D2 swing weight progression, the mild-steel forged construction with half-mirror/mirror double-layer plating, the 3-10 set, and the Dynamic Gold / Vizard IB95 stock shaft options in S200/S/SR/X flex. Offset is published for the 3-6 irons only (2.75/2.55/2.05/1.85 mm, converted to inches here); Honma does not publish offset for the 7-iron down."
