description: >
  The P is the distance model of Honma's 2016 Tour World 737 range and the only
  cast head in the line: a soft mild-steel pocket cavity with a heat-treated,
  thinned face (strengthened 1.5 mm below the surface), a low, deep centre of
  gravity and a thin top line. Lofts match the Vs (30-degree 7-iron) but the
  larger pocket-cavity body launches higher and is far more forgiving, making it
  the easiest-to-hit Tour World of its generation. The set runs 3 through 11
  plus a 56-degree sand wedge — Honma numbers the scoring clubs, so the 43-degree
  10 is the pitching wedge and the 49-degree 11 the gap wedge. Lengths below are
  the N.S. Pro 950GH steel build; Dynamic Gold AMT and Modus3 Tour 120 builds ran
  a quarter inch shorter.
