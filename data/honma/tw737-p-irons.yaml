faq:
  - q: "What is the loft of a Honma TW737 P 7-iron?"
    a: "The Honma TW737 P 7-iron has a loft of 30 degrees, a lie of 61.5 degrees and an N.S. Pro 950GH steel length of 37 inches."
  - q: "Is the Honma TW737 P forged?"
    a: "No — it is the only cast head in the TW737 iron line. Honma cast it from soft mild steel to create the pocket cavity, then heat-treated the face with a proprietary process so it could be thinned for more ball speed."
  - q: "What is the set makeup of the Honma TW737 P?"
    a: "3-iron through the numbered wedges plus a sand wedge: the 43-degree 10 is the pitching wedge, the 49-degree 11 the gap wedge, and the SW is 56 degrees."
