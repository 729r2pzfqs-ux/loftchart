sources:
  - "golfnavi.info spec database, 'TW727 V アイアン' (golfnavi.info/spec/11829) — full loft/lie/face-progression/length table sourced from Honma's Japan-market official spec sheet, data recorded 5 Dec 2014 ahead of the January 2015 launch: lofts 20/22/25/28/32/36/41/46, lies 59.5-63, face progression (offset) 3.5/3.5/3.7/4.2/4.2/4.2/4.4/4.4 mm (converted to inches here), N.S. Pro Modus3 Tour 120 lengths 38.75 down to 35.25 inches, D2 swing weight throughout, forged S25C mild-steel head with half-mirror/mirror double-layer plating, 3-10 set, and the Vizard IB95 / Modus3 Tour 120 stock shaft pair. Same page's comparison table confirms the TW737 V that followed in 2016 carried the identical 20-46 loft range and 59.5-63 lie range."
  - "golfpunkhq.com 'The Honma TW727 Iron Range' — describes the V as having 'a wider sole and deeper cavity making it more forgiving, with stronger lofts' than the Vn, and as the range's recommended mid-market cavity-back option; corroborates the January 2015 launch."
  - "mrtopesgolf.com individual-club listings for TW727V 4-iron (38.25 in) and 6-iron (37.25 in) on steel shafts — corroborate the N.S. Pro Modus3 Tour 120 lengths in the golfnavi table exactly."
  - "Note on year_discontinued: set to 2016, the year Honma announced the TW737 V; this generation is thinly documented in English-language sources (mostly used-club retailer listings), so confidence is medium."
