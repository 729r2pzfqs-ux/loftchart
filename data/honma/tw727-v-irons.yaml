faq:
  - q: "What is the loft of a Honma TW727 V 7-iron?"
    a: "The Honma TW727 V 7-iron has a loft of 32 degrees, a lie of 61.5 degrees and an N.S. Pro Modus3 Tour 120 steel length of 36.75 inches."
  - q: "What is the difference between the Honma TW727 V and TW727 Vn?"
    a: "The V has a wider sole and deeper cavity with stronger lofts (32-degree 7-iron) for more forgiveness and distance, while the Vn is a more compact, muscle-back-feeling half-cavity with weaker lofts (34-degree 7-iron) aimed at better players who want a blade-like look."
  - q: "How does the Honma TW727 V compare to the TW737 V that replaced it?"
    a: "The two share essentially the same specification: identical 20-to-46-degree loft range, the same 59.5-to-63-degree lie progression and the same forged S25C mild-steel construction. The TW737 V that followed in 2016 is a close continuation of the same head rather than a redesign."
