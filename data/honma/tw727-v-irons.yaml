description: >
  The V is the cavity-back players iron of Honma's January 2015 Tour World 727
  range, forged from S25C mild steel and marketed as combining distance with
  workability. Lofts and lie angles carried over essentially unchanged into
  the TW737 V released the following year (32-degree 7-iron in both). The set
  runs 3 through 10 — Honma numbers the pitching wedge as the 10-iron at 46
  degrees. Lengths below are the N.S. Pro Modus3 Tour 120 steel build; Vizard
  IB95 graphite builds ran 0.375 inch longer.
