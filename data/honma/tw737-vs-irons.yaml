description: >
  The Vs sits between the traditional V and the pocket-cavity P in Honma's 2016
  Tour World 737 range: a forged mild-steel cavity back with a slightly larger
  face and lofts about two degrees stronger than the V (30-degree 7-iron), aimed
  at players who want a compact look with a little more speed and height. The
  set runs 3 through 11 — Honma numbers the scoring clubs, so the 43-degree 10
  is the pitching wedge and the 49-degree 11 the gap wedge. Lengths below are
  the N.S. Pro Modus3 Tour 105 steel build; Vizard graphite builds ran 0.375
  inch longer.
