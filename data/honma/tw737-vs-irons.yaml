faq:
  - q: "What is the loft of a Honma TW737 Vs 7-iron?"
    a: "The Honma TW737 Vs 7-iron has a loft of 30 degrees, a lie of 61.5 degrees and a Modus3 Tour 105 steel length of 36.75 inches."
  - q: "What is the difference between the Honma TW737 V and Vs?"
    a: "The Vs has a slightly larger forged cavity-back head with lofts about two degrees stronger than the V (30 versus 32 degrees in the 7-iron), plus a nine-club set that adds the 49-degree 11 gap wedge. It sits between the V players iron and the P pocket cavity."
  - q: "What do the 10 and 11 irons in a Honma TW737 Vs set mean?"
    a: "Honma numbers its scoring clubs: the 10 at 43 degrees is the pitching wedge and the 11 at 49 degrees is the gap wedge."
