  - "Minna no Golf Digest, 26 May 2026 (https://www.golfdigest-minna.jp/_ct/17841757) — reports Honma's announcement of the T//WORLD IRON Tour V, Vx and Px for release on 19 June 2026, and independently gives the Vx 7-iron as 30.0 degrees of loft, 5.0 degrees of bounce and 37.0 inches. year_introduced uses the announcement year."
  - "TourSpecGolf, 'Honma T//WORLD 2026 Irons', 26 May 2026 (https://www.tourspecgolf.com/blog/honma-t-world-2026-irons-a-softer-faster-more-refined-players-iron-line/) — 19 June 2026 Japan launch, S15C forging with tungsten in the longer irons, and a 30-degree 7-iron."
  - "Status check, 29 September 2026: confirmed as a current model with no replacement announced. On sale on Honma's US store as the T//WORLD IRON Vx 26 (https://us.honmagolf.com/products/tworld-vx) and listed in the current T//WORLD family on honmagolf.com."
