faq:
  - q: "What is the loft of a Honma T//WORLD Vx (2026) 7-iron?"
    a: "The 2026 Honma T//WORLD Vx 7-iron has a loft of 30 degrees, a lie of 61.5 degrees and a steel-shaft length of 37.0 inches."
  - q: "What is the difference between the Honma TW767 Vx and the 2026 Vx?"
    a: "Lofts, lies and lengths match from the 4-iron through the 9-iron. The 2026 head is forged from S15C rather than S20C steel, has 0.5 mm less offset at every club, and its pitching wedge, numbered as the 10-iron, is 42 degrees instead of 43."
  - q: "What is the 10-iron in the Honma T//WORLD Vx (2026) set?"
    a: "Honma numbers the pitching wedge as the 10-iron. It has 42 degrees of loft, a 63-degree lie and a length of 35.5 inches."
  - q: "When were the 2026 Honma T//WORLD Vx irons released?"
    a: "Honma announced the T//WORLD Tour V, Vx and Px irons on 26 May 2026 and released them in Japan on 19 June 2026."
