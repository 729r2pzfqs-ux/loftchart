sources:
  - "Honma's own T//WORLD Vx product page, specification table (https://www.honmagolf.com/int/product-details/11198, retrieved 29 September 2026) — supplied every loft, lie, offset, length and swing weight above for the #4 through #10, the material ('#4-8: S15C Forged + Tungsten Weight, #9-10: S15C Forged'), the statement that offset is reduced from the previous model, and the N.S.PRO MODUS3 for T//WORLD RED shaft table. The Japanese edition of the same page (https://www.honmagolf.com/jp/product-details/11198) carries identical figures and states that length is measured by the 60-degree method."
  - "Honma's US store page 'T//WORLD IRON Vx 26' (https://us.honmagolf.com/products/tworld-vx, retrieved 29 September 2026) — supplied the bounce row (4.0, 4.0, 5.0, 5.0, 5.0, 6.0, 6.0), which the global page does not publish, and matches the global page on loft, lie, offset, length and swing weight."
