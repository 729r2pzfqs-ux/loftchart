description: >
  The 2026 Vx is the players cavity-back in Honma's T//WORLD iron line, announced on
  26 May 2026 and released in Japan on 19 June 2026 in place of the TW767 Vx; Honma's
  US store sells it as the "T//WORLD IRON Vx 26". The head moves from the S20C steel
  of the TW767 to softer S15C, keeps a tungsten toe weight in the 4 to 8 irons, and
  carries less offset than before, 2.5 mm at the 7-iron against 3.0 mm. Lofts, lies
  and lengths are unchanged from the TW767 Vx through the 9-iron, with a 30-degree
  7-iron, but the pitching wedge, which Honma now numbers as the 10-iron, is 42
  degrees rather than 43. Figures are the stock N.S.PRO MODUS3 for T//WORLD RED steel
  build in S flex, with lengths measured by the Japanese 60-degree method.
