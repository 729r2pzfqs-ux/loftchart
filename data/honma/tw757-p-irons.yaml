faq:
  - q: "What is the loft of a Honma TW757 P 7-iron?"
    a: "The Honma TW757 P 7-iron has a loft of 28.5 degrees, a lie of 61.5 degrees and a length of 37.25 inches."
  - q: "What is the difference between the Honma TW747 P and TW757 P?"
    a: "The lofts and lies are identical club for club. The TW757 P is a quarter inch longer at every club and switches to a 17-4 stainless hollow body with an L-cup face, where the TW747 P was a forging with tungsten sole weighting."
  - q: "When were the Honma TW757 irons released?"
    a: "Honma announced the T//World TW757 collection on 29 March 2022."
