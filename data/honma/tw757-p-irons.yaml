description: >
  The TW757 P is the compact players-distance iron of Honma's 2022 Tour World 757
  range, built in 17-4 stainless with an undercut pocket cavity, roughly 12 grams of
  tungsten in the sole, a six-gram toe weight and a 2.2 mm L-cup face. Lofts match
  the TW747 P it replaced club for club — the 7-iron is 28.5 degrees — while the
  lengths run a quarter inch longer. Honma numbers the scoring clubs, so the P shown
  here is the pitching wedge at 43.5 degrees.
