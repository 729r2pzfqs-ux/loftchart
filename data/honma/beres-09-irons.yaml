description: >
  The ninth-generation Beres continues Honma's ultra-premium lightweight line
  with head specifications carried over unchanged from the Beres 08: a forged
  mild-steel 25C body with a cast AM355P face in the 5- through 9-irons and an
  ES235 face in the scoring clubs, at the same strong lofts (27-degree 7-iron)
  tuned to launch high from a deep, low centre of gravity. The changes are in
  the shafts and finish: new hand-rolled ARMRQ FX graphite in 2-Star to 5-Star
  grades (plus an even lighter FX LIGHT), still at very light C8-D0 swing
  weights, under two-layer nickel-chrome plating with gold detailing on the
  higher grades. Honma numbers the scoring clubs: the 40-degree 10 is the
  pitching wedge and the 45-degree 11 the gap wedge, ahead of 50-degree AW and
  55-degree SW.
