faq:
  - q: "What is the loft of a Honma Beres 09 7-iron?"
    a: "The Honma Beres 09 7-iron has a loft of 27 degrees, a lie of 62 degrees and a length of 37.25 inches."
  - q: "What changed between the Honma Beres 08 and Beres 09?"
    a: "The head chart is identical — same lofts, lies, lengths and offsets. The 09 generation introduced the new ARMRQ FX shaft family (replacing the 08's ARMRQ MX) plus an extra-light FX LIGHT option, along with refreshed plating and finish grades."
  - q: "Why do Honma Beres 09 irons cost so much?"
    a: "Each set is hand-finished in Sakata, Japan, and the price scales with the star grade of the hand-rolled ARMRQ FX shaft and its finish — from the 2-Star entry build to the 5-Star flagship with gold-plated detailing; top grades run well into five figures per set."
