faq:
  - q: "What is the loft of a Honma TW747 P 7-iron?"
    a: "The Honma TW747 P 7-iron has a loft of 28.5 degrees, a lie of 61.5 degrees and a steel-shaft length of 37.00 inches."
  - q: "Why are Honma irons numbered up to 11?"
    a: "Honma labels its wedges by continuing the iron numbering: the 10-iron is the pitching wedge at 43.5 degrees and the 11-iron the gap wedge at 48 degrees."
  - q: "Do Honma TW747 P lengths depend on the shaft?"
    a: "Yes. Honma publishes two length columns — the VIZARD graphite build runs a quarter inch longer than the N.S. Pro 950GH steel build at every club. The steel figures are the ones recorded here."
  - q: "When were Honma TW747 P irons made?"
    a: "Honma announced the Tour World 747 range in 2018 for the 2019 season, and replaced the P model with the TR20 P in 2020."
