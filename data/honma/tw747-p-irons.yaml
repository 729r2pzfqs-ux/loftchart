sources:
  - "honmagolf.com Tour World TW747 P product detail page (https://honmagolf.com/sea/product-details/1566) — loft, lie, offset (in millimetres) and both published length columns for the #4 through #11 and sand wedge, plus the VIZARD For TW747 50 and N.S. Pro 950GH stock shafts. Offset is converted to inches here and the steel-shaft length column is used, per this database's convention."
  - "golfalot.com 'Honma Tour World TW747 P Irons Review' and tourspecgolf.com \"Honma's New 2019 TW747P Irons\" — corroborate the 19-degree 4-iron, the 28.5-degree 7-iron and the 43.5-degree pitching wedge, the shortened hosel, the roughly 20 grams of tungsten in the sole, and the 2018 announcement for the 2019 season."
