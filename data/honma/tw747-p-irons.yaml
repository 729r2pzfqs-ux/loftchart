description: >
  The TW747 P is the forgiving model in Honma's Tour World 747 line, but it is
  built around a compact head rather than an oversized one: the hosel is
  shortened to free mass, and roughly 20 grams of tungsten sits in the sole
  behind a pocket cavity to drop the centre of gravity. Offset is minimal and
  the top line is narrow. Honma numbers the wedges as 10 and 11 rather than PW
  and GW; those are recorded below as PW and GW. Two stock lengths are
  published, one for the VIZARD graphite build and one a quarter inch shorter
  for the N.S. Pro 950GH steel build — the steel figures are used here.
