sources:
  - "Honma's own Beres 07 product page, specification table (honmagolf.com/sea/product-details/5886) — every loft, lie, offset and length recorded here verbatim from the raw HTML spec grid: lofts 21/24/27/31/35/40/45/50/55, lie 61.0-63.0 across the 5-9 irons with a merged 63.0-degree band spanning 9 through AW and 64.0 degrees for the SW alone (matching the same merged-cell layout later reused on the Beres 08 and Beres Aizu pages), offsets 4.00/3.70/3.50/3.50/3.50/3.50/3.00/3.00/2.00 mm (converted to inches here) with a merged 3.50 mm band across 7-10 and 3.00 mm across 11-AW, lengths 38.0 down to 35.0 inches with a merged 35.0-inch band across 11-AW-SW, the forged mild-steel body with cast/rolled maraging-steel face, the ARMRQ 47 (2S-5S) and ARMRQ 42 (3S) shaft options, and the C9-D1 swing weight range across flex and grade."
