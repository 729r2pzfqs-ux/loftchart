faq:
  - q: "What is the loft of a Honma Beres 07 7-iron?"
    a: "The Honma Beres 07 7-iron has a loft of 27 degrees, a lie of 62 degrees and a length of 37 inches — a strong loft that the deep, low centre of gravity is designed to launch high despite the number."
  - q: "How does the Honma Beres 07 compare to the Beres 08 that replaced it?"
    a: "The loft, lie and offset table is identical between the two generations. The Beres 08 grew the lengths by a quarter inch through the mid-irons (5-10) and updated the face alloy naming (AM355P cast face, ES235 rolled face) and shaft lineup (ARMRQ MX)."
  - q: "Who are Honma Beres 07 irons for?"
    a: "Golfers with moderate swing speeds who want an easy-to-accelerate club: the ARMRQ 47/42 graphite builds run very light C9-D1 swing weights, wrapped in Honma's hand-finished Sakata craftsmanship and star-graded shaft technology."
