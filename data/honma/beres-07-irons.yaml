description: >
  The seventh-generation Beres is Honma's ultra-premium lightweight line: a
  forged mild-steel body carries a cast maraging-steel L-cup face with inside
  and outside sole slots in the 5- through 9-irons, and a rolled maraging-steel
  flat face in the scoring clubs, all built for golfers with moderate swing
  speeds who want hand-finished Sakata craftsmanship. Lofts are strong for the
  category (27-degree 7-iron) because the deep, low centre of gravity is tuned
  to launch high regardless. Stock shafts are Honma's ARMRQ 47 / ARMRQ 42
  graphite in ascending 2-Star to 5-Star grades at very light C9-D1 swing
  weights, with matching grades of shaft technology and price. Honma numbers
  the scoring clubs: the 40-degree 10 is the pitching wedge and the 45-degree
  11 the gap wedge, ahead of 50-degree AW and 55-degree SW. The loft, lie and
  offset table carried over unchanged into the Beres 08 that replaced it in
  2021; only the lengths grew, by a quarter inch through the mid-irons.
