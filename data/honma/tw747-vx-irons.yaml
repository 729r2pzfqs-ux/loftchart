sources:
  - "Honma's own TW747 Vx product page, specification table (https://www.honmagolf.com/sea/product-details/1582) — supplied every loft, lie, offset and both shaft length columns, plus the stock shaft list."
  - "Note on offset: Honma publishes offset in millimetres (3.00 mm through 2.00 mm across the 3 to 9 irons); those figures are converted to inches here. The 11-iron row on Honma's chart carries a loft of 49 degrees but no lie or length, so that club is omitted rather than half-recorded."
