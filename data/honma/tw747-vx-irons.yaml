description: >
  The Vx is the stronger-lofted sibling of the TW747 V, running about two degrees
  stronger through the middle of the set — its 7-iron is 30 degrees against the V's
  32 — while keeping the same lie progression. Honma numbers the scoring clubs, so
  the 10 is the pitching wedge. Lengths below are the N.S.Pro Modus3 for T//World
  steel build; the VIZARD IB-WF 85 graphite build is an eighth of an inch longer in
  the 3-iron.
