faq:
  - q: "What is the loft of a Honma TW747 Vx 7-iron?"
    a: "The Honma TW747 Vx 7-iron has a loft of 30 degrees, a lie of 61.5 degrees and a length of 37.0 inches in the steel build."
  - q: "What is the difference between the Honma TW747 V and Vx?"
    a: "The Vx is stronger through the set — 30 degrees at the 7-iron against the V's 32, and 19 at the 3-iron against 20 — on the same lie progression."
  - q: "When were the Honma TW747 Vx irons made?"
    a: "They were announced with the rest of the TW747 range on 5 October 2018 and were succeeded by the TW757 range announced in March 2022."
