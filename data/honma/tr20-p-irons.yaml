description: >
  The TR20 P replaces the TW747 P and keeps the same idea — a compact head with
  a deep pocket cavity, a thin fast L-cup face and tungsten in the sole — while
  strengthening the lofts by roughly two degrees through the set: 30 degrees at
  the 7-iron against the TW747 P's 28.5, and 43 at the pitching wedge. Lies are
  a degree upright of the previous model throughout. Honma numbers the wedges
  10 and 11; they are recorded below as PW and GW.
