faq:
  - q: "What is the loft of a Honma TR20 P 7-iron?"
    a: "The Honma TR20 P 7-iron has a loft of 30 degrees, a lie of 62.5 degrees and a length of 37.00 inches."
  - q: "How do TR20 P lofts compare with the TW747 P?"
    a: "About two degrees stronger through the set — 30 degrees at the 7-iron against 28.5, and 43 at the pitching wedge against 43.5 — with lies a degree more upright at every club."
  - q: "What is an L-cup face?"
    a: "A face that wraps around into the sole in an L profile, so a larger area of the head deflects at impact. It is what lets a relatively compact cast head keep ball speed on strikes low on the face."
  - q: "When were Honma TR20 P irons made?"
    a: "2020, between the TW747 P and the TR21 X."
