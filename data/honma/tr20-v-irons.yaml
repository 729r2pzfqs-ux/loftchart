faq:
  - q: "What is the loft of a Honma TR20 V 7-iron?"
    a: "The Honma TR20 V 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a length of 37.125 inches."
  - q: "What is the 11-iron in a Honma TR20 V set?"
    a: "It is the approach or gap wedge at 49 degrees. Honma numbers the scoring clubs, so 10 is the pitching wedge and 11 is the approach wedge."
  - q: "When were the Honma TR20 irons released?"
    a: "Honma announced the Tour Release TR20 line on 20 January 2020."
