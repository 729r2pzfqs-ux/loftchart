sources:
  - "Honma's own TR20 V product page, specification table (https://honmagolf.com/hk/product-details/6142) — supplied every loft, lie, length and offset, the three stock shafts, the S20C forged construction and the eight-club 4-11 set makeup."
  - "Note on offset: published by Honma in millimetres (3.5 mm down to 1.9 mm) and converted to inches here. Lengths are Honma's published stock lengths for this model; the page lists swing weights from D1 to D3 depending on shaft, so no single swing weight is recorded."
