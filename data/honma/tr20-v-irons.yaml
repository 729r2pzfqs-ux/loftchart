description: >
  The V is the cavity-back players iron of Honma's Tour Release TR20 family, a
  one-piece S20C forging with a modest topline, a tour-length blade and weight
  pushed low in the head. Its 7-iron is 32 degrees, traditional for the category.
  Honma numbers the scoring clubs, so the 10 at 44 degrees is the pitching wedge and
  the 11 at 49 the approach wedge.
