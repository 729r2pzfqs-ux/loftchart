faq:
  - q: "What is the loft of a Honma TW767 Vx 7-iron?"
    a: "The Honma TW767 Vx 7-iron has a loft of 30 degrees, a lie of 61.5 degrees and a length of 37.0 inches in the steel-shaft build."
  - q: "What is the difference between the Honma TW757 Vx and TW767 Vx?"
    a: "The lofts, lies and lengths are unchanged club for club between the two generations. The TW767 Vx thickens the cavity for a deeper impact sound and extends the stock set down to a 49-degree A-wedge."
  - q: "When were the Honma TW767 Vx irons released?"
    a: "Honma announced the T//World TW767 collection on 22 October 2024."
