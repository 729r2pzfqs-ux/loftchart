description: >
  The Vx is the players cavity-back iron of Honma's T//World 767 range, forged from
  S20C carbon steel with a thickened cavity for a softer, deeper sound at impact than
  the TW757 Vx it replaces. Lofts and lie angles are unchanged club for club from the
  TW757 Vx — a 30-degree 7-iron — while the set is now offered from the 4-iron down
  to an A-wedge stamped at 49 degrees. The 4 to 8 irons carry a tungsten toe weight;
  the 9-iron through A-wedge are single-piece forgings without added tungsten.
