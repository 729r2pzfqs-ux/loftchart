sources:
  - "Honma's own T//World Tour V product page, specification table (https://www.honmagolf.com/sea/product-details/10954) — supplied every loft, lie, length and offset above, the one-piece S20C forged construction, and the three stock shaft options."
  - "Note on offset: Honma publishes offset in millimetres (2.5 mm for the 4 to 6 irons, 2.0 mm for the 7 and 8 irons, 1.5 mm for the 9 and P) and is converted to inches here."
  - "thehackersparadise.com 'Honma TW767 Tour V Irons Review' — confirms a 32-degree 7-iron and 45-degree pitching wedge, a 5-PW set makeup, N.S.Pro Modus3 Tour 115 stock shaft, and that the irons were available for order as of the review date (6 March 2025)."
  - "firstcallgolf.com 'Honma Golf Launches Tour World 767 Collection' (release dated 22 October 2024) — announcement date for the TW767 range, used for year_introduced."
  - "Note: predecessor and successor are recorded as null. The TW757 generation (announced 2022) did not ship a one-piece 'V'-branded model — only P and Vx — so there is no direct predecessor in that generation. No successor to the Tour V had been separately announced as of the sources retrieved; Honma's current T//World 2026 (TW777) marketing material continues to list a 'Tour V' head, but no distinct TW777-generation spec sheet for it could be found — see the TW777 PCB Max file for the one iron confirmed as new for that generation."
