faq:
  - q: "What is the loft of a Honma TW767 Tour V 7-iron?"
    a: "The Honma TW767 Tour V 7-iron has a loft of 32 degrees, a lie of 61.5 degrees and a length of 36.75 inches."
  - q: "What set makeup does the Honma TW767 Tour V ship in?"
    a: "The Tour V is sold 4-P (4-iron through pitching wedge); Honma's spec chart also carries the 4-iron as an added-order option in some markets."
  - q: "When was the Honma TW767 Tour V released?"
    a: "Honma announced the T//World TW767 collection on 22 October 2024, with the Tour V available to order by early 2025."
