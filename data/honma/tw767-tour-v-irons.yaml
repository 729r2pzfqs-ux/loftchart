description: >
  The Tour V is the compact, one-piece forged iron of Honma's T//World 767 range,
  built for accomplished ball-strikers who want a thin topline and low offset over
  outright forgiveness. It carries the lowest offset of the four TW767 iron models
  at every club and the strongest lofts, running a 32-degree 7-iron and a 45-degree
  pitching wedge. Honma revived the plain "V" nomenclature for this release; the
  previous TW757 generation did not include a corresponding one-piece blade-style
  model, so this line has no direct predecessor in that generation.
