description: >
  The B is the muscle back of Honma's Tour Release TR20 family, an S20C forging with
  a satin finish made in Japan. It runs the weakest lofts of the three TR20 heads at
  the top of the set — the 3-iron is 20 degrees — but the strongest through the
  middle, with a 34-degree 7-iron, and its offset falls away sharply in the short
  irons, from 3.1 mm at the 3-iron to 1.0 mm at the 10.
