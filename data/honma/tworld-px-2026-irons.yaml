description: >
  The 2026 Px is the distance-oriented model in Honma's T//WORLD iron line, announced
  on 26 May 2026 and released in Japan on 19 June 2026 in place of the TW767 Px;
  Honma's US store sells it as the "T//WORLD IRON Px 26". Honma describes it as a
  two-piece construction, a forged S25C soft iron body with a high-strength L-cup
  face, now chromium molybdenum steel in the 5 to 8 irons, and a vibration-damping
  emblem in the cavity. Lofts, lies, lengths and offsets are unchanged from the TW767
  Px through the 9-iron, with a 30-degree 7-iron, but the pitching wedge, which Honma
  now numbers as the 10-iron, is 42 degrees rather than 43, and the published table
  no longer includes an A-wedge. Figures are the N.S.PRO 950GH neo steel build in S
  flex, with lengths measured by the Japanese 60-degree method; the VIZARD IRON Lite
  graphite build is a quarter inch longer.
