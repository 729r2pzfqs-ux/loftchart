sources:
  - "Honma's own T//WORLD Px product page, specification table (https://www.honmagolf.com/int/product-details/11196, retrieved 29 September 2026) — supplied every loft, lie, offset, length and swing weight above for the #5 through #10, the material text ('#5-8: S25C Forged body + Chromium molybdenum face / Casting; #9-10: S25C Forged body + ES235 face / Casting'), the two-piece L-cup face description, and the N.S.PRO 950GH neo and VIZARD IRON Lite shaft tables. The Japanese edition of the same page (https://www.honmagolf.com/jp/product-details/11196) carries identical figures and states that length is measured by the 60-degree method."
  - "Honma's US store page 'T//WORLD IRON Px 26' (https://us.honmagolf.com/products/tworld-px, retrieved 29 September 2026) — supplied the bounce row (3.5, 4.5, 4.5, 5.0, 6.0, 6.0), which the global page does not publish. On that page the offset row repeats the bounce figures exactly, which is taken to be a copying error: the offsets recorded here are from the global and Japanese pages (3.5, 3.0, 3.0, 3.0, 2.5, 2.5 mm). The 4.5-degree bounce at the 7-iron is independently confirmed by Minna no Golf Digest; the other bounce figures rest on the US page alone."
  - "Note on offset: Honma publishes offset in millimetres and it is converted to inches here (mm / 25.4)."
  - "Note on length and swing weight: Honma lists two builds. The figures above are the N.S.PRO 950GH neo steel column (D2); the VIZARD IRON Lite graphite build is 38.25 to 35.75 inches at D1."
  - "Minna no Golf Digest, 26 May 2026 (https://www.golfdigest-minna.jp/_ct/17841757) — reports Honma's announcement of the T//WORLD IRON Tour V, Vx and Px for release on 19 June 2026, and independently gives the Px 7-iron as 30.0 degrees of loft, 4.5 degrees of bounce and 37.0 inches. year_introduced uses the announcement year."
  - "TourSpecGolf, 'Honma T//WORLD 2026 Irons', 26 May 2026 (https://www.tourspecgolf.com/blog/honma-t-world-2026-irons-a-softer-faster-more-refined-players-iron-line/) — 19 June 2026 Japan launch, forged S25C body with a cup face, and a 30-degree 7-iron."
  - "Status check, 29 September 2026: confirmed as a current model with no replacement announced. On sale on Honma's US store as the T//WORLD IRON Px 26 (https://us.honmagolf.com/products/tworld-px) and listed in the current T//WORLD family on honmagolf.com."
