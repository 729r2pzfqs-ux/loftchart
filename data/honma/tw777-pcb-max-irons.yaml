sources:
  - "Honma's own TW777 PCB Max product page, us.honmagolf.com/products/tw777-irons — supplied the loft, lie, offset and length figures above, the AM355P (#5-8) / ES235 (#9-SW) face materials, and both stock shaft options with flex."
  - "Corroborating manufacturer spec table at honmagolf.com/sea/product-details/11108, which independently lists the same lofts, lies and offsets."
  - "thehackersparadise.com 'Honma TW777 PCB Max Irons' and mygolfspy.com 'The New Honma TW777 Lineup' — confirm the S25C forged body, AM355P/ES235 face split, full-cup face, 'Honma CUT' milled topline, and that the PCB Max is Honma's account-confirmed new iron for the TW777 generation (explicitly described as new construction, not a TW767 carryover)."
  - "firstcallgolf.com 'Honma Golf Debuts the TW777 Series with New Carbon-Powered Performance' (release dated 11 December 2025) — announcement date, used for year_introduced. Honma markets the collection as the 'T//World 2026' line, but the announcement itself fell in December 2025."
  - "Note: predecessor and successor recorded as null. Honma's press material describes the PCB Max as filling the most-forgiving slot the TW767 Hx previously occupied, but no source explicitly states the Hx was discontinued or formally succeeded by the PCB Max, and the TW767 Hx product page remained live as of the sources retrieved — so no predecessor link is recorded here. Tour V, Vx and Px are not recorded as separate TW777-generation files: their current US product pages still reference the TW767 product manual, and no distinct TW777 spec sheet could be found for them, indicating they continue unchanged rather than being genuinely new models."
