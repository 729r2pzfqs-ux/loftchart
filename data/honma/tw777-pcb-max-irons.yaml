description: >
  The PCB Max is the sole genuinely new iron head Honma introduced with the TW777
  ("T//World 2026") collection — marketed alongside carried-over Tour V, Vx and Px
  heads from the TW767 range rather than replacing them outright. It pairs a soft
  forged S25C body with a full-cup AM355P face on the 5 to 8 irons and a flat ES235
  face on the 9-iron through sand wedge, plus a milled "Honma CUT" top-line slope
  for a cleaner look at address. It is the most forgiving, highest-launching iron
  in the current T//World range and the only one sold with a stock sand wedge.
