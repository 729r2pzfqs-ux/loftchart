faq:
  - q: "What is the loft of a Honma TW777 PCB Max 7-iron?"
    a: "The Honma TW777 PCB Max 7-iron has a loft of 28 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "Does the Honma TW777 PCB Max come with a sand wedge?"
    a: "Yes. Unlike the other T//World irons, the PCB Max ships with a 56-degree sand wedge as part of its 5-SW set, in addition to Honma's usual numbered 10 and 11 scoring clubs and an AW."
  - q: "When was the Honma TW777 PCB Max released?"
    a: "Honma announced the TW777 collection, including the PCB Max irons, on 11 December 2025, marketed as the T//World 2026 line."
