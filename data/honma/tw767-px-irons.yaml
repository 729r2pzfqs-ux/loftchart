sources:
  - "Honma's own T//World Px product page, specification table (https://www.honmagolf.com/sea/product-details/10958) — supplied every loft, lie, length and offset above, the exact construction text ('Soft Iron(S25C)/Forged + AM355P Face/Casting' for #5-#8 and 'Soft Iron(S25C)/Forged + ES235 Face/Casting' for #9-A), and the four stock shaft options."
  - "Note on offset: Honma publishes offset in millimetres (3.5 mm for the 5 iron, 3.0 mm for the 6 to 8 irons, 2.5 mm for the 9, P and A) and is converted to inches here."
  - "Note on length: Honma's chart lists two length columns depending on stock shaft; the figures above are the N.S.Pro 950GH neo (steel) column, matching this schema's steel-shaft-standard convention. Graphite-shaft (VIZARD EZ-C) lengths run 0.25 inch longer at each club."
  - "pluggedingolf.com 'Honma TW767 Px Irons Review' — corroborates the S25C forged body with an L-Cup face on the 5-8 irons, a flat ES235 face on 9-AW, the first Cap-Back design in the TW range, and an October 2024 release."
  - "firstcallgolf.com 'Honma Golf Launches Tour World 767 Collection' (release dated 22 October 2024) — announcement date, used for year_introduced."
  - "Note: year_discontinued is null — no successor to the TW767 Px had been announced in the sources retrieved. Honma's current T//World 2026 (TW777) marketing material continues to list a 'Px' head, but no distinct TW777-generation spec sheet for it could be found, and the TW767 Px's own US product page still references the TW767 product manual — see the TW777 PCB Max file for the one iron confirmed as genuinely new for that generation."
