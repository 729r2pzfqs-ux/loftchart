description: >
  The Px is the players-distance iron of Honma's T//World 767 range and Honma's
  first "Cap-Back" construction and first three-piece iron in the TW series,
  combining a forged S25C body with a variable-thickness L-cup face on the 5 to 8
  irons for extra ball speed on off-centre strikes. It replaces the TW757 P in
  Honma's lineup: lofts run about a degree stronger through the middle of the set
  than the TW757 P (30 degrees at the 7-iron versus 28.5) on a similar lie
  progression, and the set now extends to a 49-degree A-wedge.
