faq:
  - q: "What is the loft of a Honma TW767 Px 7-iron?"
    a: "The Honma TW767 Px 7-iron has a loft of 30 degrees, a lie of 61.5 degrees and a length of 37.0 inches in the steel-shaft build."
  - q: "What is the difference between the Honma TW757 P and TW767 Px?"
    a: "The TW767 Px runs about a degree stronger through the middle irons (30 degrees at the 7-iron versus 28.5 on the TW757 P) and switches to Honma's first Cap-Back, three-piece forged construction with an L-Cup face on the 5 to 8 irons, where the TW757 P was a cast hollow body."
  - q: "When were the Honma TW767 Px irons released?"
    a: "Honma announced the T//World TW767 collection on 22 October 2024, with the Px going on sale in the US market around October 2024."
