sources:
  - "golfnavi.info spec database, 'TW727 Vn アイアン' (golfnavi.info/spec/11828) — full loft/lie/face-progression/length table sourced from Honma's Japan-market official spec sheet, data recorded 5 Dec 2014 ahead of the January 2015 launch: lofts 21/24/27/30/34/38/42/46, lies 59.5-63, face progression (offset) 4.0/4.0/4.2/4.7/4.7/4.7/4.9/4.9 mm (converted to inches here), Dynamic Gold S200 lengths 38.75 down to 35.25 inches, D2 swing weight throughout, forged S25C mild-steel head with half-mirror/mirror double-layer plating, 3-10 set, and the Vizard IB95 / Dynamic Gold stock shaft pair. Manufacturer description quoted on the page reads 'マッスル感覚のハーフキャビティアイアン' (a half-cavity iron with a muscle-back feel). The page's comparison table confirms the TW737 Vn that followed in 2016 carried the identical 21-46 loft range, 59.5-63 lie range and 38.75/35.25-inch length span."
  - "golfpunkhq.com 'The Honma TW727 Iron Range' and teetimes.info's mirror of the same article — describe the Vn as a 'compact head blade alternative' with 'identical lofts to the M' true-blade model, most popular among Honma's tour staff, positioned between the TW727 M blade and the TW727 V cavity back."
  - "thehackersparadise.com's review of the TW737 Vn (successor) independently corroborates that the Vn head carries the weakest (highest-degree) lofts of its generation's V-family, consistent with the 34-degree 7-iron recorded here."
  - "Note on category: classified 'blade' here (rather than 'players') because the manufacturer markets it as a blade alternative with lofts identical to the true-blade M, per golfpunkhq/teetimes.info, even though golfnavi.info's own head-shape field labels it a compact cavity."
  - "Note on year_discontinued: set to 2016, the year Honma announced the TW737 Vn; this generation is thinly documented in English-language sources, so confidence is medium."
