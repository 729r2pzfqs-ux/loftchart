faq:
  - q: "What is the loft of a Honma TW727 Vn 7-iron?"
    a: "The Honma TW727 Vn 7-iron has a loft of 34 degrees, a lie of 61.5 degrees and a Dynamic Gold steel length of 36.75 inches."
  - q: "What does the 'n' mean in Honma TW727 Vn?"
    a: "It marks the near-blade, half-cavity head of the TW727 range: Honma built it to share its lofts with the true-blade TW727 M while adding a touch of cavity-back forgiveness, and marketed it as a blade alternative for its tour staff."
  - q: "How does the Honma TW727 Vn compare to the TW727 V?"
    a: "Both are forged from S25C mild steel with the same 3-10 set makeup, but the Vn has weaker lofts (34-degree 7-iron versus the V's 32) and a smaller, more compact head aimed at better players who want a blade-like look and feel."
