description: >
  The Vn is Honma's "half-cavity" iron in the January 2015 Tour World 727
  range: a compact, muscle-back-feeling head forged from S25C mild steel, one
  step more forgiving than the true-blade TW727 M but sharing that model's
  lofts, and marketed as a blade alternative for tour staff. Lofts are one
  step weaker than the cavity-back V (34-degree 7-iron versus 32) with a
  correspondingly smaller, more compact profile. The set runs 3 through 10 —
  Honma numbers the pitching wedge as the 10-iron at 46 degrees. Lengths
  below are the Dynamic Gold S200 steel build; Vizard IB95 graphite builds
  ran 0.375 inch longer. Lofts, lies and lengths carried over unchanged into
  the TW737 Vn released the following year.
