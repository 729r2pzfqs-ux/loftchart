faq:
  - q: "What is the loft of a Honma TW737 V 7-iron?"
    a: "The Honma TW737 V 7-iron has a loft of 32 degrees, a lie of 61.5 degrees and a Dynamic Gold AMT steel length of 36.75 inches."
  - q: "What does the 10-iron in a Honma TW737 V set mean?"
    a: "It is the pitching wedge. Honma numbers its scoring clubs rather than stamping PW, so the 10 at 46 degrees is the set's pitching wedge."
  - q: "When were the Honma TW737 irons released?"
    a: "Honma announced the Tour World 737 range in autumn 2016 for the 2017 season; it was replaced by the TW747 range announced in October 2018."
