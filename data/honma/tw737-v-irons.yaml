description: >
  The V is the classic cavity-back players iron of Honma's 2016 Tour World 737
  range (2017 model year), forged from mild steel in Sakata with a thin top line
  and a traditional 32-degree 7-iron. The set runs 3 through 10 — Honma numbers
  the pitching wedge as the 10-iron at 46 degrees. Lofts, lies and the general
  head concept carried over almost unchanged into the TW747 V two years later.
  Lengths below are the Dynamic Gold AMT steel build; N.S. Pro 950GH builds ran
  a quarter inch longer and Vizard graphite builds 0.375 inch longer.
