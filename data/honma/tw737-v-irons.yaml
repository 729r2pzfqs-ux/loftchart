sources:
  - "Honma's own TW737 V product page, specification table (honmagolf.com/sea/product-details/245) — every loft, lie and Dynamic Gold AMT length recorded here, the D2 swing weight, the forged mild-steel construction and the DG AMT / Modus3 Tour 120 / Vizard IB95 stock shafts. Offsets are published in millimetres (2.75/2.55/2.05/1.85 mm for the 3-6 irons, converted to inches); Honma does not publish offset for the 7-iron down, so the key is omitted there."
  - "Honma's original Japanese Tour World TW737 V page (mail.honmagolf.com/products/tour_world/v.php) — corroborates the lofts, the 3-10 set, the forged mild-steel head and the N.S. Pro 950GH option built a quarter inch longer. LIE-ANGLE CONFLICT NOTE: the Japanese-market page lists lies one degree more upright (60.5 to 64.0); this entry follows the international-site spec (59.5 to 63.0), which is also the basis used for the TW747 entries on this site."
  - "TourSpecGolf blog 'Honma TW737V Irons' — corroborates the autumn 2016 announcement for the 2017 season (year_introduced 2016) and the players-cavity positioning. year_discontinued 2018 is the TW747 range announcement (5 October 2018)."
