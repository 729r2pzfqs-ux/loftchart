faq:
  - q: "What is the loft of a Honma TW757 Vx 7-iron?"
    a: "The Honma TW757 Vx 7-iron has a loft of 30 degrees, a lie of 61.5 degrees and a length of 37.125 inches."
  - q: "What is the difference between the Honma TW747 Vx and TW757 Vx?"
    a: "The lofts and lies are identical from the 4-iron down. The TW757 Vx is an eighth of an inch longer at every club and adds a seven-gram tungsten toe weight through the 4 to 8 irons."
  - q: "When were the Honma TW757 Vx irons released?"
    a: "Honma announced the T//World TW757 collection on 29 March 2022."
