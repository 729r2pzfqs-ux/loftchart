description: >
  The Vx is the players iron of Honma's 2022 Tour World 757 range, a one-piece S20C
  forging with a seven-gram tungsten plug in the toe of the 4 to 8 irons to pull the
  centre of gravity back towards the middle of the face. It carries the TW747 Vx loft
  chart over unchanged from the 4-iron down — 30 degrees at the 7 — and builds the set
  an eighth of an inch longer at every club. Honma stamps the scoring clubs P and A on
  this generation rather than numbering them 10 and 11 as it did on the TW747.
