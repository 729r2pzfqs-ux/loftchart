sources:
  - "Honma's own T//World Hx product page, specification table (https://www.honmagolf.com/sea/product-details/10956) — supplied every loft, lie, length and offset above, the 17-4+ body/ES235 face construction, and the four stock shaft options."
  - "Note on offset: Honma publishes offset in millimetres (3.5 mm for the 5 and 6 irons, 3.0 mm for the 7 and 8 irons, 2.5 mm for the 9 and P, 2.0 mm for the A) and is converted to inches here."
  - "Note on length: Honma's chart lists two length columns depending on stock shaft; the figures above are the N.S.Pro 950GH neo (steel) column, matching this schema's steel-shaft-standard convention. Graphite-shaft (VIZARD EZ-C) lengths run 0.25 inch longer at each club."
  - "thehackersparadise.com 'Honma T//World 767 Hx Irons' and golfsource.org 'Honma TW767 Hx Irons' — corroborate the hollow-body construction and approximate loft progression, though both secondary sources' loft figures differ slightly from Honma's own chart at the 9-iron and PW (they list 37 and 42 degrees versus the manufacturer's 36 and 41); the manufacturer's own spec table is used here."
  - "firstcallgolf.com 'Honma Golf Launches Tour World 767 Collection' (release dated 22 October 2024) — announcement date, used for year_introduced."
  - "Note: predecessor and successor recorded as null. No prior TW-numbered Honma generation in this dataset carried a hollow-body 'Hx' head, so there is no direct predecessor. No formal successor/discontinuation of the Hx had been announced as of the sources retrieved — the TW767 Hx's own US product page remained live alongside the newer TW777 PCB Max at the time of research (August 2026)."
