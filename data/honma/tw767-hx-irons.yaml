description: >
  The Hx is the game-improvement iron of Honma's T//World 767 range and the only
  hollow-body head in the TW767 lineup, cast in 17-4+ stainless with a high-strength
  ES235 maraging face for extra ball speed and weight screws plus internal weighting
  for stability on mishits. Lofts are the strongest of any TW767 iron aside from the
  Tour V's own progression through mid irons, running a 28-degree 7-iron and a
  41-degree pitching wedge, with the set extending to a 46-degree A-wedge. Honma had
  not previously fielded a hollow-body head in the modern TW-numbered range, so the
  Hx has no direct predecessor.
