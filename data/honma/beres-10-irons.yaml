sources:
  - "Honma's own BERES 10 IRON product page, specification table (https://www.honmagolf.com/int/product-details/11150, retrieved 29 September 2026) — every loft, lie, length and offset recorded here (offsets 4.0/3.7/3.5/3.0/2.0 mm converted to inches, mm / 25.4; the table's merged cells place the 63.0-degree lie across the 9 through AW, 64.0 on the SW, the 3.5 mm offset across the 7 through 10, the 3.0 mm offset across the 11 and AW, and the 35.5-inch length across the 11 and AW), plus the S25C body with AM355P face (5-9) and ES235 face (10-SW), the Speed Core Face and 3D L-cup face descriptions, and the ARMRQ FLIGHT shaft matrix. The Japanese page for the BERES 2026 iron (https://www.honmagolf.com/jp/product-details/11186) carries the identical head table."
  - "Note on swing weight: the set is graphite only and Honma's swing weights vary by flex (C8 for LIGHT R and R, C9 for SR and S, with the SW one point heavier at C9 or D0; total weights about 342 to 393 g), so the swing_weight key is omitted rather than tied to one flex."
  - "Note on bounce: Honma's US store page for the 3-Star Beres 10 iron (https://us.honmagolf.com/products/3-star-iron-beres-11) publishes a bounce row, but the same table drops one lie value and gives swing weights that disagree with the global page, and no second source for the bounce figures was found, so bounce is omitted."
  - "Announcement: Minna no Golf Digest, 27 January 2026 (https://www.golfdigest-minna.jp/_ct/17818026) — reports Honma's announcement of the 'BERES 2026 Model' for sale in Japan from 30 January 2026. Honma's US release 'Honma Golf's BERES 10: artistry meets pure speed' is dated 3 February 2026 (https://www.firstcallgolf.com/industry-news/release/2026-02-03/honma-golfs-beres-10-artistry-meets-pure-speed) and gives the men's irons as forged S25C at $550, $1,350 and $5,000 per club for the 3-Star, 4-Star and 5-Star grades. year_introduced is 2026 on that basis; no earlier public announcement was found."
  - "Status check, 29 September 2026: confirmed as a current model with no replacement announced. On sale on Honma's US store in 3-Star, 4-Star and 5-Star grades (https://us.honmagolf.com/products/3-star-iron-beres-11) and listed under the BERES 10 family on honmagolf.com."
