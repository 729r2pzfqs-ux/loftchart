faq:
  - q: "What is the loft of a Honma Beres 10 7-iron?"
    a: "The Honma Beres 10 7-iron has a loft of 27 degrees, a lie of 62 degrees and a length of 37.25 inches."
  - q: "What changed between the Honma Beres 09 and Beres 10?"
    a: "The head chart is identical: the same lofts, lies, lengths and offsets. The Beres 10 introduces the ARMRQ FLIGHT shaft family in place of the 09's ARMRQ FX, a revised Speed Core Face with a three-dimensional L-cup face, and new styling based on Edo Kiriko cut glass."
  - q: "What are the 10 and 11 irons in a Honma Beres 10 set?"
    a: "Honma numbers its scoring clubs. The 10 is the pitching wedge at 40 degrees and the 11 is the gap wedge at 45 degrees, followed by a 50-degree AW and a 55-degree SW."
  - q: "When were Honma Beres 10 irons released?"
    a: "The line went on sale in Japan, as the BERES 2026 Model, on 30 January 2026, and Honma announced it for the US on 3 February 2026."
