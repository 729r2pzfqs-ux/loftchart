description: >
  The tenth-generation Beres, sold in Japan as the BERES 2026 Model, continues
  Honma's premium lightweight line with a head chart carried over unchanged from the
  Beres 09: the same lofts, lies, lengths and offsets, with a 27-degree 7-iron. It
  went on sale in Japan on 30 January 2026 and was announced for the US on 3 February
  2026. Honma describes a revised "Speed Core Face" with a three-dimensional L-cup
  face and variable thickness, and the styling is drawn from Edo Kiriko cut glass. The
  set is graphite only, on new ARMRQ FLIGHT shafts in 3-Star to 5-Star grades at very
  light C8 to D0 swing weights, which vary by flex and are not tabled here. Honma
  numbers the scoring clubs: the 40-degree 10 is the pitching wedge and the 45-degree
  11 the gap wedge, ahead of a 50-degree AW and 55-degree SW.
