faq:
  - q: "What is the loft of a Honma TR21 X 7-iron?"
    a: "The Honma TR21 X 7-iron has a loft of 30 degrees, a lie of 62.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "What is the difference between the Honma TR21 X and the TR20 P?"
    a: "The TR21 X is a hollow-bodied distance iron with a bigger head — roughly 1.4mm longer and 4.5mm taller — and stronger long irons. Their 7-irons are both 30 degrees, but the TR21 X starts at an 18-degree 3-iron where the TR20 P starts at a 21-degree 4-iron."
  - q: "How much tungsten is in a Honma TR21 X?"
    a: "Between 42 and 73 grams depending on the club, a large share of the head's total mass."
  - q: "Does the Honma TR21 X come with a gap wedge?"
    a: "Honma lists a 48-degree #11, but publishes no lie, length or offset for it, so only the #3 to #10 are charted here."
