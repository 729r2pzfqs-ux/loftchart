description: >
  The TR21 X completes Honma's TR family as its distance iron: a hollow head
  with a C300 L-cup face and between 42 and 73 grams of internal tungsten,
  which is a large fraction of the head's total mass. It is noticeably bigger
  than the TR20 P — about 1.4mm longer in the blade and 4.5mm taller — and
  three to four degrees stronger through the set, at 30 degrees for the 7-iron
  and 43 for the pitching wedge. Honma numbers the wedges 10 and 11; they are
  recorded below as PW and GW.
