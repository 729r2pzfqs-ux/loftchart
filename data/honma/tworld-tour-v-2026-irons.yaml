sources:
  - "Honma's own T//WORLD TOUR V product page, specification table (https://www.honmagolf.com/int/product-details/11200, retrieved 29 September 2026) — supplied every loft, lie, offset, length and swing weight above for the #4 through #10, the 'S15C + Forged' material, and the N.S.PRO MODUS3 for T//WORLD BLACK shaft table. The Japanese edition of the same page (https://www.honmagolf.com/jp/product-details/11200) carries identical figures and states that length is measured by the 60-degree method."
  - "Honma's US store page 'T//WORLD IRON TOUR V 26' (https://us.honmagolf.com/products/tworld-tour-v, retrieved 29 September 2026) — supplied the bounce row (6.0, 6.0, 7.0, 8.0, 8.0, 8.0, 9.0), which the global page does not publish, and matches the global page on lie, offset, length and swing weight. It prints the #10 loft as 40.5 degrees, which is taken to be a misprint: the global and Japanese pages both give 45.0, as does TourSpecGolf."
  - "Note on offset: Honma publishes offset in millimetres (2.5 mm for the 4 to 6 irons, 2.0 mm for the 7 and 8 irons, 1.5 mm for the 9 and 10) and it is converted to inches here (mm / 25.4)."
  - "Minna no Golf Digest, 26 May 2026 (https://www.golfdigest-minna.jp/_ct/17841757) — reports Honma's announcement of the T//WORLD IRON Tour V, Vx and Px for release on 19 June 2026, and independently gives the Tour V 7-iron as 32.0 degrees of loft, 8.0 degrees of bounce and 37.0 inches. year_introduced uses the announcement year."
  - "TourSpecGolf, 'Honma T//WORLD 2026 Irons', 26 May 2026 (https://www.tourspecgolf.com/blog/honma-t-world-2026-irons-a-softer-faster-more-refined-players-iron-line/) — 19 June 2026 Japan launch, S15C one-piece forging, a 32-degree 7-iron and a 45-degree 10-iron."
  - "Status check, 29 September 2026: confirmed as a current model with no replacement announced. On sale on Honma's US store as the T//WORLD IRON TOUR V 26 (https://us.honmagolf.com/products/tworld-tour-v) and listed in the current T//WORLD family on honmagolf.com."
