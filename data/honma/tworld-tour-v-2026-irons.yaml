faq:
  - q: "What is the loft of a Honma T//WORLD Tour V (2026) 7-iron?"
    a: "The 2026 Honma T//WORLD Tour V 7-iron has a loft of 32 degrees, a lie of 61.5 degrees and a steel-shaft length of 37.0 inches."
  - q: "What is the difference between the Honma TW767 Tour V and the 2026 Tour V?"
    a: "Lofts, lies and offsets are unchanged club for club. The 2026 head is forged from S15C rather than S20C steel, has more bounce (8 degrees at the 7-iron), and is listed a quarter inch longer at every club, for example 37.0 inches against 36.75 at the 7-iron."
  - q: "What is the 10-iron in the Honma T//WORLD Tour V (2026) set?"
    a: "Honma numbers the pitching wedge as the 10-iron. It has 45 degrees of loft, a 63-degree lie and a length of 35.5 inches."
  - q: "When were the 2026 Honma T//WORLD Tour V irons released?"
    a: "Honma announced the T//WORLD Tour V, Vx and Px irons on 26 May 2026 and released them in Japan on 19 June 2026."
