description: >
  The 2026 Tour V is the compact semi-cavity players iron in Honma's T//WORLD iron
  line, announced on 26 May 2026 and released in Japan on 19 June 2026 in place of the
  TW767 Tour V; Honma's US store sells it as the "T//WORLD IRON TOUR V 26". The head
  is a one-piece forging that moves from the S20C steel of the TW767 to softer S15C,
  and Honma has raised the bounce, to 8 degrees at the 7-iron. Lofts, lies and offsets
  are unchanged from the TW767 Tour V, with a 32-degree 7-iron, while the published
  lengths are a quarter inch longer at every club. Honma numbers the pitching wedge
  as the 10-iron, at 45 degrees. Figures are the stock N.S.PRO MODUS3 for T//WORLD
  BLACK steel build in S flex, with lengths measured by the Japanese 60-degree method.
