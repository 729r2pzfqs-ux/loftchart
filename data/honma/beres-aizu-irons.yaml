faq:
  - q: "What is the loft of a Honma Beres Aizu 7-iron?"
    a: "The Honma Beres Aizu 7-iron has a loft of 27 degrees, a lie of 62 degrees and a length of 37.25 inches — identical to the standard Beres 08 7-iron."
  - q: "What is different about the Honma Beres Aizu compared to the standard Beres 08?"
    a: "Nothing in the head geometry or loft/lie/length table — it is club for club identical. The Aizu edition adds traditional Aizu-nuri lacquer artwork from Fukushima's Aizu region to the clubhead as a 2022 limited-edition dress-up."
  - q: "Is the Honma Beres Aizu part of the numbered Beres generations?"
    a: "No — it is a limited-edition finish variant built on the Beres 08 platform (launched 2022, a year before the Beres 09 generation), not a separate numbered step in Honma's mainline Beres lineage."
