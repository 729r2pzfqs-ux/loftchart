sources:
  - "Honma's own Beres Aizu Iron product page, specification table (honmagolf.com/sea/product-details/8782) — every loft, lie, offset and length recorded here verbatim from the raw HTML spec grid: lofts 21/24/27/31/35/40/45/50/55, lie 61.0-63.0 across the 5-9 irons with a merged 63.0-degree band spanning 9 through AW and 64.0 degrees for the SW alone, offsets 4.0/3.7/3.5/3.0/2.0 mm (converted to inches here) with a merged 3.5 mm band across 7-10 and 3.0 mm across 11-AW, lengths 38.25 down to 35.0 inches with a merged 35.5-inch band across 11-AW and 35.0 inches for the SW alone, the forged mild-steel body with AM355P+ cast face (5-9) / ES235 rolled face (10-SW), the nickel-chrome double-layer plated satin finish, the ARMRQ MX 2S-5S shaft grades and the C9-D1 swing weight range. This table is identical club for club to the standard Beres 08 specification already on this site — the Aizu edition changes the lacquer artwork, not the head geometry."
  - "golfwrx.com 'Honma launches 2022 Beres Aizu and Black collection' — confirms the 2022 launch date and describes the Aizu edition's traditional Japanese lacquer design as the differentiator from the standard Beres 08, alongside a separate 'Black' finish option released the same year."
  - "Amazon listing '2022 HONMA Beres 08 Aizu Iron Set Right - 5-11, AW, SW ARMRQ MX 3-Star Graphite' — corroborates the 5-11/AW/SW set makeup and confirms the retail naming ties the Aizu edition explicitly to the Beres 08 generation."
  - "Note on successor/predecessor: left null because Aizu is a limited-edition finish variant of the Beres 08 platform rather than a step in Honma's mainline numbered Beres lineage; see related_models for the platform relationship."
