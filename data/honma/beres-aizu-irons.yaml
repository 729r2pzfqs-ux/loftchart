description: >
  Beres Aizu is a 2022 limited-edition dress-up of the Beres 08 head, built
  on the identical forged mild-steel body/AM355P+ cast-face/ES235 rolled-face
  construction and the exact same loft, lie, offset and length table as the
  standard Beres 08. What sets it apart is traditional Aizu-nuri lacquerwork
  from the Aizu region of Fukushima applied to the clubhead, a craft Honma
  has used on limited runs since its earliest Beres sets. Stock shafts are
  the ARMRQ MX 2-Star through 5-Star graphite range at very light C9-D1
  swing weights. Honma numbers the scoring clubs: the 40-degree 10 is the
  pitching wedge and the 45-degree 11 the gap wedge, ahead of 50-degree AW
  and 55-degree SW.
