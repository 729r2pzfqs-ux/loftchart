faq:
  - q: "What is the loft of a Honma T//World GS 7-iron?"
    a: "The Honma T//World GS 7-iron has a loft of 29 degrees, a lie of 62 degrees and a Speedtuned 55 graphite length of 37 inches; steel builds are 0.375 inch shorter."
  - q: "What does GS stand for in Honma T//World GS?"
    a: "Gain Speed. The line is built around adding clubhead and ball speed for average golfers, from the L-Cup cup face and flexible sole slots to the light 55-gram Speedtuned stock shaft and D0 swing weight."
  - q: "Is the Honma T//World GS a game-improvement iron?"
    a: "Yes. It replaced the XP-1 as Honma's game-improvement line: mid-size heads, internal tungsten and a cup face in the long and mid irons, and light graphite-first builds, sitting between the Tour Release players models and the ultra-light Beres range."
