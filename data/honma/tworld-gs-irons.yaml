description: >
  GS stands for "Gain Speed": the 2021 T//World GS irons are Honma's
  game-improvement line, built to add clubhead and ball speed for average
  golfers. The 4- through 7-irons pair a 17-4 stainless body and internal
  tungsten with a cast AM355P L-Cup face over a flexible sole slot; the short
  irons are one-piece 17-4 castings. Lofts are modern but not extreme (29-degree
  7-iron) and the stock build is graphite-first: Honma's Speedtuned 55 shaft at
  a light D0 swing weight, with N.S. Pro 950GH neo steel builds 0.375 inch
  shorter at D2. Honma numbers the scoring clubs — the 42-degree 10 is the
  pitching wedge and the 47-degree 11 the gap wedge, with a matching 56-degree
  sand wedge available. Lengths below are the Speedtuned 55 build.
