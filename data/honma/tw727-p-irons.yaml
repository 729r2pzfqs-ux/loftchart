sources:
  - "golfnavi.info spec database, 'TW727 P アイアン' (golfnavi.info/spec/... under the tw727p-iron.php slug) — full loft/lie/face-progression/length table sourced from Honma's Japan-market official spec sheet, data recorded 5 Dec 2014 ahead of the January 2015 launch: lofts 19/21/24/27/30/34/38/43/49/56, lies 59.5-63.5, face progression (offset) 3.25/3.25/3.55/3.75/4.0/4.25/4.25/4.25/4.75/5.25 mm (converted to inches here), N.S. Pro 950GH lengths 39.0 down to 35.0 inches, D2 swing weight (D3 SW), the forged two-piece maraging-stainless-face/mild-steel-body construction with satin double-layer plating plus gloss silver paint, the 3-11-plus-SW set, and the Vizard IB85 / Vizard I55 / N.S. Pro 950GH / ARMRQ8 62 / ARMRQ8 54 stock shaft options. Manufacturer description quoted on the page reads '飛距離とつかまりの良さを追求' (pursuing distance and easy launch). The page's comparison table confirms the TW737 P that followed in 2016 carried the identical 19-56 loft range and near-identical 59.5-63.5 lie range."
  - "golfpunkhq.com 'The Honma TW727 Iron Range' — describes the P as the range's most forgiving variant, with a two-piece head design, deep undercuts in the long irons for forgiveness and progressively shallower cavities toward the short irons for feel; corroborates the January 2015 launch."
  - "Note on category: classified 'players-distance' here (rather than 'players') for consistency with the successor TW737 P, which this site already records as players-distance, and because golfnavi.info's own description emphasises distance and forgiveness over workability."
  - "Note on year_discontinued: set to 2016, the year Honma announced the TW737 P; this generation is thinly documented in English-language sources, so confidence is medium."
