description: >
  The P is the distance model of Honma's January 2015 Tour World 727 range,
  marketed as pursuing distance and easy launch. Unlike the later TW737 P
  (a cast, single-material pocket cavity), the TW727 P is a forged two-piece
  head with a maraging stainless-steel face welded to a mild-steel body. Lofts
  and lie angles carried over essentially unchanged into the TW737 P released
  the following year. The set runs 3 through 11 plus a 56-degree sand wedge —
  Honma numbers the scoring clubs, so the 43-degree 10 is the pitching wedge
  and the 49-degree 11 the gap wedge. Lengths below are the N.S. Pro 950GH
  steel build; Vizard IB85 and Vizard I55 graphite builds ran roughly a
  quarter inch longer.
