faq:
  - q: "What is the loft of a Honma TW727 P 7-iron?"
    a: "The Honma TW727 P 7-iron has a loft of 30 degrees, a lie of 61.5 degrees and an N.S. Pro 950GH steel length of 37 inches."
  - q: "Is the Honma TW727 P forged or cast?"
    a: "It is forged, and built as a two-piece head with a maraging stainless-steel face welded to a mild-steel body. This differs from the TW737 P that replaced it, which is a single-material cast head."
  - q: "What is the set makeup of the Honma TW727 P?"
    a: "3-iron through the numbered wedges plus a sand wedge: the 43-degree 10 is the pitching wedge, the 49-degree 11 the gap wedge, and the SW is 56 degrees."
