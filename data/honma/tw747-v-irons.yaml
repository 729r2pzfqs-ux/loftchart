description: >
  The V is the cavity-back players iron of Honma's 2018 Tour World 747 range, a
  thin-topline shape with progressive offset and a progressive centre of gravity
  through the set. Lofts sit a touch stronger than a traditional players iron —
  the 7-iron is 32 degrees. Honma numbers the scoring clubs rather than lettering
  them, so the club shown as 10 is the pitching wedge.
