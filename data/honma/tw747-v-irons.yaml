faq:
  - q: "What is the loft of a Honma TW747 V 7-iron?"
    a: "The Honma TW747 V 7-iron has a loft of 32 degrees, a lie of 61.5 degrees and a length of 36.75 inches."
  - q: "What does the 10-iron in a Honma TW747 V set mean?"
    a: "It is the pitching wedge. Honma numbers its scoring clubs rather than stamping PW and AW, so the 10 at 46 degrees is the set's pitching wedge."
  - q: "When were the Honma TW747 irons released?"
    a: "Honma announced the Tour World 747 range on 5 October 2018."
