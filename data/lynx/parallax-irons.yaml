faq:
  - q: "What is the loft of a Lynx Parallax 7-iron?"
    a: "The Lynx Parallax 7-iron has a loft of 36 degrees, a standard lie of 62 degrees and a steel-shaft length of 36.5 inches."
  - q: "What does the coloured lynx-head stamp on Parallax irons mean?"
    a: "It marks the lie angle, like Ping's colour-code dots: white is standard, red is two degrees flat and black is two degrees upright. The lies in the chart are the white-stamp standards."
  - q: "Did any majors get won with Lynx Parallax irons?"
    a: "Yes. Fred Couples won the 1992 Masters on Lynx staff after receiving the first Parallax set in late 1991, and Ernie Els won the 1994 US Open playing Parallax irons."
  - q: "Are Lynx Parallax lofts weak by modern standards?"
    a: "Yes — the 36-degree 7-iron is roughly four to six degrees weaker than a modern game-improvement 7-iron, about a club and a half of difference."
