description: >
  The Parallax was Lynx's flagship game-improvement iron of the 1990s, a
  one-piece investment-cast stainless cavity back designed by David Boone and
  inspired by the Tommy Armour 845s and Ping Eye 2. The first set went to Fred
  Couples at the end of 1991 — he won that December's Johnnie Walker World
  Championship with it and the 1992 Masters on Lynx staff — and Ernie Els won
  the 1994 US Open playing Parallax irons. Lofts are classic early-90s spec
  with a 36-degree 7-iron and 50-degree pitching wedge over a 1-iron-to-LW
  range. Like Ping, Lynx marked the lie on each head: a coloured lynx-head
  stamp in the cavity, white for standard with red two degrees flat and black
  two degrees upright; the lies below are the white-stamp standards. The larger
  Black Cat joined the line in 1995, and original-era production ended with the
  US company's 1998 bankruptcy, though today's UK-owned Lynx has reused the
  Parallax name on new designs.
