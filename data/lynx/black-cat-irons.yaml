faq:
  - q: "What is the loft of a Lynx Black Cat 7-iron?"
    a: "The Lynx Black Cat 7-iron has a loft of 35 degrees, a lie of 62 degrees and a steel-shaft length of 36.5 inches."
  - q: "How do Lynx Black Cat lofts compare with the Parallax?"
    a: "The Black Cat runs about one degree stronger through most of the set — 35 versus 36 degrees at the 7-iron and 47 versus 50 at the pitching wedge — and adds a 51-degree gap wedge the Parallax never had."
  - q: "When were Lynx Black Cat irons made?"
    a: "The original Black Cat joined the Lynx line in 1995 and production of the US-era design ended with the company's 1998 bankruptcy. Later clubs called Black Cat — including the 1998 Black Cat Tour and the Golfsmith-era and modern UK models — are unrelated designs."
