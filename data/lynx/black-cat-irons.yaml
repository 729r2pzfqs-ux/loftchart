description: >
  The Black Cat joined the Lynx line in 1995 as the larger, more forgiving
  partner to the Parallax, another David Boone design from the brand's
  mid-90s peak. The oversize cast cavity back carried notably strong lofts
  for its day — a 35-degree 7-iron, 47-degree pitching wedge and a 15-degree
  1-iron — with a gap wedge in the stock ladder, unusual for 1995. Published
  lengths are for steel shafts, with graphite builds half an inch longer per
  club. Stock options were Lynx's Lite-Lite lightweight True Temper steel,
  True Temper Dynamic Flare steel or Lynx Unifiber graphite, with a Golf
  Pride Wrap grip. Original-era production ended with the US company's 1998
  bankruptcy; a Black Cat Tour players iron appeared in 1998 and Golfsmith
  and today's UK owner later reused the Black Cat name on unrelated designs.
