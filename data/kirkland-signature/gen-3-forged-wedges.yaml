description: >
  Costco's third-generation Kirkland Signature wedges, the first forged set
  in the line, reached the USGA conforming list in April 2026 and went on
  sale in June 2026 at 199.99 dollars for the three-wedge set. The set is
  sold only as a trio — 52, 56 and 60 degrees — with a sandblasted raw face
  replacing the milled face of the first two generations, progressive centre
  of gravity placement, a Kirkland Signature wedge-flex steel shaft and a
  Lamkin Crossline 360 grip, right-handed only at retail. Costco publishes
  only the lofts and construction; the bounce figures charted here are from
  independent review measurements, and no lie angle or length has been
  published, so treat those columns as unverified.
