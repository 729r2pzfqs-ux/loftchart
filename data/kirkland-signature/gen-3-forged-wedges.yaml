faq:
  - q: "What lofts do the Kirkland Signature Gen 3 wedges come in?"
    a: "The set is sold only as a trio: a 52-degree gap wedge, a 56-degree sand wedge and a 60-degree lob wedge, for 199.99 dollars. There are no individual lofts, grinds or bounce options."
  - q: "Are the Kirkland Gen 3 wedges forged?"
    a: "Yes — the third generation moved to forged mild carbon steel with a sandblasted raw face, where the first two generations were cast with milled faces."
  - q: "What bounce do the Kirkland Gen 3 wedges have?"
    a: "Costco does not publish bounce figures. Independent review measurements put them at roughly 10 degrees on the 52 and 56 and 8 degrees on the 60, in line with the Gen 2 set."
