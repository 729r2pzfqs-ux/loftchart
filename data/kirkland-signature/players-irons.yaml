faq:
  - q: "What is the loft of a Kirkland Signature Player's 7-iron?"
    a: "The Kirkland Signature Player's 7-iron has a loft of 31 degrees, with a 62.5-degree lie and a 37-inch steel shaft - confirmed independently by Driving Range Heroes, Golf Monthly and Today's Golfer."
  - q: "What clubs come in the Kirkland Signature Player's iron set?"
    a: "It is a fixed seven-club set: 4-, 5-, 6-, 7-, 8- and 9-irons plus a 45-degree pitching wedge. There are no individual clubs, no left-handed option and only two configurations - regular or stiff flex in the True Temper Elevate 115 steel shaft."
  - q: "How much do the Kirkland Signature Player's irons cost?"
    a: "The set launched at $499 including shipping in December 2023 and sold out within hours; Costco's online price was later listed at $549.99. Costco applies a two-sets-per-member limit."
  - q: "Are the Kirkland Signature Player's irons like the TaylorMade P790?"
    a: "They resemble it: both are hollow-body players distance irons with a polymer/urethane fill and tungsten weighting. In Today's Golfer robot-assisted testing the Kirkland gave up about 2.9 mph of ball speed and 7 yards of 7-iron carry to the 2023 P790, at roughly a third of the price."
