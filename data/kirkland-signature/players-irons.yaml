description: >
  The Kirkland Signature Player's irons are Costco's house-brand iron set, sold only as a
  fixed seven-club box - 4-iron through pitching wedge - at $499 when it debuted in December
  2023 (Costco's online price later rose to $549.99). The head is a hollow-body players
  distance design with a stainless steel body, an injected urethane insert behind the face and
  an internal tungsten weight, in a mirror-chrome finish whose shaping drew immediate
  comparisons to TaylorMade's P790. Configuration options are minimal: right handed only, a
  True Temper Elevate 115 steel shaft in regular or stiff flex, and a Lamkin Crossline 360
  grip, with a two-sets-per-member purchase limit. Lofts are moderately strong, with a
  31-degree 7-iron and 45-degree pitching wedge. Costco publishes only the shaft, grip and
  set composition, not a per-club table, so the loft, lie and length figures below come from
  Driving Range Heroes' review of a retail set, with the 31-degree 7-iron independently
  confirmed by Golf Monthly and Today's Golfer. The initial run sold out within hours and the
  set has restocked intermittently since.
