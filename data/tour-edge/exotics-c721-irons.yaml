description: >
  The Exotics C721 is the Competition Spec iron of Tour Edge's premium
  Exotics 721 series, announced in January 2021 with retail from
  1 February 2021. It is a hollow-body players-distance iron: a
  military-grade maraging steel L-cup face wraps into the sole for rebound,
  Diamond Face 2.0 variable-thickness geometry works behind it, and the
  hollow chamber is filled with Dual VIBRCOR TPU for feel — the technology's
  Hot Launch debut came only later. The competition shape carries a thinner
  top line than the E721, with mid-strong lofts around a 30-degree 7-iron.
  Tour Edge fitted stock shafts by swing speed: KBS TGI Tour graphite for
  slower swings, Project X HZRDUS Smoke Black RDX 80 graphite or True Temper
  Elevate 95 steel for faster ones. Sold right-handed with a Lamkin
  Crossline 360 grip.
