faq:
  - q: "What is the loft of a Tour Edge Exotics C721 7-iron?"
    a: "The Exotics C721 7-iron has a loft of 30 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "What is the difference between the Exotics C721 and E721?"
    a: "The C721 is the hollow-body Competition Spec players-distance iron with a thinner top line and milder lofts (30-degree 7-iron); the E721 is the Extreme Spec game-improvement model built as a 360-degree undercut cavity back with stronger power lofts (27.5-degree 7-iron) and more toe weighting."
  - q: "What shafts did the Exotics C721 irons come with?"
    a: "Tour Edge specified stock shafts by swing speed: KBS TGI Tour graphite for swings of 85mph and below, and either the Project X HZRDUS Smoke Black RDX 80 graphite or True Temper Elevate 95 steel above that."
  - q: "What is the Exotics C721 face made of?"
    a: "A military-grade maraging steel L-cup face that wraps into the sole, combined with Diamond Face 2.0 variable-thickness geometry behind it, over a hollow body filled with Dual VIBRCOR TPU."
