faq:
  - q: "What is the loft of a Tour Edge Hot Launch C522 7-iron?"
    a: "The Hot Launch C522 7-iron has a loft of 29 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "How do the C522 lofts compare with the C521?"
    a: "The C522 strengthened the whole ladder — the 7-iron went from 31 to 29 degrees and the pitching wedge from 44 to 43 — and that stronger ladder then carried through the C523 and C524 unchanged."
  - q: "What is VIBRCOR in the Hot Launch C522?"
    a: "VIBRCOR is a high-grade TPU material injected into the deep undercut cavity. It damps sound and vibration for better feel while contributing to the perimeter weighting, and the C522 was the first Hot Launch iron to use it."
  - q: "What shafts did the Hot Launch C522 irons come with?"
    a: "The stock graphite shaft was Mitsubishi Chemical's super-light Fubuki HL at 50 to 60 grams depending on flex, with the KBS Max 80 as the stock steel option."
