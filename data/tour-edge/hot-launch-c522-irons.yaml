description: >
  The Hot Launch C522 is the second Competition Spec iron in Tour Edge's
  value line, announced in autumn 2021 and at retail from November 2021 as
  the 2022-season line. It strengthens the C-range ladder by two to three
  degrees over the C521 — a 29-degree 7-iron and 43-degree pitching wedge
  that would carry through the C523 and C524 unchanged — and introduces
  VIBRCOR, a feel-enhancing TPU fill inside an expanded 360-degree undercut
  cavity, to the Hot Launch line. The wide-sole, toe-weighted 431 stainless
  head carries over, the stock graphite shaft moved to Mitsubishi Chemical's
  50-60 gram Fubuki HL, and the KBS Max 80 remained the steel option. Sold
  right-handed with matching C522 hybrids for combo sets.
