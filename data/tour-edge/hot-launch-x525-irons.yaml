description: >
  The Hot Launch X525 Ironwood is the hollow-body model of Tour Edge's 2025
  Hot Launch 525 Series, announced on 18 February 2025 with retail from
  1 March 2025. The generation renamed both ranges: the old E-range
  iron-wood concept became the X525 — Tour Edge's own comparison chart
  labels it the Super Game Improvement iron against the E525 cavity back's
  Game Improvement — so the X525 succeeds the E524 despite the different
  letter. The recipe is the familiar one: hollow-body perimeter weighting
  for metalwood-style ball speed, an anti-slice offset design, the patented
  Houdini Sole with its curved leading edge, and an ultra-shallow face for
  easy height. Unusually for the line, Tour Edge published offset for this
  chart, tapering from 4.5mm in the long irons to 1.5mm at the AW. Stock
  shafts are the UST Mamiya Helium Black graphite (59-64 grams) and True
  Temper Elevate MPH 95 steel, in right and left hand.
