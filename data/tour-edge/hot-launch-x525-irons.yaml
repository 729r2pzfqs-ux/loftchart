faq:
  - q: "What is the loft of a Tour Edge Hot Launch X525 7-iron?"
    a: "The Hot Launch X525 7-iron has a loft of 29 degrees, a lie of 62.0 degrees, 2.5mm of offset and a length of 37.25 inches."
  - q: "Is the Hot Launch X525 a game-improvement or super-game-improvement iron?"
    a: "Tour Edge's own comparison chart labels the X525 Ironwood 'Super Game Improvement' — the hollow-body successor to the E-series iron-woods — while the E525 cavity back took over the standard game-improvement slot in the 525 generation."
  - q: "Why did Tour Edge's iron-wood change from an E name to X525?"
    a: "The 2025 Hot Launch 525 Series dropped the old C/E naming: the traditional cavity back became the E525 and the hollow-body iron-wood became the X525, so the X525 succeeds the E524 despite the new letter."
  - q: "What shafts did the Hot Launch X525 come with?"
    a: "The stock graphite shaft is the UST Mamiya Helium Black with Nanocore technology, at 59 to 64 grams across A, R and S flexes, with the True Temper Elevate MPH 95 as the steel option."
