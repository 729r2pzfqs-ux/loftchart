description: >
  The Exotics E723 was the Extreme-spec game-improvement iron in Tour Edge's
  Exotics 723 Series, announced 7 February 2023 with pre-sale from 8 February
  and retail availability from 1 March 2023. It uses a one-piece high-strength
  steel body with a deep 360-degree undercut pocket injected with VIBRCOR TPU,
  a multi-material electroform cap incorporating carbon fiber, extreme toe
  weighting for added MOI, and a Diamond Face VFT face with 99 diamond-shaped
  variable-thickness zones. Its lofts are far stronger than the companion
  C723's — 27.5 degrees at the 7-iron and 42 at the pitching wedge, against
  the C723's 30 and 44 — and the line runs from a 19-degree 4-iron through
  46-degree AW, 51-degree GW and 56-degree SW scoring clubs. Pricing was
  $99.99 per club in steel ($699.99 for a 7-piece set) and $114.99 in graphite
  ($799.99). It was replaced by the Exotics E725 when the 725 iron family was
  announced on 3 October 2024. Tour Edge does not publish offset, bounce or
  swing weight for this model, so those keys are omitted.
