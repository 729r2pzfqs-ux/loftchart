faq:
  - q: "What is the loft of a Tour Edge Exotics E723 7-iron?"
    a: "The Exotics E723 7-iron has a loft of 27.5 degrees, with a 62.5-degree lie and a 37.25-inch standard steel length — 2.5 degrees stronger than the companion Exotics C723."
  - q: "What is the difference between the Tour Edge Exotics E723 and C723?"
    a: "The E723 is the larger Extreme-spec game-improvement model with a one-piece undercut body, carbon fiber cap and much stronger lofts (27.5-degree 7-iron). The C723 is the compact hollow-body players-distance model with more traditional lofts (30-degree 7-iron)."
  - q: "What clubs were available in the Tour Edge Exotics E723 irons?"
    a: "The E723 ran from a 19-degree 4-iron through the 42-degree PW, plus 46-degree AW, 51-degree GW and 56-degree SW scoring clubs, in right- and left-handed options."
