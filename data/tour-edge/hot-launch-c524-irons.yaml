description: >
  The Hot Launch C524 was the Competition Spec (C-range) iron in Tour Edge's
  value-priced Hot Launch 524 Series, the eighth generation of the Hot Launch
  line, announced in early February 2024 and at retail from 1 March 2024. It
  is a traditional cavity-back cast from soft 431 stainless steel, with a wide
  sole, a deep 360-degree undercut cavity filled with VIBRCOR TPU, toe
  weighting and power lofting (29-degree 7-iron, 43-degree PW). The primary
  stock shaft is the ultra-light Aldila Ascent PL graphite, with the True
  Temper Elevate MPH 95 steel as the stock steel option, and the set was sold
  in right- and left-handed 4-PW, 5-PW/AW and 5-PW/SW configurations; the
  table below is the standard men's spec, with women's builds one inch
  shorter. When the Hot Launch 525 Series arrived in February 2025 the
  C-range name was dropped in favour of E and X ranges, so the C524 has no
  like-named successor. Tour Edge does not publish offset, bounce or swing
  weight for this model, so those keys are omitted.
