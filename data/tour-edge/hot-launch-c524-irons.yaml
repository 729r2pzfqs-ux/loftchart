faq:
  - q: "What is the loft of a Tour Edge Hot Launch C524 7-iron?"
    a: "The Hot Launch C524 7-iron has a loft of 29 degrees, with a 62.5-degree lie and a 37.25-inch standard men's length."
  - q: "What is the difference between the Tour Edge Hot Launch C524 and E524?"
    a: "The C524 is the Competition Spec game-improvement model: a traditional cavity back in soft 431 stainless steel with a thinner topline and modest offset. The E524 is the Extreme Spec super-game-improvement model in the same series, built with a shallower face, more offset and hybrid-like long irons for maximum launch help."
  - q: "When did the Tour Edge Hot Launch C524 irons come out?"
    a: "Tour Edge announced the Hot Launch 524 Series in early February 2024, with retail availability from 1 March 2024. The line was superseded when the Hot Launch 525 Series (E525 and X525 ranges) was announced on 18 February 2025."
  - q: "What clubs come in a stock Hot Launch C524 set?"
    a: "Stock sets were offered as 4-iron through pitching wedge, 5-iron through pitching wedge plus AW, or 5-iron through pitching wedge plus SW, in both right- and left-handed versions."
