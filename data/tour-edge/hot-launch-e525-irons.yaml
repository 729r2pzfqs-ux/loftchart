description: >
  The Hot Launch E525 is the cavity-back model of Tour Edge's 2025 Hot Launch
  525 Series, announced on 18 February 2025. The generation dropped the old
  C-range name: the traditional cavity back became the E525 and the
  hollow-body iron-wood became the X525, so the E525 follows the C524 in
  design despite the different letter. It is cast from 431 stainless steel
  with a wide sole, a 360-degree undercut cavity filled with VIBRCOR TPU and
  visible toe weighting. Lofts are stronger than the C524's, with a
  27.5-degree 7-iron and 42-degree pitching wedge, and Tour Edge published
  offset for the chart, tapering from 6 mm in the long irons to 3.5 mm at the
  AW. Stock shafts are the UST Mamiya Helium Black graphite and True Temper
  Elevate MPH 95 steel. The Hot Launch Max series replaced the 525 line in
  February 2026.
