faq:
  - q: "What is the loft of a Tour Edge Hot Launch E525 7-iron?"
    a: "The Hot Launch E525 7-iron has a loft of 27.5 degrees, a lie of 62.5 degrees and a length of 37.25 inches, with 5 mm of offset."
  - q: "What is the difference between the Hot Launch E525 and X525?"
    a: "The E525 is the traditional cavity back, which Tour Edge labels Game Improvement, with a 27.5-degree 7-iron. The X525 is the hollow-body iron-wood, labelled Super Game Improvement, with a 29-degree 7-iron."
  - q: "How do the Hot Launch E525 lofts compare with the C524?"
    a: "The E525 is stronger throughout. The 4-iron is 19 degrees against 20, the 7-iron 27.5 against 29, the pitching wedge 42 against 43 and the AW 46 against 48. Lies and lengths are the same."
  - q: "What are Hot Launch E525 irons made of?"
    a: "They are cast from 431 stainless steel, with VIBRCOR TPU in a deep undercut cavity."
