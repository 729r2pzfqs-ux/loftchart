description: >
  The Hot Launch HL3 iron is the third generation of Tour Edge's value-priced,
  custom-fit game-improvement line, released 12 February 2018. Cast from soft
  431 stainless steel, it pairs an expanded undercut cavity with variable face
  thickness for forgiveness and ball speed on off-center hits; the 3- through
  7-irons add a notch hosel that repositions weight toward the toe for a
  larger sweet spot, while the 8-iron through pitching wedge use a more
  traditional construction for control. Substantial offset and a wide sole
  target high-handicap players who want easy launch and distance. The set
  runs 3-iron through lob wedge, with the PW-LW wedges all built to the same
  35.75-inch length. Stock shafts were the KBS Tour 90 steel or UST Mamiya
  for Tour Edge graphite, with a seven-piece set priced at $420 in steel and
  $490 in graphite. It was replaced by the Hot Launch HL4 the following year.
