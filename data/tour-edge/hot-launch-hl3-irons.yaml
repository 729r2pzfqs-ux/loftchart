faq:
  - q: "What is the loft of a Tour Edge Hot Launch HL3 7-iron?"
    a: "The Hot Launch HL3 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a standard length of 37.25 inches."
  - q: "What is a notch hosel on the Tour Edge HL3 irons?"
    a: "It is a hosel design used on the 3- through 7-irons that repositions head weight toward the toe, enlarging the effective sweet spot for off-center hits. The 8-iron through pitching wedge use a more traditional hosel and construction for control."
  - q: "What clubs came in the Tour Edge Hot Launch HL3 iron set?"
    a: "A full 3-iron-through-lob-wedge range, with the pitching wedge, approach wedge, sand wedge and lob wedge all built to the same 35.75-inch length and 64-degree lie."
