faq:
  - q: "What is the loft of a Tour Edge Exotics EXS 7-iron?"
    a: "The Exotics EXS 7-iron has a loft of 27.5 degrees, a lie of 62.5 degrees and a standard length of 37.25 inches."
  - q: "How strong is the Tour Edge Exotics EXS 5-iron loft?"
    a: "At 21.5 degrees, it was among the strongest 5-iron lofts in the game-improvement category at its October 2018 launch — only a couple of niche competitor models were stronger at the time."
  - q: "What clubs came in the Tour Edge Exotics EXS iron set?"
    a: "A seven-piece stock set ran 4-iron through pitching wedge, with AW, GW and SW available as additional pieces, for a full 4-through-SW range."
