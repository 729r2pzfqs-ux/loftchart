description: >
  The Exotics EXS was Tour Edge's first "unapologetically strong"-lofted
  distance iron, announced 10 October 2018 for 1 November 2018 retail (the
  set is nonetheless widely sold and reviewed as a 2019-model-year club).
  Founder Dave Glod built it around a hollow lower cavity and a forged cup
  face with a web-shaped variable-thickness pattern to boost ball speed and
  limit falloff on off-center hits, a 19-gram tungsten weight in the mid-toe
  of the 4- through 7-irons for stability, and a thermoplastic-elastomer
  insert (with a vibration-damping gel coating) fitted into the top of the
  hollow cavity to control feel. A distinctive ramped sole raises the middle
  section to open up heel and toe relief for turf interaction. The 21.5-degree
  5-iron was among the strongest in the game-improvement category at launch.
  The seven-piece set (4-PW) retailed for $700 in steel, $800 in graphite,
  with AW, GW and SW available; stock shafts were the KBS Max 80 steel and
  Mitsubishi Tensei CK Blue graphite.
