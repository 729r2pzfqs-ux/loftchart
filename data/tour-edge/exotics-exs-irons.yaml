sources:
  - "golfdigest.com 'Tour Edge Exotics EXS irons make distance push with hollow design, multiple materials and strong lofts' (Mike Stachura, 10 Oct 2018) — the manufacturer briefing: hollow lower-cavity construction with a forged cup face and web-shaped variable-thickness design, 19-gram tungsten toe weight in the 4-7 irons, thermoplastic-elastomer damping insert with a vibration-control gel coating, the ramped sole design, the 4-iron-to-56-degree-sand-wedge range, KBS Max 80 steel / Mitsubishi Tensei CK Blue graphite stock shafts, 1 November 2018 retail availability and $700 (steel) / $800 (graphite) seven-piece set pricing."
