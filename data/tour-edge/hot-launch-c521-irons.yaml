description: >
  The Hot Launch C521 is the first Competition Spec (C-range) iron in Tour
  Edge's value line, introduced when the fifth Hot Launch generation split
  into C and E ranges; it was announced in October 2020 and sold as the
  2021-season line. It keeps the HL4 iron's loft ladder — a 31-degree 7-iron
  and 44-degree pitching wedge — on a 431 stainless cavity back with an
  expanded undercut cavity, wide sole, chamfered top line and toe weighting.
  The stock graphite shaft is the Aldila Rogue, chosen from robot testing,
  with the lightweight KBS Max 80 as the steel option, and sets were sold in
  right and left hand with the usual Tour Edge custom-fit program.
