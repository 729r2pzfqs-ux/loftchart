faq:
  - q: "What is the loft of a Tour Edge Hot Launch C521 7-iron?"
    a: "The Hot Launch C521 7-iron has a loft of 31 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "What is the difference between the Tour Edge C521 and E521?"
    a: "The C521 Competition Spec is a traditional cavity-back iron for game-improvement players; the E521 Extreme Spec is a hollow-body iron-wood with weaker lofts, a shallow face and slice-fighting offset for golfers who need maximum launch help."
  - q: "What shafts did the Hot Launch C521 irons come with?"
    a: "The stock graphite shaft was the Aldila Rogue, with the lightweight, high-launching KBS Max 80 as the stock steel option."
  - q: "When did the Tour Edge Hot Launch C521 irons come out?"
    a: "Tour Edge announced the Hot Launch 521 series in October 2020 and sold it as the 2021-season line; the 522 series replaced it a year later."
