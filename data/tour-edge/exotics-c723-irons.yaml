description: >
  The Exotics C723 was the players-distance iron in Tour Edge's Exotics 723
  Series, announced 7 February 2023 with pre-sale from 8 February and retail
  availability from 1 March 2023. It pairs a military-grade maraging steel
  L-Cup face, plasma-welded to a 17-4 stainless steel hollow body filled with
  VIBRCOR TPU, with the Diamond Face VFT variable-thickness face pattern, in a
  clubhead Tour Edge lists as 15 percent smaller, with a shorter blade length
  and a thinner topline than the larger E723. Its loft ladder carries over unchanged from the C722 —
  30 degrees at the 7-iron and 44 at the pitching wedge — which Tour Edge
  described as more traditional lofting than the stronger-lofted E723. Stock
  7-piece sets were 4-PW or 5-PW plus AW, with heads offered from the 3-iron
  through the 49-degree AW; Tour Edge does not publish offset, bounce or swing
  weight for this model, so those keys are omitted.
