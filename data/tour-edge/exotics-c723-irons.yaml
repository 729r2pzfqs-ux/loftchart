faq:
  - q: "What is the loft of a Tour Edge Exotics C723 7-iron?"
    a: "The Exotics C723 7-iron has a loft of 30 degrees, with a 62.5-degree lie and a 37.25-inch standard steel length."
  - q: "What is the difference between the Tour Edge Exotics C723 and E723?"
    a: "The C723 is the players-distance model: a more compact head — Tour Edge lists the clubhead as 15 percent smaller — with a shorter blade length, thinner topline and more traditional lofts (30-degree 7-iron, 44-degree PW). The E723 is the larger, stronger-lofted game-improvement model in the same 723 Series."
  - q: "When did the Tour Edge Exotics C723 irons come out?"
    a: "Tour Edge announced the Exotics 723 Series irons on 7 February 2023, with pre-sale from 8 February and worldwide retail availability from 1 March 2023. The C723 was effectively replaced when the Exotics 725 iron family (C725, E725, X725) was announced in October 2024."
  - q: "What clubs come in a stock Exotics C723 set?"
    a: "Stock 7-piece sets were 4-iron through pitching wedge or 5-iron through pitching wedge plus a 49-degree AW, with individual heads offered from the 3-iron through the AW."
