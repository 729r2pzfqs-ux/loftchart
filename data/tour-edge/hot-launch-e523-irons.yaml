description: >
  The Hot Launch E523 Iron-Wood is the third Extreme Spec model in Tour
  Edge's value line, announced on 11 October 2022 and at retail from
  1 November 2022 as the 2023-season line at $99.99 per club. The numbers
  carry over from the E522 unchanged — a 20-degree #3 through 49-degree AW
  around a 32-degree 7-iron — but the head moved from hybrid-like towards a
  sleeker hollow-body iron: new concave body shaping slims the top line and
  hides the back end at address, while the patented Houdini Sole, shallow
  face, slice-fighting offset and extreme perimeter weighting stay. Stock
  shafts are the UST Mamiya HL-SST graphite (49-65 grams) and True Temper
  XP-85 steel, and the stock combo set paired 4 and 5 hybrids with 6-PW
  iron-woods in both right and left hand.
