faq:
  - q: "What is the loft of a Tour Edge Hot Launch E523 7-iron?"
    a: "The Hot Launch E523 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "What changed between the Hot Launch E522 and E523?"
    a: "The spec chart is identical; the change is the head. The E523 adopted concave body shaping that slims the top line and makes the bulbous back end less visible at address, moving the look from hybrid-like towards a hollow-body iron."
  - q: "Why does the E523 have weaker lofts than the C523?"
    a: "As a super-game-improvement iron-wood, the E523's distance comes from its metalwood-style hollow body and very low CG rather than strong lofts — the extra loft (32 versus 29 degrees at the 7-iron) helps its slower-swinging target player flight the ball."
  - q: "What did the Hot Launch E523 stock combo set include?"
    a: "The standard set combined 4 and 5 Hot Launch hybrids with 6-iron through pitching wedge iron-woods, for both men and women in right or left hand."
