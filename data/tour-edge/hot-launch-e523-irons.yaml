  - "touredge.com/hotlaunche523ironwoods official product page, archive.org snapshot of 29 November 2022 — the manufacturer club specification chart, which is the same loft/lie/length table as the E522 (Tour Edge reused the E522 chart image because the numbers are unchanged), plus the UST Mamiya HL-SST stock shaft copy, the Lamkin Z5 grip, right- and left-hand availability and the included headcover."
