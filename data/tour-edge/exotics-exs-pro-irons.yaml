faq:
  - q: "What is the loft of a Tour Edge Exotics EXS Pro 7-iron?"
    a: "The Exotics EXS Pro Forged 7-iron has a loft of 32 degrees, a lie of 62 degrees and a standard length of 36.75 inches."
  - q: "How limited was the Tour Edge Exotics EXS Pro release?"
    a: "Very: Tour Edge built only 250 sets of the EXS Pro Forged, released 15 June 2020 at $149.99 per club, developed with feedback from PGA Tour players and extensive robotic testing."
  - q: "What is the difference between the Exotics EXS Pro Forged and Exotics EXS Blade?"
    a: "Both launched the same day from the same S25C carbon steel, but the Pro Forged is a compact cavity back with a slightly thicker top line and stronger lofts (25-degree 5-iron), while the Blade is a true muscle-back with a thinner top line and weaker lofts (27-degree 5-iron)."
