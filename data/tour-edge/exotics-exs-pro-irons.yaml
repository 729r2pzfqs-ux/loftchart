description: >
  The Exotics EXS Pro Forged was a limited-edition, tour-driven players iron
  released 15 June 2020 in a run of just 250 sets, built from higher-grade
  Japanese S25C carbon steel and CNC-milled throughout. It pairs a compact,
  short heel-to-toe forged cavity-back shape with a 10-gram tungsten toe
  weight in the 3- through 6-irons for extra forgiveness, and an acoustic
  engineering cavity insert combining steel, ABS polymer and a damping gel
  for feel. It launched alongside a companion true-blade model, the Exotics
  EXS Blade, which uses weaker lofts (27-degree 5-iron versus this model's
  25) and a thinner top line; the Pro Forged has a slightly thicker top line
  and a stronger, more distance-oriented loft set for a players club (a
  25-degree 5-iron and 46-degree pitching wedge, developed with PGA Tour
  player feedback and robotic testing).
