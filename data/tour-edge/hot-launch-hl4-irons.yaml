faq:
  - q: "What is the loft of a Tour Edge HL4 7-iron?"
    a: "The Hot Launch HL4 7-iron has a loft of 31 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "What shafts did the Tour Edge HL4 irons come with?"
    a: "Stock options were an UST Mamiya graphite shaft made for Tour Edge in L, A, R and S flexes, or the KBS Tour 90 steel shaft in regular and stiff. Unusually, both builds used the same lengths."
  - q: "What replaced the Tour Edge HL4 irons?"
    a: "The Hot Launch 521 series, announced in October 2020, split the line into the C521 Competition Spec cavity back — the HL4 iron's direct successor, with the same loft ladder — and the E521 Extreme Spec iron-wood."
  - q: "Are the HL4 wedges the same length as the short irons?"
    a: "Yes — the pitching wedge through lob wedge are all built at 35.75 inches with a 64-degree lie, an unusually uniform wedge setup."
