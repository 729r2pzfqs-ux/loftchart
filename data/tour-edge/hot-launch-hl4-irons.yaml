description: >
  The HL4 iron is the standard cavity-back model in Tour Edge's fourth
  Hot Launch generation, announced in July 2019 alongside an HL4 Iron-Wood
  and an HL4 Triple Combo set as the brand's value-priced, custom-fit line.
  Cast from soft 431 stainless steel, it pairs an expanded undercut cavity
  with toe weighting and variable face thickness, with modest game-improvement
  lofts — a 31-degree 7-iron and 44-degree pitching wedge. Stock shafts were
  the UST Mamiya-for-Tour Edge graphite or the KBS Tour 90 steel, both built
  to the same lengths, and a seven-piece set sold for $420 in steel. The
  Hot Launch line split into the C (Competition) and E (Extreme) ranges when
  the 521 series arrived in late 2020, making the C521 the HL4 iron's direct
  successor.
