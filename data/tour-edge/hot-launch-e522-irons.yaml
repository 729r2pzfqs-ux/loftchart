faq:
  - q: "What is the loft of a Tour Edge Hot Launch E522 7-iron?"
    a: "The Hot Launch E522 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "What changed between the Hot Launch E521 and E522?"
    a: "Very little in the numbers — the loft, lie and length chart is identical. The E522 updated the cosmetics and moved the stock graphite shaft from the FUBUKI metalwood profile to the lighter Fubuki HL, and added matching hybrids for combo sets."
  - q: "Who are the Hot Launch E522 iron-woods for?"
    a: "Slower-swinging golfers who struggle to launch conventional irons. The hollow metalwood-style body, shallow face, big offset and Houdini Sole are all aimed at getting the ball airborne and fighting a slice rather than chasing strong-loft distance."
  - q: "Did the Hot Launch E522 come in left hand?"
    a: "Yes, the E522 iron-woods were offered in both right and left hand, with women's builds one inch shorter."
