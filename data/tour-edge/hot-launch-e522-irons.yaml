description: >
  The Hot Launch E522 Iron-Wood is the second Extreme Spec model in Tour
  Edge's value line, announced in autumn 2021 and at retail from November
  2021 as the 2022-season line. The formula is unchanged from the E521 —
  hollow-body perimeter weighting, a shallow face, slice-fighting offset and
  the patented Houdini Sole that cuts turf drag by a claimed 35 percent — and
  so is the loft ladder, which runs from a 20-degree #3 to a 49-degree AW
  around a 32-degree 7-iron. The stock shaft moved to Mitsubishi Chemical's
  50-60 gram Fubuki HL graphite, and unlike the C522 the E522 was offered in
  both right and left hand, each club shipping with a headcover. Matching
  E522 hybrids allowed combo sets.
