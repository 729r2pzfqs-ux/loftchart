sources:
  - "golfdigest.com 'Tour Edge Exotics EXS 220 and 220h irons push distance with hollow design and strong lofts' (Mike Johnson, 13 Jan 2020) — the manufacturer briefing: hollow-cavity 4-7 irons with a forged maraging-steel cup face and web-shaped variable-thickness design, 19-gram tungsten toe weight in the 4-7 irons, solid 431 stainless-steel construction for the 8-SW short irons, the ramped sole carried over from the EXS, the TPE-polymer/gel damping insert, robot-tested shaft fitting, the 48-hour custom-delivery program, and $880 eight-piece steel-shaft set pricing ($20/club more in graphite)."
