faq:
  - q: "What is the loft of a Tour Edge Exotics EXS 220 7-iron?"
    a: "The Exotics EXS 220 7-iron has a loft of 27.5 degrees, a lie of 62.5 degrees and a standard length of 37.25 inches — unchanged from the original EXS."
  - q: "What changed between the Tour Edge Exotics EXS and EXS 220?"
    a: "The loft, lie and length table carried over unchanged. The EXS 220 specified its forged 4-7 iron cup face as maraging steel and moved the 8-through-SW short irons to a solid 431 stainless-steel construction, and Tour Edge added robot-tested shaft fitting across the line."
  - q: "What is the difference between the Tour Edge Exotics EXS 220 and EXS 220h?"
    a: "The 220 is the standard hollow/solid hybrid-construction game-improvement iron described here. The 220h is a separate, more forgiving hollow-body iron-wood built from 17-4 stainless steel with a wider 26.5mm sole, aimed at higher-MOI, easier-launching players."
