description: >
  The Exotics EXS 220 succeeded the original EXS on 13 January 2020, keeping
  the same "distance, distance, distance" brief from founder Dave Glod: a
  19-degree 4-iron through a 42-degree pitching wedge, unchanged from the
  EXS lofts. The 4- through 7-irons carry over the hollow-cavity, forged
  cup-face construction, now specified as maraging steel, with the same
  19-gram tungsten toe weight for stability; the 8-iron through sand wedge
  switch to a solid 431 stainless-steel construction. The EXS 220 keeps the
  EXS's ramped sole design and a TPE polymer insert coated in a shock-
  absorbing gel for feel. Tour Edge robot-tested a wide range of shafts to
  fit optimal options to each flex, and the set was included in the brand's
  48-hour custom-delivery program. The eight-piece set (steel shaft) retailed
  for $880, $20 more per club in graphite. A companion hollow-body iron-wood,
  the EXS 220h, launched alongside it as the more forgiving stablemate.
