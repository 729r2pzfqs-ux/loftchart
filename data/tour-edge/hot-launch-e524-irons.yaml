faq:
  - q: "What is the loft of a Tour Edge Hot Launch E524 7-iron?"
    a: "The Hot Launch E524 7-iron has a loft of 32 degrees, with a 62.5-degree lie and a 37.25-inch standard men's length."
  - q: "What is the difference between the Tour Edge Hot Launch E524 and C524?"
    a: "The E524 is a fully hollow iron-wood with a super-shallow face, Houdini Sole, strong offset and heel-weighted draw bias, built for maximum launch and slice correction. The C524 is the more conventional 431 stainless steel cavity back in the same series, with slightly stronger lofts in the scoring clubs (29-degree vs 32-degree 7-iron)."
  - q: "When did the Tour Edge Hot Launch E524 irons come out?"
    a: "Tour Edge announced the Hot Launch 524 Series in early February 2024, with retail availability from 1 March 2024 at $99.99 per iron. The hollow iron-wood role passed to the Hot Launch X525 when the 525 Series was announced on 18 February 2025."
