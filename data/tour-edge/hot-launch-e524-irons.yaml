description: >
  The Hot Launch E524 was the Extreme Spec (E-range) iron-wood in Tour Edge's
  value-priced Hot Launch 524 Series, announced in early February 2024 and at
  retail from 1 March 2024 at $99.99 per club. These fully hollow iron-woods
  put the emphasis on ease of launch and slice correction: the patented Houdini
  Sole places a raised steel mass at the rear of the head and a curved leading
  edge under a super-shallow face, combined with slice-fighting offset and heel
  weighting for draw bias, and the 524 shaping added a wider front-to-back
  profile with a thinner top line. Heads run from a 20-degree 3-iron through a
  49-degree AW in right- and left-handed versions, with the ultra-light Aldila
  Ascent PL graphite as the primary stock shaft and the True Temper Elevate
  MPH 95 steel as the stock steel option; the table below is the standard
  men's spec, with women's builds one inch shorter. When the Hot Launch 525
  Series was announced on 18 February 2025 the hollow iron-wood role passed to
  the new Hot Launch X525. Tour Edge does not publish offset, bounce or swing
  weight figures for this model, so those keys are omitted.
