faq:
  - q: "What is the loft of a Tour Edge Exotics C722 7-iron?"
    a: "The Exotics C722 7-iron has a loft of 30 degrees, with a 62.5-degree lie and a 37.25-inch standard steel length."
  - q: "When did the Tour Edge Exotics C722 irons come out?"
    a: "Tour Edge announced the Exotics 722 Series irons on 15 February 2022, with worldwide retail availability from 5 March 2022. The C722 was replaced by the Exotics C723, announced in February 2023 with the same loft, lie and length specs."
  - q: "What is the difference between the Tour Edge Exotics C722 and E722?"
    a: "The C722 is the smaller players-distance model with a hollow maraging-steel-faced body, a thinner topline and more traditional lofts. The E722 is the larger game-improvement model in the same series, with a one-piece body, wider sole and stronger lofts."
