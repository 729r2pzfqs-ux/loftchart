description: >
  The Exotics C722 was the players-distance iron in Tour Edge's Exotics 722
  Series, announced 15 February 2022 and at retail worldwide from 5 March
  2022 at $899.99 for a 7-piece steel set. It combines a military-grade
  maraging steel L-Cup face with the Diamond Face VFT variable-thickness
  pattern on a hollow, dual-VIBRCOR TPU-filled body, in a player-preferred
  shape with a thinner topline than the companion E722. Its loft ladder —
  30 degrees at the 7-iron, 44 at the pitching wedge — was carried over
  unchanged by the C723 that replaced it in February 2023. Stock 7-piece sets
  were 4-PW or 5-PW plus AW, with heads offered from the 3-iron through the
  49-degree AW; Tour Edge does not publish offset, bounce or swing weight for
  this model, so those keys are omitted.
