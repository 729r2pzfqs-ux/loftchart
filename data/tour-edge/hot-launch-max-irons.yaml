description: >
  The Hot Launch Max is the cavity-back iron in the Hot Launch Max series that
  replaced Tour Edge's 525 line in February 2026, sold alongside the
  hollow-bodied Max D. It keeps the deep undercut cavity and VIBRCOR insert of
  the E525 it follows, with the same lies and lengths, but the lofts are weaker
  through most of the set: 29 degrees at the 7-iron against 27.5, and 43 at
  the pitching wedge against 42. The set runs 4-iron to AW, in right and left
  hand, with a graphite or a steel stock shaft.
