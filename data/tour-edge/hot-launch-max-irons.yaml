faq:
  - q: "What is the loft of a Tour Edge Hot Launch Max 7-iron?"
    a: "The Hot Launch Max 7-iron has a loft of 29 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "Are the Hot Launch Max lofts stronger than the E525?"
    a: "No, they are weaker through most of the set. The 4-iron is 20 degrees against 19 on the E525, the 7-iron 29 against 27.5, the pitching wedge 43 against 42 and the AW 48 against 46. Lies and lengths are the same."
  - q: "What is the pitching wedge loft on the Hot Launch Max?"
    a: "43 degrees, with a 48-degree AW below it."
  - q: "What shafts do the Hot Launch Max irons come with?"
    a: "The stock graphite shaft is the Aldila Ascent in A, R and S flex, and the stock steel shaft is the KBS Max MT 85 in R and S flex."
