faq:
  - q: "What is the loft of a Tour Edge Exotics E721 7-iron?"
    a: "The Exotics E721 7-iron has a loft of 27.5 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "Is the Exotics E721 a hollow-body iron like the C721?"
    a: "No. The E721 uses a 360-degree undercut cavity-back construction with extreme toe weighting and Dual VIBRCOR TPU fill, while the C721 is the hollow-body model with the maraging steel L-cup face."
  - q: "Why are the Exotics E721 lofts so strong?"
    a: "The E721 is power-lofted by design — a 27.5-degree 7-iron and 42-degree pitching wedge — with the low, deep centre of gravity of the undercut head doing the launching, which is the opposite recipe from Tour Edge's weak-lofted Hot Launch E-series iron-woods."
  - q: "What shafts did the Exotics E721 irons come with?"
    a: "Stock shafts were matched to swing speed: KBS TGI Tour graphite in 50, 60, 70 or 80 gram builds through the flexes, with the True Temper XP85 steel offered for swings above 95mph."
