description: >
  The Exotics E721 is the Extreme Spec iron of Tour Edge's premium Exotics
  721 series, announced in January 2021 with retail from 1 February 2021.
  Where the C721 sibling is a hollow-body players-distance design, the E721
  is a distance-first game-improvement iron: a 360-degree undercut cavity
  raises launch and frees the Diamond Face 2.0 variable-thickness face to
  flex, extreme toe weighting elongates the sweet spot, Dual VIBRCOR TPU
  damps the strike, and a power-lofted setup runs a 27.5-degree 7-iron and
  42-degree pitching wedge. Stock shafts were fitted by swing speed — KBS
  TGI Tour graphite in 50 through 80 gram builds, or the True Temper XP85
  steel for the fastest bracket — with a Lamkin Crossline 360 grip,
  right-handed.
