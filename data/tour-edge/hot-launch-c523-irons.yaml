description: >
  The Hot Launch C523 is the third Competition Spec iron in Tour Edge's
  value line, announced on 11 October 2022 and at retail from 1 November
  2022 as the 2023-season line at $79.99 per club. The 431 stainless cavity
  back keeps the C522's exact loft, lie and length chart — a 29-degree
  7-iron that Tour Edge's own launch material placed at the milder end of
  modern game-improvement lofts — while reshaping the head with a more
  compact profile, a sharper high toe, a thinner top line and a slightly
  wider sole, with VIBRCOR TPU in the deep undercut cavity for feel. Stock
  shafts moved to the UST Mamiya HL-SST graphite (49-65 grams) and True
  Temper XP-85 steel, with the Lamkin Z5 grip, right- and left-hand
  availability and 4-iron-through-lob-wedge fitting range.
