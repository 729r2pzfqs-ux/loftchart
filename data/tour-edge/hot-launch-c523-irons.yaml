faq:
  - q: "What is the loft of a Tour Edge Hot Launch C523 7-iron?"
    a: "The Hot Launch C523 7-iron has a loft of 29 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "Did the C523 change lofts from the C522?"
    a: "No. The loft, lie and length chart is identical to the C522's; the changes were in head shaping — a more compact profile, sharper high toe, thinner top line and slightly wider sole — rather than the ladder."
  - q: "What shafts did the Hot Launch C523 irons come with?"
    a: "The stock graphite shaft was the UST Mamiya HL-SST, running from a 49-gram ladies flex to 65-gram stiff and extra-stiff, with the True Temper XP-85 steel in regular and stiff as the steel option."
  - q: "How much did the Tour Edge C523 irons cost?"
    a: "They launched at $79.99 per club on 1 November 2022, keeping the Hot Launch line's value positioning."
