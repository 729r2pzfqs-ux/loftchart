faq:
  - q: "What is the loft of a Tour Edge Hot Launch E521 7-iron?"
    a: "The Hot Launch E521 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "Why are the Hot Launch E521 lofts weaker than the C521's?"
    a: "The E521 is a hollow-body iron-wood aimed at slower swing speeds: its distance comes from metalwood-style face flex and an extremely low, deep centre of gravity, and the weaker lofts — 32 degrees at the 7-iron against the C521's 31 with a much weaker ladder above it — help those players actually get the ball airborne."
  - q: "Do Tour Edge E521 iron-woods come with headcovers?"
    a: "Yes, every E521 iron-wood shipped with its own headcover, reflecting its hybrid-like construction."
  - q: "What shafts did the Hot Launch E521 come with?"
    a: "The stock build used Mitsubishi Chemical's super-light FUBUKI graphite metalwood shafts at 55 to 60 grams depending on flex, with the KBS Max 80 as the stock steel option."
