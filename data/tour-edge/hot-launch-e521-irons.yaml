description: >
  The Hot Launch E521 Iron-Wood is the first Extreme Spec (E-range) model in
  Tour Edge's value line, announced in October 2020 alongside the C521 and
  sold as the 2021-season line. It is a hollow-body iron-wood: metalwood-style
  perimeter weighting, a super-shallow face, slice-fighting offset with heel
  weighting, and the patented Houdini Sole that moves mass low and deep while
  cutting turf drag. Lofts are deliberately weak for the category — a
  32-degree 7-iron — because the distance recipe is metalwood-style launch
  rather than strong lofts. Stock shafts were Mitsubishi Chemical's
  super-light FUBUKI graphite at 55 to 60 grams, with the KBS Max 80 as the
  steel option; each club shipped with a headcover.
