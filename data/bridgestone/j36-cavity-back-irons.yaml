faq:
  - q: "What is the loft of a Bridgestone J36 Cavity Back 7-iron?"
    a: "The Bridgestone J36 Cavity Back 7-iron has a loft of 35 degrees, with a 63-degree lie, a 36.75-inch length and a D3 swing weight."
  - q: "Are Bridgestone J36 Cavity Back irons forged?"
    a: "Yes. The heads are premium-forged from 1020 mild carbon steel with progressive muscle thickness through the set for feel."
  - q: "What replaced the Bridgestone J36 Cavity Back?"
    a: "The J38 Cavity Back, part of Bridgestone's next forged iron generation, which arrived as the J36 irons became non-conforming for professional play under the Condition of Competition groove rule from 1 January 2010."
  - q: "What clubs came in a stock Bridgestone J36 Cavity Back set?"
    a: "It was sold right hand only as a 3-iron through pitching wedge set, on a stock Rifle Project X flighted steel shaft."
