description: >
  The J36 Cavity Back was the better-player cavity iron of Bridgestone's J36
  forged line, aimed at "professionals to mid handicap amateurs." The head
  is premium-forged from 1020 mild carbon steel with progressive muscle
  thickness through the set for enhanced feel, a progressive-offset cavity
  design, a tapered sole for shot-making versatility and trailing-edge relief
  for a variety of lies. Lofts are traditional for the era (35-degree
  7-iron, 47-degree pitching wedge), built to a D3 swing weight on a stock
  Rifle Project X flighted steel shaft with a Golf Pride Tour Velvet grip.
  It was sold right hand only as a 3-iron through pitching wedge. The
  Condition of Competition rule made the J36 irons non-conforming for
  professional play from 1 January 2010 (grooves), the same year the J38
  generation succeeded it.
