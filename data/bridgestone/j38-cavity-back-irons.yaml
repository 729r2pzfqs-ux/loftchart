description: >
  The J38 Cavity Back was the better-player iron of Bridgestone's J38 forged
  line, aimed at "professionals to mid handicap amateurs." The midsize head
  is premium-forged from 1020 carbon steel with a magnesium-composite insert
  in the cavity that pushes weight to the perimeter for more forgiveness on
  off-center hits while damping vibration for feel, a tapered sole for
  versatility and trailing/leading-edge relief for a variety of lies. Lofts
  are traditional for the era (35-degree 7-iron, 47-degree pitching wedge),
  every club built to a D1 swing weight, with Project X's flighted steel
  shaft and a Golf Pride Tour Velvet grip as stock. It was sold right hand
  only as a 3-iron through pitching wedge. The J40 Cavity Back succeeded it
  in the 2011 model generation.
