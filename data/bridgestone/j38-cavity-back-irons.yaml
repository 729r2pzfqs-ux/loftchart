faq:
  - q: "What is the loft of a Bridgestone J38 Cavity Back 7-iron?"
    a: "The Bridgestone J38 Cavity Back 7-iron has a loft of 35 degrees, with a 63-degree lie, a 36.75-inch length and a D1 swing weight."
  - q: "What is the magnesium composite insert on the J38 Cavity Back?"
    a: "A lightweight magnesium-composite piece set into the cavity that lets Bridgestone push more discretionary weight to the perimeter for forgiveness, while also damping vibration at impact for a softer feel."
  - q: "What replaced the Bridgestone J38 Cavity Back?"
    a: "The J40 Cavity Back, part of Bridgestone's next forged iron generation."
  - q: "Are Bridgestone J38 Cavity Back irons forged?"
    a: "Yes. The body is premium-forged from 1020 carbon steel, with a magnesium composite insert in the cavity for perimeter weighting."
