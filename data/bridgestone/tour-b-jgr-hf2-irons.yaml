faq:
  - q: "What is the loft of a Bridgestone Tour B JGR HF2 7-iron?"
    a: "The Bridgestone Tour B JGR HF2 7-iron has a loft of 31 degrees, with a 62-degree lie and a 37.25-inch length."
  - q: "Are the Bridgestone Tour B JGR HF2 irons forged?"
    a: "Yes — the head is forged from 1025 carbon steel with an ultra-thin face, and a rubber polymer insert fills the internal cavity to damp vibration and improve sound."
  - q: "What is the Power Slit Face on the JGR HF2?"
    a: "The junction between the face and sole is machined thinner than the surrounding metal so it acts as a hinge at impact, raising ball speed and COR on shots struck low on the face — the most common miss for average golfers."
  - q: "When did the Bridgestone Tour B JGR HF2 come out?"
    a: "Bridgestone announced the Tour B JGR line in August 2018 and the HF2 reached US stores in October 2018 at $899, marketed as a 2019-model-year iron."
