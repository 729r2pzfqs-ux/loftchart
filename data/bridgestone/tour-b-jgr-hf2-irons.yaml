description: >
  The Tour B JGR HF2 was the classic-shaped cavity-back of Bridgestone's
  Tour B JGR distance line, announced in August 2018 and in US stores from
  October 2018 at $899, marketed as a 2019-model-year club. It is forged
  from 1025 carbon steel with an ultra-thin face whose junction with the
  sole is thinned into a Power Slit that flexes at impact, raising COR low
  on the face where average golfers miss, and a rubber polymer insert fills
  the back cavity to damp vibration. Lofts are strong for a forged
  cavity-back of the era (31-degree 7-iron, 44-degree pitching wedge, with
  a 50-degree gap wedge completing the set), and the more compact HF2 sat
  below the larger hollow JGR HF1 in the line. Offsets below are converted
  from Bridgestone's published millimetre figures. Bridgestone wound down
  its US club business without announcing a direct successor — the HF2
  page moved into the company's 2019-models archive and the JGR clubs left
  the live US line-up after 2021, ahead of Bridgestone's December 2024
  return to the US club market.
