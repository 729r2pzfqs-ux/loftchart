description: >
  The J33 Forged Cavity Back, developed with Bridgestone staff players Fred
  Couples and Stuart Appleby, was the better-player cavity iron of
  Bridgestone's J33 forged line, aimed at "professionals to mid handicap
  amateurs." The head is forged from 1020 mild carbon steel with progressive
  muscle thickness for enhanced feel and a progressive horizontal center of
  gravity that keeps long irons easy to square while the short irons stay
  stable through impact, plus progressive offset and a rolled leading edge
  for consistency through the turf. Lofts are traditional for the era
  (35-degree 7-iron, 47-degree pitching wedge, starting from a 2-iron),
  built to a D3 swing weight on a stock True Temper Dynamic Gold S300 shaft
  with a Golf Pride Tour Velvet grip. It was sold right hand only. The
  Condition of Competition rule made the J33 irons non-conforming for
  professional play from 1 January 2010, and the J36 generation succeeded it
  in Bridgestone's line-up in 2008.
