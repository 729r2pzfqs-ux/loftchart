faq:
  - q: "What is the loft of a Bridgestone J33 Forged Cavity Back 7-iron?"
    a: "The Bridgestone J33 Forged Cavity Back 7-iron has a loft of 35 degrees, with a 63-degree lie, a 36.75-inch length and a D3 swing weight."
  - q: "Who helped develop the Bridgestone J33 Forged Cavity Back?"
    a: "Bridgestone Golf engineers worked with staff players Fred Couples and Stuart Appleby on the J33 forged iron family."
  - q: "What replaced the Bridgestone J33 Forged Cavity Back?"
    a: "The J36 Cavity Back, part of Bridgestone's next forged iron generation, which arrived in Bridgestone's 2008 line-up."
  - q: "What clubs came in a stock Bridgestone J33 Forged Cavity Back set?"
    a: "It was sold right hand only, spanning a 2-iron through pitching wedge, on a stock True Temper Dynamic Gold S300 shaft."
