faq:
  - q: "What is the loft of a Bridgestone Tour B X-CBP 7-iron?"
    a: "The Bridgestone Tour B X-CBP 7-iron has a loft of 31 degrees, with a 62-degree lie and a 37-inch length in the stock lightweight-steel build."
  - q: "What is the difference between the Bridgestone Tour B X-CB and X-CBP?"
    a: "The X-CB is a one-piece forged cavity-back with traditional lofts (32-degree 7-iron), while the X-CBP adds a pocket cavity behind a press-formed SAE 8655 chrome-molybdenum face, slightly more offset, a wider sole and lofts about a degree stronger (31-degree 7-iron, 44-degree pitching wedge) for more launch and forgiveness."
  - q: "When did the Bridgestone Tour B X-CBP come out?"
    a: "It was released in Japan in autumn 2018 as part of the 2018 Tour B iron range, and US retailers sold it as a 2019 model without a major launch."
  - q: "Are the Bridgestone Tour B X-CBP irons forged?"
    a: "The body is forged from soft carbon steel, but the face is a separate press-formed piece of high-strength SAE 8655 chrome-molybdenum steel covering a pocket cavity — a two-piece construction rather than a one-piece forging."
