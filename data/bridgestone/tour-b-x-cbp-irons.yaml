description: >
  The Tour B X-CBP is the pocket-cavity model of Bridgestone's 2018 Tour B
  iron range — a forged soft-carbon-steel body with a press-formed SAE 8655
  chrome-molybdenum face over a pocket cavity, giving a players profile with
  more launch and forgiveness than the Tour B X-CB it sat beside. It was
  released in Japan in autumn 2018 (the JDM stock set was 5-PW at 116,640
  yen with N.S.PRO 950GH or MODUS3 TOUR105 steel shafts, the 4-iron a
  custom order) and was sold quietly in the US market, where retailers list
  it as a 2019 model; it never had the retail push of the X-CB and remained
  little known in the States. Lofts are moderately strong for a players
  iron of the era, with a 31-degree 7-iron and 44-degree pitching wedge.
  Lengths below are the stock lightweight-steel build; Dynamic Gold,
  MODUS3 120/130 and KBS builds ran a quarter-inch shorter. The 222CB+
  of 2022 took over the pocket-cavity slot in Bridgestone's line.
