faq:
  - q: "What is the loft of a Bridgestone J33 Forged Blade 7-iron?"
    a: "The Bridgestone J33 Forged Blade 7-iron has a loft of 36 degrees, with a 63-degree lie, a 36.75-inch length and a D3 swing weight."
  - q: "What makes the Bridgestone J33 Forged Blade a true muscle-back?"
    a: "A long hosel that raises the center of gravity for shot-shaping, reduced offset, a thin top line and a narrow sole — all forged from 1020 mild carbon steel into a small, satin-chrome head."
  - q: "What replaced the Bridgestone J33 Forged Blade?"
    a: "The J36 Blade, part of Bridgestone's next forged iron generation, which arrived in Bridgestone's 2008 line-up."
  - q: "What clubs came in a stock Bridgestone J33 Forged Blade set?"
    a: "It was sold right hand only, spanning a 2-iron through pitching wedge, on a stock True Temper Dynamic Gold S300 shaft."
