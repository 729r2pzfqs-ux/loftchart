description: >
  The J33 Forged Blade was the muscle-back of Bridgestone's J33 forged line,
  aimed at "professionals and low handicap amateurs." The head is forged
  from 1020 mild carbon steel with a long hosel design that raises the
  center of gravity for extra shot-shaping ability, reduced offset, a thin
  top line, a small head and a narrow sole with a leading-edge grind and
  satin chrome finish. Lofts are traditional for the era (36-degree 7-iron,
  48-degree pitching wedge, starting from a 2-iron), built to a D3 swing
  weight on a stock True Temper Dynamic Gold S300 shaft with a Golf Pride
  Tour Velvet grip. It was sold right hand only. The Condition of
  Competition rule made the J33 irons non-conforming for professional play
  from 1 January 2010, and the J36 generation succeeded it in Bridgestone's
  line-up in 2008.
