faq:
  - q: "What is the loft of a Bridgestone J40 Cavity Back 7-iron?"
    a: "The Bridgestone J40 Cavity Back 7-iron has a loft of 35 degrees, with a 63-degree lie, a 36.75-inch length and a D1 swing weight."
  - q: "What clubs come in a stock Bridgestone J40 Cavity Back set?"
    a: "The stock set was 5-iron through pitching wedge at a $699 street price, with the 3-iron and 4-iron sold individually at about $115 each. The model was offered in right hand only."
  - q: "What is the difference between the Bridgestone J40 Cavity Back and the J40 Dual Pocket Cavity?"
    a: "Both are forged J40-generation irons, but the Cavity Back is the compact better-player model with a V-cut cavity and traditional lofts, while the Dual Pocket Cavity uses two milled pockets of removed mass for more perimeter weighting and forgiveness. Bridgestone also sold J40 Combo sets mixing the two."
  - q: "Are Bridgestone J40 Cavity Back irons forged?"
    a: "Yes. Bridgestone forged the heads from 1020 mild carbon steel, one of the softer steels used in irons of that era."
