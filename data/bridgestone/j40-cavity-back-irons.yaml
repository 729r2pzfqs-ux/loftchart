description: >
  The J40 Cavity Back was the better-player iron in Bridgestone Golf's J40 club line,
  announced in September 2011 and at retail from October 2011, aimed at professionals
  through mid-handicap amateurs. Each head is premium-forged from 1020 mild carbon steel
  with a compact profile, a higher face progression and a V-cut cavity, and the sole
  carries relief at the leading edge, trailing edge, toe and heel for versatility.
  Lofts are traditional for the era, with a 35-degree 7-iron and a 47-degree pitching
  wedge, and every iron is built to a D1 swing weight with a Project X flighted steel
  shaft and Golf Pride Tour Velvet grip as stock. It was sold right hand only, as a
  5-PW set (street price $699, MSRP $799) with the 3-iron and 4-iron available
  individually at $115 each; a J40 Dual Pocket Cavity model and J40 Combo sets covered
  players wanting more forgiveness. Offsets below are converted from Bridgestone's
  published millimetre figures (3.5 mm = 0.138 in). Bridgestone's J15 iron family,
  introduced in January 2015, succeeded the J40 generation.
