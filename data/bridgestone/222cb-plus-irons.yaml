description: >
  The 222CB+ is the semi-large forged cavity-back of Bridgestone's 22-series,
  announced by Bridgestone Sports on 2 August 2022 and released in Japan on
  9 September 2022 alongside the compact 221CB and the custom-order 220MB
  muscle-back. Every iron in the set carries a Dual Wide Pocket Cavity that
  removes about 11 grams from the head, and a Gravity Control Design that
  thickens the face toward the sole for a lower centre of gravity and higher
  launch, while the impact area stays thick for a soft forged feel. It is
  the largest and most forgiving of the three models, with a 79.0-millimetre
  7-iron blade length and lofts roughly one degree stronger than the 221CB
  through the middle irons. The JDM stock set is 5-PW with the 4-iron a
  custom-order single (no factory length is published for it); the US
  market received the model in December 2024 as a 5-PW set. The 242CB+
  announced in August 2024 succeeded it in Japan, though the 222CB+
  remained on sale in the US after the December 2024 launch. Lengths below
  are the stock N.S.PRO 950GH neo steel build.
