faq:
  - q: "What is the loft of a Bridgestone 222CB+ 7-iron?"
    a: "The Bridgestone 222CB+ 7-iron has a loft of 31 degrees, with a 62-degree lie and a 37-inch length in the stock N.S.PRO 950GH neo steel build."
  - q: "What is the difference between the Bridgestone 222CB+ and 221CB?"
    a: "The 222CB+ is the semi-large model: it carries a Dual Wide Pocket Cavity in every iron rather than only the long irons, a lower centre of gravity, a 79.0 mm 7-iron blade length against the 221CB's 76.3 mm, slightly stronger mid-iron lofts (31-degree 7-iron versus 32) and lighter stock shafts."
  - q: "When did the Bridgestone 222CB+ come out?"
    a: "Bridgestone Sports announced it on 2 August 2022 and released it in Japan on 9 September 2022. It reached the United States in December 2024, when Bridgestone re-entered the US club market."
  - q: "Was the Bridgestone 222CB+ replaced?"
    a: "In Japan, yes — the 242CB+ announced in August 2024 succeeded it. In the United States the 222CB+ was still current after the December 2024 launch."
