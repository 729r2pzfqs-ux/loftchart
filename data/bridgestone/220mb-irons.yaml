description: >
  The 220 MB is Bridgestone's soft-iron-forged muscle-back, announced by
  Bridgestone Sports on 2 August 2022 as the B-Limited 220MB and released in
  Japan on 9 September 2022 as a custom-order-only single (3-iron through PW,
  24,200 yen per club) alongside the 221CB and 222CB+ cavity-backs. The head
  is forged from S20C soft iron with a Tour Groove Design milled to
  0.02-millimetre precision for spin consistency, and it carries the
  smallest blade length of the three 22-series irons (74.4 mm at the 7-iron
  against the 221CB's 76.3 mm). When Bridgestone re-entered the US club
  market in December 2024 the 220 MB became a stock US offering at $1,050
  for a 4-PW set with Nippon Modus3 Tour 120 shafts, and it remains current.
  Lofts and lies below are Bridgestone's published figures; lengths are the
  US retail build (the JDM release lists no lengths because every club was
  built to order), and no length was published for the custom-order 3-iron.
