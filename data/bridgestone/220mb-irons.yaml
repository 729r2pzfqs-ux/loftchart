faq:
  - q: "What is the loft of a Bridgestone 220 MB 7-iron?"
    a: "The Bridgestone 220 MB 7-iron has a loft of 33 degrees, with a 62-degree lie and a 37.25-inch length in the stock US Modus3 Tour 120 build."
  - q: "When did the Bridgestone 220 MB come out?"
    a: "Bridgestone Sports announced it as the B-Limited 220MB on 2 August 2022 and released it in Japan on 9 September 2022 as a custom-order model. It reached the United States as a stock 4-PW set in December 2024, when Bridgestone re-entered the US club market."
  - q: "Are the Bridgestone 220 MB irons forged?"
    a: "Yes. The heads are forged in Japan from S20C soft iron, with a precision-milled Tour Groove Design that Bridgestone specifies to 0.02 millimetres for spin consistency."
  - q: "How big is the Bridgestone 220 MB head?"
    a: "It is the smallest of Bridgestone's 22-series irons — 74.4 millimetres of blade length at the 7-iron, against 76.3 mm for the 221CB and 79.0 mm for the 222CB+."
