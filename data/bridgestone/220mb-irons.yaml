  - "Bridgestone Sports official news release PDF, 2 August 2022 (sports.bridgestone/cms/press/2022/g0802_b_limited/g0802_b_limited.pdf) — B-Limited 220MB spec table: 3-PW lofts 20/23/26/29.5/33/37/41.5/46, lies 60-63.5, face progression 3.65-5.35 mm, head soft iron (S20C), forged, made in Japan, 9 September 2022 release, custom-order single clubs at 24,200 yen with N.S.PRO MODUS3 TOUR120 or Dynamic Gold steel shafts; no lengths are published because B-Limited clubs were built to order"
