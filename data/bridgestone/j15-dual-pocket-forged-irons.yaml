description: >
  The J15 Dual Pocket Forged (J15DPF) was unveiled on 7 January 2015 alongside
  the J15 Cavity Back, Driving Forged and Muscle Back irons as the most
  forgiving of Bridgestone's deepest-ever J15 forged family, aimed at
  "professionals to high handicap amateurs." Premium-forged carbon steel with
  Bridgestone's Turbo Rubber Design lets discretionary weight move to the
  perimeter for higher MOI while the rubber dampens vibration for feel; a
  mid-size head keeps tour-level control while a wider Sure Contact Sole adds
  forgiveness on off-center strikes and through the turf. Lofts are a touch
  stronger than the J15 Cavity Back through the mid irons (31-degree 7-iron,
  45-degree pitching wedge) with correspondingly more offset. It was sold
  right hand only as a 4-PW set with True Temper's Dynamic Gold Pro as the
  stock shaft. The Tour B X-CBP inherited its pocket-cavity slot in
  Bridgestone's line-up once the J15 generation gave way to Tour B in 2018.
