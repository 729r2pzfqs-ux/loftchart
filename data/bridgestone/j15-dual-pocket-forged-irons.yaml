faq:
  - q: "What is the loft of a Bridgestone J15 Dual Pocket Forged 7-iron?"
    a: "The Bridgestone J15 Dual Pocket Forged 7-iron has a loft of 31 degrees, with a 62.5-degree lie and a 37-inch length."
  - q: "What is Bridgestone's Turbo Rubber Design on the J15DPF?"
    a: "A rubber element inside the cavity that lets discretionary weight move toward the perimeter for higher MOI, while damping vibration at impact for a softer feel than the compact J15 Cavity Back."
  - q: "What replaced the Bridgestone J15DPF?"
    a: "The Tour B X-CBP took over its pocket-cavity slot once Bridgestone's iron line moved to the Tour B name in 2018."
  - q: "What clubs came in a stock Bridgestone J15 Dual Pocket Forged set?"
    a: "It was sold right hand only as a 4-PW set on a stock True Temper Dynamic Gold Pro shaft, with the 3-iron available separately."
