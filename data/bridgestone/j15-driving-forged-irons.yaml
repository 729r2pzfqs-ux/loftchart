sources:
  - "Bridgestone Golf official J15 Driving Forged Irons page, bridgestonegolf.com/en-us/clubs/archive/2015-models/j15-driving-forged-irons (archive.org capture of 23 September 2019) — full factory spec table: 3-PW lofts 20/22.5/25/28/32/36/41/46, lies 60.5-64, lengths 39 to 35.75 inches, swing weights D3 with the PW at D4, offsets 3.5/3.5/3/3/3/2.5/2.5/2.5 mm (converted here at 25.4 mm per inch), bounce 2/2/2/3/3/4/5/6 degrees, True Temper DG Pro stock shaft, the hidden-cavity/F.A.S.T./mid Sure Contact Sole feature copy and the 'professionals to mid handicap amateurs' target statement, available right hand only"
  - "GolfWRX, 'Bridgestone J15 MB, J15 CB, J15 DF and J15DPF Forged Irons', 7 January 2015 — the four-iron J15 forged family unveiled together ahead of the 2015 PGA Merchandise Show as Bridgestone's deepest iron line"
  - "hookedongolfblog.com, 'Review: Bridgestone Golf J15DF Driving Forged Irons' (27 October 2015), and 2ndswing.com's J15 Driving Forged listing — corroborate the $879 retail price, 4-PW stock set with 3-iron available, and the two-piece forged construction with a hidden cavity"
  - "Deviation from the initial gap-analysis brief: category is recorded here as players rather than blade. The J15DF's own spec sheet is identical to the players-category J15 Cavity Back in loft, lie, length and swing weight, and its marketing (hidden forgiving cavity, mid-handicap target) does not match a blade; the true blade in this family is the separate J15 Muscle Back, not covered here"
  - "No successor is documented: Bridgestone's J15 generation was followed by the Tour B iron line from 2017, but no Tour B model is identified in company material as the J15DF's direct replacement"
