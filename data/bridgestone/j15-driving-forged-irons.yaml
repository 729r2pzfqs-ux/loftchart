faq:
  - q: "What is the loft of a Bridgestone J15 Driving Forged 7-iron?"
    a: "The Bridgestone J15 Driving Forged 7-iron has a loft of 32 degrees, with a 62.5-degree lie and a 37-inch length — identical to the J15 Cavity Back."
  - q: "What is the difference between the Bridgestone J15DF and J15CB?"
    a: "Both are two-piece forged carbon steel irons with the same loft, lie, length and swing weight ladder, but the J15DF's hidden cavity and Flex Action Speed Technology face are pitched for extra ball speed, while the J15CB is the more traditional compact cavity-back of the pair."
  - q: "What clubs came in a stock Bridgestone J15 Driving Forged set?"
    a: "Bridgestone sold it right hand only as a 4-PW set at $879, with the 3-iron available separately, on a stock True Temper Dynamic Gold Pro shaft."
  - q: "When was the Bridgestone J15 Driving Forged introduced?"
    a: "It was unveiled on 7 January 2015 alongside the J15 Cavity Back, Dual Pocket Forged and Muscle Back irons, ahead of that year's PGA Merchandise Show."
