description: >
  The J15 Driving Forged (J15DF) was unveiled alongside the J15 Cavity Back,
  J15 Dual Pocket Forged and J15 Muscle Back on 7 January 2015 ahead of that
  year's PGA Merchandise Show, part of what Bridgestone called its deepest
  iron line-up ever. It is built from two pieces of premium-forged carbon
  steel fused together to hide a cavity between the front and rear faces,
  with Bridgestone's Flex Action Speed Technology (F.A.S.T.) letting the
  face flex for extra ball speed and a mid Sure Contact Sole for consistent
  turf interaction; Bridgestone aimed it at "professionals to mid handicap
  amateurs," the same target statement it used for the companion J15CB.
  Loft, lie, length and swing weight are identical to the J15 Cavity Back
  (32-degree 7-iron, 46-degree pitching wedge), with slightly less bounce
  throughout. It was sold right hand only as a 4-PW set at $879 with a
  3-iron available, on a stock True Temper DG Pro shaft. Bridgestone's own
  archive shows no direct successor once the J15 generation gave way to the
  Tour B line in 2017.
