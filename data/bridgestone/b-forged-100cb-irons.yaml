faq:
  - q: "What is the loft of a Bridgestone B-FORGED 100CB 7-iron?"
    a: "The Bridgestone B-FORGED 100CB 7-iron has a loft of 32 degrees, with a 62-degree lie and a 37-inch length in the stock MODUS3 TOUR120 steel build (Japanese 60-degree measurement)."
  - q: "Did the lofts change between the Bridgestone 241CB and the B-FORGED 100CB?"
    a: "No. The lofts and lies are the same club for club, from a 25-degree 5-iron through a 32-degree 7-iron to a 46-degree pitching wedge, and the MODUS3 TOUR120 lengths are also unchanged."
  - q: "What clubs come in a stock Bridgestone B-FORGED 100CB set?"
    a: "The stock set is 5-iron through pitching wedge (six clubs). A 22-degree 4-iron is available as a custom-order single."
  - q: "When was the Bridgestone B-FORGED 100CB released?"
    a: "Bridgestone Sports announced it on 29 July 2026 and it went on sale in Japan on 4 September 2026."
