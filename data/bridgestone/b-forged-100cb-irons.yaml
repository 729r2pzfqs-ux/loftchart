  - "Bridgestone Golf Japan official B-FORGED 100CB product page (https://jp.golf.bridgestone/club/iron/100cb, retrieved 29 September 2026) — head spec table (lofts 22/25/28/32/36/41/46, lies 60.5 to 63.5, face progression 3.65 to 5.35 mm for the 4-iron through PW), head material soft iron S20C, and the per-shaft tables: N.S.PRO MODUS3 TOUR120 S at 38 to 35.5 inches and D2 for the 5-iron through PW, MODUS3 TOUR105 DUAL FLOW S at 38.25 to 35.75 inches and D2, Dynamic Gold HT S200 at 38 to 35.5 inches and D2, with the 4-iron marked custom order in every length and swing weight column. Lengths are stated to be by the 60-degree method."
