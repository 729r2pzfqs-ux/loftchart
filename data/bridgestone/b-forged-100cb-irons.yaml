description: >
  The B-FORGED 100CB is the players cavity-back in Bridgestone's tour iron line,
  announced by Bridgestone Sports on 29 July 2026 and released in Japan on 4 September
  2026 as the successor to the 241CB, under a new B-FORGED name that drops the
  year-based numbering. It is a forged S20C soft carbon steel head with a thicker
  section behind the impact area than the 241CB, a "Neo Tour Contact Sole" with added
  relief towards the toe and heel, and face milling on the pitching wedge. Lofts and
  lies are unchanged from the 241CB, with a 32-degree 7-iron and a 46-degree pitching
  wedge. The stock set is 5-iron through pitching wedge with a 22-degree 4-iron
  offered as a custom-order single; the lengths in this table are the N.S.PRO MODUS3
  TOUR120 build measured by the Japanese 60-degree method (the MODUS3 TOUR105 DUAL
  FLOW build is a quarter inch longer per club). Bridgestone publishes face
  progression rather than offset, so the offset key is omitted.
