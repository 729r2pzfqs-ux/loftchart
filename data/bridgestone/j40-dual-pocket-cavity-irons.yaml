faq:
  - q: "What is the loft of a Bridgestone J40 Dual Pocket Cavity 7-iron?"
    a: "The Bridgestone J40 Dual Pocket Cavity 7-iron has a loft of 34 degrees, with a 63-degree lie, a 36.75-inch length and a D1 swing weight."
  - q: "What is the difference between the Bridgestone J40 Dual Pocket Cavity and the J40 Cavity Back?"
    a: "Both are forged from 1020 mild carbon steel, but the Dual Pocket Cavity is the midsize, higher-launching model with two milled perimeter-weighting pockets and lofts one degree stronger through most of the set (34-degree 7-iron versus 35), while the Cavity Back is the compact better-player head with a V-cut cavity."
  - q: "When were the Bridgestone J40 Dual Pocket Cavity irons made?"
    a: "Bridgestone announced the J40 line in September 2011 with US retail from October 2011, and it remained current until the J15 forged iron family was introduced in January 2015."
