description: >
  The J40 Dual Pocket Cavity was the more forgiving of Bridgestone's two J40
  forged irons, announced in September 2011 and at US retail from October 2011
  alongside the compact J40 Cavity Back. The midsize head is premium-forged
  from 1020 mild carbon steel and carries a revamped version of the dual
  pocket cavity Bridgestone introduced on the J38 — two milled pockets that
  push discretionary weight to the perimeter for a higher MOI and a mid-to-high
  launch — while keeping traditional lofts (34-degree 7-iron, 46-degree
  pitching wedge) and modest offset for its "professionals to mid handicap
  amateurs" target. Like the Cavity Back it was sold right hand only as a 5-PW
  set at a $699 street price ($799 MSRP), with the 3- and 4-iron available
  individually, on a stock Project X flighted steel shaft with a Golf Pride
  Tour Velvet grip; Bridgestone also offered J40 Combo sets mixing the two
  heads. Offsets in the table are converted from Bridgestone's published
  millimetre figures (3.2 mm at the 3-iron tapering to 1.9 mm at the pitching
  wedge). The J40 generation was succeeded by the J15 forged iron family
  introduced at the January 2015 PGA Merchandise Show.
