faq:
  - q: "What is the loft of a Bridgestone J36 Blade 7-iron?"
    a: "The Bridgestone J36 Blade 7-iron has a loft of 35 degrees, with a 63-degree lie, a 36.75-inch length and a D3 swing weight."
  - q: "Are Bridgestone J36 Blade irons forged?"
    a: "Yes. The heads are premium-forged from 1020 mild carbon steel with a high center of gravity for a penetrating flight, a thin top line and sole, and a compact profile."
  - q: "What is the difference between the Bridgestone J36 Blade and the J36 Cavity Back?"
    a: "Both share the identical published loft, lie, length and swing-weight ladder, but the Blade is a true muscle-back with a thin top line and compact profile for low-handicap players, while the Cavity Back adds a progressive-offset cavity for more forgiveness."
  - q: "What clubs came in a stock Bridgestone J36 Blade set?"
    a: "It was sold right hand only as a 3-iron through pitching wedge set, on a stock Rifle Project X flighted steel shaft."
