description: >
  The J36 Blade was the muscle-back of Bridgestone's J36 forged line, aimed
  at "professionals to low handicap amateurs." The head is premium-forged
  from 1020 mild carbon steel with a high center of gravity for a
  penetrating ball flight, a thin top line and sole, and a compact profile
  with progressive offset for shot-shaping. It shares Bridgestone's J36
  Cavity Back's exact loft, lie, length and swing-weight ladder (35-degree
  7-iron, 47-degree pitching wedge, D3 throughout) with the same Rifle
  Project X flighted steel shaft and Golf Pride Tour Velvet grip as stock,
  sold right hand only as a 3-iron through pitching wedge. The Condition of
  Competition rule made the J36 irons non-conforming for professional play
  from 1 January 2010. Bridgestone did not carry a pure muscle-back forward
  into the J38 generation that followed — the next Bridgestone blade
  documented in this database is the 2015 J15 Muscle Back.
