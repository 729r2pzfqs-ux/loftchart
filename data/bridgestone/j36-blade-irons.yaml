sources:
  - "Bridgestone Golf official J36 Blade Irons page, bridgestonegolf.com/en-us/clubs/archive/2008-models/j36-blade-irons (archive.org capture of 23 September 2019) — full factory spec table: 3-PW lofts 21/24/27/31/35/39/43/47, lies 60-64.5, lengths 38.75 to 35.5 inches, D3 swing weight throughout, offsets 2.7-1.4 mm (converted here at 25.4 mm per inch; no bounce figures were published for this model), premium-forged 1020 mild carbon steel with high center of gravity, thin top line and sole, compact head with progressive offset, Rifle Project X flighted shaft, Golf Pride Tour Velvet grip, 'Available right hand only', and 'professionals to low handicap amateurs'; also fixes the Condition of Competition conforming/non-conforming dates"
  - "Note: the loft/lie/length/swing-weight/offset ladder published on Bridgestone's archived J36 Blade page is numerically identical to the J36 Cavity Back page archived the same year — both are recorded here as published rather than assumed to be a data-entry duplicate, since the two models otherwise carry distinct construction copy (muscle-back vs. cavity) and distinct product photography"
  - "No J36-generation successor blade was located in Bridgestone's J38 archive (only a Cavity Back and Dual Pocket Cavity iron are catalogued there); year_discontinued is left null and the next Bridgestone blade in this database is the 2015 J15 Muscle Back, which is not yet covered"
