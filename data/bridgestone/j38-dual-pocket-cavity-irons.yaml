description: >
  The J38 Dual Pocket Cavity — Bridgestone's own product page titles it the
  "J38 Dual Cavity Irons" — was the more forgiving of the two J38 forged
  irons, again aimed at "professionals to mid handicap amateurs." The midsize
  head is premium-forged from 1020 carbon steel with Bridgestone's dual
  pocket cavity removing discretionary weight to the perimeter for
  forgiveness while keeping more mass directly behind the hitting area for
  feel, plus a tapered sole and trailing/leading-edge relief. Lofts are one
  degree stronger than the J38 Cavity Back through most of the set
  (34-degree 7-iron, 46-degree pitching wedge) with correspondingly more
  offset, every club built to a D1 swing weight on a stock Project X
  flighted steel shaft with a Golf Pride Tour Velvet grip. It was sold right
  hand only as a 3-iron through pitching wedge. The J40 Dual Pocket Cavity
  succeeded it in the 2011 model generation.
