faq:
  - q: "What is the loft of a Bridgestone J38 Dual Pocket Cavity 7-iron?"
    a: "The Bridgestone J38 Dual Pocket Cavity 7-iron has a loft of 34 degrees, with a 63-degree lie, a 36.75-inch length and a D1 swing weight."
  - q: "What is the difference between the Bridgestone J38 Dual Pocket Cavity and the J38 Cavity Back?"
    a: "Both are forged from 1020 carbon steel, but the Dual Pocket Cavity uses two milled pockets to move weight to the perimeter for more forgiveness and lofts about a degree stronger (34-degree 7-iron versus 35), while the Cavity Back is the more compact, traditional-loft head with a magnesium-composite insert."
  - q: "What replaced the Bridgestone J38 Dual Pocket Cavity?"
    a: "The J40 Dual Pocket Cavity, part of Bridgestone's next forged iron generation."
  - q: "What clubs came in a stock Bridgestone J38 Dual Pocket Cavity set?"
    a: "It was sold right hand only as a 3-iron through pitching wedge set, on a stock Project X flighted steel shaft."
