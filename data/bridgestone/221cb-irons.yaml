description: >
  The 221CB is a one-piece forged S20C soft carbon steel players cavity-back,
  announced by Bridgestone Sports on 2 August 2022 and released in Japan on
  9 September 2022 alongside the larger 222CB+ and the custom-order 220MB
  muscle-back. It uses Bridgestone's Tour Contact Sole with cut leading and
  trailing edges, a Gravity Control Design that thickens the face toward the
  blade for spin, and dual-pocket cavities in the 4- and 5-irons for launch
  and forgiveness. In Japan the stock set is 5-PW with the 4-iron as a
  custom-order single; when Bridgestone re-entered the US club market in
  December 2024 the 221CB was sold there as a 4-PW set, and it remains in
  the US line even though the 241CB succeeded it in Japan in 2024. Lengths
  in this table are the N.S.PRO MODUS3 TOUR120 build per Bridgestone's
  60-degree measurement, with the 4-iron length from the US retail spec.
