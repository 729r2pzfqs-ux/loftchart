faq:
  - q: "What is the loft of a Bridgestone 221CB 7-iron?"
    a: "The Bridgestone 221CB 7-iron has a loft of 32 degrees, with a 62-degree lie and a 36.75-inch length in the stock MODUS3 TOUR120 steel build."
  - q: "When did the Bridgestone 221CB come out?"
    a: "Bridgestone Sports announced the 221CB on 2 August 2022 and released it in Japan on 9 September 2022. It only reached the United States in December 2024, when Bridgestone re-entered the US club market with the 220 MB, 221 CB and 222 CB+ at $1,050 for a 4-PW set."
  - q: "What is the difference between the Bridgestone 221CB and 222CB+?"
    a: "The 221CB is the compact players cavity-back with dual-pocket cavities only in the 4- and 5-irons, while the 222CB+ is a semi-large forged cavity-back with a dual wide pocket cavity in every iron, a lower centre of gravity, slightly weaker long-iron lofts (21-degree 4-iron) and lighter stock shafts."
  - q: "Was the Bridgestone 221CB replaced?"
    a: "In Japan, yes — the 241CB announced in August 2024 is its successor and keeps the same loft structure. In the United States the 221CB remained the current players cavity-back after the December 2024 US launch."
