description: >
  The JGR Hybrid Forged — later relabelled Tour B JGR HF1 once Bridgestone
  folded it into the Tour B line — was announced at the January 2016 PGA
  Merchandise Show and reached US retail on 4 March 2016 at $699 (steel) or
  $749 (graphite), Bridgestone's pitch for players who found ordinary
  super-game-improvement irons too harsh. The forged, hybrid-inspired head
  has a wide sole running well behind the face, a hollow body with the crown
  cut away like a hybrid, and a 1.5 mm forged face — Bridgestone's thinnest
  ever — that flexes at impact for extra ball speed, with a rubber insert
  behind the face damping vibration and pushing weight to the perimeter for a
  low, deep center of gravity. Stock lofts are strong for the category (a
  26-degree 7-iron) and the stock set ran 6 through a 44-degree first
  pitching wedge, with 5-iron and two additional wedges — a 44-degree second
  pitching wedge and 50-degree approach wedge — available individually.
  Stock shafts were Nippon N.S. Pro Zelos 8 steel or UST Mamiya Recoil
  graphite. The more compact Tour B JGR HF2 succeeded it in 2018.
