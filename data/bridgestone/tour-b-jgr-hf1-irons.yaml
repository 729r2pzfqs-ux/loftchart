faq:
  - q: "What is the loft of a Bridgestone Tour B JGR HF1 7-iron?"
    a: "The Bridgestone Tour B JGR HF1 7-iron has a loft of 26 degrees, with a 61.5-degree lie and a 38-inch length."
  - q: "Is the Bridgestone JGR Hybrid Forged the same club as the Tour B JGR HF1?"
    a: "Yes. It launched in March 2016 simply as the JGR Hybrid Forged; Bridgestone later folded it into its Tour B branding and its own site refers to it as the Tour B JGR HF1 once the HF2 arrived in 2018."
  - q: "What makes the JGR Hybrid Forged irons distinctive?"
    a: "A forged, hybrid-styled head with the crown cut away, a wide digging-resistant sole, and a 1.5 mm forged face — Bridgestone's thinnest at the time — that flexes at impact for added ball speed, with a rubber insert behind the face for feel and perimeter weighting."
  - q: "What clubs came in a stock JGR Hybrid Forged (Tour B JGR HF1) set?"
    a: "The standard set ran 6-iron through a 44-degree first pitching wedge (six pieces), with the 5-iron, a second 44-degree wedge and a 50-degree approach wedge available individually."
