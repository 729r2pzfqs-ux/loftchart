description: >
  The J15 Cavity Back (J15CB) was the better-player iron of Bridgestone's
  J15 forged family, unveiled on 7 January 2015 ahead of the PGA
  Merchandise Show as part of what Bridgestone called its deepest iron line
  ever, alongside the J15 Driving Forged, Dual Pocket Forged and cast
  models. The head is premium-forged carbon steel with a compact profile
  aimed at professionals through mid-handicap amateurs, and its wide Sure
  Contact Sole is relieved for consistent turf interaction — unusually
  forgiving for a players iron of its size. Lofts are traditional
  (32-degree 7-iron, 46-degree pitching wedge) and identical to the Tour B
  X-CB that replaced it in 2017; it was sold 4-PW with a 3-iron available,
  in right and left hand, with True Temper's Dynamic Gold Pro as the stock
  shaft. Offsets below are converted from Bridgestone's published
  millimetre figures (3.5 mm = 0.138 in).
