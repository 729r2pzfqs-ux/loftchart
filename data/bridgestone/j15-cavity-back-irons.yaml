faq:
  - q: "What is the loft of a Bridgestone J15CB 7-iron?"
    a: "The Bridgestone J15 Cavity Back 7-iron has a loft of 32 degrees, with a 62.5-degree lie and a 37-inch length."
  - q: "Are the Bridgestone J15CB irons forged?"
    a: "Yes. The J15 Cavity Back is premium-forged from carbon steel, part of the all-forged J15 iron family Bridgestone launched in January 2015."
  - q: "Who are the Bridgestone J15CB irons for?"
    a: "Bridgestone aimed them at professionals through mid-handicap amateurs: a compact forged players head whose wide, relieved Sure Contact Sole adds unusual forgiveness through the turf for the category."
  - q: "What replaced the Bridgestone J15CB?"
    a: "The Tour B X-CB, announced for the US market in February 2017, took over the players cavity-back slot and kept the identical 20-to-46-degree loft structure."
