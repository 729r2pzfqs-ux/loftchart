description: >
  The 241CB is the players cavity-back in Bridgestone's B-Series tour iron
  line, announced by Bridgestone Sports on 6 August 2024 and released in
  Japan on 6 September 2024 as the successor to the 221CB. It is a one-piece
  forged S20C soft carbon steel head with a muscle-cavity back that thickens
  the metal directly behind the impact area, and a dual-cut "Tour Contact
  Sole" with relieved leading and trailing edges refined from tour feedback.
  The stock set is 5-iron through pitching wedge with a 22-degree 4-iron
  offered as a custom-order single; the lengths in this table are the
  N.S.PRO MODUS3 TOUR120 build measured by the Japanese 60-degree method
  (the MODUS3 TOUR105 build is a quarter inch longer per club). Bridgestone
  publishes face progression rather than offset, so the offset key is
  omitted.
