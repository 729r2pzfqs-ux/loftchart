faq:
  - q: "What is the loft of a Bridgestone 241CB 7-iron?"
    a: "The Bridgestone 241CB 7-iron has a loft of 32 degrees, with a 62-degree lie and a 37-inch length in the stock MODUS3 TOUR120 steel build (Japanese 60-degree measurement)."
  - q: "What clubs come in a stock Bridgestone 241CB set?"
    a: "The stock set is 5-iron through pitching wedge (six clubs). A 22-degree 4-iron is available as a custom-order single with N.S.PRO MODUS3 TOUR120 or TOUR105 shafts."
  - q: "Did the 241CB replace the Bridgestone 221CB?"
    a: "Yes. Bridgestone's August 2024 announcement of the B-Series 241CB and 242CB+ presented them as the successors to the 2022 221CB and 222CB+, keeping the same 32-degree 7-iron and 46-degree pitching wedge lofts."
  - q: "Is the Bridgestone 241CB forged?"
    a: "Yes. The head is one-piece forged from S20C soft carbon steel, with a muscle-cavity back and a dual-cut Tour Contact Sole."
