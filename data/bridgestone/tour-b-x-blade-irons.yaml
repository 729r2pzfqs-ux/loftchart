description: >
  The Tour B X-Blade was the muscle-back of Bridgestone's Tour B iron line,
  announced for the US market on 22 February 2017 alongside the Tour B X-CB
  cavity-back. The head is forged by Endo Manufacturing from 1020 carbon
  steel into an ultra-compact profile with a narrow sole and minimal offset,
  with Bridgestone's Forged Mass Technology concentrating forged mass behind
  the impact zone for feel. Lofts are traditional — a 35-degree 7-iron and
  47-degree pitching wedge, three degrees weaker than the X-CB through the
  mid irons — with every club built to a D2 swing weight. The US stock set
  was 4-PW at $1,200 with a 3-iron available, sold with Nippon's Modus3
  Tour steel shaft as stock. In Japan the blade slot passed to the Tour B
  X-BL in 2018, and Bridgestone's US site files the X-Blade under its 2017
  archive; the next US-market Bridgestone muscle-back was the 220 MB,
  launched there in December 2024.
