faq:
  - q: "What is the loft of a Bridgestone Tour B X-Blade 7-iron?"
    a: "The Bridgestone Tour B X-Blade 7-iron has a loft of 35 degrees, with a 62-degree lie and a 36.75-inch length."
  - q: "What is the difference between the Bridgestone Tour B X-Blade and X-CB?"
    a: "Both are Endo-forged from 1020 carbon steel, but the X-Blade is an ultra-compact muscle-back with a narrow sole and lofts three degrees weaker through the mid irons (35-degree 7-iron against the X-CB's 32), while the X-CB is a slightly larger cavity-back with a wider sole."
  - q: "When did the Bridgestone Tour B X-Blade come out?"
    a: "Bridgestone announced it for the US market on 22 February 2017 at $1,200 for a 4-PW set. In Japan the blade slot passed to the Tour B X-BL in 2018."
  - q: "Are the Bridgestone Tour B X-Blade irons forged?"
    a: "Yes. The heads are forged from 1020 carbon steel by Endo Manufacturing, with forged mass concentrated behind the impact zone."
