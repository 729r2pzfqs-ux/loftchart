faq:
  - q: "What is the loft of a Bridgestone Tour B X-CB 7-iron?"
    a: "The Bridgestone Tour B X-CB 7-iron has a loft of 32 degrees, with a 62-degree lie and a 36.75-inch standard steel length."
  - q: "What is the difference between the Bridgestone Tour B X-CB and X-Blade?"
    a: "Both are Endo-forged from 1020 carbon steel, but the X-CB is a cavity-back with a slightly larger profile, wider sole and lower centre of gravity, and its 6-, 7- and 8-irons are three degrees stronger than the X-Blade's (28/32/36 versus 31/35/39 degrees)."
  - q: "When did the Bridgestone Tour B X-CB come out?"
    a: "Bridgestone announced the Tour B X-CB for the US market on 22 February 2017 at $1,200 for a 4-PW set; the equivalent Japanese-market model had appeared in late 2016, and a second-generation Tour B X-CB followed in Japan in 2018."
  - q: "Are the Bridgestone Tour B X-CB irons forged?"
    a: "Yes. The heads are forged from 1020 carbon steel by Endo Manufacturing, with a forged weight pad positioned behind the impact zone."
