description: >
  The Tour B X-CB was the players cavity-back in Bridgestone's Tour B iron
  line, announced for the US market on 22 February 2017 alongside the Tour B
  X-Blade; the equivalent Japanese-market Tour B X-CB had debuted the
  previous autumn, and Bridgestone's US site files the model under its 2017
  archive. The head is forged by Endo Manufacturing from 1020 carbon steel
  with a slightly larger profile and wider sole than the X-Blade, a forged
  weight pad behind the impact zone, and mid-iron lofts three degrees
  stronger than the blade (32-degree 7-iron against the X-Blade's 35). The
  US stock set was 4-PW at $1,200 with a 3-iron available, sold with
  Nippon's Modus3 Tour steel shaft as stock and ten further options at no
  upcharge. A second-generation Tour B X-CB announced in Japan in 2018
  succeeded it there, and Bridgestone's next US-market players cavity-back
  was the 221CB in December 2024.
