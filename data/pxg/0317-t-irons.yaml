description: >
  The 0317 T is the tour iron of PXG's 0317 line, forged three times from 8620
  carbon steel with a 14-gram tungsten weight in the toe to sit the centre of
  gravity centrally behind the face. It shares the 0317 family's lengths and
  lies but runs one to two degrees stronger than the rest of the line through
  most of the set, at 32 degrees for the 7-iron and 46 for the pitching wedge.
  PXG's adjustable rear weighting lets swing weight be tuned after the build.
