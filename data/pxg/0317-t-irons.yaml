faq:
  - q: "What is the loft of a PXG 0317 T 7-iron?"
    a: "The PXG 0317 T 7-iron has a loft of 32 degrees, a standard lie of 62.5 degrees and a standard length of 37.00 inches."
  - q: "When did the PXG 0317 T come out?"
    a: "PXG announced it in November 2023 and it went on sale in January 2024."
  - q: "How is the PXG 0317 T different from the 0311 T?"
    a: "Same lengths and lies and the same loft chart, but the 0317 T is triple-forged from 8620 carbon steel with a 14-gram internal tungsten toe weight and an adjustable rear weight, where the 0311 T is a hollow body filled with XCOR2."
  - q: "Can you adjust the swing weight of a PXG 0317 T?"
    a: "Yes. PXG's rear weighting system takes interchangeable weights, so swing weight is set at fitting rather than fixed by the head."
