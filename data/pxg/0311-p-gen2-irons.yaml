description: >
  The 0311 P is the players head of PXG's GEN2 range, announced on 15 March
  2018 — nearly three years after the original 0311 — and on sale from
  19 April 2018 at $400 per club in chrome or $500 in Xtreme Dark. It is the
  direct replacement for the original 0311 and keeps its loft chart exactly,
  a 31-degree 7-iron through a 50-degree gap wedge, with fractionally less
  offset. GEN2 swapped the TPE filling for COR2, a faster polymer core inside
  the forged hollow body, enlarged the internal face perimeter cut-out to grow
  the effective hitting area by about 15 percent, and kept the adjustable
  tungsten and titanium perimeter weights. PXG stamps the two scoring clubs W
  and G; they are listed here as PW and GW. Every set was built to order from
  PXG's shaft menu, so no stock shaft is recorded.
