faq:
  - q: "What is the loft of a PXG 0311 P GEN2 7-iron?"
    a: "The PXG 0311 P GEN2 7-iron has a loft of 31 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "What changed from the original PXG 0311 to the P GEN2?"
    a: "Lofts, lies and lengths carried over unchanged. The GEN2 replaced the TPE core with the faster COR2 polymer, enlarged the internal face cut-out for about 15 percent more hitting area, and trimmed offset slightly — 0.25 inches at the 3-iron against 0.26."
  - q: "When did the PXG GEN2 irons come out?"
    a: "PXG announced the GEN2 range on 15 March 2018 and put it on sale on 19 April 2018 at $400 per club in chrome or $500 in Xtreme Dark. The GEN3 range replaced it in February 2020."
  - q: "What models were in the PXG 0311 GEN2 line?"
    a: "Four iron heads — the 0311 T for tour players, 0311 P for players, 0311 XF for Xtreme Forgiveness and an 0311 SGI super-game-improvement model — plus the 0311 X driving iron."
