description: >
  The 0311T — "T" for Tour — was PXG's first tour-compact iron, launched on
  21 October 2015 a few months after the original 0311. Founder Bob Parsons
  was explicit about its target: "PXG 0311T irons are not built to compete
  with game improvement or player's irons... we designed them to compete
  with blades." The head is more compact than the original 0311, with a
  thinner top line, a narrower sole and less offset, but keeps the same
  forged S25C carbon steel hollow body, TPE injection between face and back
  cavity, a 1.5 mm HT1770 maraging steel face and tungsten screws spreading
  weight to the perimeter for forgiveness inside a traditional blade shape.
  It sold at the same $350-per-club price as the original 0311. PXG stamps
  the pitching wedge W; it is listed here as PW. Every set was built to
  order from PXG's shaft menu, so no stock shaft is recorded.
