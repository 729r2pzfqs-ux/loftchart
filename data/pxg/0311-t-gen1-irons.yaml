faq:
  - q: "What is the loft of a PXG 0311T GEN1 7-iron?"
    a: "The PXG 0311T GEN1 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "What was PXG's goal with the 0311T?"
    a: "Founder Bob Parsons said the 0311T was not built to compete with game-improvement or players irons but with blades, pairing a compact tour shape and narrow sole with the same TPE-filled, tungsten-weighted forged construction as the original 0311."
  - q: "When did the PXG 0311T come out?"
    a: "PXG launched it on 21 October 2015, a few months after its original 0311, at the same $350-per-club price. The T GEN2 replaced it in 2018."
  - q: "Did the PXG 0311T loft ladder change in later generations?"
    a: "No. The 20-degree 3-iron through 46-degree pitching wedge ladder introduced with the GEN1 T carried over unchanged through GEN2 and beyond."
