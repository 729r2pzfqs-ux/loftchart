  - "PXG's own 0311T GEN1 Irons page (pxg.com/en-us/clubs/irons/gen1/0311t), archive.org capture of 21 August 2019 — the full spec table (loft, lie, length in inches, bounce and offset for the 3-iron through the W wedge), and the full technology copy: compact blade-style head with minimal offset, narrow sole for workability, TPE-filled internal cavity, 1.5 mm HT1770 maraging steel face, CNC-milled perimeter tungsten weighting and an S25C soft-carbon-steel forged body."
