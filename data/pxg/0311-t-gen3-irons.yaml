description: >
  The 0311 T is the tour head of PXG's GEN3 line, announced in February 2020
  at $349 per club alongside the P and XP — the most compact of the three,
  with the least offset, the lowest bounce and traditional lofts of 32 degrees
  at the 7-iron and 46 at the pitching wedge. GEN3 introduced Impact Reactor
  technology powered by the DualCOR system, a soft high-COR inner polymer core
  wrapped in a stiffer outer core inside the five-times-forged 8620 carbon
  steel hollow body, behind a 0.058-inch HT1770 maraging steel face attached
  by robotic laser welding, with a CNC-milled back surface. The loft ladder
  carries over from the T GEN2 and continued unchanged into the T GEN4 and
  GEN5; GEN3 added a 51-degree gap wedge to the T chart. PXG stamps the two
  scoring clubs W and G; they are listed here as PW and GW. Every set was
  built to order from PXG's shaft menu, so no stock shaft is recorded.
