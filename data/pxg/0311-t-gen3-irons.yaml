faq:
  - q: "What is the loft of a PXG 0311 T GEN3 7-iron?"
    a: "The PXG 0311 T GEN3 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "What is the DualCOR system in the PXG 0311 T GEN3?"
    a: "A two-polymer core filling the hollow forged head: a soft, high-COR inner core that increases face loading at impact, supported by a stiffer high-strength outer core behind the 0.058-inch maraging steel face."
  - q: "What changed from the PXG 0311 T GEN2 to the T GEN3?"
    a: "The loft, lie and length ladder carried over; GEN3 swapped the COR2 core for DualCOR, added the 360-degree face perimeter channel, trimmed short-iron offset slightly and added a 51-degree gap wedge to the published chart."
  - q: "How does the PXG 0311 T GEN3 differ from the P GEN3?"
    a: "The T is the compact tour head with lofts one degree weaker (32 against 31 at the 7-iron), roughly half the offset, and much lower bounce in the long irons — 2 degrees at the 3-iron against the P's 5."
