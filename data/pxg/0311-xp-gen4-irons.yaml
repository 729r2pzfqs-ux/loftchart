description: >
  XP stands for Xtreme Performance, and the 0311 XP is the largest, most
  forgiving head of PXG's GEN4 line, unveiled in February 2021 with pre-sales
  from 9 March and retail from 30 March at $349 per club — a longer blade, the
  widest sole and the most offset of the three GEN4 heads, with lofts a degree
  stronger than the XP GEN3 it replaced (a 27-degree 7-iron against 28). GEN4
  introduced XCOR, the polymer core that replaced the GEN3's DualCOR inside the
  hollow, five-times-forged 8620 carbon steel body, behind a 0.058-inch HT1770
  maraging steel face. The loft, lie, length, offset and bounce chart is the
  same one PXG published for the GEN5 XP that followed, except that the GEN4
  page also lists a 16-degree 3-iron. PXG's configurator offered S and L wedges
  too, but published no specs for them; every set was built to order from PXG's
  shaft menu, so no stock shaft is recorded.
