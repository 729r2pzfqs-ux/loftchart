  - "PXG's own 0311 XP GEN4 page (pxg.com/en-us/clubs/irons/0311xp-gen4), archive.org captures of 1 August 2021, 2 December 2021 and 21 May 2022 — the full spec table (loft, standard length, standard lie, offset and bounce for the 3-iron through the G wedge, stamped W and G), plus the $349-per-club price and the configurator's 3-through-L club list."
