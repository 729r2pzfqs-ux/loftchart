faq:
  - q: "What is the loft of a PXG 0311 XP GEN4 7-iron?"
    a: "The PXG 0311 XP GEN4 7-iron has a loft of 27 degrees, a lie of 62.0 degrees and a length of 37.5 inches."
  - q: "Did PXG 0311 XP specs change from GEN4 to GEN5?"
    a: "No. The GEN5 XP published the same loft, lie, length, offset and bounce figures for the 4-iron through gap wedge; the only chart difference is that the GEN4 page also listed a 16-degree 3-iron."
  - q: "How do PXG 0311 XP GEN4 lofts compare to the XP GEN3?"
    a: "One degree stronger throughout — a 27-degree 7-iron and 41-degree pitching wedge against the GEN3's 28 and 42."
  - q: "When were the PXG GEN4 irons released?"
    a: "PXG announced the GEN4 line in February 2021, opened pre-sales on 9 March and put it on sale from 30 March 2021 at $349 per club, with the XP shipping in early April. The GEN5 range replaced it in 2022."
