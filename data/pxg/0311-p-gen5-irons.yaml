faq:
  - q: "What is the loft of a PXG 0311 P GEN5 7-iron?"
    a: "The PXG 0311 P GEN5 7-iron has a loft of 30 degrees, a lie of 62.5 degrees and a length of 37.00 inches."
  - q: "How strong are PXG 0311 P GEN5 lofts?"
    a: "Moderately strong for a players-distance iron — 30 degrees at the 7-iron and 44 at the pitching wedge, four degrees stronger than the 0311 T of the same generation."
  - q: "What is XCOR2?"
    a: "PXG's second-generation polymer core. It fills the hollow head, supports the thin maraging face so it can flex further without failing, and damps the sound the empty cavity would otherwise make."
  - q: "Did PXG 0311 P specs change from GEN5 to GEN6?"
    a: "No. The GEN6 0311 P publishes the same lofts, lies, lengths, offsets and bounce figures as the GEN5."
