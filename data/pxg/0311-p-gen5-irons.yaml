description: >
  The 0311 P is the middle head of PXG's GEN5 line: a mid-size profile with
  moderate offset, forged from 8620 carbon steel around an XCOR2 core with a
  thin HT1770 maraging face. Lofts sit four degrees stronger than the 0311 T at
  every club — 30 degrees at the 7-iron, 44 at the pitching wedge — and offset
  runs almost twice the T's. Bounce is progressive from 6 degrees at the 4-iron
  to 12 at the wedges.
