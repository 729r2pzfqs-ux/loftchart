description: >
  The 0311 Black Ops is PXG's 2024 driver generation — the one that moved
  the brand into the 10K-MOI conversation. Its titanium body carries
  compression-moulded carbon inserts and three perimeter weight ports (a
  12.5 g back weight plus 2.5 g heel and toe weights as stock, swappable
  from 2.5 to 20 g in 2.5 g steps), under the variable-thickness AMF
  titanium face. The standard head is the high-MOI core model, the Tour-1 is
  the lowest-spinning head in the PXG lineup with a taller, deeper face, and
  the Ultra-Lite — added February 2025 at 189 grams — serves slower swing
  speeds with a single rear port. The Lightning family replaced the line in
  December 2025.
predecessor: PXG 0311 GEN6
successor: PXG Lightning
variants:
  - name: Black Ops
    head_cc: 460
    description: >
      The core high-MOI head — PXG claimed MOI tunable to roughly 10,000
      g·cm² with the back weight maxed. Three ports: 12.5 g centre-back for
      MOI and launch, 2.5 g heel (draw) and toe (fade). The 8° head is
      right-hand only.
  - name: Black Ops Tour-1
    head_cc: 460
    description: >
      The lowest-spinning driver in the PXG lineup: a taller head, deeper
      face and more crown curvature, with the weight ports set closer to
      centre-forward for a forward CG. Left-hand stock is 9° only.
  - name: Black Ops Ultra-Lite
    head_cc: 460
    description: >
      Added February 2025: a 189 g head (14 g lighter than standard) with a
      single 12.5 g rear port and Precision Weighting build range of roughly
      179-196.5 g, for slower swing speeds. Right-hand only.
