faq:
  - q: "What lofts does the PXG Black Ops come in?"
    a: "The standard 0311 Black Ops comes in 8, 9, 10.5 and 12 degrees (8 right-hand only); the Black Ops Tour-1 in 8, 9 and 10.5; and the Black Ops Ultra-Lite in 10.5 and 11.5, right-hand only."
  - q: "How do you adjust a PXG Black Ops driver?"
    a: "The eight-position PXG adapter moves loft up to 1.5 degrees either way. The Standard 'Dot' is the most upright (draw-biased) setting, and the other settings flatten lie by 0.5 to 3 degrees — the flattest 'PXG Standard' position is the fade-bias option."
  - q: "What do the Black Ops weight ports do?"
    a: "The standard head carries a 12.5 gram centre-back weight plus 2.5 gram heel and toe weights, swappable from 2.5 to 20 grams in 2.5 gram steps — back for maximum MOI and launch, heel for draw, toe for fade. The Tour-1's ports sit closer to centre-forward for lower spin."
  - q: "Is the PXG Black Ops still in production?"
    a: "The Lightning replaced it as PXG's flagship in December 2025, though Black Ops stock remained on PXG's regional sites into 2026. Used and closeout examples are plentiful, and the adapter is the same as the Lightning's."
