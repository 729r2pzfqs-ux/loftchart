faq:
  - q: "What is the loft of a PXG 0311 P GEN3 7-iron?"
    a: "The PXG 0311 P GEN3 7-iron has a loft of 31 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "What changed from the PXG 0311 P GEN3 to the P GEN4?"
    a: "The GEN4 strengthened every loft by one degree — 30 at the 7-iron against 31 — swapped the DualCOR core for XCOR, and added the Precision Weighting plug. Lies, lengths and bounce angles carried over."
  - q: "What was the PXG GEN3 iron line-up?"
    a: "Three heads announced in February 2020: the 0311 T for highly skilled players, the 0311 P as the all-round players model, and the larger 0311 XP for distance and forgiveness. All sold at $349 per club."
  - q: "What is the DualCOR system in the PXG 0311 P GEN3?"
    a: "A two-polymer core filling the hollow forged head: a soft, high-COR inner core that increases face loading at impact, supported by a stiffer high-strength outer core behind the 0.058-inch maraging steel face."
