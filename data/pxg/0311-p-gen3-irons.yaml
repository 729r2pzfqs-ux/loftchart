description: >
  The middle head of PXG's GEN3 line, announced in February 2020 at $349 per
  club in a three-model range — T for tour, P for players, XP for Xtreme
  Performance — the 0311 P was pitched as the balance of playability and
  forgiveness for the widest range of golfers. GEN3 introduced Impact Reactor
  technology powered by the DualCOR system, a soft high-COR inner polymer core
  wrapped in a stiffer outer core inside the five-times-forged 8620 carbon
  steel hollow body, behind a 0.058-inch HT1770 maraging steel face attached
  by robotic laser welding, with a CNC-milled back surface. Its chart runs
  from a 19-degree 3-iron to a 50-degree gap wedge with a 31-degree 7-iron;
  the GEN4 P that replaced it in 2021 strengthened every loft by one degree.
  PXG stamps the two scoring clubs W and G; they are listed here as PW and
  GW. Every set was built to order from PXG's shaft menu, so no stock shaft
  is recorded.
