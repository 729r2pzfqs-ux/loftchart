description: >
  XP stands for Xtreme Performance, and the 0311 XP is the largest head of PXG's
  GEN8 line, announced on 15 January 2026 — the widest sole, the most offset and
  the strongest lofts, at 27 degrees for the 7-iron and a 41-degree pitching wedge,
  built a half-inch longer than the P through most of the set. Like its siblings it
  is five-times forged from 8620 carbon steel around a QuantumCOR polymer core with
  an ultra-thin HT1770 maraging steel face, plus the generation's Dual Perimeter
  Weighting System of interchangeable heel and toe weights, which PXG says lifts
  the XP's MOI about 6 per cent over GEN7. Because the set lofts are so strong, the
  scoring end runs deep: PXG publishes specs from the 4-iron down through 47-degree
  gap, 54-degree sand and 60-degree lob wedges to keep the gapping usable under the
  41-degree pitching wedge. PXG stamps those clubs W, G, S and L; they are listed
  here as PW, GW, SW and LW. Every set is built to order in Chrome and Xtreme Dark
  finishes, so no single stock shaft is recorded.
