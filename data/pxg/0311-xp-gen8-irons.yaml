faq:
  - q: "What is the loft of a PXG 0311 XP GEN8 7-iron?"
    a: "The PXG 0311 XP GEN8 7-iron has a loft of 27 degrees, a lie of 62.0 degrees and a length of 37.5 inches."
  - q: "How strong are PXG 0311 XP GEN8 lofts?"
    a: "Very strong — 27 degrees at the 7-iron and a 41-degree pitching wedge, three degrees stronger than the 0311 P GEN8 and five stronger than the T. The 4-iron is 18 degrees, the loft of many hybrids."
  - q: "What wedges does the PXG 0311 XP GEN8 offer?"
    a: "A 41-degree pitching wedge, 47-degree gap wedge, 54-degree sand wedge and 60-degree lob wedge — PXG stamps them W, G, S and L — so the strong set lofts can be gapped all the way down."
  - q: "What changed from the PXG 0311 XP GEN7 to GEN8?"
    a: "The Dual Perimeter Weighting System of interchangeable heel and toe weights and Deep Core Recoil Technology on the QuantumCOR core, for a claimed 6 per cent MOI gain. The published lofts stay the same as earlier XP generations, with a 27-degree 7-iron."
