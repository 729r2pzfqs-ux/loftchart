faq:
  - q: "What is the loft of a PXG 0311 P GEN7 7-iron?"
    a: "The PXG 0311 P GEN7 7-iron has a loft of 30 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "When were the PXG 0311 GEN7 irons released?"
    a: "PXG released GEN7 on 7 August 2024, alongside the Black Ops irons. The GEN8 range replaced it in 2025."
  - q: "What changed between the PXG GEN6 and GEN7 irons?"
    a: "The core material — QuantumCOR replaced XCOR2 — the face was thinned to 0.050 inches, and a 20-gram internal tungsten toe weight was added. The loft, lie, length and offset chart did not change."
