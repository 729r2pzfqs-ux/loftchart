description: >
  GEN7 replaced the XCOR2 core with QuantumCOR and thinned the maraging face to
  0.050 inches, a claimed 15 per cent reduction, with a 20-gram internal tungsten
  toe weight pulling the centre of gravity back to the middle of the face. The
  loft, lie, length and offset chart is unchanged from the GEN5 and GEN6 P heads —
  PXG has run the same P numbers for three generations. PXG stamps the two scoring
  clubs W and G; they are listed here as PW and GW.
