faq:
  - q: "What is the loft of a PXG 0317 ST 7-iron?"
    a: "The PXG 0317 ST 7-iron has a loft of 33 degrees, a standard lie of 62.5 degrees and a standard length of 37.0 inches."
  - q: "When did the PXG 0317 ST come out?"
    a: "PXG launched the 0317 ST Milled Blades in late September 2022, after prototypes surfaced on tour at the 2022 Rocket Mortgage Classic. The 0317 CB and 0317 T joined it in the 0317 family a year later."
  - q: "Are all the PXG 0317 ST irons true blades?"
    a: "The 5-iron through gap wedge are solid muscle-backs. The 3- and 4-iron use a tour-inspired cavity-back design for higher MOI at the top of the set."
  - q: "Do the PXG 0317 ST and 0317 CB share specs?"
    a: "Yes. Both publish the same loft, lie, length, offset and bounce chart, which PXG points out makes them natural partners for a blended combo set."
