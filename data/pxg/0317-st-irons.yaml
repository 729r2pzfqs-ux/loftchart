description: >
  The 0317 ST Milled Blades are PXG's muscle-back irons, spotted on tour at
  the 2022 Rocket Mortgage Classic and launched in late September 2022 in
  Chrome and Xtreme Dark finishes. Each head is forged three times from 8620
  soft carbon steel, then CNC-milled on face and back; the 5-iron through gap
  wedge are true muscle-backs, while the 3- and 4-iron use a tour-inspired
  cavity-back design for higher MOI, and a Precision Weighting Technology port
  lets fitters set swing weight without moving the centre of gravity. The
  chart is classic blade territory — a 33-degree 7-iron and 46-degree pitching
  wedge — and in November 2023 the 0317 CB and 0317 T joined it to form the
  0317 family, sharing its lofts, lies and lengths for blended sets. PXG
  stamps the two scoring clubs W and G; they are listed here as PW and GW.
