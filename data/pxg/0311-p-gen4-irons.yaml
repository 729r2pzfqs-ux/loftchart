faq:
  - q: "What is the loft of a PXG 0311 P GEN4 7-iron?"
    a: "The PXG 0311 P GEN4 7-iron has a loft of 30 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "Did PXG 0311 P specs change from GEN4 to GEN5?"
    a: "No. The GEN5 published the same loft, lie, length, offset and bounce figures for the 4-iron through gap wedge; the only chart difference is that the GEN4 page also listed an 18-degree 3-iron."
  - q: "What is XCOR?"
    a: "The polymer core PXG introduced with GEN4, replacing COR2. It fills the hollow forged head, supporting the 0.058-inch maraging steel face so it can flex for ball speed while damping sound and feel."
  - q: "When were the PXG GEN4 irons released?"
    a: "PXG announced the GEN4 line in February 2021, opened pre-sales on 9 March and put it on sale on 30 March 2021 at $349 per club. The GEN5 range replaced it in 2022."
