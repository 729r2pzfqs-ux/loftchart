description: >
  The 0311 P is the middle head of PXG's GEN4 line, unveiled in February 2021 with
  pre-sales from 9 March and retail from 30 March at $349 per club. GEN4
  introduced XCOR, the polymer core that replaced the GEN3's COR2 inside the
  hollow, five-times-forged 8620 carbon steel body, behind a 0.058-inch HT1770
  maraging steel face, with a milled back surface and a Precision Weighting
  Technology plug near the centre of gravity that fitters could swap in 2-gram
  increments. The loft, lie, length, offset and bounce chart — a 30-degree 7-iron
  and 44-degree pitching wedge — is the same one PXG went on to publish unchanged
  for the GEN5, GEN6 and GEN7 P heads, though the GEN4 chart also lists an
  18-degree 3-iron that the GEN5 page dropped. PXG stamps the two scoring clubs W
  and G; they are listed here as PW and GW. Every set was built to order from
  PXG's shaft menu, so no stock shaft is recorded.
