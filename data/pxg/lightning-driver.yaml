faq:
  - q: "What lofts does the PXG Lightning come in?"
    a: "The Lightning Max 10K+ comes in 9, 10.5 and 12 degrees; the Tour and Tour Mid in 8, 9 and 10.5; and the Max Lite in 10.5 and 11.5. The adapter extends each head 1.5 degrees either way."
  - q: "How do you adjust a PXG Lightning driver?"
    a: "The eight-position PXG adapter moves loft up to 1.5 degrees either way. Its Standard 'Dot' is the most upright (draw-biased) setting; the other seven settings flatten lie by 0.5 to 3 degrees, with the flattest 'PXG Standard' position serving as the fade-bias option."
  - q: "What is the difference between the Lightning Tour and Tour Mid?"
    a: "Both share the 8-10.5 degree loft menu. The Tour is the most compact, lowest-spinning head with front-biased weighting and a flatter 59 degree lie; the Tour Mid keeps low spin but moves 15 grams to the back for more forgiveness — the slot between the old Black Ops and its Tour-1."
  - q: "Does the PXG Lightning have a stock shaft?"
    a: "Not in the usual sense — PXG sells shaft-agnostic, with a wide catalogue of no-upcharge shafts in L through X flexes chosen at fitting and premium options at an upcharge, so the 'stock' build varies by retailer."
