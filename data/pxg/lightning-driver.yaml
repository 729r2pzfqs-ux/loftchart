description: >
  Lightning is PXG's flagship driver family, at retail from 2 December 2025
  and carrying the brand into 2026. Against the Black Ops it strips weight —
  PXG claims up to 84% more carbon in the body — and zone-tunes the face
  ("Frequency Tuned Face") for ball speed. Four heads cover the range: the
  Max 10K+ with combined MOI past 10,000 g·cm², the compact low-spin Tour,
  the new Tour Mid for players who sat between the old Black Ops and its
  Tour-1, and the 189-gram Max Lite for moderate swing speeds. All but the
  Max Lite carry three weight ports with 2.5-20 g swappable weights; PXG
  sells the line shaft-agnostic, with a large no-upcharge catalogue chosen
  at fitting rather than one headline stock shaft.
variants:
  - name: Lightning Max 10K+
    head_cc: 460
    description: >
      The max-forgiveness flagship with combined MOI over 10,000 g·cm² —
      higher launch with Tour-Mid-like spin. Three weight ports: two 2.5 g
      front and a 15 g back weight stock, swappable from 2.5 to 20 g.
  - name: Lightning Tour
    head_cc: 460
    description: >
      The most compact, lowest-spinning and lowest-launching head for
      high-speed players, with a shorter front-to-back profile and
      front-biased stock weighting (two 7.5 g front, 2.5 g back). Left-hand
      stock is 9° only.
  - name: Lightning Tour Mid
    head_cc: 460
    description: >
      New for Lightning: the middle head for competitive players who sat
      between the Black Ops and Black Ops Tour-1 — low spin with added
      forgiveness from a 15 g back weight.
  - name: Lightning Max Lite
    head_cc: 460
    description: >
      The lightweight head — 189 g against the others' 203 g — with a single
      12.5 g rear port, for swing speeds of roughly 70-95 mph.
