faq:
  - q: "What is the loft of a PXG 0311 P GEN6 7-iron?"
    a: "The PXG 0311 P GEN6 7-iron has a loft of 30 degrees, a standard lie of 62.5 degrees and a standard length of 37.00 inches."
  - q: "Did PXG change the 0311 P specs from GEN5 to GEN6?"
    a: "No. PXG publishes identical lofts, lies, lengths, offsets and bounce angles for both generations; the differences are internal and cosmetic."
  - q: "What finishes does the PXG 0311 P GEN6 come in?"
    a: "Chrome, Xtreme Dark, Double Chrome and Double Black."
  - q: "How much bounce does a PXG 0311 P GEN6 have?"
    a: "Progressive, from 6 degrees at the 4-iron to 12 degrees at the pitching and gap wedges."
