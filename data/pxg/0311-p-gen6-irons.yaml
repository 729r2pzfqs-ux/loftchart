description: >
  The GEN6 0311 P is a mid-size head with a moderate amount of offset, aimed at
  low to mid handicap players, and it publishes exactly the same loft, lie,
  length, offset and bounce chart as the GEN5 model it replaces — 30 degrees at
  the 7-iron, 44 at the pitching wedge. The changes are in the internals and
  the finish options, which run to Chrome, Xtreme Dark, Double Chrome and
  Double Black. PXG builds every set to order, so the lengths below are its
  published standard.
