faq:
  - q: "What lofts do the PXG Lightning fairway woods come in?"
    a: "The standard Lightning comes in 15, 17, 18, 21, 24 and 27 degrees — a 3-wood through 11-wood including a 17 degree 4-wood — and the compact Lightning Tour in 15 and 18."
  - q: "Are the PXG Lightning fairway woods adjustable?"
    a: "Yes — every head carries PXG's eight-position shaft adapter (plus or minus 1.5 degrees of loft, lie to 3 degrees flat) plus movable sole weights: three ports with 17.5 grams of mass on the standard head, two ports on the Tour."
  - q: "What is the difference between the Lightning and Lightning Tour fairway woods?"
    a: "The Tour is a smaller head — 180 cc against 200 cc in the 3-wood — with lies half a degree flatter, a two-port weight setup and a lower, more workable flight for faster players. It comes only in 15 and 18 degrees."
  - q: "What replaced the PXG Black Ops fairway woods?"
    a: "These — the Lightning fairways replaced the Black Ops line on 2 December 2025 as PXG's 2026 flagship, adding 9- and 11-wood lofts the Black Ops never offered."
