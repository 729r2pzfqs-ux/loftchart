description: >
  The Lightning fairway woods launched on 2 December 2025 with the Lightning
  drivers and hybrids, replacing the Black Ops woods as PXG's 2026 flagship
  line. The standard head stretches the ladder to six lofts — adding 9- and
  11-woods above the Black Ops range — with head volumes from 200 cc at the
  3-wood down to 160 cc, three weight ports (one 12.5 g and two 2.5 g) for up
  to 17.5 g of movable mass, and PXG's adjustable shaft adapter on every
  head. The compact Lightning Tour comes in 15° and 18° with flatter lies,
  smaller 180/170 cc heads and a two-port weight setup.
variants:
  - name: Lightning
    description: >
      The standard head in six lofts from a 200 cc 15° 3-wood to a 160 cc
      27° 11-wood, including a 17° 4-wood, with head weights stepping from
      215 g to 235 g and three sole weight ports. All lofts in both hands.
  - name: Lightning Tour
    description: >
      The compact tour head in 15° (180 cc) and 18° (170 cc) with lies half
      a degree flatter than standard and a two-port sole (10 g plus 2.5 g)
      favouring a lower, workable flight.
