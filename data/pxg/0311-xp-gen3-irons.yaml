faq:
  - q: "What is the loft of a PXG 0311 XP GEN3 7-iron?"
    a: "The PXG 0311 XP GEN3 7-iron has a loft of 28 degrees, a lie of 62.0 degrees and a length of 37.5 inches."
  - q: "How do PXG 0311 XP GEN3 lofts compare to the XP GEN4?"
    a: "One degree weaker throughout — a 28-degree 7-iron and 42-degree pitching wedge against the GEN4's 27 and 41 — on the same lies, lengths, offsets and bounces."
  - q: "What happened to the PXG 0311 XF?"
    a: "The GEN3 line of 2020 renamed the forgiveness slot XP, for Xtreme Performance. The XP GEN3 is a half-inch longer per club than the XF GEN2 was, with flatter lies and lofts about two degrees stronger."
  - q: "Are the PXG 0311 XP GEN3 clubs longer than the other GEN3 irons?"
    a: "Yes. Every XP club is half an inch longer than the corresponding T and P — a 37.5-inch 7-iron against 37 — with lies half a degree flatter."
