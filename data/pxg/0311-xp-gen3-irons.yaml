description: >
  XP stands for Xtreme Performance, the name PXG adopted with the GEN3 line of
  February 2020 for its largest head, replacing the GEN2's XF — a bigger
  profile with the most offset in the range, longer club lengths and flatter
  lies than the T and P, sold at $349 per club. GEN3 introduced Impact Reactor
  technology powered by the DualCOR system, a soft high-COR inner polymer core
  wrapped in a stiffer outer core inside the five-times-forged 8620 carbon
  steel hollow body, behind a 0.058-inch HT1770 maraging steel face. Its chart
  runs from a 17-degree 3-iron to a 48-degree gap wedge with a 28-degree
  7-iron; the XP GEN4 that replaced it in 2021 strengthened every loft by one
  degree. PXG stamps the two scoring clubs W and G; they are listed here as PW
  and GW. Every set was built to order from PXG's shaft menu, so no stock
  shaft is recorded.
