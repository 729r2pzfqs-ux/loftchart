faq:
  - q: "What is the loft of a PXG 0211 DC 7-iron?"
    a: "The PXG 0211 DC 7-iron has a loft of 28 degrees, a lie of 62.0 degrees and a length of 37.5 inches."
  - q: "What is the difference between the PXG 0211 DC and the original 0211?"
    a: "The 2021 0211 DC swapped the COR2 core for the 0311 GEN3's DualCOR dual-polymer system, strengthened every loft — 28 degrees at the 7-iron against 31 — and cut the price from $195 to $119 per club."
  - q: "Why is it called the 0211 DC?"
    a: "DC stands for DualCOR, the two-polymer core system inside the hollow cast head. PXG sold it as the '2021 0211' and used the 0211 DC name to distinguish it from the 0211 XCOR2 that replaced it in July 2022."
  - q: "What clubs were offered in the PXG 0211 DC?"
    a: "PXG published specs for the 4-iron through a 60-degree lob wedge, including a 42-degree pitching wedge, 48-degree gap wedge and 54-degree sand wedge, stamped W, G, S and L. Sets were built to order rather than sold in fixed compositions."
