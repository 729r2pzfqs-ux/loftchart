sources:
  - "PXG's own 2021 0211 page (pxg.com/en-us/clubs/irons/0211, titled 'Buy All-New PXG 2021 0211 DualCor Golf Irons'), archive.org capture of 2 August 2021 — the full spec table (loft, standard length, standard lie, offset and bounce for the 4-iron through the L wedge, stamped W, G, S and L), the $119 list / $89 promotional price, the Black and Chrome finishes, and the technology copy: progressive set design, DualCOR system of a soft inner core and high-strength outer core, and the 0.058-inch HT1770 maraging steel face. The configurator on the same capture offered a 3-iron, but PXG published no specs for it, so it is not recorded."
  - "Forbes 'PXG Releases New 0211 Irons, Woods And Hybrids' and pluggedingolf.com 'PXG Announces 2021 0211 Club Line' — the 7 January 2021 announcement of the 2021 0211 Collection."
  - "pluggedingolf.com '2021 PXG 0211 Irons Review' and todays-golfer.com's 0211 review — the cast (not forged) stainless hollow-body construction, and the DualCOR polymer being the same two-material system as the 0311 GEN3 irons. pxg.com's own comparison guide '0211 XCOR2 vs. 0211 DC Irons' confirms PXG's retrospective 0211 DC name for this model."
  - "year_discontinued is 2022 because PXG unveiled the 0211 XCOR2 on 21 July 2022 (firstcallgolf.com, 'New PXG 0211 XCOR2 Irons Make Cutting-Edge Golf Club Technology Affordable')."
  - "Note: the cast body's alloy was not published beyond 'stainless steel', swing weight was not published, and PXG built every set to order from a shaft menu, so no stock shaft is recorded."
