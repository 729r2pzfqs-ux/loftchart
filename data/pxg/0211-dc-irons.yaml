description: >
  The second-generation 0211, announced on 7 January 2021 as part of the 2021
  0211 Collection and marketed as both the "2021 0211" and the "0211 DC", moved
  PXG's budget iron from the original's COR2 core to the DualCOR system of the
  0311 GEN3 — a soft high-COR inner polymer core wrapped in a stiffer outer
  polymer — inside a cast stainless hollow body with the same 0.058-inch HT1770
  maraging steel face. Its progressive set design also strengthened the lofts
  sharply against the 2019 original, from a 31-degree 7-iron to 28, and the
  price fell to $119 per club (on promotion at $89 by August 2021). PXG
  published specs from the 4-iron through 54-degree sand and 60-degree lob
  wedges, stamping the scoring clubs W, G, S and L — listed here as PW, GW, SW
  and LW — and the configurator offered a 3-iron with no published specs. The
  0211 XCOR2, unveiled on 21 July 2022, replaced it.
