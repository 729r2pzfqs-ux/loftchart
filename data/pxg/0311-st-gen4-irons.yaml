description: >
  The 0311 ST GEN4 Blades reached retail around 6 August 2021 (Chrome
  $349, Xtreme Dark $399) after appearing in James Hahn's and Wyndham
  Clark's bags on tour, succeeding the earlier 0311 ST as PXG's tour blade.
  Each head is triple-forged from 8620 carbon steel and finished with PXG's
  proprietary Precision Weighting Technology, which lets fitters dial in
  swing weight without shifting the center of gravity. The set is
  progressive: the 3-, 4- and 5-iron get a slightly larger profile and a
  small internal cavity for extra MOI and forgiveness, the 6- and 7-iron
  step down to a thinner top line and moderate blade size, and the 8-iron
  through gap wedge finish as thin-topline, shorter-blade pure blades for
  complete control. Minimal, progressive offset runs throughout. PXG
  publishes the chart from 3-iron through gap wedge, stamping the scoring
  clubs W and G — listed here as PW and GW.
