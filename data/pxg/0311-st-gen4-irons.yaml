faq:
  - q: "What is the loft of a PXG 0311 ST GEN4 7-iron?"
    a: "The PXG 0311 ST GEN4 7-iron has a loft of 33 degrees, a standard lie of 62.5 degrees and a standard length of 37.0 inches."
  - q: "Are PXG 0311 ST GEN4 irons true blades all the way through the set?"
    a: "Not quite. The 3-, 4- and 5-iron carry a slightly larger profile with a small cavity for extra forgiveness, the 6- and 7-iron are a moderate blade, and only the 8-iron through gap wedge are pure, thin-topline blades."
  - q: "What is Precision Weighting Technology on the PXG 0311 ST GEN4?"
    a: "A proprietary system that lets PXG fitters adjust swing weight without moving the club's center of gravity, so players can dial in feel independent of the head's launch and forgiveness characteristics."
  - q: "When did the PXG 0311 ST GEN4 come out?"
    a: "It reached retail around 6 August 2021 at $349 per club in Chrome (or $399 in Xtreme Dark), after James Hahn and Wyndham Clark had already put it in play on the PGA Tour."
