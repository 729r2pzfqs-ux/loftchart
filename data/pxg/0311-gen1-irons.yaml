faq:
  - q: "What is the loft of an original PXG 0311 7-iron?"
    a: "The original PXG 0311 7-iron has a loft of 31 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "When did the original PXG 0311 irons come out?"
    a: "In 2015, when Bob Parsons launched Parsons Xtreme Golf; GolfWRX dates the 0311 retail launch to July 2015. The GEN2 range replaced it in March 2018."
  - q: "Why were the original PXG 0311 irons so expensive?"
    a: "They sold at $300 per club, roughly triple the going rate in 2015. PXG's pitch was a cost-no-object construction: a CNC-milled hollow body injected with TPE, a 1.5 mm maraging steel face and tungsten perimeter weights, every set built to order."
  - q: "What replaced the original PXG 0311?"
    a: "The 0311 P GEN2 of 2018 was its direct replacement, with identical lofts. The GEN2 line also split into T, XF and SGI heads."
