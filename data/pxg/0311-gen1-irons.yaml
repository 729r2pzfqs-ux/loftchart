description: >
  The 0311 is the iron that launched Parsons Xtreme Golf in 2015 at an
  unheard-of $300 per club — a hollow, CNC-milled blade-style head injected
  with TPE (thermoplastic elastomer) behind what PXG billed as the world's
  thinnest face, 1.5 mm of HT1770 high-strength maraging steel, with
  high-density tungsten alloy weights around the perimeter to raise MOI.
  The chart is traditional for the era — a 31-degree 7-iron and 45-degree
  pitching wedge — and carried over unchanged to the 0311 P GEN2 that
  replaced it in 2018. A tour version, the 0311T, followed later in 2015 and
  an Xtreme Forgiveness 0311XF completed the original line. PXG stamps its
  scoring clubs W, G, S and L; they are listed here as PW, GW, SW and LW.
  Every set was built to order from PXG's shaft menu, so no stock shaft is
  recorded.
