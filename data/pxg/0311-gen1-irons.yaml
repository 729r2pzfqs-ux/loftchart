sources:
  - "PXG's own GEN1 0311 page (pxg.com/en-us/clubs/irons/gen1/0311), archive.org capture of 24 August 2019 — the full 'PXG 0311 GEN1 Irons Specs' table (loft, lie, length, bounce, offset and head weight for the 3-iron through the L wedge, stamped W/G/S/L), plus the technology copy: TPE injection, the 1.5 mm HT1770 maraging steel face billed as the world's thinnest, and CNC-milled hollow body with tungsten alloy perimeter weights."
  - "golf.com 'PXG introduces new and improved 0311 GEN2 irons for 2018' and golfwrx.com 'After nearly 3 years, PXG finally launches new 0311 (T, P, XF, SGI and X) Gen2 irons' — the original 0311's 2015 debut at $300 per club and its March 2018 replacement by the GEN2 range; golfwrx.com dates the first-generation 0311 launch to July 2015, while the brand itself went public in spring 2015."
  - "mygolfspy.com 'First Look - PXG 0311 GEN 2 IRONS' — notes that the GEN2 P was the direct replacement for the original 0311 and that GEN2 lofts were identical to GEN1."
  - "Note: head weights (234-288 g, 3-iron to PW) appear on the archived chart but the schema has no field for them; swing weight was not published and is omitted."
