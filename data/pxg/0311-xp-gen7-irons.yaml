faq:
  - q: "What is the loft of a PXG 0311 XP GEN7 7-iron?"
    a: "The PXG 0311 XP GEN7 7-iron has a loft of 27 degrees, a lie of 62.0 degrees and a length of 37.5 inches."
  - q: "Did PXG 0311 XP specs change from GEN6 to GEN7?"
    a: "No. The GEN7 XP publishes the identical loft, lie, length, offset and bounce chart, from the 18-degree 4-iron to the 60-degree lob wedge."
  - q: "What is QuantumCOR?"
    a: "The lightweight polymer core material PXG introduced with GEN7 in August 2024, replacing XCOR2. Reducing core mass lets more weight sit low and around the perimeter of the head."
  - q: "When was the PXG 0311 XP GEN7 replaced?"
    a: "On 15 January 2026, when PXG announced the GEN8 iron range, which again includes an XP head with the same published lofts."
