description: >
  The game-improvement head of PXG's GEN7 line, released on 7 August 2024
  alongside the Black Ops irons, the 0311 XP publishes exactly the same loft,
  lie, length, offset and bounce chart as the GEN6 XP it replaced — a 27-degree
  7-iron, 41-degree pitching wedge and published specs all the way down to a
  60-degree lob wedge. The change is inside: QuantumCOR, the lightweight
  proprietary core material PXG said was ten years in the making, replaced
  XCOR2 within the five-times-forged 8620 carbon steel body, behind the
  0.050-inch HT1770 maraging steel face, with head weighting set at fitting
  rather than intended for later adjustment. PXG stamps the scoring clubs W, G,
  S and L; they are listed here as PW, GW, SW and LW. Sets were built to order
  — the Xtreme Dark finish listed at $239.99 per club at launch — so no stock
  shaft is recorded.
