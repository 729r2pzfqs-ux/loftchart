description: >
  The 0311 Black Ops hybrids launched in 2024 with the Black Ops woods — a
  single high-MOI head in six lofts from a 17° 2-hybrid to a 31° 7-hybrid.
  Each head carries PXG's adjustable shaft adapter and three interchangeable
  sole weights, so loft, lie, swing weight and bias are all tunable. The
  Lightning hybrids replaced the line for 2026.
