faq:
  - q: "What lofts does the PXG Black Ops hybrid come in?"
    a: "Six lofts: 17, 19, 22, 25, 28 and 31 degrees — the 2-hybrid through 7-hybrid."
  - q: "Is the PXG Black Ops hybrid adjustable?"
    a: "Yes — the eight-position PXG shaft adapter moves loft ±1.5 degrees with flat-lie options to 3 degrees, and three interchangeable sole weights tune swing weight and shot bias."
  - q: "What replaced the PXG Black Ops hybrids?"
    a: "The PXG Lightning hybrids, announced in December 2025, which extended the ladder to a 34 degree 8-hybrid."
