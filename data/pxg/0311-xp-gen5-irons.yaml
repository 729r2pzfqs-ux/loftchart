description: >
  XP stands for Xtreme Performance, and the 0311 XP is the largest head in
  PXG's GEN5 family — the widest sole, the most offset and by some way the
  strongest lofts, at 27 degrees for the 7-iron and 41 for the pitching wedge.
  It is also built long, 39.375 inches at the 4-iron against 38.875 for the P
  and T, and it carries the set down to a 47-degree gap wedge to keep the
  gapping usable underneath a 41-degree pitching wedge.
