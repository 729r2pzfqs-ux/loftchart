faq:
  - q: "What is the loft of a PXG 0311 XP GEN5 7-iron?"
    a: "The PXG 0311 XP GEN5 7-iron has a loft of 27 degrees, a lie of 62.0 degrees and a length of 37.50 inches."
  - q: "Are PXG 0311 XP lofts strong?"
    a: "Yes — 27 degrees at the 7-iron and 41 at the pitching wedge, three degrees stronger than the 0311 P and a full five stronger than the 0311 T of the same generation."
  - q: "Why is the PXG 0311 XP built longer than the P?"
    a: "Half an inch longer at the 4-iron and half an inch at the 7-iron, to add clubhead speed for the mid-to-high handicap player the XP is aimed at."
  - q: "What wedge lofts does the PXG 0311 XP GEN5 use?"
    a: "A 41-degree pitching wedge and a 47-degree gap wedge, which is where the strong set lofts force the gapping."
