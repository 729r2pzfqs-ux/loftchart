faq:
  - q: "What lofts does the PXG Stick'em come in?"
    a: "The Stick'em is sold from 50 to 60 degrees in 2-degree steps — 10 loft, bounce and grind combinations."
  - q: "What grinds does the PXG Stick'em offer?"
    a: "Two: the S grind at 10 degrees of bounce at every loft, and the wider, higher-bounce BP grind at 13 degrees from 54 to 60 degrees."
  - q: "Did the PXG Stick'em replace the Sugar Daddy III?"
    a: "No — PXG still sells the milled Sugar Daddy III above it. The Stick'em is the cheaper, fully forged line that brings PXG wedges to a mainstream price."
  - q: "Is the PXG Stick'em forged?"
    a: "Yes — 3X (triple) forged from 8620 soft carbon steel, with high-toe weighting and a progressive centre of gravity across the lofts."
