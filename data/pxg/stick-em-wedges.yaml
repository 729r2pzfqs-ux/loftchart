description: >
  The Stick'em is PXG's fully forged wedge line, announced on 12 March 2026
  and sold immediately through pxg.com and PXG stores. The triple-forged
  8620 head carries high-toe weighting with a progressive centre of gravity,
  and wider, more closely spaced grooves — traditional on the 50 and 52
  degree heads, full-face from 54 to 60. The matrix runs 10 loft/bounce
  combinations from 50 to 60 degrees in two grinds. It sits below PXG's
  milled Sugar Daddy III in price, and the two lines sell alongside each
  other. PXG builds every order to spec from its shaft catalogue rather than
  naming a single stock shaft.
grinds:
  - code: S
    name: S Grind
    description: >
      A slightly tapered sole with heel and toe relief at 10 degrees of
      bounce — versatility for square-face and open-face shots and creative
      short-game play from varied lies. Offered at every loft.
  - code: BP
    name: BP Grind
    description: >
      A wider, fuller sole delivering 13 degrees of effective bounce that
      glides through turf and sand — for steeper attack angles and softer
      conditions, offered from 54 to 60 degrees.
