faq:
  - q: "What is the loft of a PXG 0211 XCOR2 7-iron?"
    a: "The PXG 0211 XCOR2 7-iron has a loft of 28 degrees, a lie of 62.0 degrees and a length of 37.5 inches."
  - q: "What is the difference between the PXG 0211 XCOR2 and the 0211 DC?"
    a: "The XCOR2 polymer core replaced the DC's DualCOR system, freeing mass for the perimeter of the head. The loft, lie, length and offset chart is identical; the only spec change is one degree more bounce at every club."
  - q: "Was the PXG 0211 XCOR2 ever replaced?"
    a: "No direct successor was announced. PXG kept selling it at falling prices — $99.99 per club by late 2023, then 'while stocks last' — until it quietly left the pxg.com catalog in 2026."
  - q: "Are PXG 0211 XCOR2 lofts strong?"
    a: "Moderately strong for a players-distance iron — a 28-degree 7-iron and 42-degree pitching wedge, with published gapping down through 48-degree gap, 54-degree sand and 60-degree lob wedges."
