sources:
  - "PXG's own 0211 XCOR2 page (pxg.com/en-us/clubs/irons/0211-xcor2), archive.org capture of 22 July 2022 — the full spec table (loft, standard length, standard lie, offset and bounce for the 4-iron through the L wedge, stamped W, G, S and L), the Chrome and Xtreme Dark finishes, and the technology copy: lightweight XCOR2 polymer core repositioning mass to the perimeter, and the HT1770 maraging stainless face made by a cold-roll process with aged heat treatment. The configurator offered a 3-iron, but PXG published no specs for it, so it is not recorded."
  - "firstcallgolf.com 'New PXG 0211 XCOR2 Irons Make Cutting-Edge Golf Club Technology Affordable' (21 July 2022) and mygolfspy.com 'PXG 0211 XCOR2 Irons - Available Now' — the launch date and the $129 Chrome / $149 Xtreme Dark introductory pricing."
  - "year_discontinued is 2026, on a different basis than usual: no successor was ever announced. PXG's own GEN6-era site (archive.org capture of 4 December 2023) still listed the 0211 XCOR2 at $99.99 per club, todays-golfer.com's review recorded it as available 'while stocks last' into early 2026, and as of 28 July 2026 the model is absent from pxg.com's product catalog (sitemap checked directly), whose iron line now runs GEN7, GEN8, 0317, Wildcat and Black Ops."
  - "Note: the cast body's alloy was not published beyond 'stainless steel', swing weight was not published, and PXG built every set to order from a shaft menu, so no stock shaft is recorded."
