description: >
  The third and final 0211 iron, unveiled on 21 July 2022, brought the XCOR2
  polymer core from PXG's flagship GEN5 line down to the budget 0211 — the
  lighter core material freed mass for the perimeter of the hollow cast head,
  behind a cold-rolled HT1770 maraging steel face. The loft, lie, length and
  offset chart carried over unchanged from the 0211 DC (a 28-degree 7-iron and
  42-degree pitching wedge), with one degree more bounce at every club, and
  introductory pricing was $129 per club in Chrome and $149 in Xtreme Dark. It
  had an unusually long run with no successor: PXG kept it in the range at
  $99.99 per club through the GEN6 era and was still selling it "while stocks
  last" into early 2026, before it disappeared from pxg.com's catalog. PXG
  stamps the scoring clubs W, G, S and L; they are listed here as PW, GW, SW
  and LW.
