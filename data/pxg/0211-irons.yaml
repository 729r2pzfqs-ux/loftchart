sources:
  - "PXG's own 0211 iron page (pxg.com/clubs/irons/0211), archive.org capture of 7 March 2020 — the full 'PXG 0211 IRONS SPECS' table (loft, lie, length, bounce and offset for the 4-iron through the L wedge, stamped W, G, S and L), plus the technology copy: hollow body filled with COR2 polymer, 1.5 mm HT1770 maraging steel face, 360-degree undercut channel claimed to enlarge the functional face area 15 per cent, and PXG's own comparison table against the forged GEN1 0311 irons. The configurator on the same capture also offered a 3-iron, but PXG published no specs for it, so it is not recorded."
  - "golfwrx.com 'PXG launches more affordable, cast 0211 irons' — on-sale date of Tuesday 21 May 2019, pricing of $195 per club in steel and $210 in graphite, the investment cast body, and the note that the tungsten and titanium perimeter weights of the 0311s were dropped to reach the price."
