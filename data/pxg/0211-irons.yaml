faq:
  - q: "What is the loft of a PXG 0211 7-iron?"
    a: "The original 2019 PXG 0211 7-iron has a loft of 31 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "What is the difference between the PXG 0211 and 0311 irons?"
    a: "The 0211 kept the 0311 GEN2's hollow body, COR2 polymer core and 0.058-inch maraging steel face, but its body is investment cast rather than forged and milled and it has no adjustable tungsten perimeter weights — which is how PXG sold it at $195 per club instead of $349 and up."
  - q: "When were the original PXG 0211 irons released?"
    a: "They went on sale on 21 May 2019. The second-generation 0211, announced on 7 January 2021, replaced them."
  - q: "What clubs were offered in the PXG 0211?"
    a: "PXG published specs for the 4-iron through a 60-degree lob wedge, including a 45-degree pitching wedge, 50-degree gap wedge and 55-degree sand wedge, stamped W, G, S and L. Sets were built to order rather than sold in fixed compositions."
