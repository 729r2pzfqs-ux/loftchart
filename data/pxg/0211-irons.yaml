description: >
  The original 0211, launched on 21 May 2019, was PXG's first attempt at a more
  affordable iron — $195 per club in steel and $210 in graphite, against $349 or
  more for the flagship 0311 line. It kept the core GEN2 0311 technology package: a
  hollow body filled with COR2 polymer, a 0.058-inch (about 1.5 mm) HT1770 maraging
  steel face that PXG billed as the thinnest in golf, and a 360-degree undercut
  channel around the face that PXG said enlarged the functional face area by 15 per
  cent. The savings came from the body, which is investment cast rather than forged
  and milled, and from dropping the adjustable tungsten perimeter weights of the
  0311s. Lofts are moderately strong, with a 31-degree 7-iron and a 45-degree
  pitching wedge, and PXG published specs from the 4-iron all the way through
  55-degree sand and 60-degree lob wedges, stamping the scoring clubs W, G, S and L
  — listed here as PW, GW, SW and LW. The second-generation 0211, announced on 7
  January 2021 as part of the 2021 0211 Collection, replaced it.
