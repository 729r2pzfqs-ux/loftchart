description: >
  The 0311 T is the tour head of PXG's GEN2 range, announced on 15 March 2018
  and on sale from 19 April 2018 at $400 per club in chrome or $500 in Xtreme
  Dark — the most compact of the four GEN2 heads, with the least offset and
  lofts a degree weaker than the P throughout, 32 degrees at the 7-iron and 46
  at the pitching wedge. Like its siblings it is a forged hollow body filled
  with COR2, the polymer core PXG claimed was 20 percent faster than the
  original TPE filling, behind a thin maraging steel face with adjustable
  tungsten and titanium perimeter weights. PXG published the chart for 3-iron
  through pitching wedge, stamped W and listed here as PW; this exact loft
  ladder then survived unchanged through the T GEN3, GEN4 and GEN5. Every set
  was built to order from PXG's shaft menu, so no stock shaft is recorded.
