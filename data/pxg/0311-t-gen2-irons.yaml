faq:
  - q: "What is the loft of a PXG 0311 T GEN2 7-iron?"
    a: "The PXG 0311 T GEN2 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "What is the difference between the PXG 0311 T GEN2 and the P GEN2?"
    a: "The T is the compact tour head: lofts run a degree weaker (32 against 31 at the 7-iron), offset is roughly half the P's, and bounce is lower through the long irons — 2 degrees at the 3-iron against the P's 5."
  - q: "Did PXG 0311 T lofts change between generations?"
    a: "No. The 20-degree 3-iron through 46-degree pitching wedge ladder introduced with the T GEN2 carried over unchanged to the T GEN3, GEN4 and GEN5."
  - q: "When did the PXG 0311 T GEN2 come out?"
    a: "PXG announced the GEN2 range on 15 March 2018 and put it on sale on 19 April 2018. The GEN3 range replaced it in February 2020."
