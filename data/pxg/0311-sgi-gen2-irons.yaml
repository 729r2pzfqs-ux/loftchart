faq:
  - q: "What is the loft of a PXG 0311 SGI GEN2 7-iron?"
    a: "The PXG 0311 SGI GEN2 7-iron has a loft of 29 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "What does SGI stand for on the PXG 0311?"
    a: "Super Game Improvement. PXG built it with a wide top line, low profile, wide sole and ample offset as the most forgiving head in the GEN2 range, introduced alongside the T, P and XF on 15 March 2018."
  - q: "How is the PXG 0311 SGI GEN2 different from the 0311 XF GEN2?"
    a: "The SGI is PXG's more forgiving head still: it runs stronger lofts than the XF at the top of the set but pairs a lower profile, wider sole and more offset for golfers who, in PXG's words, want the definitive 'ease of use' iron."
  - q: "Did the PXG 0311 SGI continue after GEN2?"
    a: "No confirmed GEN3 (or later) SGI has been documented — PXG's later 0311 iron line-up narrowed to P, T and XP heads, suggesting the SGI slot was retired after GEN2."
