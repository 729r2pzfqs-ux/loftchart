description: >
  The 0311 SGI is a brand-new head PXG introduced alongside the rest of its
  GEN2 range on 15 March 2018 (on sale 19 April 2018 at $400 per club) —
  its most forgiving iron yet, with a wide top line, low profile and a wide
  sole "designed for effortless impact," plus ample offset to build
  confidence at address. It shares the GEN2 family's forged hollow body
  filled with COR2 polymer (PXG's faster-reacting replacement for the
  original TPE filler), a 1.5 mm HT1770 maraging steel face, an internal
  face perimeter cut-out enlarging the functional face area by about 15
  percent, CNC-milled perimeter tungsten weighting, and an angled back
  surface that shifts extra mass toward the toe for higher MOI. PXG
  published the chart from 4-iron through a 59-degree lob wedge, with the
  scoring clubs stamped W, G, S and L — listed here as PW, GW, SW and LW.
  Every set was built to order from PXG's shaft menu, so no stock shaft is
  recorded. Unlike PXG's T and XF heads, the SGI name and slot did not carry
  forward into the GEN3 range.
