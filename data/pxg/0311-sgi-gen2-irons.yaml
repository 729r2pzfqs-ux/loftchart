  - "PXG's own 0311 SGI GEN2 Irons page (pxg.com/en-us/clubs/irons/gen2/0311sgi), archive.org capture of 20 July 2019 — the full 'PXG 0311 SGI GEN2 Irons Specs' table (loft, lie, length in inches, bounce and offset for the 4-iron through the L wedge), the $400 price, and the full technology copy: wide top line and low profile with a wide sole and noticeable offset, COR2-filled milled internal cavity, 1.5 mm HT1770 maraging steel face, 15-percent-larger internal face perimeter cut-out, CNC-milled perimeter tungsten weighting and an angled back surface shifting mass toward the toe."
