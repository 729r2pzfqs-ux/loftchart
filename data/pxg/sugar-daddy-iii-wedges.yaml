description: >
  The Sugar Daddy III is PXG's flagship milled wedge, introduced on
  7 August 2024 and still sold alongside the 2026 Stick'em line (a parallel
  range, not a replacement). Each head is triple forged from 8620 carbon
  steel and then fully CNC milled, with a single Precision Weighting
  Technology port behind the CG adjustable in 2-gram steps during fitting.
  Variable-depth milled ports near the sole move the CG progressively
  through the lofts, and the 16-groove face (one more than the Sugar Daddy
  II) uses wider grooves with 25 percent more cross-sectional volume. The
  12-combination matrix runs 50 to 60 degrees across three grinds — the
  classic-shape S, the high-toe full-face-groove BP, and the low-bounce C —
  in Chrome (299.99 dollars) and Xtreme Dark (349.99) finishes.
grinds:
  - code: S
    name: S-Grind
    description: >
      New for the III — a classic head shape with traditional grooves and a
      10-degree sole that tapers in width from heel to toe. The all-round
      option, offered at every loft.
  - code: BP
    name: BP-Grind
    description: >
      High-toe design with full-face grooves and 12 degrees of bounce —
      for lush turf, soft sand and steeper attack angles, at 54 to 60
      degrees.
  - code: C
    name: C-Grind
    description: >
      Narrow, 7-degree sole with an aggressive heel-to-toe taper for lower
      bounce and maximum open-face versatility, at 58 and 60 degrees.
