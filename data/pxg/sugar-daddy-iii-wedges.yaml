faq:
  - q: "What lofts does the PXG Sugar Daddy III come in?"
    a: "50 to 60 degrees in 2-degree steps — 12 loft, bounce and grind combinations across the S, BP and C grinds."
  - q: "What grinds does the Sugar Daddy III offer?"
    a: "Three: the new classic-shape S at every loft (10 bounce), the high-toe BP with full-face grooves (54-60, 12 bounce) and the narrow low-bounce C (58-60, 7 bounce)."
  - q: "Did the PXG Stick'em replace the Sugar Daddy III?"
    a: "No — the 2026 Stick'em wedges are a parallel PXG line, and the Sugar Daddy III remains on sale as the fully milled flagship."
  - q: "Is the Sugar Daddy III forged or milled?"
    a: "Both: each 8620 carbon steel head is triple forged and then 100 percent CNC milled, with an adjustable Precision Weighting port behind the centre of gravity."
