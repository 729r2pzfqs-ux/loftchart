faq:
  - q: "What is the loft of a PXG 0211 ST 7-iron?"
    a: "The PXG 0211 ST 7-iron has a loft of 32 degrees, a standard lie of 62.5 degrees and a standard length of 37.0 inches."
  - q: "Is the PXG 0211 ST a hollow iron like the rest of the 0211 line?"
    a: "No. Unlike the polymer-filled hollow bodies of the 0211 and 0211 DC, the 0211 ST is a solid-body blade, triple-forged from 8620 soft carbon steel."
  - q: "How can a solid-body blade like the PXG 0211 ST be forgiving?"
    a: "PXG repositions mass through the clubhead to raise the overall moment of inertia well above what a classic blade delivers, while a shorter blade length and lower MOI above the shaft axis keep it workable for better players."
  - q: "When did the PXG 0211 ST come out?"
    a: "PXG announced it on 11 February 2021 as part of that year's 0211 refresh, pricing it from $145-149 per club against a $195 list — well below its 0311 ST tour-blade sibling."
