sources:
  - "PXG's own 2021 0211 ST Irons page (pxg.com/en-us/clubs/irons/2021-0211-st), archive.org capture of 11 February 2021 — the full 'PXG 2021 0211 ST IRONS SPECS' table (club, loft, standard length, standard lie, offset and bounce for the 4-iron through the G wedge), the from-$195/$145-per-club pricing, the 8620 soft-carbon-steel triple-forged construction, and the 'High MOI', 'Extreme Workability' and 'Super Performance. Super Tour Irons' copy describing it as a solid-body blade with repositioned mass for higher-than-typical MOI. The same capture's configurator listed the 3-, S- and L- clubs as orderable, but PXG published no specs for them, so they are not recorded here."
  - "Forbes, 'PXG Releases New 0211 Irons, Woods And Hybrids With 'Unexpected' Price Point', and pluggedingolf.com 'PXG Announces 2021 0211 Club Line' — both dated around the 11 February 2021 announcement of the 2021 0211 ST alongside the wider 0211 refresh."
  - "prweb.com press release 'All-New PXG 2021 0211 ST Irons Deliver Extreme Workability & Exceptional Feel in a Blade-style Design' — corroborates the triple-forged 8620 construction and the positioning as an affordable, high-performance blade for skilled golfers."
