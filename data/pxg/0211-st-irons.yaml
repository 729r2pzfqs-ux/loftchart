description: >
  The 2021 0211 ST Irons, announced 11 February 2021 at $149 per club (list
  $195, promoted at $145-149), brought PXG's tour-blade concept down to the
  budget 0211 line: a clean, traditional blade design that is triple-forged
  from 8620 soft carbon steel rather than the hollow, polymer-filled bodies
  of the rest of the 0211 and 0311 ranges. PXG calls it "surprisingly
  forgiving for a solid-bodied blade" — the forging process's tight grain
  structure and a strategic repositioning of mass through the head lift its
  MOI above what a classic blade would deliver, while a shorter blade length
  and lower MOI above the shaft axis keep it workable for skilled ball
  strikers. PXG published the chart from 4-iron through gap wedge, stamping
  the scoring clubs W and G — listed here as PW and GW; the configurator
  also offered a 3-iron, S and L, but PXG published no specs for them. Every
  set was built to order from PXG's shaft menu, so no stock shaft is
  recorded.
