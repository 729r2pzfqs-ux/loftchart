faq:
  - q: "What is the loft of a PXG 0311 T GEN5 7-iron?"
    a: "The PXG 0311 T GEN5 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.00 inches."
  - q: "What is the difference between PXG 0311 T, P and XP GEN5?"
    a: "Head size and loft. T is the compact tour head at 32 degrees for the 7-iron, P is the mid-size players head at 30 degrees, and XP is the largest and strongest at 27 degrees. Offset rises in the same order."
  - q: "Is there a plain PXG 0311 GEN5 iron?"
    a: "No. GEN5 refers to the generation; the models within it are the 0311 T, 0311 P and 0311 XP."
  - q: "How much bounce does a PXG 0311 T GEN5 have?"
    a: "It is progressive — 3 degrees at the 4-iron rising to 12 degrees at the pitching and gap wedges."
