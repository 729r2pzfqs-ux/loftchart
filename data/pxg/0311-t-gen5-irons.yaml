description: >
  The 0311 T is the tour head of PXG's GEN5 family — the most compact of the
  three, with the least offset and the narrowest sole. Like the P and XP it is
  a forged hollow body filled with PXG's XCOR2 polymer behind a thin HT1770
  maraging face, so it behaves like a distance iron without the size. Lofts are
  traditional for the category, 32 degrees at the 7-iron and 46 at the pitching
  wedge, four degrees weaker than the 0311 P at every club.
