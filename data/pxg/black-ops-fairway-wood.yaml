faq:
  - q: "What lofts does the PXG Black Ops fairway wood come in?"
    a: "Five lofts: 15 (3-wood), 17 (4-wood), 18 (5-wood), 21 (7-wood) and 24 degrees (9-wood)."
  - q: "Is the PXG Black Ops fairway wood adjustable?"
    a: "Yes, twice over: the eight-position PXG shaft adapter moves loft ±1.5 degrees (with flat-lie options to 3 degrees), and three interchangeable sole weights tune swing weight and shot bias."
  - q: "What replaced the PXG Black Ops fairway woods?"
    a: "The PXG Lightning fairway woods and hybrids, announced in December 2025 as the first release of PXG's 2026 line."
