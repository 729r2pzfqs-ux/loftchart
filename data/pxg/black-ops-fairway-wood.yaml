description: >
  The 0311 Black Ops fairway woods launched in 2024 with the Black Ops
  drivers — a single five-loft head rather than a multi-model lineup, running
  from a 15° 3-wood to a 24° 9-wood with a 17° 4-wood in between. Each head
  carries PXG's adjustable shaft adapter and three interchangeable sole
  weights for flight and bias tuning. The Lightning woods replaced the line
  for 2026.
