hosel:
  system: "PXG adjustable shaft adapter"
  loft_range: "±1.5°"
  positions: 8
  lie_effect: >
    The Standard "Dot" is the most upright position; every other setting
    flattens lie by 0.5° to 3° relative to it. There is no
    upright-beyond-Dot setting.
  face_note: >
    PXG markets the upright Dot setting for draw bias and the flattest "PXG
    Standard" setting for fade bias.
  notes: >
    The same universal PXG adapter as the Black Ops drivers, so shafts
    interchange across generations. The stated lie in the chart above is
    measured at the Standard "Dot" position.
