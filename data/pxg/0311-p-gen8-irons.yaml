description: >
  The 0311 P is the mid-size players-distance head of PXG's GEN8 line, announced on
  15 January 2026. The body is five-times forged from 8620 carbon steel around a
  QuantumCOR polymer core — what PXG calls Deep Core Recoil Technology — behind an
  ultra-thin HT1770 maraging steel face, with internal tungsten toe weighting. The
  generation's headline change is the Dual Perimeter Weighting System: two weight
  ports in the heel and toe take interchangeable weights so a fitter can tune swing
  weight and bias the head toward a fade or draw, and PXG says the shift of mass to
  the perimeter raises the P's MOI about 4 per cent over GEN7. The loft, lie and
  length chart is the same one PXG has published for the 0311 P since GEN5 — a
  30-degree 7-iron and 44-degree pitching wedge — but the published offsets are
  trimmed by five thousandths of an inch at every club (the 7-iron reads 0.125
  inches against the GEN7's 0.130) and PXG now publishes bounce. Heads run 4-iron
  through a 49-degree gap wedge; PXG stamps the two scoring clubs W and G, and they
  are listed here as PW and GW. PXG builds every set to order from its shaft menu,
  in Chrome and Xtreme Dark finishes, so no single stock shaft is recorded.
