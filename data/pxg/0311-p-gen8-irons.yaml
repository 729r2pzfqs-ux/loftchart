faq:
  - q: "What is the loft of a PXG 0311 P GEN8 7-iron?"
    a: "The PXG 0311 P GEN8 7-iron has a loft of 30 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "What changed between the PXG 0311 P GEN7 and GEN8?"
    a: "The Dual Perimeter Weighting System — interchangeable heel and toe weights that let a fitter tune swing weight and shot bias — plus Deep Core Recoil Technology built on the QuantumCOR core, for a claimed 4 per cent MOI gain. Lofts, lies and lengths are unchanged; the published offsets are trimmed by 0.005 inches at every club."
  - q: "When were the PXG GEN8 irons released and what do they cost?"
    a: "PXG announced the GEN8 T, P and XP irons on 15 January 2026, at $229 per club in Chrome and $249 in Xtreme Dark."
  - q: "What clubs are available in the PXG 0311 P GEN8?"
    a: "4-iron through a 49-degree gap wedge. PXG stamps the two scoring clubs W (44 degrees) and G (49 degrees), and builds any composition to order rather than selling fixed boxed sets."
