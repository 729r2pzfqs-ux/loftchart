faq:
  - q: "What is the loft of a PXG 0317 CB 7-iron?"
    a: "The PXG 0317 CB 7-iron has a loft of 33 degrees, a standard lie of 62.5 degrees and a standard length of 37.0 inches."
  - q: "When did the PXG 0317 CB come out?"
    a: "PXG announced it in November 2023, alongside the 0317 T, and it went on sale in January 2024."
  - q: "What is the difference between the PXG 0317 CB and 0317 T?"
    a: "The CB is a solid-bodied cavity back with traditional lofts (33 degrees at the 7-iron); the T is a hollow tour iron with a tungsten toe weight and lofts one to two degrees stronger (32 at the 7-iron, 51 at the gap wedge against the CB's 50)."
  - q: "Can the PXG 0317 CB be combined with the 0317 ST?"
    a: "Yes. The two share the same loft, lie, length, offset and bounce chart, so a common build is CB long irons blended into ST short irons."
