description: >
  The 0317 CB is the cavity back of PXG's 0317 line, shown in November 2023
  alongside the hollow-body 0317 T and on sale from January 2024, joining the
  0317 ST blades launched a year earlier. It is a compact, solid-bodied
  players head forged from 8620 carbon steel with a CNC-milled face and back
  and a Precision Weighting port in the centre of the head, so swing weight
  can be set at fitting without moving the centre of gravity. Its loft, lie,
  length, offset and bounce chart is identical to the 0317 ST's — a 33-degree
  7-iron and 46-degree pitching wedge — which PXG pitches as the basis for
  blended sets: CB long irons over ST short irons, or CB scoring clubs under
  the stronger-lofted 0317 T. PXG stamps the two scoring clubs W and G; they
  are listed here as PW and GW.
