description: >
  The 0311XF — "XF" for Xtreme Forgiveness — was PXG's first game-improvement
  iron, announced on 6 September 2016 as a longer-bladed, wider-soled,
  higher-offset version of the original 0311's technology package for
  golfers who wanted extreme forgiveness without losing the look of a PXG
  blade. It keeps the forged S25C carbon steel hollow body, a large internal
  cavity injected with TPE for feel and forgiveness, a 1.5 mm HT1770
  maraging steel face and tungsten perimeter weighting, all inside a larger,
  more confidence-inspiring profile than the original 0311 or the 0311T.
  PXG published the range from 3-iron through a 59-degree lob wedge, with
  the scoring clubs stamped W, G, S and L — listed here as PW, GW, SW and
  LW. Every set was built to order from PXG's shaft menu, so no stock shaft
  is recorded.
