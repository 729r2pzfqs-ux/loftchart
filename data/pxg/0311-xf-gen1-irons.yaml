faq:
  - q: "What is the loft of a PXG 0311XF GEN1 7-iron?"
    a: "The PXG 0311XF GEN1 7-iron has a loft of 30 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "What does XF stand for on the PXG 0311XF?"
    a: "Xtreme Forgiveness. PXG built it with a longer blade length, wider sole and more offset than the original 0311 to make it PXG's most forgiving iron at the time, while keeping the same blade-inspired look."
  - q: "When did the PXG 0311XF come out?"
    a: "PXG announced it on 6 September 2016, roughly a year after the original 0311. The XF GEN2 replaced it when PXG's GEN2 range launched in 2018."
  - q: "What clubs came in a PXG 0311XF GEN1 set?"
    a: "PXG published specs from the 3-iron through a 59-degree lob wedge, including a 44-degree pitching wedge, 49-degree gap wedge and 54-degree sand wedge. Sets were built to order rather than sold in a fixed composition."
