sources:
  - "PXG's own 0311XF GEN1 Irons page (pxg.com/en-us/clubs/irons/gen1/0311xf), archive.org capture of 21 September 2019 — the full spec table (loft, lie, length in inches, bounce and offset for the 3-iron through the L wedge), and the full technology copy: longer blade length with noticeable offset, wide sole for a slightly steeper angle of attack, a large TPE-filled internal cavity, 1.5 mm HT1770 maraging steel face, CNC-milled perimeter tungsten weighting and an S25C soft-carbon-steel forged body."
  - "prweb.com press release 'New PXG 0311XF Irons Appeal to Golfers Who Desire Xtreme Forgiveness', 6 September 2016, and golfdigest.com 'New PXG 0311XF creates forgiveness in blade-like shape' — the announcement date, the game-improvement positioning ('extreme forgiveness and a superior feel, while maintaining the irresistible look of a PXG blade'), and the longer blade length, wider sole and larger profile versus the original 0311."
  - "The repo's existing 0311 XF GEN2 entry (pxg/0311-xf-gen2-irons.yaml) names 'PXG 0311 XF GEN1' as its predecessor, corroborating this as the direct forerunner of the GEN2 XF."
