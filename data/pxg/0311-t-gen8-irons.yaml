faq:
  - q: "What is the loft of a PXG 0311 T GEN8 7-iron?"
    a: "The PXG 0311 T GEN8 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "Was there a PXG 0311 T GEN7?"
    a: "No. The GEN7 range of 2024 shipped only P and XP heads, and the triple-forged 0317 T covered PXG's tour-iron slot until the T returned with GEN8 in January 2026."
  - q: "How do PXG 0311 T GEN8 lofts compare with the P?"
    a: "Two degrees weaker at every club — 32 degrees at the 7-iron against the P's 30, and a 46-degree pitching wedge against the P's 44 — with well under half the P's offset."
  - q: "What is the Dual Perimeter Weighting System?"
    a: "Two weight ports in the heel and toe of each GEN8 head that take interchangeable weights, letting a fitter tune swing weight and bias the head toward a fade or draw. PXG says it moves about 11 grams to the perimeter, raising the T's MOI a claimed 17 per cent over the 0317 T."
