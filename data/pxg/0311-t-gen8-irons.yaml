description: >
  The 0311 T is the tour head of PXG's GEN8 line, announced on 15 January 2026, and
  its return is notable because the GEN7 range of 2024 shipped no T at all — the
  triple-forged 0317 T covered the tour slot in the interim. Like its siblings it is
  five-times forged from 8620 carbon steel around a QuantumCOR polymer core with an
  ultra-thin HT1770 maraging steel face, and it carries the generation's Dual
  Perimeter Weighting System: interchangeable heel and toe weights that let a fitter
  tune swing weight and fade or draw bias, moving roughly 11 grams to the perimeter
  for a claimed 17 per cent MOI gain over the 0317 T. It is the most compact GEN8
  head, with the thinnest topline and the least offset — 0.075 inches at the
  7-iron, well under half the P's chart. Lofts are traditional for the family at 32
  degrees for the 7-iron and 46 for the pitching wedge, two degrees weaker than the
  P throughout, and the chart matches the 0317 T's published lofts, lies, lengths
  and offsets. Heads run 3-iron through a 51-degree gap wedge; PXG stamps the
  scoring clubs W and G, listed here as PW and GW, and builds every set to order in
  Chrome and Xtreme Dark finishes.
