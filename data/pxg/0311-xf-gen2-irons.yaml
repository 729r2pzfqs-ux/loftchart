faq:
  - q: "What is the loft of a PXG 0311 XF GEN2 7-iron?"
    a: "The PXG 0311 XF GEN2 7-iron has a loft of 30 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "What does XF stand for on PXG irons?"
    a: "Xtreme Forgiveness — the largest, most forgiving head of the GEN2 range, with more offset and lofts one degree stronger than the 0311 P GEN2."
  - q: "What replaced the PXG 0311 XF GEN2?"
    a: "The GEN3 range of February 2020 dropped the XF name; its slot went to the 0311 XP, a larger head with longer club lengths and lofts about two degrees stronger."
  - q: "How do the PXG 0311 XF GEN2 lofts compare to the P GEN2?"
    a: "One degree stronger at every club — 30 against 31 at the 7-iron and 44 against 45 at the pitching wedge — while sharing the same lies and lengths."
