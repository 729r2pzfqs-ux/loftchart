description: >
  XF stands for Xtreme Forgiveness, and the 0311 XF is the larger, more
  forgiving head of PXG's GEN2 range, announced on 15 March 2018 and on sale
  from 19 April 2018 at $400 per club in chrome or $500 in Xtreme Dark. Like
  its siblings it is a forged hollow body filled with the COR2 polymer core
  behind a thin maraging steel face, with more offset than the P and lofts one
  degree stronger throughout — a 30-degree 7-iron and 44-degree pitching
  wedge. Its published chart is the widest of the GEN2 line, running from an
  18-degree 3-iron to a 59-degree lob wedge. In the GEN3 range of 2020 the XF
  slot passed to the larger-still 0311 XP. PXG stamps its scoring clubs W, G,
  S and L; they are listed here as PW, GW, SW and LW. Every set was built to
  order from PXG's shaft menu, so no stock shaft is recorded.
