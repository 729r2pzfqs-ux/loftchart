description: >
  The 0311 T is the tour head of PXG's GEN4 line, unveiled in February 2021
  with pre-sales from 9 March and retail from 30 March at $349 per club — the
  most compact of the three GEN4 heads, with the least offset and the lowest
  bounce. GEN4 introduced XCOR, the polymer core that replaced the GEN3's
  DualCOR inside the hollow, five-times-forged 8620 carbon steel body, behind
  a 0.058-inch HT1770 maraging steel face, with a milled back surface and a
  Precision Weighting Technology plug that fitters could swap in 2-gram
  increments. Unlike the P and XP, whose GEN4 charts were strengthened by a
  degree, the T kept the traditional ladder unchanged from the T GEN3 — a
  32-degree 7-iron and 46-degree pitching wedge — and passed it on unchanged
  to the T GEN5. PXG stamps the two scoring clubs W and G; they are listed
  here as PW and GW. Every set was built to order from PXG's shaft menu, so no
  stock shaft is recorded.
