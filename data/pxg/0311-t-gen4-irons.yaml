faq:
  - q: "What is the loft of a PXG 0311 T GEN4 7-iron?"
    a: "The PXG 0311 T GEN4 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a length of 37.0 inches."
  - q: "Did PXG 0311 T specs change from GEN3 to GEN4, or GEN4 to GEN5?"
    a: "No. The 20-degree 3-iron through 51-degree gap wedge chart is identical across the T GEN3, GEN4 and GEN5; the GEN5 page simply dropped the 3-iron."
  - q: "What is XCOR?"
    a: "The polymer core PXG introduced with GEN4, replacing DualCOR. It fills the hollow forged head, supporting the 0.058-inch maraging steel face so it can flex for ball speed while damping sound and feel."
  - q: "How does the PXG 0311 T GEN4 differ from the P GEN4?"
    a: "The T is the compact tour head with weaker, traditional lofts — 32 degrees at the 7-iron against the P's 30 — about half the offset, and lower bounce throughout."
