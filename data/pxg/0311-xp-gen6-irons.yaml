sources:
  - "PXG's own GEN6 0311 XP product page (pxg.com/en-us/golf-clubs/irons/0311-xp-gen6-irons, Double Black listing IR-PXG36-BB), archive.org capture of 4 December 2023 — the full spec table (loft, standard length, standard lie, offset and bounce for the 4-iron through the L wedge, stamped W, G, S and L), plus the technology copy: XCOR2 polymer core, 0.050-inch variable-thickness HT1770 maraging face billed as 15 per cent thinner than previous models, Power Channel Technology and 5X forging from 8620 soft carbon steel. The site's navigation on the same capture listed the XP GEN6 at $179.99 per club."
