description: >
  The larger of the two GEN6 iron heads — PXG launched the generation on 23
  March 2023 with only P and XP models, dropping the T — the 0311 XP keeps the
  XP line's strong lofts (a 27-degree 7-iron and 41-degree pitching wedge) and
  adds slightly more offset than the GEN5 XP, plus published specs for 54-degree
  sand and 60-degree lob wedges that the GEN5 chart lacked. GEN6 thinned the
  HT1770 maraging steel face 15 per cent to 0.050 inches (about 1.27 mm) over
  the XCOR2 polymer core, added Power Channel Technology — a U-shaped corridor
  milled into the internal face surface to increase deflection — and kept the
  five-times-forged 8620 carbon steel body. PXG stamps the scoring clubs W, G,
  S and L; they are listed here as PW, GW, SW and LW. Sets were built to order
  in Chrome, Xtreme Dark, Double Chrome and Double Black finishes, so no stock
  shaft is recorded.
