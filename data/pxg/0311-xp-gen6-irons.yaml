faq:
  - q: "What is the loft of a PXG 0311 XP GEN6 7-iron?"
    a: "The PXG 0311 XP GEN6 7-iron has a loft of 27 degrees, a lie of 62.0 degrees and a length of 37.5 inches."
  - q: "Did PXG 0311 XP specs change from GEN5 to GEN6?"
    a: "The lofts, lies and lengths are identical, but the GEN6 chart adds about a hundredth of an inch of offset at every club and publishes 54-degree sand and 60-degree lob wedges that the GEN5 chart did not."
  - q: "Was there a PXG 0311 T GEN6?"
    a: "No. PXG launched GEN6 on 23 March 2023 with only the P and XP iron heads; the tour-iron slot was filled by the separate 0317 line."
  - q: "What changed inside the PXG 0311 XP GEN6?"
    a: "The HT1770 maraging steel face was thinned 15 per cent to 0.050 inches and Power Channel Technology, a U-shaped internal channel behind the face, was added — both on top of the XCOR2 polymer core carried over from GEN5."
