description: >
  The Lightning hybrids launched on 2 December 2025 with the Lightning
  drivers and fairways, replacing the Black Ops hybrids. The single head
  design runs a seven-loft ladder from a 17° 2-hybrid all the way to a 34°
  8-hybrid — the widest hybrid range PXG has offered — with head weights
  stepping from 230 g to 260 g, three sole weight ports (one 12.5 g and two
  2.5 g) and PXG's adjustable shaft adapter on every head. Launch pricing
  was $330 per club.
variants:
  - name: Lightning
    description: >
      The single hybrid head in seven lofts, with lower face weighting and
      reworked sole camber for turf interaction, three weight ports and the
      adjustable adapter. Every loft except the right-hand-only 17° head
      comes in both hands.
