faq:
  - q: "What lofts does the PXG Lightning hybrid come in?"
    a: "Seven lofts: 17, 19, 22, 25, 28, 31 and 34 degrees — a 2-hybrid through 8-hybrid, the widest hybrid range PXG has offered. Only the 17 degree head is right-hand only."
  - q: "Is the PXG Lightning hybrid adjustable?"
    a: "Yes — every loft carries PXG's eight-position shaft adapter (plus or minus 1.5 degrees of loft, lie to 3 degrees flat) plus three sole weight ports with 17.5 grams of movable mass for bias and swing weight tuning."
  - q: "What replaced the PXG Black Ops hybrid?"
    a: "This one — the Lightning hybrids replaced the Black Ops hybrids on 2 December 2025, with lower face weighting, better turf interaction and two extra lofts at the top of the ladder."
