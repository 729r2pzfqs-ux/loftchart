hosel:
  system: "PXG adjustable shaft adapter"
  loft_range: "±1.5°"
  positions: 8
  lie_effect: >
    The Standard "Dot" is the most upright position; every other setting
    flattens lie by 0.5° to 3° relative to it. There is no
    upright-beyond-Dot setting.
  face_note: >
    PXG markets the upright Dot setting for draw bias and the flattest "PXG
    Standard" setting for fade bias; loft changes shift effective face angle
    at address as on any adapter.
  notes: >
    PXG uses the same universal adapter across its metalwoods; the chart is
    PXG's published one. The stated lie in the chart above is measured at
    the Standard "Dot" position.
