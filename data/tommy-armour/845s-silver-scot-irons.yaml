description: >
  The 845s Silver Scot is one of the best-selling irons ever made: designer John
  Hoeflich's investment-cast "Cavity Balanced" design was introduced to the Tommy Armour
  sales force in August 1987 and went on to sell more than 660,000 sets over a roughly
  seven-year catalog run, shipping over 30,000 sets in 1988 alone against an original
  forecast of 7,500. Hoeflich set out to duplicate the Ping Eye2's consistent
  centre-of-gravity placement in a traditional Wilson Staff/MacGregor-style profile,
  with a straight leading edge and progressive offset, and its success pushed Ben Hogan
  to answer with the Edge. The full range ran 1-iron through four wedges — PW (48
  degrees), W3 gap wedge (52), SW (56) and W4 lob wedge (60) — in right and left hand,
  with ladies' models alongside. Stock shafts were True Temper-made Tommy Armour Tour
  Step (X, S, R, A and L flexes) or True Temper Dynamic Gold, with swing weights from
  roughly C8 to D2 depending on flex, and Tommy Armour Victory grips by Golf Pride. The
  specs below are from Tommy Armour's own 1988 Golfer's Guide catalog (36-degree 7-iron);
  note that a widely copied online spec database instead lists lofts about a degree
  weaker (35-degree 7-iron) with quarter-inch-longer lengths, a conflict documented in
  the sources.
