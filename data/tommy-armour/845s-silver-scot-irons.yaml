sources:
  - "Tommy Armour 'Golfer's Guide Silver Scot 845s' catalog (copyright 1988 Tommy Armour Golf), page scans reproduced in The Hackers Paradise's 'Throwback Thursday - Tommy Armour 845s Irons' article — the manufacturer specifications table for men's right- and left-hand irons (1-iron through PW, W3, W4 and SW: loft, standard lie and length as recorded here), the ladies' iron table, the Dynamic Fitting System length (+/-1 inch) and lie (2 degrees flat to 2 degrees upright) options, the shafts-and-swingweights table (Tour Step X D0-D2, S C9-D1, R C8-D0, L C6-C8, A C7-C9; Dynamic Gold X D0-D2, S C9-D1, R C8-D0), Tommy Armour Victory grips by Golf Pride, U-groove or PGA-Tour-approved V-groove options, and model numbers for men's RH (18450X), men's LH (18452X) and ladies' RH (18454X)"
  - "MyGolfSpy, 'The Story of an Icon: The Tommy Armour 845s' (retrieved via Wayback Machine) — interview with designer John Hoeflich: introduction to the sales force at the American Club in Wisconsin in August 1987, the design goal of duplicating the Ping Eye2's centre-of-gravity consistency in a traditional profile using R.G. Molds investment-cast tooling, the 845 name deriving from PGA Golf's 8350 North Lehigh Avenue address, 'a 36-degree 7-iron and light swing weights ranging from C9 to D1 in stiff flex' (corroborating the catalog table), more than 660,000 sets sold over a seven-year run, and the Ben Hogan Edge being launched in response"
  - "The Hackers Paradise Throwback Thursday article, quoting Hoeflich: 'The original forecast was 7,500 sets and I think we shipped over 30,000 in 1988' — corroborates the August 1987 introduction and first-year volume. year_introduced 1987 is the announcement year; retail volume began in 1988, which is why some references (including the GolfWorks MPF chart, which lists the '845s Silver Scot (original)' under 1988) date it a year later"
  - "CONFLICT NOTE: GolfClubSpec.com (Equip2Golf), the spec database most often copied online, lists the 845s with lofts about one degree weaker (3-iron 21/7-iron 35/PW 47), lengths a quarter inch longer (7-iron 36.75 in) and D1-D5 swing weights. This entry follows the 1988 manufacturer catalog, which matches the designer's own '36-degree 7-iron' and C9-D1 stiff swing weight statements; the database figures may reflect a later production revision or independent measurement, and per-club offset and bounce are omitted because they appear only in that conflicting source"
  - "GolfWorks Maltby MPF ratings chart (golfworks.com MPF_TOMMYARMOUR.pdf) — lists the 845s Silver Scot (original) with a 677 MPF rating in the Game Improvement category, basis for the category field, and the 855s Silver Scot under 1995, basis (with the roughly seven-year catalog run) for year_discontinued 1995 and the successor field"
faq:
  - q: "What is the loft of a Tommy Armour 845s Silver Scot 7-iron?"
    a: "Per Tommy Armour's 1988 catalog, the 845s 7-iron has a loft of 36 degrees, with a 61.5-degree lie and a 36.5-inch length. A widely copied online spec database lists it at 35 degrees and 36.75 inches instead; the catalog figure matches designer John Hoeflich's own description."
  - q: "Why are the Tommy Armour 845s irons famous?"
    a: "They are one of the best-selling iron models in history, selling more than 660,000 sets over a roughly seven-year run from 1987. The design put Ping Eye2-style consistent centre-of-gravity placement into a traditional-looking investment-cast head, and its success prompted Ben Hogan to launch the Edge in response."
  - q: "What wedges were available for the Tommy Armour 845s?"
    a: "Four: the 48-degree pitching wedge, a 52-degree W3 gap wedge, a 56-degree sand wedge and a 60-degree W4 lob wedge, all at a 63-degree lie and 35.5-inch length."
  - q: "What shafts came in the Tommy Armour 845s?"
    a: "The custom-fitted Tommy Armour Tour Step shaft, made by True Temper with a high flex point and low torque, in X, S, R, A and L flexes, or True Temper Dynamic Gold in X, S and R. Stiff-flex sets ran light swing weights of about C9 to D1."
