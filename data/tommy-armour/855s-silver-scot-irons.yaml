faq:
  - q: "What is the loft of a Tommy Armour 855s Silver Scot 7-iron?"
    a: "The Tommy Armour 855s Silver Scot 7-iron has a loft of 36 degrees, a lie of 61.5 degrees and a length of 37.25 inches — the same loft as the 845s catalog spec but built a quarter inch longer."
  - q: "What is the difference between the Tommy Armour 845s and 855s?"
    a: "The 855s is the 845s's successor, announced in late 1994. It kept the same investment-cast, cavity-balanced concept and identical lofts, but used a slightly larger head with varied cavity depths for consistent centre-of-gravity placement, and each club was built a quarter inch longer."
  - q: "What wedges came with the Tommy Armour 855s?"
    a: "The set ran through a 48-degree pitching wedge, a 52-degree gap wedge and a 56-degree sand wedge, all at a 63-degree lie."
