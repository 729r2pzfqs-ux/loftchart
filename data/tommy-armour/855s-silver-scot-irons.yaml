description: >
  The 855s Silver Scot followed the enormously successful 845s as Tommy Armour's
  flagship cavity-back, announced in late 1994 and sold through the mid-to-late
  1990s. It kept the 845s formula — investment-cast stainless steel, perimeter
  weighting and progressive offset behind a relatively traditional profile — while
  enlarging the head slightly and varying the cavity depth through the set to keep
  the centre of gravity consistent. Lofts are identical to the 845s catalog spec
  (36-degree 7-iron), but the set was built a quarter inch longer per club and the
  full range again ran from a 1-iron through the 48-degree pitching wedge, a
  52-degree gap wedge and a 56-degree sand wedge.
