sources:
  - "GolfClubSpec.com / Equip2Golf specification database (mirrored at qsponge.com, 'What is loft angle of Tommy Armour 855s Irons?') — full 1-iron-through-SW loft, lie and length chart as recorded here. Individual-club retail listings (2nd Swing, Mikes Golf Outlet, golfroots, eBay) corroborate the 24.5-degree 4-iron and the 2-PW-plus-wedges set makeup with True Temper steel shafts."
  - "Driving Range Heroes, 'Throwback Golf: Tommy Armour 855s Silver Scot Irons Review' — cast stainless cavity-back with oversized head, perimeter weighting, progressive offset and varied cavity depths for consistent CG placement; production dated to the mid-to-late 1990s; steel and graphite stock options."
  - "Year note: year_introduced 1994 is the announcement year, with retail volume in 1995 — the GolfWorks Maltby MPF chart (MPF_TOMMYARMOUR.pdf) lists the 855s Silver Scot under 1995, and this site's 845s entry records 1995 as the year its successor (this model) was announced. year_discontinued is null because no successor announcement is documented; the model was in practice out of the catalog by the late 1990s."
  - "Spec-provenance note: unlike the 845s entry (built from the 1988 factory catalog), no 855s factory catalog scan was available, so this chart follows the spec database; lofts match the 845s catalog exactly while lengths run 0.25 inch longer per club. Offset and bounce are not published in any consulted source and are omitted."
