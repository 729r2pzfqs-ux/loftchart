description: >
  The 845 Max joined Dick's Sporting Goods' Tommy Armour line in 2020 (model code
  MM20) as the super-game-improvement companion to the standard 845, replacing the
  Atomic as the brand's maximum-forgiveness iron. It shares the 845's L-Cup
  variable-thickness face, tungsten toe weighting and 3M vibration-dampening tape
  but swaps the hollow body for an ultra-wide sole that pushes the centre of
  gravity lower and deeper. Lofts run one degree weaker than the standard 845 and
  the stock build used lightweight UST Mamiya Recoil ESX graphite shafts at a
  light D1 swing weight. A refreshed 2021 845-MAX with different lofts replaced
  it after one season.
