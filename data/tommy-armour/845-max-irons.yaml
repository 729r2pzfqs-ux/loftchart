faq:
  - q: "What is the loft of a Tommy Armour 845 Max (2020) 7-iron?"
    a: "The 2020 Tommy Armour 845 Max 7-iron has a loft of 30 degrees, a lie of 62.5 degrees and a graphite-build length of 37.125 inches."
  - q: "What is the difference between the Tommy Armour 845 and 845 Max?"
    a: "The 845 Max is the super-game-improvement version: it has an ultra-wide sole instead of the 845's hollow body, a slightly larger head with more offset, lofts one degree weaker across the board, and a lighter graphite-first build at a D1 swing weight."
  - q: "Is the 2020 845 Max the same as the 2021 845-MAX?"
    a: "No. The 2021 845-MAX is a refreshed model with different lofts (a 31-degree 7-iron versus 30 degrees here) and steel-shaft builds at D2; the 2020 original recorded here lasted a single season."
