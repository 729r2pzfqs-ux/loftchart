description: >
  The Silver Scot 986 Tour is a traditional forged blade from Tommy Armour's
  PGA Golf era, sold alongside the brand's persimmon-headed 986 Tour woods —
  collector listings for complete 986 Tour bags routinely pair the persimmon
  driver and fairway woods with this iron head. Player forum consensus (a
  long-running GolfWRX thread on the model) dates production to 1986 through
  1995, with "PGA" stamped on the sole of the earliest heads, and describes a
  straight-blade profile with no offset — some owners note it may even run
  slightly onset — putting it closer in feel to a true muscle-back than the
  cavity-backed 845s Silver Scot the same company sold at the same time.
  Forum players comparing notes on the model's lofts, which are strong for a
  1980s blade, matched them up against the contemporary Wilson Staff FG-17 and
  FG-51 tour blades rather than any factory chart, since Tommy Armour's own
  spec sheet for the model has not surfaced online. Sold 3-iron through
  pitching wedge with True Temper Dynamic Gold shafts in the standard tour
  stiff/regular flexes of the day.
