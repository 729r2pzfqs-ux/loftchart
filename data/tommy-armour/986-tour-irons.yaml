sources:
  - "GolfWRX forum thread 'Tommy Armour Silver Scott 986 Tour Blades' (forums.golfwrx.com/topic/616450), read via cached text — the primary source for the facts recorded here: production dated by consensus to '1986 to 1995', the first model year stamped 'PGA' on the sole, a no-offset (possibly onset) blade profile, and lofts strong enough that players cross-referenced them against the contemporary Wilson Staff FG-17 and FG-51 tour blades rather than a Tommy Armour factory chart, with candidate 2-iron/5-iron/PW readings of either 20/30/50 or 19/29/49 degrees offered in the thread."
  - "SPEC-PROVENANCE NOTE (confidence: low): no manufacturer catalog, retailer spec chart, or GolfWorks/equip2golf database entry for the 986 Tour's per-club loft, lie or length could be located — unlike the cast 845s Silver Scot and 855s Silver Scot, which have documented factory charts (see those entries), this forged blade appears to be undocumented online outside forum recollection and individual auction listings. The loft ladder above is built from the GolfWRX thread's 3-degree-per-club long-iron / 4-degree-per-club short-iron framework anchored near its cited 5-iron/PW readings; lie and length follow the same standard-steel progression as this site's Tommy Armour 845s Silver Scot entry (same manufacturer and era) rather than model-specific figures. Treat every spec below as an informed approximation, not a verified factory number."
  - "Retail/auction listings (2nd Swing 'Tommy Armour Silver Scot 986 Tour Blade Iron Set'; Worthpoint 'Tommy Armour 986 Tour Persimmon woods & irons Staff Bag'; multiple eBay/PicClick listings) — corroborate the 3-iron-through-pitching-wedge set makeup, True Temper Dynamic Gold shafts, and the persimmon-wood-era (mid-1980s) production window, without providing a per-club numeric chart."
