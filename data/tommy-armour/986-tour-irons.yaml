  - q: "What is the loft of a Tommy Armour 986 Tour 7-iron?"
    a: "No factory chart for the 986 Tour has surfaced online. Based on forum cross-referencing against the contemporary Wilson Staff FG-17/FG-51 blades, the 7-iron loft is approximately 37 degrees — treat this as an informed estimate rather than a verified manufacturer figure."
  - q: "When was the Tommy Armour 986 Tour made?"
    a: "Player forum consensus dates production to 1986 through 1995, under Tommy Armour's PGA Golf ownership, with the earliest heads stamped 'PGA' on the sole."
  - q: "Is the Tommy Armour 986 Tour a blade or a cavity back?"
    a: "A true forged one-piece blade with no offset (some owners describe it as slightly onset) — a traditional players' blade, unlike the cavity-backed, cast 845s Silver Scot the company sold at the same time."
