sources:
  - "equip2golf.com 'Armour 845s Oversize Specifications' (equip2golf.com/specifications/armour/armour_845s.html) and its qsponge.com mirror ('What is loft angle of Tommy Armour 845s Oversize Irons?') — the full 1-iron-through-LW factory-format chart used here: lofts 16 through 60 degrees, lies 58.5-64.5, offsets 0.393 down to 0.025 inches, bounces -2 to 15 degrees, lengths 39.75 down to 35.25 inches, and swingweights D1-D3 (D1-D3 for 1-9, D2-D4 PW/GW, D3-D5 SW/LW). Both mirrors agree on every figure, cross-checked club by club."
  - "GolfWorks Maltby MPF Ratings chart (golfworks.com/content/PDFs/Head_MPFs/MPFRatingsChart.pdf, retrieved July 2026) — lists 'TOMMY ARMOUR 845s Oversize 1998, MPF 400' and 'TOMMY ARMOUR 845s Oversize Plus 2002, MPF 825', which fix year_introduced 1998 and the 2002 successor; the same chart's 845s Silver Scot (original) 1988 and 855s Silver Scot 1995 entries are the basis for this site's other Tommy Armour Silver Scot files, so the 1998 date is treated as reliable on the same basis."
  - "forums.golfwrx.com 'Old School - 845s Oversize' thread (read via cached text) — corroborates the cavity-balanced oversized cast head, an owner's 2002 Oversize Plus set described by another poster as 'the same design as the Oversize but a little bigger' (fixing the succession), and aftermarket Royal Precision stepless rifle steel shaft builds alongside factory steel and graphite options."
  - "2nd Swing Golf and Mike's Golf Outlet product listings for the '845s Oversize Iron Set' and 'Single Iron' — corroborate the 3-PW and 4-PW,SW set configurations sold at retail and the steel/graphite shaft choice; the full 1-LW range recorded above is the equip2golf/qsponge factory chart, of which retailers typically sold only a subset."
