description: >
  The 845s Oversize enlarged Tommy Armour's cavity-balanced Silver Scot head
  for extra forgiveness, carrying the full 1-iron-through-lob-wedge range the
  original 845s catalog offered rather than the shorter sets typical of later
  Tommy Armour lines. The GolfWorks' own Maltby MPF ratings chart — the same
  database this site uses for the 845s and 855s Silver Scot entries — dates
  the model to 1998 and lists the larger-headed 845s Oversize Plus as its
  2002 successor, described on GolfWRX as "the same design as the Oversize
  but a little bigger." Owners on GolfWRX report both stock and aftermarket
  shaft builds, including Royal Precision stepless rifle steel. Lofts are
  identical to the original cast 845s catalog through the wedges, and the
  set was cataloged in both steel and graphite.
