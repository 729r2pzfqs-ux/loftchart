faq:
  - q: "What is the loft of a Tommy Armour 845s Oversize 7-iron?"
    a: "The 845s Oversize 7-iron has a loft of 35 degrees, a lie of 62.5 degrees and a length of 36.75 inches — the same loft as the original 1987 845s Silver Scot catalog, in a larger cavity-balanced head."
  - q: "When was the Tommy Armour 845s Oversize made?"
    a: "The GolfWorks' own Maltby MPF ratings chart dates it to 1998, with the larger-headed 845s Oversize Plus following in 2002."
  - q: "What is the difference between the 845s Oversize and 845s Oversize Plus?"
    a: "Per GolfWRX forum consensus, the Oversize Plus (2002) is 'the same design as the Oversize but a little bigger' — a further-enlarged version of the same cavity-balanced cast head."
  - q: "What wedges came with the Tommy Armour 845s Oversize?"
    a: "The full factory chart runs to a 51-degree gap wedge, 55-degree sand wedge and 60-degree lob wedge, though most retail sets were sold as a shorter 3-PW or 4-PW-plus-SW selection."
