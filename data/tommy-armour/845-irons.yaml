faq:
  - q: "What is the loft of a Tommy Armour 845 (2019) 7-iron?"
    a: "The 2019 Tommy Armour 845 7-iron has a loft of 29 degrees, a lie of 62.5 degrees and a length of 37 inches."
  - q: "Are the 2019 Tommy Armour 845 irons related to the classic 845s Silver Scot?"
    a: "Only by name. Dick's Sporting Goods bought the Tommy Armour brand and relaunched it in 2018; the 2019 845 is a modern two-piece hollow-body game-improvement iron sold exclusively at Dick's and Golf Galaxy, trading on the 845 name of the 1987 classic."
  - q: "What is the set makeup of the Tommy Armour 845 irons?"
    a: "The stock set is seven pieces: 5-iron through pitching wedge (43.5 degrees) plus a 49-degree approach wedge, with True Temper XP 85 steel shafts."
