description: >
  The 845 irons revived Tommy Armour's most famous model number for Dick's
  Sporting Goods' relaunched house brand, announced in autumn 2019 as the
  game-improvement iron of the MM20 line (a companion 845 FORGED players-distance
  model was sold alongside). The two-piece hollow-body stainless construction
  carries an L-Cup face with variable face thickness, high-density tungsten toe
  weighting and 3M vibration-dampening tape, and the set won a 2020 Golf Digest
  Hot List award. The stock seven-piece set ran 5-iron through pitching wedge
  plus a 49-degree approach wedge, sold exclusively through Dick's Sporting Goods
  and Golf Galaxy.
