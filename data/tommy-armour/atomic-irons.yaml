description: >
  The Atomic irons headlined Dick's Sporting Goods' 2018 relaunch of the Tommy
  Armour brand, built by Performax with a DAT-55 titanium cup face joined to a
  steel body through a patented brazing process — a construction normally seen
  in far more expensive distance irons. A 60-gram tungsten sole weight drives
  the centre of gravity low and toward the toe for high launch and forgiveness,
  behind very strong lofts (27-degree 7-iron). The stock set ran 4-iron through
  pitching wedge plus a 46-degree approach wedge with True Temper XP 85 steel
  shafts; an even larger hybrid-like Atomic MAX model was sold alongside. The
  845 family replaced the Atomic in the lineup from 2020.
