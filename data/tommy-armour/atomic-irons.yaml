faq:
  - q: "What is the loft of a Tommy Armour Atomic 7-iron?"
    a: "The Tommy Armour Atomic 7-iron has a very strong loft of 27 degrees, with a 62.5-degree lie and a 37.125-inch length."
  - q: "What makes the Tommy Armour Atomic irons unusual?"
    a: "They combine a DAT-55 titanium cup face with a steel body through a patented brazing process and add a 60-gram tungsten sole weight — hollow-body distance-iron construction sold at a big-box price when Dick's relaunched the Tommy Armour brand in 2018."
  - q: "Why are the Atomic's lofts so strong?"
    a: "The design brief was maximum distance for higher-handicap players: the thin brazed titanium face and low, toe-biased tungsten weighting produce enough launch that Tommy Armour ran the 7-iron at 27 degrees, roughly two clubs stronger than a traditional 7-iron."
