faq:
  - q: "What is the loft of a Tommy Armour 845+ 7-iron?"
    a: "The 2024 Tommy Armour 845+ 7-iron has a loft of 31 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "How good are the Tommy Armour 845+ irons?"
    a: "In MyGolfSpy's 2024 Most Wanted test they took first place in the super-game-improvement class — best for forgiveness, second best for accuracy and the best value in the test at $399.99 for the seven-piece set."
  - q: "What shafts come in the Tommy Armour 845+ irons?"
    a: "Stock options are the lightweight SL85 steel shaft or UST Mamiya Recoil graphite, sold exclusively through Dick's Sporting Goods and Golf Galaxy."
