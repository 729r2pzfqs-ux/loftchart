description: >
  The 2024 845+ brought the Tommy Armour 845 name back to Golf Galaxy and Dick's
  Sporting Goods after a two-year gap, as a $399.99 maximum-forgiveness set. A
  rail system on the sole improves turf interaction, and a new head shape with a
  shorter hosel and longer blade lowers the centre of gravity and raises the
  moment of inertia. It swept MyGolfSpy's 2024 Most Wanted test in the
  super-game-improvement class — best overall, best for forgiveness and best
  value — so while it is filed here as a game-improvement iron, testers treat it
  as the most forgiving end of that spectrum. The stock set runs 5-iron through
  pitching wedge plus a 50-degree approach wedge with SL85 steel or UST Mamiya
  Recoil graphite shafts.
