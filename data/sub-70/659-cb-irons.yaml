description: >
  Forged players cavity back from Sub 70, the direct-to-consumer maker in
  Sycamore, Illinois, released in early 2022 alongside the 659 MB blade and
  659 TC tour cavity as a three-model family. Each head is forged and milled
  from a single billet of DT-4 soft carbon steel; the model succeeds the
  639 CB with the same head size and offset but more mass low in the head for
  a lower centre of gravity, and the 3-, 4- and 5-irons carry an undercut
  cavity for higher ball speed. Lofts are traditional for the class — 32
  degrees at the 7-iron and 45 at the pitching wedge — and all three 659
  models share one loft and lie chart so they can be blended into combo sets.
  The stock chart runs 3-iron through a 50-degree gap wedge that Sub 70 stamps
  AW, listed here as GW. Sold at 109 dollars per club in Brushed Chrome satin,
  black and raw finishes, with .355 taper-tip and .370 parallel hosel versions,
  and built to order with a wide menu of no-upcharge shafts and grips. Still in
  Sub 70's line as of mid-2025 with no announced successor.
