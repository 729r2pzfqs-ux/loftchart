faq:
  - q: "What is the loft of a Sub 70 659 CB 7-iron?"
    a: "The Sub 70 659 CB 7-iron has a loft of 32 degrees, a lie of 61.5 degrees and a standard steel length of 37 inches."
  - q: "Is the Sub 70 659 CB forged?"
    a: "Yes. Each head is forged and then CNC milled from a single billet of DT-4 soft carbon steel, and the 3- through 5-irons add an undercut cavity for extra ball speed."
  - q: "Can the Sub 70 659 CB be combined with the 659 MB or 659 TC?"
    a: "Yes. All three 659 models share the same loft and lie chart, so Sub 70 explicitly supports combo sets — for example CB long irons blending through TC into MB short irons."
  - q: "How do Sub 70 659 CB lofts compare with the 699 V2?"
    a: "The 659 CB is two degrees weaker through the scoring clubs — 32 degrees at the 7-iron and a 45-degree pitching wedge against the 699 V2's 30 and 43 — reflecting its traditional players-iron positioning."
