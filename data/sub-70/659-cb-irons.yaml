sources:
  - "Sub 70 official 659 CB Satin Irons product page (golfsub70.com/sub-70-659-cb-forged-satin-irons.html, archive.org capture of 19 March 2022) — full specification table for 3-iron through AW (listed here as GW): loft, lie, offset, bounce, head weight and standard steel/graphite lengths, plus the construction copy: forged and milled from a billet of DT-4 soft steel, undercut cavity in the 3-, 4- and 5-irons, same head size and offset as the 639 CB with added sole weight, and loft/lie consistency with the 659 MB and 659 TC for combo sets. Offsets are published in millimetres (3.5 mm at the 3-iron to 1.5 mm at the AW) and converted to inches here; lengths listed are the standard steel build, graphite runs 0.5 inch longer."
  - "MyGolfSpy 'Sub 70 659 Irons (MB, TC and CB)' (mygolfspy.com/news-opinion) — 2022 launch coverage of the three-model 659 family; pricing of 109 dollars per club (763 dollars for a seven-piece set)."
  - "Driving Range Heroes 'Sub 70 659 Irons Review' (drivingrangeheroes.com, 6 July 2022) — corroborates the 7-iron at 32 degrees loft, 61.5 lie, 37 inches, and that all three 659 variants share one loft chart; notes prototypes were shown in summer 2021 ahead of the 2022 release."
  - "Note: swing weight is not published and Sub 70 builds every set to order from a large no-upcharge shaft and grip menu, so no single stock shaft is recorded. year_discontinued is null because the 659 CB remained in Sub 70's catalogue as of an August 2025 site capture, with no direct successor announced (the 2025 669 line sits in other categories)."
