description: >
  The 699 Pro took the technology of Sub 70's original 699 — the
  precision-milled 1.7 mm 455 Carpenter steel face and TPE-injected hollow
  body — and refined it into a classic players shape: a thinner 7.0 mm
  topline, a compact 74 mm blade at the 6-iron, sharply reduced offset and
  a black Tour PVD finish that Sub 70's copy promised would age "in the
  dignified manner of a good cigar". Its product page was live by December
  2019, and lofts are identical to the standard 699 — a 31-degree 7-iron
  and 45-degree pitching wedge across a 4-AW chart — so the two heads
  could be blended into combo sets. In MyGolfSpy's 2019 Most Wanted
  players-distance test the 699 family finished ahead of entries from
  Callaway, Ping and Titleist, helping establish the direct-to-consumer
  maker's reputation. The 699 Pro V2 replaced it in January 2023. Sets
  were built to order in Sycamore, Illinois from a no-upcharge shaft menu,
  so no stock shaft or swing weight is recorded.
