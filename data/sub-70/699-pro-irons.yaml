sources:
  - "Sub 70 official 699 Pro product page (golfsub70.com/sub-70-699-pro-irons.html, archive.org capture of 20 November 2021) — full specification table for 4-iron through AW: loft, lie, offset in millimetres (3.5 down to 0.75, converted to inches here), head weights 249-300 g, standard steel lengths 38.5 to 35.5 inches (graphite 0.5 inch longer), 455 Carpenter steel material, 7.0 mm topline, 74 mm blade length at the 6-iron and .370 parallel hosel, plus the construction copy on the thinner topline, decreased offset and black Tour PVD finish."
