faq:
  - q: "What is the loft of a Sub 70 699 Pro 7-iron?"
    a: "The Sub 70 699 Pro 7-iron has a loft of 31 degrees, a lie of 62.5 degrees and a standard steel length of 37 inches — identical to the standard 699, which shares its whole loft chart."
  - q: "Is the Sub 70 699 Pro forged?"
    a: "No. Like the standard 699 it is a two-piece hollow-body iron with a precision-milled 1.7 mm 455 Carpenter steel face and a TPE resin-injected core; the Pro differs in shape, offset and its black Tour PVD finish."
  - q: "How much offset does the Sub 70 699 Pro have?"
    a: "3.5 mm (0.138 inches) at the 4-iron tapering to 0.75 mm at the AW — roughly 40 per cent less than the standard 699 at the long end, which is the main reason Sub 70 pitched it at lower handicaps."
  - q: "When was the Sub 70 699 Pro replaced?"
    a: "Sub 70 announced the 699 Pro V2 on 6 January 2023, with stronger lofts (30-degree 7-iron) and a new S450 steel face."
