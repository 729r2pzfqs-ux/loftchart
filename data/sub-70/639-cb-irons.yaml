description: >
  The 639 CB was the players cavity back in the first forged iron family from
  Sub 70, the direct-to-consumer maker in Sycamore, Illinois, released in July
  2019 alongside the 639 MB blade. Each head starts as a solid billet of what
  Sub 70's copy calls DT-4 soft stainless steel, is precision forged, and gets
  a custom-milled back; a rounded leading edge and sole are ground in for
  cleaner turf interaction. Lofts are traditional — a 32-degree 7-iron and a
  44-degree pitching wedge across the 3-PW chart — and the CB shares its lie
  chart with the 639 MB so the two blend into combo sets. The 659 CB of 2022
  was designed as its successor with the same head size and offset, but
  Sub 70 has kept the 639 CB in the line alongside it, and the model was still
  sold in satin and raw finishes as of a May 2025 site capture, so no
  discontinuation year is recorded.
