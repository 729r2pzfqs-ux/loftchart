sources:
  - "Sub 70 official 639 CB Irons product page (golfsub70.com/sub-70-639-cb-irons.html, archive.org capture of 26 January 2021) — full specification table for 3-iron through PW: loft, lie, offset in millimetres (3.5 down to 1.75, converted to inches here), bounce, head weights 242 to 292 g, standard steel lengths 39 to 35.75 inches (graphite listed 0.5 inch longer), DT-4 steel material and Brushed Chrome finish, plus the billet-forged, custom-milled-back construction copy. The steel lengths are recorded as the standard spec."
  - "MyGolfSpy 'Sub 70 Irons: Model By Model' — 639 CB release date of July 2019, players cavity-back positioning; consistent with the earliest archive.org captures of the product page from 21 July 2019."
  - "Sub 70 official 659 CB product copy (2022) — states the 659 CB keeps the same head size and offset as the 639 CB with more mass low in the head, establishing the successor field."
  - "Note: year_discontinued is null because Sub 70 kept the 639 CB on sale after the 659 family launched in May 2022 — the model still appears in the golfsub70.com iron lineup on an archive.org capture of 14 May 2025. Sub 70 builds every set to order from a large no-upcharge shaft and grip menu, so no stock shaft is recorded. Sub 70's own copy calls the material 'DT-4 soft stainless steel'; its 659-era pages describe DT-4 as a soft carbon steel."
