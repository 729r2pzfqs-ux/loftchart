faq:
  - q: "What is the loft of a Sub 70 639 CB 7-iron?"
    a: "The Sub 70 639 CB 7-iron has a loft of 32 degrees, a lie of 61.5 degrees and a standard steel length of 37 inches."
  - q: "Is the Sub 70 639 CB forged?"
    a: "Yes. Each head starts as a solid billet of DT-4 soft steel, is precision forged, and is finished with a custom-milled cavity back."
  - q: "Is the Sub 70 639 CB discontinued?"
    a: "No. The 659 CB was launched in 2022 as its successor with the same head size and offset, but Sub 70 kept the 639 CB in its range, and it was still listed in the company's iron lineup as of May 2025."
  - q: "Can the Sub 70 639 CB be combined with the 639 MB?"
    a: "Yes. The 639 CB and 639 MB share the same lie chart and lengths, and Sub 70 sold factory MB/CB combo sets with cavity backs in the long irons and blades in the scoring clubs."
