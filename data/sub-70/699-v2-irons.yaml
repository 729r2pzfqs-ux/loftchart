description: >
  Second generation of the hollow-body distance iron from Sub 70, the
  direct-to-consumer maker in Sycamore, Illinois, announced in early January
  2023 after what the company described as three years of development on the
  original 699 of 2019. The two-piece head keeps the TPE resin-injected hollow
  body in 431 stainless steel and adds a 1.7 mm variable-face-thickness (VFT)
  face in S450 aerospace steel, aimed at more consistent ball speed across the
  face. It is the wider-bodied, more offset sibling of the 699 Pro V2 — the two
  share an identical loft, lie, length and bounce chart (30 degrees at the
  7-iron, 43 at the pitching wedge), but the standard 699 V2 carries roughly
  twice the offset and an 8 mm topline on a longer 75 mm blade. Heads run
  4-iron through sand wedge with set-matching gap and sand wedges; a
  single-length version built to 7-iron length and lie is sold separately.
  Sub 70 builds every set to order with a wide menu of no-upcharge shafts and
  grips, in Brushed Satin and black finishes. The 2025 discontinuation date is
  the announcement of the 699 V3; Sub 70 continued to sell the V2 alongside it.
