faq:
  - q: "What is the loft of a Sub 70 699 V2 7-iron?"
    a: "The Sub 70 699 V2 7-iron has a loft of 30 degrees, a lie of 62 degrees and a standard steel length of 37 inches."
  - q: "What is the difference between the Sub 70 699 V2 and the 699 Pro V2?"
    a: "They share the same lofts, lies, lengths and bounces, but the standard 699 V2 is the game-improvement head: a longer 75 mm blade with roughly twice the offset (0.16 inches at the 7-iron against the Pro's 0.10) and a slightly heavier head at each club. The Pro V2 also adds a 17-degree 3-iron that the standard set does not offer."
  - q: "Is the Sub 70 699 V2 forged?"
    a: "No. It is a two-piece hollow-body iron with a 431 stainless steel body, a TPE resin-injected cavity and a 1.7 mm S450 aerospace steel face."
  - q: "Did the Sub 70 699 V2 come in a single-length version?"
    a: "Yes. Sub 70 sold a 699 v2 SL variant with every club built to 7-iron length and lie, alongside the conventional progressive-length set listed here."
