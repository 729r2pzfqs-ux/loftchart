faq:
  - q: "What is the loft of a Sub 70 649 MB Tour 7-iron?"
    a: "The Sub 70 649 MB Tour 7-iron has a loft of 34 degrees, a lie of 61.5 degrees and a standard steel length of 37 inches."
  - q: "How much offset does the Sub 70 649 MB Tour have?"
    a: "A uniform 0.5 millimetres (0.02 inches) on every club from 3-iron to pitching wedge — Sub 70 designed it as an effectively neutral face for players who fight a left miss."
  - q: "What does the tungsten weight in the Sub 70 649 MB Tour do?"
    a: "Six grams are ported out of the rear centre of the head and replaced with a 6-gram tungsten plug in the toe, which resists face rotation through impact to guard against the hook."
  - q: "Is the Sub 70 649 MB Tour still made?"
    a: "Yes. As of 2026 it is still sold in satin, raw and taper-tip builds, with the 649 MB TR added alongside it in 2025 rather than replacing it."
