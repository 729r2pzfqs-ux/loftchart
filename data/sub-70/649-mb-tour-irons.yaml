sources:
  - "Sub 70 official 649 MB Tour Raw product page (golfsub70.com/sub-70-649-mb-tour-forged-raw-irons.html, archive.org capture of 7 March 2021) — full specification table for 3-iron through PW: loft, lie, uniform 0.5 mm offset (converted to 0.02 inches here), bounce 0.5 to 4 degrees, head weights 245-295 g, standard steel lengths 39 to 35.75 inches (graphite 0.5 inch longer), DT-4 steel material, 4 mm topline, 76 mm blade at the 6-iron and .370 parallel hosel, plus the design copy: sole widened 1 mm over the 639 MB, rear port with 6 g moved to a tungsten toe weight, and the raw-finish patina note."
  - "MyGolfSpy 'Sub 70 Irons: Model By Model' — release date of 26 January 2021 and the model's positioning as Sub 70's minimal-offset, toe-weighted players blade."
  - "Note: Sub 70's own copy describes DT-4 as its soft forging steel (its 639-era pages call it a soft carbon steel, some pages 'soft stainless'); the same ambiguity is noted on the 639 CB entry. year_discontinued is null because the 649 MB Tour remains on sale in satin, raw and taper-tip versions as of 2026, alongside the 649 MB TR introduced in 2025. No stock shaft or swing weight is recorded because every set is built to order."
