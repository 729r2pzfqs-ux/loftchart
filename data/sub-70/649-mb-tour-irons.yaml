description: >
  The 649 MB Tour is the tour-level blade from Sub 70, the
  direct-to-consumer maker in Sycamore, Illinois, released on 26 January
  2021 after what the company described as two years of input from
  tour-level players. It starts from the compact 639 MB but widens the
  sole by a millimetre, trims offset to a uniform 0.5 mm through the whole
  set — effectively a neutral face — and ports 6 grams from the rear
  centre of the head, replacing it with a 6-gram tungsten weight in the
  toe to keep the face from rotating through impact and, in Sub 70's
  words, eliminate the left miss. Lofts are traditional (34-degree 7-iron,
  46-degree pitching wedge) across a 3-PW chart with a 4 mm topline and a
  76 mm blade at the 6-iron. Sold in satin and raw finishes — the raw
  heads ship unplated and rust into a patina — and still in the line
  alongside the 2025 649 MB TR. Every set is built to order from Sub 70's
  no-upcharge shaft and grip menu, so no stock shaft is recorded.
