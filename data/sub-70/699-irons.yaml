description: >
  The original 699 was the hollow-body distance iron that Sub 70, the
  direct-to-consumer maker in Sycamore, Illinois, launched in its first
  full model year — the product page was live by July 2019, and the head
  stayed in the range unchanged until the 699 V2 arrived in January 2023.
  A precision-milled 1.7 mm 455 Carpenter steel face sits on a hollow body
  injected with TPE resin to stabilise the face and soften sound and feel,
  in a modern head shape with a 7.6 mm topline. Lofts are moderate for a
  distance iron — a 31-degree 7-iron and 45-degree pitching wedge across a
  4-iron-through-AW chart with a 50-degree gap wedge closing the set.
  Sub 70's own model chart of the era filed the 699 as a players-distance
  head for mid handicaps, one step less forgiving than the 799; it is
  recorded here as game improvement to match its more offset, longer-blade
  role opposite the 699 Pro, the classification its successor 699 V2
  carries. Every set was built to order from a no-upcharge shaft and grip
  menu, so no stock shaft or swing weight is recorded.
