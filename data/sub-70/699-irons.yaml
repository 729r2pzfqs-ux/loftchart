faq:
  - q: "What is the loft of a Sub 70 699 7-iron?"
    a: "The original Sub 70 699 7-iron has a loft of 31 degrees, a lie of 62.5 degrees and a standard steel length of 37 inches. The 699 V2 that replaced it in 2023 strengthened the 7-iron to 30 degrees."
  - q: "What is the difference between the Sub 70 699 and 699 Pro?"
    a: "They share identical lofts and lengths, but the standard 699 is the larger, more forgiving head: roughly 60 per cent more offset (3.4 mm at the 7-iron against the Pro's 2.75), a wider 7.6 mm topline and a satin finish, where the Pro ran a thinner topline and black Tour PVD."
  - q: "Is the Sub 70 699 forged?"
    a: "No. It is a hollow-body iron with a precision-milled 1.7 mm 455 Carpenter steel face and a TPE resin-injected core for feel and sound."
  - q: "What clubs came in a Sub 70 699 set?"
    a: "The standard chart ran 4-iron through pitching wedge plus a 50-degree AW gap wedge — eight clubs — with every set hand-built to order in Sycamore, Illinois."
