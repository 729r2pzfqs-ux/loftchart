sources:
  - "Sub 70 official 699 iron product page (golfsub70.com/sub-70-699-iron.html, archive.org capture of 7 November 2021) — full specification table for 4-iron through AW: loft, lie, offset in millimetres (5.7 down to 1.0, converted to inches here), head weights 249-297 g, standard steel lengths 38.5 to 35.5 inches (graphite 0.5 inch longer), 455 Carpenter steel material, 7.6 mm topline, 3.2-inch blade length at the 6-iron and .370 parallel hosel, plus the TPE-injected hollow-body construction copy. The same capture's model chart lists the 699 as 'Players Distance' for mid handicaps."
  - "Driving Range Heroes 'Sub 70 699 Irons Review', 11 March 2020 — corroborates the 31-degree, 62.5-lie 7-iron and the 4-AW eight-club set makeup."
  - "year_introduced 2019 follows the earliest archive.org capture of the product page (21 July 2019), consistent with MyGolfSpy's launch-window coverage of Sub 70's first lineup; the sibling 699 Pro and 639 CB pages date to the same year. Sub 70 was founded in 2018, but the 699 chart is first documented in 2019. year_discontinued 2023 is the 6 January 2023 announcement of the 699 V2, which MyGolfSpy noted carried stronger lofts than this original."
  - "Note: bounce is omitted because the original 699 page published none (unlike the V2), and no stock shaft or swing weight is recorded because Sub 70 builds every set to order from a large no-upcharge shaft and grip menu."
