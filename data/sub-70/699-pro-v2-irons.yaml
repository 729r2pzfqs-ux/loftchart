sources:
  - "Sub 70 official 699 Pro v2 Black Irons product page (golfsub70.com/sub-70-699-pro-v2-black-irons.html, archive.org capture of 7 January 2024) — full specification table for 3-iron through SW: loft, lie, bounce, offset, head weight and standard steel/graphite lengths, plus 431 stainless body, 1.7 mm S450 VFT face, 8 mm topline and 72 mm blade at the 6-iron, .370 parallel hosel, and the construction copy on the expanded channel back, reinforcing ribs, squared leading edge and 4-way cambered sole. Offsets are published in millimetres (5.08 mm at the 3-iron to -0.63 mm at the SW) and converted to inches here; lengths listed are the standard steel build, graphite runs 0.5 inch longer. The black finish is DLC; the Satin version shares the chart."
  - "MyGolfSpy 'Sub 70 699 and 699 Pro V2 Irons' (mygolfspy.com/news-opinion) — launch coverage dated early January 2023 (release 6 January 2023); the Pro positioned as the narrower-sole, shorter heel-to-toe, reduced-offset head of the pair, and stronger-lofted than the 2019 original while remaining in the players-distance class."
  - "Driving Range Heroes 'Sub 70 699 Pro v2 Irons Review' (drivingrangeheroes.com, 6 February 2023) — corroborates the 7-iron at 30 degrees loft, 62 lie, 37 inches."
  - "Note: swing weight is not published and Sub 70 builds every set to order from a large no-upcharge shaft and grip menu, so no single stock shaft is recorded. The 17-degree 3-iron, the 63.3-degree pitching-wedge lie and the negative (onset) sand-wedge offset are as published by Sub 70."
