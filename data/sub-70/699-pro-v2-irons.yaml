description: >
  The compact players-distance head of Sub 70's January 2023 hollow-body pair,
  built by the direct-to-consumer maker in Sycamore, Illinois as the successor
  to the original 699 Pro of 2019. It keeps the two-piece, TPE resin-injected
  hollow body in 431 stainless steel and adds the generation's 1.7 mm
  variable-face-thickness (VFT) face in S450 aerospace steel, with an expanded
  channel-back, two internal reinforcing ribs, a squared leading-edge grind and
  a 4-way cambered sole. Against the standard 699 V2 it runs a shorter 72 mm
  blade with a narrower sole and roughly half the offset — 0.10 inches at the
  7-iron, tapering to zero at the gap wedge and slightly onset at the sand
  wedge — on an identical loft chart: 30 degrees at the 7-iron, 43 at the
  pitching wedge. The head range is unusually wide, from a 17-degree 3-iron
  through a CNC-milled-face 54-degree sand wedge, and Sub 70 also sold a
  matching 699 Pro v2 utility iron. Every set is built to order with
  no-upcharge shaft and grip options, in Satin and black DLC finishes. The
  2025 discontinuation date is the announcement of the 699 Pro V3; Sub 70
  continued to sell the V2 alongside it.
