faq:
  - q: "What is the loft of a Sub 70 699 Pro V2 7-iron?"
    a: "The Sub 70 699 Pro V2 7-iron has a loft of 30 degrees, a lie of 62 degrees and a standard steel length of 37 inches."
  - q: "How does the Sub 70 699 Pro V2 differ from the standard 699 V2?"
    a: "The loft, lie, length and bounce charts are identical, but the Pro V2 has a shorter 72 mm blade, a narrower sole and about half the offset — 0.10 inches at the 7-iron against the standard head's 0.16 — plus a 17-degree 3-iron the standard set does not offer."
  - q: "Is the Sub 70 699 Pro V2 forged?"
    a: "No. Like the standard 699 V2 it is a two-piece hollow-body iron: a 431 stainless steel body with a TPE resin-injected cavity and a 1.7 mm S450 aerospace steel variable-thickness face."
  - q: "What wedges matched the Sub 70 699 Pro V2 set?"
    a: "Sub 70 offered set-matching gap (48 degree) and sand (54 degree) wedges; the sand wedge face is CNC milled for extra spin, and a matching 699 Pro v2 utility iron was sold separately."
