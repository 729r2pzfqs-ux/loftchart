faq:
  - q: "What is the loft of a Sub 70 639 MB 7-iron?"
    a: "The Sub 70 639 MB 7-iron has a loft of 32 degrees, a lie of 61.5 degrees and a standard steel length of 37 inches."
  - q: "Do the Sub 70 639 MB and 639 CB share the same lofts?"
    a: "Almost. The two share lies, lengths and lofts from the 3-iron through 9-iron, but the MB's pitching wedge is 45 degrees against the CB's 44."
  - q: "Is the Sub 70 639 MB a true blade?"
    a: "Yes — it is a forged muscle-back with a 4.6 mm top line at the 6-iron, though Sub 70 kept the face at a moderate size to make it more approachable than a traditional tour blade."
  - q: "Is the Sub 70 639 MB still available?"
    a: "Sub 70 launched the 659 MB as its successor in 2022 but kept the 639 MB around; as of May 2025 it was still sold in factory 639 MB/CB combo sets."
