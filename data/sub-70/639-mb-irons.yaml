description: >
  The 639 MB was the muscle-back half of Sub 70's first forged iron family,
  released in July 2019 alongside the 639 CB from the direct-to-consumer
  maker in Sycamore, Illinois. Each head is precision forged from a solid
  billet of what Sub 70's copy calls DT-4 soft stainless steel and finished
  with a custom milling process; the blade keeps a thin top line — 4.6 mm at
  the 6-iron on a 74 mm blade length — but a moderate face size intended to
  add confidence over a traditional musclerback. The chart runs 3-PW with a
  32-degree 7-iron and, unlike the 639 CB's 44-degree pitching wedge, a
  45-degree PW. The 659 MB of 2022 was designed as its successor, but Sub 70
  kept 639 heads in the range, and as of a May 2025 site capture the 639 MB
  was still sold in factory MB/CB combo sets, so no discontinuation year is
  recorded.
