sources:
  - "Sub 70 official 799 Irons product page (golfsub70.com/sub-70-799-irons.html, archive.org capture of 13 November 2021) — full specification table for 4-iron through SW (the 49-degree wedge Sub 70 stamps AW is listed here as GW): loft, lie, offset in millimetres (5.7 down to 1.0, converted to inches here), head weights 249 to 301 g, standard lengths 39 to 35.75 inches, 455 Carpenter steel material, plus the launch copy: most forgiving Sub 70 iron ever, hollow body with the 699's 1.7 mm 455 Carpenter steel face, TPE resin injection, perimeter weighting, high MOI and a revised ultra-wide sole."
