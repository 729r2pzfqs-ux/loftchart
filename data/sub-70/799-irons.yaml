faq:
  - q: "What is the loft of a Sub 70 799 7-iron?"
    a: "The Sub 70 799 7-iron has a loft of 30 degrees, a lie of 63 degrees and a standard length of 37.5 inches."
  - q: "How forgiving is the Sub 70 799?"
    a: "Sub 70 calls it the most forgiving iron it has ever designed — a hollow-body head with a 1.7 mm 455 Carpenter steel face, TPE resin fill, an ultra-wide sole and heavy perimeter weighting, aimed at players who need help launching the ball."
  - q: "What clubs come in a Sub 70 799 set?"
    a: "The chart runs 4-iron through a 54-degree sand wedge, including a 44-degree pitching wedge and a 49-degree gap wedge that Sub 70 stamps AW."
  - q: "How do Sub 70 799 lofts compare with the 699 V2?"
    a: "The two share a 30-degree 7-iron, but the 799's pitching wedge is one degree weaker at 44 versus 43 — the 799's extra forgiveness comes from its ultra-wide-sole hollow head rather than stronger lofts."
