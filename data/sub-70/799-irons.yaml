description: >
  The 799 is the most forgiving iron Sub 70 has designed, released in July
  2021 at the top of the game-improvement side of the Sycamore, Illinois
  direct-to-consumer maker's range. It pairs the same ultra-thin 1.7 mm
  455 Carpenter steel face as the 699 with a hollow body injected with TPE
  resin, an ultra-wide sole and heavy perimeter weighting, aimed at slower
  swing speeds that need launch. The stock chart runs 4-iron through sand
  wedge with generous offset (5.7 mm at the 4-iron), upright lies and a
  44-degree pitching wedge, followed by a 49-degree gap wedge that Sub 70
  stamps AW (listed here as GW) and a 54-degree SW. The model remains in
  Sub 70's line as of mid-2026 with no announced successor, sold built to
  order with the company's no-upcharge shaft and grip menu.
