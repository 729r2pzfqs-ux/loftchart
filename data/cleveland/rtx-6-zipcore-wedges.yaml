faq:
  - q: "What lofts does the Cleveland RTX 6 ZipCore come in?"
    a: "The RTX 6 ZipCore was sold from 46 to 60 degrees in 2-degree steps — 16 loft, bounce and grind combinations."
  - q: "What grinds does the Cleveland RTX 6 ZipCore offer?"
    a: "Four, each at a fixed bounce: MID (10 degrees, every loft), FULL (12 degrees, 54-60), the C-shaped LOW (6 degrees, 58-60) and the new LOW+ (8 degrees, 54-56)."
  - q: "Is the Cleveland RTX 6 ZipCore still in production?"
    a: "No — Cleveland retired the RTX name with this generation and replaced it with the RTZ in January 2025, so the used and closeout market is the source."
  - q: "What is the difference between the RTX 6 LOW and LOW+ grinds?"
    a: "Both use the C-shaped sole. The LOW carries 6 degrees of bounce at 58 and 60 degrees; the LOW+, new for this generation at 54 and 56 degrees, adds a little more bounce at the leading edge for 8 degrees, aimed at better bunker performance."
