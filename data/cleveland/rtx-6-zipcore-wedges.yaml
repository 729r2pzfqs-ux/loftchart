description: >
  The RTX 6 ZipCore is the sixth and final generation of Cleveland's RTX
  tour wedge line, announced on 9 January 2023 and at retail from 20
  January. It nearly doubled the ZipCore low-density hosel material of the
  2020 original, with the core geometry tuned per loft, and introduced the
  HydraZip face — Rotex milling plus loft-specific laser milling and face
  blasting for wet-condition spin — alongside the sharpest UltiZip grooves
  to that point. The matrix is deliberately simple: 16 loft/bounce/grind
  combinations from 46 to 60 degrees across four grinds, each at a fixed
  bounce. Cleveland retired the RTX name with this generation; the RTZ
  replaced it in January 2025. Finishes were Tour Satin, Black Satin and
  the raw Tour Rack.
grinds:
  - code: LOW
    name: LOW Grind
    description: >
      A C-shaped sole at 6 degrees of bounce for the 58 and 60 degree lob
      wedges — for shallow attack angles and players who take small divots.
  - code: LOW+
    name: LOW+ Grind
    description: >
      New for this generation at 54 and 56 degrees — the Low's C-shape with
      a touch more bounce in the leading edge, at 8 degrees, for better
      sand performance.
  - code: MID
    name: MID Grind
    description: >
      A traditional V-shaped sole at 10 degrees of bounce, offered at every
      loft in the lineup — the all-conditions default.
  - code: FULL
    name: FULL Grind
    description: >
      The highest-bounce sole at 12 degrees, for the 54 to 60 degree
      models — built for rough, bunkers, softer conditions and steeper
      attack angles.
