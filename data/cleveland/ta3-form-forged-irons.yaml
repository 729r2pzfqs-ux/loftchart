faq:
  - q: "What is the loft of a Cleveland TA3 Form Forged 7-iron?"
    a: "The Cleveland TA3 Form Forged 7-iron has a loft of 34 degrees, a lie of 62.5 degrees and a length of 36.75 inches."
  - q: "What is the difference between the Cleveland TA1 and TA3 Form Forged?"
    a: "Both are forged with traditional lofts, but the TA1 is a pure muscle back while the TA3 adds a slight cavity and moderate perimeter weighting — about two degrees weaker in the 7-iron on the TA1 (36 versus 34 degrees) and noticeably more forgiving on the TA3."
  - q: "Is there more than one Cleveland TA3 iron?"
    a: "Yes — a cast Tour Action TA3 appears in 1998-1999 records, and this forged TA3 Form Forged replaced it in 2000, later adding a GunMetal satin-finish version."
