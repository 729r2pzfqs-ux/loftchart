description: >
  The TA3 Form Forged is the cavity-back half of Cleveland's 2000 Form Forged
  pairing, offering "increased forgiveness while maintaining the ability to
  work the ball" through a slight cavity and moderate perimeter weighting,
  with the patented Vibration Absorbing System (VAS) damping impact shock. It
  succeeded the late-90s cast TA3 and sold alongside the TA1 FF muscle back,
  gaining a GunMetal satin finish variant in 2001. Lofts are traditional —
  34 degrees at the 7-iron and 46 at the pitching wedge — and Cleveland
  published the set 1-iron through sand wedge in steel, with Dynamic Gold
  standard. This record files it as a players iron per its forged
  better-player positioning; the task brief's game-improvement label fits the
  wide-soled TA5 and TA6 better. Note Cleveland's published PW lie of 65
  degrees sits above the DW's 64 — recorded as printed.
