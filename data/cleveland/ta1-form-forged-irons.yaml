faq:
  - q: "What is the loft of a Cleveland TA1 Form Forged 7-iron?"
    a: "The Cleveland TA1 Form Forged 7-iron has a loft of 36 degrees, a lie of 62 degrees and a length of 36.75 inches."
  - q: "Are the Cleveland TA1 Form Forged irons blades?"
    a: "Yes — Cleveland marketed the TA1 FF as 'the ultimate in muscle-back performance', a pure forged blade sold 1-iron through pitching wedge, with the TA3 Form Forged as its slightly more forgiving sibling."
  - q: "What shafts came in the Cleveland TA1 Form Forged?"
    a: "True Temper Dynamic Gold (X100, S300, R300) was standard, with Tri-Gold, Royal Precision Rifle and Dynamic Gold Sensicore available as custom options."
