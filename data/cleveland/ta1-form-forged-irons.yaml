description: >
  The TA1 Form Forged sat at the top of Cleveland's Tour Action iron range —
  "the ultimate in muscle-back performance" in the company's own words — and
  was sold alongside the slightly-cavitied TA3 Form Forged from 2000. It is a
  classic forged 1-PW muscle back with fully traditional lofts (36-degree
  7-iron, 48-degree pitching wedge) and no published offset, on True Temper
  Dynamic Gold stock with Tri-Gold, Rifle and Sensicore custom options. A
  GunMetal satin finish variant was added alongside the standard chrome. It
  remained in the line until Cleveland's CG1 blade took its slot in 2004.
  Note that some lists date the TA1 to 1998; Cleveland's own site first shows
  the Form Forged models in 2000, which matches compiled stock-shaft records.
