description: >
  The TA7 was the best-known model of Cleveland's Tour Action iron family
  of the early 2000s — a mid-size cavity-back whose patented micro-cavity
  lightened the topline and dropped the centre of gravity, moving weight
  to the perimeter while keeping a modern heel-to-toe blade length and a
  progressive offset. It combined that with Cleveland's Vibration
  Absorbing System and was offered in standard and gunmetal finishes,
  with a separate TA7 Tour version (2003) offering a more compact head
  and traditional lofts. Lofts on the standard TA7 are mildly strong for
  the era — a 33.5-degree 7-iron and 45-degree pitching wedge — and the
  range ran from a 16-degree 1-iron to a 60-degree lob wedge with True
  Temper's Sensicore Release as the stock shaft. The Tour Action line
  ended when Cleveland's CG series arrived from 2004. Note: this site's
  research places the TA7 in 2002 (manufacturer-era spec databases and
  period listings agree), though some timelines date the Tour Action
  family's origins to the late 1990s.
