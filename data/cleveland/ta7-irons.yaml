faq:
  - q: "What is the loft of a Cleveland TA7 7-iron?"
    a: "The Cleveland TA7 7-iron has a loft of 33.5 degrees, with a 62.5-degree lie and a 36.75-inch steel length."
  - q: "What is the difference between the Cleveland TA7 and TA7 Tour?"
    a: "The standard TA7 is the mid-size micro-cavity model with slightly strong lofts (33.5-degree 7-iron), while the TA7 Tour of 2003 is a more compact, minimal-offset version with traditional lofts (35-degree 7-iron) aimed at better players."
  - q: "When did the Cleveland TA7 come out?"
    a: "Specification databases and period listings place it in 2002, with the TA7 Tour following in 2003; the Tour Action line was replaced by Cleveland's CG series from 2004."
  - q: "What is the micro-cavity on the Cleveland TA7?"
    a: "A patented hollow running along the topline that removes weight from the top of the head, lowering the centre of gravity and freeing mass for the perimeter — the TA7's signature feature, paired with Cleveland's Vibration Absorbing System for feel."
