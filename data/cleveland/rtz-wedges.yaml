faq:
  - q: "What lofts does the Cleveland RTZ come in?"
    a: "The RTZ Tour Satin runs from 46 to 64 degrees in 2-degree steps — 20 loft, bounce and grind combinations. The Black Satin finish covers a narrower 48-60 degree subset, and the raw Tour Rack 48-60."
  - q: "What grinds does the Cleveland RTZ offer?"
    a: "Four, each at a fixed bounce: LOW (6 degrees, 58-62), MID (10 degrees, every loft 46-60), FULL (12 degrees, 54-60) and the new full-face ADAPT (8 degrees, 54-64)."
  - q: "Is the Cleveland RTZ still in production?"
    a: "The RTZ 2 succeeded it in September 2026, but the RTZ remains in Cleveland's catalogue at a reduced price while stock lasts — it carried a 2026 Golf Digest Hot List Gold badge."
  - q: "What is Z-Alloy in the Cleveland RTZ?"
    a: "Cleveland's proprietary head steel, introduced with the RTZ. It is softer and less dense than the 8620 carbon steel used before, which Cleveland credits with about a ten percent softer feel than the RTX 6 ZipCore."
