description: >
  The RTZ is the 2025 generation of Cleveland's tour wedge line and the first
  under the new name — the RTX line ended with the RTX 6 ZipCore. Announced
  on 8 January 2025 and at US retail from 17 January, it moved the head to
  Cleveland's proprietary Z-Alloy steel (about ten percent softer-feeling
  than 8620), kept the low-density ZipCore hosel core, and added HydraZip
  face blasting with laser-milled lines tuned by loft for wet-condition spin
  alongside sharper UltiZip grooves. The Tour Satin matrix charted here runs
  20 loft/bounce/grind combinations from 46 to 64 degrees across four grinds,
  each grind at a fixed bounce; the Black Satin finish covers a narrower
  14-combination subset and the raw Tour Rack variant 16. The RTZ 2 succeeded
  it in September 2026, with the RTZ remaining on sale at a reduced price.
grinds:
  - code: LOW
    name: LOW Grind
    description: >
      6 degrees of bounce with heel, toe and trailing-edge relief and the
      sharpest leading edge in the line. A lob-wedge grind for finesse shots,
      firmer turf, smaller divots and shallower attack angles.
  - code: MID
    name: MID Grind
    description: >
      10 degrees of bounce on an all-around V-shaped sole that cuts smoothly
      through turf. Suits all turf conditions, average divots and neutral
      attack angles — the grind offered at every loft.
  - code: FULL
    name: FULL Grind
    description: >
      12 degrees of bounce on a classic high-bounce sole with the most
      rounded leading edge. Stability on full shots, bunkers and thick rough;
      for softer turf, bigger divots and steeper attack angles.
  - code: ADAPT
    name: ADAPT Grind
    description: >
      8 degrees of bounce, new for this generation, with full-face grooves, a
      higher toe profile, a leading-edge bounce chamfer and heel, toe and
      trailing-edge relief for open-face shots in all turf.
