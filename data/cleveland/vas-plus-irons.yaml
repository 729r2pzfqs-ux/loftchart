description: >
  The VAS+ is the 1996 refinement of Cleveland's radical VAS 792 of 1993 —
  the inset-hosel, shovel-backed iron Corey Pavin used to win the 1995 U.S.
  Open at Shinnecock Hills. VAS stands for Vibration Absorbing System: a full
  cavity plate damps impact shock so completely that Cleveland could thin the
  face and push weight to the perimeter, while the hosel sits inset from the
  face — MIT testing under Dr. Rudrapatna Ramnath found the layout reduced
  torque transmitted to the shaft and squared the face more easily. Sets ran
  1-iron (or 2-iron) through PW, DW, SW and LW with True Temper boron
  composite or steel shafts in Cleveland's Diamond (firm) and Square (medium)
  flex designations. Lofts are traditional with a 33.5-degree 7-iron. Note
  the task brief requested the 1993 VAS as a players iron: no per-club
  specification table for the original VAS 792 could be corroborated
  anywhere, so this record covers the fully documented VAS+, which period
  sources treat as a game-improvement design. The DW's specs were not
  published in the compiled tables and it is omitted below.
