faq:
  - q: "What is the loft of a Cleveland VAS+ 7-iron?"
    a: "The Cleveland VAS+ 7-iron has a loft of 33.5 degrees, a lie of 61.5 degrees and a length of 36.75 inches."
  - q: "What is the difference between the Cleveland VAS 792 and VAS+?"
    a: "The VAS 792 of 1993 was the original inset-hosel design — the set Corey Pavin used to win the 1995 U.S. Open — while the VAS+ of 1996 refined the same Vibration Absorbing System concept with a new assembly process and cleaner styling. Cleveland never published a per-club spec table for the 792 that survives today."
  - q: "What does VAS mean on Cleveland irons?"
    a: "Vibration Absorbing System — a full cavity damping plate that soaks up impact shock, which let Cleveland thin the clubface and move weight to the perimeter for forgiveness without harsh feel."
