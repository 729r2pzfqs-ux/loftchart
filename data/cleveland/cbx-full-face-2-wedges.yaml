faq:
  - q: "What lofts does the Cleveland CBX Full-Face 2 come in?"
    a: "50 to 60 degrees in 2-degree steps, every loft with 12 degrees of bounce and a uniform 35.5-inch length. The 52, 56 and 60 come in both hands; the rest are right-handed only."
  - q: "What is the difference between the CBX Full-Face 2 and the RTX Full-Face 2?"
    a: "Both are full-face, high-toe designs, but the CBX adds cavity-back forgiveness — a hollow ZipCore cavity, a Gelback insert and 13 percent more contact area — while the RTX is the compact tour version."
  - q: "What grinds does the CBX Full-Face 2 use?"
    a: "Cleveland pairs the sole to the loft: a Full sole on the 50 and 52 for square full swings, and a C-shaped sole with heel relief on the 54-60 for open-face shots."
