description: >
  The CBX Full-Face 2 is Cleveland's 2023 full-face specialty wedge on the
  forgiving CBX platform, announced on 18 January 2023 and at North
  American retail from 3 February 2023 at 169.99 dollars. The high-toe face
  is the biggest ever on a CBX — 13 percent more contact area than the RTX
  Full-Face — with ZipCore and a hollow cavity pushing the CG behind the
  impact zone, a Gelback insert for feel, HydraZip face blasts and
  edge-to-edge UltiZip grooves. Every loft carries 12 degrees of bounce at
  a uniform 35.5-inch length: the gap lofts use a Full sole for square,
  full-swing shots and the 54-60 heads a C-shaped sole with heel relief for
  open-face play. All grinds carry a leading-edge bounce chamfer against
  chunked chips. The 50, 54 and 58 are right-handed only.
