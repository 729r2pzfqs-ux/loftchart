description: >
  The HALO XL fairway woods launched in January 2024 as Cleveland's
  game-improvement wood line, alongside the HALO XL hybrids, Hy-Wood and
  full-face irons. The standard head runs four lofts on an oversized,
  high-MOI footprint, and the HALO XL Lite is the lightweight build in
  high-launch lofts for slower swing speeds. The hosels are glued — Cleveland
  does not do adjustable woods — and the line was Cleveland's last fairway
  wood: the brand wound down its metalwood range in early 2026 to focus on
  wedges and putters.
variants:
  - name: HALO XL
    description: >
      The standard oversized head in four lofts — 185 cc in the 3-wood — with
      a glued hosel and a draw-friendly, high-launch build; the 21° and 24°
      heads are right-hand only.
  - name: HALO XL Lite
    description: >
      The lightweight build for slower swing speeds, in high-launch 16.5°,
      19.5° and 22.5° lofts with lighter shafts and grips.
