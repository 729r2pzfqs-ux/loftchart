faq:
  - q: "What lofts does the Cleveland HALO XL fairway wood come in?"
    a: "The standard HALO XL comes in 15, 18, 21 and 24 degrees (21 and 24 right-hand only); the lightweight HALO XL Lite in 16.5, 19.5 and 22.5."
  - q: "Is the Cleveland HALO XL fairway wood adjustable?"
    a: "No — the hosel is glued, as on all of Cleveland's woods. The loft printed on the head is the loft it plays."
  - q: "Is Cleveland still making fairway woods?"
    a: "No. Cleveland wound down its metalwood line in early 2026 to concentrate on wedges and putters, so the HALO XL generation was its last — the used market and closeout stock are the only sources."
