description: >
  The 588 MT (Mid Trajectory) is the middle of Cleveland's three cast 2013
  588 irons — larger and more forgiving than the compact 588 TT, more
  conventional than the ultra-high-launch 588 Altitude. Cleveland published
  an identical spec ladder for the MT and TT, with strong lofts of 31 degrees
  at the 7-iron and 44 at the pitching wedge; the MT's bigger head, wider
  sole and higher flight make it the game-improvement pick of the pair. The
  standard set was eight pieces, 4-iron through the 49-degree DW gap wedge,
  in right and left hand. Steel lengths are below; graphite builds were 0.25
  inch longer. Note that this record files the MT as game-improvement on the
  strength of Cleveland's own positioning, even though it is sometimes listed
  alongside the TT as a players model.
