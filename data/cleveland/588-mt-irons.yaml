faq:
  - q: "What is the loft of a Cleveland 588 MT 7-iron?"
    a: "The Cleveland 588 MT 7-iron has a loft of 31 degrees, a lie of 63 degrees and a steel-shaft length of 37.25 inches."
  - q: "Who are the Cleveland 588 MT irons for?"
    a: "Cleveland aimed the MT (Mid Trajectory) at mid-handicap players who want a mid-size head with strong lofts and higher flight — a step more forgiving than the compact 588 TT, a step more conventional than the 588 Altitude."
  - q: "Do the Cleveland 588 MT and 588 TT have different lofts?"
    a: "No — Cleveland published identical lofts, lies, lengths and offsets for both. The difference is in the head: the MT is larger with a wider sole, the TT more compact with a thinner topline."
