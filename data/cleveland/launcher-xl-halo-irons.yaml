description: >
  The Launcher XL Halo is a hybrid-shaped iron: a hollow, wide-soled head with a very
  low centre of gravity, aimed at players who struggle to get long irons airborne.
  Cleveland built it long — 39.125 inches at the 4-iron — with strong lofts, a
  30-degree 7-iron, and it ships in graphite as the reference build, where the set
  measures D0 against D1 in steel. Cleveland stamps the 49.5-degree wedge DW; it is
  listed here as GW.
