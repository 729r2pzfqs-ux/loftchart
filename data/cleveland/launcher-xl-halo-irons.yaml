faq:
  - q: "What is the loft of a Cleveland Launcher XL Halo 7-iron?"
    a: "The Cleveland Launcher XL Halo 7-iron has a loft of 30 degrees, a lie of 63.0 degrees and a length of 37.25 inches."
  - q: "When were Cleveland Launcher XL Halo irons released?"
    a: "Cleveland announced them on 18 August 2021; the graphite version went on sale on 20 August 2021 and the steel version on 17 September 2021."
  - q: "What is the DW in a Launcher XL Halo set?"
    a: "The distance wedge at 49.5 degrees, which sits between the 44-degree pitching wedge and the 54.5-degree sand wedge. It is listed here as GW."
