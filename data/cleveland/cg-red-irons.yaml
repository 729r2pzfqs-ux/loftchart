description: >
  The CG Red is the distance half of Cleveland's 2007 "Red or Gold" fitting
  concept, aimed at players with faster, more aggressive tempos. Its lofts
  run about a degree stronger than the companion CG Gold through the scoring
  clubs — 34 degrees at the 7-iron and 46 at the pitching wedge — on the same
  cast cavity platform with Cleveland's Gelback damping insert and
  colour-coded hosel markings for flat, standard or upright lies. Cleveland
  published the CG Red 2-iron through pitching wedge in steel, with True
  Temper Dynamic Gold the stock shaft. Compared with the flighted-shaft,
  traditional-loft Gold, the Red trades a little height for speed and
  distance; both were replaced by the CG7 generation in 2009.
