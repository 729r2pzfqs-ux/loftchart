faq:
  - q: "What is the loft of a Cleveland CG Red 7-iron?"
    a: "The Cleveland CG Red 7-iron has a loft of 34 degrees, a lie of 62.5 degrees and a length of 36.75 inches."
  - q: "Should I choose Cleveland CG Red or CG Gold irons?"
    a: "Cleveland's own fitting rule was tempo: aggressive, faster swingers were pointed to the Red, with its slightly stronger lofts and Dynamic Gold shafts, while smoother or slower tempos got the Gold with traditional lofts and flighted Actionlite shafts."
  - q: "What clubs were available in the Cleveland CG Red set?"
    a: "Cleveland published the CG Red from the 2-iron through the pitching wedge, all available in left hand as well; there was no factory gap or sand wedge in the Red spec table."
