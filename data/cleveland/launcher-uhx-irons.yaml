faq:
  - q: "What is the loft of a Cleveland Launcher UHX 7-iron?"
    a: "The Cleveland Launcher UHX 7-iron has a loft of 30 degrees, a lie of 63 degrees and a length of 37 inches."
  - q: "Which Launcher UHX irons are hollow?"
    a: "The 4 through 7 irons use a hollow body with a high-strength steel face insert for distance and forgiveness; the 8-iron through pitching wedge are conventional cavity backs for control. Cleveland also sold hollow UHX utility singles in 18, 20 and 23 degrees."
  - q: "When were the Cleveland Launcher UHX irons released?"
    a: "Cleveland announced them on 16 September 2019 alongside the Launcher HB Turbo, and they reached North American retail on 4 October 2019."
  - q: "Could the Launcher UHX set be extended beyond the pitching wedge?"
    a: "Yes — Cleveland offered an optional 49-degree DW gap wedge with the same hollow construction as the low-lofted clubs, on the stock Dynamic Gold DST 98 steel shaft."
