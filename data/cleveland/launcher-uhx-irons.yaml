description: >
  The Launcher UHX is a progressive utility-hollow iron set announced on
  16 September 2019 and at retail in North America from 4 October 2019, replacing
  the Launcher CBX in Cleveland's game-improvement slot. The 4 through 7 irons
  are hollow-bodied with a high-strength steel face insert and a V-shaped sole
  for distance and forgiveness, while the 8-iron through pitching wedge switch to
  a conventional cavity back for control. Lofts are strong, with a 30-degree
  7-iron and a 44-degree pitching wedge, and gapping stretches from 3 degrees in
  the long irons to 5 degrees in the wedges. The stock set runs 4-iron through
  pitching wedge, with an optional 49-degree DW gap wedge to extend it, and
  matching hollow utility singles were sold down to an 18-degree 3-iron. Specs
  below are the standard men's steel build; offsets are converted from the
  published millimetre figures, and the D2 swing weight is the steel value —
  graphite builds run D1.
