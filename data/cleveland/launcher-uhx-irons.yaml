sources:
  - "2nd Swing Golf 'Cleveland Launcher UHX Iron Set' specification table (https://www.2ndswing.com/golf-clubs/iron-sets/cleveland-launcher-uhx-iron-set) — club, loft, length, lie, offset in mm and swing weight for the 4-iron through pitching wedge. This is the source of every number above; offsets are published in millimetres (5.45, 5.05, 4.65, 4.25, 3.05, 2.25, 1.45) and converted to inches here."
  - "Golf Influence review of the Launcher UHX irons — independently corroborates the lofts, the 20-44 degree loft range, the 61.5-64.5 degree lie range, the 35.75-38.875 inch lengths, the D2 steel / D1 graphite swing weights, and the Dynamic Gold DST 98 steel and Miyazaki C. Kua 60 graphite stock shafts."
  - "Cleveland Golf / Dunlop Sports US official 'LAUNCHER UHX UTILITY IRONS' page (us.dunlopsports.com/launcher-uhx-utility-irons/11191956.html) — the manufacturer's own listing for the matching 3/4/5 utility singles corroborates the 4-iron (20 degrees, 61.5 lie, 38.875 inches) and 5-iron (23 degrees, 62.0 lie, 38.25 inches) head specs and the hollow-body construction with high-strength HT1770M steel face insert and V-shaped sole."
  - "Announcement and dates: Midwest Golfing Magazine's reprint of Cleveland's press release 'Cleveland Golf introduces Launcher HB Turbo irons, Launcher UHX irons and Launcher Halo' — announced 16 September 2019, in stores 4 October 2019. year_discontinued 2022 reflects the announcement of the Launcher XL, the next Launcher-family iron generation, on the convention used across this site."
  - "The optional 49-degree DW gap wedge is confirmed by used-market listings at GolfClubs4Cash and Affordable Golf (49-degree Launcher UHX gap wedge with Dynamic Gold DST 98), but no second source carrying its lie and offset was found, so it is described here rather than listed in specs."
