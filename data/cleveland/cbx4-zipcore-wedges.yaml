description: >
  The CBX 4 ZipCore is Cleveland's 2024 cavity-back wedge for golfers who
  play game-improvement irons, at North American retail from 24 January
  2024 and still in the catalogue. The fourth CBX generation adds more
  ZipCore to the head (4.6 percent extra in the 54 and 56 for the highest
  MOI ever in a CBX wedge, with heel/toe MOI up 7 percent overall),
  HydraZip face blasts and laser lines for wet-weather friction, and
  UltiZip grooves. Cleveland pre-selects one Dynamic Sole Grind per loft —
  V-shaped on the gap lofts, S-shaped on the sand lofts, C-shaped on the
  lob lofts — all with a leading-edge bounce chamfer against chunks. The
  44-48 degree heads are right-handed only.
grinds:
  - code: V
    name: V-Shaped Sole
    description: >
      Fitted to the 44-52 degree lofts — a V sole that glides over the turf
      without digging on full-swing, square-face shots.
  - code: S
    name: S-Shaped Sole
    description: >
      Fitted to the 54 and 56 degree lofts with added bounce — built for
      bunker shots and open-face finesse around the green.
  - code: C
    name: C-Shaped Sole
    description: >
      Fitted to the 58 and 60 degree lofts with heel relief — for lob shots
      with an open face.
