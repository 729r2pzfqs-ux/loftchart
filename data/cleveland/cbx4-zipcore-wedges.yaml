faq:
  - q: "What lofts does the Cleveland CBX 4 ZipCore come in?"
    a: "44 to 60 degrees in 2-degree steps — nine lofts, each in a single factory bounce and sole grind. The 44, 46 and 48 are right-handed only."
  - q: "Can you choose a grind on the CBX 4 ZipCore?"
    a: "No — Cleveland pairs each loft with one Dynamic Sole Grind: V-shaped at 44-52 (12 bounce), S-shaped at 54-56 (14 bounce) and C-shaped at 58-60 (12 bounce)."
  - q: "Who is the CBX 4 ZipCore for?"
    a: "Golfers who play cavity-back irons and want matching forgiveness in their wedges — it is Cleveland's game-improvement line beside the tour-focused RTZ."
