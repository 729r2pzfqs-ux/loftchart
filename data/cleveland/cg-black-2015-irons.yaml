faq:
  - q: "What is the loft of a Cleveland CG Black 7-iron?"
    a: "The 2015 Cleveland CG Black 7-iron has a loft of 30 degrees, a lie of 62 degrees and a length of 37.25 inches."
  - q: "What year are the Cleveland CG Black irons?"
    a: "There are two generations: a 2012 original and this second-generation line, announced in autumn 2014 and sold as the 2015 CG Black range from 7 November 2014."
  - q: "Why are the Cleveland CG Black irons built so long and light?"
    a: "The entire club — head, shaft and grip — is lighter than standard and assembled longer (39.5 inches at the 4-iron), so golfers with moderate swing speeds can swing faster and gain distance without changing their swing."
