description: >
  The 2015 CG Black is the second generation of Cleveland's ultralight
  distance line, announced in the autumn of 2014 (at retail from 7 November
  2014) and sold as the 2015 range alongside a matching driver, fairways and
  hybrids. The whole club is built light — sub-standard head weights, light
  shafts and grips and long assemblies, with the 4-iron at 39.5 inches — so
  moderate-speed players can generate more clubhead speed; lofts are strong
  through the middle of the set with a 30-degree 7-iron and 44-degree
  pitching wedge. Cleveland published the set 4-iron through sand wedge, with
  the 50-degree wedge labelled DW, in right and left hand. A more compact
  CG Black CB followed in February 2015. This record uses 2014 on the
  announcement-year convention; the line is usually catalogued as 2015.
