description: >
  The TA5 was the maximum-forgiveness model in Cleveland's Tour Action range,
  introduced in 1999 alongside the TA3 and TA4. Its low-profile head puts the
  centre of gravity low and deep for stability on off-centre hits and easy,
  high launch — especially in the long irons — while the patented Vibration
  Absorbing System (VAS) keeps impact feeling solid. Lofts are traditional
  (33.5-degree 7-iron, 45-degree pitching wedge) on a light D0 swing weight
  through the numbered irons. The published range ran 1-iron through sand
  wedge, with steel and graphite lengths listed separately; a GunMetal
  version and a Senior build followed in 2002, and the line was carried until
  the wide-soled TA6 arrived. Note that some lists date the TA5 to 1997;
  Cleveland's own December 1999 page introduces "the new TA5", matching the
  1999 stock-shaft records.
