faq:
  - q: "What is the loft of a Cleveland TA5 7-iron?"
    a: "The Cleveland TA5 7-iron has a loft of 33.5 degrees, a lie of 61.5 degrees and a steel-shaft length of 36.75 inches."
  - q: "What year are the Cleveland TA5 irons?"
    a: "Cleveland introduced the TA5 in 1999 — its own site presented it as new that December — and kept it in the line into 2003, adding a GunMetal finish and a Senior build in 2002. Some lists date it 1997, which the period records do not support."
  - q: "Who are the Cleveland TA5 irons for?"
    a: "Cleveland aimed the TA5 at players seeking maximum forgiveness in a low-profile iron: the low, deep centre of gravity stabilises off-centre hits and makes shots easy to launch high and straight, especially with the long irons."
