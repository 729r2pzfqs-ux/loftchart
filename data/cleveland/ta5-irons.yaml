sources:
  - "Cleveland Golf official TA5 product page (clevelandgolf.com/proshop/irons/ta5.html), archived 1999-12-17 via web.archive.org — retrieved directly; introduces 'the new TA5', supplies the full 1-iron-through-SW table (loft, lie, steel and graphite lengths, swing weight) and the Release/Rifle/Sensicore steel and graphite shaft options. Steel lengths are recorded here; graphite builds were 0.25 inch longer per the later TA5 pages."
  - "GolfClubShaftReview compiled Cleveland stock-shaft list (golfclubshaftreview.com, cleveland1.2.pdf) — lists 'Tour Action TA5' in 1999 with True Temper Steel Variable Step, and TA-5 with Release w/Sensicore in 2002-2003, corroborating the 1999 introduction and long run. GolfClubSpec's TA5 GunMetal entry (iron_results.php?id=42, year 2002) carries the same loft/lie/length ladder for the later finish variant."
