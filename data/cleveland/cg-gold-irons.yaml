description: >
  The CG Gold is the traditional-loft half of Cleveland's 2007 "Red or Gold"
  fitting concept: golfers with mid-to-slow tempos were pointed to the Gold,
  with its conventional lofts (33.5-degree 7-iron, 45-degree pitching wedge)
  and flighted Actionlite steel shafts designed to launch long irons higher
  and flight scoring clubs down, while faster swingers got the stronger-lofted
  CG Red. The cavity back carries Cleveland's Gelback damping insert, and
  colour-coded hosel markings denote flat, standard or upright lie. Cleveland
  published the set 2-iron through sand wedge, with the 50-degree wedge
  labelled DW; steel lengths below, graphite 0.25 inch longer. It was
  reviewed well as a soft-feeling, easy-launching game-improvement iron and
  ran until the CG7 generation arrived in 2009.
