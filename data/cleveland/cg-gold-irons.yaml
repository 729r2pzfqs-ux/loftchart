faq:
  - q: "What is the loft of a Cleveland CG Gold 7-iron?"
    a: "The Cleveland CG Gold 7-iron has a loft of 33.5 degrees, a lie of 62.5 degrees and a steel-shaft length of 36.75 inches."
  - q: "What is the difference between Cleveland CG Gold and CG Red irons?"
    a: "They are two halves of Cleveland's 2007 fitting concept: the Gold carries traditional lofts with flighted shafts for mid-to-slow tempos, while the Red is about a degree and a half stronger through the scoring clubs and half an inch longer-playing in character, for faster swingers seeking distance."
  - q: "What shafts came in Cleveland CG Gold irons?"
    a: "The stock steel shaft was the Royal Precision Actionlite Flighted, whose kickpoint shifts through the set to launch long irons higher and flight short irons down; a CG Gold graphite was offered in A, R and S flexes."
