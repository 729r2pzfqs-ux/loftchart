description: >
  The 588 Forged MB is the muscle-back blade at the top of Cleveland's 2013
  588 iron range, precision forged from 1025 carbon steel and named for the
  classic 588 wedge. The tour-inspired profile carries a thin topline, compact
  head and minimal offset for workability, with Tour Zip Grooves and laser
  milling on the face for spin. Lofts are traditional throughout — 35 degrees
  at the 7-iron and 47 at the pitching wedge. The set was sold 3-iron through
  pitching wedge with True Temper Dynamic Gold as the stock steel shaft, and
  the range also included a combo option mixing the MB short irons with the
  588 Forged CB cavity backs.
