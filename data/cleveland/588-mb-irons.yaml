faq:
  - q: "What is the loft of a Cleveland 588 MB 7-iron?"
    a: "The Cleveland 588 Forged MB 7-iron has a loft of 35 degrees, a lie of 62 degrees and a length of 36.75 inches."
  - q: "Are the Cleveland 588 MB irons forged?"
    a: "Yes — each head is precision forged from 1025 carbon steel, with Tour Zip Grooves and laser milling on the face."
  - q: "What is the difference between the Cleveland 588 MB and 588 CB?"
    a: "They share the same lofts, lies and near-identical lengths, but the MB is a pure muscle back for shot-makers while the CB adds a progressive cavity, a slightly longer blade, thicker topline and marginally more offset. Cleveland also sold a combo set mixing CB long irons with MB short irons."
