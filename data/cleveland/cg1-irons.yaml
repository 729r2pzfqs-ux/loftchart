description: >
  The CG1 launched Cleveland's CG iron line in 2004 as a traditional
  muscle-back blade made from the company's patented Carbon Metal Matrix —
  a steel infused with microscopic carbon spheres that Cleveland claimed was
  10% less dense and 15% softer than conventional carbon steel, at 77 on the
  Rockwell B scale. A slightly larger muscle moves the centre of gravity lower
  and deeper than a classic blade for higher flight in the long irons. The set
  ran 1-iron through pitching wedge in a mirror chrome finish, with True
  Temper Dynamic Gold taper-tip steel stock; a Black Pearl finish followed in
  2006, and the softer-category CG2 joined it in 2005. Lofts are fully
  traditional: 35 degrees at the 7-iron, 47 at the pitching wedge. Note that
  this record files the CG1 as a blade; some lists group it broadly with
  players irons.
