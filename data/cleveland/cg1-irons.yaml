faq:
  - q: "What is the loft of a Cleveland CG1 7-iron?"
    a: "The Cleveland CG1 7-iron has a loft of 35 degrees, a lie of 62 degrees and a length of 36.75 inches."
  - q: "Are the Cleveland CG1 irons forged?"
    a: "Cleveland never marketed the CG1 as a forging — the heads are made from its patented Carbon Metal Matrix (CMM), a carbon-infused steel the company claimed was softer-feeling than traditional forged carbon steel."
  - q: "What is the difference between the Cleveland CG1 and CG2?"
    a: "The CG1 is a 1-PW muscle-back blade with traditional lofts for the better player; the 2005 CG2 uses the same CMM material in a slightly stronger-lofted head with a lower, deeper centre of gravity, aimed at low-to-mid handicappers."
