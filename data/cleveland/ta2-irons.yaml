faq:
  - q: "What is the loft of a Cleveland TA2 7-iron?"
    a: "The Cleveland TA2 Micro-Cavity 7-iron has a loft of 34 degrees, a lie of 62.5 degrees and a steel-shaft length of 36.75 inches."
  - q: "What year are the Cleveland TA2 irons?"
    a: "The TA2 Micro-Cavity joined Cleveland's line in 2003, near the end of the Tour Action era — the model numbers were never chronological. There was no 1996 TA2; Cleveland's 1996 iron was the VAS+."
  - q: "Who are the Cleveland TA2 Micro-Cavity irons for?"
    a: "Low-to-mid handicappers who want a blade-like head with a small safety margin: the shallow micro cavity adds forgiveness and face stability while keeping the workability and solid feel of a blade."
