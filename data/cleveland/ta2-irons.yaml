description: >
  The TA2 Micro-Cavity is a late addition to Cleveland's Tour Action range,
  aimed at low-to-mid handicappers who want "the forgiveness of a cavity-back
  and the workability of a blade". Its shallow micro cavity and moderate
  perimeter weighting enlarge the sweet spot and stabilise the face while the
  head design shortens the duration of impact vibration for a solid,
  blade-like feel. Lofts are traditional — 34 degrees at the 7-iron and 46 at
  the pitching wedge — on Dynamic Gold stock, with Sensicore, Rifle and
  Flighted Rifle custom options. Despite the low model number, the TA2 is one
  of the last Tour Action irons: it appears in Cleveland's line in 2003,
  after the TA7, and the task-brief's 1996 date belongs to no TA2 — the 1996
  Cleveland iron was the VAS+. Cleveland's published length columns contain
  three internally inconsistent cells; see sources.
