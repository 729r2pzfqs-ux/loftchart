faq:
  - q: "What lofts does the Cleveland Launcher XL come in?"
    a: "The adjustable Launcher XL is one 10.5 degree base head that the QTS sleeve configures anywhere from 9 to 12 degrees in half-degree steps. The fixed-hosel XL Lite comes in 10.5 and 12 degrees and the XL Lite Draw in 10.5."
  - q: "Why does the Launcher XL's lie differ by loft?"
    a: "Because the three retail lofts are hosel settings of the same head: at the 10.5 degree standard mark the lie is 60 degrees, while the 9 and 12 degree marks sit 1.5 degrees flatter at 58.5."
  - q: "Is the Launcher XL Lite adjustable?"
    a: "No — the Lite, Lite Draw and women's builds all have glued hosels to save weight. Only the standard Launcher XL carries the adjustable QTS sleeve."
  - q: "Does Cleveland still make drivers?"
    a: "No. After the Launcher XL2 (2024) and HiBore XL (2025), Cleveland exited the metalwoods and irons business in early 2026 to focus on wedges and putters, so every Cleveland driver is now a used-market buy."
