description: >
  The Launcher XL is Cleveland's 2021 game-improvement driver — an oversized
  460 cc head with 5,200 g·cm² of MOI, the Rebound Frame shared with sibling
  brand Srixon, and Action Mass CB, an 8-gram counterweight inside the grip
  end that steadies the club through impact. The adjustable core model is
  sold as a single 10.5°-base head whose QTS sleeve configures it from 9° to
  12°; the XL Lite is a 12-gram-lighter, quarter-inch-longer fixed-hosel
  version for slower swings, with a Draw variant for slice fighters and a
  women's build. Every model offered a factory "Accuracy Build" one inch
  shorter with the counterweight removed. The Launcher XL2 replaced it in
  2024 — Cleveland's second-to-last driver family before the brand exited
  metalwoods entirely in early 2026 to focus on wedges and putters.
variants:
  - name: Launcher XL
    head_cc: 460
    description: >
      The adjustable max-MOI head: one 10.5°-base head whose QTS sleeve
      plays it from 9° to 12° — which is why the published lie differs by
      configured loft (58.5° at the 9° and 12° marks, 60° at 10.5°).
  - name: Launcher XL Lite
    head_cc: 460
    description: >
      The 12 g lighter, 0.25 inch longer version for slower swings, with a
      fixed (glued) hosel. The 12° head is right-hand only; a women's 12°
      build ran 44.25 inches at C7.
  - name: Launcher XL Lite Draw
    head_cc: 460
    description: >
      The slice-fighting draw-bias version of the Lite — 10.5° only, fixed
      hosel, right-hand only.
