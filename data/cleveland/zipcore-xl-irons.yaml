faq:
  - q: "What is the loft of a Cleveland ZipCore XL 7-iron?"
    a: "The Cleveland ZipCore XL 7-iron has a loft of 29 degrees, with a 63-degree lie and a 37.25-inch steel-shaft length."
  - q: "What changed between the Cleveland Launcher XL and the ZipCore XL?"
    a: "Lofts and lies carried over essentially unchanged, but the construction changed: the ZipCore XL drops the hollow long irons for a cavity back throughout, adds the wedge-derived ZipCore hosel core in the 8-iron through sand wedge and an AI-designed MainFrame face in the 4- through 7-irons. Each club is also built about a quarter-inch longer than the Launcher XL standard build."
  - q: "What clubs come in a stock Cleveland ZipCore XL set?"
    a: "Cleveland's set builder offers 4-PW, 5-PW or 5-PW plus the 48-degree gap wedge, in right or left hand. The 54-degree sand wedge is offered right hand only."
  - q: "Are the Cleveland ZipCore XL lofts strong?"
    a: "Yes. The 29-degree 7-iron and 43-degree pitching wedge are roughly a club stronger than a traditional iron at the same number, which is why the set extends to a 48-degree gap wedge and 54-degree sand wedge."
