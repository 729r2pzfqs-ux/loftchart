description: >
  The ZipCore XL replaced the Launcher XL in January 2024 as Cleveland's oversize
  distance iron and is the first Cleveland iron to carry the ZipCore technology from its
  wedges: in the 8-iron through sand wedge, heavy steel in the hosel and heel is swapped
  for a lightweight vibration-damping core that centres the CG on the strike. The 4-
  through 7-irons instead get an AI-designed MainFrame face — a variable network of
  grooves, channels and cavities milled into the back of the face — and the whole set
  uses the large cavity-back XL head with perimeter weighting, plus an 8-gram Action
  Mass CB counterweight in the grip end. HydraZip face blasts and loft-specific grooves
  split the set the same way, reducing spin in the 4i-7i and boosting it in the 8i-SW.
  Lofts carry over from the Launcher XL almost unchanged — a very strong 29-degree
  7-iron and 43-degree pitching wedge — but each iron is built about a quarter-inch
  longer than the Launcher XL standard build. Set options run 4-PW, 5-PW or 5-PW plus
  the 48-degree gap wedge, with a 54-degree sand wedge offered right hand only.
