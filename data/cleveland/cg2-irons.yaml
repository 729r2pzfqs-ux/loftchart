faq:
  - q: "What is the loft of a Cleveland CG2 7-iron?"
    a: "The Cleveland CG2 7-iron has a loft of 34 degrees, a lie of 62 degrees and a steel-shaft length of 36.75 inches."
  - q: "Who are the Cleveland CG2 irons for?"
    a: "Cleveland designed the CG2 for low-to-mid handicappers who want the forgiveness of a cavity back with the workability of a blade — one step easier to play than the CG1 muscle back."
  - q: "What is CMM in the Cleveland CG2 irons?"
    a: "Carbon Metal Matrix, Cleveland's patented carbon-infused steel: microscopic carbon spheres make it about 10% less dense and 15% softer than conventional carbon steel, freeing 25-30 grams of weight to lower and deepen the centre of gravity."
