description: >
  The CG2 joined the CG1 blade in Cleveland's line for 2005, using the same
  patented Carbon Metal Matrix — a carbon-infused steel Cleveland claimed was
  10% less dense and 15% softer than traditional carbon steel — in a head for
  the low-to-mid handicapper who wants cavity-back forgiveness with
  blade-like workability. The 25-30 grams of discretionary weight freed by
  the CMM material drop the centre of gravity lower and deeper than most
  better-player irons of the period, easing launch in the long irons while
  keeping flight penetrating in the scoring clubs. The standard offering was
  3-PW from a published 1-iron-through-SW range, with Dynamic Gold steel or
  Grafalloy Blue graphite stock. Lofts are a touch stronger than the CG1's —
  34 degrees at the 7-iron and 46 at the pitching wedge.
