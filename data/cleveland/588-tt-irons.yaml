faq:
  - q: "What is the loft of a Cleveland 588 TT 7-iron?"
    a: "The Cleveland 588 TT 7-iron has a loft of 31 degrees, a lie of 63 degrees and a steel-shaft length of 37.25 inches."
  - q: "What is the difference between the Cleveland 588 TT and 588 MT?"
    a: "They share the same published lofts, lies, lengths and offsets, but the TT (Tour Trajectory) uses a more compact head with a thinner topline for a flatter, more penetrating flight, while the MT (Mid Trajectory) is larger and more forgiving."
  - q: "What clubs came in the Cleveland 588 TT set?"
    a: "The standard set was eight pieces from the 4-iron to the 49-degree DW gap wedge; a 3-iron and 54-degree sand wedge were also available, in right and left hand."
