description: >
  The 588 TT (Tour Trajectory) is the most compact of the three cast irons in
  Cleveland's 2013 588 relaunch, sitting above the mid-size 588 MT and the
  ultra-high-launch 588 Altitude and below the forged 588 CB and MB. It pairs
  a shorter blade, thinner topline and less offset with the same strong loft
  ladder Cleveland published for the MT — 31 degrees at the 7-iron and 44 at
  the pitching wedge — for a more penetrating flight aimed at better players
  who still want cast-cavity forgiveness and distance. The standard set was
  eight pieces, 4-iron through the 49-degree DW gap wedge, in right and left
  hand. Steel lengths are below; graphite builds were 0.25 inch longer.
