description: >
  The HALO XL Full-Face is Cleveland's hybrid-shaped maximum-forgiveness iron,
  announced on 15 January 2024 as the successor to the Launcher XL Halo and a
  2024 Golf Digest Hot List gold medalist. The bigger hollow heads carry
  hosel-to-toe full-face grooves — an industry first for an iron — with an
  A.I.-computed MainFrame variable-thickness face, a HydraZip blast for spin in
  wet or dry conditions, and three progressive sole designs through the set.
  Lofts are a touch weaker than the old XL Halo, with a 29-degree 7-iron and a
  43-degree pitching wedge, on long builds — 39.125 inches at the 4-iron. The
  stock set is 5-PW plus the 48-degree gap wedge; the 54-degree sand wedge is
  right-hand only. Swing weights below are the steel build (graphite runs two
  points lighter at D0/D1), and offsets are converted from Cleveland's published
  millimetre figures.
