faq:
  - q: "What is the loft of a Cleveland HALO XL Full-Face 7-iron?"
    a: "The Cleveland HALO XL Full-Face 7-iron has a loft of 29 degrees, a lie of 63 degrees and a length of 37.25 inches."
  - q: "What is special about the grooves on the HALO XL Full-Face irons?"
    a: "They run the full width of the face, from hosel to toe — Cleveland calls it an industry first for an iron — so off-centre strikes still get consistent spin. A HydraZip face blast adds friction in wet or dry conditions."
  - q: "When were the Cleveland HALO XL Full-Face irons released?"
    a: "Cleveland announced them on 15 January 2024 alongside the ZipCore XL, and they won a gold medal on the 2024 Golf Digest Hot List. They remain current, with no successor announced as of July 2026."
  - q: "What clubs come in a stock HALO XL Full-Face set?"
    a: "The stock set is 5-iron through pitching wedge plus a 48-degree gap wedge. A 4-iron and a 54-degree sand wedge (right hand only) are also catalogued."
