faq:
  - q: "What lofts does the Cleveland RTX Full-Face 2 come in?"
    a: "50 to 60 degrees in 2-degree steps, plus a 64-degree flop model — 7 options in all. The 50 and 52 are right-handed only; 54 through 64 come in both hands."
  - q: "What bounce does the Cleveland RTX Full-Face 2 have?"
    a: "8 degrees on the S-shaped sole at 50 and 52 degrees, 10 degrees on the same sole at 54 and 56, and 8 degrees on the C-shaped sole of the 58, 60 and 64 degree models."
  - q: "What is the difference between the RTX Full-Face 2 and the RTX 6 ZipCore?"
    a: "The Full-Face 2 runs its grooves across the whole face of a subtly high-toe head with about 34 percent more contact area, built for open-face shots; the RTX 6 is the traditional-shape tour line with a four-grind matrix."
