description: >
  The RTX Full-Face 2 is Cleveland's 2024 full-face-groove specialty wedge,
  announced and at retail on 24 January 2024. Grooves run from hosel to toe
  across a subtly high-toe face with about a square inch more area than the
  RTX 6 ZipCore — 34 percent more contact area in all — for spin on
  open-face shots. It carries 96 percent more ZipCore material than the
  original Full-Face for a 13 percent higher MOI, plus the UltiZip grooves
  and loft-specific HydraZip wet-spin face treatment from the RTX 6. The
  line runs 50 to 60 degrees in 2-degree steps plus a 64-degree flop model,
  with an S-shaped sole on 50-56 and a C-shaped sole on 58-64. Finishes are
  Tour Satin and the raw Tour Rack, whose customisation programme offers a
  rounded or sharpened leading edge.
grinds:
  - code: S
    name: S-Shaped Sole
    description: >
      The standard sole for the 50 to 56 degree heads — 8 degrees of bounce
      at 50 and 52 for full shots, 10 degrees at the 54 and 56 degree sand
      wedge lofts for bunker play.
  - code: C
    name: C-Shaped Sole
    description: >
      The sole of the 58, 60 and 64 degree models at 8 degrees of bounce,
      with relief that keeps the leading edge low on open-face flop shots.
