description: >
  The TA6 took over from the TA5 as the game-improvement model in Cleveland's
  Tour Action range for 2004. Material is pulled out of the cavity and moved
  into a wider sole and the extreme perimeter, dropping the centre of gravity
  lower and further from the face for quicker launch and a higher moment of
  inertia, with the patented Vibration Absorbing System damping impact. The
  long irons use a lower-profile head while the scoring clubs keep a deeper,
  more traditional face, and offset is generous throughout — 0.310 inch at
  the 1-iron down to zero at the sand wedge, published in the normal
  decreasing direction. Heads are cast 17-4 stainless in a satin finish on
  True Temper Action Lite steel or a lightweight graphite. Note that some
  lists date the TA6 to 2001; it is absent from Cleveland's own April 2003
  iron line-up and appears in 2004, matching the compiled shaft records, and
  a W-Series women's version followed in 2005.
