faq:
  - q: "What is the loft of a Cleveland TA6 7-iron?"
    a: "The Cleveland TA6 7-iron has a loft of 33.5 degrees, a lie of 62.5 degrees and a steel-shaft length of 36.75 inches."
  - q: "What year are the Cleveland TA6 irons?"
    a: "The TA6 appears in Cleveland's line in 2004 — it is absent from the company's own April 2003 iron catalogue — and a W-Series women's version followed in 2005. Some retailer lists date it 2001, which the period records contradict."
  - q: "How much offset do Cleveland TA6 irons have?"
    a: "A lot by Cleveland standards: 0.310 inch in the 1- and 2-irons, tapering to 0.150 inch at the 7-iron and zero at the sand wedge, to help square the face at impact."
