description: >
  The 588 Forged CB is the cavity-back players iron in Cleveland's 2013 588
  range, precision forged from 1025 carbon steel like its muscle-back sibling.
  The compact, classic head adds a progressive cavity, a slightly longer blade,
  thicker topline and a touch more offset than the 588 Forged MB, making it the
  more forgiving of the two while keeping identical traditional lofts — 35
  degrees at the 7-iron and 47 at the pitching wedge. Tour Zip Grooves with
  laser milling handle spin. The set ran 2-iron through pitching wedge with
  True Temper Dynamic Gold as the stock steel shaft, and Cleveland offered a
  combo set pairing these long irons with MB short irons.
