faq:
  - q: "What lofts does the Cleveland RTZ 2 come in?"
    a: "The RTZ 2 Tour Satin runs from 46 to 64 degrees in 2-degree steps — 24 loft, bounce and grind combinations. The Black Satin finish covers a 50-60 degree subset and the raw Tour Rack 48-60."
  - q: "What grinds does the Cleveland RTZ 2 offer?"
    a: "Five, each at a fixed bounce: LOW (6 degrees, 58-62), MID (10 degrees, every loft 46-60), FULL (12 degrees, 54-60), the reintroduced 588 (8 degrees, 54-60) and the full-face ADAPT (8 degrees, 54-64)."
  - q: "What changed from the Cleveland RTZ to the RTZ 2?"
    a: "The 588 grind returned, taking the matrix from 20 to 24 combinations, and the ZipCore hosel core became ZipCore iQ — tuned individually for each loft and grind rather than shared across the line. Z-Alloy, HydraZip and UltiZip carry over in second-generation form."
  - q: "What is the 588 grind on the RTZ 2?"
    a: "A reintroduction of Roger Cleveland's classic 588 sole at 8 degrees of bounce, with more bounce toward the toe and less in the heel. It is offered at 54, 56, 58 and 60 degrees and suits moderate to shallow swings."
