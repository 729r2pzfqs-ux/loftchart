description: >
  The RTZ 2 is the 2026 generation of Cleveland's tour wedge line, announced
  with presale on 4 August 2026 and at retail from 4 September. It keeps the
  second-generation Z-Alloy head and adds ZipCore iQ, which tunes the
  lightweight hosel core individually for every loft and grind combination,
  alongside loft-specific HydraZip face blasting and UltiZip grooves. The
  Tour Satin matrix charted here runs 24 loft/bounce/grind combinations from
  46 to 64 degrees across five grinds — the four carried over from the RTZ
  plus the reintroduced Roger Cleveland 588 grind at 54 to 60 degrees. The
  Black Satin finish covers a 17-combination subset and the raw Tour Rack
  variant 20, with optional Tour Crafted grind customisation.
grinds:
  - code: LOW
    name: LOW Grind
    description: >
      6 degrees of bounce with heel, toe and trailing-edge relief and the
      sharpest leading edge in the line. A lob-wedge grind for finesse shots,
      firmer turf and shallower attack angles.
  - code: MID
    name: MID Grind
    description: >
      10 degrees of bounce on an all-around V-shaped sole that cuts smoothly
      through turf. Suits all conditions, average divots and neutral attack
      angles — the grind offered at every loft.
  - code: FULL
    name: FULL Grind
    description: >
      12 degrees of bounce on a classic high-bounce sole with the most
      rounded leading edge, for stability on full shots, bunkers and thick
      rough in softer conditions.
  - code: "588"
    name: 588 Grind
    description: >
      8 degrees of bounce on the reintroduced Roger Cleveland classic 588
      sole — more bounce toward the toe and less in the heel. Suits moderate
      to shallow swings.
  - code: ADAPT
    name: ADAPT Grind
    description: >
      8 degrees of bounce with full-face grooves (ADAPT Full-Face Precision),
      a higher toe profile, a leading-edge bounce chamfer and heel, toe and
      trailing-edge relief for open-face shots in all turf.
