description: >
  The 588 Altitude is the easiest-to-hit member of Cleveland's 2013 588 iron
  range, built for golfers with moderate swing speeds who struggle to flight
  the ball. Every head is fully hollow, placing the centre of gravity at its
  lowest and deepest point for maximum launch, with a forged face for ball
  speed and feel and a bendable hosel that allows fitting adjustments of up to
  2 degrees flat or 3 upright. Lofts are traditional — 31 degrees at the
  7-iron, 44 at the pitching wedge — because the design flights the ball
  easily without strong lofts, and the set is built light, about half an inch
  longer than standard with an 85-gram steel shaft. Lengths and the D3 swing
  weight below are the steel build; graphite builds run a quarter-inch longer
  at D2. The gap and sand wedge complete the set at D4.
