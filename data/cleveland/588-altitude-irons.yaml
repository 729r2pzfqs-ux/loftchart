faq:
  - q: "What is the loft of a Cleveland 588 Altitude 7-iron?"
    a: "The Cleveland 588 Altitude 7-iron has a loft of 31 degrees, a lie of 63 degrees and a steel-shaft length of 37.25 inches."
  - q: "Are the Cleveland 588 Altitude irons adjustable?"
    a: "The hosel is bendable, so a fitter can adjust lie up to 2 degrees flat or 3 degrees upright, and loft up to 2 degrees in either direction."
  - q: "Who are the Cleveland 588 Altitude irons for?"
    a: "They target golfers with moderate swing speeds who need help launching the ball: every head is fully hollow with a low, deep centre of gravity, and the set is built long and light with an 85-gram steel or 55-gram graphite shaft."
