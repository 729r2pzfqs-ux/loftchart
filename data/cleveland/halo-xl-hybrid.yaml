faq:
  - q: "What lofts does the Cleveland HALO XL hybrid come in?"
    a: "The standard hybrid comes in 18, 21, 24, 27 and 30 degrees; the HALO XL Hy-Wood adds a 17 degree 3+ and 20 degree 4+ built to fairway-style lengths."
  - q: "What is the Cleveland Hy-Wood?"
    a: "Cleveland's half-fairway, half-hybrid: a head sized between the two, built about an inch and a half longer than the matching hybrid with an 8 gram counterweight in the grip end — an easy-launch alternative to both a 5-wood and a 2-hybrid."
  - q: "Why are the HALO XL hybrid lies so upright?"
    a: "Deliberately — at 60.5 to 62.5 degrees they are several degrees more upright than most hybrids, because Cleveland built the HALO XL to be delivered like an iron rather than swept like a wood."
