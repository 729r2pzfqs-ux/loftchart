description: >
  The HALO XL hybrids launched in January 2024 with the HALO XL woods. The
  standard hybrid runs five lofts in three-degree steps from 18° to 30° on a
  136 cc, very upright head built to be swung like an iron; the HALO XL
  Hy-Wood is Cleveland's half-fairway, half-hybrid — a 162 cc 17° "3+" and
  147 cc 20° "4+" built to fairway-style lengths with an 8 g counterweight in
  the grip end. Cleveland wound down its metalwood range in early 2026, so
  the line was its last hybrid.
variants:
  - name: HALO XL
    description: >
      The standard oversized hybrid in five lofts at a D1 swing weight, with
      very upright lies for an iron-like delivery; left-handed heads come in
      18° and 21° only.
  - name: HALO XL Hy-Wood
    description: >
      The in-between club: a 17° (3+) and 20° (4+) head sized and shafted
      between a fairway wood and a hybrid, with an 8 g grip-end counterweight
      for control at its longer build.
