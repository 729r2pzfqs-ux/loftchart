description: >
  The VDC (Dual Cavity) sits in the middle of Vega's Japan-forged Classic
  Line, alongside a muscle-back VMB blade and a shallow-cavity VSC - a
  family the brand builds to one shared loft and lie chart so the three can
  be blended into a single set. GolfWRX's Club Junkie review described
  "fantastic milling work on the back side with dual cavities that allow
  Vega to adjust the CG higher on the irons for the perfect players cavity
  set," with a slightly squarer toe and edgier look than the Mizar range and
  a narrow, pre-worn leading edge for turf interaction; all three Classic
  Line faces are micro-milled for spin consistency. Lofts run strong for a
  players iron - a 31-degree 7-iron and 44-degree pitching wedge across a
  4-PW factory chart - aimed at accomplished ball-strikers wanting extra
  distance without losing feel. Reviews clustered in late 2022 as Western
  coverage caught up with the Japan-forged range; stock build uses the
  Shimada Steel Taper Tour shaft, with a 4-PW steel set priced around
  £1,645 in the UK.
