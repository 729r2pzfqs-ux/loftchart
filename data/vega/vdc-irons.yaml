sources:
  - "Golf Monthly 'Vega VDC Iron Review: The Best Iron You've Never Heard Of' (golfmonthly.com, last updated 31 October 2022) — the 4-PW factory chart used here (lofts 22/25/28/31/34/39/44 degrees, lies 60-63), the one-piece forged dual-cavity construction with circular milling inside both cavities, the Shimada Steel Taper Tour stock shaft, the £1,645 4-PW steel set price, and the 'feel players looking for more speed' target-player framing."
  - "GolfWRX 'Club Junkie Review: Vega Golf VDC and Mizar Tour irons' (golfwrx.com/701321) — describes the dual-cavity milling that raises the CG for a 'perfect players cavity set,' a squarer toe and narrow sole with a pre-worn leading edge for turf interaction, versus the Mizar range's shaping."
  - "SGGT 'Vega Classic Line VSC VMB VDC Irons Review' (sggt.co.uk) — confirms the VDC sits alongside sibling VMB (muscle-back blade) and VSC (shallow cavity) models in Vega's forged-in-Japan Classic Line, sharing one loft and lie chart across all three so they can be blended into combo sets; no direct predecessor/successor relationship between the three."
  - "Year and material note (confidence: medium): no source gives an exact announcement date; independent reviews cluster in October-December 2022, while this entry follows this site's convention (as with other Vega/Fourteen/Miura Japan-forged models) of recording the earlier announcement year where coverage lags - 2021 is used per the task brief pending a firmer primary source. Material is recorded generically as forged carbon steel because no source states the specific carbon-steel grade (S20C/S25C) for the VDC head specifically, unlike its Mizar Tour sibling (S25C, confirmed). Bounce, offset and length are not published for the VDC in any consulted source and are omitted rather than guessed."
faq:
  - q: "What is the loft of a Vega VDC 7-iron?"
    a: "The Vega VDC 7-iron has a loft of 31 degrees and a lie of 61.5 degrees - strong for a players cavity iron, aimed at accomplished ball-strikers wanting extra distance."
  - q: "How does the Vega VDC differ from the Mizar range?"
    a: "The VDC belongs to Vega's separate Classic Line rather than the Star Range Mizar irons - a squarer toe, edgier look and dual-cavity milling that raises the centre of gravity, alongside Classic Line siblings VMB (blade) and VSC (shallow cavity) that share the same loft and lie chart."
  - q: "What shaft comes stock in the Vega VDC?"
    a: "The Shimada Steel Taper Tour, as tested by Golf Monthly in its 4-PW review set."
