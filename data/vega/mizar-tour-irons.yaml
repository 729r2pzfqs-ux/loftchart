description: >
  The Mizar Tour is the compact multi-material iron in Vega's Star Range - a
  one-piece body forged from S25C carbon steel with a softer S20C face insert
  held at a constant 3.5 mm thickness. Weight is removed internally near the
  sole to keep the centre of gravity high for a flighted, penetrating ball,
  and moves across the head through the set. GolfWRX spotlighted the model in
  October 2019 and Vega's own site has carried the same loft, lie, face
  progression and bounce chart from at least January 2022 through the present,
  so the specs below describe the club as sold across its whole run; Vega
  later marketed it under the "next generation, multi-material" banner
  alongside the VDC, and reviews in late 2022 renewed attention on it. Vega
  builds to order through fitters and publishes no standard lengths or
  offsets, so those keys are omitted. The set runs 4-iron to attack wedge with
  a 30-degree 7-iron and 42-degree pitching wedge.
