faq:
  - q: "What is the loft of a Vega Mizar Tour 7-iron?"
    a: "The Vega Mizar Tour 7-iron has a loft of 30 degrees, a 61.5-degree lie and 2.5 degrees of bounce."
  - q: "Is the Vega Mizar Tour forged?"
    a: "Yes. The one-piece body is forged from S25C carbon steel and carries a softer S20C carbon steel face insert at a constant 3.5 mm thickness."
  - q: "Is the Mizar Tour a blade?"
    a: "No. It is a compact multi-material players-distance design: the constant-thickness face and internal weight removal near the sole give it distance and a penetrating flight in a players profile."
