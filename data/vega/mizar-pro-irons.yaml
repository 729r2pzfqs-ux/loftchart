description: >
  The Mizar Pro replaced the original Mizar as the flagship of Vega's Star
  Range when Golf Monthly reviewed it in October 2023, after MyGolfSpy noted
  the original had run six years in the catalogue. Vega sells the head in
  two shapes off one identical spec chart - a traditional muscle-back Mizar
  Pro Blade and a thin-topline Mizar Pro Cavity - both forged from a single
  piece of S20C soft steel with a brushed chrome finish and a through-the-head
  weight port that runs from heel to toe. The weight bar itself changes
  material by loft: tungsten in the long irons, titanium through the middle
  of the set and aluminium in the short irons, shifting the centre of
  gravity to help launch without changing head shape. Lofts are strong for a
  players iron, about three degrees stronger than a Titleist 620 MB club for
  club, with a 32-degree 7-iron and 44-degree pitching wedge across a 4-PW
  factory chart. Stock build uses the Shimada Nine9 steel shaft and VEGA
  Tour Density grip; UK retail for a 4-PW set started at £1,743.
