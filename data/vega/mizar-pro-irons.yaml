faq:
  - q: "What is the loft of a Vega Mizar Pro 7-iron?"
    a: "The Vega Mizar Pro 7-iron has a loft of 32 degrees and a lie of 61.5 degrees, with a 37-inch steel length - about 3 degrees stronger than a comparable Titleist 620 MB."
  - q: "Is the Vega Mizar Pro a blade or a cavity back?"
    a: "Both - Vega sells the Mizar Pro as a traditional muscle-back Blade and a thinner-topline Cavity model off one identical loft, lie and length chart, differentiated by head shape rather than numbers."
  - q: "What is the Mizar Pro's weight bar made of?"
    a: "It varies by club: tungsten in the long irons, titanium through the middle irons and aluminium in the short irons, shifting the centre of gravity to help launch without altering the forged S20C head shape."
