sources:
  - "vega-golf.com official product pages 'Vega Mizar Pro Blade Irons' and 'Vega Mizar Pro Cavity Irons' — both list an identical 4-PW factory chart, used here: lofts 21/24/28/32/36/40/44 degrees, lies 60-63, face progression 3-4 degrees, bounces 2-5 degrees, head weights 249-292 g, steel lengths 38.5 down to 35.5 inches (graphite 0.5 inch longer throughout), interchangeable tungsten/steel/aluminium weight bar options, and the Shimada Nine9 steel stock shaft with VEGA Tour Density grip."
  - "Golf Monthly 'Vega Mizar Pro Iron Review' (golfmonthly.com/reviews/irons/vega-mizar-pro-iron-review), published 3 October 2023 — fixes year_introduced 2023, the one-piece forged construction with a weight port changing from tungsten (long irons) to titanium (mid-irons) to aluminium (short irons), the brushed chrome finish, lofts roughly 3 degrees stronger than a Titleist 620 MB, and the £1,743 UK price for a 4-PW steel set."
  - "MyGolfSpy 'VEGA Reaches for the Stars with Mizar Irons' — dates the original Mizar's run at six years before the Mizar Pro and Mizar Max arrived (corroborating this site's Vega Mizar entry, discontinued 2023), and describes the Mizar Pro as offering 'enhanced feel' over the original Mizar's thicker maraging face via a one-piece ultra-soft S20C forging."
  - "Golfalot 'Vega Launch 2025 Irons Range' — confirms the Mizar Pro Blade and Mizar Pro Cavity Back remained in Vega's range as of 2025 at the same £1,494-1,743 tier, sold alongside the newer Vega SS and Lyra irons. Offset is omitted - Vega publishes face progression rather than offset."
