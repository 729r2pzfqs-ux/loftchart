description: >
  The original Mizar headed Vega's Star Range and was the most powerful iron
  in the Japanese forging house's line - a one-piece forged S25C body carrying
  a constant-thickness 3.5 mm maraging face and a tungsten slug that moves
  progressively from heel (long irons) to toe (short irons) to lower the
  centre of gravity and help square the face. It was on sale by early 2018 and
  ran until the second-generation Mizar arrived in 2023; MyGolfSpy's launch
  coverage of the replacement put the original's run at six years, which dates
  the debut to 2017. Vega builds every set to order through fitters and
  publishes loft, lie, face progression and head weight but no standard
  lengths or offsets, so those keys are omitted. The stock set runs 4-iron to
  attack wedge with a 30-degree 7-iron and 42-degree pitching wedge.
