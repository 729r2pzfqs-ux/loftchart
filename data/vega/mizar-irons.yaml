  - "Wayback Machine snapshot of na.vega-golf.com/mizar-irons.html (Vega Golf North America, archived 19 March 2018) — manufacturer spec table: lofts 20/23/26/30/34/38/42/46 for 4-A, lies 60-63, face progression 3-5 mm, head weights 251-300 g, forged one-piece body, progressive tungsten weighting, 'available in 4-A in right hand'. Vega publishes face progression rather than offset and no standard lengths, so those keys are omitted"
