faq:
  - q: "What is the loft of a Vega Mizar 7-iron?"
    a: "The original Vega Mizar 7-iron has a loft of 30 degrees and a 61.5-degree lie."
  - q: "Who makes Vega Mizar irons?"
    a: "Vega grew out of the Kyoei forging house in Ichikawa, Japan, and its heads are forged in Japan. The brand has been owned by Professional Golf Europe (2011) and Elite Sports Brands (2024), with every set built to order."
  - q: "What length is a standard Vega Mizar iron?"
    a: "Vega does not publish standard lengths - every set is built to a fitting through its stockists - so no length column is listed here. Loft, lie, face progression and head weight are the manufacturer's published head specs."
