faq:
  - q: "Is the Vega Mizar Max a full iron set?"
    a: "No. Vega sells it only as a driving iron in the #2, #3 and #4 lofts - a long-iron/hybrid replacement - not as a complete 4-PW or similar set, despite early coverage noting Vega's plans to expand it."
  - q: "What is the loft of a Vega Mizar Max 4-iron?"
    a: "20 degrees, with a 60-degree lie and a 38.5-inch steel length - the strongest (shortest-headed) club in the three-piece Mizar Max range."
  - q: "What makes the Vega Mizar Max different from the Mizar Pro?"
    a: "The Mizar Max pairs a soft steel body with a thin 2.8 mm floating titanium face for extra ball speed in a driving-iron head, while the Mizar Pro is a full forged S20C iron set (Blade or Cavity) covering 4-iron through pitching wedge."
