description: >
  The Mizar Max is Vega's driving iron rather than a full iron set - at
  launch MyGolfSpy called it "the only driving iron on the market" with a
  titanium face, adding that Vega had plans to extend it into a full set
  that had not materialised as of Vega's 2025 range announcement (which
  instead introduced a separate game-improvement model, the Lyra). A soft
  steel body with an internal cavity carries a thin, 2.8 mm floating
  titanium face for extra ball speed, in a thin-topline, squat heel-to-toe
  profile with sole relief aimed at accomplished players wanting a
  penetrating, high-launching long-iron replacement rather than higher
  handicappers needing forgiveness through a full set. Vega sells it only
  as the #2, #3 and #4 heads, with fully CNC-milled grooves and surface
  texturing and the same interchangeable weight-bar system as the rest of
  the Mizar range.
