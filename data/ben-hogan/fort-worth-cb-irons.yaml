faq:
  - q: "What is the loft of a Ben Hogan Fort Worth CB 7-iron?"
    a: "The Ben Hogan Fort Worth CB 7-iron has a loft of 34 degrees, a lie of 62.5 degrees and a length of 37.00 inches, with 0.100 inches of offset."
  - q: "What is the difference between the Ben Hogan Fort Worth CB and Fort Worth MB?"
    a: "Internal construction, not external shape. Both are forged from 1025C carbon steel with a co-forged Ceramic Matrix Composite core and share identical length, lie, offset and bounce figures on Hogan's own spec chart. The CB opens an internal cavity to push weight to the perimeter for more forgiveness, while the MB is a solid muscle-back build aimed at workability."
  - q: "What clubs come in a stock Ben Hogan Fort Worth CB set?"
    a: "It ships as a 4-PW (7-piece) or 5-PW (6-piece) set, hand-built to order in the USA, priced from roughly $900 (5-PW) up to $1,049.99 depending on set size and shaft."
  - q: "When was the Ben Hogan Fort Worth CB released?"
    a: "It was announced 14 January 2025 at the PGA Show in Orlando, alongside the Fort Worth MB, Legend and M50-01."
