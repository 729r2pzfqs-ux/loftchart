  - "Deviation worth flagging: Ben Hogan's official spec tables for the Fort Worth CB and Fort Worth MB are identical in every published column - loft, lie, length, offset, head weight, leading/trailing bounce and blade length - which was cross-checked directly against each model's own official page. Per Hogan's own data the two models share identical external head geometry and differ only in internal construction (an open, perimeter-weighted cavity on the CB vs. a solid muscle-back forging on the MB)"
