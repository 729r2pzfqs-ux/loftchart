  - "Ben Hogan Golf official Fort Worth CB Irons product page, https://www.benhogangolf.com/fort-worth-cb-irons/ (retrieved August 2026) - full SPECIFICATIONS table (Club/Length/Lie/Loft/Offset-mm/Head Weight/Leading Bounce/Trailing Bounce/Blade Length) for 4 through PW: lengths 39.00-35.75in, lie 60-64deg, loft 23-46deg, offset 3.3-1.78mm, leading bounce 15.5-20.5deg, trailing bounce 4.4-9.4deg; page confirms 1025C carbon steel, co-forged CMC core, V-SOLE, 4-PW stock configuration and $999.99-$1,049.99 pricing"
