description: >
  The Fort Worth CB is the cavity-back half of Ben Hogan Golf's 2025 Fort
  Worth relaunch, announced 14 January 2025 at the PGA Show alongside the
  Fort Worth MB, Legend and M50-01. Like the MB it is forged from 1025C
  carbon steel around a co-forged Ceramic Matrix Composite (CMC) core that
  lets Hogan manipulate each club's center of gravity, but the CB's open
  cavity pushes more of that mass to the perimeter for extra forgiveness on
  top of the MB's workability. It carries the same V-SOLE, with a
  high-bounce leading edge and softer, lower-bounce trailing edge. GolfMagic
  and GolfWRX describe it as a players/better-player cavity back that blends
  player and game-improvement characteristics for single-digit and low
  mid-handicap ball-strikers, and note it can be paired with the Fort Worth
  MB in a combo set. It ships 4-PW or 5-PW, hand-built to order in the USA.
  Ben Hogan's own spec table lists identical length, lie, offset, head
  weight, blade length and bounce figures for the Fort Worth CB and MB, so
  the two share the same external head dimensions and differ in their
  internal cavity/CMC construction rather than their outward geometry.
