faq:
  - q: "What is the loft of a Ben Hogan Apex Edge Pro 7-iron?"
    a: "The Ben Hogan Apex Edge Pro 7-iron has a loft of 34 degrees, with a 62-degree lie and a 36.75-inch steel length."
  - q: "What is the difference between the Ben Hogan Apex Edge Pro and Apex Edge?"
    a: "Both share the traditional 16-to-60-degree Hogan loft ladder, but the Edge Pro is the compact players model with minimal offset and lies half a degree flatter per club, while the Apex Edge is the larger game-improvement version with much more offset."
  - q: "When did the Ben Hogan Apex Edge Pro come out?"
    a: "Its specification page was live on benhogan.com by April 2002, and spec databases file it as a 2002 model; it reached wider distribution in 2003, the year Callaway acquired the Hogan brand."
  - q: "Are the Ben Hogan Apex Edge Pro irons forged?"
    a: "Yes — they are forged carbon-steel cavity-backs from the Fort Worth era, prized for their feel, and they remained in professionals' bags for years after production ended."
