description: >
  The Apex Edge Pro was the players model of the Spalding-era Apex Edge
  line — a compact forged cavity-back with minimal offset that became one
  of the best-loved late Fort Worth Hogan irons and stayed in tour bags
  for years after production ended. Its spec page was live on benhogan.com
  by April 2002, alongside the more offset game-improvement Apex Edge
  announced that January. Lofts are the traditional Hogan ladder — a
  34-degree 7-iron and 46-degree Equalizer pitching wedge — with lies half
  a degree flatter per club than the Apex Edge, and the range ran from a
  16-degree 1-iron to a 60-degree lob wedge with Hogan Apex steel shafts
  as stock. Hogan's letter wedges are recorded here as PW (Equalizer,
  46°), GW (F wedge, 50°), SW (56°) and LW (60°). Production wound down
  after Callaway acquired the Hogan brand in 2003; the multi-material
  Apex FTX of 2004 took its slot in the Callaway-era line.
