sources:
  - "Ben Hogan official Apex Edge Pro spec table image, benhogan.com/imgs/irons/edgepro_spec_table.gif (archive.org capture of the irons_apexedgepro_specs.html page, first archived 10 April 2002) — full 1-iron-to-LW table of lie, loft, steel and graphite length (graphite +0.5 inch); unlike the Apex Edge chart, no offset or bounce column is printed, so those keys are omitted"
  - "golfclubspec.com iron_results.php?id=86 'Apex Edge Pro' (2002) and equip2golf.com Hogan Apex Edge Pro specifications page (2002 model year) — both independently match every loft, lie and length above, including the 34-degree 7-iron and the 64-degree lie across the wedges"
  - "year_introduced 2002 rests on the April 2002 archive capture of the manufacturer spec page and both spec databases filing it as a 2002 model; some retail and UK review coverage (golfmagic.com, 2003) dates the model 2003, which is when it reached wider distribution"
  - "year_discontinued 2004 on the successor convention: Callaway acquired the Hogan brand in the 2003 Top-Flite purchase and its 2004 Hogan line led with the Apex FTX (pitchmarks.com Hogan Apex timeline); Apex Edge Pro sets continued to be played on tour well after"
  - "Stock shaft: period listings and reviews consistently show Hogan's own Apex flighted steel shafts (Apex 3/4/5 stiffness numbering); graphite builds added half an inch per the factory chart"
