  - "Golf Monthly, 'Ben Hogan Fort Worth MB Irons Review' (https://www.golfmonthly.com/reviews/irons/ben-hogan-fort-worth-mb-irons-review, published March 2025) and GolfWRX 'Ben Hogan Fort Worth CB & MB irons review - Club Junkie Reviews' (https://golfwrx.com/761203/ben-hogan-fort-worth-cb-mb-irons-review-club-junkie-reviews/) - describe it as a forged muscle-back blade for skilled players, confirm the CMC core and V-SOLE, note the 7-iron's traditional 34-degree loft and give a 5-PW launch price of $899.99"
  - "The First Call, 'Ben Hogan: Launching new equipment range at PGA Show', 14 January 2025 - confirms the joint announcement date and booth (#2301) for the Fort Worth MB, Fort Worth CB, Legend and M50-01"
  - "Deviation worth flagging: Ben Hogan's official spec tables for the Fort Worth MB and Fort Worth CB are identical in every published column - loft, lie, length, offset, head weight, leading/trailing bounce and blade length. This was cross-checked against an independent source (thegolfclubtrader.com) for the MB and read the same way from the CB's own page, so it is recorded here as published rather than dismissed as a scraping error. Per Hogan's own data the two models share identical external head geometry and differ only in internal construction (solid muscle-back forging on the MB vs. a perimeter-weighted cavity on the CB)"
