description: >
  The Fort Worth MB is the muscle-back blade half of Ben Hogan Golf's 2025
  Fort Worth relaunch, announced 14 January 2025 at the PGA Show alongside
  the Fort Worth CB, Legend and M50-01. It is forged from 1025C carbon steel
  with Hogan's Ceramic Matrix Composite (CMC) technology - a fibre-infused
  ceramic core, lighter than steel, co-forged into each head and precisely
  positioned to manipulate the center of gravity club by club. It keeps the
  V-SOLE, with a high-bounce leading edge and a softer, lower-bounce trailing
  edge. Reviewers (Golf Monthly, GolfWRX) describe it as a traditional,
  compact muscle-back blade for better players, with no distance-chasing
  loft jacking: the 7-iron sits at a traditional 34 degrees. It ships 4-PW or
  5-PW, hand-built to order in the USA, and can be paired with the Fort Worth
  CB in a combo set. Ben Hogan's own spec table lists identical length, lie,
  head weight, blade length and bounce figures for the Fort Worth MB and CB,
  so the two share the same external head dimensions and differ in their
  internal cavity/CMC construction rather than their outward geometry.
