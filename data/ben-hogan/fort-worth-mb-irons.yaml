faq:
  - q: "What is the loft of a Ben Hogan Fort Worth MB 7-iron?"
    a: "The Ben Hogan Fort Worth MB 7-iron has a loft of 34 degrees, a lie of 62.5 degrees and a length of 37.00 inches, with 0.100 inches of offset."
  - q: "Is the Ben Hogan Fort Worth MB a blade or a cavity back?"
    a: "It is a muscle-back blade - the workability-focused half of Hogan's 2025 Fort Worth relaunch, forged from 1025C carbon steel with a co-forged Ceramic Matrix Composite core. Its cavity-back sibling, the Fort Worth CB, launched the same day."
  - q: "What clubs come in a stock Ben Hogan Fort Worth MB set?"
    a: "It ships as a 4-PW (7-piece) or 5-PW (6-piece) set, hand-built to order in the USA, priced from about $899.99-$1,049.99 depending on set size and shaft."
  - q: "When was the Ben Hogan Fort Worth MB released?"
    a: "It was announced 14 January 2025 at the PGA Show in Orlando, alongside the Fort Worth CB, Legend and M50-01."
