description: >
  The Apex Plus was the perimeter-weighted companion to the 1999 Ben Hogan
  Apex blade — a forged 1030 carbon steel head whose modified muscle-cavity
  kept a traditional profile only slightly larger than the blade while
  enlarging the sweet spot heel to toe. Hogan's launch material pitched it
  as the heir to the company's 1987 Edge, the first forged
  perimeter-weighted iron, and used progressive face thicknesses to move
  the centre of gravity lower in the long irons and higher in the short
  irons, with progressive offset for long-iron trajectory. Lofts are
  traditional (34-degree 7-iron, 46-degree Equalizer) with Hogan's
  characteristically flat lies (58 degrees at the 1-iron, 64 across the
  wedges), and the range ran from a 16-degree 1-iron to a 60-degree lob
  wedge. Hogan's letter wedges are recorded here as PW (Equalizer, 46°),
  GW (F wedge, 50°), SW (56°) and LW (60°). The Apex Edge announced in
  January 2002 replaced it as the forgiving forged Hogan.
