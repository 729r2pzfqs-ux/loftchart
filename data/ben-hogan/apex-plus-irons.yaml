faq:
  - q: "What is the loft of a Ben Hogan Apex Plus 7-iron?"
    a: "The Ben Hogan Apex Plus 7-iron has a loft of 34 degrees, with a 62-degree lie, a 36.75-inch steel length and 0.132 inches of offset."
  - q: "Are the Ben Hogan Apex Plus irons forged?"
    a: "Yes — the heads are forged from 1030 carbon steel in Fort Worth, with perimeter weighting added to a modified muscle-cavity so the club kept forged feel while enlarging the sweet spot."
  - q: "When did the Ben Hogan Apex Plus come out?"
    a: "It launched in 1999 as the perimeter-weighted companion to that year's Apex blade, and was replaced when the Apex Edge was announced in January 2002."
  - q: "How forgiving is the Ben Hogan Apex Plus compared to the Apex blade?"
    a: "Hogan gave it a slightly larger profile than the Apex blade and perimeter weighting for a larger heel-to-toe sweet spot, but it kept the same traditional lofts and flat Hogan lies, so it remains a players iron rather than a game-improvement club."
