description: >
  The Edge GS refined Hogan's original 1990 Edge Forged cavity-back with a
  custom sole grind attributed to Hogan master model-maker Gene Sheely — the
  "GS" initials — reportedly developed first for Hogan's tour players and
  its own management group because the standard Edge "did not look too
  good" at address. It kept the Edge Forged's cavity-back, perimeter-weighted
  construction while refining the grind and profile, and was sold in
  configurations spanning 2-iron through Equalizer and sand wedge. Vintage
  listings confirm a 36-degree 7-iron loft; the remaining loft, lie and
  length ladder below is not from a located Edge GS-specific factory sheet
  but from Hogan's contemporaneous "1999 Apex" factory table, which shares
  the identical 36-degree 7-iron and the same lie/length progression Hogan
  used across its forged iron lines of this era — recorded here as the
  closest documented match rather than an Edge GS-specific figure, hence the
  low confidence.
