faq:
  - q: "What is the loft of a Ben Hogan Edge GS 7-iron?"
    a: "The Ben Hogan Edge GS 7-iron has a loft of 36 degrees, confirmed from vintage club listings; the surrounding lie and length figures are drawn from Hogan's closest documented same-era table rather than an Edge GS-specific sheet."
  - q: "What does GS stand for on the Ben Hogan Edge GS?"
    a: "Gene Sheely, the Hogan master model-maker credited with the custom sole grind that refined the original 1990 Edge Forged into the Edge GS in 1991."
  - q: "Why was the Ben Hogan Edge GS created?"
    a: "According to MyGolfSpy's history of the line, it began as a custom grind Gene Sheely built for Hogan's own tour players and management group because the standard Edge Forged did not look as good at address; it was then adopted into the regular line-up."
  - q: "What replaced the Ben Hogan Edge GS?"
    a: "The Edge GCD, which capitalized on the oversized-iron trend when it arrived in 1994-95."
