faq:
  - q: "What is the loft of a Ben Hogan Legend 7-iron?"
    a: "The Ben Hogan Legend 7-iron has a loft of 30.5 degrees, a lie of 62 degrees and a length of 37.00 inches, with 0.118 inches of offset."
  - q: "Is the Ben Hogan Legend a hollow-body iron?"
    a: "Yes. Ben Hogan describes it as the company's first hollow-body, foam-filled iron head - a forged face over a hollow body injected with a tuned foam fill, intended to redistribute mass for a larger effective hitting area and better feel on mis-hits."
  - q: "What clubs come in a stock Ben Hogan Legend set?"
    a: "It is offered as a 4-PW (7-piece) or 5-PW (6-piece) stock set, hand-built to order in Hogan's USA workshop, at $949.99 for the standard build (custom builds from $849.99)."
  - q: "When was the Ben Hogan Legend iron released?"
    a: "It was announced 14 January 2025 at the PGA Show in Orlando, alongside the Fort Worth MB, Fort Worth CB and M50-01 - the same launch that introduced Ben Hogan's whole 2025 iron lineup."
