description: >
  The Legend is Ben Hogan Golf's first hollow-body, foam-filled iron,
  announced 14 January 2025 alongside the Fort Worth MB, Fort Worth CB and
  M50-01 at the PGA Show (Golf Brands booth #2301) and engineered with the
  help of AI-assisted design. A forged face sits on a hollow head injected
  with a high-performance foam, tuned in mass and density club by club, which
  Hogan says redistributes discretionary mass for an enlarged "Effective
  Hitting Area" and better acoustics/feel on off-center hits. It carries the
  V-SOLE with its high-bounce leading edge and lower-bounce trailing edge.
  Reviewers (Plugged In Golf, GolfMagic) class it as a players-distance/
  game-improvement iron aimed at mid-to-low handicappers, comparing it
  directly to distance-forgiveness irons like the TaylorMade P790 at roughly
  two-thirds the price. It is offered as a 4-PW or 5-PW stock set, hand-built
  to order in Hogan's USA workshop (10-15 working days), with full custom
  loft/lie/length adjustment available. Neither bounce nor swing weight is
  published on Hogan's spec chart for this model.
