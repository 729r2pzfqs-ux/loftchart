faq:
  - q: "What is the loft of a Ben Hogan Medallion 7-iron?"
    a: "No complete factory sheet for the Medallion was located; extrapolating from the confirmed 19.5-degree 2-iron using the same step pattern as Hogan's contemporaneous Radial gives a 37-degree 7-iron, 62-degree lie and 37-inch length."
  - q: "What is the difference between the 1978 and 1982 Ben Hogan Medallion?"
    a: "Collectors report the two are distinguished mainly by the 'BH' sunburst medallion badge used on the 1982 version — no other construction difference has been reliably documented between the badge years."
  - q: "Is the Ben Hogan Medallion forged or cast?"
    a: "Cast. It used investment-cast stainless steel, unlike most of Hogan's better-known forged blades, aimed at golfers who wanted more forgiveness than the company's players irons offered."
  - q: "What replaced the Ben Hogan Medallion?"
    a: "The cast Radial, which carried a similar forgiveness-first approach with a distinctive wide radial sole, per GolfWRX collector sourcing."
confidence: low
