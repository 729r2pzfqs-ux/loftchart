description: >
  The Medallion was Hogan's cast, game-improvement iron of the late 1970s
  and early 1980s, offered alongside the company's forged blades for
  players who wanted more forgiveness. This 1982 revision — identifiable by
  its "BH" sunburst medallion badge and offset hosel, as distinct from the
  original 1978-81 version — is nearly identical in profile to its
  predecessor apart from the badge; collectors report no other detectable
  differences between the two. A confirmed 2-iron of 19.5 degrees loft and
  39.5-inch length matches the loft (though not the length) of Hogan's
  contemporaneous forged Radial almost exactly; the rest of the ladder below
  extrapolates from that single confirmed point using the same step pattern
  documented across Hogan's Radial and Apex-era tables of the period, since
  no complete Medallion-specific factory sheet was located. Confidence is
  marked low for that reason. Hogan's letter wedge is recorded here as PW.
