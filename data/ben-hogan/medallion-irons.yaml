  - "Deviation from the initial gap-analysis brief: year_introduced is recorded as 1982 rather than 1985. Hogan's own archived spec-sheet chooser and independent collector sources catalog only a 1978 and a 1982 Medallion — no 1985 edition is documented anywhere located — so the closer-to-1985 of the two verified years is used, with year_discontinued set to 1983 on the strength of GolfWRX collector sourcing that the (cast) Radial succeeded the Medallion in Hogan's game-improvement slot"
