faq:
  - q: "What is the loft of a Ben Hogan Apex Edge 7-iron?"
    a: "The Ben Hogan Apex Edge 7-iron has a loft of 34 degrees, with a 62.5-degree lie, a 36.75-inch steel length and 0.182 inches of offset."
  - q: "What is the difference between the Ben Hogan Apex Edge and Apex Edge Pro?"
    a: "They share the same traditional 16-to-60-degree loft ladder, but the Apex Edge is the game-improvement model with substantially more offset and lies half a degree more upright per club, while the Apex Edge Pro is the compact low-offset players version."
  - q: "When did the Ben Hogan Apex Edge come out?"
    a: "The Spalding-era Ben Hogan company announced it on 25 January 2002. The Apex Edge CFT succeeded it in 2003 as Callaway took over the brand."
  - q: "What does the E stamped on the Ben Hogan Apex Edge wedge mean?"
    a: "It stands for Equalizer, Hogan's traditional name for the pitching wedge — 46 degrees in this set, recorded here as the PW."
