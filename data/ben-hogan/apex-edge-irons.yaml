description: >
  The Apex Edge was the game-improvement model of the Spalding-era Ben
  Hogan Apex Edge line, announced on 25 January 2002 alongside the more
  compact Apex Edge Pro. It is a forged cavity-back whose muscle-cavity
  design launched the ball higher than the Pro, with markedly more offset
  (0.242 inches at the 3-iron tapering to 0.107 at the Equalizer wedge)
  and lies half a degree more upright than the Pro through the set. Lofts
  are the traditional Hogan ladder — a 34-degree 7-iron and 46-degree
  Equalizer pitching wedge — and the full range ran from a 16-degree
  1-iron to a 60-degree lob wedge, sold with Apex Edge steel or graphite
  shafts and a Ben Hogan Tour Velvet grip. Hogan's letter wedges are
  recorded here as PW (Equalizer, 46°), GW (F wedge, 50°), SW (56°) and
  LW (60°). The Apex Edge CFT, on Hogan's site by early 2003 as Callaway
  acquired the brand, succeeded it.
