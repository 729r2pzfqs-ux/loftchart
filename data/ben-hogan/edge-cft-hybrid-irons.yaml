faq:
  - q: "What is the loft of a Ben Hogan Edge CFT Hybrid 7-iron?"
    a: "The Ben Hogan Edge CFT Hybrid 7-iron has a loft of 34 degrees, with a 62.5-degree lie and a 36.75-inch length."
  - q: "What is Compression Forged Titanium on the Edge CFT Hybrid?"
    a: "A titanium face compression-forged onto a 17-4 stainless steel body, with an undercut cavity that shifts weight to the perimeter and sole for a lower, deeper center of gravity and higher launch."
  - q: "Which clubs in the Edge CFT Hybrid set are hybrids instead of irons?"
    a: "The 3-iron and 4-iron were replaced by 3h and 4h hybrid heads in the set Hogan positioned as its improved long-iron option, though conventional 3- and 4-iron heads (and 1h, 2h and 5h hybrids) were also available individually."
  - q: "What clubs came in a stock Ben Hogan Edge CFT Hybrid set?"
    a: "It was offered right hand from 1-iron through Equalizer, F wedge, SW and LW, and left hand from 2-iron through Equalizer and SW, at $825 in steel or $900 in graphite."
