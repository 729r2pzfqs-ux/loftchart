description: >
  The Edge C•F•T Hybrid "h" Iron Set — the gap-analysis brief's "Apex Edge
  CFT" refers to this 2004 line, which built on the 2003 Edge CFT by adding
  true hybrid heads — pairs Hogan's Compression Forged Titanium face
  technology (a titanium face compression-forged onto a 17-4 stainless
  steel body for perimeter and sole weighting) with 3h and 4h hybrid heads
  that replace the standard 3- and 4-irons for easier long-iron shotmaking. A
  low, deep center of gravity from the two-piece, undercut-cavity
  construction is pitched for a higher launch angle and higher moment of
  inertia — "higher, longer and more accurate ball flight." Every club from
  1 through 5 was also offered as a conventional iron head alongside its "h"
  hybrid counterpart, so the loft/lie/length ladder below uses the standard
  iron heads for 1-9 plus the wedges. Hogan's letter wedges are recorded
  here as PW (Equalizer, 46°), GW (F wedge, 50°), SW (56°) and LW (60°). It
  was sold right hand 1-E/F/S/L and left hand 2-E/S, at $825 (steel) or $900
  (graphite).
