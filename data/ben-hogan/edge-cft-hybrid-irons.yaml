sources:
  - "Ben Hogan official Edge C•F•T Hybrid 'h' Iron Set catalog spread, benhogan.com/products/PDF/EdgeCFT-hybrid-set.pdf (Wayback capture of 26 February 2005) — full standard specifications table across both conventional and 'h' hybrid heads for 1/1h through 5/5h plus 6-9 and E/F/S/L: lofts 16-60 degrees (conventional column), lie angles 59.5-64 degrees, bounce 0-8 degrees, steel lengths 39.75 to 35 inches (graphite a half inch longer), offsets .262 down to .087 inches, the Compression Forged Titanium face / 17-4 stainless frame / undercut 3-D weighting copy, 'Available Right Hand: 1-E, F, S, L • Left Hand: 2-E, S' and SRP $825 steel / $900 graphite"
  - "golfclubshaftreview.com Ben Hogan shaft-ladder PDF (benhogan_1.2.pdf) — lists '2003 Edge CFT Irons' and '2004 Edge CFT Hybrid Irons' as separate, consecutive entries with an Apex Edge steel or graphite shaft, corroborating the 2004 introduction year for the hybrid-equipped set used here"
  - "thesandtrap.com forum thread 'Ben Hogan Edge CFT Iron Info' and 2ndswing.com's Edge CFT Hybrid iron-set listing — corroborate the 3h/4h hybrids replacing the 3- and 4-irons for easier long-iron play, and the two-piece titanium-face/stainless-body construction"
  - "Deviation from the initial gap-analysis brief: the model is filed here as 'Edge CFT Hybrid' rather than 'Apex Edge CFT,' matching Hogan's own product name; the plain, non-hybrid 'Edge CFT' launched in 2003 and is the direct predecessor named in the description"
