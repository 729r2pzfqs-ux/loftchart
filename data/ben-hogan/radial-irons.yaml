description: >
  The Radial was Hogan's attempt to reach mid-to-high handicap golfers with
  a forged iron, built around a wide, radiused sole shaped to resist digging
  and to keep the center of gravity low and back for an easy, forgiving
  ball flight — "an extremely easy to hit forging" that vintage-club
  reviewers still rate among the most playable Hogan ever made. This forged
  1987 generation followed the original 1983 Radial, which used the same
  radial-sole concept in a cast head; Hogan collectors catalog the two as
  distinct, consecutive spec sheets ("1983 Radial Cast" and "1987 Radial
  Forged"). At roughly $1,000 a set in 1983 dollars, the Radial concept was
  expensive for the category, and it never dislodged Hogan's reputation as
  a players-only brand in the mid-handicap market it targeted. Lofts are
  moderate for a forgiveness-oriented iron of the era (37-degree 7-iron,
  50-degree Equalizer), sold as a 2-iron through Equalizer set. Hogan's
  letter wedge is recorded here as PW (Equalizer, 50°).
