faq:
  - q: "What is the loft of a Ben Hogan Radial 7-iron?"
    a: "The Ben Hogan Radial 7-iron has a loft of 37 degrees, with a 62-degree lie and a 37-inch length."
  - q: "What made the Ben Hogan Radial different from other Hogan irons of its era?"
    a: "A wide, radiused sole designed to resist digging and keep the center of gravity low and back, aimed at making the club easier to hit for mid-to-high handicap players — a clear departure from Hogan's usual players-first forged blades."
  - q: "Was the Ben Hogan Radial forged or cast?"
    a: "Both existed: the original 1983 Radial used a cast head, and this 1987 generation carried the same wide radial-sole concept into a forged head."
  - q: "What clubs came in a stock Ben Hogan Radial set?"
    a: "It was sold as a 2-iron through Equalizer (pitching wedge) set on a stock Ben Hogan Apex steel shaft."
