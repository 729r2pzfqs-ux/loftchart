faq:
  - q: "What is the loft of a 1972 Ben Hogan Apex 7-iron?"
    a: "The original 1972 Ben Hogan Apex 7-iron has a loft of 36.5 degrees, with a 61.5-degree lie and a 36.75-inch steel length — roughly three clubs weaker than a typical modern 7-iron."
  - q: "What is the Equalizer on the 1972 Ben Hogan Apex?"
    a: "Equalizer was Hogan's name for the pitching wedge. On the 1972 Apex it is 51.5 degrees — the highest-lofted Equalizer of any Apex generation; by the early 1980s Hogan had moved it to 50 degrees."
  - q: "Why is the 1972 Ben Hogan Apex famous?"
    a: "It was the first iron to carry the Apex name — taken from Hogan's own lightweight Apex steel shaft — and it began the forged blade dynasty that ran through the Apex II, Apex PC and Redline into the 1990s. The head shape itself carried over from the 1970 Bounce Sole."
  - q: "What clubs came in a 1972 Ben Hogan Apex set?"
    a: "The stock set ran from the 2-iron through the Equalizer pitching wedge; sand wedges such as the Sure-Out were sold separately."
