sources:
  - "Ben Hogan company official 1972 Apex spec chart, served as 70c_specs.jpg on the old benhogan.com 'iron tour' history section (archive.org capture of 13 July 2003) — the full 2-E table of loft, lie angle and steel length used above, including the 51.5-degree Equalizer. The chart's 37.25-inch 2-iron length is an evident misprint duplicating the 6-iron; 39.25 follows the chart's own half-inch progression and matches the 2-iron length on the company's Apex Plus and Apex Edge charts"
  - "GolfWRX forum thread 'Vintage Ben Hogan. Iron Specs' (April 2021) — collectors citing the same old-Hogan-site spec archive confirm the 51.5-degree Equalizer as specific to the 1972 Apex (later Medallion-era Equalizers were 50 degrees, and 1950s-60s sets measured about 52)"
  - "golfwrx.com 'The greatest Ben Hogan irons of all time' and pitchmarks.com 'Ben Hogan Apex Irons By Year' — the 1972 debut as a compact muscle-back for low-handicap players, the head shape carried over from the 1970 Bounce Sole, and the Apex II following in 1979, which sets year_discontinued on the successor convention. The old benhogan.com model chooser likewise lists '1972 Apex' and '1979 Apex II'"
  - "The Apex name came from Hogan's lightweight Apex steel shaft with its numbered 2-5 stiffness scale, the stock shaft throughout this model's run; no offset, bounce or swing-weight figures were published for it"
