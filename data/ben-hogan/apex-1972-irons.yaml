description: >
  The 1972 Apex was the first Hogan iron to carry the Apex name — a
  compact forged muscle-back blade for low-handicap golfers, built in Fort
  Worth on essentially the head shape of the 1970 Bounce Sole and paired
  with Hogan's lightweight Apex steel shaft, whose numbered stiffnesses
  (Apex 2 through 5) the model shared its name with. It began a blade
  dynasty that ran through the Apex II, PC, Redline and later generations.
  Specs are pure early-seventies Hogan: very flat lies (56.5 degrees at
  the 2-iron), a 36.5-degree 7-iron, and a 51.5-degree Equalizer pitching
  wedge — the strongest-numbered wedge of any Apex generation, later
  Hogans settling at 50 degrees or less. The stock set ran 2-iron through
  Equalizer (recorded here as PW), with the Sure-Out and other wedges sold
  separately. The factory chart misprints the 2-iron steel length as
  37.25 inches (duplicating the 6-iron); 39.25 is recorded here, the only
  value consistent with the chart's own half-inch ladder and with every
  other Hogan chart of the era.
