description: >
  Collectors call this 1988-89 Apex generation the "Redline" for the red
  paint line Hogan ran under the signature on the back of the muscle-back —
  a cosmetic marker distinguishing it from the otherwise similar-looking
  1984-87 Apex PC that preceded it. Equip2Golf's own chronological Apex
  history describes it as "a beautiful blade with larger sole flange and
  lower center of gravity," and it is widely regarded among Hogan
  collectors as one of the purest true blades the company ever forged —
  narrow topline and sole, minimal offset, a cascading-step muscle-back and
  a pinned, chrome-forged finish. Hogan's own 1988-89 factory spec sheet for
  the Redline could not be located; the loft, lie and length ladder below is
  instead the verified table for its direct successor, the 1990-92 Apex BH
  Grind — the next generation of the same small-blade lineage — and should
  be read as a close approximation rather than a Redline-specific factory
  figure. Confidence is marked low for that reason.
