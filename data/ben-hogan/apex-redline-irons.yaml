faq:
  - q: "Why is the 1988-89 Ben Hogan Apex called the 'Redline'?"
    a: "Collectors named it for the thin red paint line Hogan ran under the Ben Hogan signature on the back of the muscle-back, which distinguishes it from the visually similar 1984-87 Apex PC that came before it."
  - q: "What is the loft of a Ben Hogan Apex Redline 7-iron?"
    a: "No factory spec sheet for the 1988-89 Redline itself has been located; the best documented approximation, from the 1990 factory table for its direct successor the Apex BH Grind, gives the 7-iron a 37-degree loft, 62-degree lie and 36.75-inch length."
  - q: "What replaced the Ben Hogan Apex Redline?"
    a: "The Apex BH Grind, a small-blade generation with a square toe that Hogan's own history places immediately after the Redline, current from 1990 to 1992."
  - q: "Are Ben Hogan Apex Redline irons forged?"
    a: "Yes. Collectors and vintage-club dealers consistently describe them as forged, chrome-finished muscle-backs with a pinned shaft — among the purest true blades Hogan ever made."
confidence: low
