sources:
  - "equip2golf.com/archives/history/hogan_apex.html (Wayback capture of 8 March 2004) — Hogan's own chronological Apex history dates '1988-1989 Apex' as 'a beautiful blade with larger sole flange and lower center of gravity. Has Ben Hogan signature with red line under it,' immediately preceded by '1984-1987 Apex PC' and followed by '1990-1992 Apex BH Grind, a small blade with square toe'"
  - "GolfWRX forum thread 'Hogan Iron Spec Sheet' (started by Chuck_22046, 31 October 2014) — a collector-compiled year-by-year Hogan model list separately entries '1988 Hogan Apex Redlines' (status: Complete) and '1990 Apex BH Grind' (status: Complete, later given lie angles); confirms 'Redline' as the collector name for the 1988-89 Apex and that it is a distinct spec generation from the following BH Grind"
  - "hobbyjon.com 'The Vintage Golfer - 1988 Ben Hogan Apex Redline Forged Irons' and multiple 2014-2015 eBay/GolfWRX listings for '1988-89 Redline' single irons on Ben Hogan Apex Extra steel shafts — corroborate the forged, pinned-shaft, chrome-finish muscle-back construction and the 1988-89 production window"
  - "Loft/lie/length figures used here are the 1990 Hogan factory catalog table for the Apex BH Grind (posted verbatim by forum user Shallowface in the GolfWRX 'Hogan Iron Spec Sheet' thread, 6 December 2014: club/length/loft/lie 1 39.75/17.5/56 through S 35/56/65), used as the closest documented same-lineage stand-in because no 1988-89 Redline-specific factory sheet could be found; confidence is set to low accordingly"
