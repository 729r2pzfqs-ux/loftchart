sources:
  - "Ben Hogan Golf official M50-01 Irons product page, https://www.benhogangolf.com/m50-01-irons/ (retrieved August 2026) - SPECIFICATIONS table (Club/Lie/Loft/Offset-mm/Trailing Bounce) for 4 through GW: lie 60.5-63.75deg, loft 21-48deg, offset 4-3mm, trailing bounce 0.5-4deg; confirms 1020C one-piece forged CNC construction, V-SOLE, stock shaft list (Dynamic Gold 105 R300/S300/X100, KBS Tour Lite 95g/100g/105g, UST Recoil 760/780) and set configurations 5-PW/4-PW/5-GW/4-GW; the UK mirror at benhogangolf.co.uk/m50-01-irons/ reproduces the same loft/lie/offset/bounce table for 4-PW"
  - "Ben Hogan's M50-01 spec table has no Length column, unlike the Legend, Fort Worth MB and Fort Worth CB tables published the same launch cycle (all three of which independently give an identical 39.00in-35.75in, 4-through-PW length ladder). The length values here are that same company-wide ladder, carried over on the strength of it matching across three sibling 2025 models, with the GW length extrapolated a further 0.25in short of the PW (35.50in) following the standard 0.25in per-club step. This is an inference from Hogan's own consistent length pattern, not a Hogan-published M50-01 figure, so it should be treated as less certain than the loft/lie/offset/bounce numbers, which come directly off Hogan's own chart"
  - "Offset values converted from the millimeters on Hogan's table to inches (mm / 25.4) to match this database's unit convention, e.g. 4mm = 0.157in, 3mm = 0.118in"
  - "golfreviewsguide.com, 'Ben Hogan M50-01 Irons (New 2025 Model Reviewed)' (published 27 March 2025, https://golfreviewsguide.com/ben-hogan-m50-01-irons/) - explicitly calls the M50-01 Hogan's 'player's distance category' iron for elite/low-handicap golfers wanting feel, workability and some forgiveness, comparable to the 2024 PTx Tour; states lofts run about 2 degrees stronger than traditional through the set, and gives pricing of $799.99 (6-piece, 5-PW) and $899.99 (7-piece, 4-PW)"
  - "The First Call, 'Ben Hogan: Launching new equipment range at PGA Show', 14 January 2025 - confirms the joint announcement date and booth (#2301), and describes the M50-01 as a 'forged CNC players distance iron offering incredible feel with increased power'"
  - "Only trailing bounce is published for this model (no leading-bounce column, unlike the Fort Worth MB/CB chart), and swing weight is not published; both are omitted from the spec rows accordingly"
