faq:
  - q: "What is the loft of a Ben Hogan M50-01 7-iron?"
    a: "The Ben Hogan M50-01 7-iron has a loft of 31 degrees and a lie of 62 degrees. Ben Hogan does not publish a length figure for the M50-01; the 37.00-inch length recorded here is carried over from the identical length ladder used on the Legend, Fort Worth MB and Fort Worth CB launched alongside it, so treat it as slightly less certain than the loft and lie."
  - q: "Is the Ben Hogan M50-01 a game-improvement iron?"
    a: "No - Ben Hogan and reviewers place it in the player's-distance category, aimed at elite and low-handicap golfers who want forged feel and workability with some extra forgiveness and carry, not maximum forgiveness."
  - q: "What clubs come in a stock Ben Hogan M50-01 set?"
    a: "It is offered as 5-PW (6 clubs), 4-PW (7 clubs), 5-GW (7 clubs) or 4-GW (8 clubs), hand-built to order in the USA, priced from $799.99 for the 6-piece set up to $899.99 (7-piece 4-PW) and beyond depending on set size and shaft."
  - q: "When was the Ben Hogan M50-01 released?"
    a: "It was announced 14 January 2025 at the PGA Show in Orlando, alongside the Legend, Fort Worth MB and Fort Worth CB."
