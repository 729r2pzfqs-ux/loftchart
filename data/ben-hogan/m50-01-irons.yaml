description: >
  The M50-01 is the forged players-distance entry in Ben Hogan Golf's 2025
  lineup, announced 14 January 2025 at the PGA Show alongside the Fort
  Worth MB, Fort Worth CB and Legend. It is a one-piece 1020C carbon steel
  forging with a CNC-milled face, a compact head and a thin topline, carrying
  the V-SOLE sole design. Lofts run about two degrees stronger than a
  traditional set (21-degree 4-iron through 44-degree pitching wedge), and
  Hogan extends the stock set down to a 48-degree gap wedge. GolfReviewsGuide
  positions it explicitly as Hogan's player's-distance model - aimed at
  elite and low-handicap golfers wanting forged feel and workability with a
  bit more forgiveness and carry than the Fort Worth MB/CB blades or cavity
  backs, comparable to the earlier PTx Tour. It is offered in 5-PW (6 clubs),
  4-PW (7 clubs), 5-GW (7 clubs) or 4-GW (8 clubs), hand-built to order in
  the USA. Ben Hogan's own spec chart for this model does not publish a
  length column (unlike the Legend, Fort Worth MB and Fort Worth CB charts
  released the same day); the lengths below are carried over from that
  identical 39.00in-35.75in ladder used across Hogan's current lineup, with
  the gap wedge extrapolated a further quarter inch short of the pitching
  wedge, so confidence on the length column specifically is lower than on
  the loft, lie and offset figures Hogan does publish.
