faq:
  - q: "What is the loft of a Ben Hogan Apex FTX 7-iron?"
    a: "The Ben Hogan Apex FTX 7-iron has a loft of 34 degrees, with a 62-degree lie, a 36.75-inch length and 0.127 inches of offset."
  - q: "What does F•T•X stand for on the Ben Hogan Apex FTX?"
    a: "Forged Transition Set. The clubhead shape changes gradually club to club: the long irons carry cavity-back perimeter weighting for playability, while from the 8-iron down the cavity disappears into a true muscle-back blade for scoring-club feel and control."
  - q: "Are Ben Hogan Apex FTX irons forged?"
    a: "Yes. Every head, from the cavity-back long irons to the muscle-back short irons, is precision forged, and Hogan marketed the set at 'the most demanding players and shot-makers.'"
  - q: "What clubs came in a stock Ben Hogan Apex FTX set?"
    a: "It was offered right hand from 1-iron through Equalizer, FW wedge, SW and LW, and left hand from 2-iron through Equalizer and SW, at $1,000 in steel or $1,080 in graphite."
