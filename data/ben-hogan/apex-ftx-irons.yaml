description: >
  The Apex F•T•X ("Forged Transition Set") is a precision forged
  iron whose head design changes gradually from club to club rather than
  splitting the set into a fixed long-iron and short-iron style. Hogan's own
  catalog copy describes it as "a precision designed, shot-making instrument"
  built for "the most demanding players and shot-makers": the 1-iron through
  7-iron carry the perimeter weighting of a cavity-back blade with longer
  blade lengths for playability and a muscle pad inside the cavity for feel,
  and from the 8-iron through the wedges the cavity disappears entirely into
  a true muscle-back blade, with the muscle pad enlarging as the loft
  increases for scoring-club control. Lofts are traditional (34-degree
  7-iron, 46-degree Equalizer) with Hogan's characteristically flat lies (59
  degrees at the 1-iron, 64 across the wedges) and a range running from a
  16-degree 1-iron to a 60-degree lob wedge. Hogan's letter wedges are
  recorded here as PW (Equalizer, 46°), GW (FW wedge, 50°), SW
  (56°) and LW (60°). It was sold right hand 1-E/F/S/L and left hand
  2-E/S, at $1,000 (steel) or $1,080 (graphite).
