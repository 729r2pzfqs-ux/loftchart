sources:
  - "Ben Hogan official Apex FTX catalog spread, archive.org capture of bridgestonegolf-era benhogan.com/products/PDF/ApexFTX-Irons.pdf (Wayback capture of 26 February 2005) — full 1-to-LW standard specifications table: lofts 16/18/20/23/26/30/34/38/42/46/50/56/60, lie angles 59.0-64 degrees, bounce 1-12 degrees, steel lengths 39.75 to 35 inches (graphite a half inch longer per club), offsets .240 down to .030 inches, the cavity-to-blade transition copy, the 'professionals and demanding shot-makers' positioning, 'Available Right Hand: 1-E, F, S, L • Left Hand: 2-E, S' and SRP of $1,000 steel / $1,080 graphite"
  - "golfclubshaftreview.com Ben Hogan shaft-ladder PDF (benhogan_1.2.pdf) — confirms '2004 Apex FTX Irons' with an Apex-branded steel shaft, corroborating the 2004 introduction year"
  - "2ndswing.com and golfavenue.com Apex FTX iron-set listings — confirm the forged 1020-carbon-steel construction and the long-iron-cavity/short-iron-blade transitional design"
  - "Deviation from the initial gap-analysis brief: category is recorded here as players rather than game-improvement. Hogan's own marketing copy pitches the FTX at 'the most demanding players and shot-makers,' its lofts and lengths match the players-category Apex Plus almost exactly, and its defining feature (a cavity that shrinks into a true muscle-back blade by the 8-iron) is a better-player trait, not a game-improvement one"
