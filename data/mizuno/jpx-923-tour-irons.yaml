description: >
  The Tour is the compact end of the JPX 923 family, a Grain Flow Forged cavity back
  for single-figure players rather than the game-improvement Hot Metal that carries
  the same number. Lofts are traditional — 34 degrees at the 7-iron, six weaker than
  the JPX 925 Hot Metal — and offset is uniform and tight, moving only 0.025 inches
  across the whole set. Mizuno announced the JPX 923 family in 2022 and the Tour and
  Forged models reached retail in February 2023.
