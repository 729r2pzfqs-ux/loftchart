  - "Year and history: Mizuno's official Japanese club history (jpn.mizuno.com/golf/clubs/history) lists the Mizuno Pro TN-87 under 1988; the MizunoDBG vintage blog (mizunotp.tech.blog) confirms Japan-only sale from 1988, the Faldo association, the copper underlay, the 2000 and 2014 reissues, and the MP-29/TP-2000 remakes. The '87' in the name refers to its 1987 design year"
