description: >
  The Mizuno Pro TN-87 is the most storied blade in Mizuno's catalogue: a Japan-only
  Grain Flow Forged muscleback named for Tsuneyuki "Tommy" Nakajima and prized for the
  soft feel of its copper-underlay plating. Nick Faldo won both of his 1990 majors with
  it, and the head was later remade for other markets as the European TP-2000 and the
  North American MP-29, which omits the copper layer. Lofts run from an 18-degree 2-iron
  to a 48-degree pitching wedge with a 35-degree 7-iron; Mizuno reissued the design in
  limited runs in 2000 and 2014. Lengths below are the Japanese-market steel spec, which
  runs half an inch shorter than the equivalent US MP-29 build; 2-iron and sand wedge
  lengths were not published and are omitted.
