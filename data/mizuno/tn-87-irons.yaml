faq:
  - q: "What is the loft of a Mizuno Pro TN-87 7-iron?"
    a: "The Mizuno Pro TN-87 7-iron has a loft of 35 degrees, with a 60.5-degree lie and a 36.5-inch Japanese-spec steel length."
  - q: "Was the Mizuno TN-87 sold outside Japan?"
    a: "Not under that name. The head was sold in Europe as the limited-edition TP-2000 and in North America as the MP-29, which uses the same profile without the copper underlay beneath the chrome."
  - q: "Why is the TN-87 so sought after?"
    a: "Its combination of Grain Flow Forging and a copper underlay under the plating gives it a famously soft feel, and its association with Tommy Nakajima and Nick Faldo's 1990 major wins made it a cult classic. Mizuno reissued it in limited numbers in 2000 and 2014."
