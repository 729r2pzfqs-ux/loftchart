description: >
  The MP-55 is a Japan-market players cavity that Mizuno announced on 25
  August 2015 alongside the MP-5 and released that September, sold in Japan
  and Asia through 2019 but never brought to the US or Europe. It pairs a
  sharp, straight-neck MP profile with a strong-lofted, easy-launching
  design: a new V-shaped T-SLOT filling most of the cavity keeps the impact
  area thick for a solid forged feel, while the deepest centre of gravity and
  lowest sweet-spot height (19.5 mm at the 5-iron) of the MP range at the
  time produce a high, strong flight. Versus the MP-54 the toe was cut down
  to shorten the centre-of-gravity distance and help the head square. Lofts
  run 32 degrees at the 7-iron to a 46-degree pitching wedge — Mizuno's
  strongest MP lofts to that point. The chart below is Mizuno Japan's
  standard steel specification with the stock NS PRO 950GH shaft; Mizuno
  published face progression in millimetres rather than offset, so offset is
  omitted.
