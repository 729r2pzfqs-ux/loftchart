faq:
  - q: "What is the loft of a Mizuno MP-55 7-iron?"
    a: "The Mizuno MP-55 7-iron has a loft of 32 degrees, a lie of 61.5 degrees and a steel-shaft length of 36.75 inches — the strongest MP lofts of its era, matching Mizuno's JPX EZ Forged."
  - q: "Was the Mizuno MP-55 sold outside Japan?"
    a: "No. The MP-55 was a Japan/Asia-market model sold from September 2015 through 2019; it reached other markets only as a grey import, which is why it is little known in the US and Europe."
  - q: "What is the T-SLOT cavity in the Mizuno MP-55?"
    a: "A V-shaped slot machined into the cavity that leaves the metal directly behind the impact area thick. It lets Mizuno push weight low and deep for launch while preserving the solid Grain Flow Forged feel."
  - q: "How does the MP-55 differ from the MP-54?"
    a: "The MP-55 is two degrees stronger at the 7-iron (32 against 34), with a lower sweet spot (19.5 mm against 20.5 at the 5-iron), a deeper centre of gravity and a shorter centre-of-gravity distance from the trimmed toe."
