faq:
  - q: "What is the loft of a Mizuno JPX-923 Hot Metal Pro 7-iron?"
    a: "The Mizuno JPX-923 Hot Metal Pro 7-iron has a loft of 28.5 degrees, with a 61.5-degree lie and a 37-inch steel-shaft length — the same as the standard JPX-923 Hot Metal."
  - q: "What is the difference between the JPX-923 Hot Metal Pro and the standard Hot Metal?"
    a: "Lofts, lies and lengths are identical. The Pro is a more compact head with much less offset — 0.131 inches at the 7-iron against 0.196 — and its US stock set stopped at the pitching wedge, where the standard model ran to a lob wedge."
  - q: "What clubs came in a JPX-923 Hot Metal Pro set?"
    a: "The US stock set was 4-iron through pitching wedge, seven clubs, with a 48-degree gap wedge available to extend the set."
