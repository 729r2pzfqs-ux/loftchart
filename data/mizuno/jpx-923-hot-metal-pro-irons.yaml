description: >
  The JPX-923 Hot Metal Pro is the compact model of the 2022 Hot Metal trio, cast
  from the reformulated Nickel Chromoly 4335 that let Mizuno thin the face 8
  percent, and sold alongside the standard Hot Metal and the weaker-lofted Hot
  Metal HL. It shares the standard model's lofts, lies and lengths — a 28.5-degree
  7-iron and 42.5-degree pitching wedge — in a smaller head with far less offset,
  0.131 inches at the 7-iron against the standard model's 0.196. The US stock set
  was 4-iron through pitching wedge, with a 48-degree gap wedge available. Mizuno
  launched the JPX-923 line in September 2022 and retailers catalogue it as the
  2023 range, so year_introduced records the announcement year.
  Lofts, lies and lengths listed are the men's standard steel-shaft build.
