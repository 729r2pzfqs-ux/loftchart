faq:
  - q: "What is the loft of a Mizuno JPX-850 7-iron?"
    a: "The Mizuno JPX-850 7-iron has a loft of 32 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "What is the difference between the JPX-850 and the JPX-850 Forged?"
    a: "The JPX-850 is cast stainless steel with a deep pocket cavity and heavy offset — 0.180 inches at the 7-iron against 0.130 for the Forged. Both share a 32-degree 7-iron and a 45-degree pitching wedge."
  - q: "What clubs come in a JPX-850 set?"
    a: "The stock range is 4-iron through gap wedge, with the pitching wedge at 45 degrees and the gap wedge at 50 degrees."
