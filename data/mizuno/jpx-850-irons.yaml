description: >
  The JPX-850 was Mizuno's cast game-improvement iron for 2014 to 2016, the
  generation between the JPX-825 and the first Hot Metal, sold alongside the
  boron-steel JPX-850 Forged. It uses a deep pocket cavity in the long and mid
  irons with a thin high-strength face, heavy offset — 0.230 inches at the 4-iron
  and 0.180 at the 7-iron — and negative measured bounce in the 4- to 6-irons.
  Lofts match the JPX-825 it replaced, with a 32-degree 7-iron and a 45-degree
  pitching wedge, and the stock set is 4-iron through gap wedge.
  Lofts, lies and lengths listed are the men's standard steel-shaft specification.
