description: >
  The JPX-825 Pro is the Grain Flow Forged model of Mizuno's JPX-825 family,
  sitting above the cast JPX-825 with a more compact head. The 4- to 7-irons use
  a milled pocket cavity for a lower, deeper centre of gravity while the 8-iron
  through gap wedge move to a full cavity design. Lofts are about one degree
  weaker than the cast JPX-825 — a 33-degree 7-iron against 32 — with a shared
  45-degree pitching wedge, and the stock set runs 4-iron through gap wedge.
  Mizuno unveiled the JPX-825 family in autumn 2012, with US retail in early
  2013, so year_introduced records the announcement year.
  Lofts, lies and lengths listed are the men's standard steel-shaft specification.
