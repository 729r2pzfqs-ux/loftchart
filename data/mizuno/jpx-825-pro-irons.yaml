faq:
  - q: "What is the loft of a Mizuno JPX-825 Pro 7-iron?"
    a: "The Mizuno JPX-825 Pro 7-iron has a loft of 33 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "What is the difference between the JPX-825 Pro and the standard JPX-825?"
    a: "The Pro is Grain Flow Forged from 1025E mild carbon steel in a more compact head, with lofts about one degree weaker through the long and mid irons — 33 degrees at the 7-iron against 32 for the cast JPX-825."
  - q: "Are the Mizuno JPX-825 Pro irons forged?"
    a: "Yes. They are Grain Flow Forged from 1025E Pure Select mild carbon steel, with a milled pocket cavity in the 4- to 7-irons and a full cavity from the 8-iron down."
