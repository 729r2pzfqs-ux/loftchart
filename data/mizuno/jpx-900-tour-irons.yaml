faq:
  - q: "What is the loft of a Mizuno JPX-900 Tour 7-iron?"
    a: "The Mizuno JPX-900 Tour 7-iron has a loft of 34 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "What is the difference between the JPX-900 Tour and the JPX-900 Forged?"
    a: "Both are Grain Flow Forged, but the Tour is a smaller head with traditional lofts — 34 degrees at the 7-iron against the Forged model's 31 — and less offset, 0.114 inches at the 7-iron against 0.132."
  - q: "Did Brooks Koepka play the Mizuno JPX-900 Tour?"
    a: "Yes. Koepka, unsponsored at the time, won the 2017 US Open and the 2018 US Open and PGA Championship with JPX-900 Tour irons before moving to the JPX-919 Tour."
