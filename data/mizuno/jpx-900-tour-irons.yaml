description: >
  The JPX-900 Tour was the first Tour model in Mizuno's JPX line, a compact Grain
  Flow Forged cavity back in 1025E Pure Select mild carbon steel with a PowerFrame
  chassis stiffening the perimeter. Lofts are traditional — 34 degrees at the
  7-iron and 46 at the pitching wedge, against 31 and 45 degrees on the JPX-900
  Forged — with modest offset from 0.130 inches at the 3-iron to 0.102 at the
  pitching wedge. An unsponsored Brooks Koepka used it to win the 2017 US Open and
  the 2018 US Open and PGA Championship. The set ran 3-iron through pitching wedge.
  Lofts, lies and lengths listed are the men's standard steel-shaft build.
