faq:
  - q: "What is the loft of a Mizuno MX-100 7-iron?"
    a: "The Mizuno MX-100 7-iron has a loft of 33 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "What clubs came in the Mizuno MX-100 set?"
    a: "The stock set ran 4-iron through a 50-degree gap wedge, with a 55-degree sand wedge available; the 4- and 5-irons are hybrid-style heads with a dropped-down crown."
  - q: "Are the Mizuno MX-100 irons forged?"
    a: "No — the MX-100 is an investment-cast super-game-improvement set; Mizuno reserved forging for the MX-25/MX-200 side of the range in this era."
