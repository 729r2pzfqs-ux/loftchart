description: >
  The MX-100 was Mizuno's super-game-improvement hybrid set, launched in
  October 2008 with Y-Tune technology that stretches the sweet area toward
  the toe. The 4- and 5-irons are hybrid-style heads with a dropped-down
  crown, the 6- and 7-irons use an ultra-deep pocket cavity, and the 8-iron
  through gap wedge are deep undercut cavities, all on a super-wide sole.
  The stock set ran 4-iron through a 50-degree gap wedge with an optional
  55-degree sand wedge. The MX-1000 took over the maximum-distance flagship
  slot in 2009, and the JPX-800 family replaced the MX range from 2011.
