description: >
  The JPX One fairway woods launched in early 2026 with the JPX One drivers
  and hybrids, retiring the ST metalwood naming and folding Mizuno's woods
  back under the JPX banner. The line is a single head design in five
  fittings — a compact 3T tour 3-wood with a flatter lie alongside the
  standard 15°, 18°, 21° and 24° heads — each carrying Mizuno's Quick Switch
  adjustable hosel with ±2° of loft movement. US pricing sits at $350 per
  club with Tensei 1K and Project X Denali Blue Frost stock shaft options.
variants:
