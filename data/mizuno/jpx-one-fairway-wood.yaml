hosel:
  system: "Quick Switch"
  loft_range: "±2°"
  lie_effect: >
    Mizuno's published ranges run from the stated lie upward — the upright
    positions add up to 3° of lie.
  face_note: >
    Lowering loft opens the face and raising it closes it, as on any
    hosel-based adjuster.
  notes: >
    Mizuno publishes the Quick Switch range per head — a 15° head plays
    13-17°, an 18° head 16-20°, and so on — but does not publish a
    position-by-position chart online, so none is reproduced here. The two
    15° rows are the 3T (58.5° lie, the compact tour fitting) and the
    standard 3-wood (59.5° lie); both play the same stamped loft.
