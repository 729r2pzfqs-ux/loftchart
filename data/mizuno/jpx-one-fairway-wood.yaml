faq:
  - q: "What lofts do the Mizuno JPX One fairway woods come in?"
    a: "Five fittings: a compact 15 degree 3T, a standard 15 degree 3-wood, an 18 degree 5-wood, a 21 degree 7-wood and a 24 degree 9-wood."
  - q: "Is the Mizuno JPX One fairway wood adjustable?"
    a: "Yes — every head carries Mizuno's Quick Switch hosel with plus or minus 2 degrees of loft and upright lie settings to 3 degrees. Mizuno publishes the range per head rather than a position-by-position chart."
  - q: "What is the difference between the JPX One 3T and the standard 3-wood?"
    a: "Both are 15 degrees, but the 3T is the compact tour fitting with a lie a full degree flatter (58.5 versus 59.5 degrees) for players who want a smaller, more workable head."
  - q: "What replaced the Mizuno ST-MAX 230 fairway woods?"
    a: "These — the JPX One fairways replaced the ST-MAX 230 line in early 2026 as Mizuno moved its metalwoods under the JPX One name."
