faq:
  - q: "What is the loft of a Mizuno MP-25 7-iron?"
    a: "The Mizuno MP-25 7-iron has a loft of 34 degrees, a lie of 61.5 degrees and a steel-shaft length of 36.75 inches."
  - q: "When were Mizuno MP-25 irons made?"
    a: "The MP-25 was announced in 2015 and sold until the MP-18 family replaced the MP line in 2017."
  - q: "Are Mizuno MP-25 lofts strong?"
    a: "No — they are traditional MP lofts, 34 degrees at the 7-iron and 46 at the pitching wedge. The MP-25's extra distance comes from a thinner Boron face and a micro-slot, not from a strengthened chart."
  - q: "What is 1025 Boron?"
    a: "A carbon steel with boron added, about 30 per cent stronger than the plain 1025 Mizuno uses elsewhere. The extra strength lets the face be forged thinner without denting."
