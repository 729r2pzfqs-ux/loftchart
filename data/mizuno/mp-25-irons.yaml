description: >
  The MP-25 is Mizuno's first attempt at a forged distance iron that keeps MP
  lofts. It is Grain Flow Forged from 1025 Boron — the harder alloy that lets
  Mizuno thin the face — with a micro-slot cut behind the face to let it flex.
  Lofts stay traditional at 34 degrees for the 7-iron and 46 for the pitching
  wedge, so the gain is ball speed rather than a strengthened chart. Bounce is
  progressive, 2 degrees in the long irons to 6 at the pitching wedge. Figures
  are the men's standard steel build.
