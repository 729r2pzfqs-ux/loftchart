description: >
  The JPX One is Mizuno's 2026 driver line, launched in January 2026 and the
  first to revive the JPX name for metalwoods. Its claim to a world first is
  the NANOALLOY face, co-developed with Toray: polymer dispersed through the
  titanium at microscopic level changes the face's elasticity at impact,
  paired with a CORTECH face map up to 0.35 mm thinner than the ST-MAX
  230's and a COR area more than 15% larger. The standard JPX One is the
  larger-footprint, higher-MOI head built for straight flight; the JPX One
  Select is the compact, tour-inspired head with a shorter blade length,
  neutral-to-fade bias and roughly 1,100 rpm less spin in independent
  testing. A women's 12° build with the UST Helium NanoCore 4 is sold
  alongside.
variants:
  - name: JPX One
    head_cc: 460
    description: >
      The larger-footprint, higher-MOI head of the pair — built for
      stability and straighter flight. The 9° and 12° heads are right-hand
      only.
  - name: JPX One Select
    head_cc: 460
    description: >
      The compact, tour-inspired head: reduced topline and blade length,
      neutral-to-fade bias, a flatter 56.5° lie and a more penetrating,
      lower-spinning flight. 10.5° is right-hand only.
