faq:
  - q: "What lofts does the Mizuno JPX One come in?"
    a: "The standard JPX One comes in 9, 10.5 and 12 degrees (9 and 12 right-hand only); the JPX One Select in 9 and 10.5 (10.5 right-hand only). The Quick Switch hosel extends each head 2 degrees either way."
  - q: "What are the JPX One loft settings?"
    a: "Mizuno's Quick Switch hosel adjusts loft 2 degrees either side of stamped — a 9 degree head plays 7 to 11 degrees, a 10.5 plays 8.5 to 12.5 — and lie from standard up to 3 degrees upright. Mizuno does not publish a position-by-position chart, only these ranges."
  - q: "What is the NANOALLOY face on the JPX One?"
    a: "A world-first face material co-developed with Toray: polymer dispersed through the titanium at a microscopic level changes how the face flexes at impact. Combined with a thinner CORTECH face map, Mizuno claims a COR area more than 15% larger than the ST-MAX 230's."
  - q: "What is the difference between the JPX One and JPX One Select?"
    a: "The standard head is larger-profiled and higher-MOI for straight flight at a 59 degree lie; the Select is compact and tour-inspired with a flatter 56.5 degree lie, neutral-to-fade bias and roughly 1,100 rpm less spin in independent testing."
