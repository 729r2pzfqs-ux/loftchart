hosel:
  system: "Quick Switch"
  loft_range: "±2°"
  lie_effect: >
    Mizuno's published ranges run from the stated lie to 3° upright (JPX One
    59-62°, Select 56.5-59.5°).
  face_note: >
    Lowering loft opens the face and raising it closes it, as on any
    hosel-based adjuster.
  notes: >
    Mizuno publishes the Quick Switch range per head — a 9° head plays
    7-11°, a 10.5° head 8.5-12.5°, a 12° head 10-14° — but does not publish
    a position-by-position chart online, so none is reproduced here. The
    anchors Mizuno does state: the standard setting plays the stamped loft
    at the stated lie, the extremes sit 2° either side, and the upright
    positions add up to 3° of lie.
