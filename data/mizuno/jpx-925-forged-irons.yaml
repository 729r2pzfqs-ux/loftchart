faq:
  - q: "What is the loft of a Mizuno JPX 925 Forged 7-iron?"
    a: "The Mizuno JPX 925 Forged 7-iron has a loft of 30 degrees, a lie of 62.0 degrees and a length of 37.25 inches."
  - q: "What is the difference between JPX 925 Forged and JPX 925 Hot Metal?"
    a: "The Forged is two to three degrees weaker through the set, carries roughly a third less offset in the long irons, and is a forging rather than a cast Chromoly head."
  - q: "When were Mizuno JPX 925 Forged irons released?"
    a: "They reached the USGA conforming list on 19 August 2024 and launched later that year, sold as part of the 2025 range."
