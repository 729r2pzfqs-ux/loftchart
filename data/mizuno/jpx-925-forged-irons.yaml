description: >
  JPX 925 Forged is the players-distance model in the JPX 925 family, sitting between
  the cast Hot Metal and Mizuno's Pro line. Lofts run five degrees weaker than the Hot
  Metal at the 7-iron — 30 against 28 — with a much tighter offset progression,
  0.150 inches at the 4-iron against the Hot Metal's 0.224, and the bounce climbs a
  degree per club through the set.
