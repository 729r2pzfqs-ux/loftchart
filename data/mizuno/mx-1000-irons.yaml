description: >
  The MX-1000 was the hot-face, maximum-distance flagship of Mizuno's MX
  range, launched in 2009 alongside the compact MX-300. Its hollow heads
  plasma-weld a thin ES230 maraging steel face to a stainless body for high
  COR, with Mizuno's Y-Tune weighting spreading the sweet area toward the
  toe, a 23.5 mm wide sole and strong lofts — 32 degrees at the 7-iron and a
  44-degree pitching wedge. The catalogued set runs 4-iron through sand
  wedge, and the whole MX range gave way to the JPX-800 family from 2011.
