faq:
  - q: "What is the loft of a Mizuno MX-1000 7-iron?"
    a: "The Mizuno MX-1000 7-iron has a loft of 32 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length — strong lofts for 2009, two degrees ahead of the MX-19."
  - q: "Are the Mizuno MX-1000 irons forged?"
    a: "No. The MX-1000 is a hollow-body iron that plasma-welds a thin ES230 maraging steel face to a stainless steel body for a hot, high-COR face — unusual for Mizuno, which is best known for forgings."
  - q: "What clubs came in the Mizuno MX-1000 set?"
    a: "The catalogued set ran 4-iron through sand wedge, with a 44-degree pitching wedge, 49-degree gap wedge and 55-degree sand wedge."
