faq:
  - q: "What is the loft of a Mizuno JPX EZ 7-iron?"
    a: "The 2013 Mizuno JPX EZ 7-iron has a loft of 32 degrees, a lie of 61.5 degrees and a steel-shaft length of 36.75 inches."
  - q: "What is the difference between the Mizuno JPX EZ and JPX EZ Forged?"
    a: "They share the same loft chart, but the EZ is a larger cast head with a wider sole, deeper pocket cavity and much more offset (0.26 inches at the 7-iron against 0.189), while the EZ Forged is Grain Flow Forged from carbon steel for feel."
  - q: "Why do the Mizuno JPX EZ long irons have negative bounce?"
    a: "Mizuno listed the 4- and 5-irons at -1 and -0.5 degrees of bounce; with such a wide sole, the negative bounce keeps the leading edge from sitting up at address."
  - q: "When was the Mizuno JPX EZ made?"
    a: "The original JPX EZ launched in the autumn of 2013 and was replaced when Mizuno announced the restyled 2016-model JPX EZ in August 2015."
