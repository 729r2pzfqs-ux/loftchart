description: >
  The JPX EZ is the cast game-improvement model of the two-iron JPX EZ family
  Mizuno launched in the autumn of 2013 below the JPX-825 range. It is a
  super-oversized head with a very wide sole that carries most of the
  weighting for an easy, high launch: the 4- through 7-irons use Mizuno's
  deepest Max Pocket Cavity, while the 8-iron through gap wedge switch to a
  shallower Deep Pocket Cavity for control, all framed with Harmonic Impact
  Technology for feel. Lofts are distance-spec for the period — a 32-degree
  7-iron and 45-degree pitching wedge — and the stock set ran 4-iron through
  gap wedge at $700 in steel. The sole is narrower at the heel and much wider
  toward the toe. Mizuno announced the restyled 2016-model JPX EZ in August
  2015, which closes this record. All figures are the men's standard
  steel-shaft specification.
