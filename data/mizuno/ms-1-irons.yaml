description: >
  The MS-1 opened Mizuno's MS ("Mizuno Staff") line in 1980 and became its
  longest-running blade, staying in the range for over a decade through many
  stamping iterations. It is a scotch-blade design with a square toe, a reverse
  muscle, and essentially zero bounce and zero offset — as traditional as forged
  irons come, aimed squarely at purists. Lofts run 21 degrees at the 3-iron to a
  48-degree pitching wedge, the same ladder Mizuno kept for the MS-11 at the
  decade's end. Factory lengths were never published in surviving sources, so
  they are omitted. This model is sometimes dated to the early 1980s generally;
  vintage-Mizuno references place the launch at 1980.
