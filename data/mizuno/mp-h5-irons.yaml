description: >
  The MP-H5 refined Mizuno's hollow-body MP iron for the 2015 line, launched in autumn
  2014 alongside the MP-15. The hollow construction runs through the whole 1-PW range
  with a progressively thinner profile toward the short irons, keeping the high-launch
  long irons while sharpening the look and turf feel of the scoring clubs. Lofts stay
  traditional, with a 34-degree 7-iron and 46-degree pitching wedge, and offset is
  modest throughout. No direct MP-H successor followed; the hollow role passed to the
  MP-18 family's MMC Fli-Hi in 2017. Specs below are the standard steel build.
