faq:
  - q: "What is the loft of a Mizuno MP-H5 7-iron?"
    a: "The Mizuno MP-H5 7-iron has a loft of 34 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "What is the difference between the MP-H4 and MP-H5?"
    a: "Both are hollow-bodied with Grain Flow Forged faces. The MP-H5 extends the range to a 16-degree 1-iron, thins the profile progressively toward the short irons for a cleaner look and better turf interaction, and trims offset slightly in the scoring clubs."
  - q: "Did Mizuno make an MP-H6?"
    a: "No. The MP-H5 was the last MP-H model; when the MP-18 family arrived in 2017, the hollow long-iron role passed to the MP-18 MMC Fli-Hi."
