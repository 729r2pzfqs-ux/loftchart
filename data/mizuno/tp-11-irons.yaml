faq:
  - q: "What is the loft of a Mizuno TP-11 7-iron?"
    a: "The Mizuno TP-11 7-iron has a loft of 37 degrees and a lie of 60.5 degrees per Mizuno's own irons timeline."
  - q: "Did Sandy Lyle win the Masters with Mizuno TP irons?"
    a: "Yes — Lyle won the 1988 Masters playing Mizuno's TP irons, sealing it with his famous 7-iron from the 18th fairway bunker, and the TP-11 traded on that association throughout its 1988-1994 run."
  - q: "Is the Mizuno TP-11 a blade?"
    a: "No — it is a forged shallow cavity back, the easier-to-hit companion to the TP-9 blade, though by modern standards its compact head and flat lies still suit better players."
