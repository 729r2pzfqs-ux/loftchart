description: >
  The TP-11 was the long-running easier-to-hit model in Mizuno's European TP range,
  a forged shallow cavity sold from 1988 to 1994 alongside the more demanding TP-9
  blade. Its reputation was made in April 1988 when Sandy Lyle won the Masters
  playing Mizuno's TP irons, famously escaping the 18th-hole fairway bunker with a
  7-iron to set up his winning birdie. Mizuno's own retrospective timeline records
  a mildly irregular loft ladder — a 37-degree 7-iron and 49-degree pitching wedge —
  with lies flat by modern standards. Vintage-Mizuno historians link it to Mizuno's
  US MS-9/MP-9 generation, though period owners also equate it with the Japanese
  Mizuno Pro MS-11 stamping; the equivalence is disputed, so it is recorded here
  simply as the European model. Mizuno published no length table, so lengths are
  omitted.
