description: >
  The JPX One hybrids launched in early 2026 with the JPX One drivers and
  fairways, replacing the ST-MAX 230 hybrids as Mizuno folded its metalwoods
  back under the JPX name. The single head is a compact, iron-replacement
  shape with a constant 1.8 mm face thickness, in four lofts from a 19°
  3-hybrid to a 28° 6-hybrid, each carrying the Quick Switch adjustable
  hosel with ±2° of loft movement. US pricing sits at $280 per club.
variants:
  - name: JPX One
    description: >
      The single compact hybrid head in four lofts, built as an iron
      replacement with more upright, iron-like lies and the Quick Switch
      hosel on every head. The 19° and 28° heads are right-hand only.
