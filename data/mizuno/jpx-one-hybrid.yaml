faq:
  - q: "What lofts does the Mizuno JPX One hybrid come in?"
    a: "Four lofts: 19, 22, 25 and 28 degrees — the 3-hybrid through 6-hybrid. The 22 and 25 degree heads come in both hands."
  - q: "Is the Mizuno JPX One hybrid adjustable?"
    a: "Yes — every loft carries Mizuno's Quick Switch hosel with plus or minus 2 degrees of loft and upright lie settings to 3 degrees. Mizuno publishes the range per head rather than a position-by-position chart."
  - q: "What replaced the Mizuno ST-MAX 230 hybrid?"
    a: "This one — the JPX One hybrid replaced the ST-MAX 230 hybrid in early 2026, moving to a more compact, iron-replacement shape with iron-like lies."
