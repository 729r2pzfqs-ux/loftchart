hosel:
  system: "Quick Switch"
  loft_range: "±2°"
  lie_effect: >
    Mizuno's published ranges run from the stated lie upward — the upright
    positions add up to 3° of lie.
  face_note: >
    Lowering loft opens the face and raising it closes it, as on any
    hosel-based adjuster.
  notes: >
    Mizuno publishes the Quick Switch range per head — the 19° head plays
    17-21°, the 28° head 26-30° — but does not publish a
    position-by-position chart online, so none is reproduced here.
