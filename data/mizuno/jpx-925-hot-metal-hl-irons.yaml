faq:
  - q: "What is the loft of a Mizuno JPX-925 Hot Metal HL 7-iron?"
    a: "The Mizuno JPX-925 Hot Metal HL 7-iron has a loft of 31 degrees, with a 62-degree lie and a 37.25-inch steel-shaft length."
  - q: "How does the JPX-925 Hot Metal HL differ from the standard Hot Metal?"
    a: "Lofts are three degrees weaker throughout — a 31-degree 7-iron against 28 — with more offset (0.260 against 0.224 inches at the 4-iron), which raises launch for moderate swing speeds."
  - q: "What clubs are in the JPX-925 Hot Metal HL set?"
    a: "It is catalogued 4-iron through sand wedge: a 45-degree pitching wedge, 50-degree gap wedge and 55-degree sand wedge, available in right hand only."
