description: >
  The JPX-925 Hot Metal HL is the high-launch model of the 2024 JPX family,
  built on the same Nickel Chromoly chassis and Contour Ellipse face as the
  standard JPX-925 Hot Metal but with lofts three degrees weaker — a 31-degree
  7-iron against 28 — and the most offset in the range at 0.260 inches on the
  4-iron. Unlike the previous HL generation it is catalogued from a 4-iron,
  running through a 55-degree sand wedge, in right hand only. Lofts, lies and
  lengths listed are the men's standard steel-shaft build.
length_note: >
  These lengths use the USGA / R&A measuring method, which Mizuno adopted for
  its published spec tables with this generation. They read about a quarter
  inch longer than the figures Mizuno published for earlier models such as the
  JPX923 and Mizuno Pro 241, 243 and 245, but Mizuno states that actual club
  length is unchanged. Subtract 0.25 inches to compare with an older Mizuno
  chart.
