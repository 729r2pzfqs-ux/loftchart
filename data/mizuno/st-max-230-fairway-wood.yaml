brand: Mizuno
brand_slug: mizuno
model: ST-MAX 230
slug: st-max-230-fairway-wood
club_type: fairway_wood
year_introduced: 2024
year_discontinued: null
category: flagship
construction: steel body with carbon crown and Mizuno's CORTECH Chamber behind the face
material: MAS1C high-strength steel face
predecessor: Mizuno ST-Z 230
successor: Mizuno JPX One
description: >
  The ST-MAX 230 fairway woods launched in early 2024 with the ST-MAX 230
  driver — a single high-stability head in three lofts, with Mizuno's
  CORTECH Chamber (an internal stainless-weighted elastomer slot) feeding
  face flex for ball speed. Every loft carries the Quick Switch adjustable
  hosel with a 4° total range. The JPX One woods replaced the line in 2026.
variants:
  - name: ST-MAX 230
    description: >
      The single fairway head in three lofts — 182 cc (3-wood), 172 cc
      (5-wood) and 162 cc (7-wood, right-hand only) — tuned for high MOI and
      a straight, high flight.
specs:
  - variant: ST-MAX 230
    loft: 15.0
