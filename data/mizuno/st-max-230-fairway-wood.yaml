faq:
  - q: "What lofts does the Mizuno ST-MAX 230 fairway wood come in?"
    a: "Three lofts: 15, 18 and 21 degrees. The 21 degree 7-wood is right-hand only."
  - q: "Is the Mizuno ST-MAX 230 fairway wood adjustable?"
    a: "Yes — every loft uses Mizuno's Quick Switch hosel with a 4 degree window, so the 15 degree 3-wood plays anywhere from 13 to 17 degrees. Mizuno publishes the ranges rather than a position-by-position chart."
  - q: "What replaced the Mizuno ST-MAX 230 fairway wood?"
    a: "The Mizuno JPX One fairway woods, launched for 2026 with a re-engineered CORTECH Chamber."
