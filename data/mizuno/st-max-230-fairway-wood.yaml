  - variant: ST-MAX 230
    loft: 21.0
    length: 42.25
length_note: >
  Mizuno publishes lengths to the USGA / R&A measurement method, which reads
  about a quarter inch longer than its older charts without the builds
  changing. Lie is published only as a per-loft adjustable range (58-61° on
  the 3-wood), so no lie column is charted.
hosel:
  system: "Quick Switch"
  loft_range: "±2°"
  notes: >
    Each loft adjusts across a 4° window (the 15° 3-wood plays 13-17°), with
    lie moving within a 3° band as loft changes. Mizuno publishes the ranges
    but no position-by-position chart for the Quick Switch, so no settings
    table is reproduced here.
