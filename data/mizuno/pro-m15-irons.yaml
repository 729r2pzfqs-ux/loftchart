description: >
  The Mizuno Pro M-15 is the players-distance model of Mizuno's 2026 Pro "Modern
  Series", the successor to the Pro 245 and the more forgiving companion to the M-13.
  The 4 through 8 irons are hollow-body: a Grain Flow Forged 4135+ Chromoly face and
  neck welded to a stainless steel back, with suspended tungsten inside the head —
  51 g in the long irons and 50.3 g in the mid irons — while the 9-iron through gap
  wedge use a partial-hollow Grain Flow Forged 1025E HD body. The Contoured Ellipse
  CORTECH face runs through the 8-iron. Lofts are about a degree stronger than the
  Pro 245 in the middle of the set — 29 degrees at the 7-iron against the 245's 30 —
  with the same 43-degree pitching wedge and 48-degree gap wedge, and the set is
  right-hand only in 4-GW. Mizuno unveiled the Modern Series on 5 January 2026, with
  presale from 19 January and in-store availability on 5 February 2026.
