faq:
  - q: "What is the loft of a Mizuno Pro M-15 7-iron?"
    a: "The Mizuno Pro M-15 7-iron has a loft of 29 degrees, with a 62-degree lie and a 37.25-inch steel-shaft length."
  - q: "What is the difference between the Mizuno Pro M-15 and M-13?"
    a: "The M-15 is the players-distance model, with hollow-body 4-8 irons, tungsten weighting and lofts around three degrees stronger (29-degree 7-iron against the M-13's 32). The M-13 is the players cavity-back with traditional lofts and a three-way split forged construction."
  - q: "Are the Mizuno Pro M-15 irons available left-handed?"
    a: "No. Mizuno's specification page lists the M-15 as right hand only in 4-iron through gap wedge, while the sibling M-13 is offered in both right and left hand."
