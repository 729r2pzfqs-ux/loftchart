description: >
  The TP-9 - TP for Tour Proven - was Mizuno's left-hand-exclusive forged blade,
  introduced in 1986 through the Mizuno Tech van programme and kept in the US custom
  catalogue into 2000, giving left-handers access to a Grain Flow Forged blade while the
  MP line remained right-hand only. Lofts are classic and weak by modern standards, with
  a 37-degree 7-iron and 50-degree pitching wedge, and the set ran from a 2-iron to a
  56-degree sand wedge, sold through custom order only. Mizuno's US irons timeline
  windows the model at 1990-1997, which reflects its main catalogue years rather than
  the 1986 introduction Mizuno's own product page states.
