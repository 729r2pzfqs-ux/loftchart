faq:
  - q: "What is the loft of a Mizuno TP-9 7-iron?"
    a: "The Mizuno TP-9 7-iron has a loft of 37 degrees, with a 61-degree lie and a 36.75-inch steel-shaft length."
  - q: "Was the Mizuno TP-9 really left-handed only?"
    a: "Yes. Mizuno's own product page describes it as available exclusively for left-handed players through custom order, making it the left-hander's counterpart to the right-hand-only MP blades of the era."
  - q: "What does TP stand for on the Mizuno TP-9?"
    a: "Tour Proven. The TP series covered Mizuno's tour-derived irons and woods from 1986 into the late 1990s, and the TP-9 was its long-running left-handed blade."
