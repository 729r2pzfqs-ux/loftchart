faq:
  - q: "What lofts does the Mizuno ST-MAX 230 hybrid come in?"
    a: "Four lofts: 19, 22, 25 and 28 degrees. The 19 and 28 degree heads are right-hand only."
  - q: "Is the Mizuno ST-MAX 230 hybrid adjustable?"
    a: "Yes — every loft uses Mizuno's Quick Switch hosel with a 4 degree window, so the 19 degree head plays from 17 to 21 degrees. Mizuno publishes the ranges rather than a position-by-position chart."
  - q: "What replaced the Mizuno ST-MAX 230 hybrid?"
    a: "The Mizuno JPX One hybrids, launched for 2026."
