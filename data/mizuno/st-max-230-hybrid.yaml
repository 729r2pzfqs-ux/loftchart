brand: Mizuno
brand_slug: mizuno
model: ST-MAX 230
slug: st-max-230-hybrid
club_type: hybrid
year_introduced: 2024
year_discontinued: null
category: flagship
construction: steel body with CORTECH Chamber behind the face
material: MAS1C high-strength steel face
predecessor: Mizuno ST-Z 230
successor: Mizuno JPX One
description: >
  The ST-MAX 230 hybrids launched in early 2024 with the ST-MAX 230 woods —
  one high-MOI head in four lofts from a 19° 3-hybrid to a 28° 6-hybrid, each
  carrying Mizuno's Quick Switch adjustable hosel with a 4° window. Head
  sizes run 122 cc down to 109 cc. The JPX One hybrids replaced the line in
  2026.
variants:
  - name: ST-MAX 230
    description: >
      The single hybrid head in four lofts; the 19° 3HB and 28° 6HB are
      right-hand only, the 22° and 25° heads come in both hands.
