faq:
  - q: "What is the loft of a Mizuno JPX 919 Tour 7-iron?"
    a: "The Mizuno JPX 919 Tour 7-iron has a loft of 34 degrees, with a 61.5-degree lie and a 37-inch steel-shaft length."
  - q: "What clubs came in a stock Mizuno JPX 919 Tour set?"
    a: "The US stock set was 3-iron through pitching wedge, right hand only, with a True Temper Dynamic Gold 120 S300 steel shaft. The 21-degree 3-iron was dropped from the successor JPX 921 Tour."
  - q: "Are the Mizuno JPX 919 Tour irons forged?"
    a: "Yes. They are Grain Flow Forged HD from 1025E Pure Select mild carbon steel, a process Mizuno says increases grain density in the impact area for a softer, more consistent feel."
