description: >
  The JPX 919 Tour is the compact players model of the JPX 919 family, the
  successor to the JPX 900 Tour and the iron an unsponsored Brooks Koepka played
  to win the 2019 PGA Championship — his fourth major with Mizuno irons, the
  first three coming with the JPX 900 Tour. It was the first JPX Tour made with Mizuno's Grain Flow Forged HD process,
  which increases grain density in the impact area of the 1025E Pure Select mild
  carbon steel head. Lofts are traditional — 34 degrees at the 7-iron, 46 at the
  pitching wedge — and the US stock set ran 3-iron through pitching wedge, right
  hand only, with a Dynamic Gold 120 S300 stock shaft at 1,200 dollars. Mizuno
  announced the JPX 919 line in late August 2018 with retail that September, and
  the JPX 921 generation announced in August 2020 replaced it — dropping the
  3-iron, which the 921 Tour no longer offered.
