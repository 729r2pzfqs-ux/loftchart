faq:
  - q: "What is the loft of a Mizuno MX-17 7-iron?"
    a: "The Mizuno MX-17 7-iron has a loft of 34 degrees, a lie of 61.5 degrees and a length of 36.75 inches."
  - q: "When were Mizuno MX-17 irons made?"
    a: "The MX-17 dates from 2006, in the middle of Mizuno's MX game-improvement run."
  - q: "How much offset does a Mizuno MX-17 have?"
    a: "A lot for a Mizuno — 0.232 inches at the 3-iron, tapering to 0.134 at the pitching wedge. The contemporary MP blades carried roughly half that."
  - q: "Why is the bounce on a Mizuno MX-17 so low?"
    a: "The published chart runs from 0 degrees at the 3-iron to 3.5 at the pitching wedge. The wide sole does the work of keeping the head from digging, so Mizuno kept the measured bounce angle small."
