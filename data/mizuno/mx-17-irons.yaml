description: >
  The MX-17 is the forgiving end of Mizuno's mid-2000s MX range: a cast pocket
  cavity with a wide sole and heavy offset — 0.232 inches at the 3-iron, more
  than double what the MP blades of the period carried. Bounce is unusually low
  through the long and mid irons, from 0 degrees at the 3-iron to 3.5 at the
  pitching wedge, with a 10-degree sand wedge completing the published chart.
  Lofts are conventional for the era, 34 degrees at the 7-iron.
