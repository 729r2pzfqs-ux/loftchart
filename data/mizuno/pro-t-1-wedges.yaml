description: >
  The Pro T-1 is Mizuno's 2025 tour wedge, the teardrop-blade successor to
  the T24, launched in February 2025. It is Grain Flow Forged HD in
  Hiroshima from 1025E Pure Select mild carbon steel with a copper underlay
  beneath the finish, and carries loft-specific Quad Cut+ grooves with
  Hydroflow micro grooves for wet-condition spin. The matrix runs 16
  loft/bounce/grind combinations from 46 to 60 degrees across six grinds,
  with the new M-Type replacing the old D grind. It won Today's Golfer's
  Best Wedge award in 2026 testing. Finishes are Soft White Satin, Black Ion
  and Blue Ion. Club lengths are omitted here because US and UK retailer
  charts disagree on the measuring basis.
grinds:
  - code: S
    name: S-Type Grind
    description: >
      High bounce with limited relief — heel relief and a bevelled trailing
      edge — for full shots. The full-swing grind at the strong lofts from
      46 to 54 degrees.
  - code: M
    name: M-Type Grind
    description: >
      Mid bounce with moderate heel and toe relief for gentle face
      manipulation. New for this generation, replacing the T24's D grind.
  - code: P
    name: P-Type Grind
    description: >
      Plus-bounce — enhanced relief with extra effective bounce, mimicking
      the old D grind profile with more protection from the turf.
  - code: C
    name: C-Type Grind
    description: >
      Mid-to-high bounce with generous heel, toe and trailing-edge relief,
      for a wide range of players and conditions.
  - code: V
    name: V-Type Grind
    description: >
      High bounce on a V-shaped sole with aggressive trailing-edge relief,
      for versatility on both square-face and open-face shots.
  - code: X
    name: X-Type Grind
    description: >
      The lowest bounce in the range with the most aggressive heel, toe and
      trailing-edge relief, for advanced players — offered only as the
      60-degree, 6-bounce model.
