faq:
  - q: "What lofts does the Mizuno Pro T-1 come in?"
    a: "The Pro T-1 is sold from 46 to 60 degrees in 2-degree steps — 16 loft, bounce and grind combinations."
  - q: "What grinds does the Mizuno Pro T-1 offer?"
    a: "Six: S-Type (46-54 degrees), M-Type (54-58), P-Type plus-bounce (54-56), C-Type (58-60), V-Type (56-60) and the low-bounce X-Type (60 degrees only)."
  - q: "Is the Mizuno Pro T-1 forged?"
    a: "Yes — one-piece Grain Flow Forged HD in Hiroshima, Japan, from 1025E Pure Select mild carbon steel with a copper underlay beneath the finish."
  - q: "What replaced the D grind on Mizuno wedges?"
    a: "The M-Type grind, new with the Pro T-1, covers the old D grind's role with mid bounce and moderate heel and toe relief, while the P-Type carries the plus-bounce version of that profile."
