description: >
  The MX-900 was Mizuno's 2006 forged game-improvement iron, unusual for the
  brand in using hollow "Hemi Cog" forgings in the 3- through 7-irons with
  progressive tungsten sole weighting to drive the centre of gravity low and
  deep. The 8-iron through pitching wedge are forged from a softer steel as
  conventional mid-cavity heads with minimal offset, and internal heel and
  toe weights steady the head on off-centre strikes. Lofts are traditional —
  a 34-degree 7-iron and 46-degree pitching wedge — over a 3-PW set. The
  MX-950 hybrid-iron set took over the concept in 2008.
