faq:
  - q: "What is the loft of a Mizuno MX-900 7-iron?"
    a: "The Mizuno MX-900 7-iron has a loft of 34 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "Are the Mizuno MX-900 irons forged?"
    a: "Yes — unusually for a game-improvement iron, the whole set is forged: the 3- through 7-irons as hollow bodies with tungsten sole weights, and the 8-PW from a softer steel as conventional mid-cavity heads."
  - q: "What clubs came in the Mizuno MX-900 set?"
    a: "The set ran 3-iron through pitching wedge, with a 21-degree 3-iron and a 46-degree pitching wedge; no gap or sand wedge was catalogued."
