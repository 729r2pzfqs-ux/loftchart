description: >
  The JPX-800 is the iron that established Mizuno's JPX line as a distance
  range. The 4 to 7 irons use the Max COR Hot Metal face over a pocket cavity
  with an external power bar; the 8-iron through pitching wedge move to a deep
  pocket cavity, and the gap and sand wedges to a solid power-bar design. Lofts
  are strong for the period — 32 degrees at the 7-iron and 44 at the pitching
  wedge — and offset is heavy, 0.209 inches at the 4-iron. The set starts at a
  4-iron and runs to a 55-degree sand wedge.
