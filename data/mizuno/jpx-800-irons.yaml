faq:
  - q: "What is the loft of a Mizuno JPX-800 7-iron?"
    a: "The Mizuno JPX-800 7-iron has a loft of 32 degrees, a lie of 61.5 degrees and a steel-shaft length of 36.75 inches."
  - q: "When were Mizuno JPX-800 irons made?"
    a: "The JPX-800 was introduced in 2011 and replaced by the JPX-825 in 2013."
  - q: "Does the Mizuno JPX-800 come with a 3-iron?"
    a: "No. The published set starts at a 22-degree 4-iron and runs down to a 55-degree sand wedge."
  - q: "Is the JPX-800 forged?"
    a: "No. The JPX-800 is cast, with a Hot Metal stainless face. Mizuno's forged JPX models start with the JPX-800 Pro sold alongside it."
