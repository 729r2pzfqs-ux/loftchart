description: >
  The MP-54 was unveiled at the 2013 Open Championship at Muirfield alongside the MP-4
  blade, and it is the forgiving half of that pair — a Grain Flow Forged cavity back
  with a slightly thicker sole than the MP-53 it followed. Lofts are traditional, with
  a 34-degree 7-iron, and bounce stays low throughout, from 1 degree at the 3-iron to
  5 at the pitching wedge. The stock set is 3-PW.
