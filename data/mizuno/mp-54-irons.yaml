faq:
  - q: "What is the loft of a Mizuno MP-54 7-iron?"
    a: "The Mizuno MP-54 7-iron has a loft of 34 degrees, a lie of 61.5 degrees and a length of 36.75 inches."
  - q: "When were Mizuno MP-54 irons made?"
    a: "They were unveiled at the Open Championship at Muirfield in July 2013 and started shipping on 9 September 2013."
  - q: "Is the MP-54 a blade?"
    a: "No. It is a Grain Flow Forged cavity back. Mizuno launched it alongside the MP-4, which is the blade of that pair."
