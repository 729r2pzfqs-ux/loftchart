faq:
  - q: "What is the loft of a Mizuno MP-9 7-iron?"
    a: "The Mizuno MP-9 7-iron has a loft of 35 degrees, with a 60-degree lie and a 36.5-inch steel-shaft length in the published Japanese-market specification."
  - q: "When was the Mizuno MP-9 made?"
    a: "It ran from 1988 to 1994, making it one of the longest-lived early MP models, and it shared its specification with the Japanese-market Mizuno Pro MS-9."
  - q: "What is the PS club in the Mizuno MP-9 set?"
    a: "PS is Mizuno's pitching-sand wedge, a 52-degree gap wedge that sat between the 47-degree pitching wedge and the 54-degree sand wedge."
