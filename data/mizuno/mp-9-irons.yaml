description: >
  The MP-9 was one of the first irons in Mizuno's Mizuno Pro MP line for the North
  American market, a Grain Flow Forged blade that ran from 1988 to 1994 and helped
  establish the MP name among tour players - Sandy Lyle famously played Mizuno blades of
  this family when he won the 1988 Masters. Japanese catalogues list it as sharing its
  specification with the domestic MS-9. Lofts are classic, with a 35-degree 7-iron and
  47-degree pitching wedge, and the lie angles are flat by modern standards. The 1- and
  2-iron lofts are documented but their lie and length were not published in the
  surviving table, so those fields are omitted.
