description: >
  The Mizuno Pro M-13 is the players cavity-back of Mizuno's 2026 Pro line, the
  successor to the Pro 243 and one of two "Modern Series" models launched alongside
  the more forgiving M-15. The set splits into three constructions: the 4 and 5 irons
  are pocket-cavity Grain Flow Forged with a 4120 Chromoly face and a 431 stainless
  back piece, the 6 through 8 irons are micro-slot Grain Flow Forged with a face 0.3 mm
  thinner than the prior generation, and the 9-iron through gap wedge are one-piece
  Grain Flow Forged 1025E. The Contour Ellipse face is 1.37 mm at its thinnest, which
  Mizuno says is about 35 percent thinner than the Pro 243. Lofts carry over from the
  Pro 243 unchanged — 32 degrees at the 7-iron, 44 at the pitching wedge — but the
  published lie angles sit half a degree to a degree more upright and the lengths a
  quarter inch longer than the 243 table, matching Mizuno's JPX-style build specs.
  Mizuno unveiled the Modern Series on 5 January 2026, with presale from 19 January
  and in-store availability on 5 February 2026.
