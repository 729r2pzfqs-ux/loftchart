  - q: "What is the loft of a Mizuno Pro M-13 7-iron?"
    a: "The Mizuno Pro M-13 7-iron has a loft of 32 degrees, with a 62-degree lie and a 37.25-inch steel-shaft length."
  - q: "When were the Mizuno Pro M-13 irons released?"
    a: "Mizuno announced the Pro Modern Series, including the M-13, on 5 January 2026, with presale from 19 January and in-store availability on 5 February 2026."
  - q: "Are the Mizuno Pro M-13 lofts different from the Pro 243?"
    a: "No. The lofts carry over unchanged from the Pro 243 — 22 degrees at the 4-iron, 32 at the 7-iron, 44 at the pitching wedge and 48 at the gap wedge — though the published lies are slightly more upright and lengths a quarter inch longer."
