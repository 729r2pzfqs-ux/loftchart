description: >
  The Pro T-3 is the cavity-back half of Mizuno's 2025 wedge pair, the
  successor to the S23, launched alongside the Pro T-1 in February 2025. It
  shares the T-1's Grain Flow Forged HD 1025E construction, copper underlay
  and loft-specific Quad Cut+ grooves, but adds a shallow cavity back and a
  slightly longer blade for stability and forgiveness on off-centre strikes.
  The matrix runs 11 loft/bounce/grind combinations from 46 to 60 degrees
  across three grinds. Finishes are Soft White Satin and Black Ion. Club
  lengths are omitted here because US and UK retailer charts disagree on the
  measuring basis.
grinds:
  - code: S
    name: S-Type Grind
    description: >
      High bounce with limited relief — heel relief and a bevelled trailing
      edge — for full shots. The grind at the strong lofts from 46 to 54
      degrees.
  - code: M
    name: M-Type Grind
    description: >
      Mid bounce with moderate heel and toe relief for gentle face
      manipulation, replacing the old D grind.
  - code: C
    name: C-Type Grind
    description: >
      Generous heel, toe and trailing-edge relief for a wide range of
      players and conditions — the T-3's highest-loft grind.
