faq:
  - q: "What lofts does the Mizuno Pro T-3 come in?"
    a: "The Pro T-3 is sold from 46 to 60 degrees — 11 loft, bounce and grind combinations across the S, M and C grinds."
  - q: "What is the difference between the Mizuno Pro T-1 and Pro T-3?"
    a: "Both are Grain Flow Forged HD from 1025E steel, but the T-3 adds a shallow cavity back and a slightly longer blade for forgiveness, and trims the grind matrix to three grinds against the T-1's six."
  - q: "What grinds does the Mizuno Pro T-3 offer?"
    a: "Three: S-Type at the strong lofts (46-54 degrees), M-Type mid bounce (54-58) and C-Type with generous relief (56-60)."
