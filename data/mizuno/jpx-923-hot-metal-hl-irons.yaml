description: >
  The JPX-923 Hot Metal HL is the high-launch member of the 2022 JPX family and
  the first HL model in the JPX line. It shares the Nickel Chromoly 4335 head
  of the standard Hot Metal but with lofts weakened two and a half degrees —
  a 31-degree 7-iron against 28.5 — so slower swings can flight the ball, and
  it carries the most offset in the family, 0.257 inches at the 5-iron. The
  stock set is 5-iron through sand wedge, with lighter stock shafts than the
  standard model. Lofts, lies and lengths listed are the men's standard
  steel-shaft build.
