faq:
  - q: "What is the loft of a Mizuno JPX-923 Hot Metal HL 7-iron?"
    a: "The Mizuno JPX-923 Hot Metal HL 7-iron has a loft of 31 degrees, with a 61.5-degree lie and a 37-inch steel-shaft length."
  - q: "What is the difference between the JPX-923 Hot Metal and the Hot Metal HL?"
    a: "The HL uses the same Nickel Chromoly head but with lofts 2.5 degrees weaker — a 31-degree 7-iron against 28.5 — plus slightly more offset and lighter stock shafts, all aimed at higher launch for moderate swing speeds."
  - q: "What clubs came in the JPX-923 Hot Metal HL set?"
    a: "The stock set ran 5-iron through sand wedge: a 45-degree pitching wedge, 50-degree gap wedge and 55-degree sand wedge, with no 4-iron offered."
