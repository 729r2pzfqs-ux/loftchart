faq:
  - q: "What is the loft of a Mizuno JPX 921 Tour 7-iron?"
    a: "The Mizuno JPX 921 Tour 7-iron has a loft of 34 degrees, with a 61.5-degree lie and a 37-inch steel-shaft length."
  - q: "Why does the Mizuno JPX 921 Tour set start at the 4-iron?"
    a: "Mizuno's 2019 tour audit found not a single JPX 919 Tour 3-iron in play, so the JPX 921 Tour was offered 4-iron through gap wedge, with the MP-20 HMB suggested to fill the 3-iron slot."
  - q: "Are the Mizuno JPX 921 Tour irons forged?"
    a: "Yes. They are Grain Flow Forged HD from 1025E Pure Select mild carbon steel at Mizuno's Hiroshima facility."
