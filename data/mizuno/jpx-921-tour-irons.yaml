description: >
  The JPX 921 Tour is the compact players model of the JPX 921 family, Grain Flow
  Forged HD from 1025E Pure Select mild carbon steel in Hiroshima. It keeps the
  Stability Frame with toe-bias weighting introduced in the JPX Tour line, adds a
  thicker cavity pad behind impact for feel, narrows the soles of the short irons
  and wears an anti-glare pearl brush finish. Lofts are traditional — 34 degrees at
  the 7-iron, 46 at the pitching wedge — with a tight offset progression from 0.126
  inches at the 4-iron to 0.098 at the gap wedge. The stock set is 4-GW: Mizuno's
  2019 tour audit found not a single JPX 919 3-iron in play, so the 3-iron was
  dropped, and left-handers were served 6-GW through the JPX 921 SEL programme.
  Mizuno announced the JPX 921 line on 10 August 2020 with retail from 17 September
  2020, and the successor JPX 923 family was unveiled in September 2022.
