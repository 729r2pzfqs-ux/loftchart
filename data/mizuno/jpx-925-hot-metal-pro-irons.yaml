description: >
  The JPX 925 Hot Metal Pro is the compact model of Mizuno's JPX 925 Hot Metal family,
  which Mizuno labels a "Players Speed Cavity" and aims at low to mid handicaps. It
  shares the standard Hot Metal's Nickel Chromoly 4335 construction, tungsten weighting
  low in the 4 to 7 irons and identical strong lofts, lies and lengths — 28 degrees at
  the 7-iron — but in a shorter head (80.9 mm blade length against 85.4 mm) with much
  less offset: 0.150 inches at the 4-iron against the standard model's 0.224. The set
  runs 4-iron through gap wedge in right and left hand, without the standard model's
  54-degree sand wedge. Mizuno launched the JPX 925 line in September 2024 and
  retailers catalogue it as the 2025 range, so year_introduced records the
  announcement year.
