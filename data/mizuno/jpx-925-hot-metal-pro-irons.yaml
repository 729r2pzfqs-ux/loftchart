faq:
  - q: "What is the loft of a Mizuno JPX 925 Hot Metal Pro 7-iron?"
    a: "The Mizuno JPX 925 Hot Metal Pro 7-iron has a loft of 28 degrees, a lie of 62 degrees and a length of 37.25 inches — the same as the standard JPX 925 Hot Metal."
  - q: "What is the difference between the JPX 925 Hot Metal Pro and the standard Hot Metal?"
    a: "Lofts, lies and lengths are identical. The Pro has a shorter head (80.9 mm blade length against 85.4 mm) and much less offset — 0.150 inches at the 4-iron against 0.224 — and its stock set is 4-GW without the standard model's 54-degree sand wedge."
  - q: "Who are the JPX 925 Hot Metal Pro irons for?"
    a: "Mizuno positions the Hot Metal Pro as a 'Players Speed Cavity' for low to mid handicaps who want the Hot Metal's strong-lofted distance in a more compact, lower-offset head."
