faq:
  - q: "What is the loft of a Mizuno JPX-800 Pro 7-iron?"
    a: "The Mizuno JPX-800 Pro 7-iron has a loft of 33 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "What is the difference between the JPX-800 and the JPX-800 Pro?"
    a: "The JPX-800 is a cast, strong-lofted distance iron with a 32-degree 7-iron and heavy offset, while the JPX-800 Pro is Grain Flow Forged from carbon steel with a 33-degree 7-iron, a smaller head and much less offset — 0.171 inches at the 3-iron against 0.209 at the JPX-800's 4-iron."
  - q: "Are the Mizuno JPX-800 Pro irons forged?"
    a: "Yes. They are Grain Flow Forged from 1025E Pure Select mild carbon steel, with an undercut cavity that thins the face for extra ball speed."
