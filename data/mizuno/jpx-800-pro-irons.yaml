description: >
  The JPX-800 Pro is the forged, compact partner to the cast JPX-800 in the
  first JPX generation, unveiled in autumn 2010 and a 2011 Golf Digest Hot List
  gold medalist. It is Grain Flow Forged from 1025E carbon steel with an
  undercut cavity that thins the face for speed, and a Triple Cut sole. Lofts
  sit between the MX line it replaced and the distance-first JPX-800 — 33
  degrees at the 7-iron and 45 at the pitching wedge — with a moderate offset
  ladder from 0.171 inches at the 3-iron. The catalogued range is 3-iron
  through a 50-degree gap wedge. Figures are the men's standard steel build.
