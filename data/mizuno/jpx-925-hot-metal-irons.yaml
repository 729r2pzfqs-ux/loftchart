description: >
  JPX 925 Hot Metal is Mizuno's mainstream game-improvement iron, redesigned for the
  generation with tungsten weighting through the 4 to 7 irons to raise launch where
  the loft is lowest. Lofts are strong — 28 degrees at the 7-iron, six stronger than
  the JPX 923 Tour — with a long 4-iron at 19 degrees, and offset is the widest in
  Mizuno's range at 0.224 inches at the top of the set. The set runs to a 54-degree
  sand wedge.
