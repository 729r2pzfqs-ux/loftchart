faq:
  - q: "What is the loft of a Mizuno MS-11 7-iron?"
    a: "The Mizuno MS-11 7-iron has a loft of 35 degrees, a lie of 60.5 degrees and about 6 degrees of bounce per Mizuno USA's retired-clubs table."
  - q: "Is the Mizuno MS-11 the same as the MP-11?"
    a: "Yes — the Japanese-market Mizuno Pro MS-11 was marketed as the MP-11 in the US; the heads are the same design with different stampings."
  - q: "Why do Mizuno MS-11 short irons look reverse-offset?"
    a: "The set uses constant offset of roughly 4mm on every club rather than the modern progressive taper, so the short irons carry more offset than eyes trained on progressive sets expect — it reads as reverse offset but is simply constant."
  - q: "Do Mizuno MS-11 irons have bounce?"
    a: "Unusually for a blade, yes — 4 to 6 degrees through the set (even the 2-iron has 4 degrees), one reason owners praise how the soles work from the turf."
