sources:
  - "Mizuno USA's retired-clubs specification table for the MS/P-11, as reposted in full on GolfWRX ('Mizuno Pro MS-11' thread, 2014) — supplied every loft, lie, length, bounce and offset above, with the poster's note that lengths were measured raw to the end of the grip cap and that lofts match the MP-29. Mizuno USA's original retired-clubs database page (mizunousa.com/equipment.nsf/retclubs, listing 'MP/S-11') is archived but its spec tables are not, so this transcription is the surviving copy"
  - "MizunoDBG vintage-Mizuno blog (mizunotp.tech.blog, 'Mizuno MS iron sets') — 1989 release closing the MS line, classic muscle-back description, MP-11 US marketing name, and its status as one of Mizuno's most popular models ever; owners in the GolfWRX thread corroborate the constant ~4mm offset and DG S200 factory shafts of Japanese sets"
  - "The FW club is Mizuno's 52-degree wedge between PW and SW, labeled FW in the factory table. year_discontinued 1993 reflects the first MP-series blades (MP-14/MP-29) that replaced the MS line; confidence is medium because the factory table survives only as a forum transcription"
