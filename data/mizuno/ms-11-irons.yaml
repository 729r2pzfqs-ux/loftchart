description: >
  The MS-11 closed out Mizuno's MS line as one of the most loved blades the company
  ever made — a legend in Japan (as the Mizuno Pro MS-11) that was marketed as the
  MP-11 in the US. Apart from a distinctive top-line it is a classic muscle back,
  with two quirks: constant rather than progressive offset (roughly 4mm on every
  club, which reads as reverse offset in the short irons to modern eyes) and
  unusually generous bounce for a blade. Lofts are identical to the later MP-29.
  Mizuno's factory table measured lengths to the end of the grip cap, so the
  figures below read about a quarter-inch longer than conventional
  sole-to-grip-edge specs. It is recorded here as a blade per every surviving
  source, though it is sometimes loosely grouped with easier late-80s Mizunos.
