faq:
  - q: "What is the loft of a Mizuno MX-25 7-iron?"
    a: "The Mizuno MX-25 7-iron has a loft of 34 degrees, a lie of 61.5 degrees and a steel-shaft length of 36.75 inches."
  - q: "When were Mizuno MX-25 irons made?"
    a: "Mizuno's own irons timeline places the MX-25 in 2007-2008. Retail listings sometimes date it to 2006."
  - q: "Are Mizuno MX-25 irons forged?"
    a: "Yes. The MX-25 is Grain Flow Forged from 1025E mild carbon steel, unlike the cast MX-17 and MX-23 sold beside it."
  - q: "How much offset does a Mizuno MX-25 have?"
    a: "0.130 inches at the 3-iron down to 0.102 at the pitching wedge — noticeably less than the cast MX-23, which runs 0.240 at the 3-iron."
