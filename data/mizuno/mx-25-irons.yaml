description: >
  The MX-25 is the forged member of Mizuno's MX family, and the one that sat closest to
  the MP line: a Grain Flow Forged 1025E head with a slot milled into the sole to drop
  the centre of gravity, a small cavity in the long irons and an almost muscle-back
  profile from the 8-iron down. Offset is far tighter than the cast MX-23 of the same
  period — 0.114 inches at the 7-iron against 0.161 — and the lofts are a degree weaker
  through the middle of the set. The published set runs 3-iron through pitching wedge.
