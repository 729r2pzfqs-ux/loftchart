faq:
  - q: "What is the loft of a Mizuno JPX-921 Hot Metal Pro 7-iron?"
    a: "The Mizuno JPX-921 Hot Metal Pro 7-iron has a loft of 29 degrees, with a 61.5-degree lie and a 37-inch steel-shaft length — the same as the standard JPX-921 Hot Metal."
  - q: "What is the difference between the JPX-921 Hot Metal Pro and the standard Hot Metal?"
    a: "Lofts, lies and lengths are identical. The Pro has a thinner topline, narrower sole and much less offset — 0.126 inches at the 7-iron against 0.189 — and its stock set is 4-GW, without the standard model's sand and lob wedges."
  - q: "What clubs came in a JPX-921 Hot Metal Pro set?"
    a: "The stock range was 4-iron through gap wedge, finishing with a 44-degree pitching wedge and 49-degree gap wedge."
