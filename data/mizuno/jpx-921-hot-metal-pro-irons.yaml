description: >
  The JPX-921 Hot Metal Pro is the compact model of the 2020 Hot Metal pair, cast
  from the same Nickel Chromoly 4335 as the standard JPX-921 Hot Metal with the
  same seamless cup face and identical lofts, lies and lengths — a 29-degree
  7-iron and 44-degree pitching wedge. The difference is the package: a thinner
  topline, narrower sole and much less offset, 0.126 inches at the 7-iron against
  the standard model's 0.189. The stock set ran 4-iron through gap wedge, without
  the standard model's sand and lob wedges. Mizuno announced the JPX-921 line in
  August 2020. Lofts, lies and lengths listed are the men's standard steel-shaft build.
