faq:
  - q: "What is the loft of a Mizuno Pro S-3 7-iron?"
    a: "The Mizuno Pro S-3 7-iron has a loft of 34 degrees, with a 62-degree lie and a 37.25-inch steel-shaft length measured by the USGA / R&A method."
  - q: "Did the Mizuno Pro S-3 replace the JPX923 Tour?"
    a: "In function, yes. Mizuno ended the JPX Tour line when it launched the Pro S-3 in January 2025, and the lofts are the same: 24 degrees at the 4-iron, 34 at the 7-iron and 46 at the pitching wedge."
  - q: "What is the difference between the Mizuno Pro S-1 and S-3?"
    a: "The S-1 is the muscle back of the Signature series; the S-3 sits between the muscle back and the cavity-back models of the Pro line. Lofts, lies and lengths are identical club for club; the S-3 carries more offset, 0.114 inches at the 7-iron against 0.087, and is published with a 21-degree 3-iron, which the S-1 is not."
  - q: "When were the Mizuno Pro S-3 irons released?"
    a: "Mizuno announced the Pro S-3 in January 2025, with pre-orders from 24 January and retail from 6 February 2025."
