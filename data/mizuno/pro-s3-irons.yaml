description: >
  The Mizuno Pro S-3 is a compact one-piece forged players iron announced in
  January 2025, with pre-orders from 24 January and retail from 6 February
  2025. It was the first model of the Mizuno Pro Signature series and took over
  the role of the JPX923 Tour, the JPX Tour line ending with it, so it is a
  functional rather than a named replacement. The head is Grain Flow Forged HD
  from 1025E Pure Select mild carbon steel in Hiroshima with a copper underlay,
  a thin topline and Mizuno's Triple Cut Sole. Lofts are traditional and match
  the JPX923 Tour, 34 degrees at the 7-iron and 46 at the pitching wedge, and
  the set is published 3-PW in both hands. Figures are the men's standard
  steel-shaft build; Mizuno does not publish bounce or swing weight for it.
length_note: >
  These lengths use the USGA / R&A measuring method, which Mizuno adopted for
  its published spec tables with this generation. They read about a quarter
  inch longer than the figures Mizuno published for earlier models such as the
  JPX923 and Mizuno Pro 241, 243 and 245, but Mizuno states that actual club
  length is unchanged. Subtract 0.25 inches to compare with an older Mizuno
  chart.
