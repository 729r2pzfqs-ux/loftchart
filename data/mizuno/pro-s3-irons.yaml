sources:
  - "Length basis: Mizuno's own specification page for the Mizuno Pro 243 (https://mizunogolf.com/us/golf-clubs/mp-series/mizuno-pro-243/club-specification/, retrieved 29 September 2026) states that Mizuno is changing its official iron measurement method to match the USGA / R&A standard and that its published lengths are consequently about 1/4 inch longer while actual club length is unchanged. The Pro S-3 page itself carries no such footnote; its lengths (7-iron 37.25 inches) are on the new basis."
  - "Mizuno official Pro S-3 club-specification page (https://mizunogolf.com/us/golf-clubs/mp-series/mizuno-pro-s3/club-specification/, retrieved 29 September 2026) — loft, lie, offset (published in inches) and length for the 3-iron through pitching wedge, and the dexterity note 'RH & LH: 3-PW'. The page does not publish bounce or swing weight, so those keys are omitted."
  - "Mizuno official Pro S-3 product page (https://mizunogolf.com/us/golf-clubs/mp-series/mizuno-pro-s3/) — the same table and the construction copy: Grain Flow Forged HD at Mizuno's Hiroshima plant, 1025E Pure Select mild carbon steel, copper underlay, Triple Cut Sole with a bevelled leading edge, thin topline and sole, compact head length."
  - "golf.com 'Mizuno Pro S-3 irons: 3 things to know', published 7 January 2025 (https://golf.com/gear/irons/mizuno-pro-s3-irons-3-things-know/) — the announcement date used for year_introduced, pre-orders from 24 January and retail from 6 February 2025, 200 dollars per club, the S-3 as the replacement for the JPX Tour line, its position between the Pro 241 muscle back and the Pro 243 cavity back, and its place at the start of the Mizuno Pro Signature family. Announcement and retail both fall in 2025."
  - "Note: stock_shafts is omitted. Mizuno's pages list custom shaft options without naming the stock build, and the secondary sources consulted did not agree on it."
  - "Status check, 29 September 2026: confirmed as a current model with no replacement announced. Listed on Mizuno's irons page (https://mizunogolf.com/us/irons/)."
