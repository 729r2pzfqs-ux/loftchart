description: >
  The T24 is the 2023 generation of Mizuno's T-Series tour wedge, Grain Flow
  Forged HD in Hiroshima and replaced by the Mizuno Pro T-1 in 2025. It
  tightened the groove pattern with QuadCut+ milling (15 grooves on the
  46-54 heads for full shots, 17 on the 56-60 for partials), kept the
  laser-etched HydroFlow micro grooves for wet spin, and added a fifth sole
  — the tour-inspired V with high bounce near the leading edge and extreme
  trailing-edge relief. The 17-combination matrix runs 46 to 60 degrees,
  with head shapes that flow from a straight-edged profile at the strong
  lofts to a rounder teardrop at 58 and up. Finishes were Soft White Satin,
  Denim Copper and Raw, with a copper underlay beneath the chrome for feel;
  a Blue Ion limited run followed. Lie and length are omitted because
  Mizuno's published US and UK charts disagree.
grinds:
  - code: S
    name: S-Type
    description: >
      High bounce with limited relief for full shots — the only sole at the
      46-52 gap lofts and the steep-swinger's pick at 54 and 56.
  - code: D
    name: D-Type
    description: >
      Mid bounce with moderate relief for gentle manipulation of the face —
      the middle-of-the-road option at 54 to 58 degrees.
  - code: C
    name: C-Type
    description: >
      Mid-to-high bounce with generous heel and toe relief for a wide range
      of players and conditions, at 56 to 60 degrees.
  - code: V
    name: V-Type
    description: >
      New for the T24 — high bounce concentrated near the leading edge with
      aggressive trailing-edge relief, versatile square or open, at 56 to
      60 degrees.
  - code: X
    name: X-Type
    description: >
      The lowest bounce in the line with extreme heel, toe and trailing-edge
      relief — for advanced players and firm conditions, at 58 and 60
      degrees.
