faq:
  - q: "What lofts does the Mizuno T24 come in?"
    a: "46 to 60 degrees in 2-degree steps — 17 loft, bounce and grind combinations. The 46-52 gap lofts come only in the S-Type sole."
  - q: "What grinds does the Mizuno T24 offer?"
    a: "Five sole types: S (46-56, high bounce, limited relief), D (54-58, mid bounce), C (56-60, generous relief), the new V (56-60, leading-edge bounce with aggressive trailing-edge relief) and X (58-60, the low-bounce option)."
  - q: "Is the Mizuno T24 forged?"
    a: "Yes — one-piece Grain Flow Forged HD from 1025E Pure Select mild carbon steel with boron, at Mizuno's Hiroshima plant."
  - q: "What replaced the Mizuno T24?"
    a: "The Mizuno Pro T-1 took over the tour-wedge slot in 2025, alongside the wider-soled Mizuno Pro T-3."
