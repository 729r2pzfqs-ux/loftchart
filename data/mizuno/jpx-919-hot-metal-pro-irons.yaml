description: >
  The JPX-919 Hot Metal Pro was the first Hot Metal Pro model, added to the JPX-919
  family in early 2019, several months after the Tour, Forged and standard Hot Metal
  launched in September 2018. It packs the standard Hot Metal's cast Chromoly 4140M
  head and identical lofts, lies and lengths — a 30-degree 7-iron and 45-degree
  pitching wedge — into a smaller profile with a slimmer topline, narrower sole and
  offset reduced to roughly the JPX-919 Tour's numbers, 0.112 inches at the 7-iron
  against the standard model's 0.179. The US stock set ran 4-iron through gap wedge.
  Lofts, lies and lengths listed are the men's standard steel-shaft build.
