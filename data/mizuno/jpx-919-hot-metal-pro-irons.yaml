faq:
  - q: "What is the loft of a Mizuno JPX-919 Hot Metal Pro 7-iron?"
    a: "The Mizuno JPX-919 Hot Metal Pro 7-iron has a loft of 30 degrees, with a 61.5-degree lie and a 37-inch steel-shaft length — the same as the standard JPX-919 Hot Metal."
  - q: "What is the difference between the JPX-919 Hot Metal Pro and the standard Hot Metal?"
    a: "Lofts, lies and lengths are identical. The Pro has a slimmer topline, a narrower sole and much less offset — 0.112 inches at the 7-iron against 0.179 — putting it close to the JPX-919 Tour's offset numbers."
  - q: "When did the JPX-919 Hot Metal Pro come out?"
    a: "It was added to the JPX-919 family in early 2019, reaching retail in February 2019, several months after the Tour, Forged and standard Hot Metal models launched in September 2018."
