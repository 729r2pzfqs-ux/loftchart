faq:
  - q: "What is the loft of a Mizuno JPX EZ Forged 7-iron?"
    a: "The 2013 Mizuno JPX EZ Forged 7-iron has a loft of 32 degrees, a lie of 61.5 degrees and a steel-shaft length of 36.75 inches."
  - q: "Is the Mizuno JPX EZ Forged really forged?"
    a: "Yes — it is Grain Flow Forged from a single billet of 1025E Pure Select mild carbon steel, the same process as Mizuno's MP irons, with a pocket-cavity design for distance and forgiveness."
  - q: "How does the JPX EZ Forged differ from the JPX-825 Pro?"
    a: "The EZ Forged is one degree stronger at the 7-iron (32 against 33), carries more offset and a larger head with a deeper undercut, trading some of the 825 Pro's compactness for distance and forgiveness."
  - q: "Did the 2016 JPX EZ Forged change the lofts?"
    a: "No. The 2016 model switched to stronger 1025 Boron steel for a thinner face but kept the 2013 loft, lie, length and offset chart unchanged."
