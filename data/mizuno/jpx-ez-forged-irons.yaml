description: >
  The JPX EZ Forged is the Grain Flow Forged model of the JPX EZ family
  Mizuno launched in the autumn of 2013, built to bridge the gap between
  game-improvement distance and forged feel. It is forged from a single
  billet of 1025E Pure Select mild carbon steel in a dark black-nickel
  finish, with Mizuno's Max Undercut pocket in the 4- through 7-irons
  enlarging the sweet spot and a full cavity through the scoring clubs. The
  loft chart matches the cast JPX EZ — a strong 32-degree 7-iron and
  45-degree pitching wedge — but with roughly half the offset and a more
  compact head, which is why it sits in the players-distance category. The
  stock set ran 4-iron through gap wedge. Mizuno announced the boron-steel
  2016-model JPX EZ Forged in August 2015 with this same chart, which closes
  this record. All figures are the men's standard steel-shaft specification.
