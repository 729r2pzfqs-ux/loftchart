description: >
  The MX-19 took over the cast, forgiving end of Mizuno's MX range from the
  MX-17 in 2008, running alongside the forged MX-25. It is an investment-cast
  pocket cavity with heavy offset — 0.230 inches at the 4-iron — and very low
  bounce at the top of the set, including a slightly negative 4-iron. Lofts
  are conventional for the late 2000s, 34 degrees at the 7-iron and 46 at the
  pitching wedge, and the catalogued set runs 4-iron through a 55-degree sand
  wedge. Figures are the men's standard steel build.
