faq:
  - q: "What is the loft of a Mizuno MX-19 7-iron?"
    a: "The Mizuno MX-19 7-iron has a loft of 34 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "Are the Mizuno MX-19 irons forged or cast?"
    a: "The MX-19 is investment cast from stainless steel; within the same MX generation, the forged alternative was the MX-25."
  - q: "What clubs came in the Mizuno MX-19 set?"
    a: "The catalogued set ran 4-iron through sand wedge, with a 46-degree pitching wedge, 50-degree gap wedge and 55-degree sand wedge."
