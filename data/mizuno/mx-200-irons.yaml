description: >
  The MX-200 is the last forged game-improvement iron of Mizuno's MX era,
  launched in 2009 and effectively replaced when the JPX-800 family arrived a
  year later. It is Grain Flow Forged in one piece with a deep milled pocket
  cavity and a Y-shaped reinforcement pad — Mizuno's Y-Tune design — that
  pushes the sweet area toward the toe. Lofts are moderate for the category,
  33 degrees at the 7-iron and 45 at the pitching wedge, with a full offset
  ladder from 0.211 inches at the 3-iron. The typical retail set was 4-iron
  through gap wedge, with the 3-iron and a 55-degree sand wedge catalogued.
  Figures are the men's standard steel build.
