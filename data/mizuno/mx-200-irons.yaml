faq:
  - q: "What is the loft of a Mizuno MX-200 7-iron?"
    a: "The Mizuno MX-200 7-iron has a loft of 33 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "Are the Mizuno MX-200 irons forged?"
    a: "Yes. They are Grain Flow Forged in one piece from 1025E Pure Select mild carbon steel, with a milled pocket cavity behind the face."
  - q: "What replaced the Mizuno MX-200?"
    a: "Mizuno retired the MX line after the MX-200 and MX-300; the cast JPX-800 and forged JPX-800 Pro, launched in 2010, took over their slots in the range."
