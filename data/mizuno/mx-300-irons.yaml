description: >
  The MX-300 is the MX line at its most player-oriented: a Grain Flow Forged
  undercut cavity built without the offset and sole width the rest of the MX
  range carried, so it reads as an MP blade at address while keeping a
  forgiving cavity behind the face. The sole is dual-cambered to cut turf drag.
  Lofts are traditional — 33 degrees at the 7-iron, 45 at the pitching wedge —
  and the set extends to a 50-degree gap wedge. Figures are the men's standard
  steel build.
