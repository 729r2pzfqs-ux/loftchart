faq:
  - q: "What is the loft of a Mizuno MX-300 7-iron?"
    a: "The Mizuno MX-300 7-iron has a loft of 33 degrees, a lie of 61.5 degrees and a steel-shaft length of 36.75 inches."
  - q: "When were Mizuno MX-300 irons made?"
    a: "The MX-300 was released in 2010, the last of Mizuno's MX line before the JPX name took over that part of the range."
  - q: "Is the Mizuno MX-300 forged?"
    a: "Yes — Grain Flow Forged from 1025E Pure Select mild carbon steel, with an undercut cavity behind the face."
  - q: "How much offset does a Mizuno MX-300 have?"
    a: "0.171 inches at the 3-iron down to 0.102 at the pitching wedge, noticeably less than the MX-17 and MX-23 that preceded it."
