description: >
  The ST-MAX 230 is Mizuno's 2024 driver — a single 460 cc high-MOI,
  draw-neutral head that served as the forgiving companion to the 440 cc
  ST-G 230 tour model. Its face uses the Beta Rich Ti LFS alloy first seen
  on the ST-G, whose roughly 9% higher tensile strength allows a more
  aggressive face geometry over the CORTECH Chamber. The deep, low centre of
  gravity let Mizuno ship it at a longer 45.75-inch stock build. It was
  Mizuno's mainline driver until the JPX One replaced the ST series in
  January 2026, and it remains a strong-value used buy.
