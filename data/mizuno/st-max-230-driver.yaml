hosel:
  system: "Quick Switch"
  loft_range: "±2°"
  lie_effect: >
    Mizuno's published range runs from the stated 59° lie to 3° upright
    (59-62°).
  face_note: >
    Lowering loft opens the face and raising it closes it, as on any
    hosel-based adjuster.
  notes: >
    Mizuno publishes the Quick Switch range per head — the 9.5° head plays
    7.5-11.5°, the 10.5° head 8.5-12.5°, the 12° head 10-14° — but no
    position-by-position chart, so none is reproduced here. The standard
    setting plays the stamped loft at 59° lie.
