faq:
  - q: "What lofts does the Mizuno ST-MAX 230 come in?"
    a: "9.5, 10.5 and 12 degrees, with the 10.5 and 12 right-hand only at stock. The Quick Switch hosel extends each head 2 degrees either way."
  - q: "What are the ST-MAX 230 loft settings?"
    a: "The Quick Switch hosel adjusts loft 2 degrees either side of stamped — the 9.5 degree head plays 7.5 to 11.5 degrees — and lie from the standard 59 degrees up to 62. Mizuno publishes the ranges rather than a position-by-position chart."
  - q: "What is the difference between the ST-MAX 230 and ST-G 230?"
    a: "The ST-MAX 230 is the 460 cc high-MOI, draw-neutral forgiveness head; the ST-G 230 is the compact 440 cc tour model with a dual sliding-weight track for flight tuning. They shared the Beta Rich Ti LFS face."
  - q: "Is the Mizuno ST-MAX 230 still in production?"
    a: "The JPX One replaced Mizuno's ST driver line in January 2026, so the ST-MAX 230 is a closeout and used-market buy — typically at a steep discount for a two-year-old flagship."
