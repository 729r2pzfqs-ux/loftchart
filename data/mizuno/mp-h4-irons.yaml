faq:
  - q: "What is the loft of a Mizuno MP-H4 7-iron?"
    a: "The Mizuno MP-H4 7-iron has a loft of 34 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "Is the Mizuno MP-H4 a full set or just long irons?"
    a: "Mizuno published specs from a 2-iron through pitching wedge, so it could be played as a full set, but most golfers used the 2-5 irons as forgiving long-iron replacements blended into MP-64 or MP-4 sets."
  - q: "How is the MP-H4 constructed?"
    a: "The face, neck and sole are Grain Flow Forged from 1025E steel and welded to a hollow body, placing weight low and deep for high launch while keeping a forged feel and a compact, low-offset address view."
