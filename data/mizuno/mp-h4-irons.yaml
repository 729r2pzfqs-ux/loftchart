description: >
  The MP-H4 was Mizuno's first full hollow-construction MP iron, launched in September
  2012 alongside the MP-64 as part of the 2013 MP line. A Grain Flow Forged face, neck
  and sole are welded to a hollow body so weight sits low and deep for high launch,
  while the address view keeps the low-offset MP look. It was catalogued as a full
  2-PW set but is best known as a long-iron replacement blended into MP sets. Lofts are
  traditional, with a 34-degree 7-iron and 46-degree pitching wedge. Specs below are the
  standard Dynamic Gold steel build.
