description: >
  The MX-23 sits a step below the MX-17 in head size and a step above the MP
  line in forgiveness, with a cut-muscle cavity and a mid-width sole. Lofts run
  one degree stronger than the MX-17 through the mid irons — 33 degrees at the
  7-iron against 34 — and the set finishes with a short 35.25-inch pitching
  wedge. Offset is heavy in the long irons at 0.240 inches and flattens out at
  0.150 from the 9-iron down. Figures are the men's standard steel build.
