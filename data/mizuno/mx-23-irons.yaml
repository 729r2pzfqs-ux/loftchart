faq:
  - q: "What is the loft of a Mizuno MX-23 7-iron?"
    a: "The Mizuno MX-23 7-iron has a loft of 33 degrees, a lie of 61.5 degrees and a length of 36.75 inches."
  - q: "When were Mizuno MX-23 irons made?"
    a: "The MX-23 dates from 2006, alongside the larger MX-17 in Mizuno's MX game-improvement range."
  - q: "What is the difference between the Mizuno MX-17 and MX-23?"
    a: "The MX-23 is the smaller head with a cut-muscle cavity and lofts a degree stronger through the mid irons; the MX-17 has the wider sole, more offset and the deeper pocket cavity."
  - q: "What is the pitching wedge loft on the Mizuno MX-23?"
    a: "46 degrees, built at 35.25 inches — a quarter inch shorter than most Mizuno pitching wedges of the period."
