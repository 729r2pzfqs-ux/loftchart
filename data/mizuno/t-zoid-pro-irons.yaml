description: >
  The T-Zoid Pro launched in 1996 as the players iron of T-ZOID, Mizuno's first
  world-unified brand, and reached US retail for the 1998 season. The Grain Flow Forged
  head is a modified cavityback about ten percent larger than a standard Mizuno forging,
  with the T-Zoid Power Bar bracing the cavity directly behind the sweet spot to add
  mass and stability. Lofts are traditional, with a 35-degree 7-iron and 47-degree
  pitching wedge, across a 1-iron-to-lob-wedge range that includes a 51-degree gap wedge
  Mizuno labelled FW. Specs below are the standard Dynamic Gold SensiCore steel build.
