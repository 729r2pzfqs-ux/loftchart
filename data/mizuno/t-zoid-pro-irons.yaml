faq:
  - q: "What is the loft of a Mizuno T-Zoid Pro 7-iron?"
    a: "The Mizuno T-Zoid Pro 7-iron has a loft of 35 degrees, with a 61-degree lie and a 37-inch steel-shaft length."
  - q: "What is the T-Zoid Power Bar?"
    a: "A bracing bar that spans the cavity directly behind the sweet spot, adding mass in the centre of the head for a more stable, solid feel while the surrounding cavity keeps perimeter forgiveness."
  - q: "When did the Mizuno T-Zoid Pro come out?"
    a: "Mizuno launched the T-ZOID brand globally in 1996 with the T-Zoid Pro as its forged players iron; it reached the US line for the 1998 season and was replaced by the T-Zoid Pro II in 2000."
