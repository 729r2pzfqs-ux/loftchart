sources:
  - "Mizuno USA S23 Copper Cobalt product page via Wayback Machine capture of 26 May 2024 (Grain Flow Forged HD 1025 boron construction, 46-60 loft and 4-12 bounce options, KBS Hi-Rev 2.0 115 stock shaft), https://web.archive.org/web/20240526181338/https://mizunousa.com/golf-s23-copper-cobalt"
