faq:
  - q: "What lofts does the Mizuno S23 come in?"
    a: "The stock chart runs 46 to 60 degrees in 12 loft/bounce/grind combinations; through Mizuno's custom program it could be ordered at every degree of loft from 44 to 62."
  - q: "What grinds does the Mizuno S23 offer?"
    a: "Four: the minimal S at the gap and sand lofts, D with moderate relief (54-58), C with heavy relief (56-60) and the extreme-relief low-bounce X (58-60)."
  - q: "How does the S23 differ from the T24?"
    a: "The S23 is the fuller, more forgiving shape with a simpler four-grind chart and a KBS Hi-Rev stock shaft at a lower price; the T24 is the compact tour head with five grinds and 17 combinations."
