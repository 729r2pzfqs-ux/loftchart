description: >
  The S23 is Mizuno's 2023 S-Series wedge, the slightly fuller, more
  forgiving partner to the T24, Grain Flow Forged HD in Hiroshima from 1025
  boron steel and replaced by the Mizuno Pro T-3 in 2025. QuadCut grooves
  vary by loft, laser-etched HydroFlow micro grooves channel moisture, and
  the head shape flows from a straight-edged teardrop at the strong lofts
  to a rounder lob-wedge profile. The stock chart below lists the 12
  loft/bounce/grind combinations sold off the rack; through Mizuno's custom
  program the S23 could also be ordered at every degree of loft from 44 to
  62. Finishes were White Satin and Copper Cobalt. Lie and length are
  omitted because Mizuno's published US and UK charts disagree.
grinds:
  - code: S
    name: S Grind
    description: >
      Minimal sole grind for fuller shots — the only sole at the gap lofts
      and the standard sand-wedge option.
  - code: D
    name: D Grind
    description: >
      Moderate heel and toe relief for gentle face manipulation, at 54 to
      58 degrees.
  - code: C
    name: C Grind
    description: >
      Heavy relief for more skilled players and firmer conditions, at 56 to
      60 degrees.
  - code: X
    name: X Grind
    description: >
      Extreme heel, toe and trailing-edge relief for short-game artists —
      the lowest-bounce option, at 58 and 60 degrees.
