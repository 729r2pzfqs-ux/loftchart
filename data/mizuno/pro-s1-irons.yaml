description: >
  The Mizuno Pro S-1 is the muscle back of Mizuno's Pro Signature series and the
  replacement for the Pro 241, revealed in July 2025 with pre-orders from
  28 August and retail from 11 September 2025. It is one-piece Grain Flow Forged
  HD from 1025E Pure Select mild carbon steel in Hiroshima, with a copper
  underlay, a channel cut into the back of the head and a flatter sole with a
  sharper leading edge and more bounce. Lofts and offsets carry over from the
  Pro 241 unchanged, 34 degrees at the 7-iron and 46 at the pitching wedge,
  while the published lies are half a degree more upright and the 3-iron is
  dropped: the set is 4-PW in both hands. Figures are the men's standard
  steel-shaft build; Mizuno does not publish bounce or swing weight for it.
length_note: >
  These lengths use the USGA / R&A measuring method, which Mizuno adopted for
  its published spec tables with this generation. They read about a quarter
  inch longer than the figures Mizuno published for earlier models such as the
  JPX923 and Mizuno Pro 241, 243 and 245, but Mizuno states that actual club
  length is unchanged. Subtract 0.25 inches to compare with an older Mizuno
  chart.
