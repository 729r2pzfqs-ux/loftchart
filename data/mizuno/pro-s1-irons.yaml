faq:
  - q: "What is the loft of a Mizuno Pro S-1 7-iron?"
    a: "The Mizuno Pro S-1 7-iron has a loft of 34 degrees, with a 62-degree lie and a 37.25-inch steel-shaft length measured by the USGA / R&A method."
  - q: "Are the Mizuno Pro S-1 lofts different from the Pro 241?"
    a: "No. The lofts carry over unchanged, from 24 degrees at the 4-iron to 34 at the 7-iron and 46 at the pitching wedge, and so do the offsets. The published lies are half a degree more upright and the 3-iron is no longer part of the set."
  - q: "Is the Mizuno Pro S-1 longer than the Pro 241?"
    a: "Only on paper. The S-1 chart lists the 7-iron at 37.25 inches against 37.0 for the Pro 241, but Mizuno has moved its published lengths to the USGA / R&A measuring method, which reads about a quarter inch longer for the same club."
  - q: "When were the Mizuno Pro S-1 irons released?"
    a: "Mizuno revealed the Pro S-1 in July 2025, with pre-orders from 28 August and retail from 11 September 2025."
