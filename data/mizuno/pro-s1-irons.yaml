sources:
  - "Length basis: Mizuno's own specification page for the Mizuno Pro 243 (https://mizunogolf.com/us/golf-clubs/mp-series/mizuno-pro-243/club-specification/, retrieved 29 September 2026) states that Mizuno is changing its official iron measurement method to match the USGA / R&A standard and that its published lengths are consequently about 1/4 inch longer while actual club length is unchanged. The Pro S-1 page itself carries no such footnote; its lengths (7-iron 37.25 inches) are on the new basis."
  - "Mizuno official Pro S-1 club-specification page (https://mizunogolf.com/us/golf-clubs/mp-series/mizuno-pro-s1/club-specification/, retrieved 29 September 2026) — loft, lie, offset (published in inches) and length for the 4-iron through pitching wedge, and the dexterity note 'RH & LH: 4-PW'. The page does not publish bounce or swing weight, so those keys are omitted."
  - "Mizuno official Pro S-1 product page (https://mizunogolf.com/us/golf-clubs/mp-series/mizuno-pro-s1/) — the same table, the construction copy (Grain Flow Forged HD from a single billet of 1025E Pure Select mild carbon steel, channel back, copper underlay, reduced sole camber, sharper leading edge, increased bounce angle, Nickel Chrome soft white satin finish) and the custom shaft list, which supplies the KBS Tour weights (R 110g, S 120g, X 130g)."
  - "golf.com 'Mizuno Pro S-1 irons: 4 things to know', published 14 July 2025 (https://golf.com/gear/irons/mizuno-pro-s-1-irons/) — the announcement date used for year_introduced, pre-orders from 28 August and retail from 11 September 2025, 215 dollars per club, the S-1 as the successor to the Pro 241, KBS Tour as the stock shaft with a Golf Pride Tour Velvet grip, and a matching 7-iron of 34 degrees, 62-degree lie and 37.25 inches. Announcement and retail both fall in 2025."
