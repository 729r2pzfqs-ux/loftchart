sources:
  - "KEN's Mizuno Pro lineage catalogue notes (ameblo.jp/inuken-2019, 'ミズノプロの系譜（３）仕様データ1990年代版'): full 1-SW loft/lie/length table for the MIZUNO PRO TN-93, with 257 g 5-iron head weight matched to D1 with Dynamic Gold"
  - "MizunoDBG vintage blog (mizunotp.tech.blog, 'Mizuno Pro - Best of the Rest'): TN-93 released 1994 as the third and final TN set, small cavity back, with the odd high-toe S wedge, a rounded normal S2 and a dedicated driving 1-iron - corroborating the set composition"
