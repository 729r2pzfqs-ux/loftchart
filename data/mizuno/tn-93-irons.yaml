description: >
  The Mizuno Pro TN-93 was the third and final Tommy Nakajima signature iron, a
  Japan-market Grain Flow Forged head with a shallow half-cavity that keeps a blade
  profile. Unusually for the series it uses half-degree lofts through most of the set,
  with a 35.5-degree 7-iron and 48.5-degree pitching wedge, and the catalogue range ran
  from a 17-degree driving 1-iron to two sand wedges: a conventional 53-degree S2 and
  the distinctive high-toe 59-degree SW. Lengths below are the Japanese-market steel
  spec with a 37.5-inch 5-iron; some export listings quote 37.75 inches, and the
  discrepancy is noted rather than resolved.
