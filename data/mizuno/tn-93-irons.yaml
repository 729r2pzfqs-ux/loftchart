faq:
  - q: "What is the loft of a Mizuno Pro TN-93 7-iron?"
    a: "The Mizuno Pro TN-93 7-iron has a loft of 35.5 degrees, with a 60.5-degree lie and a 36.5-inch Japanese-spec steel length."
  - q: "Why does the TN-93 have two sand wedges?"
    a: "The catalogue offered a conventional rounded 53-degree wedge labelled S2 and a distinctive 59-degree high-toe, high-offset SW; players picked one or carried both."
  - q: "Is the TN-93 a blade or a cavityback?"
    a: "It is a near-blade: a shallow half-cavity is milled into an otherwise muscleback profile, keeping the look and flight of a blade with slightly more forgiveness than the TN-87 and TN-91 before it."
