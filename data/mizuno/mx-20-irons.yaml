description: >
  The T-Zoid MX-20 is the model that started Mizuno's long-running MX series,
  a forged mid-size cavity back positioned as an easier-to-hit follow-up to
  the T-Zoid Comp EZ. It pairs Mizuno's forged feel with a wider sole and
  larger head than the MP line of the period. Lofts are traditional — 33
  degrees at the 7-iron and 46 at the pitching wedge — over a 3-iron through
  pitching wedge set. Figures are the men's standard steel build.
