faq:
  - q: "What is the loft of a Mizuno MX-20 7-iron?"
    a: "The Mizuno MX-20 7-iron has a loft of 33 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "Are the Mizuno MX-20 irons forged?"
    a: "Yes. The MX-20 is a forged carbon-steel cavity back, sold under Mizuno's T-Zoid banner as a more forgiving alternative to the MP line."
  - q: "What replaced the Mizuno MX-20?"
    a: "The MX-23, which carried the MX series forward with a cut-muscle cavity design and the same 33-degree 7-iron."
