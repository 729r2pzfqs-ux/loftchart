description: >
  The RocketBladez Tour is the compact better-player version of the 2013
  RocketBladez, announced in late 2012 alongside the standard model and played
  on tour before release. It keeps the Speed Pocket slot in the sole of the 3-
  to 7-irons but uses a smaller head, a thinner topline, less offset and
  markedly weaker lofts — a 33.75-degree 7-iron and a 47-degree pitching wedge
  against 30.5 and 45 on the standard RocketBladez. The stock set is 3-iron
  through pitching wedge with a 51.5-degree approach wedge available. Specs
  below are the men's standard steel-shaft build.
