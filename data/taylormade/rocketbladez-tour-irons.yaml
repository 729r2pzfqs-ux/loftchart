faq:
  - q: "What is the loft of a TaylorMade RocketBladez Tour 7-iron?"
    a: "The TaylorMade RocketBladez Tour 7-iron has a loft of 33.75 degrees, with a 62.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "How do RocketBladez Tour lofts compare to the standard RocketBladez?"
    a: "The Tour model is considerably weaker lofted: 33.75 degrees at the 7-iron against 30.5, and a 47-degree pitching wedge against 45. It also starts the set at a 19-degree 3-iron rather than 17.5 degrees."
  - q: "Does the RocketBladez Tour have the Speed Pocket?"
    a: "Yes. Like the standard model, the 3- through 7-irons carry the Speed Pocket slot in the sole; the short irons use a conventional solid sole."
