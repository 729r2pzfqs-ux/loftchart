description: >
  The Tour Preferred MB was the muscleback blade in the Tour Preferred trio TaylorMade
  announced in autumn 2010 and sold as its 2011 irons line, above the MC muscle-cavity
  and CB cavityback. It is a compact, minimal-offset forged blade produced with
  TaylorMade's multi-step net forging process, with a precision-weighting port hidden
  in the head to set swingweight without disturbing the centre of gravity. Lofts are
  fully traditional, with a 35-degree 7-iron and a 47-degree pitching wedge across the
  stock 2-iron through pitching wedge range. Specs below are the men's standard
  steel-shaft build.
