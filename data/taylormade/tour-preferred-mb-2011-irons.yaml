faq:
  - q: "What is the loft of a TaylorMade Tour Preferred MB (2011) 7-iron?"
    a: "The 2011 TaylorMade Tour Preferred MB 7-iron has a loft of 35 degrees, with a 62.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "Are the 2011 Tour Preferred MB irons forged?"
    a: "Yes. The Tour Preferred MB is a one-piece forged muscleback finished with TaylorMade's net forging process, with a precision-weighting port used to set exact swingweights without moving the centre of gravity."
  - q: "How do the 2011 Tour Preferred MB lofts compare to the MC and CB?"
    a: "The MB runs 18 to 47 degrees from 2-iron to pitching wedge with a 35-degree 7-iron. The MC is one degree stronger through most of the set at 34 degrees in the 7-iron, and the CB is two degrees stronger again at 33 degrees, though all three share a 46-47-degree pitching wedge."
