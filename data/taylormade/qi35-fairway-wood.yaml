faq:
  - q: "What lofts do the TaylorMade Qi35 fairway woods come in?"
    a: "The core Qi35 comes in 15, 16.5, 18 and 21 degrees; the Qi35 Tour in 15, 18 and 21; the Qi35 Max in 15.5, 18.5, 21.5 and 24.5; and the Qi35 Max Lite in 15.5, 18.5 and 21.5."
  - q: "Are the Qi35 fairway woods adjustable?"
    a: "Mostly. For the first time TaylorMade fitted its 4 degree loft sleeve to every 3-wood and 5-wood in the line, and to the Qi35 Tour 7-wood. The Max 7- and 9-woods, the Max Lite 7-wood and the core 21 degree head are bonded and play at their stamped loft."
  - q: "What is the difference between the Qi35 and Qi35 Tour fairway woods?"
    a: "The Tour is a compact titanium-bodied head with a 50 gram sliding sole weight for flight tuning and a loft sleeve on all three lofts, aimed at faster players. The core Qi35 is the larger steel-bodied all-rounder at 100 dollars less."
  - q: "Is the Qi35 fairway wood still current?"
    a: "No — the Qi4D fairway woods replaced the line in January 2026, which makes the Qi35 the value buy as closeout and used stock while it lasts."
