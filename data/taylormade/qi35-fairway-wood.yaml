description: >
  The Qi35 fairway woods launched on 7 January 2025 alongside the Qi35
  drivers, and for the first time TaylorMade put its 4° loft sleeve on every
  3-wood and 5-wood in the line rather than reserving adjustability for the
  Tour head. The core Qi35 is the all-round head, the titanium-bodied Qi35
  Tour adds a 50 g sliding sole weight and a sleeved 7-wood for the most
  adjustable fairway TaylorMade had built, the Qi35 Max is the large-footprint
  high-MOI head sold down to a 9-wood, and the Qi35 Max Lite is the same Max
  geometry in a lighter head, shaft and grip build. The Qi4D fairways replaced
  the line in January 2026.
variants:
  - name: Qi35
    description: >
      The core head for most players: mid launch, the full chromium carbon
      cosmetic of the driver line, and the 4° loft sleeve on the 3- and
      5-woods. Sold in four lofts including a 16.5° 3HL.
  - name: Qi35 Tour
    description: >
      The compact tour head with a titanium body, a 50 g sliding sole weight
      for flight tuning, and — unusually — a loft sleeve on the 7-wood as
      well as the 3- and 5-woods.
  - name: Qi35 Max
    description: >
      The high-MOI forgiveness head on the largest footprint in the line
      (about 190 cc in the 3-wood, stepping down through the set), sold in
      half-degree-weaker lofts than the core head and down to a 9-wood. The
      3- and 5-woods carry the loft sleeve; the 7- and 9-woods are bonded.
  - name: Qi35 Max Lite
    description: >
      The Max geometry in a lighter build — lighter head, sub-50-gram shaft
      and lighter grip — for moderate swing speeds. Three lofts, with the
      7-wood bonded.
