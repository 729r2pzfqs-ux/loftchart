description: >
  The second-generation P790 keeps the original's loft chart exactly — 30.5
  degrees at the 7-iron, 45 at the pitching wedge — and changes the build
  around it. The forged face is thinner, the internal SpeedFoam is reformulated
  and the tungsten weight is repositioned, while the set is a quarter inch
  longer than the 2017 model through the mid irons at 37.00 inches for the
  7-iron. Offset also drops slightly in the long irons. Figures below are the
  men's standard right-handed steel build.
