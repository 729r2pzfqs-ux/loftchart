faq:
  - q: "What is the loft of a TaylorMade P790 (2019) 7-iron?"
    a: "The 2019 P790 7-iron has a loft of 30.5 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.00 inches."
  - q: "Are 2017 and 2019 P790 lofts different?"
    a: "No. Both use 19, 21, 23.5, 26.5, 30.5, 35, 40, 45 and 50 degrees from 3-iron to approach wedge. The 2019 set is built a quarter inch longer through the mid irons and carries slightly less long-iron offset."
  - q: "When were the 2019 P790 irons replaced?"
    a: "In 2021, by the third-generation P790, which kept the same loft chart again and moved to the lighter SpeedFoam Air."
  - q: "What is the pitching wedge loft on the 2019 P790?"
    a: "45 degrees, with a 50-degree approach wedge below it."
