faq:
  - q: "What lofts do the TaylorMade Qi35 Rescues come in?"
    a: "The core Qi35 Rescue comes in 17, 19, 22 and 25 degrees; the Qi35 Max Rescue in 20, 23, 27, 31 and 35; and the Qi35 Max Lite Rescue in 23, 27, 31 and 35."
  - q: "Are the Qi35 Rescues adjustable?"
    a: "Only the core Qi35 Rescue, which carries a 3 degree loft sleeve (1.5 degrees each way). The Qi35 Max and Max Lite Rescues are bonded and play at their stamped loft."
  - q: "What is the difference between the Qi35 Rescue and the Qi35 Max Rescue?"
    a: "The core Rescue is the slightly more compact, adjustable head with a mild draw bias. The Max is the bonded high-MOI forgiveness head, lofted one degree weaker at each club number and sold in more lofts — out to a 35 degree 7-Rescue."
