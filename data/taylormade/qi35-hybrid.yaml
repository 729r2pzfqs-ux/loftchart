brand: TaylorMade
brand_slug: taylormade
model: Qi35
slug: qi35-hybrid
club_type: hybrid
year_introduced: 2025
year_discontinued: null
category: flagship
construction: steel body with carbon crown; bonded hosels on the Max heads, loft sleeve on the core Rescue
material: multi-material head with TaylorMade's Twist Face bulge-and-roll hybrid face
predecessor: TaylorMade Qi10
successor: TaylorMade Qi4D
description: >
  TaylorMade calls its hybrids Rescues, and the Qi35 Rescue family launched on
  7 January 2025 with the Qi35 fairway woods. The core Qi35 Rescue is the
  adjustable, slightly compact head with a mild draw bias and a 3° loft
  sleeve; the Qi35 Max Rescue is the bonded high-MOI head, sold one degree
  weaker at each club number and all the way out to a 35° 7-Rescue; and the
  Qi35 Max Lite Rescue is the same Max shape in a lighter head, shaft and grip
  build without the 20° head. The Qi4D Rescues replaced the family in January
  2026.
variants:
  - name: Qi35 Rescue
    head_cc: 106
    description: >
      The core adjustable Rescue: a 106 cc head with the 3° loft sleeve and a
      touch of draw bias, in 17-25°. The 17° head is right-hand only.
  - name: Qi35 Max Rescue
    description: >
      The bonded forgiveness head with higher MOI and a slight draw bias,
      lofted one degree weaker than the core Rescue at each club number and
      sold in five lofts from 20° to 35°.
  - name: Qi35 Max Lite Rescue
    head_cc: 109
    description: >
      The Max geometry in a lighter build — lighter head, Vanquish 5 shaft
      and lighter grip — for moderate swing speeds, in four lofts from 23°.
