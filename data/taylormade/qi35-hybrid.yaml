hosel:
  system: "3° Loft Sleeve (Qi35 Rescue only)"
  loft_range: "±1.5°"
  positions: 12
  lie_effect: >
    As on the fairway sleeve, lie only moves upright from standard.
  face_note: >
    Lowering loft opens the face slightly and raising it closes it.
  notes: >
    Only the core Qi35 Rescue carries the sleeve — the Max and Max Lite
    Rescues are bonded and play at their stamped loft. TaylorMade publishes
    the Rescue sleeve's range (1.5° each way, taking the line from 15.5° to
    26.5° overall) rather than a Rescue-specific position-by-position chart,
    so no settings table is reproduced here.
