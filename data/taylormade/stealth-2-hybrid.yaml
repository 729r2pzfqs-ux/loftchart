faq:
  - q: "What lofts do the TaylorMade Stealth 2 Rescues come in?"
    a: "The core Stealth 2 Rescue comes in 19, 22, 25, 28 and 31 degrees (28 and 31 right-hand only); the Stealth 2 Plus Rescue in 17, 19.5 and 22; and the Stealth 2 HD Rescue in 19, 22, 25 and 28."
  - q: "Is the TaylorMade Stealth 2 Rescue adjustable?"
    a: "Only the Stealth 2 Plus Rescue, which carries a 3 degree loft sleeve (1.5 degrees each way). The core and HD Rescues are bonded and play at their stamped loft."
  - q: "What is the difference between the Stealth 2 Rescue and the HD Rescue?"
    a: "The HD is the draw-biased model: heel weighting and a higher flight to fight a right miss, in four lofts. The core Rescue is neutral and adds a fifth loft at 31 degrees."
