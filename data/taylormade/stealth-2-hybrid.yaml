description: >
  The Stealth 2 Rescue family launched in January 2023 alongside the Stealth 2
  woods. The core Stealth 2 Rescue is a bonded five-loft line from 19° to 31°;
  the Stealth 2 HD Rescue is the draw-biased version in four lofts for players
  fighting a right miss; and the compact Stealth 2 Plus Rescue is the
  adjustable player's head in 17°, 19.5° and 22°, built to flight down like a
  long iron. The Qi10 Rescues replaced the family in January 2024.
variants:
  - name: Stealth 2 Rescue
    description: >
      The core bonded Rescue in five lofts from 19° to 31°; the 28° and 31°
      heads are right-hand only.
  - name: Stealth 2 Plus Rescue
    description: >
      The compact tour head with the family's only 3° loft sleeve, in 17°,
      19.5° and 22° — lower flight, more workability, iron-like address look.
  - name: Stealth 2 HD Rescue
    description: >
      The draw-biased forgiveness head in four lofts, with heel weighting and
      a higher flight to straighten a fade. Swing weight D3; the 28° head is
      right-hand only.
