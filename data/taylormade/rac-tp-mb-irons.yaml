description: >
  The rac TP MB replaced the rac MB as TaylorMade's muscleback blade, developed with
  tour-player input and shipping from April 2006 in right-hand men's form only. It keeps
  the rac Feel Pockets - enlarged in this generation - adds a CNC-milled face and
  grooves, and pairs minimal offset with a high centre of gravity and a tour-configured
  sole for workability. Lofts are traditional, with a 36-degree 7-iron and 48-degree
  pitching wedge across the 2-PW range. The sell sheet is titled for 2006 and TaylorMade's
  own Irons Legacy timeline files the model under that year, so the 2005 date sometimes
  seen in listings refers to the wider rac TP family launch rather than this blade.
