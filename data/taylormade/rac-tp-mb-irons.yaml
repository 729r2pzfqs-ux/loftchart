faq:
  - q: "What is the loft of a TaylorMade rac TP MB 7-iron?"
    a: "The rac TP MB 7-iron has a loft of 36 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "What is the difference between the rac MB and the rac TP MB?"
    a: "The rac TP MB is the 2006 follow-up to the 2003 rac MB. It enlarges the rac Feel Pockets, adds a CNC-milled face and grooves and a Tour Satin finish, and drops the 1-iron, running 2-iron through pitching wedge in right-hand only."
  - q: "What shafts did the rac TP MB come with?"
    a: "The stock shaft was the Precision Rifle Tour Flighted in 5.0, 6.0 and 6.5 flexes, building to a D3 swingweight (D4 in the pitching wedge)."
