description: >
  Kalea Premier is the 2022 renewal of TaylorMade's women's line, announced in
  August 2022 with presale from 15 August and retail from 14 October. The irons
  use the Cap Back construction of TaylorMade's contemporary Stealth irons — a
  polymer cap stabilising the topline so the face and Speed Pocket can flex —
  in an ultralight package built around the 40-gram Kalea Premier 40 Lite
  graphite shaft. The set runs 6-iron through sand wedge, with a 32-degree
  7-iron and a 45-degree pitching wedge. Specs below are the women's stock
  graphite build, the only configuration offered.
