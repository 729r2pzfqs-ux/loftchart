faq:
  - q: "What is the loft of a TaylorMade Kalea Premier 7-iron?"
    a: "The TaylorMade Kalea Premier 7-iron has a loft of 32 degrees, with a 61.75-degree lie and a 36.25-inch graphite-shaft length."
  - q: "What clubs come in the Kalea Premier iron set?"
    a: "The irons run 6-iron through sand wedge: 6 to 9, a 45-degree pitching wedge, a 50-degree approach wedge and a 55-degree sand wedge. In the full Kalea Premier set the long irons are replaced by fairway woods and hybrids."
  - q: "How do Kalea Premier lofts compare to the original Kalea?"
    a: "Kalea Premier is one to two degrees stronger through the set — a 32-degree 7-iron against 33 and a 45-degree pitching wedge against 47 — and adds a 50-degree approach wedge the original set did not have."
  - q: "What replaced the Kalea Premier line?"
    a: "TaylorMade introduced the Kalea Gold women's line in August 2024, a premium update built on the Kalea Premier design."
