faq:
  - q: "What is the loft of a TaylorMade Tour Burner 7-iron?"
    a: "The TaylorMade Tour Burner 7-iron has a loft of 33 degrees, with a 63-degree lie and a 36.75-inch steel-shaft length."
  - q: "What is the difference between the Tour Burner and the Burner XD?"
    a: "The Tour Burner is the smaller, cleaner-looking of the pair, with a medium topline, moderate offset and an all-steel head. The Burner XD uses an extra-large head with a titanium face, much more offset and lofts around three degrees stronger, at 30 degrees in the 7-iron against 33 for the Tour Burner."
  - q: "Are the Tour Burner lofts strong?"
    a: "Yes for 2008: the 33-degree 7-iron and 46-degree pitching wedge sit about two degrees stronger than the traditional player's lofts of the era, which TaylorMade paired with the thin high-COR face for distance."
