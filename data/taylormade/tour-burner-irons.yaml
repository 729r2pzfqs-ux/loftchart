description: >
  The Tour Burner iron paired the 2008 Burner family's distance technology with a
  cleaner, more compact look than the oversized Burner XD. A thin 2.2-millimetre face
  with Inverted Cone Technology drives ball speed, while the multi-functional sole
  combines moderate width and a bevelled trailing edge for a low CG without digging.
  Lofts are strong for the period, with a 33-degree 7-iron and 46-degree pitching
  wedge, and the full range runs from a 2-iron to a lob wedge. Specs below are the
  men's standard steel-shaft build.
