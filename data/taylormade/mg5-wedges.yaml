faq:
  - q: "What lofts does the TaylorMade MG5 come in?"
    a: "The MG5 is sold from 46 to 60 degrees in 2-degree steps — 23 loft, bounce and grind combinations including the two Tiger Woods grind models."
  - q: "What grinds does the TaylorMade MG5 offer?"
    a: "Six: SB standard bounce (every loft 46-60), SC (54-60), the new wide-sole SX (58-60), LB low bounce (56-60), HB high bounce (54-60) and the Tiger Woods TW grind (56 and 60 degrees)."
  - q: "Is the TaylorMade MG5 forged?"
    a: "Yes — it is the first fully forged Milled Grind wedge, forged from ultrasoft carbon steel with precision-milled soles, saw-milled grooves and a raw face finish."
  - q: "What is the TW grind on the MG5?"
    a: "Tiger Woods's dual-sole design: a narrow leading edge with heavy heel relief and increased effective bounce in the heel, sold as its own model at 56 degrees (12 bounce) and 60 degrees (11 bounce)."
