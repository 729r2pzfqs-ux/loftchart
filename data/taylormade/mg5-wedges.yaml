description: >
  The MG5 (Milled Grind 5) is the 2025 generation of TaylorMade's tour wedge
  line and the first fully forged Milled Grind, announced on 7 August 2025
  and at retail from 4 September. Designed with Greg Cesario, it pairs
  aggressive saw-milled grooves with a raw face carrying Spin Tread
  water-channeling texture, and precision-milled soles. The matrix runs 23
  loft/bounce/grind combinations from 46 to 60 degrees across six grinds,
  including the new wide-sole SX and the Tiger Woods grind sold as its own
  model at 56 and 60 degrees. Finishes are Satin Chrome and, on a subset of
  combinations, Charcoal.
grinds:
  - code: SB
    name: SB Grind (Standard Bounce)
    description: >
      Four-way camber design that suits an array of swing styles and turf
      conditions for all-around performance — the grind offered at every loft.
  - code: SC
    name: SC Grind
    description: >
      Built for greenside versatility, with heel and toe relief for
      manipulating the face in a variety of turf conditions.
  - code: SX
    name: SX Grind
    description: >
      New for MG5 — a unique combination of sole width and mid-bounce
      versatility, with a reverse-C trailing edge that keeps the bounce
      consistent as you manipulate the face.
  - code: LB
    name: LB Grind (Low Bounce)
    description: >
      For players with shallow swing styles and tight, firm conditions.
      Built for greenside versatility.
  - code: HB
    name: HB Grind (High Bounce)
    description: >
      High-bounce sole for steeper swings or soft conditions, with built-in
      heel relief for versatility.
  - code: TW
    name: TW Grind (Tiger Woods)
    description: >
      Tiger Woods's dual-sole grind, updated with a new leading-edge blend
      and increased effective bounce in the heel. A narrow leading edge with
      heavy heel relief, sold as its own model at 56 and 60 degrees.
