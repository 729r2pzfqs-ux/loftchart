description: >
  The Hi-Toe 3 is the 2022 generation of TaylorMade's high-toe specialty
  wedge, at retail from 9 August 2022 until the Hi-Toe 4 replaced it in
  August 2024. The tall toe and full-face scoring lines (extended to the
  54-degree head this generation) are built for open-face shots, with raised
  micro-ribs between the grooves and the most centered CG of any TaylorMade
  wedge of its day for a lower, spinnier flight. A four-way camber sole
  keeps the leading edge low; the previous generation's single 10-degree
  bounce at 58 and 60 degrees grew into low- (7), standard- (10) and
  high-bounce (13) options. The retail finish is aged copper; the MyHi-Toe 3
  program added chrome, black and raw.
grinds:
  - code: SB
    name: Standard Bounce
    description: >
      The four-way camber sole with a low leading edge, offered at every
      loft from 50 to 60 degrees — wide enough to forgive, versatile when
      the face is rotated open.
  - code: LB
    name: Low Bounce
    description: >
      Seven degrees of bounce at 58 and 60 degrees for firm turf, tight
      lies, harder sand and players with a shallow, sweeping attack.
  - code: HB
    name: High Bounce
    description: >
      Thirteen degrees of bounce at 58 and 60 degrees for soft turf, fluffy
      lies, soft sand and steep, digging swing styles.
