faq:
  - q: "What lofts does the TaylorMade Hi-Toe 3 come in?"
    a: "50 to 60 degrees in 2-degree steps. Standard bounce covers every loft; 58 and 60 degrees also come in low-bounce (7 degrees) and high-bounce (13 degrees) versions, for 10 combinations in all."
  - q: "Does the Hi-Toe 3 have full-face grooves?"
    a: "Yes, on the 54- through 60-degree heads — this generation extended the full-face scoring lines down to the 54. The 50 and 52 use standard grooves."
  - q: "When did the Hi-Toe 3 come out and when was it replaced?"
    a: "It went on sale on 9 August 2022 and was replaced by the Hi-Toe 4 in August 2024."
