faq:
  - q: "What is the loft of a TaylorMade P770 (2025) 7-iron?"
    a: "The 2025-generation P770 7-iron has a loft of 33 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.00 inches — the same 7-iron chart every P770 generation has used."
  - q: "Did the P770 lofts change for the 2025 generation?"
    a: "Only at the ends of the set. The pitching wedge strengthens from 46 to 45 degrees and the approach wedge from 51 to 50, while the 3-iron goes from 19.5 to 19 and the 4-iron from 22.5 to 22. The 5-iron through 9-iron, including the 33-degree 7-iron, carry over from the 2023 model."
  - q: "When was the 2025 TaylorMade P770 released?"
    a: "TaylorMade announced it with the P7CB on 31 July 2024, with preorders the same day at $1,399.99 for a seven-piece set and retail from 6 September 2024. It is marketed as the 2024/25 model and widely catalogued as the 2025 P770."
  - q: "How do the 2025 P770 lofts compare with the 2025 P790?"
    a: "The P770 is about three degrees weaker through the middle of the set — a 33-degree 7-iron against the 2025 P790's 30 — and one degree weaker at the pitching wedge, 45 degrees against 44."
