description: >
  The third-generation P770 keeps the compact forged hollow-body formula — a
  forged 4140 face over a Thru-Slot Speed Pocket, an 8620 body filled with
  SpeedFoam Air, and the FLTD CG progression backed by up to 41 grams of
  tungsten per head — in a sleeker shape with a thinner topline and a sharper
  leading edge on the long irons. The scoring lofts move a degree stronger than
  the 2023 model, a 45-degree pitching wedge and 50-degree approach wedge
  against 46 and 51, and the 3- and 4-irons half a degree, while the 5-iron
  through 9-iron chart is unchanged, 33 degrees at the 7-iron. TaylorMade
  announced it alongside the P7CB on 31 July 2024 with retail from 6 September
  2024; it is marketed for the 2024/25 season and commonly catalogued as the
  2025 P770, so year_introduced records the 2024 announcement per this
  database's convention. Figures are the men's standard right-handed steel
  build.
