faq:
  - q: "What is the loft of a TaylorMade Qi Max 7-iron?"
    a: "The TaylorMade Qi Max 7-iron has a loft of 28 degrees, with a 63-degree lie and a 37.25-inch steel-shaft length — the same 7-iron chart as the Qi it replaced."
  - q: "Do the Qi Max irons have the same lofts as the Qi irons?"
    a: "Mostly. The 4-iron through 7-iron and the sand wedge carry over unchanged, but the 8-iron strengthens half a degree to 32.5, the pitching wedge goes from 43 to 42.5 degrees, the approach wedge from 49 to 48, and the lob wedge from 59 to 58. Lies and lengths are identical throughout."
  - q: "What clubs come in a stock TaylorMade Qi Max set?"
    a: "The US stock set is 4-iron through pitching wedge, with the 48-degree approach wedge, 54-degree sand wedge and 58-degree lob wedge sold separately. UK sets were sold as 5-PW."
  - q: "When were the TaylorMade Qi Max irons released?"
    a: "TaylorMade opened presale on 8 January 2026 and the irons reached retail on 29 January 2026, at $1,099 in steel and $1,199 in graphite for the 7-piece set."
