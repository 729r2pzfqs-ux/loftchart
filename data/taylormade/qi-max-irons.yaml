description: >
  The Qi Max replaced the Qi as TaylorMade's mainstream game-improvement iron for
  2026, after the company let the Qi run for two seasons rather than replacing it
  in 2025. Its headline change is a face engineered to flex uniformly at impact:
  TaylorMade varied the face sections to counteract the extra toe flexing typical
  of large game-improvement faces, which it says reduces cut spin and keeps
  off-centre strikes straighter. A new sound stabilization bar connects the back
  bar to the top line, which allowed the ECHO Damping System material to be
  extended higher behind the face, and the FLTD CG progression sits the centre of
  gravity lowest in the long irons and progressively higher through the short
  irons. Lies and lengths are identical to the Qi and the 28-degree 7-iron carries
  over, but the short irons are tweaked slightly — the pitching wedge strengthens
  from 43 to 42.5 degrees, the approach wedge from 49 to 48, and the lob wedge
  from 59 to 58. Presale opened 8 January 2026 with retail on 29 January 2026; the
  US stock set is 4-PW with the AW, SW and LW sold separately. Offsets are
  converted from TaylorMade's published millimetre figures, and swing weights
  below are the steel build (graphite builds run one point lighter).
