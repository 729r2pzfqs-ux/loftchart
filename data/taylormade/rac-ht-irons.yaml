faq:
  - q: "What is the loft of a TaylorMade rac HT 7-iron?"
    a: "The TaylorMade rac HT 7-iron has a loft of 33 degrees, with a 63-degree lie and a 36.75-inch steel-shaft length."
  - q: "Why do the rac HT long irons have negative bounce?"
    a: "TaylorMade published bounce angles of -1.8 to -0.3 degrees for the 3- through 5-irons. The slightly negative bounce keeps the wide-soled, high-launch head from sitting with its leading edge raised, helping clean contact from tight lies."
  - q: "What is the difference between the rac HT and the rac OS?"
    a: "Both share the same lofts, with a 33-degree 7-iron, but the HT (High Trajectory) uses an even more offset, higher-launching head design aimed at golfers who struggle to flight the ball, while the OS is the mainstream oversize model of the rac family."
