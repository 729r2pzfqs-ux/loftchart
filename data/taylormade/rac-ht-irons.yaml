description: >
  The rac HT (High Trajectory) was the maximum-launch game-improvement iron of
  TaylorMade's 2004 rac range, sitting above the rac OS in forgiveness. Generous
  offset, upright lies and negative bounce in the long irons are built around getting
  the ball airborne easily, with rac feel technology carried over from the rest of the
  family. Lofts match the rac OS at 33 degrees in the 7-iron and 45 in the pitching
  wedge, over a 3-iron to sand wedge range. It was dropped when the 2005 rac line
  slimmed to the Forged TP, LT and OS. Specs below are the men's standard steel-shaft
  build; stock shafts were offered in S and R steel and S, R, M and L graphite.
