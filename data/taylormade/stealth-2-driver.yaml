faq:
  - q: "What lofts does the TaylorMade Stealth 2 come in?"
    a: "The Stealth 2 Plus comes in 8, 9 and 10.5 degrees; the core Stealth 2 in 9, 10.5 and 12; and the Stealth 2 HD in 9, 10.5 and 12."
  - q: "How do you adjust a Stealth 2 driver?"
    a: "With TaylorMade's 12-position 4 degree Loft Sleeve: loft moves up to 2 degrees either way in 0.75 degree notches, the face closes as loft is added and opens as it is removed, and the UPRT setting plays the stated loft at 4 degrees upright."
  - q: "What is the difference between the Stealth 2, Plus and HD?"
    a: "The Plus is the low-spin tour head with a 15 g sliding weight track; the core Stealth 2 carries a fixed 25 g rear weight for forgiveness with neutral bias; the HD is heel-weighted with a 30 g rear weight for a higher, draw-biased flight."
  - q: "Is the TaylorMade Stealth 2 still in production?"
    a: "No — it ran from 2023 to 2024, when the Qi10 replaced it, so the used market is the main source. Its Loft Sleeve is the same one used on current TaylorMade drivers, so replacement shafts are easy to find."
