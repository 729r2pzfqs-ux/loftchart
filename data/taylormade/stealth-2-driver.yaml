category: flagship
construction: advanced carbon construction — carbon crown, sole and face united by a Carbon Reinforced Composite Ring, with titanium confined to the face collar and the weights
material: 2nd-generation 60X Carbon Twist Face (~24 g) with Inverted Cone Technology and nanotexture cover
predecessor: TaylorMade Stealth
successor: TaylorMade Qi10
description: >
  The Stealth 2 is the 2023 refinement of TaylorMade's "carbonwood" project —
  the red-faced driver that replaced a titanium face with a 24-gram,
  60-layer carbon one. Where the original Stealth still hung its carbon face
  on a conventional body, the Stealth 2 pushed carbon through the whole
  build: crown, sole and a Carbon Reinforced Composite Ring that unites the
  head, leaving titanium only in the face collar and the weights. The Plus is
  the tour head with a 15 g sliding track plus a 15 g rear weight, the core
  Stealth 2 carries a fixed 25 g rear weight for forgiveness, and the HD adds
  heel weighting and a 30 g rear weight for a high-launching draw. The Qi10
  replaced the family in 2024.
variants:
  - name: Stealth 2 Plus
    head_cc: 460
    description: >
      The low-spin tour head: a 15 g sliding-weight track plus a 15 g rear
      weight for draw, neutral or fade tuning at the lowest flight in the
      line.
  - name: Stealth 2
    head_cc: 460
    description: >
      The core high-MOI head with a fixed 25 g rear weight and neutral bias —
      the mainstream pick of the family.
  - name: Stealth 2 HD
    head_cc: 460
    description: >
      The draw-biased, high-launch head with heel weighting via the
      Asymmetric Inertia Generator and a 30 g rear weight; also the basis of
      the women's build at a shorter length.
