faq:
  - q: "What is the loft of a TaylorMade AeroBurner 7-iron?"
    a: "The TaylorMade AeroBurner 7-iron has a loft of 29.5 degrees, with a 63-degree lie and a 37-inch steel-shaft length."
  - q: "What is the difference between the AeroBurner and AeroBurner HL irons?"
    a: "The HL is the higher-launching version with weaker lofts — a 20-degree 4-iron and 43.5-degree pitching wedge against 19 and 43 degrees on the standard model — while sharing the same large head style and offsets."
  - q: "Do the AeroBurner irons have a Speed Pocket?"
    a: "Yes, the 4- through 7-irons carry TaylorMade's Speed Pocket slot in the sole to help ball speed on shots struck low on the face. The short irons and wedges use a conventional sole."
  - q: "What replaced the AeroBurner irons?"
    a: "The TaylorMade M2, announced in 2016, took over as the company's mainstream distance iron."
