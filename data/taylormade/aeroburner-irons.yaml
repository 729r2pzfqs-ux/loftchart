description: >
  The AeroBurner revived the Burner name for TaylorMade's 2015 distance iron,
  taking over the slot the SpeedBlade had occupied since late 2013. The head is
  large and keeps a near-constant size through the set rather than shrinking
  toward the short irons, with a low centre of gravity, a Speed Pocket in the 4
  to 7 irons and strong lofts — a 19-degree 4-iron and a 29.5-degree 7-iron. A
  weaker-lofted AeroBurner HL companion model was sold alongside it. The M2 took
  over as TaylorMade's distance iron in 2016. Specs below are the men's standard
  steel-shaft build.
