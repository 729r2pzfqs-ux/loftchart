faq:
  - q: "What is the loft of a TaylorMade Tour Preferred MC (2011) 7-iron?"
    a: "The 2011 TaylorMade Tour Preferred MC 7-iron has a loft of 34 degrees, with a 62.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "What is the difference between the 2011 Tour Preferred MC and MB?"
    a: "The MC adds a compact, shallow cavity behind the 1025 carbon steel forging, trading a little of the blade's workability for stability. Its lofts are one degree stronger than the MB through the 2- to 9-irons, at 34 degrees against 35 in the 7-iron, while both share a 47-degree pitching wedge."
  - q: "Are the 2011 Tour Preferred MC irons forged?"
    a: "Yes, they are forged from 1025 carbon steel using TaylorMade's net forging process, with milled-in groove design and a precision-weighting port for exact swingweights."
