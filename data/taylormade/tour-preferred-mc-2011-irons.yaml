description: >
  The Tour Preferred MC sat in the middle of the Tour Preferred trio TaylorMade
  announced in autumn 2010 for its 2011 irons line, between the MB blade and the CB
  cavityback. It is forged from 1025 carbon steel into a classic player's shape with a
  compact, shallow cavity that adds a degree of stability over the blade, plus the
  precision-weighting port used across the family to set swingweight without moving
  the centre of gravity. The stock set runs 2-iron through pitching wedge with a
  34-degree 7-iron and 47-degree pitching wedge. Specs below are the men's standard
  steel-shaft build.
