description: >
  The 2014 Tour Preferred MC is the middle model of TaylorMade's second Tour
  Preferred generation, between the TP MB muscleback and the more forgiving TP
  CB. The 3- through 7-irons carry a Speed Pocket milled into the sole and
  filled with a 3M polyurethane, while the 8-iron through pitching wedge are
  forged for feel in the scoring clubs, all under a hand-polished satin
  nickel-chrome finish. Lofts are traditional for the class — a 34-degree
  7-iron and a 47-degree pitching wedge — one degree stronger than the TP MB
  through the middle of the set. Figures are the men's standard right-handed
  steel build.
