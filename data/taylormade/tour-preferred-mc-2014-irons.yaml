faq:
  - q: "What is the loft of a TaylorMade Tour Preferred MC (2014) 7-iron?"
    a: "The 2014 Tour Preferred MC 7-iron has a loft of 34 degrees, a lie of 62.5 degrees and a steel-shaft length of 36.75 inches."
  - q: "Are the 2014 Tour Preferred MC irons forged?"
    a: "Partly. The 8-iron, 9-iron and pitching wedge are forged, while the 3- through 7-irons are cast so a Speed Pocket could be milled into the sole and filled with a 3M polyurethane."
  - q: "How do the 2014 TP MC lofts compare with the TP MB and TP CB?"
    a: "The MC sits between them: its 34-degree 7-iron is one degree stronger than the MB's 35 but 1.5 degrees weaker than the CB's 32.5, and its 47-degree pitching wedge matches the MB against the CB's 46."
  - q: "What shaft did the 2014 Tour Preferred MC come with?"
    a: "The stock shaft was the KBS Tour in steel, offered in regular, stiff and X flexes, with a Golf Pride Tour Velvet grip."
