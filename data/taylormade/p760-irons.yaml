faq:
  - q: "What is the loft of a TaylorMade P760 7-iron?"
    a: "The TaylorMade P760 7-iron has a loft of 33 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.00 inches."
  - q: "When were TaylorMade P760 irons made?"
    a: "The P760 was introduced in 2018 and stayed in the range until the P770 took over that slot in 2020."
  - q: "Is the TaylorMade P760 hollow?"
    a: "Only in part. The 3 to 7 irons are hollow with a thin 4140 face and SpeedFoam inside; the 8-iron through wedges are solid forged cavity backs."
  - q: "How do P760 lofts compare with the P790?"
    a: "The P760 is about three degrees weaker through the set — 33 degrees at the 7-iron against the P790's 30.5, and 46 at the pitching wedge against 45 — at the same lengths."
