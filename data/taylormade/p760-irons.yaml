description: >
  The P760 is a progressive set: the 3 to 7 irons are hollow-bodied with a thin
  4140 face and internal SpeedFoam, while the 8-iron through wedges are solid
  forged cavity backs, so the long irons launch like a distance iron and the
  scoring clubs behave like a players iron. Tungsten sits low in the toe of the
  long irons. Lofts are traditional for the players category, 33 degrees at the
  7-iron and 46 at the pitching wedge, which puts it three degrees weaker than
  the P790 of the same period. Figures are the men's standard steel build.
