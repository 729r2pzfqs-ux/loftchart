faq:
  - q: "What is the loft of a TaylorMade P7MC (2023) 7-iron?"
    a: "The 2023 P7MC 7-iron has a loft of 34 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.00 inches."
  - q: "Did the P7MC lofts change between the 2020 and 2023 models?"
    a: "No. Both generations run 20, 23, 26, 30, 34, 38, 42.5 and 47 degrees from 3-iron to pitching wedge, with the same lies, lengths and offsets. The published swing weight is one point lighter on the 2023 model, at D2 through the 9-iron and D3 in the pitching wedge."
  - q: "Are the 2023 P7MC and P7MB lofts the same?"
    a: "Yes. In the 2023 generation the two share one loft, lie and length chart, so they can be mixed in a combo set without a loft jump. The P7MB has less offset, from 1.9mm at the 3-iron to 1.4mm at the pitching wedge against 2.9mm to 1.5mm on the P7MC."
  - q: "What is the pitching wedge loft on the 2023 P7MC?"
    a: "47 degrees. The set runs 3-iron through pitching wedge, with no stock approach or gap wedge."
