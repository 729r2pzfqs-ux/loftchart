description: >
  The second-generation P7MC is TaylorMade's forged tour cavity back, announced
  on 6 December 2022 alongside a new P770 and P7MB and sold as the 2023 model.
  The loft, lie, length and offset chart carries over unchanged from the 2020
  P7MC — a 34-degree 7-iron and a 47-degree pitching wedge — but the standard
  swing weight drops a point, to D2 through the 9-iron and D3 in the pitching
  wedge. The set runs 3-iron through pitching wedge with no stock gap wedge.
  Figures are the men's standard right-handed steel build.
