faq:
  - q: "What is the loft of a TaylorMade P7TW 7-iron?"
    a: "The retail P7TW 7-iron has a loft of 35 degrees, with a 61.5-degree lie and a 37-inch steel-shaft length. Tiger Woods's personal 7-iron is bent to 36 degrees."
  - q: "Are the retail P7TW irons the same specs Tiger Woods plays?"
    a: "The heads are the same, but the retail set ships at standard lofts while Tiger's personal set is bent weaker — 22.5, 25.5, 29, 32.5 and 36 degrees from 3-iron to 7-iron against the retail 21, 24, 27, 31 and 35. Buyers can order Tiger's lofts through the custom program."
  - q: "Is the TaylorMade P7TW still available?"
    a: "Yes. It launched on 1 May 2019 at $1,999.99 and has stayed in TaylorMade's custom-order line ever since, sold 3-iron through pitching wedge in right hand only."
  - q: "What shaft comes standard in the P7TW?"
    a: "The True Temper Dynamic Gold Tour Issue S400 in stiff flex, with a Golf Pride Tour Velvet Full Cord grip — the same shaft and grip Tiger Woods uses."
