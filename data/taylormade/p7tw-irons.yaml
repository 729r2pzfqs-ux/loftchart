description: >
  The P7TW is the production version of the muscleback blade TaylorMade
  co-designed with Tiger Woods, announced in April 2019 in the wake of his
  Masters win and at retail from 1 May 2019 at $1,999.99 for the set. Each head
  is forged from 1025 carbon steel with a milled sole — the Milled Grind process
  removing head-to-head variance in sole geometry — internal tungsten weighting,
  a long blade length, thin top line and progressive face height shaped to
  Woods's specification. It is sold 3-iron through pitching wedge, right hand
  only, through TaylorMade's custom program, with the True Temper Dynamic Gold
  Tour Issue S400 the stock shaft. One point of confusion: the retail set uses
  standard lofts, which are not Tiger's personal specs — his own set is bent
  weaker (for example 36 degrees at the 7-iron against the retail 35, and 22.5
  at the 3-iron against 21). The model has remained in TaylorMade's custom line
  ever since, outliving the P7MB and P7MC generations launched after it. Figures
  below are the standard right-handed steel build; the pitching wedge offset is
  omitted because the two retailer spec tables consulted disagreed on it.
