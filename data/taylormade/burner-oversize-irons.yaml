description: >
  The Burner Oversize (also sold as the Burner Bubble Oversize) was TaylorMade's
  hugely popular mid-1990s game-improvement iron, built around the copper-coloured
  Bubble graphite shaft that concentrates weight below the grip for faster swings.
  The oversized cast cavityback head carries progressive offset, a high moment of
  inertia and a low centre of gravity, and the set runs 2-iron through lob wedge with
  a 33-degree 7-iron and 45-degree pitching wedge. Specs below are the men's standard
  build with the stock Bubble graphite shaft, per TaylorMade's own vintage archive;
  the Rifle steel option played 0.5 inches shorter per club.
