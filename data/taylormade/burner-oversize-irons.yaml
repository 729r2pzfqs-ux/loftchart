faq:
  - q: "What is the loft of a TaylorMade Burner Oversize 7-iron?"
    a: "The TaylorMade Burner Oversize 7-iron has a loft of 33 degrees, with a 62.5-degree lie and a 37-inch length with the stock Bubble graphite shaft (36.5 inches in steel)."
  - q: "What is the Bubble shaft on the Burner Oversize irons?"
    a: "The Bubble is TaylorMade's signature 1990s graphite shaft, with a widened, hollow section just below the grip that moves weight up the shaft to reduce deflection at impact and make the club easier to swing fast. Flexes ran from L-60 for slower swings to TS-100 tour stiff, with a Rifle stepless steel shaft as the alternative."
  - q: "What clubs were available in the Burner Oversize set?"
    a: "The range ran from a 19-degree 2-iron through a 60-degree lob wedge, including a 50-degree attack wedge and 55-degree sand wedge, so a full 12 clubs were offered."
