faq:
  - q: "What is the loft of a TaylorMade P790 (2025) 7-iron?"
    a: "The 2025 P790 7-iron has a loft of 30 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.00 inches — half a degree stronger than the 30.5-degree 7-iron used by every previous P790 generation."
  - q: "Did the P790 lofts change for 2025?"
    a: "Yes, for the first time in the line's history. The 2017 through 2023 generations all used the same chart; the 2025 model strengthens most of the set — the 4-iron goes from 21 to 20 degrees, the 7-iron from 30.5 to 30, the 9-iron from 40 to 39 and the pitching wedge from 45 to 44 — and drops the 3-iron from the published range."
  - q: "What is the difference between the 2023 and 2025 P790?"
    a: "The 2025 model introduces a stronger 4340M forged face that allows a sweet spot up to 24 percent larger, revises the sole geometry, and changes the lofts for the first time in the line. It also moved the launch from the traditional late-summer window to spring, reaching retail in March 2025."
  - q: "When was the 2025 TaylorMade P790 released?"
    a: "TaylorMade announced it on 18 February 2025, with preorders the same day and retail on 13 March 2025 — about six months earlier in the cycle than the August-September windows of previous generations."
