description: >
  The fifth-generation P790 is the first in the line to change the loft chart:
  after four generations of 30.5 degrees at the 7-iron and 45 at the pitching
  wedge, the 2025 model moves to 30 and 44, drops the 3-iron from the published
  range, and starts the set at a 20-degree 4-iron. The face is a new 4340M forged
  material TaylorMade says is 20 percent stronger than before, allowing a thinner
  face and a sweet spot up to 24 percent larger on the 7-iron, with SpeedFoam Air
  behind it and the FLTD CG tungsten progression keeping the centre of gravity
  lowest in the long irons and rising through the set. The release timing is also
  new: TaylorMade announced the irons on 18 February 2025 with retail on 13 March,
  moving the P790's two-year cycle from its traditional late-summer window to
  spring, so a launch that would previously have arrived in August 2025 came six
  months early. The stock US set is 4-PW with a 49-degree approach wedge
  available. Figures below are the men's standard steel build; offset was not
  published in the sources consulted and is omitted rather than estimated.
