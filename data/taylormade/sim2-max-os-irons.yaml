faq:
  - q: "What is the loft of a TaylorMade SIM2 Max OS 7-iron?"
    a: "The SIM2 Max OS 7-iron has a loft of 27 degrees, with a 63-degree lie and a 37.25-inch steel-shaft length."
  - q: "What is the difference between the SIM2 Max and SIM2 Max OS irons?"
    a: "The OS is the oversized model: a bigger head, a wider chamfered sole, noticeably more offset and lofts at least a degree stronger through most of the set — 27 degrees at the 7-iron against 28.5, and a 42-degree pitching wedge against 43.5."
  - q: "What replaced the SIM2 Max OS irons?"
    a: "The 2022 TaylorMade Stealth iron. TaylorMade consolidated the SIM2 Max and SIM2 Max OS into a single Stealth model rather than continuing a separate oversized version."
  - q: "What wedges were available for the SIM2 Max OS?"
    a: "Beyond the 42-degree pitching wedge, the set extended to a 48-degree approach wedge, a 54-degree sand wedge and a 59-degree lob wedge."
