description: >
  The SIM2 Max OS is the oversized companion to the 2021 SIM2 Max, with a
  wider chamfered sole, a larger head, more offset and lofts at least a degree
  stronger through most of the set — a 27-degree 7-iron and a 42-degree
  pitching wedge against the standard model's 28.5 and 43.5. It shares the
  Cap Back construction and ECHO Damping System of the SIM2 Max, and its long
  irons use a shorter face height to push the centre of gravity even lower.
  For 2022 TaylorMade consolidated the Max and Max OS into the single Stealth
  iron. Figures are the men's standard right-handed steel build.
