description: >
  The MG4 (Milled Grind 4) is the 2023 generation of TaylorMade's tour wedge
  line, announced on 15 August 2023 and at retail from 8 September 2023 until
  the fully forged MG5 replaced it in 2025. Its signature addition is Spin
  Tread technology — tire-inspired laser etching between the grooves that
  channels moisture on wet shots — on the same raw-face, milled-sole platform
  as the MG3. The matrix runs 23 loft/bounce/grind combinations from 46 to 60
  degrees across seven grinds, including the two Tiger Woods grind models at
  56 and 60 degrees. The retail finish is Tour Satin Chrome; the 46- and
  48-degree SB, 54-degree HB and 58-degree HB combinations were custom-order
  only, and the MyMG4 program added black, aged copper and raw finishes.
grinds:
  - code: SB
    name: SB Grind (Standard Bounce)
    description: >
      All-around performance that prevents excessive digging and lets the
      head glide through the turf — the grind offered at every loft from
      46 to 60 degrees.
  - code: SBC
    name: SBC Grind (Standard Bounce C)
    description: >
      A C-grind take on the standard sole with increased versatility for
      players who manipulate face angles, without giving up bounce
      performance.
  - code: LB
    name: LB Grind (Low Bounce)
    description: >
      Low leading edge for added versatility and shot-making in firm
      conditions.
  - code: LBV
    name: LBV Grind (Low Bounce V)
    description: >
      V-shaped low-bounce sole for skilled players with a shallow attack
      angle who open and shut the face around the greens.
  - code: HB
    name: HB Grind (High Bounce)
    description: >
      TaylorMade's standard high-bounce sole, playable enough for skilled
      golfers — Rory McIlroy kept an HB 60 in play depending on conditions.
  - code: HBW
    name: HBW Grind (High Bounce Wide)
    description: >
      High bounce with an increased sole width for improved playability,
      at its best from sand.
  - code: TW
    name: TW Grind (Tiger Woods)
    description: >
      Tiger Woods's grinds sold as their own models: the 56 is a dual sole
      with heavy heel relief, the 60 carries extreme leading-edge bounce
      with a shaved heel.
