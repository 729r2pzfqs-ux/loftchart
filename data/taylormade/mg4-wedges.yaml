faq:
  - q: "What lofts does the TaylorMade MG4 come in?"
    a: "The MG4 was sold from 46 to 60 degrees in 2-degree steps — 23 loft, bounce and grind combinations, with the 46- and 48-degree heads offered through custom order only."
  - q: "What grinds does the TaylorMade MG4 offer?"
    a: "Seven: SB standard bounce at every loft, SBC (58-60), LB low bounce (56-60), LBV (58-60), HB high bounce (54-60), the wide-sole HBW (58-60) and the Tiger Woods TW grind at 56 and 60 degrees."
  - q: "What is Spin Tread on the MG4?"
    a: "Tire-inspired laser etching between the grooves on the raw face. It gives moisture an escape route in wet conditions, which TaylorMade credits with more consistent spin on partial shots."
  - q: "When was the TaylorMade MG4 discontinued?"
    a: "The MG4 ran from September 2023 until 2025, when the fully forged MG5 replaced it at the top of TaylorMade's wedge line."
