faq:
  - q: "What is the loft of a TaylorMade rac CB TP 7-iron?"
    a: "The TaylorMade rac CB TP (rac Forged TP) 7-iron has a loft of 36 degrees, with a 62-degree lie and a 36.75-inch steel-shaft length."
  - q: "Is the rac CB TP the same club as the rac Forged TP?"
    a: "Yes. TaylorMade's own sell sheets call the 2005 model the rac Forged TP, while retailers and the second-hand market commonly list it as the rac CB TP to distinguish it from the rac MB TP blade that followed in 2006."
  - q: "Were the rac CB TP irons available left-handed?"
    a: "No, TaylorMade produced the model in right-hand only, in a 2-iron through pitching wedge range with Dynamic Gold steel shafts."
