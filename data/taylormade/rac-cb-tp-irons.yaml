description: >
  Sold by TaylorMade as the rac Forged TP, this 2005 iron is widely known as the rac
  CB TP: a coin-forged S25C muscle-cavity developed with tour input, with milled face,
  cavity and grooves, larger rac Feel Pockets for vibration control and a thin,
  tour-bevelled sole. It combines keen workability with modest forgiveness and carries
  fully traditional lofts, with a 36-degree 7-iron and 48-degree pitching wedge across
  the 2-iron to pitching wedge, right-hand-only range. Specs below are the standard
  Dynamic Gold steel build; TaylorMade published no offset figures for this model.
