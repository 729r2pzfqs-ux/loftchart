description: >
  The Qi Max HL is the high-launch, lightweight companion to the 2026 Qi Max,
  replacing the Qi HL in the same role: it shares the Qi Max's lies and lengths
  but weakens the lofts by up to three degrees — 31 degrees at the 7-iron against
  28 — and lightens the whole build, with lighter head, shaft and grip bringing
  the steel swing weight down to C9 against the Qi Max's D1. The head is a larger,
  more offset profile than the Qi Max, with a thicker top line, and it carries the
  same Cap Back construction, ECHO Damper, Thru-Slot Speed Pocket and FLTD CG
  progression. The published set runs from a 23.5-degree 5-iron to a 55-degree
  sand wedge with 5-PW the stock build, and it is one of the few TaylorMade irons
  offered in a dedicated women's build with its own swing weights. It launched
  alongside the Qi Max, with presale on 8 January 2026 and retail on 29 January
  2026. Offsets are converted from TaylorMade's published millimetre figures, and
  swing weights below are the men's steel build (graphite runs C7, the women's
  build C0-C1).
