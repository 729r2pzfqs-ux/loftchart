faq:
  - q: "What is the loft of a TaylorMade Qi Max HL 7-iron?"
    a: "The TaylorMade Qi Max HL 7-iron has a loft of 31 degrees, with a 63-degree lie and a 37.25-inch steel-shaft length — three degrees weaker than the standard Qi Max 7-iron."
  - q: "What is the difference between the TaylorMade Qi Max and Qi Max HL?"
    a: "HL stands for high launch. Lies and lengths are the same, but every Qi Max HL loft is weaker — up to three degrees, with 31 against 28 at the 7-iron — and the head, shaft and grip are all lighter, dropping the steel swing weight from D1 to C9. The HL head is also larger, with a thicker top line and more offset."
  - q: "What clubs come in a stock TaylorMade Qi Max HL set?"
    a: "The stock set is 5-iron through pitching wedge. The published range runs from a 23.5-degree 5-iron to a 55-degree sand wedge, with the 50-degree approach wedge and the sand wedge sold separately — there is no 4-iron or lob wedge."
  - q: "Is there a women's version of the Qi Max HL?"
    a: "Yes. TaylorMade publishes a dedicated women's build with its own swing weights (C0 through the set, C1 in the sand wedge) and a 45-gram L-flex TaylorMade x KBS Reax HL graphite shaft."
