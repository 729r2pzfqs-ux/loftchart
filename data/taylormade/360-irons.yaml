faq:
  - q: "What is the loft of a TaylorMade 360 7-iron?"
    a: "The TaylorMade 360 7-iron has a loft of 34 degrees, with a 62.5-degree lie and a 37-inch graphite-shaft length (36.75 inches in steel)."
  - q: "Is the TaylorMade 360 a forgiving iron?"
    a: "Yes. It was the largest and most offset head in the 2001 300 series, aimed at golfers who wanted maximum forgiveness; the 320 offered a mid-size head and the 300 Forged a compact players head."
  - q: "What wedges were available for the TaylorMade 360?"
    a: "Beyond the 46-degree pitching wedge, TaylorMade offered a 51-degree attack wedge, a 55-degree sand wedge and a 60-degree lob wedge in the same head style."
