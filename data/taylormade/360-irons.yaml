description: >
  The 360 was the oversize game-improvement member of TaylorMade's 300 series, the
  largest of the three head sizes offered alongside the 300 Forged and 320. It carries
  the most offset in the range - 7.5 millimetres in the 2-iron - with lofts about a
  degree stronger than the 320 through the middle of the set, a 34-degree 7-iron and a
  46-degree pitching wedge. The stock set ran 3-PW with a 2-iron and AW, SW and LW
  available. Lengths below are the published graphite-shaft build; steel shafts played
  0.25 inches shorter except in the wedges, which were the same length in both.
