faq:
  - q: "What lofts do the TaylorMade Qi4D Rescues come in?"
    a: "The core Qi4D Rescue comes in 17, 19, 22 and 25 degrees; the Qi4D Max Rescue in 20, 23, 26, 30 and 34; and the Qi4D Max Lite Rescue in 23, 26, 30 and 34."
  - q: "Is the TaylorMade Qi4D Rescue adjustable?"
    a: "The core Qi4D Rescue is — it carries a 3 degree loft sleeve (1.5 degrees each way) plus an 8 gram TAS sole weight. The Max and Max Lite Rescues are bonded and adjust only through the TAS weight."
  - q: "What is the difference between the Qi4D Rescue and the Qi4D Max Rescue?"
    a: "The core Rescue is the more compact, adjustable head in 17-25 degrees. The Max is the bonded high-MOI head sold about one club number weaker at each loft and extending to a 34 degree 7-Rescue, with the Max Lite repeating that shape in a lighter build."
