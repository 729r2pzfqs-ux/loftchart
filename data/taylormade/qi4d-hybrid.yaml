description: >
  The Qi4D Rescue family launched with the Qi4D woods — pre-orders from
  8 January 2026, retail from 29 January — at $299.99 per head across all
  three models. The core Qi4D Rescue is the adjustable head with a 3° loft
  sleeve and an 8 g Trajectory Adjustment System (TAS) sole weight, in
  17-25°. The Qi4D Max Rescue is the bonded high-MOI head, numbered like a
  wood set from a 20° 3-Rescue to a 34° 7-Rescue, and the Qi4D Max Lite
  Rescue repeats the Max shape in a lighter build without the 20° head.
variants:
  - name: Qi4D Rescue
    description: >
      The core adjustable Rescue with the 3° loft sleeve and 8 g TAS weight,
      in four lofts from 17° to 25°. The 17° 2-Rescue is right-hand only.
  - name: Qi4D Max Rescue
    description: >
      The bonded forgiveness head, sold one club number weaker than the core
      Rescue at each loft and out to a 34° 7-Rescue. The 30° and 34° heads
      are right-hand only.
  - name: Qi4D Max Lite Rescue
    description: >
      The Max geometry in a lighter head, shaft and grip build for moderate
      swing speeds, in four bonded lofts from 23°; the 30° and 34° heads are
      right-hand only.
