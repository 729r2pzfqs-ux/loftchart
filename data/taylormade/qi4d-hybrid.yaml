hosel:
  system: "3° Loft Sleeve (Qi4D Rescue only)"
  loft_range: "±1.5°"
  positions: 12
  lie_effect: >
    As on the fairway sleeve, lie only moves upright from standard.
  face_note: >
    Lowering loft opens the face slightly and raising it closes it.
  notes: >
    Only the core Qi4D Rescue carries the sleeve — the Max and Max Lite
    Rescues are bonded and play at their stamped loft. TaylorMade publishes
    the Rescue sleeve's range (1.5° each way) rather than a Rescue-specific
    position-by-position chart, so no settings table is reproduced here. On
    the sleeved core heads lie is published as a range (56-60° on the 17°
    head, rising with loft), so those rows carry no lie column.
