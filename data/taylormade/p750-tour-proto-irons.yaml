description: >
  The P750 Tour Proto was the most compact iron in TaylorMade's first P-Series,
  announced in January 2017 alongside the P770 after prototypes appeared on
  tour in late 2016. It is forged from 1025 carbon steel on a 2000-ton press,
  with a thin topline, minimal progressive offset, a narrow sole with a tight
  leading edge, and a tungsten weight in the 3- to 7-irons to centre the CG.
  Lofts are traditional — a 34-degree 7-iron and 47-degree pitching wedge —
  and the head sits 2 mm shorter heel-to-toe than the P770. The P760 replaced
  both models in October 2018. Specs below are the men's standard steel-shaft
  build.
