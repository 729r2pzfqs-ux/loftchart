faq:
  - q: "What is the loft of a TaylorMade P750 Tour Proto 7-iron?"
    a: "The TaylorMade P750 Tour Proto 7-iron has a loft of 34 degrees, with a 62.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "What is the difference between the P750 Tour Proto and the 2017 P770?"
    a: "The P750 is the more compact head — about 2 mm shorter heel-to-toe with a thinner topline and less offset — and its lofts are around a degree weaker through the mid irons: 34 degrees at the 7-iron against 33, and a 47-degree pitching wedge against 46."
  - q: "Is the P750 Tour Proto forged?"
    a: "Yes. The head is forged from 1025 carbon steel using a multi-step process on a 2000-ton press, with a tungsten weight added in the 3- through 7-irons to centre the CG."
  - q: "What replaced the P750 Tour Proto?"
    a: "The TaylorMade P760, announced in October 2018, replaced both the P750 Tour Proto and the P770 in the players line."
