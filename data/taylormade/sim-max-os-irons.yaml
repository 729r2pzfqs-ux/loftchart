description: >
  The SIM Max OS is the oversized companion to the 2020 SIM Max, with a larger
  face, a wider sole and lofts around 1.5 degrees stronger through most of the
  set — a 27-degree 7-iron and a 42-degree pitching wedge against the standard
  model's 28.5 and 43.5. It shares the Speed Bridge structure, ECHO Damping
  System, Thru-Slot Speed Pocket and progressive Inverted Cone Technology of
  the SIM Max, and its long irons carry noticeably more offset. It was replaced
  by the SIM2 Max OS in 2021, which kept the lofts, lies and lengths unchanged.
  Specs below are the men's standard steel-shaft build.
