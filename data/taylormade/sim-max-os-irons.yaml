faq:
  - q: "What is the loft of a TaylorMade SIM Max OS 7-iron?"
    a: "The TaylorMade SIM Max OS 7-iron has a loft of 27 degrees, with a 63-degree lie and a 37.25-inch steel-shaft length."
  - q: "What is the difference between the SIM Max and SIM Max OS irons?"
    a: "The OS is the oversized model: a bigger face, a wider sole, more offset and lofts around 1.5 degrees stronger through most of the set — 27 degrees at the 7-iron against 28.5, and a 42-degree pitching wedge against 43.5."
  - q: "Are the SIM Max OS and SIM2 Max OS lofts the same?"
    a: "Yes. The 2021 SIM2 Max OS kept the SIM Max OS loft ladder unchanged, from the 18-degree 4-iron through the 27-degree 7-iron to the 59-degree lob wedge, along with the same lies and lengths."
  - q: "What wedges were available for the SIM Max OS?"
    a: "Beyond the 42-degree pitching wedge, the set extended to a 48-degree approach wedge, a 54-degree sand wedge and a 59-degree lob wedge."
