faq:
  - q: "What is the loft of a TaylorMade 320 7-iron?"
    a: "The TaylorMade 320 7-iron has a loft of 35 degrees, with a 62-degree lie and a 37-inch graphite-shaft length (36.75 inches in steel)."
  - q: "What is the difference between the TaylorMade 300, 320 and 360 irons?"
    a: "All three launched together in 2001 as the 300 series. The 300 Forged is the compact players head, the 320 is the mid-size cast cavityback, and the 360 is the largest, most offset game-improvement head."
  - q: "What shafts did the TaylorMade 320 come with?"
    a: "The stock steel shaft was the Royal Precision Rifle Flighted Constant Weight, with TaylorMade's Lite Constant Weight graphite as the stock graphite option."
