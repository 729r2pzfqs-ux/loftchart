description: >
  The 320 was the mid-size member of TaylorMade's 300 series, sold alongside the compact
  300 Forged and the oversize 360 so that golfers could pick a head size rather than a
  different technology. The cast stainless cavityback carries moderate offset and a
  progressive centre of gravity through the set, with a 35-degree 7-iron and 47-degree
  pitching wedge. The stock set ran 3-PW with a 2-iron and four wedges through AW, SW and
  LW available. Lengths below are the published graphite-shaft build; steel shafts played
  0.25 inches shorter except in the wedges, which were the same length in both.
