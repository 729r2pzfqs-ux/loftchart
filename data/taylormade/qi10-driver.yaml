  - "Note: TaylorMade publishes lie as an adjustable range per head (Qi10 56-60°, LS 54-58°, Max 58-62°) rather than a single figure, so no static lie column is charted. The Qi10 Max stock length is 45.5 inches on 2nd Swing's spec table while some individual listings show 45.75 — the spec-table figure is charted."
faq:
  - q: "What lofts does the TaylorMade Qi10 come in?"
    a: "The core Qi10 comes in 9, 10.5 and 12 degrees (12 right-hand only); the Qi10 LS in 8, 9 and 10.5 (8 right-hand only); and the Qi10 Max in 9, 10.5 and 12 in both hands."
  - q: "What is the Qi10 loft settings chart?"
    a: "The Qi10 uses TaylorMade's 12-position 4 degree Loft Sleeve: up to 2 degrees of loft either way in 0.75 degree notches, with the face closing as loft is added and opening as it is removed, plus an UPRT setting that keeps the stated loft at 4 degrees upright lie."
  - q: "Was the Qi10 Max really a 10K driver?"
    a: "Yes — the Qi10 Max was TaylorMade's first head to reach 10,000 g·cm² of combined moment of inertia, which is where the 10K branding came from. The trade-off is a fixed, rear-heavy weight layout with no movable weights."
  - q: "Is the TaylorMade Qi10 still in production?"
    a: "No — the Qi35 replaced it in January 2025 and the Qi4D followed in 2026, so the Qi10 is a closeout and used-market buy. Its sleeve and shafts interchange with both newer generations."
