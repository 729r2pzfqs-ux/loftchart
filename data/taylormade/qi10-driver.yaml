description: >
  The Qi10 is TaylorMade's 2024 driver family and the one that put "10K" into
  the marketing lexicon: the Qi10 Max was the first TaylorMade head to reach
  10,000 g·cm² of combined MOI, sold as the most forgiving driver in the
  company's history at launch. The whole line moved to a near-full carbon
  body, with the Infinity Carbon Crown covering 97% of the crown area around
  the third-generation 60X Carbon Twist Face. The core Qi10 is the high-MOI
  all-rounder, the LS adds an 18 g sliding sole weight for bias tuning at
  lower spin, and the Max is the straight-line forgiveness head. The Qi35
  replaced the family in 2025, and on the used market the Qi10 generation is
  the current sweet spot of price against technology.
variants:
  - name: Qi10
    head_cc: 460
    description: >
      The core head: high MOI, mid-high launch, mid-low spin and neutral
      bias with fixed rear weighting. The 12° head is right-hand only.
  - name: Qi10 LS
    head_cc: 460
    description: >
      The low-spin head with an 18 g sliding sole weight for draw, neutral or
      fade bias; mid launch for stronger drivers of the ball. 8° is
      right-hand only.
  - name: Qi10 Max
    head_cc: 460
    description: >
      The 10K head — the first TaylorMade driver to reach 10,000 g·cm²
      combined MOI. Maximum stability with neutral bias; also sold in a
      women's build with the Speeder NX TCS 40 at 44 inches.
