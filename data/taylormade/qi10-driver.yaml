sources:
  - "2nd Swing Qi10, Qi10 LS and Qi10 Max spec tables (lofts incl. right-hand-only 8° LS and 12° core head, lie ranges, lengths, stock shafts, 18 g LS slider, 10K MOI), https://www.2ndswing.com/golf-clubs/drivers/taylormade-qi10-driver/, accessed October 2026"
