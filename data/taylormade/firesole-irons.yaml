description: >
  The Firesole expanded TaylorMade's multi-material experiments into a full iron set:
  titanium long-iron heads carry tungsten sole weights for launch and forgiveness, the
  mid irons are steel with tungsten heel and toe weighting to stretch the sweet spot,
  and the short irons are nickel for softer feel. Lofts are strong for the era, with a
  33-degree 7-iron and 45-degree pitching wedge across a 3-SW range plus a right-hand
  only 50-degree attack wedge. Firesole Tour and Firesole Forged variants were sold
  alongside it. Lengths below are the Rifle steel build from TaylorMade's own table; the
  Bubble graphite option played 0.5 inches longer per club.
