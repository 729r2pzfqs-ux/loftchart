faq:
  - q: "What is the loft of a TaylorMade Firesole 7-iron?"
    a: "The Firesole 7-iron has a loft of 33 degrees, with a 62.5-degree lie and a 36.5-inch Rifle steel length (37 inches with the Bubble graphite shaft)."
  - q: "What materials are TaylorMade Firesole irons made of?"
    a: "The set mixes three head materials: titanium long irons with tungsten sole weights for high launch, steel mid irons with tungsten heel-toe weights for stability, and nickel short irons for soft feel."
  - q: "Were there other Firesole iron models?"
    a: "Yes. TaylorMade also sold the more compact Firesole Tour and a Firesole Forged model for better players; the specs here are the standard game-improvement Firesole."
