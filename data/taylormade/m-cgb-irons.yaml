faq:
  - q: "What is the loft of a TaylorMade M CGB 7-iron?"
    a: "The M CGB 7-iron has a loft of 29.5 degrees, with a 63-degree lie and a 37-inch steel-shaft length."
  - q: "How do M CGB lofts compare with the 2017 M2?"
    a: "The pattern is unusual: the M CGB's long irons are weaker — a 20.5-degree 4-iron against the M2's 19 — to make them easier to launch, while its 9-iron through sand wedge are stronger, with a 43-degree pitching wedge."
  - q: "Why is the M CGB swing weight D0 across the set?"
    a: "TaylorMade built the M CGB as a lightweight distance iron with the Nippon N.S. Pro 840 stock steel shaft, targeting easy speed and the highest flight in the range, so the whole set is specified at D0."
  - q: "What does CGB stand for on TaylorMade irons?"
    a: "Center of Gravity Back. The name first appeared on the r7 CGB Max era of clubs and was revived for this 2017 iron, whose tungsten weighting pushes the CG low and deep."
