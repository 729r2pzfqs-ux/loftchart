description: >
  The M CGB revived TaylorMade's CGB (Center of Gravity Back) name in September
  2017 as a maximum-technology distance iron sold alongside the 2017 M1 and M2.
  Every head in the set — wedges included — carries face slots and a Speed
  Pocket over an ultra-thin face, with milled tungsten weights pushing the
  centre of gravity low and back for the highest peak flight of any TaylorMade
  iron of its era. Unusually, the long-iron lofts are weaker than the M2's
  while the scoring clubs are stronger, giving a 20.5-degree 4-iron, a
  29.5-degree 7-iron and a 43-degree pitching wedge on a lightweight build
  with a D0 swing weight throughout. Figures are the men's standard
  right-handed steel build.
