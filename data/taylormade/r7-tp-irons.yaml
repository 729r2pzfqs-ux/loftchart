description: >
  The r7 TP brought TaylorMade's Inverted Cone face technology to a compact tour-shaped
  head, replacing the forged rac CB TP as the better-player model above the standard r7.
  A shallow cavity keeps the centre of gravity high, offset is minimal with a flatter lie
  than the mainstream r7, and a dampening web of soft aluminium sits in the cavity for
  feel. Lofts are traditional, with a 35-degree 7-iron and 47-degree pitching wedge
  across a 2-SW range. Right-handed sets shipped from September 2006 and left-handed from
  October; TaylorMade's Irons Legacy timeline files the model under 2007, its marketing
  model year. Specs below are the standard Dynamic Gold steel build.
