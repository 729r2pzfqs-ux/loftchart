faq:
  - q: "What is the loft of a TaylorMade r7 TP 7-iron?"
    a: "The r7 TP 7-iron has a loft of 35 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "What is the difference between the r7 and r7 TP irons?"
    a: "The r7 TP uses a smaller tour-shaped head with a shallow cavity, minimal offset, flatter lie angles and traditional lofts (35-degree 7-iron versus 32 on the r7), aimed at better players who want workability while keeping Inverted Cone face technology."
  - q: "What shafts did the r7 TP come with?"
    a: "The stock shaft was True Temper Dynamic Gold steel in R3, S3 and X1 flexes; TaylorMade's re*ax TP 115 graphite was available through custom order only."
