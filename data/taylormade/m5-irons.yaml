faq:
  - q: "What is the loft of a TaylorMade M5 7-iron?"
    a: "The TaylorMade M5 7-iron has a loft of 30 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.50 inches."
  - q: "When were TaylorMade M5 irons made?"
    a: "The M5 was the 2019 model, sold alongside the M6, and was replaced by the SIM family in 2020."
  - q: "Why are TaylorMade M5 irons longer than the M3?"
    a: "Partly build, partly measurement. TaylorMade switched from pin-length to ground-plane measurement in November 2018, and the M5 set is genuinely built longer as well — 37.50 inches at the 7-iron against 36.75 on the M3."
  - q: "What is the Speed Bridge on the TaylorMade M5?"
    a: "A rib that spans the back cavity and ties the top line to the sole. It stiffens the body so the thin face and the Speed Pocket sole slot can flex for ball speed without producing the hollow sound that unsupported slots create."
