description: >
  The M5 iron is the compact model of TaylorMade's 2019 M pair, sold beside the
  larger M6 and sharing its Speed Bridge — a stiffening rib across the back of
  the cavity that lets the face and Speed Pocket flex without the harsh sound.
  Lofts are broadly the M3's, with a 30-degree 7-iron, but the whole set is
  built noticeably longer: 37.50 inches at the 7-iron against the M3's 36.75.
  Lengths use TaylorMade's ground-plane measurement, adopted in November 2018.
