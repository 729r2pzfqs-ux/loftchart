sources:
  - "2ndswing.com TaylorMade 2023 P770 Iron Set specification table — loft, lie, length, offset (in millimetres) and swing weight for the 3-iron through approach wedge, the 4-PW stock make-up, the KBS Tour stock shaft and the Golf Pride Z-Grip 360 grip. Offset is converted to inches here."
