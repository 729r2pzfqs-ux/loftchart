description: >
  The 2023 P770 is the compact hollow body that sits between the P7MC blade-ish
  cavity and the P790 distance iron. Against the previous P770 it cuts offset in
  the long irons to suit a better player's eye, keeps the thin forged 4140 face
  over a Speed Pocket, and uses the FLTD CG progression so the centre of gravity
  is lowest in the long irons and rises into the scoring clubs. Lofts are two to
  three degrees weaker than the P790 through the set — 33 degrees at the 7-iron
  against 30.5. Figures are the men's standard right-handed steel build.
