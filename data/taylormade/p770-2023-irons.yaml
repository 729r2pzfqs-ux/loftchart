faq:
  - q: "What is the loft of a TaylorMade P770 (2023) 7-iron?"
    a: "The 2023 P770 7-iron has a loft of 33 degrees, a lie of 62.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "How do 2023 P770 lofts compare with the P790?"
    a: "The P770 is two to three degrees weaker through the set — 33 degrees at the 7-iron against the P790's 30.5, and a 46-degree pitching wedge against 45 — at the same lengths."
  - q: "What changed between the 2020 and 2023 P770?"
    a: "The 2023 model cuts offset in the long irons for a cleaner look at address and adopts the FLTD CG progression, while keeping the forged hollow-body construction with a thin forged 4140 face."
  - q: "What is the pitching wedge loft on the 2023 P770?"
    a: "46 degrees, with a 51-degree approach wedge below it."
