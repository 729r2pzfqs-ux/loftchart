description: >
  The Qi4D is TaylorMade's 2026 driver family, on pre-order from 8 January and
  at retail from 29 January 2026 at $649.99. The headline change is material:
  the Qi4D Max and Max Lite swap the titanium chassis for a forged, machined
  7075 aircraft-grade aluminium body — TaylorMade's first modern non-titanium
  driver — while the core Qi4D and the LS keep a carbon-crowned titanium
  chassis. All four heads carry the fifth-generation 60X Carbon Twist Face,
  now with embedded reflective markers so a launch monitor can read the face
  without stickers, and the line introduces the REAX stock-shaft system
  co-developed with Mitsubishi, fitted by shaft rotation rate (HR/MR/LR)
  rather than flex alone. The core Qi4D gains a quad-weight Trajectory
  Adjustment System, making it the most fittable head TaylorMade has sold.
variants:
  - name: Qi4D
    head_cc: 460
    description: >
      The core all-around head and the most adjustable: a quad Trajectory
      Adjustment System with two 9 g and two 4 g movable weights tunes spin
      and shot bias. Mid spin, mid-high launch. The 8° and 12° heads are
      right-hand only.
  - name: Qi4D LS
    head_cc: 460
    description: >
      The lowest-spinning, most compact head for high swing speeds, with two
      TAS weights front and back for flight tuning. 8° is right-hand only.
  - name: Qi4D Max
    head_cc: 460
    description: >
      The first Max-family head with adjustable weighting (13 g and 4 g
      movable front-back) and the first with the forged 7075 aluminium body.
      Largest footprint in the line, high launch with a touch of draw bias.
  - name: Qi4D Max Lite
    head_cc: 460
    description: >
      The Max geometry in a lighter total package — a single 4 g weight, D0
      swing weight and a ~43 g REAX 40 shaft — for swing speeds under about
      90 mph.
