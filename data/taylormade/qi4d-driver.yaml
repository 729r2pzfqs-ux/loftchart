hosel:
  system: "4° Loft Sleeve"
  loft_range: "±2°"
  positions: 12
  lie_effect: >
    There is no flat setting — lie only moves upright, up to 4° at the UPRT
    position, and the loft settings themselves add up to 2° of upright lie.
  face_note: >
    Lowering loft opens the face and raising it closes it: about 1.5° per
    0.75° notch, up to 4° at the full ±2° setting.
  notes: >
    The sleeve is marked STD LOFT, HIGHER, UPRT and LOWER; the table lists all
    twelve stops in order around the dial. The same 4° Loft Sleeve has been
    used unchanged since the SIM generation, so sleeves and shafts
    interchange across Qi35, Qi10 and Stealth-era drivers.
