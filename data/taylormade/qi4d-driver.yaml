faq:
  - q: "What lofts does the TaylorMade Qi4D come in?"
    a: "The core Qi4D head comes in 8, 9, 10.5 and 12 degrees; the Qi4D LS in 8, 9 and 10.5; the Qi4D Max in 9, 10.5 and 12; and the Qi4D Max Lite in 10.5 and 12. The 8 degree heads and the core 12 degree head are right-hand only."
  - q: "How do you adjust the TaylorMade Qi4D driver?"
    a: "The Qi4D uses TaylorMade's 4 degree Loft Sleeve: twelve positions that move loft up to 2 degrees either way in 0.75 degree notches. Adding loft also closes the face up to 4 degrees and lowering it opens the face; the UPRT setting keeps the stated loft but sets lie 4 degrees upright."
  - q: "What is different about the Qi4D Max body?"
    a: "The Qi4D Max and Max Lite use a forged, machined 7075 aircraft-grade aluminium body instead of titanium — TaylorMade's first modern non-titanium driver. The Max is also the first Max head with movable weights, a 13 g and a 4 g port front and back."
  - q: "Is the Qi4D sleeve compatible with older TaylorMade drivers?"
    a: "Yes. The 4 degree Loft Sleeve is unchanged from previous generations, so shafts with Qi35, Qi10 or Stealth-era sleeves fit the Qi4D and the settings chart reads the same."
