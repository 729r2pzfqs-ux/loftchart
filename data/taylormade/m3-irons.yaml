faq:
  - q: "What is the loft of a TaylorMade M3 7-iron?"
    a: "The TaylorMade M3 7-iron has a loft of 30.5 degrees, a lie of 62.5 degrees and a steel-shaft length of 36.75 inches."
  - q: "When were TaylorMade M3 irons made?"
    a: "The M3 was the 2018 model, launched alongside the M4 and replaced by the M5 and M6 in 2019."
  - q: "What is the difference between the TaylorMade M3 and M4 irons?"
    a: "The M3 is the smaller, lower-offset head aimed at better players; the M4 is the oversized game-improvement model. The M3's 7-iron is 30.5 degrees against the M4's 30.5-degree equivalent at a longer build, and the M3 carries a shorter blade and thinner top line."
  - q: "What is the pitching wedge loft on the TaylorMade M3?"
    a: "45 degrees, with a 50-degree approach wedge and a 55-degree sand wedge available to complete the set."
