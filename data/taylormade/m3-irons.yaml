description: >
  The M3 is the compact half of TaylorMade's 2018 M pairing, sitting under the
  oversized M4 with a shorter blade, thinner top line and less offset. It uses
  the RIBCOR bars that lock the perimeter of the face to channel more energy
  into the centre, over a Speed Pocket sole slot, with tungsten low in the
  head. Lofts are strong for a better-player iron — 30.5 degrees at the 7-iron
  — and the set is built at 36.75 inches there, a quarter inch shorter than the
  P790 of the same period. Figures are the men's standard steel build.
