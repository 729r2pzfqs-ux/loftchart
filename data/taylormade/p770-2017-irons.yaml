description: >
  The original P770 launched TaylorMade's P-Series players range in 2017
  alongside the more compact P750 Tour Proto, after unnamed prototypes had
  surfaced on tour in late 2016. It is a solid forged 1025 carbon steel players
  cavity back — no relation in construction to the hollow-body irons that
  revived the name in 2020 — with a tungsten back bar in the 3 to 7 irons for a
  low, centred CG, a thin topline, progressive offset and a precision-milled
  face. Lofts are traditional for the category, 33 degrees at the 7-iron and a
  46-degree pitching wedge, over a 3-iron through approach wedge range.
  Figures are the men's standard right-handed steel build.
