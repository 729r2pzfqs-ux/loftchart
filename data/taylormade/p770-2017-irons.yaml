sources:
  - "TaylorMade official 2017 P770 Irons spec sheet PDF, taylormadegolf.com/on/demandware.static/-/Sites-TMaG-Library/default/docs/productspecs/2017/P770 Irons.pdf — supplied every loft, lie, offset, length and swing weight above, plus the KBS Tour FLT (S/X) stock steel shaft (graphite custom only) and the Golf Pride Tour Velvet 360 grip. Offset is published in millimetres (3.6 mm down to 1.6 mm) and converted to inches here."
  - "Note: bounce is not published on the manufacturer sheet and is omitted rather than estimated."
  - "Launch basis for year_introduced: unnamed Tour Proto prototypes were seen in play in November 2016 (2016 RSM Classic), the irons were announced as the P770 and P750 Tour Proto in January 2017 (thegolfnewsnet.com preview of 18 January 2017; golf.com first look), and the P770 reached retail on 31 March 2017 — so 2017 is the announcement year under the schema convention."
  - "Succession: TaylorMade announced the P760 on 15 October 2018 (newsroom.taylormadegolf.com press release), a progressive set that replaced both the P770 and the P750 Tour Proto in the players line, which sets year_discontinued and the successor field."
