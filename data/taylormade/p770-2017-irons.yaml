faq:
  - q: "What is the loft of a TaylorMade P770 (2017) 7-iron?"
    a: "The original 2017 P770 7-iron has a loft of 33 degrees, a lie of 62.5 degrees and a steel-shaft length of 36.75 inches."
  - q: "Is the 2017 P770 the same iron as the later P770 models?"
    a: "No. The original P770 is a solid forged 1025 carbon steel cavity back with a tungsten back bar; TaylorMade revived the name in 2020 for a hollow-body SpeedFoam design. Lengths also differ — the 2017 set is a quarter inch shorter through the set, 36.75 inches at the 7-iron against 37.00."
  - q: "What is the pitching wedge loft on the 2017 P770?"
    a: "The pitching wedge is 46 degrees, with a 51-degree approach wedge available below it."
  - q: "When was the original TaylorMade P770 made?"
    a: "It was announced in January 2017 after prototypes appeared on tour in late 2016, reached retail on 31 March 2017, and was replaced in October 2018 when the P760 took over from both the P770 and the P750 Tour Proto."
