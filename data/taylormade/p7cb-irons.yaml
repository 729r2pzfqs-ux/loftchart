faq:
  - q: "What is the loft of a TaylorMade P7CB 7-iron?"
    a: "The TaylorMade P7CB 7-iron has a loft of 33 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.00 inches."
  - q: "When did the TaylorMade P7CB come out?"
    a: "2024, as the forged cavity back in the P7 tour line alongside the P7MB muscleback."
  - q: "What is the difference between the P7CB and the P7MC?"
    a: "Both are forged tour cavity backs. The P7CB uses co-forged tungsten in the perimeter to hold the centre of gravity constant through the set and is forged under 2,000 tons of pressure with a milled face and grooves."
  - q: "What is the pitching wedge loft on the TaylorMade P7CB?"
    a: "46 degrees, with a 51-degree gap wedge available below it."
