description: >
  The P7CB is a compact tour cavity back, forged from 1025 carbon steel under
  what TaylorMade calls Compact Grain Forging at 2,000 tons, with a milled face
  and grooves. Co-forged tungsten in the perimeter holds the centre of gravity
  constant through the set rather than moving it, which is the opposite of the
  progressive-CG approach in the P790 and P770. Lofts are traditional for the
  category — 33 degrees at the 7-iron and 46 at the pitching wedge. Figures are
  the men's standard right-handed steel build.
