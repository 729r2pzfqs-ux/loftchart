description: >
  The P730 is the pure muscleback blade of TaylorMade's P-Series, announced in
  autumn 2017 as the evolution of the Tour Preferred MB blades of 2011 and
  2014, and played on tour by Rory McIlroy and Justin Rose. The 73 mm blade
  length gives the smallest profile in the range, with a thin topline, minimal
  offset and a horizontally milled channel in the muscle that separates mass
  vertically for higher inertia and trajectory control. Lofts are traditional —
  a 35-degree 7-iron and a 47-degree pitching wedge, identical to the TP MB it
  replaced. The P7MB took over the blade slot in 2020. Specs below are the
  men's standard steel-shaft build.
