faq:
  - q: "What is the loft of a TaylorMade P730 7-iron?"
    a: "The TaylorMade P730 7-iron has a loft of 35 degrees, with a 62.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "What does the 730 in P730 mean?"
    a: "The 73 refers to the blade length of the head in millimetres, the smallest in TaylorMade's P-Series. The same convention names the P750 and P770."
  - q: "Are the P730 lofts the same as the TP MB?"
    a: "Yes. The P730 kept the traditional TP MB loft ladder unchanged: 21 degrees at the 3-iron, 35 at the 7-iron and a 47-degree pitching wedge, over the same 3-PW set."
  - q: "Was the P730 available left-handed?"
    a: "No. TaylorMade's spec sheet lists the P730 as right-hand only in every club."
