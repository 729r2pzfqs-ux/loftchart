description: >
  The Tour Preferred CB was the most forgiving model in the Tour Preferred trio
  TaylorMade announced in autumn 2010 for its 2011 irons line, below the MB blade and
  MC muscle-cavity. Its two-piece multi-material construction melds a thin forged face
  with a cast, undercut cavity, giving it the highest MOI of TaylorMade's player's
  irons of that season along with a hotter face than the MB and MC. The stock set runs
  3-iron through a 50-degree approach wedge with a 33-degree 7-iron. Specs below are
  the men's standard steel-shaft build.
