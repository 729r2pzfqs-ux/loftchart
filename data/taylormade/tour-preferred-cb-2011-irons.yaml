faq:
  - q: "What is the loft of a TaylorMade Tour Preferred CB (2011) 7-iron?"
    a: "The 2011 TaylorMade Tour Preferred CB 7-iron has a loft of 33 degrees, with a 62.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "Are the 2011 Tour Preferred CB irons forged or cast?"
    a: "Both. The construction melds a thin forged face with a cast, undercut stainless cavity body, so it delivers forged feel at impact with the stability and higher MOI of a deep cavityback."
  - q: "How do the 2011 Tour Preferred CB lofts compare to the MC and MB?"
    a: "The CB is the strongest-lofted of the trio, with a 33-degree 7-iron and 46-degree pitching wedge against 34 and 47 degrees for the MC and 35 and 47 degrees for the MB. It is also the only one of the three sold with a stock 50-degree approach wedge instead of a 2-iron."
