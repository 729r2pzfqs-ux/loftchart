faq:
  - q: "What is the loft of a TaylorMade Qi HL 7-iron?"
    a: "The TaylorMade Qi HL 7-iron has a loft of 30 degrees, a lie of 63.0 degrees and a length of 37.25 inches."
  - q: "What is the difference between the TaylorMade Qi and Qi HL?"
    a: "HL stands for higher and lighter. The lies and lengths are the same, but every Qi HL loft is two degrees weaker — 30 degrees at the 7-iron against 28 — and the head is about 6 grams lighter with lighter stock shafts, so the whole club is more than 20 grams lighter."
  - q: "Is the Qi HL the same as the Qi10 irons?"
    a: "TaylorMade catalogues the 2024 irons as Qi and Qi HL. They launched with the Qi10 driver, fairway woods and hybrids, so much of the coverage calls them Qi10 and Qi10 HL — they are the same clubs."
  - q: "Does the Qi HL come with a 4-iron?"
    a: "No. The published set starts at a 23.5-degree 5-iron and runs to a 54-degree sand wedge, with 5-PW the stock build."
