description: >
  Qi HL is the high-launch model of TaylorMade's 2024 Qi iron family, aimed at
  moderate swing speeds. It uses the same lies and lengths as the standard Qi
  but weakens every loft by two degrees — 30 degrees at the 7-iron against 28 —
  and pairs that with a head about 6 grams lighter and lighter, higher-launching
  stock shafts, so total club weight drops by more than 20 grams. The stock set
  runs 5-PW. Figures below are the men's standard right-handed build.
