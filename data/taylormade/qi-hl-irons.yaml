faq:
  - q: "What is the loft of a TaylorMade Qi HL 7-iron?"
    a: "The TaylorMade Qi HL 7-iron has a loft of 28 degrees, a lie of 63.0 degrees and a length of 37.25 inches."
  - q: "What is the difference between the TaylorMade Qi and Qi HL?"
    a: "HL stands for high launch. Its lofts are about two degrees weaker than the standard Qi through the set, and it is built with lighter stock shafts, so slower swings launch the ball higher."
  - q: "Is the Qi HL the same as the Qi10 irons?"
    a: "TaylorMade catalogues the 2024 irons as Qi and Qi HL. Because they launched alongside the Qi10 driver, fairway woods and hybrids, much of the coverage calls them Qi10 and Qi10 HL — they are the same clubs."
  - q: "What is the pitching wedge loft on the TaylorMade Qi HL?"
    a: "43 degrees, with 49-, 54- and 59-degree wedges available to complete the set."
