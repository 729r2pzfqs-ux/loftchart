description: >
  Qi HL is the high-launch model in TaylorMade's 2024 Qi iron family, built for
  moderate swing speeds. Against the standard Qi it weakens every loft by about
  two degrees — 28 degrees at the 7-iron rather than 26 — and pairs that with
  lighter stock shafts and a 5-PW stock make-up, so the ball gets airborne
  without the golfer having to generate the speed. The set extends to a
  59-degree lob wedge. Figures are the men's standard right-handed build.
