model: Qi10
slug: qi10-hybrid
club_type: hybrid
year_introduced: 2024
year_discontinued: null
category: flagship
construction: steel body with carbon crown; bonded hosels on the core and Max, loft sleeve on the Tour
material: Twist Face hybrid face with TaylorMade's V Steel-derived sole
predecessor: TaylorMade Stealth 2
successor: TaylorMade Qi35
description: >
  The Qi10 Rescue family launched on 9 January 2024 alongside the Qi10 woods.
  The core Qi10 Rescue is a bonded five-loft line from 19° to 33° built to
  flight like an iron replacement; the Qi10 Max Rescue is the bonded high-MOI
  head, a degree weaker at each club number and out to a 35° 7-Rescue; and the
  compact Qi10 Tour Rescue is the player's head with the family's only
  adjustable loft sleeve, sold in 17°, 19.5° and 22°. The Qi35 Rescues
  replaced the family in January 2025.
variants:
  - name: Qi10 Rescue
    description: >
      The core bonded Rescue in five lofts, with a D3 swing weight and
      lengths from 40.75 to 38.75 inches. Mid flight with a neutral-to-slight
      draw bias.
  - name: Qi10 Max Rescue
    description: >
      The bonded forgiveness head with the highest MOI in the family, lofted
      one degree weaker than the core Rescue at each club number and sold out
      to a 35° 7-Rescue. Lies run 59-61°, lengths 40.75-38.75 inches.
  - name: Qi10 Tour Rescue
    description: >
      The compact tour head with the family's only 3° loft sleeve, in 17°,
      19.5° and 22° at a D2 swing weight — built to be flighted down and
      shaped like a long iron.
