hosel:
  system: "3° Loft Sleeve (Qi10 Tour Rescue only)"
  loft_range: "±1.5°"
  positions: 12
  lie_effect: >
    Lie only moves upright from standard, as on the fairway sleeve.
  face_note: >
    Lowering loft opens the face slightly and raising it closes it.
  notes: >
    Only the Qi10 Tour Rescue carries the sleeve — the core Qi10 Rescue and
    Qi10 Max Rescue are bonded and play at their stamped loft. TaylorMade
    publishes the Rescue sleeve's 1.5°-each-way range rather than a
    Rescue-specific position-by-position chart, so no settings table is
    reproduced here.
