faq:
  - q: "What lofts do the TaylorMade Qi10 Rescues come in?"
    a: "The core Qi10 Rescue comes in 19, 22, 25, 29 and 33 degrees; the Qi10 Max Rescue in 20, 23, 27, 31 and 35; and the Qi10 Tour Rescue in 17, 19.5 and 22."
  - q: "Is the TaylorMade Qi10 Rescue adjustable?"
    a: "Only the Qi10 Tour Rescue, which has a 3 degree loft sleeve (1.5 degrees each way). The core Qi10 Rescue and the Qi10 Max Rescue are bonded and play at their stamped loft."
  - q: "What is the difference between the Qi10 Rescue and Qi10 Max Rescue?"
    a: "The Max is the forgiveness model: higher MOI, a touch more draw bias, lofts one degree weaker at each club number, and an extra loft at the weak end — a 35 degree 7-Rescue the core line does not offer."
