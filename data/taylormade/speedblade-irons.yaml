  - "golfbusinessnews.com 'TaylorMade Golf Introduces SpeedBlade Irons' — announced in 2013 with retail availability from 4 October 2013; the Speed Pocket runs through the sole of the 3 to 7 irons."
  - "Note: bounce is omitted — the source table did not carry a bounce column. Confidence is medium."
  - "Note on succession: TaylorMade ran overlapping game-improvement models in this period — RocketBladez, RocketBladez 2.0, SpeedBlade, then the RSi family — so no single clean replacement exists. The AeroBurner, announced in January 2015, took over the SpeedBlade's distance-iron slot in the range, which is used for successor and year_discontinued; predecessor is left null."
