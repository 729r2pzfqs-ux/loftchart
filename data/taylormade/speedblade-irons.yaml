description: >
  SpeedBlade carried over the RocketBladez idea — a handlebar-shaped
  slot cut through the sole of the 3 to 7 irons so a larger area of the face can flex
  at impact. Lofts are strong even by the standards of the period, with a 30.5-degree
  7-iron and a 17-degree 3-iron, and the set extends to a 60-degree lob wedge. Offset
  is large in the long irons, 6.3 mm at the 3-iron, and falls to under a millimetre in
  the wedges.
