faq:
  - q: "What is the loft of a TaylorMade SpeedBlade 7-iron?"
    a: "The TaylorMade SpeedBlade 7-iron has a loft of 30.5 degrees, a lie of 63.0 degrees and a length of 37.0 inches."
  - q: "When were TaylorMade SpeedBlade irons made?"
    a: "They were introduced in 2013 and reached retail on 4 October 2013. TaylorMade ran several overlapping game-improvement models around it, so there is no single clean replacement."
  - q: "Which SpeedBlade irons have the Speed Pocket?"
    a: "The 3 through 7-irons. The slot is cut all the way through the sole in those heads and omitted in the short irons and wedges."
