sources:
  - "2nd Swing Golf specification table for the TaylorMade SpeedBlade iron set (https://www.2ndswing.com/golf-clubs/iron-sets/taylormade-speedblade-iron-set) — supplied every loft, lie, length, offset and swing weight above and both stock shafts."
