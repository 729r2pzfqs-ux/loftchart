faq:
  - q: "What is the loft of a TaylorMade Tour Preferred (2009) 7-iron?"
    a: "The 2009 TaylorMade Tour Preferred 7-iron has a loft of 35 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "Do the 2009 Tour Preferred irons have flat lie angles?"
    a: "Yes, noticeably so for the era. The set runs from a 58-degree lie in the 2-iron to 63 degrees in the wedges, roughly a degree flatter through most of the set than TaylorMade's 2011 Tour Preferred models."
  - q: "What wedges came with the 2009 Tour Preferred set?"
    a: "The stock set offered a 47-degree pitching wedge, a 51-degree approach wedge and a 55-degree sand wedge. The 2-iron at the other end of the range was available through custom order only."
