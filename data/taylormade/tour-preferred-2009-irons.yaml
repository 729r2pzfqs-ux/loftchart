description: >
  The 2009 Tour Preferred was TaylorMade's single player's iron of the Tour Burner
  era, announced in 2008 and sold as the '09 model. It pairs a classic blade shape and
  thin topline with a shallow undercut cavity that moves weight to heel and toe pads,
  and an Inverted Cone face for more consistent speed on off-centre hits. Lofts are
  traditional, with a 35-degree 7-iron and 47-degree pitching wedge; the stock range
  runs 3-iron to sand wedge, with the 2-iron a custom-order club. Specs below are the
  men's standard steel-shaft build; a TaylorMade TP 110 graphite shaft was custom only.
