description: >
  The PSi was TaylorMade's better-player iron of the M1 era, announced alongside that
  driver in September 2015. It runs a progressive build: tungsten weighting and a
  Speed Pocket in the long irons, forged heads from the 8-iron down, and face slots
  cut vertically into the toe and heel to keep ball speed up on mishits. Lofts are a
  degree and a half stronger than a traditional players set, with a 31.5-degree
  7-iron, and the set runs all the way to a 55-degree sand wedge.
