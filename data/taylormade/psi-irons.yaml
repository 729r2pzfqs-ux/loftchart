faq:
  - q: "What is the loft of a TaylorMade PSi 7-iron?"
    a: "The TaylorMade PSi 7-iron has a loft of 31.5 degrees, a lie of 63.0 degrees and a length of 36.75 inches."
  - q: "When were TaylorMade PSi irons made?"
    a: "TaylorMade announced them on 9 September 2015 alongside the M1 driver and they reached retail on 6 November 2015."
  - q: "Are TaylorMade PSi irons forged?"
    a: "Only in part. The 8-iron through sand wedge are forged; the long irons are cast with tungsten weighting and a Speed Pocket in the sole."
