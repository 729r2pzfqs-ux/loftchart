sources:
  - "2nd Swing Golf specification table for the TaylorMade PSi iron set (https://www.2ndswing.com/golf-clubs/iron-sets/taylormade-psi-iron-set) — supplied every loft, lie, length, offset and swing weight above and both stock shafts."
  - "Note on offset: the source publishes offset in millimetres (4.8 mm down to 1.4 mm) and those figures are converted to inches here. The lie column steps by half a degree except between the 5 and 6-irons, where it jumps a full degree; that is how the source table reads and it is reproduced rather than smoothed."
  - "golfchannel.com 'Equipment Insider: TaylorMade announces M1 driver, PSi irons' and golfshake.com 'TaylorMade launch PSi Irons' — announced 9 September 2015 with the M1 driver, at retail 6 November 2015. Tungsten in the 3 to 5 irons, forged 8-iron through sand wedge."
  - "Note: bounce is omitted — the source table did not carry a bounce column. Confidence is medium."
