description: >
  The second-generation P7MB is TaylorMade's forged muscleback, announced on 6
  December 2022 alongside a new P770 and P7MC and sold as the 2023 model. Its
  lofts are one degree stronger than the 2020 P7MB from the 3-iron through the
  8-iron and half a degree stronger in the 9-iron — a 34-degree 7-iron rather
  than 35 — which puts it on the same loft chart as the P7MC, while the
  pitching wedge stays at 47 degrees. Offset is the smallest in the P-Series,
  from 1.9mm in the 3-iron to 1.4mm in the pitching wedge. Figures are the
  men's standard right-handed steel build.
