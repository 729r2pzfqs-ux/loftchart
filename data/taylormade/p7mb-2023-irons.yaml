  - "TaylorMade official P7MB Irons product page (DW-TA238), retrieved 29 September 2026 (https://www.taylormadegolf.com/P%E2%88%997MB-Irons/DW-TA238.html?lang=en_US) and archived 25 May 2023 (https://web.archive.org/web/20230525013828/https://www.taylormadegolf.com/P7MB-IRONS/DW-TA238.html?lang=en_US) — manufacturer specification table giving loft, lie, offset in millimetres, length and swing weight for the 3-iron through pitching wedge, identical in both, plus the KBS Tour stock shaft. Offset is converted to inches here."
