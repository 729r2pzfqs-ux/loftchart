faq:
  - q: "What is the loft of a TaylorMade P7MB (2023) 7-iron?"
    a: "The 2023 P7MB 7-iron has a loft of 34 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.00 inches."
  - q: "Did the P7MB lofts change between the 2020 and 2023 models?"
    a: "Yes. The 2023 model is one degree stronger from the 3-iron through the 8-iron and half a degree stronger in the 9-iron: 20, 23, 26, 30, 34, 38 and 42.5 degrees against 21, 24, 27, 31, 35, 39 and 43. The pitching wedge is 47 degrees in both, and lies, lengths and offsets are unchanged."
  - q: "How much offset does the 2023 P7MB have?"
    a: "Offset runs from 1.9mm in the 3-iron to 1.4mm in the pitching wedge, with 1.6mm in the 7-iron."
  - q: "What is the pitching wedge loft on the 2023 P7MB?"
    a: "47 degrees. The set runs 3-iron through pitching wedge, with no stock approach or gap wedge."
