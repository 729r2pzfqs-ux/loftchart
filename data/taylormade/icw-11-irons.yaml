description: >
  The ICW 11 - Inner Cavity Weighting - was one of a pair of early-90s TaylorMade irons,
  launched alongside the better-player ICW 5 with the ICW 11 aimed at the everyday
  player. A hidden internal cavity concentrates mass behind the strike zone while the
  compact head keeps a thin topline, and offset progresses through the set from long
  irons to wedges. Lofts are classic for the era, with a 34.5-degree 7-iron and 48-degree
  pitching wedge across a 1-iron-to-sand-wedge range. TaylorMade's own timeline files
  the model under 1991, though used-market listings often date the ICW family a few
  years earlier. Specs below are the men's build; women's lengths ran an inch shorter
  with no 1-iron.
