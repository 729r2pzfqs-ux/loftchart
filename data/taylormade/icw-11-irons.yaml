faq:
  - q: "What is the loft of a TaylorMade ICW 11 7-iron?"
    a: "The ICW 11 7-iron has a loft of 34.5 degrees, with a 62-degree lie and a 36.5-inch men's length."
  - q: "What does ICW stand for on TaylorMade irons?"
    a: "Inner Cavity Weighting: a hollow internal cavity that moves mass to the perimeter and behind the strike zone while the back of the head stays clean, an early alternative to the visible cavityback."
  - q: "What is the difference between the ICW 5 and ICW 11?"
    a: "TaylorMade developed them as a pair: the ICW 5 was the compact model for better players, while the ICW 11 carried more progressive offset and forgiveness for the everyday player. Both share the 1-iron-to-sand-wedge range."
