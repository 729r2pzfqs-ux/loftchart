description: >
  The Burner LCG - Low Center of Gravity - followed the Burner Oversize as TaylorMade's
  Bubble-shaft game-improvement iron of the late 1990s, sold in the same copper-and-black
  cosmetic family. Sole weighting drops the centre of gravity for higher flight from the
  same strong lofts as the Oversize, with a 33-degree 7-iron and 45-degree pitching wedge
  across a 2-iron-to-lob-wedge range. TaylorMade's Irons Legacy timeline files it under
  1997 as the Burner Bubble LCG; equip2golf lists it under 1998, its main retail year.
  Lengths below are the stock Bubble graphite build; the Royal Precision Rifle steel
  option played 0.5 inches shorter.
