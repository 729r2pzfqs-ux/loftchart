faq:
  - q: "What is the loft of a TaylorMade Burner LCG 7-iron?"
    a: "The Burner LCG 7-iron has a loft of 33 degrees, with a 62.5-degree lie and a 37-inch length with the stock Bubble graphite shaft (36.5 inches with the Rifle steel shaft)."
  - q: "What does LCG stand for on TaylorMade Burner irons?"
    a: "LCG stands for Low Center of Gravity: sole-concentrated weighting designed to launch the ball higher than the Burner Oversize it replaced, while keeping the same strong lofts."
  - q: "What shafts did the Burner LCG come with?"
    a: "The stock graphite shaft was TaylorMade's copper-coloured Burner Bubble, with the Royal Precision Rifle stepless steel shaft as the alternative, half an inch shorter per club."
