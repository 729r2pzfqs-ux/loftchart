description: >
  The fourth-generation P790 keeps the family loft chart intact for a fourth
  time — 30.5 degrees at the 7-iron, 45 at the pitching wedge — and reworks the
  internals. The face is a forged wrap-around L-Face over a Speed Pocket, the
  SpeedFoam Air filling is retained, and up to 38 grams of tungsten is used to
  drive the FLTD CG progression, lowest in the long irons and rising through
  the set. Lofts, lies, lengths and offsets carry over unchanged from the 2021
  model. Figures are the men's standard right-handed steel build.
