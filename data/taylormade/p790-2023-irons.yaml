faq:
  - q: "What is the loft of a TaylorMade P790 (2023) 7-iron?"
    a: "The 2023 P790 7-iron has a loft of 30.5 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.00 inches."
  - q: "Have P790 lofts changed since 2017?"
    a: "No. Every generation from 2017 to 2023 uses 19, 21, 23.5, 26.5, 30.5, 35, 40, 45 and 50 degrees from 3-iron to approach wedge. Only lengths and offsets have moved, and only between the 2017 and 2019 models."
  - q: "What is the difference between the 2021 and 2023 P790?"
    a: "The loft, lie, length and offset charts are identical. The 2023 model changes the face to a forged wrap-around L-Face, adds up to 38 grams of tungsten, and uses the FLTD CG progression to sit the centre of gravity lowest in the long irons and highest in the scoring irons."
  - q: "What is the pitching wedge loft on the 2023 P790?"
    a: "45 degrees, with a 50-degree approach wedge completing the published range."
