sources:
  - "2nd Swing Golf specification table for the TaylorMade SLDR iron set (https://www.2ndswing.com/golf-clubs/iron-sets/taylormade-sldr-iron-set) — supplied every lie, length, offset and swing weight above, and every loft except the 8-iron."
  - "Correction to that table: it lists the 8-iron loft as 26 degrees, which is impossible between a 32-degree 7-iron and a 41-degree 9-iron. thesandtrap.com's SLDR iron review gives the 8-iron as 36 degrees, 63.0 lie, 36.25 inches and 4.5 degrees of bounce, which matches the rest of the chart; 36 degrees is recorded here and the bounce figure is carried across as the one club with a published bounce."
  - "Note on offset: the source publishes offset in millimetres (4.9 mm down to 1.0 mm), converted to inches here."
  - "golfshake.com 'TaylorMade launch SLDR Irons' and golfwrx.com 'TaylorMade unveils new SLDR S woods and irons' — the SLDR irons were announced in 2014 and reached retail on 6 June 2014."
  - "Note: bounce is recorded for the 8-iron only, because that is the only club for which a published figure was found. Confidence is medium given the correction above."
