description: >
  The SLDR iron was TaylorMade's attempt at a classic-looking head with the Speed
  Pocket behind it — a smaller, cleaner shape than the SpeedBlade of the previous
  year, with a ThruSlot cut in the sole. Lofts sit between the two camps: a 32-degree
  7-iron, a degree and a half weaker than the SpeedBlade but stronger than a
  traditional players set, and the set runs to a 56-degree sand wedge.
