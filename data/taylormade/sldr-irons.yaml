faq:
  - q: "What is the loft of a TaylorMade SLDR 7-iron?"
    a: "The TaylorMade SLDR 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a length of 36.75 inches."
  - q: "When were TaylorMade SLDR irons made?"
    a: "They were announced in 2014 and reached retail through TaylorMade Tuned Performance Centers on 6 June 2014."
  - q: "How do SLDR iron lofts compare with the SpeedBlade?"
    a: "The SLDR is weaker throughout — 32 degrees at the 7-iron against the SpeedBlade's 30.5, and 19 at the 3-iron against 17 — in a smaller head."
