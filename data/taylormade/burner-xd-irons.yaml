description: >
  The Burner XD ("extreme distance") was the oversized distance iron of TaylorMade's
  2008 Burner family, released in September 2008 and aimed squarely at golfers wanting
  maximum yardage and forgiveness. A thin, flexible titanium face with Inverted Cone
  Technology sits on a 17-4 stainless body, with the weight saved by the titanium
  moved low and deep in the extra-large head, and the light SuperFast shaft package
  adds clubhead speed. Lofts are very strong, with a 30-degree 7-iron and 44-degree
  pitching wedge across the 3-iron to lob wedge range. Specs below are the men's
  standard steel-shaft build.
