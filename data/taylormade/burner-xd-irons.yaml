faq:
  - q: "What is the loft of a TaylorMade Burner XD 7-iron?"
    a: "The TaylorMade Burner XD 7-iron has a loft of 30 degrees, with a 63-degree lie and a 36.75-inch steel-shaft length. It was among the strongest-lofted 7-irons of its era."
  - q: "Does the TaylorMade Burner XD have a titanium face?"
    a: "Yes. The face is a thin, flexible titanium panel with Inverted Cone Technology mounted on a 17-4 stainless steel body, which TaylorMade credited for up to 8 more yards than an average iron."
  - q: "Why are the Burner XD swingweights so light?"
    a: "The head is deliberately light at around D0 in the irons because the SuperFast package combines a light head, light 90-gram steel shaft and light grip to raise clubhead speed. TaylorMade published D0 steel swingweights for the 3-iron through 9-iron."
