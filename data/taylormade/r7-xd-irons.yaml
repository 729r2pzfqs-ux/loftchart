description: >
  The r7 XD was the draw-biased iron of TaylorMade's 2009 r7 XD range, built around
  Draw-Weighted Technology that encourages faster face rotation through impact.
  An ultra-deep, wide cavity, maximum offset, a wide cambered sole and an Inverted
  Cone face make it one of the most slice-correcting and forgiving irons TaylorMade
  offered, and a soft aluminum dampening web tunes the feel. The compact stock set
  runs 5-iron to pitching wedge plus a 54-degree sand wedge, on a lightweight Uniflex
  steel shaft; graphite was offered in S, R, M and L flexes. Specs below are the men's
  standard steel-shaft build.
