faq:
  - q: "What is the loft of a TaylorMade r7 XD 7-iron?"
    a: "The TaylorMade r7 XD 7-iron has a loft of 32 degrees, with a 63-degree lie and a 36.75-inch steel-shaft length."
  - q: "Are the TaylorMade r7 XD irons draw-biased?"
    a: "Yes, strongly. Draw-Weighted Technology places mass to speed up face rotation through impact, and combined with maximum offset the design is intended to turn a slice into a straight shot or draw."
  - q: "What clubs came in the r7 XD iron set?"
    a: "The stock set was compact: 5-iron through pitching wedge plus a 54-degree sand wedge. There was no stock 3-iron, 4-iron or gap wedge, reflecting the set's focus on easy-to-hit clubs for higher handicappers."
