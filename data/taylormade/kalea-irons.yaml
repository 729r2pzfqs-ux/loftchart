description: >
  Kalea was TaylorMade's dedicated women's line, launched in 2016 as a
  coordinated set in which every club — driver through sand wedge — was
  individually designed for the swing speeds and launch conditions of women
  golfers rather than being a lighter version of a men's model. The irons run
  6-iron through pitching wedge plus a matching sand wedge, with the 3-, 4- and
  5-irons replaced by fairway woods and hybrids in the full set. They combine a
  low, deep centre of gravity, Speed Pocket soles and ultralight low-kick
  Slim-Tech graphite shafts. Specs below are the women's stock graphite build,
  the only configuration offered.
