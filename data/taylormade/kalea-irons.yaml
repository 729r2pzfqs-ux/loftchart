faq:
  - q: "What is the loft of a TaylorMade Kalea 7-iron?"
    a: "The TaylorMade Kalea 7-iron has a loft of 33 degrees, with a 61.75-degree lie and a 36.75-inch graphite-shaft length."
  - q: "What clubs come in the TaylorMade Kalea iron set?"
    a: "The Kalea irons run 6-iron through pitching wedge plus a 54-degree sand wedge. In the full Kalea set the long irons are replaced by 4- and 5-hybrids and fairway woods, which TaylorMade considered easier for the target player to launch."
  - q: "Are the Kalea irons available with steel shafts?"
    a: "No. Kalea was designed as an ultralight women's set and was sold only with TaylorMade's low-kick Slim-Tech graphite shafts in ladies flex."
