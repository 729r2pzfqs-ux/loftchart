faq:
  - q: "What is the loft of a TaylorMade SuperSteel 7-iron?"
    a: "The SuperSteel 7-iron has a loft of 33 degrees, with a 62.5-degree lie and a 36.5-inch steel-shaft length (37 inches with the Bubble graphite shaft)."
  - q: "When did the TaylorMade SuperSteel irons come out?"
    a: "TaylorMade's own timeline dates them to 1999, with 2000 as the main retail year. They sat below the multi-material Firesole in the range and were replaced by the 300-series irons in 2001."
  - q: "What clubs came in the SuperSteel set?"
    a: "The range ran from a 19-degree 2-iron through a 60-degree lob wedge, including a 50-degree attack wedge and 55-degree sand wedge. Women's sets used the L-60 Bubble shaft an inch shorter and skipped the 2-iron."
