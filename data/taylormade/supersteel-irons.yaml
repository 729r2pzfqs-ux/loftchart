description: >
  The SuperSteel iron carried TaylorMade's late-1990s SuperSteel branding into a
  thin-faced stainless game-improvement set, sold alongside the multi-material Firesole
  as the value-oriented distance option. It keeps the Burner LCG's strong loft structure -
  a 33-degree 7-iron and 45-degree pitching wedge - across a 2-iron-to-lob-wedge range,
  with slightly more upright lies in the long irons. TaylorMade's Irons Legacy timeline
  files it under 1999; equip2golf lists it under 2000, its main retail year. Lengths
  below are the steel build from TaylorMade's own table; the stock Bubble graphite shaft
  played 0.5 inches longer per club.
