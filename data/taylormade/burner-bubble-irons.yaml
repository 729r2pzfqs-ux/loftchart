faq:
  - q: "What is the loft of a TaylorMade Burner Bubble 7-iron?"
    a: "The Burner Bubble mid-size 7-iron has a loft of 33 degrees, with a 62-degree lie and a 36.5-inch men's length."
  - q: "Are the Burner Bubble and Burner Midsize the same iron?"
    a: "Yes. The head launched in 1993 as the foam-filled Burner Midsize; from 1995 TaylorMade sold it with the copper Bubble graphite shaft and marketed the combination as the Burner Bubble iron, before the Oversize head replaced it in 1996."
  - q: "What clubs came in the Burner Bubble set?"
    a: "TaylorMade published specs from a 16-degree 1-iron through a 56-degree sand wedge, including a 52-degree attack wedge. Women's sets ran an inch shorter and started at the 2-iron."
