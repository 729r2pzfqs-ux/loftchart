description: >
  Introduced in 1993 as the Burner Midsize, this foam-filled cast stainless cavityback
  became the Burner Bubble mid-size iron when TaylorMade paired it with the
  copper-coloured Bubble graphite shaft from 1995, the pairing most 90s golfers know it
  by. The foam filling let weight move to the perimeter while damping vibration, and the
  set ran from a 16-degree 1-iron through a 56-degree sand wedge with a 33-degree 7-iron
  and 47-degree pitching wedge. It was succeeded in 1996 by the larger Burner Bubble
  Oversize. Specs below are TaylorMade's published men's table; women's builds ran an
  inch shorter with no 1-iron.
