description: >
  The RSi TP sat at the top of TaylorMade's 2015 RSi family, pairing the
  range's Face Slot Technology with a forged players head. In the 3- through
  7-irons a forged carbon steel face and hosel is plasma-welded to a stainless
  steel back, while the 8-iron to pitching wedge are conventional forged heads
  with a slight muscle cavity. Lofts are traditional rather than jacked — a
  34-degree 7-iron and 47-degree pitching wedge — and the published range runs
  from a 2-iron to the pitching wedge, with 3-PW the normal set. It was
  replaced by the PSi Tour, announced in late 2015.
