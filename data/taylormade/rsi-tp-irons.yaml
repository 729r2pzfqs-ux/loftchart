faq:
  - q: "What is the loft of a TaylorMade RSi TP 7-iron?"
    a: "The RSi TP 7-iron has a loft of 34 degrees, with a 62.5-degree lie and a 36.75-inch length — traditional players-iron lofts rather than the strong lofts of the RSi 1."
  - q: "Are the TaylorMade RSi TP irons forged?"
    a: "Partly. The 3- through 7-irons plasma-weld a forged carbon steel face and hosel to a stainless steel back, while the 8-iron through pitching wedge are fully forged heads with a slight muscle cavity."
  - q: "Do the RSi TP irons have Face Slots?"
    a: "Yes — the 3- through 7-irons carry the same Face Slot Technology as the rest of the RSi family to protect ball speed on heel and toe strikes."
