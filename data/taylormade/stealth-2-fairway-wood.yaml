faq:
  - q: "What lofts do the TaylorMade Stealth 2 fairway woods come in?"
    a: "The core Stealth 2 comes in 15, 16.5, 18, 21 and 24 degrees; the Stealth 2 Plus in 13.5, 15 and 18; and the Stealth 2 HD in 16, 19 and 22."
  - q: "Is the TaylorMade Stealth 2 fairway wood adjustable?"
    a: "Only the Stealth 2 Plus, which carries TaylorMade's 4 degree loft sleeve plus a 50 gram sliding sole weight. The core Stealth 2 and the HD are bonded and play at their stamped loft."
  - q: "What is the Stealth 2 Rocket 3 fairway wood?"
    a: "The 13.5 degree Stealth 2 Plus head — a strong-lofted 3-wood built for distance off the tee and firm turf, playable because the sleeve can add loft back when needed."
