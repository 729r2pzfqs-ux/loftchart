predecessor: TaylorMade Stealth
successor: TaylorMade Qi10
description: >
  The Stealth 2 fairway woods launched in January 2023 with the Stealth 2
  drivers, carrying the carbon-crown "Fargiveness" story of that generation.
  The core Stealth 2 is a bonded five-loft line including a 16.5° 3HL; the
  Stealth 2 HD is the draw-biased high-launch head in three weaker lofts; and
  the Stealth 2 Plus is the compact titanium head with a 50 g sliding sole
  weight, the family's only loft sleeve, and a 13.5° "Rocket 3" at the strong
  end. The Qi10 fairways replaced the line in January 2024.
variants:
  - name: Stealth 2
    description: >
      The core bonded head for most players, in five lofts including the
      high-launch 16.5° 3HL. Mid launch with a neutral bias and a D3 swing
      weight.
  - name: Stealth 2 Plus
    description: >
      The compact tour head with a titanium body, a 50 g sliding sole weight
      for shape and spin tuning, and the family's only 4° loft sleeve — sold
      down to a 13.5° Rocket 3-wood.
  - name: Stealth 2 HD
    description: >
      The draw-biased high-launch head in three lofts about a degree weaker
      than the core line, with heel weighting to fight a right miss. Swing
      weight D2.
