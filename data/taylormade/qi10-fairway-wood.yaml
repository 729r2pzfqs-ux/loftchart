description: >
  The Qi10 fairway woods launched on 9 January 2024 with the Qi10 drivers. The
  core Qi10 is a bonded five-loft line including a 16.5° 3HL, with the
  wraparound Infinity Carbon Crown of the drivers; the Qi10 Max is the bonded
  high-MOI head in weaker lofts on a 200 cc 3-wood footprint; and the Qi10
  Tour is the compact titanium head with a 50 g sliding sole weight and the
  only loft sleeve in the family. The Qi35 fairways replaced the line in
  January 2025, which then put a sleeve on every 3- and 5-wood.
variants:
  - name: Qi10
    description: >
      The core bonded head for most players, sold in five lofts including the
      high-launch 16.5° 3HL (195 cc, matching the 3-wood). Mid-high launch
      with mid-low spin and a neutral bias.
  - name: Qi10 Tour
    description: >
      The compact titanium-bodied tour head — 170 cc 3-wood, 150 cc 5-wood —
      with a 50 g sliding sole weight for spin and launch tuning and the
      family's only 4° loft sleeve.
  - name: Qi10 Max
    description: >
      The bonded high-MOI forgiveness head, a degree or so weaker at each slot
      — 200 cc 3-wood, 180 cc 5-wood, 165 cc 7-wood — with a shallow face and
      low CG for easy launch. Swing weight D2.
