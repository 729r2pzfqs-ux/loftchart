faq:
  - q: "What lofts do the TaylorMade Qi10 fairway woods come in?"
    a: "The core Qi10 comes in 15, 16.5, 18, 21 and 24 degrees; the Qi10 Tour in 15 and 18; and the Qi10 Max in 16, 19 and 22."
  - q: "Is the TaylorMade Qi10 fairway wood adjustable?"
    a: "Only the Qi10 Tour, which carries TaylorMade's 4 degree loft sleeve and a 50 gram sliding sole weight. The core Qi10 and the Qi10 Max have bonded hosels and play at their stamped loft."
  - q: "What is the difference between the Qi10 and Qi10 Max fairway woods?"
    a: "The Max is the forgiveness head: a larger 200 cc 3-wood footprint, a shallower face, a lower and deeper centre of gravity, and lofts about a degree weaker at each slot (16/19/22 against 15/18/21)."
