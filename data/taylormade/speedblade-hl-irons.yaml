sources:
  - "2nd Swing Golf specification table for the TaylorMade SpeedBlade HL iron set (https://www.2ndswing.com/golf-clubs/iron-sets/taylormade-speedblade-hl-iron-set) — supplied every loft, lie, length, offset and swing weight above; offsets published in millimetres (5.8 mm down to 1.3 mm) and converted to inches here."
  - "Set composition: PGA Tour Superstore and GolfEtail retail listings sold the HL as 4-PW and 4-PW+AW sets, which is the range recorded here; 2nd Swing also lists a 3-iron (18 degrees) and 56/60-degree SW/LW columns that were not part of the normal retail set."
  - "Note on the loft ladder: every HL club is exactly one degree weaker than the standard SpeedBlade as published on TaylorMade's own SpeedBlade spec sheet (SpeedBlade_Irons_SS.pdf), with lie, length and offset identical — consistent with TaylorMade's practice for HL variants. A conflicting spec table at intheholegolf.com (half-degree offsets, uniform half-inch lengths) does not match TaylorMade's published length ladder and was not used."
  - "Note: bounce is omitted — no source carried a bounce column for the HL heads. Confidence is medium: the numbers come from a large used-club retailer rather than a manufacturer sheet."
