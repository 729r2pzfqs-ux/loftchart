faq:
  - q: "What is the loft of a TaylorMade SpeedBlade HL 7-iron?"
    a: "The SpeedBlade HL 7-iron has a loft of 31.5 degrees — one degree weaker than the standard SpeedBlade — with a 63-degree lie and 37-inch length."
  - q: "What is the difference between the SpeedBlade and SpeedBlade HL irons?"
    a: "The HL (high launch) version adds one degree of loft to every head to make the set easier to flight, while lie angles, lengths and offsets are identical to the standard SpeedBlade."
  - q: "What clubs came in the TaylorMade SpeedBlade HL set?"
    a: "The HL was sold as boxed 4-PW and 4-PW plus 51-degree AW sets from 2014, in steel and graphite builds."
