description: >
  The SpeedBlade HL is the high-launch companion to the 2013 SpeedBlade, sold
  from 2014 mainly as boxed 4-PW and 4-PW-plus-AW sets for players who need
  more height. Each head carries one degree more loft than the standard
  SpeedBlade — 31.5 degrees at the 7-iron against 30.5 — while lie, length and
  offset stay on the standard SpeedBlade ladder. The Speed Pocket sole slot
  and deep undercut cavity are unchanged from the standard model.
