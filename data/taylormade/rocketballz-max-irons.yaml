sources:
  - "TaylorMade official 2012 Irons catalog, RocketBallz Max page (p.20), taylormadegolf.com/on/demandware.static/-/Sites-TMaG-Library/default/v1463473265710/docs/productspecs/TM_SPR_2012_Catalog_21.pdf — full specification table giving loft, lie, offset in mm (converted to inches here), bounce, length and steel/graphite swingweights (D3.5 steel, D2.5 graphite through the irons; steel values used), plus the KBS Satin 90 and Matrix Program 55 stock shafts and RBZ Max Winn grip."
  - "NOTE on lengths: the catalog prints 39.21 and 38.41 inches for the 4- and 5-irons, reflecting the graphite stock build in the long irons; from the 6-iron down the ladder is the conventional steel progression. No left-handed lob wedge was offered."
