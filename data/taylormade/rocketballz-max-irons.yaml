faq:
  - q: "What is the loft of a TaylorMade RocketBallz Max 7-iron?"
    a: "The TaylorMade RocketBallz Max 7-iron has a loft of 30 degrees, with a 63-degree lie and a 37-inch length."
  - q: "What is the difference between the RocketBallz and RocketBallz Max irons?"
    a: "The Max is the more forgiving, distance-first model: every head is hollow with pull-face metalwood construction and a draw-biased structure, where the standard RocketBallz uses that construction only in its 3- to 5-irons. Lofts differ slightly too — the Max runs a 30-degree 7-iron and 44-degree pitching wedge against 30.5 and 45."
  - q: "What clubs came in the stock RocketBallz Max set?"
    a: "TaylorMade specified the set from the 4-iron through the lob wedge: 4 to 9, a 44-degree pitching wedge, a 49-degree approach wedge, a 54-degree sand wedge and a 59-degree lob wedge."
