description: >
  The RocketBallz Max was the maximum-forgiveness companion to the 2012
  RocketBallz, and TaylorMade billed it as the longest iron the company had
  made to that point. Every head in the set is hollow and built with the
  pull-face metalwood construction the standard RBZ reserved for its 3- to
  5-irons, with tungsten sole weighting for a low, centred CG and a draw-biased
  head structure. The stock set runs 4-iron to lob wedge with mixed stock
  shafts — Matrix Program graphite in the long irons, KBS Satin steel in the
  mid and short irons — which is why the catalog long-iron lengths are the
  graphite build.
