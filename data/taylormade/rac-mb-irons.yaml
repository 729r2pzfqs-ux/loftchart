description: >
  The rac MB was TaylorMade's muscleback blade of the rac era, shipping from February
  2003 as the workability-focused top of the range above the rac LT and rac OS. It is
  coin-forged from low-carbon steel with precision-milled rac Feel Pockets in the back
  to tune impact feel, a narrow sole with a blunt leading edge, and a compact head
  with a high, forward centre of gravity for a controllable, low flight. The stock set
  runs 1-iron through pitching wedge on Tour Flighted Precision Rifle steel shafts,
  with a 36-degree 7-iron and 48-degree pitching wedge. Specs below are the standard
  steel-shaft build; published swingweights are D2 (D3 pitching wedge) in the 6.0-7.0
  Rifle flexes.
