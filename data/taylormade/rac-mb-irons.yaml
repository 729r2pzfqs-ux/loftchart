faq:
  - q: "What is the loft of a TaylorMade rac MB 7-iron?"
    a: "The TaylorMade rac MB 7-iron has a loft of 36 degrees, with a 61.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "Did the TaylorMade rac MB come with a 1-iron?"
    a: "Yes, unusually for its era the rac MB was offered from a 17-degree 1-iron all the way through the 48-degree pitching wedge, in right- and left-handed models."
  - q: "What shafts did the rac MB use?"
    a: "The stock shaft was the Precision Tour Flighted Rifle in 5.0 through 7.0 flexes, frequency-matched through the set. Dynamic Gold, Dynamic Gold Sensicore and LT Rifle options were available through custom order."
