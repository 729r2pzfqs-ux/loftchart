    - { setting: "HIGHER", loft: "+2°", lie: "2° upright", face: "4° closed" }
    - { setting: "HIGHER / UPRT", loft: "+1.5°", lie: "2.75° upright", face: "3° closed" }
    - { setting: "UPRT +1 notch", loft: "+0.75°", lie: "3.5° upright", face: "1.5° closed" }
    - { setting: "UPRT", loft: "std", lie: "4° upright", face: "square" }
    - { setting: "UPRT −1 notch", loft: "−0.75°", lie: "3.5° upright", face: "1.5° open" }
    - { setting: "LOWER / UPRT", loft: "−1.5°", lie: "2.75° upright", face: "3° open" }
    - { setting: "LOWER", loft: "−2°", lie: "2° upright", face: "4° open" }
    - { setting: "STD −2 notches", loft: "−1.5°", lie: "1.25° upright", face: "3° open" }
