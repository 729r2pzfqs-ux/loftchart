description: >
  The Qi35 is TaylorMade's 2025 driver family, announced on 7 January 2025 as
  the follow-up to the 10K-MOI Qi10 generation. The chassis blends five
  materials — chromium carbon panels over steel, aluminium, tungsten and
  titanium — around the fourth-generation 60X Carbon Twist Face, with a
  near-zero "CG projection" as the design story. The core Qi35 and the LS
  carry a two-weight Trajectory Adjustment System for spin and bias tuning,
  while the Qi35 Max keeps the 10K-class MOI of its predecessor with a 34 g
  rear tungsten weight and the Max Lite brings the same geometry to a D0,
  sub-50-gram-shaft build for moderate swing speeds. The Qi4D replaced the
  line in January 2026, making the Qi35 the value buy while closeout and used
  stock lasts.
variants:
  - name: Qi35
    head_cc: 460
    description: >
      The core head: mid-high launch and high MOI with the two-weight
      Trajectory Adjustment System for spin and shape control. The 12° head
      is right-hand only.
  - name: Qi35 LS
    head_cc: 460
    description: >
      The most compact, lowest-spinning and lowest-launching head in the
      line, with the most aggressive shaping — for players who deliver
      serious speed. 8° is right-hand only.
  - name: Qi35 Max
    head_cc: 460
    description: >
      The 10K-MOI forgiveness flagship with a Symmetric Inertia Generator and
      34 g rear tungsten weight; high launch with slight draw bias.
  - name: Qi35 Max Lite
    head_cc: 460
    description: >
      The lightweight Max — about a 24 g rear weight, D0 swing weight and a
      Mitsubishi Vanquish 40 shaft — built for moderate swing speeds.
