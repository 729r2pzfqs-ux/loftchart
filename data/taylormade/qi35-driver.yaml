faq:
  - q: "What lofts does the TaylorMade Qi35 come in?"
    a: "The core Qi35 comes in 9, 10.5 and 12 degrees (12 right-hand only); the Qi35 LS in 8, 9 and 10.5 (8 right-hand only); the Qi35 Max in 9, 10.5 and 12; and the Qi35 Max Lite in 10.5 and 12."
  - q: "What is the Qi35 loft settings chart?"
    a: "The Qi35 uses TaylorMade's 12-position 4 degree Loft Sleeve: loft moves up to 2 degrees either way in 0.75 degree notches, the face closes up to 4 degrees as loft is added and opens as it is removed, and the UPRT setting keeps the stated loft while setting lie 4 degrees upright."
  - q: "Is the TaylorMade Qi35 still in production?"
    a: "No — the Qi4D replaced it in January 2026. The Qi35 remains widely available as closeout and used stock, which makes it the value pick of the two while supplies last."
  - q: "What is the difference between the Qi35 Max and Qi35 Max Lite?"
    a: "Both share the high-MOI Max geometry. The Max carries a 34 g rear tungsten weight and standard build weight; the Max Lite drops to roughly a 24 g rear weight, a D0 swing weight and a 47-48 g Vanquish shaft for moderate swing speeds."
