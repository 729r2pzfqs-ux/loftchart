faq:
  - q: "What lofts does the TaylorMade Hi-Toe 4 come in?"
    a: "50 to 60 degrees in 2-degree steps — 17 loft, bounce and grind combinations in all."
  - q: "What grinds does the Hi-Toe 4 offer?"
    a: "Five milled All Terrain soles: ATS standard at every loft, ATV (56-60), the new triple-sole ATX (56-60), low-bounce ATC (58-60) and the wide ATW (56-60)."
  - q: "What changed from the Hi-Toe 3 to the Hi-Toe 4?"
    a: "Spin Tread laser milling was added to the raw face, the back-sole cavities shrank to a cleaner single pocket, and the three-bounce lineup was replaced by five All Terrain grinds — 17 combinations against the Hi-Toe 3's 10."
