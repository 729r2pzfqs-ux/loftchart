description: >
  The Hi-Toe 4 is the 2024 generation of TaylorMade's high-toe specialty
  wedge, at retail from 14 August 2024 until the Hi-Toe 5 replaced it in
  2026. It brings the MG4's Spin Tread laser milling to the raw high-toe
  face, softens the look by shrinking the old sole cavities to a single toe
  pocket plus a toe pad, and keeps full-face grooves on the 54- to 60-degree
  heads. The grind story is all new: five milled "All Terrain" soles replace
  the previous low/standard/high bounce trio, giving 17 loft/bounce/grind
  combinations from 50 to 60 degrees. The retail finish is aged copper;
  the MyHi-Toe 4 program added raw, chrome and black. Left-handed 58-degree
  heads (and the 54 ATS) were custom-order only.
grinds:
  - code: ATS
    name: ATS (All Terrain Standard)
    description: >
      The default sole, offered at every loft — a reinforced four-way camber
      suited to all swing types and turf conditions.
  - code: ATV
    name: ATV (All Terrain Versatility)
    description: >
      Asymmetric bounce with a concave sole that gains bounce as the face
      opens — for shallow attack angles on tight lies and firm turf.
  - code: ATX
    name: ATX (All Terrain XTRA)
    description: >
      New for Hi-Toe 4 — a mid-bounce triple sole whose leading edge resists
      digging while aggressive trailing-edge relief cuts through the turf;
      best for steeper swings.
  - code: ATC
    name: ATC (All Terrain C)
    description: >
      The lowest-bounce option, a classic C-grind with aggressive heel and
      toe relief for firm conditions and shallow attack angles.
  - code: ATW
    name: ATW (All Terrain Wide)
    description: >
      The widest, most forgiving sole in the lineup, with high effective
      bounce for steep swingers, soft or wet turf and sand.
