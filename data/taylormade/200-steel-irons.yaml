faq:
  - q: "What is the loft of a TaylorMade 200 Steel 7-iron?"
    a: "The TaylorMade 200 Steel 7-iron has a loft of 33 degrees, with a 62.5-degree lie and a 36.75-inch steel-shaft length."
  - q: "When did the TaylorMade 200 Steel irons come out?"
    a: "TaylorMade announced the 200 Series in late 2001 and sold it as its 2002 game-improvement line, despite the model often being misdated earlier. It was replaced by the rac OS when the rac family launched for 2003."
  - q: "What is the Impact Pad in the 200 Steel irons?"
    a: "It is an insert placed in the cavity back that TaylorMade said maintains ball velocity on off-centre hits while producing a more solid sound and feel from the cast 431 stainless head."
