description: >
  The 200 Steel (officially the 200 Series irons) was TaylorMade's mainstream
  game-improvement iron announced in late 2001 and sold as the 2002 line, applying the
  research behind the premium 300 Series to a longer-bladed, perimeter-weighted head.
  Cast from 431 stainless steel, it uses a low, deep centre of gravity for high
  launch, an Impact Pad in the cavity to preserve ball speed and soften feel, moderate
  offset, U grooves and radiused soles. Lofts are moderate for the era, with a
  33-degree 7-iron and 45-degree pitching wedge over a 2-iron to sand wedge range.
  Specs below are the men's standard steel-shaft build; a lightweight TaylorMade Lite
  shaft option was also offered, in S, R and M flexes.
