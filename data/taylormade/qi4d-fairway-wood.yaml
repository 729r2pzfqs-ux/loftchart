description: >
  The Qi4D fairway woods launched with the Qi4D drivers — pre-orders opened
  on 8 January 2026 and retail followed on 29 January — replacing the Qi35
  line after one season. The loft sleeve spreads even further than on the
  Qi35: every loft of the core Qi4D and the Qi4D Tour carries the 4° sleeve,
  including the 24° 9-wood, and every head adds an 8 g Trajectory Adjustment
  System (TAS) sole weight. The core Qi4D is the mid-launch all-rounder in
  five lofts, the compact Qi4D Tour adds a tri-weight sole for shape tuning,
  and the oversize Qi4D Max and lighter-built Qi4D Max Lite keep the sleeve
  on their 3- and 5-woods with bonded 7- and 9-woods. A women's Max Lite
  build rounds out the family.
variants:
  - name: Qi4D
    description: >
      The core head for most players: mid-high launch, a fairly compact 185 cc
      3-wood stepping down to 155 cc at the 9-wood, the 4° loft sleeve on all
      five lofts and the 8 g TAS front weight. The 16.5° 3HL and 24° 9-wood
      are right-hand only.
  - name: Qi4D Tour
    description: >
      The compact precision head — 170 cc in the 3-wood, 150 cc in the 5- and
      7-woods — with a tri-weight sole for flight and bias tuning, the loft
      sleeve on all three lofts and heavier REAX FW 75/65 stock shafts. The
      21° 7-wood is right-hand only.
  - name: Qi4D Max
    description: >
      The oversize high-MOI head — about 200 cc in the 3-wood — for easy
      launch and stability, at a lighter D2 swing weight. The 3- and 5-woods
      carry the loft sleeve; the 21° and 24° heads are bonded, and the 9-wood
      is right-hand only.
  - name: Qi4D Max Lite
    description: >
      The Max geometry in a build up to 21 g lighter — lighter head, 45 g
      class REAX FW 45 shaft and a 44 g grip at a D0 swing weight — for
      moderate swing speeds, in the same four lofts with the sleeve on the
      3- and 5-woods. A women's version is also offered.
