faq:
  - q: "What lofts do the TaylorMade Qi4D fairway woods come in?"
    a: "The core Qi4D comes in 15, 16.5, 18, 21 and 24 degrees; the Qi4D Tour in 15, 18 and 21; and the Qi4D Max and Max Lite in 15, 18, 21 and 24."
  - q: "Are the Qi4D fairway woods adjustable?"
    a: "More than any TaylorMade line before them. Every core Qi4D and Qi4D Tour loft carries the 4 degree loft sleeve — including the 9-woods — and every head has an 8 gram TAS sole weight. On the Max and Max Lite the sleeve is on the 3- and 5-woods, with the 21 and 24 degree heads bonded."
  - q: "What is the difference between the Qi4D and Qi4D Tour fairway woods?"
    a: "The Tour is a more compact head with a tri-weight sole for flight and shape tuning and heavier REAX FW 75/65 stock shafts, aimed at faster players. The core Qi4D is the larger-footprint all-rounder with a single 8 gram front weight."
  - q: "What replaced the TaylorMade Qi35 fairway woods?"
    a: "These — the Qi4D fairways replaced the Qi35 line in January 2026, with pre-orders from 8 January and retail from 29 January."
