hosel:
  system: "4° Loft Sleeve"
  loft_range: "±2°"
  positions: 12
  lie_effect: >
    There is no flat setting — lie only moves upright, up to 4° at the UPRT
    position, and the loft settings themselves add up to 2° of upright lie.
  face_note: >
    Lowering loft opens the face and raising it closes it: about 1.5° per
    0.75° notch, up to 4° at the full ±2° setting.
  notes: >
    TaylorMade publishes one sleeve chart for its metalwoods, so the table
    matches the Qi4D driver chart. The sleeve reaches further down the line
    than ever: every core Qi4D and Qi4D Tour loft carries it, including the
    9-woods, while on the Max and Max Lite only the 3- and 5-woods are
    sleeved and the 21° and 24° heads are bonded. TaylorMade publishes lie
    on the sleeved heads as an adjustable range (56-60° on the 3-wood,
    rising by number) rather than a single figure, so those rows carry no
    lie column.
  settings:
    - { setting: "STD LOFT", loft: "std", lie: "std", face: "square" }
    - { setting: "STD +1 notch", loft: "+0.75°", lie: "0.5° upright", face: "1.5° closed" }
    - { setting: "STD +2 notches", loft: "+1.5°", lie: "1.25° upright", face: "3° closed" }
    - { setting: "HIGHER", loft: "+2°", lie: "2° upright", face: "4° closed" }
    - { setting: "HIGHER / UPRT", loft: "+1.5°", lie: "2.75° upright", face: "3° closed" }
    - { setting: "UPRT +1 notch", loft: "+0.75°", lie: "3.5° upright", face: "1.5° closed" }
    - { setting: "UPRT", loft: "std", lie: "4° upright", face: "square" }
    - { setting: "UPRT −1 notch", loft: "−0.75°", lie: "3.5° upright", face: "1.5° open" }
    - { setting: "LOWER / UPRT", loft: "−1.5°", lie: "2.75° upright", face: "3° open" }
    - { setting: "LOWER", loft: "−2°", lie: "2° upright", face: "4° open" }
    - { setting: "STD −2 notches", loft: "−1.5°", lie: "1.25° upright", face: "3° open" }
    - { setting: "STD −1 notch", loft: "−0.75°", lie: "0.5° upright", face: "1.5° open" }
