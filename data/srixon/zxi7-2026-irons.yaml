faq:
  - q: "What is the loft of a Srixon ZXi7 (2026) 7-iron?"
    a: "The second-generation Srixon ZXi7 7-iron has a loft of 32 degrees, with a 62-degree lie and a published steel-shaft length of 37.25 inches."
  - q: "Did the lofts change between the first and second generation Srixon ZXi7?"
    a: "No. Srixon's table for the second generation has the same lofts, lies, offsets and swing weights as the first, from a 20-degree 3-iron to a 46-degree pitching wedge. Only two published lengths differ: the pitching wedge is listed at 36.00 inches instead of 35.75 and the sand wedge at 35.5 instead of 35.75."
  - q: "When were the second-generation Srixon ZXi7 irons released?"
    a: "Srixon announced them on 8 September 2026, opening pre-sale the same day, with an official launch date of 16 October 2026."
  - q: "What clubs come in a stock Srixon ZXi7 (2026) set?"
    a: "The stock sets are 4-iron through pitching wedge and 5-iron through pitching wedge, with the 51-degree approach wedge sold individually. The 3-iron and the 57-degree sand wedge are custom order only and right hand only."
