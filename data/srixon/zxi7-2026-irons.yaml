sources:
  - "Srixon / Dunlop Sports US official ZXi7 irons product page, SKU MZXI7IRN27 (https://us.dunlopsports.com/srixon/clubs/irons/zxi7-irons/zxi7-irons/MZXI7IRN27.html, retrieved 29 September 2026) — full per-club specification table (head, loft, hand, lie, offset in mm, length, swing weight, 3-iron through SW), the footnote 'ZXi7 3 & ZXi7 SW Irons Offered Custom Only', the RH/LH column showing the 3-iron and sand wedge as right hand only, and the set options (4-PW, 5-PW and an individual AW)."
  - "Note on offset: Srixon publishes offset in millimetres (3.7, 3.5, 3.3, 3.1, 2.8, 2.4, 2.0, 1.7, 1.4, 0.8) and it is converted to inches here (mm / 25.4)."
  - "Note on length: compared with the first-generation table (SKU MZXI7IRN), every loft, lie, offset and swing weight is unchanged; only two lengths differ, the PW (36.00 inches against 35.75) and the SW (35.5 against 35.75). The second-generation page does not explain the change and does not repeat the first generation's footnote about the USGA / R&A measuring method, so no reason is given here."
  - "Same Dunlop Sports US page, technology copy: i-FORGED with Condensed Forging in the hosel area and S15C steel in the single-piece body, PureFrame iQ, Tour V.T. Sole, progressive grooves, thinner toplines than the previous generation, forging by Endo, and a tungsten weight in the toe of the long and mid irons. Stock shaft table: True Temper Dynamic Gold Mid 115 (S300, 115g) with a Golf Pride Tour Velvet 360 52g grip; no stock graphite option is listed."
  - "Announcement: Srixon press release dated 8 September 2026, 'Feel, perfected: Srixon launches second generation ZXi irons' (https://www.firstcallgolf.com/industry-news/release/2026-09-08/feel-perfected-srixon-launches-second-generation-zxi-irons) — pre-sale from 8 September 2026 and an official launch date of 16 October 2026. year_introduced uses the announcement year."
  - "Status check, 29 September 2026: listed as a current product on Srixon's own US site under SKU MZXI7IRN27, 'Available To Order' with an estimated ship date shown, during the pre-sale period that runs to the 16 October 2026 launch. The first-generation ZXi7 (SKU MZXI7IRN) is still listed alongside it as 'ZXi7 Irons 2025'."
