description: >
  The second-generation ZXi7 is the players model in Srixon's second ZXi iron line,
  announced on 8 September 2026 with pre-sale from the same day and an official launch
  date of 16 October 2026. It remains a single-piece S15C forging made by Endo in Japan,
  now with PureFrame iQ, a wider and thicker forged ridge behind the sweet spot, and
  slightly thinner toplines than the first generation. The lofts, lies, offsets and swing
  weights in Srixon's table are identical to the first-generation ZXi7, with a 32-degree
  7-iron and a 46-degree pitching wedge; the only published differences are the pitching
  wedge, listed at 36.00 inches rather than 35.75, and the sand wedge, listed at 35.5
  inches rather than 35.75. Heads run 3-iron through a 57-degree sand wedge, with 4-PW and
  5-PW the stock sets and the 3-iron and sand wedge custom order only. Offsets are
  converted from Srixon's published millimetre figures.
