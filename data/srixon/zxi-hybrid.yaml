faq:
  - q: "What lofts does the Srixon ZXi hybrid come in?"
    a: "Five lofts: 17, 19, 22, 25 and 28 degrees — the 2-hybrid through 6-hybrid."
  - q: "Is the Srixon ZXi hybrid adjustable?"
    a: "Yes — every loft carries the 12-position QTS 1.5 sleeve (±1.5 degrees of loft, flat-lie options to 3 degrees), where previous ZX-generation hybrids were bonded."
  - q: "What replaced the Srixon ZXi hybrid?"
    a: "The ZXi RKT hybrids, which reached retail on 16 October 2026 with a new VR-Titanium face alloy and an adjustable sole weight."
