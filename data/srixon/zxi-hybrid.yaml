category: flagship
construction: steel body with Rebound Frame flex zones and a rails-free cambered sole
material: HT1770M high-strength steel face
predecessor: Srixon ZX Mk II
successor: Srixon ZXi RKT
description: >
  The ZXi hybrid launched in January 2025 with the ZXi woods — one head
  design in five lofts from a 17° 2-hybrid to a 28° 6-hybrid, each carrying
  the 12-position QTS 1.5 sleeve where the previous ZX generations were
  bonded. Head sizes run 121 cc down to 112 cc at a D2-D3 swing weight with
  the Ventus TR Blue HB as the stock shaft. The ZXi RKT hybrids replaced the
  line in October 2026.
variants:
  - name: ZXi
    description: >
      The single hybrid head in five lofts, iron-like in address footprint
      with Srixon's Rebound Frame for ball speed and the QTS adjustable
      sleeve.
