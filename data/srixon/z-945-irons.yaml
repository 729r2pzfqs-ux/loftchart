faq:
  - q: "What is the loft of a Srixon Z 945 7-iron?"
    a: "The Srixon Z 945 7-iron has a loft of 33 degrees, a lie of 62 degrees and a steel-shaft length of 37.0 inches."
  - q: "When were Srixon Z 945 irons made?"
    a: "The Z 945 arrived with Srixon's first Z Series in 2014 and was replaced by the Z 965 in 2016."
  - q: "Is the Srixon Z 945 a blade?"
    a: "Yes — a forged 1020 carbon steel muscleback with a slim top line and 0.080 inches of offset at the 7-iron, the least of the Z Series."
  - q: "What is the Tour V.T. Sole on the Srixon Z 945?"
    a: "Srixon's cambered sole grind, with a high leading-edge bounce to stop the club digging and a relieved trailing edge so it exits the turf cleanly. Because the two figures differ, Srixon publishes them separately rather than quoting a single bounce angle."
