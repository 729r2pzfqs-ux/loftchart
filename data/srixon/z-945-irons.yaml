description: >
  The Z 945 is the muscleback at the top of Srixon's first Z-Series, forged from soft
  1020 carbon steel with a slim top line, a compact profile and the least offset of the
  range — 0.124 inches at the 3-iron falling to 0.053 at the pitching wedge. It carries
  the Tour V.T. Sole, Srixon's cambered grind with a high leading-edge bounce and a
  relieved trailing edge, and a double-laser-milled face for spin consistency. Lofts are
  traditional: 33 degrees at the 7-iron and 46 at the pitching wedge. Srixon catalogued
  the set 3-iron through pitching wedge and sold it stock as 5-PW.
