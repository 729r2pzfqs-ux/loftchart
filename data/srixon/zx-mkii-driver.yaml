description: >
  The ZX Mk II is Srixon's 2023 driver generation, refining the original
  ZX's Rebound Frame — alternating rigid and flexible zones that return more
  energy to the ball — under a carbon crown. The ZX5 Mk II is the mid-spin,
  high-MOI volume seller with a single rear weight; the ZX5 LS Mk II moves
  its sole weight forward near the face to cut spin for faster swings (and
  adds an 8.5° head); and the ZX7 Mk II is the tour head with two swappable
  heel/toe weights for draw or fade bias. The ZXi replaced the family in
  January 2025.
