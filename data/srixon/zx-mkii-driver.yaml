faq:
  - q: "What lofts does the Srixon ZX Mk II come in?"
    a: "The ZX5 Mk II and ZX7 Mk II come in 9.5 and 10.5 degrees; the ZX5 LS Mk II adds an 8.5 alongside 9.5 and 10.5. The QTS sleeve extends each head one degree either way."
  - q: "How adjustable is the ZX Mk II hosel?"
    a: "The Quick Tune System sleeve offers twelve combinations of loft, lie and face angle across ±1 degree of loft. Srixon no longer publishes the position-by-position chart for this generation — and it differs from the ±1.5 degree QTS 1.5 chart on the newer ZXi."
  - q: "What is the difference between the ZX5 Mk II and ZX7 Mk II?"
    a: "The ZX5 is the higher-MOI, mid-spin distance head with a single rear weight; the ZX7 is the compact tour head whose two heel/toe weights swap to set draw or fade bias."
  - q: "Is the Srixon ZX Mk II still in production?"
    a: "No — the ZXi replaced it in January 2025 and Srixon's own product pages for it are gone, so the used market is the source. Check which QTS setting a used head is in before judging its loft."
