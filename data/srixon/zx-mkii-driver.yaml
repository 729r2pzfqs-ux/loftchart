hosel:
  system: "Quick Tune System (QTS) sleeve"
  loft_range: "±1°"
  positions: 12
  lie_effect: >
    The sleeve adjusts lie flatter alongside loft; Srixon's per-position
    values for this generation are no longer published.
  face_note: >
    Face angle moves with the loft setting, opening as loft is removed and
    closing as it is added.
  notes: >
    Srixon's ZX-era QTS offered twelve combinations of loft, lie and face
    angle across ±1° of loft. The position-by-position chart for this
    generation is no longer published online, so it is not reproduced here —
    note that it is not the same chart as the later QTS 1.5 sleeve on the
    ZXi, whose range is ±1.5°.
