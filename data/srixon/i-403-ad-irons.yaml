description: >
  The I-403 AD was the forgiving, cast half of Srixon's early-2000s iron range —
  AD standing for the Accuracy and Distance branding it shared with the W-403 AD
  woods. Lost-wax cast from soft 255 stainless steel, it packs tungsten-nickel
  sole weights that Srixon claimed moved the centre of gravity lower than any
  competing iron, with variable hosel lengths and back weighting tuned through
  the set so the long irons launch easily and the short irons flight down for
  scoring. Progressive offset and a satin finish rounded out a club Srixon aimed
  at players of all abilities. The factory chart ran 3-iron to sand wedge and
  published no lengths, so those are omitted here.
