faq:
  - q: "What is the loft of a Srixon I-403 AD 7-iron?"
    a: "The Srixon I-403 AD 7-iron has a loft of 33 degrees and a lie of 62 degrees per Srixon's factory chart."
  - q: "What does AD stand for on the Srixon I-403 AD?"
    a: "Accuracy and Distance — the branding Srixon used across its 2004 403 AD woods and irons."
  - q: "Are the Srixon I-403 AD irons forgiving?"
    a: "Yes — they are the cast game-improvement model of Srixon's early-2000s range, with tungsten-nickel sole weights for a very low centre of gravity and progressive offset, while the forged I-302 served the better-player end."
