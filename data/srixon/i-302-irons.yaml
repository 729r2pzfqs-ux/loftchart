description: >
  The I-302 was Srixon's first widely-sold forged players iron in the US, a
  traditionally shaped cavity back forged from soft 1025 carbon steel with a
  six-times-struck process against the standard four. Its perimeter-weighted
  "Tour Cavity" varies in shape from long irons to short, placing the centre of
  gravity deep and low for a larger sweet spot while the thin topline and
  double-round radiused sole court accomplished players; stock shafts were Royal
  Precision Rifle 5.0/6.0. It is filed as a players iron on Srixon's own
  positioning. The factory chart ran 2-iron to sand wedge with per-club bounce
  but no lengths, so lengths are omitted here.
