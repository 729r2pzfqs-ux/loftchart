faq:
  - q: "What is the loft of a Srixon I-302 7-iron?"
    a: "The Srixon I-302 7-iron has a loft of 34 degrees, a lie of 61.5 degrees and 3 degrees of bounce per Srixon's factory chart."
  - q: "What is special about the Srixon I-302's forging?"
    a: "Srixon forged the 1025 carbon steel heads with a six-times-struck process rather than the standard four strikes, claiming more uniform grain and more precise face shaping."
  - q: "What shafts came in the Srixon I-302?"
    a: "Royal Precision Rifle steel shafts in 5.0 and 6.0 flexes were stock."
