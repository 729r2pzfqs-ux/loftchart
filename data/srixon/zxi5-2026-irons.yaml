faq:
  - q: "What is the loft of a Srixon ZXi5 (2026) 7-iron?"
    a: "The second-generation Srixon ZXi5 7-iron has a loft of 31 degrees, with a 62-degree lie and a published steel-shaft length of 37.25 inches."
  - q: "Did the lofts change between the first and second generation Srixon ZXi5?"
    a: "No. Srixon's table for the second generation has the same lofts, lies, offsets and steel swing weights as the first, from a 20-degree 3-iron to a 44-degree pitching wedge. Only two published lengths differ: the pitching wedge is listed at 36.00 inches instead of 35.75 and the sand wedge at 35.5 instead of 35.75."
  - q: "What is the difference between the Srixon ZXi5 (2026) and the ZXi5+?"
    a: "The ZXi5+ is the stronger-lofted, more forgiving model, with a 29.5-degree 7-iron and 43-degree pitching wedge against 31 and 44 degrees on the ZXi5. Lies, lengths and published offsets are the same club for club, and Srixon describes the ZXi5+ as having longer blade lengths and wider soles."
  - q: "When were the second-generation Srixon ZXi5 irons released?"
    a: "Srixon announced them on 8 September 2026, opening pre-sale the same day, with an official launch date of 16 October 2026."
