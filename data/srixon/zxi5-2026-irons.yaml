description: >
  The second-generation ZXi5 is the model Srixon calls its players performance iron,
  announced on 8 September 2026 with pre-sale from the same day and an official launch
  date of 16 October 2026. It keeps a forged S20C body and softened forged face, made by
  Endo in Japan, and replaces the earlier MainFrame milling with MainFrame iQ, a
  variable-thickness pattern on the back of the face that Srixon says cuts face mass by up
  to eight percent. The lofts, lies, offsets and swing weights in Srixon's table are
  identical to the first-generation ZXi5, with a 31-degree 7-iron and a 44-degree pitching
  wedge; the only published differences are the pitching wedge, listed at 36.00 inches
  rather than 35.75, and the sand wedge, listed at 35.5 inches rather than 35.75. Heads
  run 3-iron through a 56-degree sand wedge, with the 3-iron and sand wedge custom order
  only. Offsets are converted from Srixon's published millimetre figures and swing
  weights are the S-flex steel column.
