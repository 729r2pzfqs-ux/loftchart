sources:
  - "Srixon / Dunlop Sports US official ZXi5 irons product page, SKU MZXI5IRN27 (https://us.dunlopsports.com/srixon/clubs/irons/zxi5-irons/zxi5-irons/MZXI5IRN27.html, retrieved 29 September 2026) — full per-club specification table (head, loft, hand, lie, offset in mm, length, and swing weight in S, R and R/A flex columns, 3-iron through SW), the footnote 'ZXi5 3 & ZXi5 SW Irons Offered Custom Only', the RH/LH column showing the 3-iron and sand wedge as right hand only, and the set options (4-PW, 5-PW and an individual AW)."
  - "Note on offset: Srixon publishes offset in millimetres (4.2, 4.0, 3.8, 3.6, 3.2, 3.0, 2.7, 2.2, 1.9, 1.5) and it is converted to inches here (mm / 25.4)."
  - "Note on swing weight: the figures recorded are the S-flex steel column (D3, with D4 on the AW and SW). The page also lists D2/D3 for R flex and C9/D0 for the R/A graphite column."
  - "Note on length: compared with the first-generation table (SKU MZXI5IRN), every loft, lie, offset and S-flex swing weight is unchanged; only two lengths differ, the PW (36.00 inches against 35.75) and the SW (35.5 against 35.75). The second-generation page does not explain the change and does not repeat the first generation's footnote about the USGA / R&A measuring method, so no reason is given here."
  - "Same Dunlop Sports US page, technology copy: i-FORGED with Condensed Forging from the high toe along the topline and softened forged faces, MainFrame iQ, Tour V.T. Sole, progressive grooves, thinner toplines than the previous generation, forging by Endo, and 'a forged S20C steel body' with a tungsten weight in the toe of the long and mid irons. Stock shaft tables: True Temper Dynamic Gold Mid 115/100 (S300 115g, R300 105g) and Mitsubishi MMT Iron 60 graphite in S, R and A flex, with a Golf Pride Tour Velvet 360 52g grip. The graphite weights are omitted here because the page shows alternative figures for some flexes."
  - "Announcement: Srixon press release dated 8 September 2026, 'Feel, perfected: Srixon launches second generation ZXi irons' (https://www.firstcallgolf.com/industry-news/release/2026-09-08/feel-perfected-srixon-launches-second-generation-zxi-irons) — pre-sale from 8 September 2026, an official launch date of 16 October 2026, and the statement that MainFrame iQ reduces face mass by as much as eight percent. year_introduced uses the announcement year."
  - "Status check, 29 September 2026: listed as a current product on Srixon's own US site under SKU MZXI5IRN27, 'Available To Order' with an estimated ship date shown, during the pre-sale period that runs to the 16 October 2026 launch. The first-generation ZXi5 (SKU MZXI5IRN) is still listed alongside it as 'ZXi5 Irons 2025'."
