sources:
  - "Srixon / Dunlop Sports US official ZXi4 irons product page (us.dunlopsports.com/srixon/clubs/irons/zxi4-irons/zxi4-irons/MZXI4IRN.html) — full per-club specification table (head, loft, hand, lie, offset in mm, length, steel S/R and graphite R/A swing weight, 4-iron through SW), with the RH/LH column showing the sand wedge as right hand only and the set builder listing 4-PW and 5-PW sets (plus a 5-PW with AW option). Offsets are published in millimetres (4.1, 3.9, 3.6, 3.2, 3.0, 2.7, 2.2, 1.8, 1.0) and converted to inches here. Steel swing weights are D2 with D3 wedges in both S and R flex; the graphite builds are C9/D0 (R) and C8/C9 (A)"
  - "Same Dunlop Sports US page, length footnote: 'To match USGA and R&A Industry guidelines, Srixon has modified how club lengths are measured and published. Our published length specifications are now approximately 1/4 inch longer for Irons. Note: The actual length of the Irons has not changed, only how they are measured.' This is why the lengths recorded here sit a quarter inch above the ZX4 Mk II figures despite the club being physically unchanged in length"
  - "Same Dunlop Sports US page, technology copy: the hollow head positioning ('Hollow Iron forgiveness with forged feel and players-inspired looks'), the Ideal Steel note that 'ZXi4 now features the softer SUS17-47 for its body material', MainFrame ('an enhanced network of milled channels on the back side of the Iron face'), Tour V.T. Sole and the wider 4i-7i / deeper 8i-SW progressive grooves"
  - "Same Dunlop Sports US page, stock shaft tables: KBS Tour Lite steel (S and R, both 110g), KBS TGI Tour Graphite Iron (R 60g) and UST Mamiya Recoil Dart 65 (A/F2 56g), with a Golf Pride Tour Velvet 360 52g grip"
  - "ZXi line unveiled 25 November 2024 per Golf Australia Magazine's launch release, which lists the ZXi4 as the line's forged game-improvement entry, with US preorders from 13 January 2025 and retail from 24 January 2025 at $1,299 for a seven-piece set (Golf.com, 'Srixon ZXi4, ZXi5, ZXi7 and ZXiU irons: 4 things to know', which also describes the hollow body and forged face plate). year_introduced uses the announcement year per the repository convention, which is why it reads 2024 rather than the 2025 model year"
  - "An earlier revision of this record, built while the official page was unreachable, took the same loft/lie/length/swing-weight ladder from Today's Golfer and Fairway Jockey reproductions of Srixon's chart; the manufacturer table retrieved for this revision matches those secondary sources exactly, and confidence is high on that basis"
