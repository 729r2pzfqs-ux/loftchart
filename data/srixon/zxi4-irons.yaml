faq:
  - q: "What is the loft of a Srixon ZXi4 7-iron?"
    a: "The Srixon ZXi4 7-iron has a loft of 28.5 degrees, with a 62-degree lie and a published steel-shaft length of 37.25 inches."
  - q: "Why is the Srixon ZXi4 7-iron listed at 37.25 inches when the ZX4 Mk II was 37 inches?"
    a: "Only the measuring convention changed. Srixon altered how it measures and publishes iron length to match USGA and R&A industry guidelines, which added about a quarter inch to the published figures, and states that the actual length of the irons has not changed."
  - q: "Did the lofts change between the Srixon ZX4 Mk II and the ZXi4?"
    a: "No. The ZXi4 carries over the ZX4 Mk II lofts and lies unchanged, from a 21-degree 4-iron through a 28.5-degree 7-iron to a 49-degree approach wedge and 56-degree sand wedge."
  - q: "What is the difference between the Srixon ZXi4 and ZXi5?"
    a: "The ZXi4 is the game-improvement model: a hollow body with a forged face, the longest blade length and most offset in the ZXi line, and the strongest lofts (28.5-degree 7-iron). The ZXi5 is the players-distance model, fully forged with a more compact head, less offset and a 31-degree 7-iron."
