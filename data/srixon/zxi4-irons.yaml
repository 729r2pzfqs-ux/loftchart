description: >
  The ZXi4 is the game-improvement model in Srixon's ZXi iron line, unveiled with the
  ZXi7, ZXi5 and ZXiU on 25 November 2024 and at US retail from 24 January 2025,
  replacing the ZX4 Mk II. It keeps the family's hollow-body, utility-style
  construction — Srixon's longest blade length and most offset in the line, with a
  moderate sole — now with a body in the softer SUS17-47 stainless steel behind a
  forged face plate carrying the third generation of MainFrame, the milled network of
  channels on the back of the face that thins it for ball speed, plus the Tour V.T.
  sole and progressive grooves that are wider in the 4- through 7-irons and deeper and
  closer-set from the 8-iron down. Lofts and lies carry over unchanged from the ZX4 Mk
  II and are the strongest in the ZXi family, with a 28.5-degree 7-iron and a
  43-degree pitching wedge — 2.5 degrees stronger than the ZXi5 at the 7-iron. The
  published lengths look a quarter-inch longer than the ZX4 Mk II, but they are not:
  Srixon changed how it measures and publishes iron length to match USGA and R&A
  industry guidelines, and states directly that the actual length of the irons has not
  changed. The figures below are Srixon's published ZXi-convention lengths, so
  comparing them with the pre-ZXi models in this database will overstate the
  difference by about a quarter inch. Heads run 4-iron through a 56-degree sand wedge
  (the SW right hand only), with 4-PW and 5-PW the stock sets. Offsets are converted
  from Srixon's published millimetre figures (the 7-iron is 3.2 mm, or 0.126 inches);
  swing weights are the steel column.
