description: >
  The I-701 Tour was Srixon's flagship forged players iron, announced on
  8 August 2007 alongside the more forgiving two-piece I-701. The head is
  a one-piece forged 1025 carbon steel cavity-back with a thin topline and
  minimal offset, a face-press milling treatment and engraved U-grooves
  for spin, and a sole cut away at the toe and heel to reduce the turf
  profile; its centre of gravity sits slightly higher than the standard
  I-701 for a more penetrating flight. It was sold 3-PW in right hand
  only at $1,199 with True Temper Dynamic Gold shafts, was in the bags of
  Henrik Stenson and Tim Clark at launch, and retains a cult following on
  equipment forums. Srixon never published a full factory spec sheet that
  survives online: the loft and lie table below was assembled by owners
  from factory materials (and Srixon confirmed to one owner that the
  standard I-701 shared it), and lengths are the standard half-inch
  ladder anchored by factory-spec examples, so confidence is medium.
