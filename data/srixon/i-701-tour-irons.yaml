faq:
  - q: "What is the loft of a Srixon I-701 Tour 7-iron?"
    a: "The Srixon I-701 Tour 7-iron has a loft of 34 degrees, with a 61.5-degree lie and a 36.75-inch length."
  - q: "What is the difference between the Srixon I-701 and I-701 Tour?"
    a: "The Tour is a one-piece forging of 1025 carbon steel with a slightly higher centre of gravity for a penetrating flight, while the standard I-701 is a two-piece forged head with a softer 1020 face and a pocket cavity for a lower, deeper centre of gravity. According to Srixon, the two shared the same lofts and lies."
  - q: "When did the Srixon I-701 Tour come out?"
    a: "Srixon announced the I-701 series on 8 August 2007, with the Tour at $1,199 for a 3-PW set in right hand only. The Z-TX replaced the series from 2009."
  - q: "Who played the Srixon I-701 Tour irons?"
    a: "Henrik Stenson and Tim Clark had them in play at launch in 2007, and the model keeps a cult following among better players on equipment forums."
