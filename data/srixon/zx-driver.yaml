hosel:
  system: "Quick Tune System (QTS) sleeve"
  loft_range: "±1°"
  positions: 12
  lie_effect: >
    The sleeve adjusts lie flatter alongside loft; Srixon's per-position
    values for this generation are not published.
  face_note: >
    Face angle adjusts up to ±2° across the settings, opening as loft is
    removed and closing as it is added.
  notes: >
    Srixon's ZX-era QTS offered twelve loft, lie and face-angle combinations
    across ±1° of loft. The position-by-position chart is not published
    online, so it is not reproduced here. An 8.5° option appears in Srixon's
    configurator but not its printed spec tables — likely custom order.
