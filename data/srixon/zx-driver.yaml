faq:
  - q: "What lofts does the Srixon ZX come in?"
    a: "Both the ZX5 and ZX7 come in 9.5 and 10.5 degrees, with the QTS sleeve extending each one degree either way. An 8.5 option existed through Srixon's configurator but not as stock retail."
  - q: "What is the difference between the Srixon ZX5 and ZX7?"
    a: "The ZX5 is the larger-profiled, higher-MOI mid-spin head with a single weight port; the ZX7 is the compact, flatter tour shape with two swappable 4 and 8 gram heel/toe weights for shot-shape bias."
  - q: "How adjustable is the Srixon ZX hosel?"
    a: "The Quick Tune System sleeve offers twelve combinations of loft, lie and face angle: loft moves ±1 degree and face angle up to ±2 degrees. Srixon does not publish the position-by-position values for this generation."
  - q: "Is the Srixon ZX still in production?"
    a: "It was superseded by the ZX Mk II in 2023 and then the ZXi, but Srixon's own pages still listed clearance ZX stock as late as 2026 — otherwise it is a used-market buy at bargain prices."
