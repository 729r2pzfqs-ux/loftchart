construction: 460 cc heads debuting the Rebound Frame, with a 15% larger carbon crown; single weight port on the ZX5, twin heel/toe ports on the ZX7
material: HT1770M titanium face; titanium body with carbon composite crown
predecessor: Srixon Z 785
successor: Srixon ZX Mk II
description: >
  The ZX is Srixon's 2021 driver family and the debut of the Rebound Frame —
  alternating rigid and flexible rings around the face that act as a double
  spring at impact. The ZX5 is the higher-MOI, mid-spin head with a single
  sole weight port; the ZX7 is the compact tour shape, flatter and
  shallower, with two swappable 4 g and 8 g sole weights for draw or fade
  bias. Both reached retail in January 2021 and ran until the Mk II
  generation arrived in 2023 — though Srixon's own product pages for the
  originals have outlived several successors, still listing clearance stock
  years later.
