faq:
  - q: "What lofts does the Srixon ZXi RKT come in?"
    a: "The core ZXi RKT comes in 9 and 10.5 degrees, the RKT LS in 8, 9 and 10.5 (8 right-hand only), and the RKT MAX in 9, 10.5 and 12 (9 and 12 right-hand only)."
  - q: "What is the ZXi RKT adjustment chart?"
    a: "The QTS 1.5 sleeve has twelve settings covering ±1.5 degrees of loft. Each non-standard position also flattens lie by 0.5 to 3 degrees and moves the face up to 3 degrees closed (loft up) or open (loft down); 'FL' positions are the flat-lie variants."
  - q: "What is new about the RKT face?"
    a: "It upgrades Srixon's i-FLEX variable-thickness design in a silicon-enhanced VR-Titanium alloy, paired with a Variable Roll Design and a two-zone Rebound Frame — while the 'Acousticore' rib structure tunes the sound that bulked-up carbon drivers often lose."
  - q: "Is the ZXi RKT the current Srixon driver?"
    a: "Yes — it reached retail on 16 October 2026 as the replacement for the 2025 ZXi, which stays on sale alongside it at a reduced price while stock lasts."
