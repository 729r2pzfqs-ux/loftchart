description: >
  The ZXi RKT is Srixon's 2026 driver family — announced 22 September and at
  retail from 16 October 2026 after a summer of tour seeding. The RKT Face
  system upgrades the i-FLEX variable face structure in a silicon-enhanced
  VR-Titanium alloy, carried on an "Acousticore" chassis whose AI-designed
  internal ribs tune both stability and sound under a carbon crown. The core
  RKT balances speed and workability with heel and toe weights, the LS adds
  front-to-back weighting for the lowest spin, and the MAX — Srixon's
  highest-MOI driver ever — runs a single 14 g rear weight. All three use
  the QTS 1.5 sleeve with twelve loft, lie and face-angle settings.
variants:
  - name: ZXi RKT
    head_cc: 460
    description: >
      The core head balancing speed, forgiveness and workability, with
      adjustable heel (10 g stock) and toe (4 g stock) weights swappable
      from 2 to 16 g.
  - name: ZXi RKT LS
    head_cc: 460
    description: >
      The low-spin head with front-to-back adjustable weighting for maximum
      distance at high swing speeds. 8° is right-hand only.
  - name: ZXi RKT MAX
    head_cc: 460
    description: >
      Srixon's highest-MOI driver to date, with a single rear sole weight
      (14 g stock, 2-16 g options). The 9° and 12° heads are right-hand
      only; a women's MAX build is also sold.
