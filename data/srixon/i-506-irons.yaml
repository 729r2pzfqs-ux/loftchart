faq:
  - q: "What is the loft of a Srixon I-506 7-iron?"
    a: "The Srixon I-506 7-iron has a loft of 34 degrees, a lie of 61.5 degrees and a length of 36.75 inches per Srixon's factory chart."
  - q: "Are the Srixon I-506 irons for good players?"
    a: "Yes — Srixon marketed the I-506 as a forged better-player iron with a classic blade profile, thin topline and minimal offset, with Digital Impact weighting supplying the forgiveness."
  - q: "When did the Srixon I-506 come out?"
    a: "In 2005, following the I-302 in Srixon's forged players line, and it was replaced by the I-701 series announced in August 2007."
