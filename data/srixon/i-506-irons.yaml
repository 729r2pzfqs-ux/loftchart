description: >
  The I-506 continued Srixon's forged players line in 2005, a 1025 soft carbon
  steel forging with the Tour Cavity Back and Srixon's Digital Impact weighting
  placing the centre of gravity low and deep for high launch with a penetrating
  flight. Srixon's own copy pitched it at better players — a classic blade profile
  with thin topline and minimal offset — with playability helped by a
  double-radiused sole with heel and toe relief cuts. It is filed as a players
  iron on that evidence. The factory chart ran 2-iron to pitching wedge with a
  34-degree 7-iron, D2 swing balance and Dynamic Gold stock shafts.
