faq:
  - q: "What is the loft of a Srixon ZXi5+ 7-iron?"
    a: "The Srixon ZXi5+ 7-iron has a loft of 29.5 degrees, with a 62-degree lie and a published steel-shaft length of 37.25 inches."
  - q: "What is the difference between the Srixon ZXi5+ and the ZXi5?"
    a: "The ZXi5+ has stronger lofts, with a 29.5-degree 7-iron and 43-degree pitching wedge against 31 and 44 degrees on the second-generation ZXi5, and Srixon describes it as a hollow forged head with longer blade lengths and wider soles. Lies, lengths and published offsets are the same club for club."
  - q: "Are the Srixon ZXi5+ lofts stronger than the ZXi4?"
    a: "No, they are slightly weaker through the middle of the set. The ZXi5+ 7-iron is 29.5 degrees against 28.5 on the ZXi4, and the 8-iron is 33.5 against 33, while the 4-iron (21), 5-iron (23), 9-iron (38), pitching wedge (43), approach wedge (49) and sand wedge (56) are the same."
  - q: "When were Srixon ZXi5+ irons released?"
    a: "Srixon announced the ZXi5+ on 8 September 2026 as part of the second-generation ZXi line, opening pre-sale the same day, with an official launch date of 16 October 2026."
