description: >
  The ZXi5+ is a new model in Srixon's second-generation ZXi iron line, announced on
  8 September 2026 with pre-sale from the same day and an official launch date of
  16 October 2026. Srixon describes it as a fully forged hollow players-distance iron with
  longer blade lengths, wider soles and stronger lofts than the ZXi5, and it takes the
  place in the four-model line that the hollow-bodied ZXi4 held in the first generation,
  although Srixon presents it as an all-new model rather than a renamed ZXi4. It has a
  29.5-degree 7-iron and a 43-degree pitching wedge: 1.5 degrees stronger than the ZXi5 at
  the 7-iron and one degree weaker than the ZXi4. Heads run 3-iron through a 56-degree sand
  wedge, with 4-PW and 5-PW the stock sets and the 3-iron custom order only. Offsets are
  converted from Srixon's published millimetre figures and swing weights are the S-flex
  steel column.
