sources:
  - "Srixon / Dunlop Sports US official ZXi5+ irons product page, SKU MZXI5PLUSIRN27 (https://us.dunlopsports.com/srixon/clubs/irons/zxi5%2B-irons/zxi5%2B-irons/MZXI5PLUSIRN27.html, retrieved 29 September 2026) — full per-club specification table (head, loft, hand, lie, offset in mm, length, and swing weight in steel S and R and graphite R and A flex columns, 3-iron through SW), the footnote 'ZXi5+ 3 Iron Offered Custom Only', the RH/LH column showing the 3-iron and sand wedge as right hand only, and the set options (4-PW, 5-PW and individual AW and SW)."
  - "Note on offset: Srixon publishes offset in millimetres (4.2, 4.0, 3.8, 3.6, 3.2, 3.0, 2.7, 2.2, 1.9, 1.5) and it is converted to inches here (mm / 25.4). The figures are the same as those published for the second-generation ZXi5."
  - "Note on swing weight: the figures recorded are the S-flex steel column (D2, with D3 on the AW and SW). The graphite columns read C9, with D0 on the AW and SW."
  - "Same Dunlop Sports US page, technology and overview copy: 'an all-new model', 'longer blade lengths, wider soles, and stronger lofts than ZXi5', i-FORGED with softened forged faces, MainFrame iQ, Tour V.T. Sole, progressive grooves, forging by Endo, and 'a forged S20C steel body' with a tungsten weight in the toe of the long and mid irons. Stock shaft tables: True Temper Dynamic Gold Mid 100/90 (S300 106g, R300) and Mitsubishi MMT Iron 60 graphite in R and A flex, with a Golf Pride Tour Velvet 360 52g grip. The R300 and graphite weights are omitted here because the page shows alternative figures for them."
  - "Announcement: Srixon press release dated 8 September 2026, 'Feel, perfected: Srixon launches second generation ZXi irons' (https://www.firstcallgolf.com/industry-news/release/2026-09-08/feel-perfected-srixon-launches-second-generation-zxi-irons) — names the ZXi5+ as 'making its debut within the Srixon Iron family', quotes Srixon's product manager describing it as 'a fully forged hollow Players Distance Iron', and gives pre-sale from 8 September 2026 with an official launch date of 16 October 2026. year_introduced uses the announcement year."
  - "Note on lineage: the release lists the second-generation family as ZXi7, ZXi5, ZXi5+ and ZXiU, with no ZXi4. predecessor is recorded as the ZXi4 because the ZXi5+ occupies the ZXi4's position in the line; Srixon itself does not call it a ZXi4 replacement, and the first-generation ZXi4 was still listed on Srixon's US site on 29 September 2026."
  - "Status check, 29 September 2026: listed as a current product on Srixon's own US site under SKU MZXI5PLUSIRN27, 'Available To Order' with an estimated ship date shown, during the pre-sale period that runs to the 16 October 2026 launch."
