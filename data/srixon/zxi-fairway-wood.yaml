faq:
  - q: "What lofts does the Srixon ZXi fairway wood come in?"
    a: "Four lofts: a 13.5 degree 3+ wood, 15 degree 3-wood, 18 degree 5-wood and 21 degree 7-wood. The 3+ and 7-wood are right-hand only."
  - q: "Is the Srixon ZXi fairway wood adjustable?"
    a: "Yes — every loft carries Srixon's 12-position QTS 1.5 sleeve: loft moves ±1.5 degrees, every non-standard position also flattens lie by up to 3 degrees, and face angle moves up to 3 degrees either way."
  - q: "Is the Srixon ZXi fairway wood still current?"
    a: "No — the ZXi RKT woods replaced the line in October 2026, making the ZXi the value buy on closeout while stock lasts."
