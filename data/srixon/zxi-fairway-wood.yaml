length_note: >
  Srixon's published ZXi lengths are about a quarter inch longer than prior
  generations because of a change to the USGA / R&A measurement method only —
  the physical builds did not get longer.
hosel:
  system: "QTS 1.5 sleeve"
  loft_range: "±1.5°"
  positions: 12
  lie_effect: >
    Every position other than standard also flattens lie, from 0.5° to 3°
    flat; there is no upright setting.
  face_note: >
    Face angle moves up to 3° closed on the loft-up side and 3° open on the
    loft-down side.
  notes: >
    The chart is Srixon's official hosel sleeve adjustability guide for the
    ZXi woods, shared with the ZXi drivers. "FL" marks the flat-lie variants
    of each loft setting.
