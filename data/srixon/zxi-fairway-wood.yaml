brand: Srixon
brand_slug: srixon
model: ZXi
slug: zxi-fairway-wood
club_type: fairway_wood
year_introduced: 2025
year_discontinued: null
category: flagship
construction: steel body with carbon crown; Rebound Frame flex zones behind the face
material: HT1770M high-strength steel face
predecessor: Srixon ZX Mk II
successor: Srixon ZXi RKT
description: >
  The ZXi fairway woods launched in January 2025 with the ZXi drivers, on a
  single head design in four lofts — including a 13.5° 3+ wood — rather than
  a multi-model lineup. Srixon's Rebound Frame alternates stiff and flexible
  zones behind the HT1770M steel face for ball speed, and every loft carries
  the 12-position QTS 1.5 sleeve. The ZXi RKT woods replaced the line in
  October 2026.
variants:
  - name: ZXi
    description: >
      The single fairway head: 187 cc in the 3+ and 3-wood, stepping down to
      142 cc in the 7-wood, at a D3 swing weight with the Ventus TR Blue as
      the stock shaft. The 3+ and 7-wood are right-hand only.
