description: >
  The ZXi RKT fairway woods reached retail on 16 October 2026 with the ZXi
  RKT drivers and hybrids, replacing the ZXi woods after less than two
  seasons. The headline change is the face: a new VR-Titanium alloy with the
  i-FLEX milled pattern, which Srixon pairs with revised acoustics and — new
  to its fairways — an adjustable sole weight (10 g stock, swappable from
  2 g to 16 g) alongside the 12-position QTS 1.5 hosel sleeve. Four lofts run
  from a 13.5° 3+ wood to a 21° 7-wood, with slightly smaller heads than the
  outgoing ZXi and the Kai'li Dark Waves Blue as the stock shaft.
variants:
  - name: ZXi RKT
    description: >
      The single fairway head in four lofts, 181 cc in the 3-woods stepping
      to 142 cc at the 7-wood, each with the QTS sleeve and the adjustable
      sole weight. The 13.5° 3+ is right-hand only; the 15° and 18° heads
      come in both hands.
