faq:
  - q: "What lofts do the Srixon ZXi RKT fairway woods come in?"
    a: "Four lofts: a 13.5 degree 3+ wood, a 15 degree 3-wood, an 18 degree 5-wood and a 21 degree 7-wood. The 3+ is right-hand only; the 15 and 18 come in both hands."
  - q: "Are the Srixon ZXi RKT fairway woods adjustable?"
    a: "Doubly so — every head carries the 12-position QTS 1.5 sleeve (plus or minus 1.5 degrees of loft with flat-lie options to 3 degrees) and, new for this generation, a screw-in sole weight swappable from 2 to 16 grams around the stock 10 gram weight."
  - q: "What is new on the ZXi RKT fairway woods versus the ZXi?"
    a: "A new VR-Titanium face alloy with the i-FLEX milled pattern, revised sound, slightly smaller heads and the adjustable sole weight. They replaced the ZXi fairways at retail on 16 October 2026."
