faq:
  - q: "What is the loft of a Srixon I-701 7-iron?"
    a: "The Srixon I-701 7-iron has a loft of 34 degrees, with a 61.5-degree lie and a 36.75-inch length — the same specification as the I-701 Tour."
  - q: "What is the difference between the Srixon I-701 and I-701 Tour?"
    a: "The standard I-701 is a two-piece forging with a softer 1020 face and a pocket cavity for a lower, deeper centre of gravity and easier launch; the Tour is a one-piece 1025 forging with a slightly higher centre of gravity for a more penetrating flight. Srixon confirmed the two shared lofts and lies."
  - q: "When was the Srixon I-701 sold?"
    a: "From its announcement on 8 August 2007 until the Z-TX generation replaced the 701 series in 2009."
