description: >
  The standard I-701 launched alongside the I-701 Tour on 8 August 2007 as the more
  forgiving half of Srixon's forged players pair. Where the Tour is a one-piece
  1025 forging, the standard I-701 is a two-piece forged head that welds a softer
  1020 carbon steel face to a 1025 body and hollows a pocket cavity behind the
  face, dropping the centre of gravity lower and deeper for easier launch. Srixon
  confirmed to owners that it shared the Tour's lofts and lies — a traditional
  34-degree 7-iron and 46-degree pitching wedge — and it was sold 3-PW with True
  Temper Dynamic Gold shafts until the Z-TX generation arrived.
