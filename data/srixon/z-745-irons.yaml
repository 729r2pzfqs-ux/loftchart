description: >
  The Z 745 is the players iron of Srixon's 2014 Z line, a compact forged
  cavity back in 1020 carbon steel sitting between the Z 545 distance model and
  the Z 945 muscleback. Lofts are a degree or two weaker than the Z 545 through
  the middle of the set — 32 degrees at the 7-iron against 31 — and offset is
  cut by about a third, 0.14 inches at the 3-iron against 0.159. It uses the
  same Tour V.T. Sole and double-laser-milled face as the rest of the line.
