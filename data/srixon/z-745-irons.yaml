faq:
  - q: "What is the loft of a Srixon Z 745 7-iron?"
    a: "The Srixon Z 745 7-iron has a loft of 32 degrees, a lie of 62.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "When were Srixon Z 745 irons made?"
    a: "The Z 745 launched alongside the Z 545 in 2014 and was replaced by the Z 765 in 2016."
  - q: "What is the difference between the Srixon Z 745 and Z 545?"
    a: "The Z 745 is the smaller, more workable head: weaker by a degree or two through the middle of the set, about a third less offset, and forged in one piece rather than carrying the Z 545's SUP10 face insert."
  - q: "What is the pitching wedge loft on the Srixon Z 745?"
    a: "46 degrees, against 44 on the Z 545."
