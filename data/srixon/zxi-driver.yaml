category: flagship
construction: multi-material 460 cc head with a razor-thin titanium crown over an internal "Star Frame" rib structure, Rebound Frame and adjustable sole weights
material: Ti72S titanium face with Laser Face Milling; titanium crown and body
predecessor: Srixon ZX Mk II
successor: Srixon ZXi RKT
description: >
  The ZXi is Srixon's 2025 driver family, at retail from 24 January 2025 and
  the first generation on the QTS 1.5 sleeve with its twelve loft, lie and
  face-angle settings. A razor-thin titanium crown over the internal Star
  Frame ribs frees mass for each head's weighting scheme: the core ZXi
  carries heel and toe weights for bias tuning, the LS runs front and rear
  weights to manage spin, and the Max — Srixon's highest-MOI driver at
  launch — uses a single removable rear weight. Laser Face Milling on the
  Ti72S face keeps spin consistent in the wet. The ZXi RKT replaced the
  family in October 2026, with the ZXi staying on sale at a reduced price
  while stock lasts.
variants:
  - name: ZXi
    head_cc: 460
    description: >
      The all-around head for most players — mid-high launch, mid-low spin —
      with heel and toe adjustable weights for draw or fade bias.
  - name: ZXi LS
    head_cc: 460
    description: >
      The low-spin head for faster swings fighting ballooning flight, with
      front and rear sole weights to tune spin. 10.5° is right-hand only.
  - name: ZXi Max
    head_cc: 460
    description: >
      Srixon's highest-MOI driver at launch, built for maximum forgiveness;
      a single removable rear weight changes swing weight without changing
      MOI. 9° is right-hand only; a women's 12° build at 44.75 inches is
      sold alongside.
