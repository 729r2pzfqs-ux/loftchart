faq:
  - q: "What lofts does the Srixon ZXi come in?"
    a: "The core ZXi comes in 9 and 10.5 degrees, the ZXi LS in 8, 9 and 10.5 (10.5 right-hand only), and the ZXi Max in 9, 10.5 and 12 (9 right-hand only)."
  - q: "What is the ZXi adjustment chart?"
    a: "The QTS 1.5 sleeve has twelve settings covering ±1.5 degrees of loft. Each non-standard position also flattens lie by 0.5 to 3 degrees and moves the face up to 3 degrees closed (loft up) or open (loft down); 'FL' positions are the flat-lie variants."
  - q: "What is the difference between the ZXi, ZXi LS and ZXi Max?"
    a: "The ZXi is the all-rounder with heel/toe bias weights; the LS moves its two weights front-to-back to cut spin for faster swings; the Max is the maximum-forgiveness head whose single rear weight changes swing weight without affecting MOI."
  - q: "Is the Srixon ZXi still in production?"
    a: "The ZXi RKT replaced it in October 2026, but the ZXi remains on Srixon's site at a reduced price while stock lasts — making it the value pick of the two generations."
