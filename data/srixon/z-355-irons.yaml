faq:
  - q: "What is the loft of a Srixon Z 355 7-iron?"
    a: "The Srixon Z 355 7-iron has a loft of 31 degrees, a lie of 62.0 degrees and a length of 37.00 inches."
  - q: "When were Srixon Z 355 irons made?"
    a: "The Z 355 launched in North America in September 2015 and stayed in the range until Srixon moved to the Z 565 and Z 765 in 2016 and 2017."
  - q: "Why is the Srixon Z 355 built from two different steels?"
    a: "The 4 to 7 irons use a hard HT1770 maraging face on a 17-4 body to get ball speed where distance matters. The 8-iron down is one-piece soft 431 steel, because those clubs are about feel and control rather than speed."
  - q: "What is the Tour V.T. Sole?"
    a: "Srixon's sole profile: more bounce at the leading edge and less at the trailing edge, creating a V shape that lets the head enter the turf cleanly and exit without dragging."
