description: >
  The Z 355 is the forgiving model in Srixon's 2015 Z line and uses a split
  construction: the 4 to 7 irons are two-piece, with an HT1770 maraging steel
  face on a 17-4 stainless body, while the 8-iron through approach wedge are
  one-piece soft 431 steel for feel. Srixon pairs the heavier heads with a
  high-balance-point shaft — its Action Mass Tech — and shapes the sole with
  the Tour V.T. profile, more bounce at the leading edge and less at the
  trailing edge. Lofts are moderate for a game-improvement iron at 31 degrees
  for the 7-iron.
