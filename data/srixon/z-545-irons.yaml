description: >
  The Z 545 is the cavity back of Srixon's 2014 Z line, forged from 1020 carbon
  steel with a SUP10 steel face for a higher COR and a double-laser-milled face
  for spin. Srixon publishes leading- and trailing-edge bounce separately for
  this set rather than a single figure, which is how the Tour V.T. Sole is
  specified: leading-edge bounce climbs from 13 to 21 degrees through the set
  while trailing-edge bounce stays negative. Lofts are moderately strong, 31
  degrees at the 7-iron.
