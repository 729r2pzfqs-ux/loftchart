faq:
  - q: "What is the loft of a Srixon Z 545 7-iron?"
    a: "The Srixon Z 545 7-iron has a loft of 31 degrees, a lie of 62.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "When were Srixon Z 545 irons made?"
    a: "The Z 545 was introduced in 2014 and replaced by the Z 565 in 2016."
  - q: "Why does Srixon publish two bounce numbers for the Z 545?"
    a: "Because the Tour V.T. Sole is not a single plane. Srixon adds bounce at the leading edge — 13 degrees at the 3-iron rising to 21 at the pitching wedge — and removes it at the trailing edge, which is where the negative figures come from."
  - q: "What is SUP10 steel?"
    a: "A high-strength spring steel Srixon uses for the face insert, stiff enough to be made thin so the face rebounds more at impact while the 1020 carbon body keeps the feel soft."
