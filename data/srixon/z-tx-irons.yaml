description: >
  The Z-TX replaced the I-701 series as Srixon's flagship forged players iron,
  announced in Japan in late 2008 and internationally in 2009, and commonly sold as
  a 2010 model in the US. The head is forged from 1025 carbon steel with a
  proprietary heat treatment, adds five grams of tungsten in the heel and toe of
  the sole for stability, and uses a stepped sole so the longer blade plays like a
  shorter one through the turf. A thinner face centre expanded the sweet spot by a
  claimed 20 percent. Lofts stay traditional at 34 degrees on the 7-iron and 46 on
  the pitching wedge; Srixon's Japanese-market Z-925 series succeeded it in 2012
  before the international Z 545/745 relaunch of 2014.
