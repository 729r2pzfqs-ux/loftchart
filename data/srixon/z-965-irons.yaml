faq:
  - q: "What is the loft of a Srixon Z 965 7-iron?"
    a: "The Srixon Z 965 7-iron has a loft of 33 degrees, with a 62-degree lie and a 37-inch steel-shaft length."
  - q: "What clubs come in a stock Srixon Z 965 set?"
    a: "The range is 3-iron through pitching wedge, sold as 3-PW, 4-PW or 5-PW sets or as individual irons, in right hand only with steel shafts only."
  - q: "What is the difference between the Srixon Z 965 and Z 765?"
    a: "The Z 965 is the compact muscle back blade with the least offset in the line (0.096 inches at the 7-iron) and slightly weaker lofts — its 7-iron is 33 degrees against the Z 765's 32. The Z 765 is the larger muscle-cavity players model."
  - q: "What replaced the Srixon Z 965?"
    a: "Srixon's Z-Forged blade, announced in January 2019, took over the muscleback slot after the Z 585 and Z 785 replaced the Z 565 and Z 765 in 2018."
