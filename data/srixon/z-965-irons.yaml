sources:
  - "Srixon official Z 965 irons product page (srixon.com/en/clubs/mens-golf-clubs/irons/z-965-irons/MZ965-EA.html), archived 2017-11-19 via web.archive.org (http://web.archive.org/web/20171119185955/http://www.srixon.com/en/clubs/mens-golf-clubs/irons/z-965-irons/MZ965-EA.html) — full specification table (club, loft, length, lie angle, leading- and trailing-edge bounce, offset in inches, swing weight, 3-iron through PW) and the note 'Available in Right Hand Only'"
  - "Same archived Srixon page, technology copy: 'Combining ultra-soft 1020 carbon steel head material with a new special heat treatment, new Z 965 irons are precision forged', the modified Tour V.T. Sole and '5 percent larger grooves compared to the previous generation and Double Laser Milling'"
  - "Same archived Srixon page, stock shaft table: True Temper Dynamic Gold steel (X100 132g / S300 130g), sold in S and X, with a Golf Pride Tour Velvet 360 52g grip; ordering options were 3-PW, 4-PW or 5-PW sets and individual irons"
  - "Golfalot 'Srixon Z 965, Z 765, Z 565 Irons Review' — the Z 965 is the blade of the range aimed at single-figure players, with a tungsten toe weight in the 3- to 6-irons and a narrower sole than the Z 945 it replaced"
  - "MyGolfWay Srixon Z 65 Series launch report (line revealed 17 August 2016, on sale from September 2016) and MyGolfSpy 'First Look: Srixon's 2017 driver & iron lineup' / Golfshake launch coverage giving the 16 September 2016 retail date. year_introduced uses the announcement year per the repository convention, which is why it reads 2016 rather than the 2017 model year the club is often listed under"
  - "MyGolfSpy 'First Look: Srixon Z-Forged Irons' and Golf Digest coverage — the Z-Forged blade announced in January 2019 (retail 1 February 2019) replaced the Z 965 after the Z 585/785 launch had left the blade slot open, which is the year_discontinued recorded here"
