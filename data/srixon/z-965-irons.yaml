description: >
  The Z 965 is the compact muscle back blade at the top of Srixon's 2016
  three-model Z Series iron line, above the Z 765 muscle cavity and Z 565 cavity
  back. Srixon describes it as ultra-soft 1020 carbon steel combined with a new
  special heat treatment and precision forged, with the revised Tour V.T. sole
  and grooves five percent larger than the previous Z 945 generation; the longer
  irons carry a tungsten toe weight. Lofts are traditional — a 33-degree 7-iron
  and 46-degree pitching wedge — and sit one to three degrees weaker than the
  Z 765 through the middle of the set. The stock range is 3-iron through pitching
  wedge, right hand only and steel only. Srixon published this model's offset
  figures directly in inches, so no unit conversion was applied. The Tour V.T.
  sole is listed with separate leading- and trailing-edge bounce figures rather
  than a single bounce number, so bounce is omitted here. The line was revealed
  in August 2016 and reached retail on 16 September 2016, so it is often
  catalogued as a 2017 model.
