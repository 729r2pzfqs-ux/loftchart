faq:
  - q: "What lofts does the Srixon ZXi RKT hybrid come in?"
    a: "Five lofts: 17, 19, 22, 25 and 28 degrees — the 2-hybrid through 6-hybrid. The 19 and 22 degree heads come in both hands."
  - q: "Is the Srixon ZXi RKT hybrid adjustable?"
    a: "Yes, twice over — every loft carries the 12-position QTS 1.5 sleeve (plus or minus 1.5 degrees with flat-lie options to 3 degrees) plus a screw-in sole weight swappable from 2 to 16 grams around the stock 10 gram weight."
  - q: "What is different about the ZXi RKT hybrid versus the ZXi hybrid?"
    a: "Slightly larger heads, the i-FLEX milled face pattern, the new adjustable sole weight and a heavier Mitsubishi MMT HY 80 stock shaft. It replaced the ZXi hybrid at retail on 16 October 2026."
