description: >
  The ZXi RKT hybrids reached retail on 16 October 2026 with the ZXi RKT
  woods, replacing the ZXi hybrids. The five-loft ladder from a 17° 2-hybrid
  to a 28° 6-hybrid carries over, but each head is slightly larger than its
  ZXi counterpart, picks up the i-FLEX milled face pattern, and adds the
  screw-in adjustable sole weight (10 g stock, 2-16 g options) alongside the
  12-position QTS 1.5 sleeve. The stock shaft moves to the heavier
  Mitsubishi MMT HY 80 at a D2 swing weight.
variants:
  - name: ZXi RKT
    description: >
      The single hybrid head in five lofts, 122 cc at the 2-hybrid stepping
      to 113 cc at the 6-hybrid, each with the QTS sleeve and adjustable
      sole weight. The 19° and 22° heads come in both hands; the rest are
      right-hand only.
