faq:
  - q: "What is the loft of a Maltby STi2 GEN 2 7-iron?"
    a: "The Maltby STi2 GEN 2 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a standard length of 37 inches."
  - q: "What changed from the Maltby STi2 to the STi2 GEN 2?"
    a: "The GolfWorks describes the GEN 2 as having greatly improved aesthetics for 2025. The lofts, lies and bounces on the factory chart are the same, and the MPF rating of 772 carried over."
  - q: "What are Maltby STi2 GEN 2 irons made of?"
    a: "They are precision cast from 431 stainless steel, which Maltby chose for a softer feel and easy loft and lie adjustment."
  - q: "Which clubs are available in the Maltby STi2 GEN 2?"
    a: "Eight heads are offered, 4-iron through a 48-degree gap wedge, in right and left hand."
