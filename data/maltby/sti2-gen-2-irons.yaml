description: >
  The STi2 GEN 2 is a cosmetic refresh of the Maltby STi2, a precision-cast
  431 stainless iron that Maltby places in its Super Game Improvement design
  category despite a mid-sized profile. The GolfWorks describes the change as
  improved aesthetics for 2025, and the design features carry over: an
  undercut cavity, Variable Face Thickness, a four-way radius sole and a
  Silica Gel insert in the 4- through 7-irons. Lofts run from a 22-degree
  4-iron to a 48-degree gap wedge, with a 32-degree 7-iron. Sold as component
  heads, built-to-order clubs and iron paks through The GolfWorks, so there
  is no single stock shaft; lengths below are The GolfWorks' standard men's
  steel playing lengths.
