sources:
  - "The GolfWorks Maltby STi2 GEN 2 Irons Heads product page (https://www.golfworks.com/maltby-sti2-gen-2-irons-heads/p/ma0368/, retrieved 29 September 2026) and its specification chart image (https://www.golfworks.com/content/description/ma0368specs.jpg, read directly) - the manufacturer chart used here: 4-GW lofts 22/25/28.5/32/36/40/44/48 degrees, lies 61-64, offsets 0.138 to 0.098 inches, bounces 3-6 degrees, head weights 246-292 g, .370 hosel, Mirror/Satin finish, 431 stainless steel and the MPF 701+ rating. The page copy supplies the design features and the line 'GEN 2 features greatly improved aesthetics for 2025'."
  - "The GolfWorks 'Standard Lengths' chart (https://www.golfworks.com/content/description/standard-playing-lengths.png, retrieved 29 September 2026) - men's steel iron lengths of 38.5 inches (4-iron) down to 35.5 inches (PW and GW), used here because Maltby sells this head component-style and does not publish a model-specific length column."
  - "Announcement year: GolfWorks Maltby MPF Ratings chart (https://www.golfworks.com/content/PDFs/Head_MPFs/MPFRatingsChart.pdf, retrieved 29 September 2026) lists 'MALTBY STi2 2nd Gen #6 2025, MPF 772'. No dated announcement was found; the product images on the GolfWorks page carry upload timestamps of November 2024, so the head may have been listed shortly before the 2025 year that The GolfWorks assigns to it."
  - "Swing weight is not published and is omitted. The chart image gives the centre of gravity as .743 inches where the page copy says .729 inches; neither figure is used in this file."
  - "Status check, 29 September 2026: confirmed as a current model with no replacement announced. On sale and in stock at The GolfWorks, Maltby's own retail channel, as heads (https://www.golfworks.com/maltby-sti2-gen-2-irons-heads/p/ma0368/), custom-built clubs and iron paks."
