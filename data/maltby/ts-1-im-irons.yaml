sources:
  - "The GolfWorks official Maltby TS1 IM Forged Iron spec chart image (golfworks.com/content/description/ma0344specs.jpg, linked from the 'Maltby TS1 IM Forged Iron Heads' product page p/ma0344/) — the manufacturer factory chart used here: 3-GW lofts 20/22/25.5/29/32.5/36/40/44/48 degrees, lies 60-64, offsets 0.110 to 0.080 inches, bounces 3-5 degrees, head weights 239-292 g, universal hosel, Pearl Chrome finish, MS300 maraging face and 1025C carbon steel body, and the MPF 728 rating."
  - "GolfWorks Maltby MPF Ratings chart (golfworks.com/content/PDFs/Head_MPFs/MPFRatingsChart.pdf, retrieved July 2026) — 'MALTBY TS1-IM Forged #6 2023, MPF 728', fixing year_introduced 2023; the same chart lists the standard TS1 under 2019 at MPF 711, the basis for the predecessor field."
  - "The GolfWorks product pages for the 'Maltby TS1 IM Forged Iron Paks' (p/pma0344/) and 'Maltby TS1 IM Custom Irons' (p/cma0344/) — confirm the true 3-piece billet-forged design, the 2.1 mm MS300 super maraging face welded to the forged 1025C body, the internal tungsten toe weight, the polymer-injected void behind the face, the 5-step precision forging process, the universal .370/.355 hosel, and the 3-PW/GW, 4-PW/GW or 5-PW/GW pak configurations sold as bare heads or custom-built sets."
  - "Length note: The GolfWorks does not publish a length column on the TS1 IM spec chart (weight is given instead); lengths above follow this site's Maltby TS-1 entry, which uses The GolfWorks' published Standard Lengths chart (golfworks.com/images/art/StdLengths.pdf, men's steel) as the best available proxy for the same product family sold the same way (component heads built to order)."
