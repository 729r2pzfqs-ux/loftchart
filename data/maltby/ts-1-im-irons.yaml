faq:
  - q: "What is the loft of a Maltby TS-1 IM 7-iron?"
    a: "The Maltby TS-1 IM 7-iron has a loft of 32.5 degrees and a lie of 62 degrees, with 0.090 inches of offset and a 4-degree bounce."
  - q: "What does 'IM' mean in the Maltby TS-1 IM?"
    a: "Injected Muscle - a polymer-filled void behind a 2.1 mm MS300 super maraging steel face, welded to a forged 1025C carbon steel body with an internal tungsten toe weight, aimed at more ball speed than the original TS-1."
  - q: "How forgiving is the Maltby TS-1 IM?"
    a: "The GolfWorks' own MPF chart rates it 728 at the 6-iron - inside Maltby's Super Game Improvement playability band - despite a compact, tour-style profile, slightly higher than the original TS-1's 711."
