description: >
  The TS-1 IM - "Injected Muscle" - extends Maltby's Tour Series hollow-forged
  concept with a stronger MS300 super maraging steel face (2.1 mm, chosen for
  higher elongation and yield strength than standard maraging) welded to a
  forged 1025C carbon steel body, with the same internal tungsten weight low
  and toward the toe as the original TS-1 and a polymer-filled void behind
  the face for added ball speed. The GolfWorks' own Maltby MPF ratings chart
  dates it to 2023 with an MPF of 728, just above the original TS-1's 711 -
  both inside Maltby's Super Game Improvement playability band despite the
  compact, tour-style head. Precision five-step forged, Pearl Chrome finish,
  a universal hosel accepting .370 parallel or .355 taper shafts, and
  optional custom loft/lie within +/-2 degrees at no charge on
  professionally assembled sets. Sold as bare heads or built-to-order paks
  (3-PW/GW, 4-PW/GW or 5-PW/GW) through The GolfWorks rather than off the
  rack.
