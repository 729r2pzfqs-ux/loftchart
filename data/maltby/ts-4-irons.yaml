description: >
  The TS-4 is the blade of Maltby's Tour Series — a classic muscle-back
  profile released through The GolfWorks in 2023 that hides thoroughly
  modern internals. Each head is true billet-forged from 1025C carbon
  steel in a precision multi-step process; in the 3-iron through 8-iron a
  tungsten weight is co-forged low and toward the toe and CMC (Ceramic
  Matrix Composite), which Maltby pioneered in this iron, is positioned
  inside the head to fine-tune the centre of gravity and soften feel.
  That mix is why a traditional-looking blade rates 755 at the 6-iron on
  Maltby's MPF forgiveness scale, a figure normally seen from mid-size
  cavity backs. The face and sole are CNC-milled, the face with Maltby's
  multi-groove pattern, and lofts are modern for a blade — a 33-degree
  7-iron and 45.5-degree pitching wedge across a 3-GW chart in pearl
  chrome, right hand only, on a universal hosel taking .370 parallel or
  .355 taper shafts. Sold as bare heads or built-to-spec custom sets, so
  the lengths below are The GolfWorks' published standard men's steel
  assembly lengths. A DBM black-finish version followed in 2025.
