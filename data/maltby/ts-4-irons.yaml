  - "The GolfWorks official Maltby TS4 Forged Iron Heads page (golfworks.com/maltby-ts4-forged-iron-heads/p/ma0348/) and its factory specification chart — 3-GW lofts 20/23/26/29.5/33/37/41/45.5/50, lies 60.5-64, offsets 0.110 to 0.080 inches, bounces 3-5 degrees, head weights 240-291 g, pearl chrome finish, 1025C carbon steel, universal hosel, plus the construction copy: billet forging, tungsten co-forged low-toe in the #3-#8, CMC positioning pioneered in the TS4, and CNC-milled face and sole."
