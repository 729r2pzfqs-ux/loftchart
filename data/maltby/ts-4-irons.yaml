faq:
  - q: "What is the loft of a Maltby TS-4 7-iron?"
    a: "The Maltby TS-4 7-iron has a loft of 33 degrees and a lie of 62.5 degrees, with 0.100 inches of offset and a 37-inch length on The GolfWorks' standard steel build."
  - q: "Is the Maltby TS-4 a real blade?"
    a: "In profile, yes — a classic muscle back at address. Internally it is unusually engineered: tungsten is co-forged into the low toe and CMC (Ceramic Matrix Composite) is placed inside the #3-#8 heads, giving it an MPF rating of 755, far above a conventional blade."
  - q: "What is CMC in the Maltby TS-4?"
    a: "Ceramic Matrix Composite — a lightweight material Maltby first used in the TS4, positioned inside the forged head alongside the tungsten to optimise the centre of gravity and enhance feel."
  - q: "When was the Maltby TS-4 released?"
    a: "In 2023 through The GolfWorks, per Maltby's own MPF ratings database; the DBM (Diamonized Black Metal) finish version followed in 2025, and both remain on sale."
