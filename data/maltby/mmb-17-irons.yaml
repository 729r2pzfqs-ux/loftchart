faq:
  - q: "What is the loft of a Maltby MMB-17 7-iron?"
    a: "Based on the confirmed 6-iron (31 degrees) and 8-iron (39 degrees) anchor points on the manufacturer-format chart, the 7-iron loft is 35 degrees, following the even 4-degree-per-club progression documented from the 6-iron through the gap wedge."
  - q: "What does MMB stand for in the Maltby MMB-17?"
    a: "Modified Muscle Back - a forged blade-style shape softened with a weight relief pocket, inverted muscle design in the 3-through-7 irons and tungsten toe weighting in the long irons, aimed at a wider range of players than a pure blade."
  - q: "How forgiving is the Maltby MMB-17?"
    a: "The GolfWorks' own MPF chart rates it 714 at the 6-iron - inside Maltby's Super Game Improvement playability band - despite its traditional blade-style look at address."
