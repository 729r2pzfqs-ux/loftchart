description: >
  The MMB-17 - Modified Muscle Back - is Maltby's forged blade-style iron
  softened just enough for a wider market: a weight relief pocket and
  inverted muscle design in the 3-through-7 irons, tungsten toe weighting in
  the 3-, 4- and 5-irons, and Maltby's MG multi-groove face, all forged from
  8620 carbon steel for a soft feel. The GolfWorks' own Maltby MPF ratings
  chart dates it to 2013 with an MPF of 714, in the Super Game Improvement
  band by Maltby's own measurement despite reading as a traditional blade at
  address. Lofts run a 39-degree 8-iron and 47-degree pitching wedge with a
  matching 51-degree gap wedge, both wedges built to the same 291-gram head
  weight; a "DBM Black Forged" special finish was also sold under the PF701+
  name. Sold as bare heads or built-to-order sets (commonly 4-PW or 4-P plus
  approach wedge) through The GolfWorks rather than off the rack.
