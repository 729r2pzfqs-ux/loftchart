faq:
  - q: "What is the loft of a Maltby STi2 7-iron?"
    a: "The Maltby STi2 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a standard length of 37 inches."
  - q: "Why did Maltby use 431 stainless steel for the STi2?"
    a: "431 stainless is softer than the more common 17-4 stainless used in many cast irons, chosen specifically to give the STi2 a feel closer to a forged iron despite being cast."
  - q: "What replaced the Maltby STi2?"
    a: "The STi2 GEN 2, which took over the same Super Game Improvement slot in The GolfWorks' catalog around 2025."
