description: >
  The STi2 is a precision-cast 431 stainless iron Maltby markets as landing
  in its Super Game Improvement design category despite a mid-sized,
  "confidence-building" profile at address rather than an oversized
  cavity-back look. An undercut cavity keeps the centre of gravity low and
  deep (0.729 inches), a Variable Face Thickness design boosts ball speed
  on off-centre strikes, and Silica Gel damping in the 4-through-7 irons
  cuts vibration; 431 stainless was chosen specifically for a softer,
  more forged-like feel than typical cast alloys. The GolfWorks' own Maltby
  MPF ratings chart dates it to 2020 with an MPF of 772, and progressive
  offset runs from 0.138 inches in the 4-iron down to 0.098 inches in the
  scoring clubs. Lofts span a 32-degree 7-iron and 44-degree pitching wedge
  across a 4-GW factory chart. Sold as bare heads or built-to-order paks
  through The GolfWorks; the STi2 GEN 2 replaced it in the catalog in 2025.
