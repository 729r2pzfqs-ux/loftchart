sources:
  - "The GolfWorks official Maltby STi2 Iron Heads spec chart image, mirrored on GolfWorks Canada (golfworks.ca/maltby-sti2-irons-heads/p/ma0317/, image at store-k9nvqai7wz.mybigcommerce.com/content/description/ma0317specs.jpg; the equivalent US product page has since been retired following the GEN 2 launch) — the manufacturer factory chart used here: 4-GW lofts 22/25/28.5/32/36/40/44/48 degrees, lies 61-64, offsets 0.138 to 0.098 inches, bounces 3-6 degrees, head weights 246-292 g, .370 hosel, Mirror/Satin finish, 431 stainless steel, and the MPF 701+ rating."
  - "GolfWorks Maltby MPF Ratings chart (golfworks.com/content/PDFs/Head_MPFs/MPFRatingsChart.pdf, retrieved July 2026) — 'MALTBY STi2 #6 2020, MPF 772' and 'MALTBY STi2 2nd Gen #6 2025, MPF 772', fixing year_introduced 2020 and year_discontinued 2025 (same MPF rating carried over to the GEN 2 refresh)."
  - "Bob Sailer Golf Service 'Maltby STi2 Irons' page (bobsailergolf.com, page since updated to cover the GEN 2 model) and staffordgolfstore.com 'Maltby STi2 Irons Heads Only' — corroborate the precision-cast 431 stainless construction chosen for a softer, forged-like feel, the undercut cavity with 0.729-inch CG depth, Variable Face Thickness design, Silica Gel damping in the 4-7 irons, progressive offset, and the Super Game Improvement Design category classification Maltby applies to this model."
  - "The GolfWorks 'Standard Lengths' chart (golfworks.com/content/description/standard-playing-lengths.png) — men's steel iron lengths of 38.5 (4-iron) down to 35.5 inches (PW/GW), used here because Maltby sells this head component-style and does not publish a model-specific length column."
