description: >
  The KE4 Max sits at the forgiving end of Maltby's long-running KE4 line,
  cast from 17-4 stainless with an extremely thick topline, a wide sole and
  generous offset built for maximum forgiveness rather than shot-shaping.
  The GolfWorks' own Maltby MPF ratings chart dates it to 2022 with an MPF
  of 959 - Maltby's own "Ultra Game Improvement" tier - and the company
  advertises the model as carrying the strongest lofts in its premium iron
  range: a 30-degree 7-iron and 43-degree pitching wedge across a 4-GW
  factory chart, with a matching 48-degree gap wedge. A 4-way radiused sole
  varies bounce and sole width by club for turf interaction across lofts,
  and a vertical centre of gravity of 0.758 inches keeps launch high
  through the set. Sold as bare heads or built-to-order paks (commonly
  4-PW or 4-GW) through The GolfWorks, with custom loft and lie available
  at no charge on professionally assembled sets; a separate KE4 MAX-F
  forged model shares the name but uses a different, forged construction.
