sources:
  - "The GolfWorks official Maltby TS-2 Forged Iron Heads page (golfworks.com/maltby-ts-2-forged-iron-heads/p/ma0294/) and its factory specification chart — 4-GW lofts 21/24/27/30/34/39/44/49, lies 61-64, offsets 0.140 to 0.100 inches, bounces 3-5 degrees, head weights 245-290 g, satin polished chrome, 1025C carbon steel, universal hosel and MPF 701+ badge, plus the construction copy: hollow three-piece design, 2 mm forged face, internal tungsten toe weight, and polymer fill behind the face in the 4-iron through 9-iron."
  - "The GolfWorks Head MPF Ratings chart (golfworks.com/content/PDFs/Head_MPFs/MPFRatingsChart.pdf, updated July 2026) — 'MALTBY TS2 #6 2018, MPF 727', which fixes year_introduced 2018, a year before the TS1's 2019 listing."
  - "Fit2YouGolf 'Maltby TS-1 and TS-2 Forged Irons', 19 January 2019, and the GolfWRX club-techs thread on the TS-2 heads from 2018 — independent coverage of the launch window and the enhanced-playability, enhanced-distance brief."
  - "Lengths are from The GolfWorks' published Standard Lengths chart (golfworks.com/images/art/StdLengths.pdf, men's steel: 38.5-inch 4-iron through 35.5-inch PW and GW) because Maltby heads are sold component-style and built to order; playing lengths vary per build, hence confidence medium."
