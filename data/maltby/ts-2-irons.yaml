faq:
  - q: "What is the loft of a Maltby TS-2 7-iron?"
    a: "The Maltby TS-2 7-iron has a loft of 30 degrees and a lie of 62.5 degrees, with 0.125 inches of offset and a 37-inch length on The GolfWorks' standard steel build."
  - q: "What is the difference between the Maltby TS-1 and TS-2?"
    a: "Both are billet-forged hollow designs with tungsten toe weighting, but the TS-2 is the distance head: lofts one to two degrees stronger (30 against 32 at the 7-iron), more offset (0.140 against 0.120 inches at the long end) and a larger profile, while the TS-1 keeps the more compact players shape."
  - q: "Is the Maltby TS-2 forgiving?"
    a: "By Maltby's own measurement, yes — it rates 727 MPF at the 6-iron, inside the Super Game Improvement band, despite looking like a players iron."
  - q: "Is the Maltby TS-2 still available?"
    a: "Yes. As of 2026 The GolfWorks still sells TS-2 heads and custom builds, more than seven years after its 2018 introduction."
