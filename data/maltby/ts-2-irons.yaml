description: >
  The TS-2 opened Maltby's Tour Series in 2018 as the distance half of
  the pair the compact TS-1 completed a few months later. It is a
  three-piece, true billet-forged hollow iron — a 2 mm 1025C carbon steel
  face and 1025C body with an internal tungsten weight positioned low and
  toward the toe, precision-welded and, from the 4-iron through 9-iron,
  injection-filled with dense polymer behind the whole face to boost
  deflection and feel. Lofts run a degree to a degree and a half stronger
  than the TS-1 (30-degree 7-iron, 44-degree pitching wedge) with more
  offset and a larger blade, which is what pushes it into the
  players-distance class; on Maltby's own MPF forgiveness scale it rates
  727 at the 6-iron, in the Super Game Improvement band. The 4-GW chart
  comes in satin polished chrome, right hand only, on a universal hosel
  accepting .370 parallel or .355 taper shafts. The GolfWorks sells it as
  bare heads or built-to-order custom sets, so the lengths below are the
  company's published standard men's steel assembly lengths. Still in the
  line as of 2026.
