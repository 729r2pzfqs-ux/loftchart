sources:
  - "The GolfWorks official Maltby TS-1 Forged Iron Heads page (golfworks.com/maltby-ts-1-forged-iron-heads/p/ma0293/) and its factory specification chart — 3-GW lofts 20/22.5/25/28.5/32/36/40.5/45/49.5, lies 60.5-64, offsets 0.120 to 0.090 inches, bounces 2-4 degrees, head weights 238-289 g, satin polished chrome finish, 1025C carbon steel, universal hosel and the MPF 701+ badge, plus the three-piece billet-forged, polymer-filled, tungsten-toe construction copy."
  - "The GolfWorks Head MPF Ratings chart (golfworks.com/content/PDFs/Head_MPFs/MPFRatingsChart.pdf, updated July 2026) — 'MALTBY TS1 #6 2019, MPF 711', which fixes year_introduced 2019; the companion TS2 is listed at 2018."
  - "Fit2YouGolf 'Maltby TS-1 and TS-2 Forged Irons', 19 January 2019 — independent clubfitter coverage of both models at launch, corroborating the 32-degree TS-1 7-iron and the hollow forged construction."
  - "Lengths are from The GolfWorks' published Standard Lengths chart (golfworks.com/images/art/StdLengths.pdf, men's steel: 39.0-inch 3-iron through 35.5-inch PW and GW) because Maltby heads are sold component-style and built to order; playing lengths vary per build, hence confidence medium."
