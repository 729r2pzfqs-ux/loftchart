description: >
  The TS-1 is the players head of Maltby's Tour Series, the forged hollow
  line Ralph Maltby's GolfWorks launched to prove a tour-profile iron
  could measure high on his own MPF forgiveness scale — the TS-1 rates
  711, inside the Super Game Improvement band, despite a compact shape.
  On sale by early 2019 alongside the larger TS-2, it is a true
  billet-forged three-piece design: a 2 mm 1025C carbon steel face and
  1025C body with an internal tungsten weight low and toward the toe,
  precision-welded and injection-filled with polymer behind the face to
  lift ball speed and soften feel, with a CNC-milled multi-groove face.
  Lofts are modern (32-degree 7-iron, 45-degree pitching wedge) across a
  3-GW chart in satin polished chrome, right hand only, on a universal
  hosel that accepts .370 parallel or .355 taper shafts. GolfWorks sells
  the TS-1 as bare heads or built-to-spec custom sets rather than off the
  rack, so the lengths below are The GolfWorks' published standard
  men's steel assembly lengths. Still sold as of 2026, alongside the
  TS1-IM that joined the line in 2023.
