faq:
  - q: "What is the loft of a Maltby TS-1 7-iron?"
    a: "The Maltby TS-1 7-iron has a loft of 32 degrees and a lie of 62.5 degrees, with 0.115 inches of offset and a 37-inch length on The GolfWorks' standard steel build."
  - q: "What is the MPF rating of the Maltby TS-1?"
    a: "711 at the 6-iron — inside Maltby's Super Game Improvement playability band, which was the point: a compact players profile that still measures highly forgiving on the MPF scale."
  - q: "Is the Maltby TS-1 forged?"
    a: "Yes — a true billet-forged three-piece design: 1025C carbon steel body and 2 mm face with an internal tungsten toe weight, welded and injection-filled with polymer behind the face."
  - q: "How do you buy Maltby TS-1 irons?"
    a: "From The GolfWorks as bare heads or as custom-built sets to your specs; there is no off-the-rack retail version, and heads accept both .370 parallel and .355 taper shafts."
