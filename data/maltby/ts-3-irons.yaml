faq:
  - q: "What is the loft of a Maltby TS-3 7-iron?"
    a: "The Maltby TS-3 7-iron has a loft of 32 degrees and a lie of 62.5 degrees, with 0.110 inches of offset and a 37-inch length on The GolfWorks' standard steel build."
  - q: "Why is the Maltby TS-3 classed as super game improvement?"
    a: "Because of its measured forgiveness rather than its looks: it rates 849 on Maltby's MPF scale — Super Game Improvement territory — thanks to co-forged tungsten toe weighting and progressive cavities, despite a compact profile with a moderate topline."
  - q: "Is the Maltby TS-3 forged?"
    a: "Yes — true-forged from 1025C carbon steel in a five-step precision process, with the tungsten toe weight co-forged into the head rather than glued or screwed in."
  - q: "When did the Maltby TS-3 come out?"
    a: "It appeared with The GolfWorks' 2023 Maltby releases and remains on sale; a TS-3.5 head and a DBM black-finish version were added in 2025 alongside it."
