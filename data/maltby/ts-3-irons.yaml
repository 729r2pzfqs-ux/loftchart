sources:
  - "The GolfWorks official Maltby TS3 Iron Head page (golfworks.com/maltby-ts3-iron-head/p/ma0340/) and its factory specification chart — 4-GW lofts 22/25/28/32/36/40/44/48, lies 61-64, offsets 0.115 to 0.090 inches, bounces 3-5 degrees, head weights 245-289 g, satin chrome polish, 1025 carbon steel, .780-.800-inch progressive sole widths, universal hosel, and the listed MPF of 849, plus the construction copy: five-step true forging, co-forged tungsten toe weight, progressive cavity designs and CNC-milled multi-groove face."
