description: >
  The TS-3 joined Maltby's Tour Series in 2023 as the highest-MPF head in
  the family: it measures 849 at the 6-iron on Maltby's Playability
  Factor scale, deep in the Super Game Improvement band — the
  classification recorded here — even though it wears a diminutive,
  players-style profile with smooth lines and only a moderate topline.
  The trick is construction: each head is true-forged from 1025C carbon
  steel in a five-step precision process with a tungsten weight co-forged
  low and toward the toe, and the cavity design progresses through the
  set, shifting mass toe-ward and low in the long irons and toward
  neutral in the scoring clubs, over progressive .780-to-.800-inch sole
  widths. The CNC-milled face carries Maltby's multi-groove pattern, and
  lofts are moderate for the forgiveness on offer — a 32-degree 7-iron
  and 44-degree pitching wedge across a 4-GW chart in satin mirror
  nickel-chrome, right hand only. The GolfWorks sells it as bare heads or
  built-to-spec custom sets, so the lengths below are the company's
  published standard men's steel assembly lengths. A TS-3.5 and a DBM
  black finish followed in 2025 without retiring it.
