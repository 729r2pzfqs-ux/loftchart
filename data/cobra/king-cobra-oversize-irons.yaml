description: >
  The original King Cobra Oversize of 1994 was one of the irons that defined
  the oversize era, backed by Greg Norman and a major commercial success for
  the then-independent Cobra Golf. The investment-cast stainless head enlarged
  the hitting area well beyond the era's standard irons while keeping
  traditional lofts — 32 degrees at the 7-iron and 43 at the pitching wedge —
  on a set that ran from a 17-degree D1 driving iron (listed below as the
  2-iron) through gap and sand wedges, all built to a light D1 swing weight.
  It was sold through 1995 and followed by the King Cobra II in 1996; Cobra
  revived the oversize concept in 2016 with the KING OS.
