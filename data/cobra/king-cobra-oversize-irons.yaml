faq:
  - q: "What is the loft of a King Cobra Oversize 7-iron?"
    a: "The 1994 King Cobra Oversize 7-iron has a loft of 32 degrees, a lie of 62 degrees and a length of 37 inches."
  - q: "What clubs were available in the King Cobra Oversize set?"
    a: "The line ran from a 17-degree D1 driving iron through the 9-iron, plus a 43-degree pitching wedge, 50-degree gap wedge and 56-degree sand wedge, all at a D1 swing weight."
  - q: "Why were the King Cobra Oversize irons significant?"
    a: "Launched in 1994 with Greg Norman's backing, they were among the first hugely successful oversize irons, enlarging the face for forgiveness while keeping traditional lofts, and they established the oversize line Cobra continued with the King Cobra II and SS Oversize."
