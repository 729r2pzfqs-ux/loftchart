faq:
  - q: "What is the loft of a Cobra FP 7-iron?"
    a: "The 2006 King Cobra FP 7-iron has a loft of 33 degrees, a lie of 63 degrees and a length of 37 inches. The revised 2008 FP strengthened the 7-iron to 32.5 degrees."
  - q: "What does FP stand for in the Cobra FP irons?"
    a: "Cobra used FP to denote forgiveness and playability — the model sat between the maximum-forgiveness S9 and the Carbon CB players iron in the 2006 line."
  - q: "What clubs were available in the Cobra FP line?"
    a: "Heads ran from the 3-iron through a 60-degree lob wedge, including 50-degree gap and 55-degree sand wedges, in men's, women's and seniors' versions."
