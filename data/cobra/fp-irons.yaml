description: >
  The King Cobra FP — Cobra's shorthand for forgiveness and playability — was
  the mid-handicap iron in Cobra's 2006 line, sitting between the
  maximum-forgiveness S9 and the Carbon CB players model. The 431 stainless
  cavity back carries a urethane sole insert for feel and Cobra's Sweet Zone
  face, and it earned a Golf Digest Hot List gold medal in 2007. Lofts are a
  degree or so weaker than the S9's, with a 33-degree 7-iron and 45-degree
  pitching wedge. Sets were sold in men's, women's and seniors' versions; the
  men's specs are below, identical in steel and graphite lengths. A revised
  "2008 FP" with slightly stronger short-iron lofts and much less offset
  replaced it for 2008.
