faq:
  - q: "What is the loft of a Cobra KING TEC X (2024) 7-iron?"
    a: "The 2024 Cobra KING TEC X 7-iron has a loft of 27 degrees, a lie of 63.5 degrees and a steel-shaft length of 37.25 inches."
  - q: "Did the lofts change from the KING Forged Tec X?"
    a: "No. The 4-iron through gap wedge run 19, 21, 24, 27, 31.5, 36.5, 42 and 48 degrees on both."
  - q: "Is the Cobra KING TEC X hollow?"
    a: "Yes. Cobra describes a hollow body construction with an internal 70-gram tungsten weight."
  - q: "What is the pitching wedge loft on the KING TEC X?"
    a: "42 degrees, with a 48-degree gap wedge below it."
