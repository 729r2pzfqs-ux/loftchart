description: >
  The KING TEC X replaced the KING Forged Tec X in October 2024 as the larger
  and stronger-lofted of Cobra's two TEC irons, a hollow body with a 70-gram
  tungsten weight inside the head. The loft, lie and length chart is unchanged
  from the model it replaced: 27 degrees at the 7-iron and 42 at the pitching
  wedge, with lies one degree more upright than the KING TEC. The stock set
  is 5-iron to gap wedge in steel. A ONE Length version was sold alongside it;
  figures here are the variable-length men's right-handed steel build.
