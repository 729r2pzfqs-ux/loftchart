faq:
  - q: "What is the loft of a Cobra S2 Forged 7-iron?"
    a: "The Cobra S2 Forged 7-iron has a loft of 31 degrees, a lie of 62.5 degrees and a length of 37 inches."
  - q: "What year are the Cobra S2 Forged irons?"
    a: "Cobra announced the S2 Forged alongside the standard S2 in the autumn of 2009 as part of its 2010 line, so listings show either year. The S3 generation replaced it in 2011."
  - q: "Are the Cobra S2 Forged irons blades?"
    a: "No — they are forged 1025 carbon steel cavity backs with a tour-inspired shape, sitting between the multi-material S2 and Cobra's Pro CB/MB tour models in the 2010 line-up."
