description: >
  The S2 Forged is the better-player companion to Cobra's multi-material S2,
  launched with it in the autumn of 2009 for the 2010 season — retailers
  therefore usually list it as a 2010 iron. Heads are forged from 1025 carbon
  steel with a tour-inspired shape, and lofts sit between the game-improvement
  S2 and the carried-over Pro CB/MB blades: 31 degrees at the 7-iron and 43 at
  the pitching wedge, a degree or two stronger than a traditional players
  iron of the period. Cobra published the set 3-iron through gap wedge in
  steel only, on a Nippon N.S. Pro 1130 Tour stock shaft with a Golf Pride
  Tour Velvet grip, and did not publish offset figures.
