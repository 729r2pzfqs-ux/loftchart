description: >
  The Darkspeed fairway woods launched in January 2024 with the Darkspeed
  drivers. The X is the core all-round head in four lofts including a 16.5°
  high-flight 3HF; the titanium LS is the low-spin tour model, sold down to a
  13° 3+ wood; and the MAX is the forgiveness head with adjustable back and
  heel weights for draw bias. All three carry Cobra's eight-position MyFly8
  hosel with SmartPad. The DS-ADAPT fairways replaced the line in January
  2025.
variants:
  - name: Darkspeed X
    description: >
      The core all-round head in four lofts with a baffler-rail sole and
      neutral flight.
  - name: Darkspeed LS
    description: >
      The titanium low-spin tour head on flatter 55.7° lies, in 13° (3+),
      14.5° and 17.5° lofts for faster swings.
  - name: Darkspeed MAX
    description: >
      The forgiveness head with interchangeable back and heel sole weights
      for draw-bias tuning, in three lofts a half degree weaker than the X.
