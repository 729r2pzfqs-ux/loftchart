faq:
  - q: "What lofts do the Cobra Darkspeed fairway woods come in?"
    a: "The Darkspeed X comes in 15, 16.5, 18 and 21 degrees; the titanium LS in 13 (3+), 14.5 and 17.5; and the MAX in 15.5, 18.5 and 21.5."
  - q: "Is the Cobra Darkspeed fairway wood adjustable?"
    a: "Yes — all three heads use Cobra's eight-position MyFly8 hosel with SmartPad, moving loft 1.5 degrees down to 1.5 up, with three draw positions. The MAX also has interchangeable back and heel weights."
  - q: "What is the Darkspeed 3+ wood?"
    a: "The 13 degree titanium LS head — a strong-lofted, low-spin 3-wood built as a tee club for fast swings, adjustable from 11.5 to 14.5 degrees."
