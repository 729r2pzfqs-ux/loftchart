hosel:
  system: "MyFly8 with SmartPad"
  loft_range: "±1.5°"
  positions: 8
  lie_effect: >
    There is no independent lie adjustment; the three Draw positions add
    draw bias at their loft instead.
  face_note: >
    The SmartPad sole keeps the face visually square at address in all eight
    settings.
  notes: >
    The same chart as the Darkspeed drivers. "Draw" positions play the same
    loft with added draw bias (Cobra does not publish the exact face or lie
    delta). On the X 3-wood the settings run 13.5° to 16.5°; on the LS 3+,
    11.5° to 14.5°; on the MAX 3-wood, 14° to 17°.
