hosel:
  system: "FutureFit33"
  loft_range: "±2°"
  positions: 33
  lie_effect: "Lie adjusts ±2° from stock, independently of loft."
  face_note: >
    The SmartPad sole keeps the face visually square at address in every
    setting.
  notes: >
    The same two-dial system as the DS-ADAPT drivers and fairways: 33 unique
    loft/lie settings with A1 the neutral stock position. Cobra publishes the
    code-by-code degree chart only as a graphic reached from a QR code on the
    hosel, so no position-by-position table is reproduced here. Each stock
    loft covers ±2°: the 19° 3-hybrid plays 17-21°, the 24° 5-hybrid 22-26°.
