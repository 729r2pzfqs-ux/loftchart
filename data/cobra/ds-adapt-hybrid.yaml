faq:
  - q: "What lofts does the Cobra DS-ADAPT hybrid come in?"
    a: "Five lofts: 17, 19, 21, 24 and 28 degrees — the 2-hybrid through 6-hybrid."
  - q: "Is the Cobra DS-ADAPT hybrid adjustable?"
    a: "Yes — it was Cobra's first hybrid with the FutureFit33 hosel, which moves loft and lie independently up to 2 degrees each way across 33 settings, so each head covers a 4 degree loft window."
  - q: "What replaced the DS-ADAPT hybrid?"
    a: "The Cobra OPTM hybrids, launched in January 2026, which carry the same 33-setting hosel system."
