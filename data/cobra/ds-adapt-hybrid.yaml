description: >
  The DS-ADAPT hybrid launched in January 2025 with the DS-ADAPT woods and
  was the first Cobra hybrid with the FutureFit33 hosel, which moves loft and
  lie independently up to 2° each way. One roughly 125 cc head covers five
  lofts from a 17° 2-hybrid to a 28° 6-hybrid. The OPTM hybrids replaced the
  line in January 2026.
