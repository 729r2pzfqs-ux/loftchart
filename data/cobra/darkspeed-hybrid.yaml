faq:
  - q: "What lofts does the Cobra Darkspeed hybrid come in?"
    a: "Five lofts: 17, 19, 21, 24 and 28 degrees, with the 28 available by custom order only. Left-handed heads come in 19, 21 and 24."
  - q: "Is the Cobra Darkspeed hybrid adjustable?"
    a: "No — unlike the Darkspeed drivers and fairways with their MyFly8 hosels, the hybrid has a glued, fixed hosel and plays at its stamped loft. Adjustability arrived with the DS-ADAPT hybrid a year later."
  - q: "What is the difference between the Darkspeed and DS-ADAPT hybrids?"
    a: "The lofts are nearly identical (the DS-ADAPT 6-hybrid stays at 28 degrees), but the DS-ADAPT added Cobra's FutureFit33 hosel with 2 degrees of independent loft and lie adjustment, where the Darkspeed is fixed."
