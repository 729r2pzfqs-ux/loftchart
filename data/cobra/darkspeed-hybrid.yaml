description: >
  The Darkspeed hybrid launched in January 2024 with the Darkspeed woods —
  one head in five lofts with a 12 g mid-back weight for high launch and a
  fixed, glued hosel, unlike the MyFly-equipped drivers and fairways of the
  same family. Right-handed lofts run 17° to 28° (the 28° by custom order);
  left-handers get 19°, 21° and 24°. The DS-ADAPT hybrid replaced it in
  January 2025 and added hosel adjustability.
