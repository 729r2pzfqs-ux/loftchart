description: >
  The KING Forged Tec X is the larger, more forgiving sibling of Cobra's 2022
  KING Forged Tec: the same hollow-body, foam-filled construction with a thin
  forged PWRSHELL face, but with a 65-gram internal tungsten weight — 45 grams
  more than the standard Forged Tec — a slightly thicker top line, a wider sole
  and more offset. Cobra pitched it at players who want game-improvement
  distance and stability in a forged-looking head. Lofts are very strong, with
  a 27-degree 7-iron and a 42-degree pitching wedge, and the stock set is 4-PW
  or 5-GW. Offsets below are converted from Cobra's published millimetre
  figures, and lengths and swing weights are the steel-shaft values.
