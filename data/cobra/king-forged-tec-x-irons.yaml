faq:
  - q: "What is the loft of a Cobra KING Forged Tec X 7-iron?"
    a: "The Cobra KING Forged Tec X 7-iron has a loft of 27 degrees, a lie of 63.5 degrees and a length of 37.25 inches — one of the strongest-lofted 7-irons of its era."
  - q: "What is the difference between the KING Forged Tec and Forged Tec X?"
    a: "Both are hollow, foam-filled irons with a forged PWRSHELL face. The Tec X carries a 65-gram tungsten weight (45 grams more than the standard Forged Tec), a thicker top line, a wider sole, more offset and stronger lofts — 27 degrees at the 7-iron against the standard model's 29.5."
  - q: "Who is the Cobra KING Forged Tec X for?"
    a: "Cobra aimed it at mid-to-high handicappers who want game-improvement forgiveness and distance in a forged-looking head; reviewers labelled it a 'players game-improvement' iron."
