faq:
  - q: "What is the loft of a Cobra Fly-Z XL 7-iron?"
    a: "The Cobra Fly-Z XL 7-iron has a loft of 31.5 degrees, a lie of 62 degrees and a length of 37.5 inches."
  - q: "What clubs come in a stock Cobra Fly-Z XL set?"
    a: "The stock set is eight clubs, 4-iron through pitching wedge plus a gap wedge, in steel; graphite was a custom order. A 55-degree sand wedge was also catalogued."
  - q: "What is the difference between the Fly-Z and the Fly-Z XL?"
    a: "The XL is larger, longer and more forgiving: each club is about a quarter-inch longer, lofts run roughly a degree weaker, offset is greater, and the 4-8 irons use a hollow dual-cavity body where the standard Fly-Z uses an undercut cavity."
