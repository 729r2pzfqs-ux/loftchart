description: >
  The Fly-Z XL is the oversized, maximum-forgiveness member of Cobra's 2015
  Fly-Z iron family. The 4 through 8 irons use a dual-cavity design whose hollow
  lower half drives the centre of gravity low and deep for easy launch, while
  the 9-iron through sand wedge switch to a deep perimeter undercut for
  accuracy; a Speed Channel trench behind the face perimeter thins the face for
  ball speed. Lofts are about a degree weaker than the standard Fly-Z — 31.5
  degrees at the 7-iron, 45 at the pitching wedge — with generous progressive
  offset for a draw bias, and each club is built a quarter-inch longer than the
  Fly-Z. The stock set is eight clubs, 4-PW plus gap wedge, in steel; graphite
  was custom-order. Offsets below are converted from Cobra's published
  millimetre figures, and swing weights are the steel build.
