description: >
  Cobra's KING Forged CB is the cavity-back half of a pair sold with a matching
  muscleback, and Cobra let buyers order a full CB set, a full MB set or a
  split set — typically CB through the 6-iron and MB from the 7 down. Both are
  five-step forged from 1025 carbon steel, with a tungsten weight in the sole
  of the cavity-back heads. The set is built long by tour-iron standards, 37.5
  inches at the 7-iron, and lofts are traditional at 34 degrees there.
