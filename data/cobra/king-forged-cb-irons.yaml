faq:
  - q: "What is the loft of a Cobra KING Forged CB 7-iron?"
    a: "The Cobra KING Forged CB 7-iron has a loft of 34 degrees, a lie of 62.5 degrees and a length of 37.50 inches."
  - q: "Can you mix Cobra KING Forged CB and MB irons?"
    a: "Yes — Cobra sold the pair as a deliberate combo. A common build runs cavity backs through the 6-iron and musclebacks from the 7-iron down, and Cobra offered full CB, full MB or split sets."
  - q: "When were Cobra KING Forged CB irons made?"
    a: "They were released in 2019."
  - q: "Why are Cobra KING Forged CB irons so long?"
    a: "Cobra builds them at 37.50 inches for the 7-iron, half an inch longer than most tour cavity backs, which is consistent across the KING forged line of that period."
