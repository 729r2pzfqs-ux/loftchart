sources:
  - "2nd Swing Golf specification table for the Cobra 2023 KING Tour iron set (2ndswing.com/golf-clubs/iron-sets/cobra-2023-king-tour-iron-set) — supplied every loft, lie, length and swing weight above, the offsets in millimetres (3.8 mm at the 3-iron down to 1.9 mm in the wedges, converted to inches here), the forged 1025 carbon steel construction and the stock KBS $-Taper 120g shaft with Lamkin Crossline grip."
  - "Fairway Jockey Cobra 2023 KING Tour custom irons page — corroborated the lofts, lies and lengths for 3-iron through GW and the five-step 1025 forging. Its table prints the PW at 36.25 inches where 2nd Swing prints 36.0; 2nd Swing's figure is used, as it continues the set's quarter-inch progression."
  - "Cobra's own product page (cobragolf.com/products/king-tour-irons-2023) — confirmed the 4-PW and 5-GW set options and the 3.8 mm to 1.9 mm progressive offset range; the page's spec table itself did not render in the retrieved content, so per-club figures rest on the retail tables and confidence stays medium."
  - "todays-golfer.com 'Cobra King Tour, CB and MB Irons (2023) Review' — forged (not MIM) construction, the CNC undercut cavity, TPU insert and aluminium medallion absent from the CB/MB, the 32-degree/2.5 mm 7-iron cross-check, the 2023 launch, and the note that the blade is slightly shorter than the previous King Tour MIM irons. Plugged In Golf's February 2023 review corroborated the five-step forging with the 2,000-ton, 700-degree final strike."
  - "MyGolfSpy 'COBRA KING Black Edition TOUR and CB/MB Irons' — the 2024 Black Edition is a finish variant of this same iron. year_discontinued is null because no replacement had been confirmed in the sources retrieved; Golf Digest's 2026 Hot List still carries the King Tour, though Cobra's 2026 KING/3DP Tour releases suggest a changeover is near."
