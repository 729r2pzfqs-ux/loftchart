description: >
  The 2023 King Tour is the technical cavity-back in Cobra's players range, launched
  at retail in February 2023 alongside the one-piece forged King CB and MB. It marks
  a construction change from the King MIM Tour it replaced: instead of metal
  injection moulding, each head goes through a five-step forging from 1025 carbon
  steel, the fifth step pressing the head at 2,000 tons and 700 degrees Celsius for a
  uniform grain structure. CNC undercuts in the back cavity run progressively deeper
  in the long irons, and a TPU insert and aluminium medallion damp vibration —
  technology the plainer CB and MB do without. The blade is slightly shorter than
  the King MIM Tour's and the build a quarter inch shorter through most of the set,
  with traditional lofts (32-degree 7-iron, 44-degree pitching wedge) and a stock
  KBS $-Taper 120 shaft. Heads run 3-iron through gap wedge, with 4-PW the standard
  set. A blacked-out King Tour Black Edition finish followed in 2024, and the model
  remained in Cobra's line into 2026.
