faq:
  - q: "What is the loft of a Cobra King Tour (2023) 7-iron?"
    a: "The 2023 Cobra King Tour 7-iron has a loft of 32 degrees, a lie of 62.0 degrees and a steel-shaft length of 37.25 inches."
  - q: "Is the 2023 Cobra King Tour a MIM iron?"
    a: "No. Unlike the King MIM Tour it replaced, the 2023 King Tour is forged — a five-step process from 1025 carbon steel finishing with a 2,000-ton strike — with a TPU insert and aluminium medallion in the cavity."
  - q: "How does the 2023 King Tour differ from the King MIM Tour?"
    a: "Beyond the switch from metal injection moulding to forging, the lofts are one degree stronger through most of the set (32 versus 33 at the 7-iron), the build is a quarter inch shorter, the blade is slightly shorter, and the gap wedge is 48 rather than 50 degrees."
