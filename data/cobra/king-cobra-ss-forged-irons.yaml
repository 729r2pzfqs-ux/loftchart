faq:
  - q: "What is the loft of a King Cobra SS Forged 7-iron?"
    a: "The King Cobra SS Forged 7-iron has a loft of 35 degrees, a lie of 62.5 degrees and a steel-shaft length of 37 inches."
  - q: "Are the King Cobra SS Forged irons really forged?"
    a: "Yes — unlike the cast SS Oversize sold alongside them, these heads are forged from S30C carbon steel and then nickel-chrome plated."
  - q: "Was there a 1999 King Cobra SS iron?"
    a: "No. Cobra's 1999 and 2000 irons were the Gravity Back and CXI; the SS name first appeared with the 2002 generation, which comprised the cast SS Oversize and this SS Forged model."
