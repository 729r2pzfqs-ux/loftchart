description: >
  The King Cobra SS Forged is the better-player half of Cobra's 2002 SS
  generation, sold alongside the cast King Cobra SS Oversize. Heads are forged
  from soft S30C carbon steel and nickel-chrome plated, with traditional lofts
  of 35 degrees at the 7-iron and 47 at the pitching wedge. Cobra listed the
  three wedges by loft rather than by letter — 50, 55 and 60 degrees, shown
  here as GW, SW and LW — and published the set in steel only, at a D2.5 swing
  weight throughout. As with the other SS-era records, Cobra's offset column
  runs backwards relative to normal convention (increasing toward the wedges),
  so it is not reproduced here. A note for anyone researching this era: no
  1999 "King Cobra SS" iron exists — Cobra's 1999-2000 line was the Gravity
  Back and CXI, and the SS name arrived with this 2002 generation.
