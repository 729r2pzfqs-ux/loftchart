description: >
  The King Cobra II is the 1996 follow-up to the King Cobra Oversize, the
  best-selling oversize iron of its era, and is usually catalogued as the King
  Cobra II Oversize to distinguish it from the 1997 King Cobra II Tour. Cobra
  announced it on 31 July 1996 and shipped the first fifteen thousand sets that
  September. Its Integrated Quad System combined four features — heel-side
  weighting on the hosel, a shaped "Hump" shaft with an oversize stabilising
  tip, a dual-purpose sole and an oversize cavity back — all aimed at putting
  more hits on the sweet spot. Heads are cast 17-4 stainless steel with a blast
  finish and black and gold accents. The stock set ran 1, 3-9, PW, GW and SW,
  with a 2-iron and lob wedge also catalogued; Cobra published a single length
  column alongside its Hump graphite, Hump steel and Apollo steel shaft
  options. Lofts are traditional, with a 32-degree 7-iron and a 45.5-degree
  pitching wedge.
