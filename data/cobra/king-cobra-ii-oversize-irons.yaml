faq:
  - q: "What is the loft of a King Cobra II 7-iron?"
    a: "The King Cobra II Oversize 7-iron has a loft of 32 degrees, a lie of 62 degrees and a length of 37 inches."
  - q: "What year did the King Cobra II irons come out?"
    a: "Cobra announced the King Cobra II on 31 July 1996 and shipped the first sets to shops that September. The better-player King Cobra II Tour followed in January 1997."
  - q: "What is the Integrated Quad System on King Cobra II irons?"
    a: "It combines heel-side weighting, a shaped graphite shaft with an oversize stabilising tip, a dual-purpose sole and an oversize cavity back, all designed to help golfers strike the sweet spot more often."
