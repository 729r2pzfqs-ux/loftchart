faq:
  - q: "What is the loft of a Cobra KING MAX 7-iron?"
    a: "The Cobra KING MAX 7-iron has a loft of 29.5 degrees, a lie of 64 degrees and a length of 37.25 inches."
  - q: "When were the Cobra KING MAX irons released?"
    a: "Cobra announced the KING and KING MAX irons on 19 January 2026, and they reached retail on 6 February 2026 at $999 for a seven-piece steel set."
  - q: "How does the KING MAX differ from the standard Cobra KING iron?"
    a: "The KING MAX uses a larger head with a thicker topline and wider sole, lofts about 2 degrees weaker than the KING, and more offset with draw-biased weighting. It is aimed at golfers with average-to-moderate swing speeds who want maximum launch and forgiveness."
  - q: "What clubs come in a stock Cobra KING MAX set?"
    a: "The stock steel set is 5-iron through gap wedge; graphite sets are sold as 5-iron through pitching wedge plus gap wedge. A 4-iron and 56-degree sand wedge are catalogued as singles."
