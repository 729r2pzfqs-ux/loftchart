description: >
  The KING MAX is the maximum-forgiveness half of the two-model KING iron family
  Cobra announced on 19 January 2026, at retail from 6 February 2026 at $999 in
  steel. Against the standard KING it has an oversized, confidence-inspiring
  shape, lofts about 2 degrees weaker — a 29.5-degree 7-iron and a 44.5-degree
  pitching wedge — and added offset with draw-biased weighting, aimed at players
  with average-to-moderate swing speeds and shallow attack angles. A 3D-printed
  internal medallion with intricate latticing frees mass to lower the centre of
  gravity, and the 360 SPEEDSHELL face with H.O.T. Face technology wraps the sole
  for more face flex. The stock steel set is 5-iron through gap wedge; graphite is
  sold as 5-PW plus gap wedge. Swing weights below are the steel build, and
  offsets are converted from Cobra's published millimetre figures.
