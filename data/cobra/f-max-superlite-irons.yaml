description: >
  The F-Max Superlite is the lightweight follow-up to Cobra's F-Max,
  engineered for golfers with moderate swing speeds: the head is 4 grams
  lighter, the shaft 5 grams lighter and the grip 7 grams lighter than the
  original F-Max, a total saving of 16 grams. Progressive hosel lengths keep
  the centre of gravity low in the long irons and higher in the short irons,
  and offset tapers from generous in the long irons to modest in the wedges.
  Lofts are moderate for the category, with a 31.5-degree 7-iron and a
  45-degree pitching wedge. The stock men's steel set was seven clubs, 5-PW
  plus gap wedge, with graphite combo sets substituting hybrids for the long
  irons. It reached retail on 5 October 2018 as Cobra's 2019-season
  lightweight iron. Offsets below are converted from Cobra's published
  millimetre figures.
