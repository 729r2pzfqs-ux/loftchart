faq:
  - q: "What is the loft of a Cobra F-Max Superlite 7-iron?"
    a: "The Cobra F-Max Superlite 7-iron has a loft of 31.5 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "Who are the Cobra F-Max Superlite irons for?"
    a: "Golfers with moderate swing speeds who want maximum help: the head, shaft and grip are together 16 grams lighter than the original F-Max to make the club easier to swing faster."
  - q: "What clubs come in a stock F-Max Superlite set?"
    a: "The stock men's steel set is seven clubs, 5-iron through pitching wedge plus a 50-degree gap wedge. Graphite combo sets replace the long irons with hybrids, and a 4-iron was available custom."
