faq:
  - q: "What lofts does the Cobra OPTM come in?"
    a: "The OPTM LS and OPTM X come in 9 and 10.5 degrees, the OPTM Max-K in 9, 10.5 and 12, and the OPTM Max-D in 10.5 and 12. With the FutureFit33 hosel each head adjusts a further 2 degrees either way."
  - q: "How does the OPTM's FutureFit33 hosel work?"
    a: "Two dials — a letter ring A-H and a number ring 1-8 — give 33 unique settings that move loft and lie up to 2 degrees each, independently. A1 is the neutral stock setting, and Cobra's chart (reached from a QR code on the hosel) is organised by the miss you want to correct."
  - q: "Which OPTM driver is the most forgiving?"
    a: "The OPTM Max-K — Cobra claims roughly 10,000 g·cm² of combined MOI from its fixed 11 gram back weight and carbon construction, making it the brand's most stable driver to date. The Max-D trades some of that stability for built-in draw bias."
  - q: "Does the FutureFit33 hosel keep the face square?"
    a: "Yes — Cobra's SmartPad sole is designed so the face sits visually square at address in all 33 settings, unlike conventional sleeves where adding loft visibly closes the face."
