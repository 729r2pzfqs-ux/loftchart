description: >
  OPTM is Cobra's 2026 driver family, at retail from 20 January 2026. It
  keeps the FutureFit33 hosel introduced on the DS-ADAPT — 33 unique loft and
  lie combinations — and adds AI-driven "Product of Inertia" head shaping
  meant to reduce how much the head twists on off-centre strikes, with the
  Max-K claimed at around 10K combined MOI. The four heads are the low-spin
  LS with movable weights, the all-round X, the max-forgiveness Max-K with a
  fixed 11 g back weight, and the draw-biased Max-D. All run the H.O.T.
  variable-thickness face with fifteen machine-learned hot zones.
variants:
  - name: OPTM LS
    head_cc: 460
    description: >
      The low-spin, low-launch compact-shape head with movable weights, for
      faster swings (roughly 105 mph and up) that spin the ball too much and
      want a penetrating, workable flight.
  - name: OPTM X
    head_cc: 460
    description: >
      The balanced all-rounder — traditional shape with symmetrical
      perimeter weighting, mixing ball speed and forgiveness for
      mid-handicappers.
  - name: OPTM Max-K
    head_cc: 460
    description: >
      Cobra's highest-MOI driver yet (~10K claimed), with a fixed 11 g back
      weight and neutral bias — the straight-and-stable head with the
      highest launch and spin in the line.
  - name: OPTM Max-D
    head_cc: 460
    description: >
      The draw-biased head with internal heel-biased mass and a slightly
      closed look at address for chronic slicers; a 40 g Vanquish shaft
      option suits slower swings.
