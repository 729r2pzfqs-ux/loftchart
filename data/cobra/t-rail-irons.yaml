description: >
  The T-Rail is Cobra's 2019 hybrid-iron set for moderate swing speeds, reviving
  the split-rail Baffler sole on a fully hollow, wide-soled body with a forged
  455 stainless face insert. The stock seven-club set replaces the 4-iron with a
  21-degree 4-hybrid and runs 5-iron through pitching wedge, all in lightweight
  graphite; steel was custom-order only, and gap and sand wedge heads plus 5 and
  6 hybrids were catalogued. Lofts match Cobra's game-improvement irons at 30
  degrees in the 7-iron and 44 in the pitching wedge, with generous offset that
  tapers from 4.2 mm to 1.0 mm. Lengths and the C9 swing weight below are the
  stock graphite build, and offsets are converted from Cobra's published
  millimetre figures. A second-generation T-Rail followed in 2021.
