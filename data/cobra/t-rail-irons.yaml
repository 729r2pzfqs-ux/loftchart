faq:
  - q: "What is the loft of a Cobra T-Rail 7-iron?"
    a: "The Cobra T-Rail 7-iron has a loft of 30 degrees, a lie of 62.5 degrees and a stock graphite length of 37.25 inches."
  - q: "What clubs come in a stock Cobra T-Rail set?"
    a: "The stock set is seven clubs: a 21-degree 4-hybrid plus 5-iron through pitching wedge, all with lightweight graphite shafts. Gap and sand wedges and 5 and 6 hybrids were available, and steel shafts were custom-order only."
  - q: "What makes the T-Rail different from a normal iron?"
    a: "Each head is fully hollow with a wide sole carrying Cobra's split Baffler rails, which lower the centre of gravity and smooth turf interaction. It is built very light, with 55-gram graphite shafts and a C9 swing weight."
