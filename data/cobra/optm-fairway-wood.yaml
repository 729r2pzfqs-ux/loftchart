faq:
  - q: "What lofts do the Cobra OPTM fairway woods come in?"
    a: "The OPTM X comes in 15, 16.5, 18, 21 and 24 degrees; the OPTM MAX in 15.5, 18.5, 21.5 and 24.5; and the titanium OPTM LS Ti in 14.5, 16 and 17."
  - q: "Are the Cobra OPTM fairway woods adjustable?"
    a: "Yes — every head carries Cobra's FutureFit33 hosel with 33 loft and lie settings covering plus or minus 2 degrees each way, and the SmartPad sole keeps the face square in every setting. The OPTM MAX adds two movable sole weights."
  - q: "What is the difference between the OPTM X and OPTM MAX fairway woods?"
    a: "The X is the core all-round head with 58-58.8 degree lies in five lofts. The MAX is the larger game-improvement head sold half a degree weaker per loft, with more upright lies, a lighter 50 gram stock shaft and two movable weights for draw or trajectory bias."
  - q: "What replaced the Cobra DS-ADAPT fairway woods?"
    a: "These — the OPTM fairways replaced the DS-ADAPT line in January 2026."
confidence: high
