hosel:
  system: "FutureFit33"
  loft_range: "±2°"
  positions: 33
  lie_effect: "Lie adjusts ±2° from stock, independently of loft."
  face_note: >
    The SmartPad sole keeps the face visually square at address in every
    setting.
  notes: >
    FutureFit33 works through two dials — an A-H ring and a 1-8 ring — whose
    combinations collapse to 33 unique loft/lie settings, with A1 the
    neutral stock position; the system is identical on the OPTM drivers,
    fairways and hybrids. Cobra publishes the code-by-code degree chart only
    as a graphic reached from a QR code on the hosel, so none is reproduced
    here. Each stock loft covers roughly ±2°: the 15° OPTM X 3-wood plays
    13-17°, the 14.5° LS Ti plays 12.5-16.5°. Retailer-published lies for
    the OPTM MAX's higher lofts disagree (60-62° in one listing, about
    61-61.8° in another), so only the consistently reported 3-wood lie is
    charted.
