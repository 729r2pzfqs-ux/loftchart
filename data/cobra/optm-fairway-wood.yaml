description: >
  The OPTM metalwoods launched in January 2026, replacing the DS-ADAPT line
  after one season and carrying over Cobra's FutureFit33 hosel — 33 loft and
  lie settings within ±2° — on every head. Three fairway models mirror the
  driver lineup: the compact titanium OPTM LS Ti for low spin and workability
  at $469, the core OPTM X in five lofts from a 15° 3-wood to a 24° 9-wood at
  $369, and the larger game-improvement OPTM MAX with two movable sole
  weights at $329.
variants:
  - name: OPTM LS Ti
    description: >
      The premium low-spin head with a full titanium body and tungsten
      weighting, in three strong lofts (14.5° 3-wood, 16° 3HF, 17° 5-wood)
      with flat 56-56.5° lies at a D3.5 swing weight and a heavier Kai'li
      Dark Waves White 60 shaft.
  - name: OPTM X
    description: >
      The core all-round head in five lofts from 15° to 24°, around 180 cc in
      the 3-wood, balancing speed and forgiveness with a back weight for
      stability.
  - name: OPTM MAX
    description: >
      The most forgiving, game-improvement model with two movable sole
      weights (14 g and 3 g, back or heel) for trajectory and draw tuning,
      in four half-degree-weaker lofts from 15.5° on a lighter Kai'li Dark
      Waves Red 50 shaft.
