faq:
  - q: "What lofts does the Cobra Snakebite come in?"
    a: "The Snakebite was sold from 48 to 60 degrees — 13 loft, bounce and grind combinations across the Versatile, Classic and Widelow grinds."
  - q: "What grinds does the Cobra Snakebite offer?"
    a: "Three: Versatile (8-10 degrees of bounce, every loft), Classic (11-12 degrees, 52-60) and the wide low-bounce Widelow (4-7 degrees, 56-60)."
  - q: "Is the Cobra Snakebite still in production?"
    a: "No. Cobra replaced it with the KING and KING X wedges in March 2025, so the used and closeout market is the source — the Raw finish version was the last addition, in 2024."
