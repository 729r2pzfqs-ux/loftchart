description: >
  The Snakebite is Cobra's 2023 tour wedge generation, announced in March
  2023, with the unplated Raw finish added in March 2024. Its CNC-milled
  SNAKEBITE grooves are 11 percent deeper with 40 percent sharper edges than
  the previous generation, cut narrow and deep on the 48 to 54 degree heads
  and wider, shallower and full-face on 56 to 60. The matrix runs 13
  loft/bounce/grind combinations from 48 to 60 degrees across three grinds.
  Cobra replaced the line with the KING and KING X wedges in March 2025. A
  one-length build and the cavity-back Snakebite-X variant were sold
  alongside the standard model and are not charted here.
grinds:
  - code: V
    name: Versatile Grind
    description: >
      The all-around grind for medium to firm conditions, with heel, toe and
      trailing-edge relief for open-face shots and a centre notch that keeps
      the leading edge close to the ground without adding effective bounce.
  - code: C
    name: Classic Grind
    description: >
      A medium-width, higher-bounce sole with progressive width from heel to
      toe and trailing-edge relief, for neutral to steeper swings in a
      variety of conditions.
  - code: W
    name: Widelow Grind
    description: >
      A wide, low-bounce sole for soft bunkers, soft turf and medium rough
      that keeps the leading edge from digging.
