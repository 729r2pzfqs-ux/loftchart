description: >
  The KING is Cobra's standard game-improvement iron for 2026, announced in
  January 2026 alongside the larger KING MAX as the replacement for the
  DS-ADAPT, and at retail from 6 February 2026 at $999 in steel. It has the
  more traditional shape and the stronger lofts of the two — a 27.5-degree
  7-iron and a 42.5-degree pitching wedge, about 2 degrees stronger than the
  KING MAX — and Cobra aims it at faster swingers in the 10 to 20 handicap
  range. A 3D-printed lattice medallion frees mass to lower the centre of
  gravity, an 80g catapult weight is suspended in polymer behind the 360
  SPEEDSHELL face, and the SKID SOLE adds leading-edge bounce. Stock steel sets
  are 4-iron through pitching wedge or 5-iron through gap wedge; graphite is
  sold as 5-PW plus gap wedge. Swing weights below are the steel build, and
  offsets are converted from Cobra's published millimetre figures.
