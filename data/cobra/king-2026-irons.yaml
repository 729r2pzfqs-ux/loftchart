faq:
  - q: "What is the loft of a Cobra KING (2026) 7-iron?"
    a: "The Cobra KING (2026) 7-iron has a loft of 27.5 degrees, a lie of 63.5 degrees and a length of 37.25 inches."
  - q: "How does the Cobra KING differ from the KING MAX?"
    a: "The KING has the more traditional shape, less offset and lofts about 2 degrees stronger: a 27.5-degree 7-iron and 42.5-degree pitching wedge against 29.5 and 44.5 on the KING MAX. Lengths are the same. Cobra aims the KING at faster swingers and the MAX at moderate swing speeds."
  - q: "How do the Cobra KING lofts compare with the DS-ADAPT?"
    a: "They are half a degree weaker from the 5-iron to the pitching wedge — the 7-iron is 27.5 degrees against 27 and the pitching wedge 42.5 against 42 — while the 4-iron, gap wedge and sand wedge are unchanged at 19, 48 and 54 degrees. Lies and lengths are the same."
  - q: "What clubs come in a stock Cobra KING set?"
    a: "Stock steel sets are 4-iron through pitching wedge or 5-iron through gap wedge, and graphite sets are 5-iron through pitching wedge plus gap wedge. The specification table also lists a 54-degree sand wedge."
