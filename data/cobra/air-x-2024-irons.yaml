faq:
  - q: "What is the loft of a 2024 Cobra Air-X 7-iron?"
    a: "The 2024 Cobra Air-X 7-iron has a loft of 30 degrees, a lie of 62.5 degrees and a length of 37.25 inches — 1.5 degrees stronger than the 2022 original."
  - q: "Are the Cobra Air-X (2024) and the Air-X 2 the same irons?"
    a: "Yes. Cobra launched the second-generation Air-X in autumn 2023 and markets it as the 2024 AIR-X; several retailers list the identical set under the name AIR-X 2."
  - q: "How do the 2024 Air-X irons differ from the 2022 originals?"
    a: "The mid and short irons are about 1.5 degrees stronger — a 30-degree 7-iron against 31.5 — with slightly more offset, and the face uses an updated A.I.-designed H.O.T. Face variable-thickness pattern. The ultra-lightweight build with 97-gram steel or 55-gram graphite shafts carries over."
