description: >
  The second-generation Air-X is Cobra's lightweight easy-launch iron, launched in
  autumn 2023 and marketed as the 2024 AIR-X — some retailers list it as the
  AIR-X 2. Against the 2022 original the mid and short irons are about 1.5 degrees
  stronger, with a 30-degree 7-iron and a 43.5-degree pitching wedge, and offset
  grows slightly, tapering from 7.6 mm at the 4-iron to 2.0 mm at the sand wedge.
  An updated A.I.-designed H.O.T. Face variable-thickness pattern spreads ball
  speed across the face, and weight concentrated in the heel promotes a draw. The
  build stays ultra-light — a 97-gram FST Ultralite steel shaft or 55-gram
  Ultralite graphite — and Cobra publishes one length column for both shafts, so
  the lengths below apply to either build. Swing weights shown are the steel
  values (D0, D1 in the wedges; graphite swings at C6-C9). The stock steel set is
  seven clubs, 5-iron through gap wedge, right-hand only.
