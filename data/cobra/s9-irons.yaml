description: >
  The King Cobra S9 was Cobra's flagship game-improvement iron of the late
  Acushnet era, a multi-material design combining a 431 stainless steel body
  with a polymer topline and a urethane insert to raise inertia and push the
  centre of gravity low and back. Cobra's US site was already selling it in
  August 2006, and the line was refreshed for 2008 as the "2008 S9" with
  identical published specs — retailers therefore date it anywhere from 2006 to
  2008. Lofts are moderately strong, with a 32.5-degree 7-iron and 44-degree
  pitching wedge, on generous offset. Sets were sold in men's, women's and
  seniors' versions; the men's specs are below, with the same lengths in steel
  and graphite. It was replaced by the Cobra S2 in 2009.
