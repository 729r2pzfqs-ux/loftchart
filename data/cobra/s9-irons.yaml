faq:
  - q: "What is the loft of a Cobra S9 7-iron?"
    a: "The King Cobra S9 7-iron has a loft of 32.5 degrees, a lie of 63 degrees and a length of 37 inches."
  - q: "What year are the Cobra S9 irons?"
    a: "Cobra was selling the S9 by August 2006 and refreshed the line as the '2008 S9' with identical specs, so listings date it anywhere from 2006 to 2008. The Cobra S2 replaced it in 2009."
  - q: "What clubs were available in the Cobra S9 line?"
    a: "Heads ran from the 3-iron through a 59-degree lob wedge, with a 49-degree gap and 54-degree sand wedge. Sets came in men's, women's and seniors' versions in steel or graphite."
