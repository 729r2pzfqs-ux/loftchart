faq:
  - q: "What is the loft of a Cobra King MIM Tour 7-iron?"
    a: "The Cobra King MIM Tour 7-iron has a loft of 33 degrees, a lie of 62.5 degrees and a length of 37.5 inches."
  - q: "What does MIM mean on a Cobra iron?"
    a: "Metal injection moulding — the head is formed from powdered stainless steel under pressure rather than forged or cast. Cobra used it to hold tighter shape tolerances."
  - q: "When were Cobra King MIM Tour irons made?"
    a: "In 2021. Cobra replaced them with the forged King Tour, which reached retail in February 2023."
