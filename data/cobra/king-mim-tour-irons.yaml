description: >
  The King MIM Tour is one of the few production irons made by metal injection
  moulding rather than forging or investment casting — the head is formed from
  powdered stainless under pressure, which Cobra used to hold tighter tolerances than
  a cast head allows. The set is built long for a players iron, at 39.5 inches for the
  3-iron and 37.5 for the 7, with traditional lofts and a 33-degree 7-iron.
