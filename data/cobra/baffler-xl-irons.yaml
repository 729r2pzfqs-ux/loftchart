faq:
  - q: "What is the loft of a Cobra Baffler XL 7-iron?"
    a: "The Cobra Baffler XL 7-iron has a loft of 30.5 degrees, a lie of 63 degrees and a length of 37.25 inches."
  - q: "What clubs come in a stock Cobra Baffler XL set?"
    a: "The stock set is eight clubs, 4-iron through pitching wedge plus a 48.5-degree gap wedge, in steel; graphite was custom-order only. A 54-degree sand wedge was also catalogued."
  - q: "What makes the Baffler XL different from other Cobra irons?"
    a: "It carries the rail sole from Cobra's Baffler utility woods: oversized rails on a wide sole that improve turf interaction, combined with an oversized face and heavy offset for a high, draw-biased flight."
