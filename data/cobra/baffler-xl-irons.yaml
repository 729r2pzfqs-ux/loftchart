description: >
  The Baffler XL brought Cobra's rail-soled Baffler utility concept to a full
  iron set aimed at maximum game improvement. An oversized face with large
  progressive offset produces a high, draw-biased flight, a deep undercut
  cavity pushes weight back for inertia, and the wide sole's oversized rails
  smooth turf interaction from any lie. Lofts are traditional for the class —
  30.5 degrees at the 7-iron, 43.5 at the pitching wedge. Cobra's product page
  first appeared in November 2013 alongside the BiO Cell launch, selling as the
  2014 season's entry line, so this record's 2013 is the announcement year. The
  stock set is eight clubs, 4-PW plus gap wedge, in steel; graphite was
  custom-order only. Cobra published a single length column covering both shaft
  materials and no offset figures. The Fly-Z XL replaced it in 2015.
