description: >
  The Air-X was Cobra's budget lightweight iron for golfers with moderate swing
  speeds, announced on 25 January 2022 and at retail from 28 January 2022 as the
  replacement for the F-Max Airspeed. The cavity-back heads carry weak lofts — a
  31.5-degree 7-iron and a 45-degree pitching wedge — generous offset tapering
  from 6.74 mm at the 4-iron to 0.97 mm at the sand wedge, and heel-biased
  weighting for a draw. The lightweight brief runs through the whole build: a
  97-gram FST Ultralite steel shaft, a 55-gram Ultralite graphite option and a
  41-gram Lamkin REL grip, with the graphite set swinging at just C7.5 against D0
  in steel. Cobra published one length column for both shafts, so the lengths
  below apply to either build; the swing weights shown are the steel values. The
  stock set was seven clubs, 5-iron through gap wedge.
