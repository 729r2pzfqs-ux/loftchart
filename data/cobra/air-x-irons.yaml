faq:
  - q: "What is the loft of a Cobra Air-X 7-iron?"
    a: "The 2022 Cobra Air-X 7-iron has a loft of 31.5 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "When were the original Cobra Air-X irons released?"
    a: "Cobra announced them on 25 January 2022 and they reached retail on 28 January 2022. A second-generation Air-X, marketed as the 2024 model, replaced them in autumn 2023."
  - q: "Who were the Cobra Air-X irons designed for?"
    a: "Golfers with moderate swing speeds — Cobra targeted players with driver speeds under about 90 mph. The build is ultra-light, with a 97-gram steel or 55-gram graphite shaft and a 41-gram grip, plus weak lofts, generous offset and heel-biased draw weighting for easy launch."
