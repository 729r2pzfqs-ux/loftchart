  - "Cobra Golf official 'AIR-X Irons' product page (cobragolf.com/air-x-irons), archived 1 February 2022 via web.archive.org — retrieved directly; supplies the full specification table (club, loft, lie, offset in mm, length shared by graphite and steel, graphite and steel swing weights, stock flexes, RH/LH) for the 4-iron through sand wedge, the seven-club 5-GW stock steel set, the Cobra FST Ultralite 97g steel and Ultralite 50/45 55g graphite shaft tables, the Lamkin REL Standard 41g grip and the $699 price. Offsets are published in millimetres (6.74 down to 0.97) and converted to inches here."
