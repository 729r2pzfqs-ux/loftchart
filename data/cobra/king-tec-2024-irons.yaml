faq:
  - q: "What is the loft of a Cobra KING TEC (2024) 7-iron?"
    a: "The 2024 Cobra KING TEC 7-iron has a loft of 29.5 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.25 inches."
  - q: "Did the lofts change from the 2022 KING Forged Tec?"
    a: "No. The 4-iron through gap wedge run 21, 23, 26, 29.5, 34, 39, 44 and 49 degrees on both, with the same lies and lengths."
  - q: "What is the difference between the KING TEC and the KING TEC X?"
    a: "The KING TEC X is the larger, stronger-lofted model. Its 7-iron is 27 degrees against 29.5 and its pitching wedge 42 against 44, and its lies are one degree more upright. Lengths are the same club for club."
  - q: "What is the pitching wedge loft on the KING TEC?"
    a: "44 degrees, with a 49-degree gap wedge below it."
