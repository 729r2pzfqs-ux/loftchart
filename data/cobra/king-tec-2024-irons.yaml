description: >
  The KING TEC replaced the 2022 KING Forged Tec in October 2024 as Cobra's
  compact players-distance iron, with a body and face that Cobra describes as
  five-step forged. The loft, lie and length chart is unchanged from the model
  it replaced — 29.5 degrees at the 7-iron and 44 at the pitching wedge, built
  to 37.25 inches at the 7-iron — and a 19-degree 3-iron is listed in right
  hand only. The stock set is 4-iron to pitching wedge in steel. Figures are
  the men's standard right-handed steel build.
