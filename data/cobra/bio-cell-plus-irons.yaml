faq:
  - q: "What is the loft of a Cobra BiO Cell+ 7-iron?"
    a: "The Cobra BiO Cell+ 7-iron has a loft of 32.5 degrees, a lie of 62.5 degrees and a length of 37 inches."
  - q: "What clubs come in a stock Cobra BiO Cell+ set?"
    a: "The stock set is eight clubs, 4-iron through pitching wedge plus a 50-degree gap wedge, in steel with True Temper Dynamic Gold shafts. A 3-iron was also catalogued."
  - q: "What is the difference between the BiO Cell and the BiO Cell+?"
    a: "The BiO Cell+ is the better-player version: a smaller head with a thinner topline, about two degrees weaker lofts in the mid irons, roughly half the offset, and a Dynamic Gold shaft in place of the lighter Dynalite 85."
