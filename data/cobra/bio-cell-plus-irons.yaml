description: >
  The BiO Cell+ is the compact, better-player companion to Cobra's BiO Cell
  iron, launched in early 2014 (the archived product page began shipping 7
  February 2014). It pairs a tour-inspired head shape with the same technology
  stack — E9 variable-thickness face, a large unsupported face over a perimeter
  undercut, and tungsten placed in the heel and toe of the long and mid irons
  and behind the hitting area in the short irons. Lofts sit between a players
  and a distance iron, with a 32.5-degree 7-iron and 45-degree pitching wedge,
  and offset is modest, tapering from 4.0 mm to 1.8 mm. The stock set is eight
  clubs, 4-PW plus gap wedge, in steel only. Offsets below are converted from
  Cobra's published millimetre figures; the 8-iron length is corrected from an
  apparent misprint (see sources).
