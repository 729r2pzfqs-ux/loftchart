description: >
  The KING is Cobra's 2025 tour wedge, announced on 21 January 2025, at
  retail from 6 March 2025 and still current. It replaced the Snakebite and
  returned the line to Metal Injection Molding, which Cobra credits with
  roughly 50 percent tighter tolerances than cast wedges. Flight Window
  Technology moves the CG by loft — low in the 48-52, mid in the 54-56,
  high in the 58-60 — while Progressive Spin Technology pairs narrow, deep
  grooves on the strong lofts with wide, shallow grooves up top, behind a
  Speed Notch 67 percent larger than before. The 17-combination matrix runs
  48 to 60 degrees across four grinds, in Satin Chrome, Black QPQ and
  custom-only Raw finishes; only the Versatile grind is offered left-handed
  (50-60). The cavity-back KING X is a separate model.
grinds:
  - code: V
    name: VERSATILE (V) Grind
    description: >
      The all-around sole, offered at every loft and the only left-handed
      option — toe, heel and trailing-edge relief for mixed conditions and
      face positions.
  - code: D
    name: DROP (D) Grind
    description: >
      Medium-width sole with high bounce and minimal trailing-edge relief —
      best for full swings, steeper attacks and softer turf.
  - code: W
    name: WIDELOW (W) Grind
    description: >
      Wide, low-bounce sole designed for soft bunkers and soft playing
      surfaces, at 56 to 60 degrees.
  - code: T
    name: TOUR (T) Grind
    description: >
      Maximum heel and toe relief for shot-making with the face open or
      shut, at 58 and 60 degrees.
