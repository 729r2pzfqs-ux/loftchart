faq:
  - q: "What lofts does the Cobra KING wedge come in?"
    a: "48 to 60 degrees in 2-degree steps — 17 loft, bounce and grind combinations. Left-handed heads come only in the Versatile grind at 50-60 degrees."
  - q: "What grinds does the Cobra KING offer?"
    a: "Four: the all-round Versatile at every loft, the high-bounce Drop (52-60), the wide low-bounce Widelow (56-60) and the Tour grind with maximum heel and toe relief (58-60)."
  - q: "What is MIM construction on the Cobra KING?"
    a: "Metal Injection Molding — the 8620 steel head is formed from metal powder and sintered, which Cobra says holds roughly 50 percent tighter tolerances than traditional casting for more consistent shaping and a softer feel."
  - q: "What replaced the Cobra Snakebite?"
    a: "This KING wedge took over from the Snakebite in March 2025, alongside the cavity-back KING X for game-improvement players."
