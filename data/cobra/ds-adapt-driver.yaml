hosel:
  system: "FutureFit33"
  loft_range: "±2°"
  positions: 33
  lie_effect: "Lie adjusts ±2° from stock, independently of loft — a Cobra first."
  face_note: >
    The SmartPad sole keeps the face visually square at address in every
    setting.
  notes: >
    FutureFit33 works through two dials — an A-H ring and a 1-8 ring — whose
    64 combinations collapse to 33 unique loft/lie settings, with A1 the
    neutral stock position. The valid codes are A1-A8, B1, B3, B4, B6, B7,
    C1, C2, C4, C7, C8, D1, D2, D3, D6, D8, E1, F1-F4, G1, G3, G4, H1 and
    H4. Cobra publishes the code-by-code degree chart only as a graphic
    reached from a QR code on the hosel: outer-ring codes make the biggest
    moves, inner codes shift loft and lie by tenths of a degree, and the
    chart is laid out by the miss it corrects. Each stock loft covers ±2°:
    a 9° head plays 7-11°, a 10.5° head 8.5-12.5°, a 12° head 10-14°.
