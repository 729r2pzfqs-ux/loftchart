description: >
  The DS-ADAPT is Cobra's 2025 driver family — on pre-sale from 12 December
  2024 and at retail from 10 January 2025 — and the debut of the FutureFit33
  hosel: 33 unique settings that adjust loft and lie up to 2 degrees each,
  independently, a first for Cobra. The compact 445 cc LS carries three
  adjustable weight positions for better players; the X is the
  traditional-profile all-rounder with front/back swappable weights; the
  Max-K is the oversize highest-MOI model; and the Max-D is the draw head
  with heel-biased mass. The OPTM replaced the family in January 2026,
  leaving the DS-ADAPT as a strong closeout buy with the same hosel system
  as the current line.
variants:
  - name: DS-ADAPT LS
    head_cc: 445
    description: >
