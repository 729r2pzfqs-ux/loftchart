      44.5 inch Tour Length build.
  - name: DS-ADAPT X
    head_cc: 460
    description: >
      The traditional-profile all-rounder with front/back swappable flush
      weights to trade spin against forgiveness.
  - name: DS-ADAPT Max-K
    head_cc: 460
    description: >
      The slightly oversize, perimeter-weighted highest-MOI model of the
      four; women's and junior 12° builds are offered on this head.
  - name: DS-ADAPT Max-D
    head_cc: 460
    description: >
      The draw-biased head with a low, heel-biased centre of gravity and the
      PWR-BRIDGE moved back — the slice fighter of the line.
