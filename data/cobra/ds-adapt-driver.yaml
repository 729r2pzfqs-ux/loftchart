faq:
  - q: "What lofts does the Cobra DS-ADAPT come in?"
    a: "The DS-ADAPT LS and X come in 9 and 10.5 degrees, the Max-K in 9, 10.5 and 12, and the Max-D in 10.5 and 12. The FutureFit33 hosel extends each head 2 degrees either way, so the family covers 7 to 14 degrees in all."
  - q: "How does the DS-ADAPT's FutureFit33 hosel work?"
    a: "Two dials — a letter ring A-H and a number ring 1-8 — give 33 unique settings that adjust loft and lie up to 2 degrees each, independently of one another. A1 is the stock neutral setting, and Cobra's chart is organised by the miss you want to correct."
  - q: "What is the difference between the DS-ADAPT Max-K and Max-D?"
    a: "The Max-K is the neutral, slightly oversize maximum-forgiveness head; the Max-D moves mass low and into the heel with the PWR-BRIDGE shifted back, producing built-in draw bias for players who fight a slice."
  - q: "Is the Cobra DS-ADAPT still in production?"
    a: "The OPTM replaced it in January 2026, so the DS-ADAPT is a closeout and used-market buy — often at steep discounts, with the same FutureFit33 hosel as the current line."
