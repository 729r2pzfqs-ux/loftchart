description: >
  The Darkspeed is Cobra's 2024 driver family — presale 11 January, retail
  19 January 2024 — and the last generation on the MyFly8 hosel before
  FutureFit33 arrived. Its PWR-BRIDGE suspends an internal weight bridge to
  free the sole for a larger, AI-designed H.O.T. face. The LS is the
  low-spin head with two 3 g front ports and a 12 g back weight; the X is
  the mainstream speed-and-forgiveness head with swappable 12 g/3 g weights;
  and the Max is the high-MOI model whose single 12 g weight sets neutral or
  draw bias, with women's and junior builds on the same head. The DS-ADAPT
  replaced the family in 2025.
variants:
  - name: Darkspeed LS
    head_cc: 460
    description: >
      The low-spin head — most crown curvature, highest rear skirt — with two
      3 g front weights and a 12 g back weight for high swing speeds. The
      10.5° head was special order, and a 44.5 inch Tour Length build was
      sold.
  - name: Darkspeed X
    head_cc: 460
    description: >
      The mainstream head balancing speed and forgiveness: a 12 g back and
      3 g front weight swap to raise flight (back) or lower it (front).
  - name: Darkspeed Max
    head_cc: 460
    description: >
      The most forgiving model, with the lowest skirt and highest MOI; its
      single 12 g weight sets a neutral (rear) or draw (heel) bias. Women's
      and 12° junior builds use this head.
