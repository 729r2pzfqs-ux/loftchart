faq:
  - q: "What lofts does the Cobra Darkspeed come in?"
    a: "The Darkspeed LS comes in 8, 9 and 10.5 degrees (10.5 was special order), and the Darkspeed X and Max in 9, 10.5 and 12. The MyFly8 hosel extends each head 1.5 degrees down and 1.5 up."
  - q: "What is the Darkspeed adjustment chart?"
    a: "MyFly8 has eight settings: −1.5, −1, standard and +1 degrees each in a neutral version, draw versions of −1, standard and +1, and a +1.5 top setting. A 10.5 degree head therefore plays anywhere from 9 to 12 degrees, and the SmartPad sole keeps the face square at address in every setting."
  - q: "What is the difference between the Darkspeed X and Max?"
    a: "The X is the mainstream head whose 12 gram and 3 gram weights swap front to back to trade spin against stability; the Max is the highest-MOI head with a more upright lie and a single 12 gram weight that sets neutral or heel-side draw bias."
  - q: "Is the Cobra Darkspeed still in production?"
    a: "No — the DS-ADAPT replaced it in January 2025. It remains a common used and closeout buy; note that its MyFly8 sleeve is not the same system as the newer FutureFit33 hosel."
