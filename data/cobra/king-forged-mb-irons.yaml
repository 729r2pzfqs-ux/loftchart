faq:
  - q: "What is the loft of a Cobra KING Forged MB 7-iron?"
    a: "The Cobra KING Forged MB 7-iron has a loft of 34 degrees, a lie of 62.5 degrees and a length of 37.5 inches with the stock Cobra Connect grip."
  - q: "Can you buy a full set of Cobra KING Forged MB irons?"
    a: "The standard retail set mixed cavity backs (4-6) with musclebacks (7-PW), but Cobra offered a full MB configuration in right hand, plus optional 2-iron, 3-iron and gap wedge heads."
  - q: "When did the Cobra KING Forged MB come out?"
    a: "Cobra and Rickie Fowler announced the KING Forged CB/MB pair on 30 October 2018 and it reached retail on 2 November 2018, so it is usually listed as a 2019 model."
