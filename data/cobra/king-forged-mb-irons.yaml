description: >
  The KING Forged MB is the muscle-back half of the KING Forged CB/MB pair
  Cobra announced with Rickie Fowler on 30 October 2018 (at retail from 2
  November 2018, and often catalogued as a 2019 or 2020 iron). The design
  mimics Fowler's custom gamers: a compact players' shape, five-step forged
  from a single billet of 1025 carbon steel, with a CNC-milled face, tighter
  wedge-style groove spacing in the scoring clubs and a black DBM finish. The
  standard set ran cavity backs 4-6 and these musclebacks 7-PW, with a full MB
  set available in right hand and optional 2-iron, 3-iron and gap wedge heads.
  Lofts are traditional at 34 degrees in the 7-iron, but the build is long for
  a tour iron — 37.5 inches at the 7-iron with the stock Cobra Connect grip
  (0.25 inch shorter with a standard grip). Offsets below are converted from
  the millimetre figures Cobra published.
