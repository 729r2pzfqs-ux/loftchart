  - "Cobra Golf official KING Forged irons page (cobragolf.com/king-forged-irons), archived 2019-07-23 via web.archive.org — retrieved directly; supplies the shared CB/MB spec table (2-iron through gap wedge: loft, lie, offset in millimetres, steel lengths with Connect and standard grips, swing weights), the five-step 1025 forging, tungsten toe/sole weighting in the cavity backs, CNC-milled face and DBM finish. Offsets here are those millimetre figures converted to inches."
  - "Cobra Golf launch press release via the Haggin Oaks blog, 'Cobra Golf and Rickie Fowler Announce New KING Forged CB/MB Irons', dated 2018-10-30 — retail availability from 2 November 2018 at $1,099, standard 4-PW set (CB 4-6, MB 7-PW), optional 2i/3i/GW, KBS $-Taper black shafts in R/S, Tour Velvet Cobra Connect grips, full MB set in right hand only. NOTE: this record uses 2018 on the announcement-year convention; reviews commonly date the pair 2019, and some lists 2020."
