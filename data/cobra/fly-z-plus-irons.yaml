description: >
  The Fly-Z+ is the forged better-player model in Cobra's 2015 Fly-Z iron
  family, sitting above the cast Fly-Z, Fly-Z XL and Fly-Z Pro. The 1020 carbon
  steel head carries tungsten inserts in the heel and toe whose position moves
  progressively through the set — higher-launching long irons, flatter-flighted
  short irons — and a lightweight aluminium backplate encased in thermoplastic
  rubber damps vibration together with a TPR cavity insert. Lofts are
  traditional for a players iron, with a 33-degree 7-iron and 45-degree pitching
  wedge. The stock set is eight clubs, 3-iron through pitching wedge, in steel
  only with the KBS Tour shaft; a 50-degree gap wedge was catalogued. Cobra did
  not publish offset figures for this set.
