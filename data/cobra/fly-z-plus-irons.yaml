faq:
  - q: "What is the loft of a Cobra Fly-Z+ 7-iron?"
    a: "The Cobra Fly-Z+ 7-iron has a loft of 33 degrees, a lie of 62.5 degrees and a length of 37 inches."
  - q: "What clubs come in a stock Cobra Fly-Z+ set?"
    a: "The stock set is eight clubs, 3-iron through pitching wedge, in steel with the KBS Tour shaft in R+ or S+ flex. A 50-degree gap wedge was also catalogued."
  - q: "Is the Cobra Fly-Z+ forged or cast?"
    a: "It is forged from 1020 carbon steel, with tungsten heel and toe inserts and an aluminium backplate encased in thermoplastic rubber. The other Fly-Z models are cast."
