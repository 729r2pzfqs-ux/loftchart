hosel:
  system: "MyFly8 with SmartPad"
  loft_range: "±1.5°"
  positions: 8
  lie_effect: >
    There is no independent lie adjustment; the three Draw positions add
    draw bias at their loft instead.
  face_note: >
    The SmartPad sole keeps the face visually square at address in all eight
    settings.
  notes: >
    The chart shows the loft each setting plays relative to the stamped
    loft; "Draw" positions play the same loft with added draw bias — on the
    Max, Cobra quotes the draw setting as worth about 7 yards. On a 9° head
    the settings run 7.5° to 10.5°; on a 10.5° head, 9° to 12°; on a 12°
    head, 10.5° to 13.5°.
  settings:
    - { setting: "−1.5", loft: "−1.5°", face: "neutral" }
    - { setting: "−1", loft: "−1°", face: "neutral" }
    - { setting: "−1 Draw", loft: "−1°", face: "draw bias" }
    - { setting: "STD", loft: "std", face: "neutral" }
    - { setting: "STD Draw", loft: "std", face: "draw bias" }
    - { setting: "+1", loft: "+1°", face: "neutral" }
    - { setting: "+1 Draw", loft: "+1°", face: "draw bias" }
    - { setting: "+1.5", loft: "+1.5°", face: "neutral" }
