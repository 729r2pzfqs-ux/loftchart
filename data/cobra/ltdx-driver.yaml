faq:
  - q: "What lofts does the Cobra LTDx come in?"
    a: "The LTDx and LTDx Max come in 9, 10.5 and 12 degrees; the LTDx LS in 9 and 10.5 only. The MyFly8 hosel extends each head 1.5 degrees either way."
  - q: "What is the LTDx adjustment chart?"
    a: "MyFly8 has eight settings: −1.5, −1, standard and +1 degrees in neutral versions, draw versions of −1, standard and +1, and a +1.5 top setting. The SmartPad sole keeps the face square at address in every setting."
  - q: "How much draw correction does the LTDx Max offer?"
    a: "Cobra quoted about 5 yards with the weight back, 11 yards with it in the heel, and up to roughly 18 yards with the heel weight combined with a Draw hosel setting."
  - q: "Is the Cobra LTDx still in production?"
    a: "No — it ran one cycle, from February 2022 until the Aerojet replaced it in 2023, so the used market is the source. Check which MyFly8 setting a used head is in before judging its loft."
