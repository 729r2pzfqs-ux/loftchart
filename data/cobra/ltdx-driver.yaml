brand: Cobra
brand_slug: cobra
model: LTDx
slug: ltdx-driver
club_type: driver
year_introduced: 2022
year_discontinued: 2023
category: flagship
construction: lighter titanium chassis carrying ~30% more carbon fibre in the crown and sole plate, with PWR-COR low-forward multi-material weighting
material: titanium chassis with carbon crown and sole; CNC-milled infinity-edge H.O.T. titanium face
predecessor: Cobra RADSPEED
successor: Cobra Aerojet
description: >
  The LTDx is Cobra's 2022 driver family — announced 19 January and at retail
  from 11 February 2022 — built around PWR-COR: a 14 g internal steel weight
  and 5 g external aluminium weight stacked low and forward behind the face,
  balanced by a 15 g fixed back weight on the core head, chasing "zero CG"
  bragging rights with near-neutral balance-point numbers. The core LTDx is
  the distance head, the LS the low-spin model for better players, and the
  Max the forgiveness/draw head whose movable ~10 g weight plus the MyFly8
  draw settings stack up to roughly 18 yards of slice correction. The
  Aerojet replaced the family in 2023.
variants:
  - name: LTDx
    head_cc: 460
    description: >
      The core distance head: PWR-COR low-forward weighting plus a 15 g fixed
      back weight for ball speed with moderate forgiveness.
  - name: LTDx LS
    head_cc: 460
    description: >
      The low-spin head for better players — no 12° option, flatter flight,
      and the stiffest stock shaft lineup in the family.
  - name: LTDx Max
    head_cc: 460
    description: >
      The forgiveness and draw model: a movable ~10 g weight plays back
      (neutral, about +5 yards of draw) or heel (about +11 yards), and with
      the hosel's draw setting the correction reaches roughly 18 yards. A
      women's build was offered in 10.5° and 12°.
