faq:
  - q: "What lofts do the Cobra DS-ADAPT fairway woods come in?"
    a: "The DS-ADAPT X comes in 15, 16.5, 18 and 21 degrees; the titanium LS in 14.5, 16 and 17; and the MAX in 15.5, 18.5, 21.5 and 24.5."
  - q: "How does the DS-ADAPT fairway adjustment work?"
    a: "Every head uses Cobra's FutureFit33 hosel: 33 settings that move loft and lie independently up to 2 degrees each way, so a 15 degree 3-wood plays anywhere from 13 to 17 degrees. Cobra publishes the code-by-code chart via a QR code on the hosel."
  - q: "What is the difference between the DS-ADAPT X and LS fairway woods?"
    a: "The X is the steel all-rounder on upright 58 degree lies. The LS is a titanium, low-spin tour head with 60 grams of heel and toe tungsten, stronger lofts (14.5 to 17 degrees) and much flatter 56 degree lies."
