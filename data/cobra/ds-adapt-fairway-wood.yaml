length_note: >
  Lie figures are the standard (neutral) FutureFit33 setting; every head can
  be set up to 2° flatter or more upright.
hosel:
  system: "FutureFit33"
  loft_range: "±2°"
  positions: 33
  lie_effect: "Lie adjusts ±2° from stock, independently of loft — a Cobra first."
  face_note: >
    The SmartPad sole keeps the face visually square at address in every
    setting.
  notes: >
    FutureFit33 works through two dials — an A-H ring and a 1-8 ring — whose
    64 combinations collapse to 33 unique loft/lie settings, with A1 the
    neutral stock position. Cobra publishes the code-by-code degree chart
    only as a graphic reached from a QR code on the hosel, so no
    position-by-position table is reproduced here. Each stock loft covers
    ±2°: the X 3-wood plays 13-17°, the 5-wood 16-20°, the 7-wood 19-23°.
