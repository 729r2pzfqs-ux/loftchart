description: >
  The DS-ADAPT fairway woods launched in January 2025 with the DS-ADAPT
  drivers, and brought Cobra's FutureFit33 hosel — 33 settings with loft and
  lie independently adjustable ±2° — to the whole fairway line. The X is the
  all-round core head, the titanium LS the low-spin tour model with 60 g of
  heel and toe tungsten, and the MAX the draw-biased forgiveness model in
  half-degree-weaker lofts out to a 24.5° 9-wood. The OPTM fairways replaced
  the line in January 2026.
variants:
  - name: DS-ADAPT X
    description: >
      The core all-round head — 177 cc in the 3-wood — in four lofts
      including a 16.5° high-flight 3HF. Balanced speed and forgiveness with
      a baffler-style sole.
  - name: DS-ADAPT LS
    description: >
      The titanium low-spin tour head with a carbon crown and a combined
      60 g of tungsten in heel and toe, in 14.5°, 16° (3HF) and 17° lofts on
      flatter 56° lies.
  - name: DS-ADAPT MAX
    description: >
      The draw-biased forgiveness head with an internal back/heel weight pad,
      in four lofts from 15.5° to a 24.5° 9-wood on more upright lies.
