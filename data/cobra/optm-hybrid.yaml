faq:
  - q: "What lofts does the Cobra OPTM hybrid come in?"
    a: "Four lofts: 18, 21, 24 and 28 degrees — the 3-hybrid through 6-hybrid."
  - q: "Is the Cobra OPTM hybrid adjustable?"
    a: "Yes — every loft carries the FutureFit33 hosel with 33 settings covering plus or minus 2 degrees of loft and lie, and the SmartPad sole keeps the face square in every setting."
  - q: "What replaced the Cobra DS-ADAPT hybrid?"
    a: "This one — the OPTM hybrid replaced the DS-ADAPT hybrid in January 2026, with a slightly longer and shallower head for more forgiveness."
