hosel:
  system: "FutureFit33"
  loft_range: "±2°"
  positions: 33
  lie_effect: "Lie adjusts ±2° from stock, independently of loft."
  face_note: >
    The SmartPad sole keeps the face visually square at address in every
    setting.
  notes: >
    The same two-dial FutureFit33 system as the OPTM drivers and fairways:
    33 unique loft/lie settings with A1 the neutral stock position. Cobra
    publishes the code-by-code degree chart only as a graphic reached from a
    QR code on the hosel, so none is reproduced here. Each loft covers ±2° —
    the 18° head plays 16-20°, the 28° head 26-30° — with lie ranges two
    degrees either side of the stated figures.
