description: >
  The OPTM hybrid launched in January 2026 with the OPTM drivers and
  fairways, replacing the DS-ADAPT hybrid. It is a single head design in
  four lofts from an 18° 3-hybrid to a 28° 6-hybrid, each carrying the
  FutureFit33 hosel with ±2° of loft and lie adjustment. Cobra stretched the
  footprint slightly longer and shallower than the DS-ADAPT to push MOI up,
  with a fixed back weight keeping the centre of gravity low — MyGolfSpy's
  2026 test rated it the most forgiving hybrid of the year.
