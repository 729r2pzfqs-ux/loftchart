faq:
  - q: "What is the loft of a Cobra KING OS 7-iron?"
    a: "The Cobra KING OS 7-iron has a loft of 30 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.25 inches."
  - q: "What clubs come in a stock Cobra KING OS set?"
    a: "The stock set is eight clubs, 4-iron through pitching wedge plus a 50-degree gap wedge, in either steel or graphite. A 55-degree sand wedge was also catalogued."
  - q: "What does OS stand for in the Cobra KING OS?"
    a: "OS stands for Oversize. The iron revives Cobra's 1990s King Cobra Oversize concept with a full-hollow body, an enlarged milled face and tungsten toe weighting."
