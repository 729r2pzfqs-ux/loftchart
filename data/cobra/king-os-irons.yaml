description: >
  The KING OS (Oversize) is Cobra's 2016 revival of its 1990s oversize concept:
  a full-hollow, oversized head whose CNC-milled face carries what Cobra called
  its largest "Sweet Zone" ever. Zone Weighting pushes mass low and around the
  perimeter, a tungsten toe weight centres impact on the enlarged face, and the
  grooves are progressive — V-shaped in the 4-6 irons, U-shaped in 7-PW and
  wedge-spaced on the GW and SW. Lofts are moderate for the class, with a
  30-degree 7-iron and 45-degree pitching wedge. The stock set is eight clubs,
  4-PW plus gap wedge, in steel or graphite; it reached retail on 25 November
  2016 at $999 in steel. Lengths and swing weights below are the steel build,
  and offsets are converted from Cobra's published millimetre figures.
