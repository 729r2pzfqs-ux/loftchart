faq:
  - q: "What is the loft of a Cobra KING Forged Tec (2022) 7-iron?"
    a: "The 2022 Cobra KING Forged Tec 7-iron has a loft of 29.5 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "Is the Cobra KING Forged Tec hollow?"
    a: "Yes — a forged 1025 carbon steel body with a forged PWRSHELL face cup and foam microspheres inside to control the sound."
  - q: "How strong are 2022 KING Forged Tec lofts?"
    a: "Strong for a compact iron: 29.5 degrees at the 7-iron and 44 at the pitching wedge, about three and a half degrees stronger than a traditional players iron."
  - q: "What is the stock shaft in the 2022 Cobra KING Forged Tec?"
    a: "The KBS $-Taper Lite, at 115 grams in stiff and 110 grams in regular."
