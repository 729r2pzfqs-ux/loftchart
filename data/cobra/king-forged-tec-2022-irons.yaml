description: >
  The 2022 KING Forged Tec is a compact hollow-bodied players-distance iron: a
  forged 1025 carbon steel body with a forged PWRSHELL face cup, foam
  microspheres behind the face for sound, and a tungsten weight low in the
  head. The profile is deliberately small for the category, with a relatively
  thin top line. Lofts are strong — 29.5 degrees at the 7-iron and 44 at the
  pitching wedge — and the set is built long at 37.25 inches for the 7-iron.
