faq:
  - q: "What is the loft of a Cobra F-Max 7-iron?"
    a: "The Cobra F-Max 7-iron has a loft of 31.5 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.25 inches."
  - q: "When were the original Cobra F-Max irons released?"
    a: "In 2017. Cobra replaced them with the F-Max Superlite, announced on 12 September 2018, and the F-Max Airspeed followed in 2019."
  - q: "Who were the Cobra F-Max irons designed for?"
    a: "Golfers with moderate swing speeds. They combine weak lofts, generous offset, back-and-heel weighting for a draw and a very light build — around C9 swing weight with the stock 100-110 gram steel shaft."
  - q: "How is the F-Max head construction progressive?"
    a: "The 4 through 7 irons are cast from thinner, stronger 17-4 stainless steel for ball speed, while the 8-iron through sand wedge use softer 431 stainless steel for feel, all under a nickel chrome plating."
