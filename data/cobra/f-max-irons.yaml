description: >
  The F-Max was the first model in Cobra's F-Max family of lightweight
  super-game-improvement irons for golfers with moderate swing speeds, introduced
  in 2017. The cast cavity backs use a progressive construction — thinner 17-4
  stainless steel in the 4 through 7 irons for speed, softer 431 stainless in the
  8-iron through sand wedge for feel — under a nickel chrome plating, with weight
  positioned back and heelward for straighter, draw-biased flight. Lofts are weak
  by design at 31.5 degrees for the 7-iron and 45 degrees for the pitching wedge,
  offset tapers from 6.3 mm at the 4-iron to 0.8 mm at the sand wedge, and the
  steel build swings very light at C9 through the irons. The stock men's steel
  set was seven clubs, 5-PW plus gap wedge. The F-Max Superlite, announced on
  12 September 2018, replaced it.
