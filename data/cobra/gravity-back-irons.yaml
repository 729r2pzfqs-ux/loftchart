description: >
  The Gravity Back was Cobra's completely new iron for 1999, the first design
  of the Acushnet era to move on from the King Cobra oversize family. A
  distinctive Backweight bar behind the head positions the centre of gravity
  low and back in a lower-profile cast 17-4 stainless head, raising inertia
  and launch for golfers of all skill levels. The line ran from a 16-degree
  1-iron to a 60-degree lob wedge, with the stock set sold 3-PW in steel or
  graphite, in right and left hand. Lofts are traditional — 33 degrees at the
  7-iron and 46 at the pitching wedge — and every club is built to a D2 swing
  weight. Cobra published an offset column whose values run backwards relative
  to normal convention (negative in the long irons, increasing toward the
  wedges), so, as with the other Cobra records of this era, it is not
  reproduced here. It was followed by the CXI in 2000. Note that some listings
  date the Gravity Back 2000; Cobra's own 1999 page introduces it as new.
