faq:
  - q: "What is the loft of a Cobra Gravity Back 7-iron?"
    a: "The Cobra Gravity Back 7-iron has a loft of 33 degrees, a lie of 62 degrees and a length of 37.25 inches."
  - q: "What year are the Cobra Gravity Back irons?"
    a: "Cobra introduced the Gravity Back in 1999 — its own site presented the line as new that year — though some retailers list it as a 2000 model. The CXI replaced it in 2000."
  - q: "What makes the Cobra Gravity Back irons unusual?"
    a: "A Backweight bar behind the low-profile cast head shifts the centre of gravity low and rearward, which raises inertia and helps the ball launch higher — an early take on the extreme rear-weighting later common in game-improvement irons."
