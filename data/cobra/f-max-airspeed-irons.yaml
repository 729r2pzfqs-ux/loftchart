faq:
  - q: "What is the loft of a Cobra F-Max Airspeed 7-iron?"
    a: "The Cobra F-Max Airspeed 7-iron has a loft of 31.5 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.25 inches."
  - q: "When were Cobra F-Max Airspeed irons released?"
    a: "Cobra announced them on 12 November 2019 and they reached retail in January 2020. The Air-X replaced them in January 2022."
  - q: "Who were the Cobra F-Max Airspeed irons designed for?"
    a: "Golfers with moderate swing speeds. They were Cobra's lightest irons to date — about 16 grams lighter in total than the F-Max Superlite, with a D0 steel swing weight — with weak lofts, generous offset and heel-biased draw weighting for easy launch."
