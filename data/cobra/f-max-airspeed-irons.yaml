description: >
  The F-Max Airspeed was the lightest iron Cobra had made when it was announced on
  12 November 2019, built for golfers with moderate swing speeds and at retail from
  January 2020. Total club weight dropped about 16 grams against the F-Max Superlite
  it replaced, through a 5-gram-lighter shaft, a lighter midsize grip and a
  lighter head, and the men's steel build swings at just D0. The cast cavity-back
  heads use a low-profile shape with a deep undercut cavity, progressive hosel
  lengths — shorter in the long irons to drop the centre of gravity, taller in the
  wedges — heel-biased weighting for a draw, and generous offset that tapers from
  6.6 mm at the 4-iron to 1.0 mm at the sand wedge (converted to inches below).
  Lofts are weak by modern standards at 31.5 degrees for the 7-iron and 45 for the
  pitching wedge, in keeping with the easy-launch brief. The stock men's steel set
  was seven pieces, 5-PW plus gap wedge, with combo sets substituting hybrids for
  the long irons; MyGolfSpy ranked it the best super-game-improvement iron of 2020
  and 2021, and Cobra replaced it with the Air-X in January 2022.
