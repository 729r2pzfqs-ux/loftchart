faq:
  - q: "What is the loft of a Cobra KING Tour 7-iron?"
    a: "The 2020 Cobra KING Tour 7-iron has a loft of 33 degrees, a lie of 62.5 degrees and a length of 37.50 inches."
  - q: "What is MIM in the Cobra KING Tour?"
    a: "Metal injection moulding. Powdered stainless steel is injected into a mould under pressure and then sintered, which produces a denser head with tighter shape tolerances than casting and a softer feel than conventional stainless."
  - q: "When were Cobra KING Tour irons made?"
    a: "The MIM KING Tour launched in 2020. Cobra later reused the KING Tour name for a 2023 model with different specifications."
  - q: "What is the pitching wedge loft on the Cobra KING Tour?"
    a: "45 degrees, with a 50-degree gap wedge below it."
