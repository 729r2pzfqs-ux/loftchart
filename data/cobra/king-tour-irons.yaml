description: >
  The KING Tour is the first Cobra iron made by metal injection moulding, a
  process that packs powdered stainless into the mould under pressure and
  sinters it, giving a denser, softer-feeling head than a conventional casting
  and tighter tolerances than a forging. A high-density tungsten weight sits in
  the toe to put the centre of gravity behind the hitting area. Lofts are
  traditional — 33 degrees at the 7-iron, 45 at the pitching wedge — and the
  build is long, 37.50 inches at the 7-iron.
