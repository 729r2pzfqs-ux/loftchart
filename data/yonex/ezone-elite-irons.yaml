description: >
  The EZONE Elite 4.0 is the beginner- and high-handicapper-focused iron at
  the top of Yonex's game-improvement range, part of a full Elite 4.0 family
  (driver, fairway, hybrid, irons, putter) that reached UK retail on 1 March
  2023. The cast SUS431 stainless head uses Yonex's Octaforce NEO
  construction - weight moved from high in the blade to a low, deep
  peripheral position - for a 10% larger sweet spot, a lower and deeper
  centre of gravity, and increased face flex for a higher, more forgiving
  launch than the mid-market EZONE GS i-Tech, though the two share a nearly
  identical loft ladder through the mid-irons. Sold in several stock
  configurations from 5-iron or 6-iron through pitching wedge, with AW and SW
  options, and built with Yonex's own lightweight EX-E04 graphite shaft in
  Super-Lite, Regular or Stiff flex as the sole stock offering.
