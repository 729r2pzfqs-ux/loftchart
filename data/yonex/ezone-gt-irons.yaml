description: >
  The EZONE GT is Yonex's flagship distance iron, and this fourth-generation
  model went on sale in early April 2024 - the GT line has run on a two-year
  cycle since 2018, and this generation was still Yonex's current iron range
  into 2026. The "G-BRID" head forges a graphite hybrid insert into an S45C
  soft carbon body behind a face of Mighty Maraging Plus steel, a grade Yonex
  rates about 20 percent stronger than standard maraging steel, and the sole
  carries a slit structure that flexes at impact. Lofts are extreme even by
  distance-iron standards - a 25-degree 7-iron and 37-degree pitching wedge -
  which is why the set flows through 42-degree AW and 48-degree AS wedges to
  a 55-degree SW. The 7-iron's loft sits below a traditional 5-iron, so
  treat club-to-club comparisons accordingly. Sold in Japan as a 4-piece
  #7-PW set with singles either side, with the RK-04GT carbon shaft or
  N.S.Pro 850GH neo steel; lengths below are the steel spec (carbon builds
  run 0.25 inches longer). Yonex publishes face progression rather than
  offset, so that key is omitted.
