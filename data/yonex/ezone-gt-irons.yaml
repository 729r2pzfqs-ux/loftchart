faq:
  - q: "What is the loft of a Yonex EZONE GT 7-iron?"
    a: "The fourth-generation Yonex EZONE GT 7-iron has a loft of just 25 degrees - roughly a traditional 5-iron loft - with a 61.5-degree lie and a 37.75-inch steel length."
  - q: "Why does the EZONE GT set include an AS wedge?"
    a: "Because the pitching wedge is 37 degrees, Yonex fills the gap to the 55-degree sand wedge with a 42-degree AW and a 48-degree AS (approach-sand) wedge so the loft steps stay playable."
  - q: "Is the Yonex EZONE GT forged or cast?"
    a: "The body of the 5-iron through attack wedge is forged S45C soft carbon steel with a graphite hybrid insert; the face is Mighty Maraging Plus steel - forged in the numbered irons, rolled sheet in the PW and AW. The AS and SW use a simpler S45C body with a rolled maraging face."
