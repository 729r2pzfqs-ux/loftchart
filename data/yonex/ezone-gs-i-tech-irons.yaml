faq:
  - q: "What is the loft of a Yonex EZONE GS i-Tech 7-iron?"
    a: "The Yonex EZONE GS i-Tech 7-iron has a loft of 29 degrees, a lie of 62.5 degrees and a length of 37.5 inches."
  - q: "What does the G-Brid face do on the EZONE GS i-Tech?"
    a: "It lets the face flex inward at impact, which Yonex says cuts head weight by about 20% and lowers the centre of gravity for a higher launch and more ball speed."
  - q: "How does the EZONE GS i-Tech differ from the original EZONE GS?"
    a: "The head keeps the same four-piece graphite-hybrid construction and a nearly identical loft ladder, but adds the flexing G-Brid face and an angled Groove Flow Concept aimed at straighter ball flights."
