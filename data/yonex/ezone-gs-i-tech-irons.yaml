description: >
  The EZONE GS i-Tech succeeded the EZONE GS as Yonex's international-market
  game-improvement iron, reviewed by Golf Monthly in February 2023. It keeps
  the GS line's four-piece graphite-hybrid head - a cast mild-carbon-steel
  body, a maraging steel face, a tungsten plate low in the head and Yonex's
  signature carbon graphite insert damping vibration between the metals -
  and adds a "G-Brid" face design that flexes inward at impact, cutting head
  weight by roughly 20% to lower the centre of gravity for a higher, faster
  launch, plus a Groove Flow Concept that angles the grooves rather than
  cutting them straight across for straighter ball flights. Lofts are
  essentially unchanged from the EZONE GS, with a 29-degree 7-iron and a
  43-degree pitching wedge across a 4-iron-to-sand-wedge factory range. A
  six-piece set retailed at £749 in the UK with either Yonex's own EX-GO2
  graphite or Nippon N.S.Pro Modus3 Tour 120 steel in the fitting matrix.
