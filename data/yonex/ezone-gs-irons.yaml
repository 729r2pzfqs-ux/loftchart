faq:
  - q: "What is the loft of a Yonex EZONE GS 7-iron?"
    a: "The Yonex EZONE GS 7-iron has a loft of 29 degrees, with a 62.5-degree lie and a 37.25-inch stock length."
  - q: "What is the graphite insert in the EZONE GS for?"
    a: "Yonex sandwiches a carbon graphite insert between the maraging face and the steel body to damp vibration - the company is first a carbon-fibre specialist, and uses the insert to soften feel in an otherwise fast, cast head."
  - q: "Who is the Yonex EZONE GS for?"
    a: "It is a game-improvement iron for mid-to-high handicaps, pairing a 29-degree 7-iron with a lightweight stock graphite shaft and high launch."
