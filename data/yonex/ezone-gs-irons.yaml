description: >
  The EZONE GS was Yonex's game-improvement iron for international markets,
  on sale from 2021 until the EZONE GS i-Tech replaced it in 2023. The
  four-piece "graphite-hybrid" head combines a cast 8620 mild carbon steel
  body, an AM355 maraging steel face, a tungsten plate low in the head and a
  carbon graphite insert that Yonex - the Niigata carbon specialist - uses as
  a damper between the metals. Lofts are moderately strong with a 29-degree
  7-iron and 43-degree pitching wedge, and the set runs 5-iron to sand wedge.
  Stock builds used Yonex's EX-330 graphite shaft with Nippon N.S.Pro 950GH
  steel as the custom option; the specs below are the UK retail chart for the
  stock build, and Yonex published no offset figures, so that key is omitted.
