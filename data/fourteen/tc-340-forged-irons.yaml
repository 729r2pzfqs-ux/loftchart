faq:
  - q: "What is the loft of a Fourteen TC-340 Forged 7-iron?"
    a: "The Fourteen TC-340 Forged 7-iron has a loft of 28 degrees, a lie of 61.5 degrees and a length of 37.95 inches."
  - q: "Who is the Fourteen TC-340 Forged for?"
    a: "MyGolfSpy's first-look framed it as built for golfers who have lost swing speed but still want a forged Fourteen iron - maximum forgiveness and launch from a one-piece forging, rather than a tour-shaped players iron."
  - q: "Is there a 4-iron in the Fourteen TC-340 Forged lineup?"
    a: "No. Fourteen made this head only from #5 through a 46-degree P/A wedge; the standard set is #6 through pitching wedge (five clubs), with the #5 and P/A sold as separate additions."
  - q: "When was the Fourteen TC-340 Forged released?"
    a: "In Japan on 21 March 2018 (some Japanese retail listings record 23 March 2018), forged from S35C soft carbon steel seven separate times per head."
