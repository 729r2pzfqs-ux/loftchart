description: >
  The TC-340 Forged pushed Fourteen's one-piece forging toward maximum
  forgiveness rather than tour shaping, released in Japan on 21 March 2018
  (some Japanese retail listings give 23 March) with the company's own
  claim of the lowest and deepest centre of gravity yet achieved in a
  Fourteen forged iron. Each S35C soft-steel head is forged seven separate
  times to hollow out a deep undercut structure behind the face, with a
  thick topline, generous offset and an unusually wide sole on the longer
  irons - MyGolfSpy's first-look coverage aimed it squarely at "an already
  loyal Fourteen consumer who has lost some swing speed but still wants to
  bag forged irons... with maximum forgiveness and launch." The head range
  runs #5 through a 46-degree P/A wedge (no #4 head was produced), with the
  #6-PW five-club set the standard build and #5 and P/A sold as separate
  additions; stock shafts were the Nippon N.S.PRO 950GH HT in steel or
  Fourteen's own FT-26i graphite. Nickel-chrome satin finish, right- and
  left-hand.
