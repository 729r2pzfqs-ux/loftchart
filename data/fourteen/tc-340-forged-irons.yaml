sources:
  - "Golf Digest Japan gear catalogue 'フォーティーン TC-340 フォージド アイアン' (lesson.golfdigest.co.jp/gear/catalogue/iron/gca000007317401.html) — the manufacturer-format factory chart used here for #6-PW: lofts 25/28/32/36/41 degrees, lies 61-63, lengths 38.6 down to 36.0 inches (a consistent 0.65-inch step per club), N.S.PRO 950GH HT shaft in R/S, and the seven-time-forged S35C soft-steel construction with low/deep-CG copy."
  - "mycaddie.jp product 9034 and kakaku.com item K0001046870/K0001046904 (Japanese price-comparison/spec pages) — confirm the full 7-head loft lineup #5(22)/#6(25)/#7(28)/#8(32)/#9(36)/P(41)/P-A(46) degrees, that no #4 head exists for this model, the 21 March 2018 Japanese release date (kakaku.com item pages record 23 March 2018), the S35C soft-iron forged construction and nickel-chrome satin finish, and the P/A wedge's 63-degree lie (matching the PW)."
  - "MyGolfSpy 'First Look: Fourteen TC 340 Irons' (also mirrored on mrkivenmolina.blogspot.com) — the seven-forging-step, deepest/lowest-CG-in-Fourteen's-history positioning, the #4-9/P/P-A head range, the standard 6-P set-up with #5 sold separately, the Nippon Zelos 6 and NS 950 shaft options at $200-220 per head, and the explicit target-player description quoted above."
  - "SPEC-EXTRAPOLATION NOTE (confidence: medium): no source gives a #5-iron or P/A-wedge length; the values above (#5 39.25 in., P/A 35.35 in.) continue the 0.65-inch-per-club step and flat PW/P-A 63-degree lie documented for #6-PW in the Golf Digest Japan chart, rather than being independently confirmed manufacturer figures. Offset and bounce are omitted - no source publishes either for this model."
