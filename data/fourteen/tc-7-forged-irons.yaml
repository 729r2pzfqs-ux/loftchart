description: >
  The TC-7 Forged is a players cavity back from Fourteen Golf, the Tokyo
  club-design house founded in 1981, sold as a US-market model through
  Fourteen Golf USA — it drew attention from spring 2021 and most American
  coverage treats it as a 2022 release. Each semi-compact head is forged from
  a single piece of S25C soft carbon steel with an undercut cavity that
  lifts launch and forgiveness while keeping minimal offset and a modern
  topline. Lofts are moderate for the class — a 31-degree 7-iron and a
  44-degree pitching wedge across a 4-PW, right-hand-only chart — and in
  MyGolfSpy's 2022 Most Wanted players iron test the TC-7 rated highest for
  feel, forgiveness and distance, though the overall title went to the
  New Level 623-CB. Sold at $199 per club with Nippon steel stock shafts;
  still listed by Fourteen Golf USA as of mid-2026.
