sources:
  - "2nd Swing Fourteen TC-7 Forged iron set spec table (2ndswing.com) — the full chart: lofts 21/24/27/31/35/39/44, lies 60.0 to 63.0, lengths 38.75 to 35.5 inches and face progression 3.9 to 4.3 mm for 4-iron through PW, right hand only."
  - "Plugged In Golf 'Fourteen TC-7 Irons Review' spec graphic, 29 June 2022 — an independently published chart agreeing with every loft, lie and length above, plus the $199-per-club price and the Nippon 950HT / Modus3 T105 shaft pairing."
  - "Fourteen official TC-7 Forged page (fourteen.co.jp/en/irons/tc7-forged and fourteengolf.us) — forged S25C soft steel, nickel chrome finish, undercut cavity, set composition #4 and #5-PW, and the stock N.S.PRO 950GH HT (R, S) and N.S.PRO Modus3 T105 (S) shafts; the manufacturer's page publishes no per-club chart, so the numbers above are recorded at medium confidence from the two agreeing retail/press charts."
  - "fourteengolf.us blog 'Fourteen's TC-7 Forged Shines in the 2022 Most Wanted Player's Iron', 10 February 2022 — the TC-7 rated best for feel, forgiveness and distance in MyGolfSpy's test (the overall winner was the New Level 623-CB). year_introduced 2021 follows the model's US-market debut — Japanese coverage (masa-golf.jp) records it as a US-only model drawing attention from April 2021, and it was in MyGolfSpy's test field assembled around the turn of 2022 — while 2nd Swing and most US reviews label it new for 2022."
  - "Note: offset and bounce are omitted — Fourteen publishes face progression in millimetres rather than offset, and no bounce figures. year_discontinued is null: the TC-7 Forged remains on fourteengolf.us as of July 2026 (the 2024 TB-7 blade and TC-touring models sit alongside it rather than replacing it)."
