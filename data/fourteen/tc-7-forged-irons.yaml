faq:
  - q: "What is the loft of a Fourteen TC-7 Forged 7-iron?"
    a: "The Fourteen TC-7 Forged 7-iron has a loft of 31 degrees, a lie of 61.5 degrees and a 37-inch standard length."
  - q: "Is the Fourteen TC-7 forged?"
    a: "Yes. Each head is forged from a single piece of S25C soft carbon steel with an undercut cavity back, finished in nickel chrome."
  - q: "Did the Fourteen TC-7 win MyGolfSpy's 2022 Most Wanted players iron test?"
    a: "No — the overall title went to the New Level 623-CB — but the TC-7 rated highest in the field for feel, forgiveness and distance."
  - q: "Who makes Fourteen golf clubs?"
    a: "Fourteen Golf is a Japanese maker founded in Tokyo in 1981 by designer Takamitsu Takebayashi; it designed irons for other brands before launching its own line in 2002, and the TC-7 is sold in America through Fourteen Golf USA."
