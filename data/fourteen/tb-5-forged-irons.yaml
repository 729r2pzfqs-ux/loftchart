faq:
  - q: "What is the loft of a Fourteen TB-5 Forged 7-iron?"
    a: "The Fourteen TB-5 Forged 7-iron has a loft of 30 degrees, a lie of 62 degrees and a factory length of 37.5 inches on the Japanese standard build."
  - q: "What is the Theater Blade structure on the Fourteen TB-5?"
    a: "The back face hides the cavity step behind a smooth blade-style surface — like a theatre curtain in front of the machinery — so the iron looks like a compact blade at address while playing with cavity-back forgiveness."
  - q: "Is the Fourteen TB-5 Forged a blade?"
    a: "It looks like one but is not a true muscle back: the S20C forging conceals a cavity, and Fourteen aimed it at average golfers with driver speeds of 85-96 mph rather than at tour players."
  - q: "When was the Fourteen TB-5 Forged released?"
    a: "In Japan on 6 November 2020, with US sales following in late 2021. The second-generation TB-5 Forged ('25) replaced it on 8 November 2024."
