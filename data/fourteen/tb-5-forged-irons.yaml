description: >
  The TB-5 Forged is Fourteen's "Theater Blade" — an S20C soft-carbon
  forging whose back conceals the cavity step behind a smooth blade-like
  curtain, so the club reads as a players iron at address while carrying
  hidden perimeter help. Fourteen released it in Japan on 6 November 2020,
  aimed at golfers in the 85-96 mph driver-speed range, with a universal
  sole grind for all lies and a nickel-chrome satin finish; US sales
  through Fourteen Golf USA followed in late 2021, which is why most
  American coverage treats it as a 2021-2022 model. The factory chart
  runs a five-club 6-PW core set with the 5-iron sold separately, on
  Japanese-market lengths (37.5-inch 7-iron) with a 30-degree 7-iron and
  42-degree pitching wedge; a 46-degree P/A wedge extended the set in
  some markets. The second-generation TB-5 Forged ('25), released
  8 November 2024, replaced it, though Fourteen kept the original's
  left-handed version in the range.
