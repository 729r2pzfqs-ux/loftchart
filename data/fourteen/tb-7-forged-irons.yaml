faq:
  - q: "What is the loft of a Fourteen TB-7 Forged 7-iron?"
    a: "The Fourteen TB-7 Forged 7-iron has a loft of 30 degrees, a lie of 62 degrees and a factory length of 37.5 inches with the N.S.PRO 950GH HT R shaft — identical loft and lie to the larger TB-5 Forged."
  - q: "How does the Fourteen TB-7 differ from the TB-5?"
    a: "Both use the same 'Theater Blade' hidden-cavity forging and share one loft ladder, but the TB-7 has a smaller, more compact head with a straighter, less-offset neck, trading some of the TB-5's forgiveness for operability and accuracy - Fourteen's own reviewer described it as more of a 'muscle back' feel."
  - q: "When was the Fourteen TB-7 Forged released?"
    a: "In Japan on 21 April 2022, reaching overseas markets including the US from September 2022."
  - q: "Is the Fourteen TB-7 Forged good for beginners?"
    a: "No - reviewers note it favors amateur and professional golfers who prioritize feel and workability over the utmost forgiveness, unlike Fourteen's more forgiving TB-5."
