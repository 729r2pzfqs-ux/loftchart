description: >
  The TB-7 Forged applies Fourteen's "Theater Blade" concept — a hidden
  cavity whose back wall curves smoothly into the blade rather than
  stepping down, for a soft forged feel without a visible cavity line — to
  a smaller, more compact head than the TB-5 Forged the design started
  with. Fourteen released it in Japan on 21 April 2022 with a "not too
  easy, not too difficult" brief, and reviewer Hiroichiro Yoshida's
  company-published test called it more operable and accurate than the
  larger, more forgiving TB-5, at the cost of some of that model's
  forgiveness — a straighter, less-offset neck and a compact head aimed at
  mid-to-low handicaps rather than the TB-5's wider range. The two models
  share an identical loft ladder (a 30-degree 7-iron, 42-degree pitching
  wedge) so they blend into a combo set, and Fourteen brought it to
  overseas markets, including the US, from September 2022. The factory
  chart runs #4 through pitching wedge with a nickel-chrome satin finish,
  made in Japan.
