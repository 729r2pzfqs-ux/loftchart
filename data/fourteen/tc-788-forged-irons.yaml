sources:
  - "Fourteen official TC-788 FORGED factory spec chart (fourteen.co.jp files, archive.org capture: TC788-graph.jpg from the product page at fourteen.co.jp/products/iron/tc-788fg/) — #4-P lofts 21/24/27/31/35/40/45, lies 60-63, and per-shaft length ladders: 39 to 35.75 inches with N.S.PRO 950GH HT (S/R, recorded here) and 38.75 to 35.5 with N.S.PRO Modus3 Tour 105, plus swing weights, CG data and face progression 3.9-4.2 mm."
  - "Fourteen official English TC-788 FORGED product page (fourteen.co.jp/en/products/iron/tc-788fg/, archive.org capture of 18 July 2019) — forged S20C soft steel head, nickel-chrome-plated satin finish, N.S.PRO 950GH HT stock shaft (S 98 g / R 94.5 g), the six-piece #5-P stock set with #4 as an add-on, the undercut-cavity deep-CG construction copy, the TP-766 combo pairing, and the manufacturer's stated launch date of November 2017."
  - "GolfWRX 'Fourteen introduces new TC-788 iron' and Willie's Blog first look, 10 November 2017 — the Endo forging, the per-club individualized dimensions (6-iron blade 3 mm taller than the 7-iron), minimal offset, bevelled trailing edge and the $1,349.99 US 4-PW set price; US availability followed in 2018."
