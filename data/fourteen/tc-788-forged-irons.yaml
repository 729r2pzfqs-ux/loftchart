faq:
  - q: "What is the loft of a Fourteen TC-788 7-iron?"
    a: "The Fourteen TC-788 Forged 7-iron has a loft of 31 degrees, a lie of 61.5 degrees and a length of 37.25 inches in the stock N.S.PRO 950GH HT build."
  - q: "Is the Fourteen TC-788 forged?"
    a: "Yes — each head is forged by Endo from a single piece of S20C soft carbon steel, with an undercut cavity machined into the design for a deep, low centre of gravity."
  - q: "What clubs came in a Fourteen TC-788 set?"
    a: "The stock set ran 5-iron through pitching wedge, with the 4-iron sold as an add-on; Fourteen suggested pairing the pocket-cavity TP-766 in the long irons for a combo set."
  - q: "Why do Fourteen TC-788 lengths look unusual?"
    a: "Fourteen published a different length ladder per stock shaft — 39 to 35.75 inches in quarter-inch-odd steps for the 950GH HT build recorded here, and a quarter-inch shorter throughout for the Modus3 Tour 105 build."
