description: >
  The TC-788 Forged was Fourteen's distance take on the forged tour iron
  — "exceptional distance in a forged tour iron with forgiveness" in the
  company's own line — launched in Japan in November 2017 and sold in the
  US from 2018 at $1,349.99 for a 4-PW set. Each compact head is forged
  by Endo from a single piece of S20C soft steel with an externally
  visible undercut cavity that drives the centre of gravity unusually low
  and deep, and no two heads share dimensions: the 6-iron blade stands
  3 mm taller than the 7-iron as the set progresses from distance-biased
  long irons to control-biased scoring clubs. Offset is minimal and the
  thick sole carries a heavily bevelled trailing edge so it plays thinner
  than it measures. Lofts sit at a 31-degree 7-iron and 45-degree
  pitching wedge; the stock set ran #5-PW with the #4 sold separately,
  and Fourteen matched it to the pocket-cavity TP-766 long irons for
  combo sets. The lengths below are the factory chart for the stock
  N.S.PRO 950GH HT build; the Modus3 Tour 105 option ran a quarter-inch
  shorter. It moved to Fourteen's archive section in 2020.
