description: >
  The Perform (retroactively badged P01 when the P02 arrived) is the iron at
  the heart of Stix Golf's direct-to-consumer sets - an all-black,
  minimalist-looking 431 stainless deep cavity back sold 5-iron through
  pitching wedge. The heads behind the Perform branding were on sale in
  Stix's 2021 sets with the same lofts and lies, and Stix itself dates the
  model to 2021. Lofts sit in classic game-improvement territory with a
  28-degree 7-iron but a 45-degree pitching wedge, leaving a wide 39-to-45
  gap-friendly wedge flow, and offset is generous throughout. Stock builds
  use 120-gram black steel shafts (graphite optional) at a D1 swing weight
  across the set; offsets below are converted from Stix's published
  millimetre figures.
