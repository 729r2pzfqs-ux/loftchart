faq:
  - q: "What is the loft of a Stix Perform 7-iron?"
    a: "The Stix Perform 7-iron has a loft of 28 degrees, with a 62-degree lie and a 37-inch length."
  - q: "Are Stix Perform irons forged?"
    a: "No. They are cast 431 stainless steel deep cavity backs - the design puts forgiveness and price ahead of forged feel."
  - q: "What clubs come in a Stix Perform iron set?"
    a: "The stock set is six clubs, 5-iron through 45-degree pitching wedge, sold with 120-gram black steel shafts or optional graphite at a D1 swing weight."
