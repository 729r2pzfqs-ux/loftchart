faq:
  - q: "What is the loft of a Stix P02 Perform 7-iron?"
    a: "The Stix P02 Perform 7-iron has a loft of 30 degrees, with a 62-degree lie and a 37-inch length."
  - q: "How do the P02 Perform lofts compare with the original Stix Perform?"
    a: "They are weaker through most of the set. The 5-iron goes from 22 to 23 degrees, the 6-iron from 25 to 26, the 7-iron from 28 to 30, the 8-iron from 33 to 34, the 9-iron from 39 to 40 and the pitching wedge from 45 to 46. Lies and lengths are unchanged."
  - q: "What are Stix P02 Perform irons made of?"
    a: "They are 17-4 stainless steel deep cavity backs. The first-generation Perform used 431 stainless steel."
  - q: "What clubs come in a Stix P02 Perform iron set?"
    a: "The set is six clubs, 5-iron through a 46-degree pitching wedge, with 120-gram steel shafts in regular or stiff flex."
