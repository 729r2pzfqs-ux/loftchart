sources:
  - "Stix's own P02 Perform Iron Set product page, 'Iron Set Spec' table (https://stix.golf/products/p02-perform-iron-set, retrieved 29 September 2026) - supplied every loft, length, lie and swing weight above for the 5-iron through PW, plus head weights of 257 to 294 g, the 17-4 stainless steel head material and the 120 g shaft weight. The table heads the length row 'Length (+/- .5 inch)' and prints the pitching-wedge lie as 63.5 with an inch mark, read here as 63.5 degrees in line with the half-degree steps of the rest of the row."
  - "Announcement date: the Stix store's product feed (https://stix.golf/products.json, retrieved 29 September 2026) gives the P02 Perform 12-club sets a published date of 29 January 2026 and the standalone iron set 5 March 2026. year_introduced follows the January date; the feed's 12-club set copy supplies the 17-4 deep cavity back, bigger cavity, progressive offset and 2.5 mm face description."
  - "Offset and bounce are not published for the P02 Perform and are omitted rather than estimated. The iron set page states that only steel shafts are currently available for the standalone set; graphite is offered on irons within the 12-club sets."
  - "Status check, 29 September 2026: confirmed as a current model with no replacement announced. Listed and available to order on Stix's own store (https://stix.golf/products/p02-perform-iron-set), described there as the next generation of the Perform Series."
