description: >
  The P02 Perform is the second generation of the iron in Stix Golf's
  direct-to-consumer Perform sets, launched in January 2026. The deep cavity
  back head moves from 431 to 17-4 stainless steel, with a larger cavity, a
  2.5 mm face and a centre of gravity Stix says is lower and deeper than
  before. Lofts are weaker than the first Perform through most of the set -
  a 30-degree 7-iron against 28 - while the pitching wedge moves from 45 to
  46 degrees. Sold 5-iron through pitching wedge with 120-gram steel shafts
  in regular and stiff flex. Stix does not publish offset or bounce for this
  model, so those keys are omitted.
