description: >
  The Compete marked a sharp turn for Stix Golf away from the beginner- and
  mid-handicapper-focused Play and Perform lines toward "better players who
  want more control and workability," per independent review coverage - the
  company's first players-oriented release. A two-piece hollow body pairs an
  ultra-thin, high-strength AM355P stainless steel face with a 17-4 stainless
  body for faster ball speed than the 431 stainless used in Stix's earlier
  irons, while keeping a tournament-grade, compact profile. MyGolfSpy's
  review called it a player's-distance iron that stood out for accuracy
  rather than raw distance. Sold 4-PW at $699 with a 120-gram steel
  performance shaft standard (graphite optional) and a soft rubber grip, in
  Reg, Stiff and Active flex options; a Jack Nicklaus-branded "Nicklaus
  Compete" version followed as Stix's first muscle-back iron collaboration.
