sources:
  - "stix.golf 'Stix Compete Iron Set (4-PW) — Hollow Body, Tournament Grade' official product page (retrieved July 2026) — the full manufacturer spec table used here: lofts 22/25/28/31/35/40/46 degrees, lies 60.5-63.5, lengths 38.5 down to 35.5 inches, head weights 254-294 g, 120 g steel shaft weight, swing weights D2-D2.5, two-piece hollow-body construction with AM355P steel face and 17-4 stainless body, $699 price, and Reg/Stiff/Active flex options."
  - "breakingeighty.com 'The New Stix Compete Irons Deserve Your Attention' — the positioning shift from the beginner/mid-handicap Play and Perform lines toward better players wanting control and workability, the AM355P face versus the older 431 stainless models, and the $649-699 pricing."
  - "MyGolfSpy 'Stix Golf Compete Hollow Body' review (2025) — explicitly categorizes the model as a 'player's distance iron' noted for accuracy, corroborating the hollow-body/thin-face construction."
  - "Golf.com 'Stix Golf and Nicklaus unveil first collab sets' (2 April 2025) — covers the Jack Nicklaus-branded Nicklaus Compete Iron Set, described by Stix founder Gabe Coyne as the brand's first muscleback iron, built on the same Compete platform; independent review coverage of the base Compete line clusters in 2025, so the 2024 introduction recorded here is the earlier of the two plausible years and should be treated as an estimate."
faq:
  - q: "What is the loft of a Stix Compete 7-iron?"
    a: "The Stix Compete 7-iron has a loft of 31 degrees, a lie of 62 degrees and a length of 37 inches."
  - q: "How does the Stix Compete differ from the Stix Perform?"
    a: "The Compete is Stix's first line built for better players rather than beginners or mid-handicappers - a two-piece hollow body with an ultra-thin AM355P stainless face for more ball speed, versus the Perform's cast 431 stainless deep cavity back."
  - q: "What is the Nicklaus Compete Iron Set?"
    a: "A Jack Nicklaus-branded version of the Compete platform, announced in April 2025 as Stix's first muscleback iron collaboration, built to the same tournament-grade positioning as the standard Compete."
