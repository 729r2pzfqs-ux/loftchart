description: >
  The XXIO 14 fairway woods launched in early 2025 with the XXIO 14 driver,
  continuing XXIO's ultra-lightweight formula for moderate swing speeds:
  total club weights well under 300 g, counterbalanced Weight Plus grips, and
  high-launch builds at longer-than-standard lengths. Five lofts run from a
  15° 3-wood to a 23° 9-wood on glued hosels. As of October 2026 the line is
  current — XXIO refreshes its core line every two years, so a 15th
  generation is expected in 2027.
