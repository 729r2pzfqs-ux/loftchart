faq:
  - q: "What lofts does the XXIO 14 fairway wood come in?"
    a: "Five lofts: 15, 16.5, 18, 20 and 23 degrees — a 3-wood through 9-wood ladder."
  - q: "Is the XXIO 14 fairway wood adjustable?"
    a: "No — XXIO builds glued hosels throughout, keeping weight out of the hosel for its ultra-light builds. The loft printed on the head is the loft it plays."
  - q: "Who is the XXIO 14 fairway wood for?"
    a: "Golfers with moderate swing speeds — the whole XXIO formula is sub-300-gram club weights, counterbalanced grips and slightly longer builds that add clubhead speed without extra effort."
