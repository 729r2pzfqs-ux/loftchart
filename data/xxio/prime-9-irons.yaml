faq:
  - q: "What is the loft of an XXIO Prime 9 7-iron?"
    a: "The XXIO Prime 9 7-iron has a loft of 28 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "What is the Prime 9 iron head made of?"
    a: "A cast 630 stainless-steel body with a tungsten-nickel sole weight and, in the long irons, an additional high-density tungsten-nickel inner weight for a low, deep centre of gravity. Unlike later Prime generations, XXIO's own launch materials do not describe a separate titanium face insert for this generation."
  - q: "How light is the XXIO Prime 9 iron?"
    a: "Very light: total club weight is 339 grams for the 5- and 6-irons and 349 grams for the 7-9 irons, built around the extremely light XXIO Prime SP-900 graphite shaft."
