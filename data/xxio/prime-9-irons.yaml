sources:
  - "golfwrx.com 'The shafts are how light? XXIO's new Prime drivers, fairway woods, hybrids and irons' (14 Nov 2016, reporting the 17 Dec 2016 on-sale date) — the original manufacturer briefing for the first XXIO Prime irons: 630 stainless-steel body construction with mirror/satin/high-gloss bead-blast finish, tungsten-nickel sole weight (28g in the 7-iron) plus an additional tungsten-nickel inner weight in the long irons, 339g (5-6 iron) / 349g (7-9 iron) total club weight, the SP-900 graphite shaft in SR/R flex, and the 7-9-PW stock set sold with 5/6/AW/SW as singles."
  - "sdgolfpro.com 'XXIO Prime 9 Irons' product listing — full loft/lie/bounce/length table for 5 through SW (22-56 degrees, 61.5-63.5 degrees, 1-12 degrees bounce, 38.25-35.75 inches)."
  - "mrtopesgolf.com individual-club listing for a Prime 9 6-iron on the 'XXIO SP-900 Prime R' shaft, 37.75 inches — corroborates the length table and the SP-900 shaft naming."
  - "2ndswing.com and Amazon listings for the XXIO Prime Royal Edition / later Prime generations corroborate that the AW and SW share the PW's 35.75-inch length in this iron family, matching the sdgolfpro table exactly."
  - "Note on category and naming: retailers and this site's own naming convention refer to this launch generation as 'Prime 9' to align it with the contemporaneous 9th-numbered-generation XXIO cycle; XXIO's own 2016 marketing called it simply 'XXIO Prime' with no number, since it was the first Prime release."
