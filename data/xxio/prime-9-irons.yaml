description: >
  Prime 9 was the first XXIO Prime iron, launched 17 December 2016 alongside
  the XXIO Forged irons as a new ultra-light tier above the numbered XXIO
  line. XXIO built it for the lowest and deepest centre of gravity in an
  XXIO iron to that point, using a 630 stainless-steel body with a
  tungsten-nickel sole weight (28 grams in the 7-iron) and an additional
  high-density tungsten-nickel inner weight in the long irons. The stock
  XXIO Prime SP-900 graphite shaft is extremely light, built with Toray
  T1100G material and a shock-absorbing tip section to add draw bias. Total
  club weight is just 339 grams for the 5- and 6-irons and 349 grams for the
  7-9 irons. The stock set was 7-9-PW, sold individually as 5, 6, AW and SW.
