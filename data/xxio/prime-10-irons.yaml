faq:
  - q: "What is the loft of an XXIO Prime 10 7-iron?"
    a: "The XXIO Prime 10 7-iron has a loft of 28 degrees, a lie of 62.5 degrees and a length of 37.25 inches, the same table used by the Prime 9 and Prime 11 generations either side of it."
  - q: "What changed between the XXIO Prime 9 and Prime 10?"
    a: "The head geometry held steady, but the Prime 10 added a thin, forged Super-TIX PLUS titanium face insert with a CNC-milled speed groove in place of the Prime 9's stainless-only face, plus a new SP-1000 stock shaft, for more ball speed at the same very light swing weight."
  - q: "What shaft came stock in the XXIO Prime 10?"
    a: "The XXIO Prime SP-1000, a graphite shaft built with Toray T1100G carbon fibre and Nanoalloy resin, in R and SR flex."
