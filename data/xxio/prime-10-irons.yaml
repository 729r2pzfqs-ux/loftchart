sources:
  - "Manufacturer/retailer copy for 'XXIO Prime 10 Irons' (carlsgolfland.com, vkgolfshop.com product listings) — confirms the thin, forged Super-TIX PLUS titanium face with a CNC-milled speed groove, the XXIO Prime SP-1000 graphite shaft (Toray T1100G carbon fibre, Nanoalloy resin), and the pronounced-to-tapering offset profile from long irons to wedges."
  - "Note on loft/lie/bounce/length table: no independent Prime-10-specific spec chart could be retrieved (the retailer pages that carry it are behind a bot-check wall). The table recorded here is carried over from the confirmed Prime 9 and Prime 11 tables, which are identical to each other club for club (loft, lie, bounce and length all match exactly across both independently-sourced tables — sdgolfpro.com for Prime 9, 2ndswing.com for Prime 11), and XXIO's Prime line is documented elsewhere (see Honma and XXIO sibling files on this site) as typically holding a loft/lie table constant across a generation or two while changing face material and shaft. Confidence is set to medium/low specifically because of this extrapolation."
  - "Year note: year_introduced 2018 and year_discontinued 2020 follow XXIO's Prime numbering cadence, pairing Prime 10 with the contemporaneous 10th-generation XXIO cycle (announced Japan late 2017, US retail early 2018, per the xxio-10-irons.yaml entry on this site) and ending at the Prime 11 introduction."
