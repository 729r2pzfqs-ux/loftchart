description: >
  Prime 10 is the second XXIO Prime iron generation, following the original
  Prime 9 into the US market in 2018. It carried over the same loft, lie,
  bounce and length table as the Prime 9 while adding a thin, forged
  Super-TIX PLUS titanium face insert with a CNC-milled speed groove in
  place of the first generation's stainless-only face, for more ball speed
  from the same very light head weight. The offset is pronounced in the
  long irons and tapers sharply toward the wedges for control. The stock
  shaft is the XXIO Prime SP-1000, built with Toray T1100G carbon fibre and
  Nanoalloy resin. The stock set was 7-9-PW, sold individually as 5, 6, AW
  and SW.
