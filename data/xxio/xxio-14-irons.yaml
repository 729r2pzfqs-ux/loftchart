sources:
  - "XXIO's own XXIO 14 irons product page, specification table (https://srixonasia.com/product/xxio-14-irons/) — supplied every loft, lie, length, swing weight and club weight, the MP1400 stock shaft and the eight-club 5-SW set makeup."
