description: >
  XXIO 14 keeps the lofts and lies of the XXIO 13 exactly and lengthens the whole set
  by a quarter of an inch, which lifts the stock swing weight from C8 to C9 while the
  static club weights actually drop by five grams a club. It is also the first XXIO
  numbered set to split into two models: the standard 14 for moderate swing speeds
  and a stronger-lofted 14+ for slightly faster ones. XXIO announced both in November
  2025 for a December on-sale date, so retailers list them as the 2026 line.
