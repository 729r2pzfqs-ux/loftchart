faq:
  - q: "What is the loft of an XXIO 14 7-iron?"
    a: "The XXIO 14 7-iron has a loft of 28 degrees, a lie of 62.5 degrees and a length of 37.5 inches."
  - q: "What is the difference between the XXIO 14 and XXIO 14+?"
    a: "The 14+ is stronger through the set — 28.5 degrees at the 7-iron against 28, and 23 at the 5-iron against 22 — and is built a quarter inch shorter, ending at the approach wedge rather than a sand wedge."
  - q: "Is the XXIO 14 a 2025 or 2026 model?"
    a: "Both, depending on how you count. XXIO unveiled it in November 2025 and put it on sale on 8 December 2025; most retailers catalogue it as the 2026 line."
