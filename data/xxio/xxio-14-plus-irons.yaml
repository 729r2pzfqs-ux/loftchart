faq:
  - q: "What is the loft of an XXIO 14+ 7-iron?"
    a: "The XXIO 14+ 7-iron has a loft of 28.5 degrees, a lie of 62.0 degrees and a length of 37.25 inches."
  - q: "Who is the XXIO 14+ for?"
    a: "XXIO positions it for players with slightly faster swing speeds than the standard 14 suits — the same ultralight idea, but with stronger lofts, a shorter build and a heavier stock shaft."
  - q: "Does the XXIO 14+ come with a sand wedge?"
    a: "No. The set runs 5-iron through approach wedge at 49 degrees; the standard XXIO 14 is the one that carries a 56-degree sand wedge."
