description: >
  The 14+ is the first plus model in an XXIO numbered line, aimed at players with
  slightly faster swings than the standard 14 suits. It runs stronger lofts through
  the middle of the set, sits a half-degree flatter in the long irons, is built a
  quarter inch shorter than the 14 at every club, and stops at an approach wedge
  rather than carrying a sand wedge. The stock shaft is a Fujikura Speeder NX DST
  built for XXIO rather than the in-house MP1400.
