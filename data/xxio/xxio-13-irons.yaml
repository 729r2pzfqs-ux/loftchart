faq:
  - q: "What is the loft of an XXIO 13 7-iron?"
    a: "The XXIO 13 7-iron has a loft of 28 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "What is the difference between the XXIO 13 and XXIO 14?"
    a: "The lofts and lies match club for club, but the XXIO 14 is built a quarter of an inch longer at every club and runs one swing-weight point heavier at C9."
  - q: "What shafts came stock in the XXIO 13 irons?"
    a: "The XXIO MP-1300 graphite shaft, with the Nippon N.S.Pro 850GH DST as the steel alternative, both in R2, R, SR and S."
