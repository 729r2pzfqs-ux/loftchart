description: >
  XXIO 13 keeps the loft, lie and length chart of the XXIO 12 unchanged and reworks
  the four-piece construction behind it, with 31 grams of tungsten used through the
  5 to 7 irons to drive the centre of gravity low and back. The stock shafts are
  extremely light for the category — 47 grams in regular, 50 in stiff. Like the rest
  of the XXIO line the reference build is graphite, so the set runs at C8 rather than
  the D-range swing weights of a steel-shafted set.
