description: >
  XXIO 9 is the ninth generation of Dunlop's lightweight flagship, announced
  in late 2015 and sold in the US through 2016 and 2017 as the 2016 line. The
  4- through 7-irons use a five-piece head — Super-TIX PLUS titanium milled
  face insert, SUS630 stainless body and tungsten-nickel weights in the sole,
  toe, heel and neck — which XXIO claimed gave the lowest centre of gravity in
  the line's history, while the short irons simplify to fewer pieces. The
  matching Dual Speed Technology build pairs the heavier head with the
  MP900 graphite shaft, whose balance point sits 15mm closer to the grip than
  the MP800 it replaced. Lofts are traditional for the category — a 30-degree
  7-iron and 44-degree pitching wedge — and XXIO publishes face progression
  (1mm at the 4-iron to 5.5mm at the wedges) rather than offset. The stock
  set was 6-PW with 4, 5, AW and SW singles.
