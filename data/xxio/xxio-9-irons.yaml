sources:
  - "xxiousa.com/products/xxio9 official XXIO 9 series page, archive.org snapshot of 27 November 2015 — the manufacturer iron specification table giving loft, lie, bounce, face progression and club length for the 4-iron through sand wedge, the five-piece #4-7 head construction (Super-TIX PLUS titanium milled face insert, SUS630 body, tungsten-nickel sole/toe/heel/neck weights), the MP900 graphite (S/SR/R, 54-57g) and N.S. Pro 890GH DST for XXIO steel (S/R, 87-91g) shaft tables, and the 6-PW five-club stock set with 4, 5, AW and SW singles."
