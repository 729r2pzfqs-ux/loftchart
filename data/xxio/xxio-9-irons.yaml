faq:
  - q: "What is the loft of an XXIO 9 7-iron?"
    a: "The XXIO 9 7-iron has a loft of 30 degrees, a lie of 62.0 degrees and a length of 37.0 inches."
  - q: "What shafts did the XXIO 9 irons come with?"
    a: "The stock graphite shaft was the XXIO MP900 in R, SR and S flexes, with the Nippon N.S. Pro 890GH DST for XXIO as the steel option in R and S."
  - q: "What is the XXIO 9 head made of?"
    a: "The 4- through 7-irons use a five-piece head with a milled Super-TIX PLUS titanium face insert on a SUS630 stainless steel body, plus tungsten-nickel weights in the sole, toe, heel and neck. The short irons use a simpler construction."
  - q: "When did the XXIO 9 irons come out?"
    a: "The XXIO 9 series was announced in late 2015, reached Japanese retail in December 2015 and US retail in January 2016, and was replaced by the XXIO 10 announced in late 2017."
