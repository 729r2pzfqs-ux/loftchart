faq:
  - q: "What is the loft of an XXIO Eleven 7-iron?"
    a: "The XXIO Eleven 7-iron has a loft of 28 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "Why is the XXIO Eleven swing weight only C9?"
    a: "XXIO builds the set counterbalanced with its Weight Plus system — brass and rubber weights in the butt end of each club raise the balance point, so the head can stay light and the club easy to swing at moderate speed. C9 to D0 is the intended reading, not a build error."
  - q: "What shafts did the XXIO Eleven irons come with?"
    a: "The US stock build was graphite only, with the XXIO MP1100 shaft in regular and stiff flexes."
  - q: "When did the XXIO Eleven irons come out?"
    a: "The Eleven generation was announced in late 2019, reached Japanese retail in December 2019 and US retail in early 2020. It was replaced by the XXIO 12 in late 2021."
