description: >
  XXIO Eleven is the eleventh generation of Dunlop's ultralight premium line,
  announced in late 2019 for the Japanese market and brought to the US in
  early 2020 — the year the set is usually dated by. Its signature change over
  the XXIO 10 is the Double Undercut Cavity, two slots cut into the body just
  behind the hot-forged titanium face to add face flex, and the more
  aggressive Weight Plus build, with brass and rubber counterweights in the
  butt end of every club raising the balance point so a moderate swing can
  still load the shaft. Swing weights run C9 through the 5-iron to pitching
  wedge and D0 in the wedges, far below a conventional set. The US stock set
  was graphite only, sold 6-PW or 5-PW plus SW in right and left hand.
