faq:
  - q: "What is the loft of an XXIO Prime 11 7-iron?"
    a: "The XXIO Prime 11 7-iron has a loft of 28 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "Why is the XXIO Prime 11 pitching wedge loft so strong?"
    a: "At 42 degrees it is roughly 3 degrees stronger than a typical super-game-improvement pitching wedge, which pushes distance up at the cost of needing a dedicated gap wedge to cover the yardage that a more traditional 45-degree PW would fill."
  - q: "What is the swing weight of the XXIO Prime 11?"
    a: "C7 through the irons, stepping up to C8 in the PW, AW and SW — very light, in keeping with the rest of the Prime line's ultra-lightweight positioning."
