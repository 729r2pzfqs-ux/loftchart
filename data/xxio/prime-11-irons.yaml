description: >
  Prime 11 is the third XXIO Prime iron generation, carrying over the same
  loft, lie, bounce and length table used since the Prime 9 while refining
  the Super-TIX PLUS titanium face with dynamic variable thickness and
  adding a high-density tungsten-nickel toe weight for stability, plus a
  progressive centre-of-gravity height that runs lower in the long irons
  for carry and higher in the short irons for control. Lofts are notably
  strong for a super-game-improvement iron (a 42-degree pitching wedge
  against a roughly 45-degree category average). The stock XXIO Prime
  SP-1100 graphite shaft again uses Toray T1100G carbon fibre and Nanoalloy
  resin. Swing weight is C7 through the irons, C8 in the wedges. The stock
  set was 7-9-PW, sold individually as 5, 6, AW and SW.
