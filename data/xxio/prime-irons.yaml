description: >
  Prime is the top of XXIO's range and the lightest thing the brand builds — the
  stock SP-1300 iron shafts weigh 42 to 46 grams, and the set runs at C7 swing weight.
  The head is a four-piece construction with a titanium face and a Rebound Frame
  structure for a very low centre of gravity. The stock set starts at the 6-iron;
  the 5-iron is special order. Lofts match the XXIO numbered sets club for club.
