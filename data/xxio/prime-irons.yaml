faq:
  - q: "What is the loft of an XXIO Prime 7-iron?"
    a: "The XXIO Prime 7-iron has a loft of 28 degrees, a lie of 62.5 degrees and a length of 37.5 inches."
  - q: "Why does the XXIO Prime set start at the 6-iron?"
    a: "That is the stock makeup — 6-iron through sand wedge. The 5-iron is available on special order rather than as part of the standard set."
  - q: "How light is the XXIO Prime iron shaft?"
    a: "The stock SP-1300 graphite iron shafts weigh between 42 and 46 grams, which is roughly a third of a typical steel iron shaft, and the finished clubs measure C7 swing weight."
