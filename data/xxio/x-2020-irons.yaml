sources:
  - "xxiousa.com XXIO X Irons product page (MXIS), archive.org snapshot of 23 September 2020 — the manufacturer specification table giving loft, lie angle, club length and swing weight for the 4-iron through sand wedge, right-hand-only availability, the 6-PW / 5-PW / 5-PW+SW set options, R and S flexes in both steel and graphite, and the milled Speed Groove and Weight Plus technology copy."
  - "Pro Golf Japan and retailer listings for the Dunlop 2020 XXIO X iron — the Miyazaki AX-1 stock graphite shaft; MyGolfSpy's 2022 XXIO X coverage identifies the first-generation steel stock shaft as the Nippon N.S. Pro 920GH D.S.T. made for XXIO. Shaft names come from these secondary sources rather than the archived spec page, which lists only 'Graphite' and 'Steel'."
