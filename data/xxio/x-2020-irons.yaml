faq:
  - q: "What is the loft of a 2020 XXIO X 7-iron?"
    a: "The 2020 XXIO X 7-iron has a loft of 29 degrees, a lie of 62.0 degrees and a length of 37.0 inches."
  - q: "How does the 2020 XXIO X differ from the XXIO Eleven?"
    a: "The X keeps the Eleven's ultralight, counterbalanced concept but aims it at players with more speed: lofts are a degree stronger at the 7-iron, every club is built half an inch to a quarter inch shorter, and a steel shaft option was offered where the Eleven was graphite only in the US."
  - q: "Is the 2020 XXIO X the same as the XXIO 10?"
    a: "No. The tenth numbered generation (2017-2019) was badged 'XXIO X' with the Roman numeral in the US, but the 2020 X is a separate players-distance line that continued with the second-generation X in 2022."
  - q: "What shafts did the 2020 XXIO X irons come with?"
    a: "The stock graphite shaft was the Miyazaki AX-1, and the steel option was the Nippon N.S. Pro 920GH D.S.T. made for XXIO, both in regular and stiff flexes."
