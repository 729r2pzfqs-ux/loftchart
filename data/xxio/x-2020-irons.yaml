description: >
  The 2020 XXIO X is the first generation of the letter-X line, launched
  alongside the XXIO Eleven in early 2020 as the better-player's version of
  the brand's ultralight formula — not to be confused with the 2017-2019
  "XXIO X" that was simply the tenth numbered generation. A milled Speed
  Groove channel runs around the perimeter of the back of the face plate to
  add flex at impact, and the Weight Plus butt-end counterweights carry over
  from the numbered sets, so graphite builds still read C9 to D0 on the swing
  weight scale. Lofts match the outgoing XXIO 10 with a 29-degree 7-iron, but
  the build is a quarter inch shorter through the set and, unlike the Eleven,
  a steel shaft was offered. Sold right-handed only, 6-PW, 5-PW or 5-PW plus
  SW, with a 4-iron and wedges as singles.
