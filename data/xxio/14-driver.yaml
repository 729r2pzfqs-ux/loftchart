faq:
  - q: "What lofts does the XXIO 14 come in?"
    a: "The standard XXIO 14 comes in 9.5, 10.5 and 11.5 degrees (9.5 right-hand only); the XXIO 14+ in 9 and 10.5, right-hand only. The Ladies line runs 10.5 to 13.5 degrees."
  - q: "Is the XXIO 14 adjustable?"
    a: "Yes — a first for the brand. The 14 and 14+ carry XXIO's Lightweight Quick Tune sleeve with about 1.5 degrees of loft adjustment either way; XXIO publishes the range but not a position-by-position chart. The Ladies models appear to keep a fixed hosel."
  - q: "What is the difference between the XXIO 14 and XXIO 14+?"
    a: "Weight and flight. The standard 14 is about 283 grams total at 46 inches for roughly 75-90 mph swings; the 14+ is 299 grams at 45.75 inches with a lower launch for 90-100 mph swings, and comes right-hand only."
  - q: "Who is the XXIO 14 for?"
    a: "Golfers with moderate swing speeds who gain more from an ultralight, draw-biased, high-launch build than from tour-style adjustability — the classic XXIO buyer. Faster swingers will find the heads too light and too spinny."
