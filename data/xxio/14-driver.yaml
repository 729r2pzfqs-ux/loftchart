description: >
  The XXIO 14 is the 2026 generation of XXIO's ultralight flagship, at US
  retail from 8 December 2025 — and a first for the brand: after thirteen
  generations of glued hosels, the 14 and 14+ carry an adjustable
  "Lightweight Quick Tune" loft sleeve. The standard 14 is a 283-gram total
  build at 46 inches for swing speeds of roughly 75-90 mph; the 14+ is the
  slightly heavier (299 g), lower-launching build for 90-100 mph swings,
  right-hand only. A separate XXIO 14 Ladies line runs rounded ultralight
  heads at 10.5° to 13.5° with the MP-1400L shaft. Both men's models use the
  silicon-enhanced VR-Titanium face with XXIO's ULTiFLEX flex design.
