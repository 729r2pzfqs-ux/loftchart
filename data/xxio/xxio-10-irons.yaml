description: >
  XXIO 10 — sold in the US as "XXIO X", the Roman numeral, which invites
  confusion with the later letter-X players line — is the tenth generation of
  Dunlop's lightweight flagship, announced in late 2017 and at US retail
  through 2018 and 2019. The Hi-Energy Impact Head pairs a thin titanium face
  with tungsten-nickel sole weights for a larger high-COR area, and the
  matching MP1000 Smart Impact graphite shaft is built around Dual Speed
  Technology: a heavier head on an extremely light, counterbalanced shaft.
  Lofts run two to three degrees stronger than the XXIO 9 it replaced, with a
  29-degree 7-iron. The chart below is the graphite build; the steel build
  plays a quarter inch shorter in every club.
