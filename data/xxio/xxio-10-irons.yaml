faq:
  - q: "What is the loft of an XXIO 10 7-iron?"
    a: "The XXIO 10 7-iron has a loft of 29 degrees, a lie of 62.5 degrees and a graphite-build length of 37.25 inches."
  - q: "Are the XXIO 10 and the XXIO X the same club?"
    a: "The tenth-generation XXIO (2017-2019) was marketed in the US as 'XXIO X' using the Roman numeral ten — that is this set. The XXIO X players-distance line introduced in 2020 is a different, unrelated model that happens to share the name."
  - q: "What shafts did the XXIO 10 irons come with?"
    a: "The stock graphite shaft was the ultralight XXIO MP1000 in R, SR and S flexes, and the stock steel option was the Nippon N.S. Pro 870GH DST made for XXIO, with steel builds a quarter inch shorter per club."
  - q: "Do XXIO 10 irons have a titanium face?"
    a: "Yes. The Hi-Energy Impact Head combines a thin titanium face with tungsten-nickel sole weights to enlarge the high-COR area of the face."
