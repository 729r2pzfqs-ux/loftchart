description: >
  XXIO Forged is Dunlop's attempt to put the XXIO name into a better player's
  hands: a forged S25C soft carbon steel body with an HT1770 steel face insert,
  a compact shape, a straight leading edge and a V-shaped sole. Lofts are
  moderate — 30 degrees at the 7-iron, 44 at the pitching wedge — and offset is
  described as moderate rather than minimal, running 3.0mm in the long irons
  and widening to 5.5mm in the wedges. The stock set is a six-club 5-PW, with
  the 4-iron, approach wedge and sand wedge sold individually.
