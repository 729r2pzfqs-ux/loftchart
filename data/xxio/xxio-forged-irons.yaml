faq:
  - q: "What is the loft of an XXIO Forged 7-iron?"
    a: "The XXIO Forged 7-iron has a loft of 30 degrees, a lie of 62.0 degrees and a length of 37.00 inches."
  - q: "What is the XXIO Forged made from?"
    a: "A forged S25C soft carbon steel body with a high-strength HT1770 steel face insert."
  - q: "How many clubs come in an XXIO Forged set?"
    a: "The stock set is six clubs, 5-iron to pitching wedge. The 4-iron, approach wedge and sand wedge are sold individually."
  - q: "Is the XXIO Forged as light as the rest of the XXIO range?"
    a: "No. It is built to conventional players-iron swing weights of D2 and D3, where the numbered XXIO line runs C8 and C9."
