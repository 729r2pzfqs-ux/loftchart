description: >
  XXIO X is the brand's line for better players who still want the ultralight build,
  sitting alongside the numbered sets rather than replacing them. This 2022 edition
  runs one degree stronger than the XXIO 12 of the same year at the 7-iron, 29 against
  28, and is built a quarter inch shorter through the set. The stock build is the
  Miyazaki AX-II graphite shaft; a steel option was offered and runs one swing-weight
  point heavier.
