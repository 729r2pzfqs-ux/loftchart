description: >
  XXIO 12 is the twelfth generation of Dunlop's lightweight premium line, and
  its defining feature is the 2.1mm titanium face plate on a stainless body,
  paired with a counterbalanced build. Heads are light — 351 grams total club
  weight at the 5-iron — and swing weights come out at C8 and C9, far below a
  conventional set, which is the point: the mass is moved into the grip end so
  a moderate swing can still load the shaft. XXIO publishes face progression
  rather than offset for this set. Sets are sold 5-SW right-handed.
