faq:
  - q: "What is the loft of an XXIO 12 7-iron?"
    a: "The XXIO 12 7-iron has a loft of 28 degrees, a lie of 62.5 degrees and a length of 37.25 inches."
  - q: "Why is the XXIO 12 swing weight only C8?"
    a: "XXIO builds the set counterbalanced — light heads and light graphite shafts, with mass moved towards the grip. A C8 or C9 reading is normal for the line and is what lets a moderate swing speed still load the shaft."
  - q: "Does the XXIO 12 come with a 4-iron?"
    a: "No. The stock set is 5-iron to sand wedge in right hand, and 6-iron to pitching wedge in left hand."
  - q: "What is the XXIO 12 face made of?"
    a: "A 2.1mm High Strength Super-TIX-51AF titanium plate on a stainless steel body, with tungsten-nickel weighting to keep the centre of gravity low."
