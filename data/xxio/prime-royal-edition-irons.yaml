faq:
  - q: "What is the loft of an XXIO Prime Royal Edition 7-iron?"
    a: "The XXIO Prime Royal Edition 7-iron has a loft of 28 degrees, a lie of 62.5 degrees and a length of 37.5 inches."
  - q: "What is the difference between XXIO Prime and Prime Royal Edition?"
    a: "The loft, lie, length and swing weight charts are the same from the 6-iron down. Royal Edition uses the SP-1300K shaft rather than the SP-1300, adds a 22-degree 5-iron on special order and carries the dressier finish."
