description: >
  Royal Edition is the dress version of XXIO Prime, built on the same four-piece
  titanium-face platform with an expanded Rebound Frame and its own SP-1300K shaft.
  It shares the Prime's lofts, lies and lengths from the 6-iron down and adds a
  5-iron at 22 degrees on special order. Swing weights are the same C7 through the
  irons, so the two sets feel alike; the differences are cosmetic and in the shaft.
