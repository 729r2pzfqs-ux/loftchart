description: >
  The Max Fast is the ultra-lightweight model of Callaway's 2024 Paradym Ai Smoke iron
  family, announced in January 2024 alongside the standard Ai Smoke, the wide-body Max
  and the high-launch HL. It brought the Japan-market "Fast" designation to the global
  line: a deep cavity back with the family's Ai Smart Face and tungsten weighting, sold
  graphite-only with a 40 gram Tensei stock shaft, sub-D0 swingweights and each club
  built long — a 39 inch 5-iron against the standard model's 38 — so slower swingers
  can generate speed. The chart runs 5-iron through sand wedge with no 4-iron. Specs
  below are the standard men's graphite build.
