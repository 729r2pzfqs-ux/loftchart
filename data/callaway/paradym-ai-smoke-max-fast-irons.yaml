sources:
  - "Callaway Golf Pre-Owned Paradym Ai Smoke Max Fast product specs (callawaygolfpreowned.com/iron-sets/irons-2024-paradym-ai-smoke-max-fast.html) — loft, lie, length, offset (in millimetres) and C9 swingweight for the 5-iron through sand wedge, plus the MCA Tensei Blue-Silver 40 stock shaft"
