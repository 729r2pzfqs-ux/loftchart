faq:
  - q: "What is the loft of a Callaway Paradym Ai Smoke Max Fast 7-iron?"
    a: "The Paradym Ai Smoke Max Fast 7-iron has a loft of 31 degrees, with a 62.5 degree lie and a 37.5 inch graphite length."
  - q: "Why are the Paradym Ai Smoke Max Fast irons longer than the standard model?"
    a: "The Max Fast is built for slower swing speeds: each club is roughly half an inch longer than the standard Ai Smoke — a 39 inch 5-iron — and paired with a 40 gram graphite shaft and C9 swingweight so the club is easier to move fast."
  - q: "Is there a 4-iron in the Paradym Ai Smoke Max Fast set?"
    a: "No. Callaway publishes the Max Fast from the 5-iron to a 56 degree sand wedge, with 5-PW the stock configuration."
