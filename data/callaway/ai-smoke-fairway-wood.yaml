faq:
  - q: "What lofts do the Callaway Paradym Ai Smoke fairway woods come in?"
    a: "The Ai Smoke MAX comes in 15, 16.5, 18, 20 (Heavenwood), 21, 24 and 27 degrees; the Triple Diamond in 15, 18 and 21; and the MAX Fast in 16, 19, 22 and 25."
  - q: "Is the Callaway Ai Smoke fairway wood adjustable?"
    a: "Only the 15 degree 3-woods and the 16.5 degree 3HL carry the OptiFit hosel (minus 1 to plus 2 degrees with a neutral or draw lie cog). Every other loft, and the whole MAX Fast line, is bonded."
  - q: "What is the difference between the Ai Smoke MAX and MAX Fast fairway woods?"
    a: "The MAX is the standard-weight core head in seven lofts. The MAX Fast is the lightweight package — bonded hosel, lighter head, shaft and grip, draw bias and more upright lies — in four lofts a degree weaker, built for slower swing speeds."
