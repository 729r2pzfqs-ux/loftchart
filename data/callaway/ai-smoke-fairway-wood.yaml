hosel:
  system: "OptiFit hosel (3-wood and 3HL heads of the MAX and Triple Diamond)"
  loft_range: "−1° to +2°"
  positions: 8
  lie_effect: >
    The lie cog has two positions: N (neutral, the stated lie) and D (draw, a
    more upright lie — Callaway does not publish the degree change).
  face_note: >
    Changing loft re-orients the head on the shaft, so lower settings sit
    slightly open and higher settings slightly closed at address.
  notes: >
    Callaway fitted the OptiFit hosel only to the 15° and 16.5° heads of the
    MAX and Triple Diamond; every other loft, and the whole MAX Fast line, is
    bonded. The two-cog design is the same one used on the Ai Smoke drivers.
