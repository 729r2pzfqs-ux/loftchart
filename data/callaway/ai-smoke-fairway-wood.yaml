description: >
  The Paradym Ai Smoke fairway woods launched in January 2024 with the Ai
  Smoke drivers, led by the machine-learned "Ai Smart Face". The MAX is the
  core head, carrying the full seven-loft ladder from the 15° 3-wood to the
  27° 11-wood including the 20° Heavenwood; the Triple Diamond is the compact
  low-spin tour head; and the MAX Fast is the lightweight, draw-biased bonded
  build for slower swings. Only the 15° and 16.5° heads of the MAX and Triple
  Diamond are adjustable. The Elyte fairways replaced the line in early 2025.
variants:
  - name: Paradym Ai Smoke MAX
    description: >
      The core head for most players in seven lofts, 171 cc (3-wood) down to
      128 cc (11-wood), including the 20° Heavenwood. The 3-wood and 3HL carry
      the OptiFit hosel; the rest are bonded. The 3HL, Heavenwood, 9-wood and
      11-wood are right-hand only.
  - name: Paradym Ai Smoke Triple Diamond
    description: >
      The compact tour head with a 172 cc 3-wood, flatter flight and the
      lowest spin in the family. 15, 18 and 21 degrees right-handed; 15 and
      18 left-handed. The 15° head is adjustable.
  - name: Paradym Ai Smoke MAX Fast
    description: >
      The lightweight draw-biased build for slower-to-moderate swings: bonded
      hosels, lighter components and more upright lies, in four right-hand
      only lofts from 175 cc down to 133 cc.
