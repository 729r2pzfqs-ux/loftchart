description: >
  The X-Tour was Callaway's first forged iron, a Roger Cleveland design that
  began shipping to pro shops on 15 April 2005 at 1,280 dollars for a 3-PW
  set. It marked the entry of a company built on cast game improvement heads
  into the traditional forged players market, and its loft ladder is
  correspondingly classical: a 35 degree 7-iron and a 47 degree pitching
  wedge, three degrees per club through the middle of the set. The X-Forged
  of 2007 replaced it and kept the same lofts, lies and lengths.
