faq:
  - q: "What is the loft of a Callaway Paradym Ai Smoke HL 7-iron?"
    a: "The Paradym Ai Smoke HL 7-iron has a loft of 30 degrees, a lie of 62.0 degrees and a length of 37.5 inches."
  - q: "What is the difference between the Paradym Ai Smoke and Ai Smoke HL?"
    a: "The HL is two degrees weaker at the 7-iron, a quarter of an inch longer, and carries a little more offset — 0.134 inches against 0.110 at the 7-iron. It is built to launch higher for slower swing speeds."
  - q: "What does HL mean on a Callaway iron?"
    a: "High launch. It is the head in the Paradym Ai Smoke family aimed at players who need more height and carry, sitting between the standard Ai Smoke and the Ai Smoke Max Fast."
