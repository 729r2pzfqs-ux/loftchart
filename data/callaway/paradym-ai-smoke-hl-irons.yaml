sources:
  - "Callaway's own Paradym Ai Smoke HL irons product page, specifications table (https://www.callawaygolf.com/golf-clubs/irons/irons-2024-paradym-ai-smoke-hl.html) — supplied every loft, lie, length and offset above, both stock shafts and the 4-iron through SW set makeup."
  - "Note on offset: Callaway publishes offset in millimetres (5.3 mm down to 1.3 mm), converted to inches here."
  - "Note on swing weight: Callaway publishes two columns, C9 for the graphite build and D1 for the steel build. The D1 steel figures are recorded here because this database uses the standard men's steel-shaft build; an HL set ordered in the stock Cypher Black graphite will measure two points lighter."
  - "golf.com 'What I learned getting fit for Callaway's Paradym Ai Smoke irons' — the Paradym Ai Smoke iron family launched for 2024 in three heads: Ai Smoke, Ai Smoke HL and Ai Smoke Max Fast."
