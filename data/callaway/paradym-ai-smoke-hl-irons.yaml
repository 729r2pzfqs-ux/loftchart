description: >
  HL is the high-launch head in Callaway's 2024 Paradym Ai Smoke iron family, built
  for slower swing speeds. Against the standard Ai Smoke it gives up two degrees of
  loft at the 7-iron — 30 against 28 — and takes back a quarter of an inch of length
  and a little more offset, 0.134 inches at the 7-iron against 0.110. The set runs
  4-iron through a 55-degree sand wedge, and Callaway builds it a full 39.75 inches at
  the 4-iron, which is long even for the category.
