faq:
  - q: "What lofts do the Callaway Quantum hybrids come in?"
    a: "The Quantum Max comes in 19, 21, 24, 27, 30 and 33 degrees; the Max OS in 18, 20, 23, 26, 29 and 32; and the Max Fast in 20, 22, 25, 28, 31 and 34 — all running from a 3-hybrid to an 8-hybrid."
  - q: "Are the Callaway Quantum hybrids adjustable?"
    a: "Yes — unlike the fairway line, every Quantum hybrid head carries the OptiFit 4 hosel, with seven loft and lie configurations and up to 2 degrees of upright or flat lie."
  - q: "What is the difference between the Quantum Max and Quantum Max OS hybrids?"
    a: "The Max is the neutral mid-sized core head. The Max OS is noticeably larger — 130 cc against 105 cc at the lowest loft — with easier launch and a touch of draw bias, and each club number sits about one degree stronger."
  - q: "What replaced the Callaway Elyte hybrids?"
    a: "These — the Quantum hybrids replaced the Elyte hybrids at retail on 13 February 2026."
