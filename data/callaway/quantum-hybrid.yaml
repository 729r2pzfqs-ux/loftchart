description: >
  The Quantum hybrids reached retail on 13 February 2026 alongside the
  Quantum fairway woods, replacing the Elyte hybrids. All three models carry
  the tungsten Speed Wave 2.0 weight low and forward, the new Step Sole and
  the multi-cog OptiFit 4 hosel on every head — a deeper adjustable range
  than the fairways, where only the low lofts are sleeved. The core Quantum
  Max is the neutral all-rounder in six lofts from 19° to 33°, the Quantum
  Max OS is the oversized easy-launch head sold one degree stronger at each
  club number, and the Quantum Max Fast is the ultralight build for moderate
  swing speeds, one degree weaker at each number.
variants:
  - name: Quantum Max
    description: >
      The neutral core hybrid in six lofts from 19° to 33°, with head sizes
      stepping from 105 cc down to 86 cc and the OptiFit 4 hosel on every
      head.
  - name: Quantum Max OS
    description: >
      The oversized, draw-friendly, easy-launch head — 130 cc at the 18°
      3-hybrid — sold about one degree stronger than the core Max at each
      club number. The 3-, 4- and 5-hybrids come in both hands; the rest are
      right-hand only.
  - name: Quantum Max Fast
    description: >
      The lightest Quantum hybrid, built for moderate swing speeds with a
      40 g class Vanquish shaft, sold about one degree weaker than the core
      Max at each club number. Right-hand only.
