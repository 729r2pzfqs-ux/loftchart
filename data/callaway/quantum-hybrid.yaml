hosel:
  system: "OptiFit 4"
  loft_range: "7 loft/lie configurations"
  notes: >
    Every Quantum hybrid head carries the new multi-cog OptiFit 4 hosel: two
    rotating cogs, each with +, − and neutral settings, give seven unique
    loft and lie configurations with independent loft and lie movement and
    up to 2° of upright or flat lie. Callaway publishes the system as +/−
    markings rather than a degree-by-degree chart, so no settings table is
    reproduced here. The stated lies are measured at the neutral setting.
