description: >
  The Diablo Forged is Callaway's 2009 forged distance iron, an unusual
  pairing for its day: a forged carbon steel head configured with a lower,
  deeper centre of gravity and a penetrating trajectory for more distance
  than a conventional forged players iron. The lofts foreshadow the modern
  players-distance formula — a 31 degree 7-iron and 45 degree pitching wedge,
  a full two clubs stronger than the X-Forged of the same season — with
  half-degree steps at the top of the set and a 40 degree 9-iron. Steel
  lengths are recorded here; the graphite build is a quarter inch longer.
