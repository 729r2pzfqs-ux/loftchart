faq:
  - q: "What is the loft of a Callaway Diablo Forged 7-iron?"
    a: "The Callaway Diablo Forged 7-iron has a loft of 31 degrees, a lie of 62 degrees and a 37 inch steel-shaft length."
  - q: "Are the Callaway Diablo Forged irons blades?"
    a: "No. They are forged from carbon steel but configured for distance, with a low, deep centre of gravity and lofts about two clubs stronger than Callaway's X-Forged of the same year."
  - q: "When were Callaway Diablo Forged irons made?"
    a: "They were introduced in 2009 as part of the Diablo family and left the line in 2011, when Callaway's RAZR X range arrived."
