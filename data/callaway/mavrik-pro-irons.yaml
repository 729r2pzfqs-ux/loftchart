description: >
  The Mavrik Pro is the compact model of Callaway's 2020 Mavrik family, announced in
  January 2020 with retail from 6 February. It carries the same A.I.-designed Flash Face
  Cup, Tungsten Energy Core and urethane microspheres as the standard Mavrik, but in a
  shorter blade with a thinner sole and less offset, and on much weaker lofts — a 30.5
  degree 7-iron and a 43 degree pitching wedge against the standard model's 27 and 41.
  Heads ran from a 3-iron to a 48 degree A-wedge, with 4-PW the stock set. Specs below
  are the standard men's steel-shaft numbers.
