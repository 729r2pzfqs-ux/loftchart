faq:
  - q: "What is the loft of a Callaway Mavrik Pro 7-iron?"
    a: "The Callaway Mavrik Pro 7-iron has a loft of 30.5 degrees, a lie of 62.0 degrees and a length of 37 inches."
  - q: "Why are the Mavrik Pro lofts weaker than the standard Mavrik?"
    a: "Because the standard Mavrik was the distance set in the family, at 27 degrees in the 7-iron. The Pro targets players who generate their own launch and spin, so it uses more traditional lofts — a 30.5 degree 7-iron and a 43 degree pitching wedge — in a shorter, thinner-soled head with less offset."
  - q: "When were the Callaway Mavrik Pro irons released?"
    a: "Callaway announced the Mavrik family in January 2020, with pre-orders from 14 January and retail from 6 February 2020."
