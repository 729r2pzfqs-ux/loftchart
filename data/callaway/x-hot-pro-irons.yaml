description: >
  The X Hot Pro is the compact, better-player version of the X Hot, sold alongside the
  standard model from early 2013. Instead of the standard head's deep undercut cavity it
  uses what Callaway called a J frame — a single piece of steel with the undercut only in
  the sole, stiffening the top of the face while letting the bottom flex — plus a face
  with 21 closely spaced grooves for more spin from the rough. Lofts are around one degree
  weaker than the standard X Hot through the scoring clubs, with a 31 degree 7-iron and a
  45 degree pitching wedge, and heads ran from a 3-iron to a 50 degree A-wedge. Callaway
  announced the X Hot line on 17 December 2012 with retail from 25 January 2013, so the
  model is commonly known as the 2013 X Hot Pro even though the year below is the
  announcement year per this database's convention. Specs below are the standard men's
  steel-shaft numbers.
