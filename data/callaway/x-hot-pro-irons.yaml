faq:
  - q: "What is the loft of a Callaway X Hot Pro 7-iron?"
    a: "The Callaway X Hot Pro 7-iron has a loft of 31 degrees, a lie of 62.0 degrees and a length of 37 inches."
  - q: "What is the difference between the Callaway X Hot and the X Hot Pro?"
    a: "The X Hot Pro is a smaller head with lofts around one degree weaker — a 31 degree 7-iron against 30, and a 45 degree pitching wedge against 44. It also swaps the deep undercut cavity for a stiffer J frame construction and comes stock with a heavier Project X 95 Flighted shaft."
  - q: "What year are Callaway X Hot Pro irons?"
    a: "Callaway announced the X Hot line on 17 December 2012 and it reached retail on 25 January 2013, which is why the X Hot Pro is usually called a 2013 model."
