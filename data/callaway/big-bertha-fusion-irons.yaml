faq:
  - q: "What is the loft of a Callaway Big Bertha Fusion 7-iron?"
    a: "The Big Bertha Fusion 7-iron has a loft of 33 degrees, with a 62.5 degree lie and a 37 inch standard length."
  - q: "What made the Big Bertha Fusion irons different from other Callaway irons?"
    a: "They used Fusion multi-material construction — a titanium face cup bonded to a body with tungsten weighting and a polymer core — instead of a one-piece cast stainless head, pushing far more weight to the perimeter."
  - q: "What is the pitching wedge loft on the Big Bertha Fusion irons?"
    a: "The Fusion pitching wedge is 46 degrees, followed by a 51 degree approach wedge, 56 degree sand wedge and 60 degree lob wedge."
