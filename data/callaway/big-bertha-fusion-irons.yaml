description: >
  The Big Bertha Fusion irons of 2004 brought the multi-material Fusion
  Technology of Callaway's FT drivers into an iron, bonding a thin titanium
  face cup to a body with tungsten weighting and a polymer core to push
  weight to the extreme perimeter. They were marketed as some of the most
  forgiving irons Callaway had built and sat above the steel Big Bertha
  line in the range. Lofts are traditional with a 33 degree 7-iron and a
  46 degree pitching wedge; the sources publish a single standard length
  ladder without labelling the shaft material.
