description: >
  The Apex MB is the blade of the Apex range Callaway announced in 2023 and sold as
  its 2024 line, forged in one piece from 1025 carbon steel. It shares the Apex CB's
  loft, lie and length chart exactly — a 34-degree 7-iron at 62.0 lie and 37 inches —
  and separates itself on offset alone, carrying about a third less at every club:
  1.5 mm at the 7-iron against the CB's 2.3. The stock set is 4-PW.
