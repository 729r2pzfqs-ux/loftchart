faq:
  - q: "What is the loft of a Callaway Apex MB 7-iron?"
    a: "The Callaway Apex MB 7-iron has a loft of 34 degrees, a lie of 62.0 degrees and a length of 37.0 inches."
  - q: "What is the difference between the Callaway Apex MB and Apex CB?"
    a: "Loft, lie and length are identical club for club. The MB is a one-piece muscle back with roughly a third less offset — 1.5 mm at the 7-iron against the CB's 2.3 — and no cavity behind the face."
  - q: "Is the Apex MB a 2023 or a 2024 model?"
    a: "Both, depending on how you count. Callaway announced the Apex range in 2023 and sold it as the 2024 line, so retailers list it as the Apex MB 24."
