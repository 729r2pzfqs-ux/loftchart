faq:
  - q: "What is the loft of a Callaway Apex Ai200 7-iron?"
    a: "The Callaway Apex Ai200 7-iron has a loft of 30 degrees, a lie of 62.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "What is the difference between the Callaway Apex Ai200 and Apex Ai300?"
    a: "Both were announced together in August 2024 and share the Forged 455 Face Cup and Ai Smart Face. The Ai200 is the players-distance model, a forged hollow body with less offset and lofts about a degree stronger (30-degree 7-iron against 29). The Ai300 is a larger forged cavity back aimed at game improvement, with more offset and slightly longer shafts in the mid irons."
  - q: "When did the Callaway Apex Ai200 irons come out?"
    a: "Callaway announced them on 12 August 2024, with retail from 23 August 2024."
