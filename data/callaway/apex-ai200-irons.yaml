description: >
  The Apex Ai200 is the players-distance model in the Apex Ai pair Callaway announced on
  12 August 2024 alongside the game-improvement Apex Ai300 and the limited Apex Ti Fusion,
  with retail from 23 August 2024 at 1,400 dollars for a seven-piece set. It is a forged
  hollow-body iron with a Forged 455 Face Cup, an Ai Smart Face designed from golfer swing
  data, urethane microspheres for sound and a MIM tungsten weight system. Lofts are three
  degrees stronger than the Apex Pro at the 7-iron, 30 degrees against 33, with a 43-degree
  pitching wedge, and the spec chart runs from the 4-iron to a 48-degree approach wedge on a
  traditional half-inch length progression. The Ai300 shares the face cup but is a larger
  forged cavity back with noticeably more offset. Figures are the men's standard steel
  build; swing weight and bounce were not published and are omitted.
