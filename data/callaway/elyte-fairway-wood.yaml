hosel:
  system: "OptiFit hosel (3-wood and 3HL heads)"
  loft_range: "−1° to +2°"
  positions: 8
  lie_effect: >
    The lie cog has two positions: N (neutral, the stated lie) and D (draw, a
    more upright lie — Callaway does not publish the degree change).
  face_note: >
    Changing loft re-orients the head on the shaft, so lower settings sit
    slightly open and higher settings slightly closed at address.
  notes: >
    Callaway's spec sheet marks only the 15° and 16.5° heads of the Elyte,
    Elyte X and Triple Diamond as adjustable; every other loft, and the whole
    Max Fast fairway line, is bonded. The two-cog OptiFit design is the same
    one used on the Elyte drivers.
