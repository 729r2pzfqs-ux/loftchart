description: >
  The Elyte fairway woods launched in early 2025 with the Elyte drivers,
  built around a tungsten "Speed Wave" weight set low and forward to protect
  ball speed on low-face strikes. The core Elyte runs a seven-loft ladder
  from a 15° 3-wood to a 27° 11-wood, including Callaway's 20° Heavenwood;
  the Elyte X is the larger, higher-launching forgiveness head; the Triple
  Diamond is the compact low-spin tour head with flatter lies; and the Max
  Fast is the lightweight build for moderate swing speeds. The Quantum
  fairways replaced the line in 2026.
variants:
  - name: Elyte
    description: >
      The core head for most players, in seven lofts from 169 cc (3-wood)
      down to 123 cc (11-wood), including the 20° Heavenwood. The 3-wood and
      3HL carry the OptiFit hosel; the rest are bonded. The 3HL, Heavenwood,
      9-wood and 11-wood are right-hand only.
  - name: Elyte X
    description: >
      The larger, more upright-lied forgiveness head — 175 cc in the 3-wood —
      with a higher flight and a touch of draw bias. Four lofts; the 3HL and
      7-wood are right-hand only.
  - name: Elyte Triple Diamond
    description: >
      The compact tour head with flatter 55-56° lies and a neutral-to-fade
      bias, in three lofts; the adjustable 15° 3-wood is 169 cc and the
      7-wood is right-hand only.
  - name: Elyte Max Fast
    description: >
      The lightweight build for moderate swing speeds — lighter head, 40 g
      class Vanquish 4 shaft and lighter grip — in four bonded lofts with
      more upright lies; the 22° and 25° heads are right-hand only.
