faq:
  - q: "What lofts do the Callaway Elyte fairway woods come in?"
    a: "The core Elyte comes in 15, 16.5, 18, 20 (Heavenwood), 21, 24 and 27 degrees; the Elyte X in 15, 16.5, 18 and 21; the Triple Diamond in 15, 18 and 21; and the Max Fast in 16, 19, 22 and 25."
  - q: "Is the Callaway Elyte fairway wood adjustable?"
    a: "Only the 15 degree 3-woods and 16.5 degree 3HL heads carry the OptiFit hosel (minus 1 to plus 2 degrees with a neutral or draw lie cog). Every other loft, and the whole Max Fast line, is bonded."
  - q: "What is the Callaway Heavenwood?"
    a: "The 20 degree, 43 inch head in the core Elyte line — Callaway's long-running name for a high-launch 7-wood-loft club built to 4-wood length, designed as an easy long-iron replacement."
