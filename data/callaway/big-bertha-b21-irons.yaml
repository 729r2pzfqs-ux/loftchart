description: >
  The Big Bertha B21 revived the Big Bertha iron name for golfers who want maximum help,
  announced on 18 August 2020 with the matching B21 driver, fairway woods and hybrids and
  at retail from 10 September 2020 at 899.99 dollars for a seven-piece steel set. It was
  the first Big Bertha iron designed with artificial intelligence: each head carries its
  own A.I.-designed Flash Face Cup, backed by a Visible Tungsten Energy Core for launch
  and urethane microspheres for sound. The shaping is extreme even by game-improvement
  standards — soles up to 50 percent wider than the Mavrik Max in parts of the set, one of
  the longest blade lengths Callaway had produced, and around 8 mm of offset in the
  4-iron. Lofts are strong for the era of its launch, a 29-degree 7-iron and a 43-degree
  pitching wedge, and the chart runs from the 4-iron to a 60-degree lob wedge, the lob
  wedge right hand only. The Big Bertha irons announced in 2023 replaced it, dialling much
  of the offset back out. Figures are the men's standard steel build; swing weight is
  published only as a combined D0/D1 range and is omitted per club.
