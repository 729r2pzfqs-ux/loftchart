faq:
  - q: "What is the loft of a Callaway Big Bertha B21 7-iron?"
    a: "The Callaway Big Bertha B21 7-iron has a loft of 29 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.00 inches."
  - q: "When did the Callaway Big Bertha B21 irons come out?"
    a: "Callaway announced the B21 family on 18 August 2020, and the irons reached retail on 10 September 2020."
  - q: "Are the Callaway Big Bertha B21 irons forgiving?"
    a: "They are Callaway's maximum-forgiveness design of that generation: soles up to 50 percent wider than the Mavrik Max in parts of the set, one of Callaway's longest blade lengths, about 8 mm of offset in the 4-iron, and tungsten weighting for easy launch."
  - q: "What clubs come in a Big Bertha B21 set?"
    a: "The chart runs from the 4-iron to a 60-degree lob wedge — 4-PW plus approach, sand and lob wedges — with the lob wedge right hand only. The standard retail set was seven pieces."
