sources:
  - "Callaway Golf Pre-Owned Big Bertha B21 product page (callawaygolfpreowned.com/iron-sets/irons-2021-big-bertha-b21.html) — Callaway's own listing of the full specification table: loft, lie, length and offset (in millimetres) for the 4-iron through lob wedge. Offset is converted to inches here; the millimetre figures resolve to round hundredths of an inch (e.g. 8.13 mm = 0.320 in)."
  - "Archived callawaygolf.com Big Bertha B21 irons product page, 26 September 2020 capture via archive.org (web.archive.org/web/20200926052414/https://www.callawaygolf.com/golf-clubs/iron-sets/irons-2021-big-bertha-b21.html) — corroborates the wedge lofts (PW 43, AW 48, SW 54, LW 60) in the embedded product metadata, shows the lob wedge offered right hand only, and lists the stock options: KBS Max CT80 steel (80g class), Callaway RCH graphite (regular, light and stiff flexes) and the Golf Pride Tour Velvet 360 Soft grip"
  - "Callaway Golf press release, 18 August 2020, 'Callaway Golf Announces New Big Bertha B-21 Family Of Woods And Irons' (PR Newswire) — the announcement date used for year_introduced, the first A.I.-designed Big Bertha iron claim, the Flash Face Cup, Visible Tungsten Energy Core and sole widths up to 50 percent wider; The Hackers Paradise launch coverage corroborates the 4-iron (19 degrees) through lob wedge set composition, the 10 September 2020 retail date, the 899.99/999.99-dollar steel/graphite pricing and the KBS Max CT80 and Callaway RCH 55/65/75 stock shafts"
  - "year_discontinued is 2023, when Callaway announced the next Big Bertha irons on 18 April 2023 (retail 26 May 2023); that model kept an offset ladder essentially identical to the B21's while strengthening the lofts by about a degree per club. Swing weight is shown by Callaway only as D0/D1 without a per-club or per-shaft breakdown, so it is omitted rather than guessed."
