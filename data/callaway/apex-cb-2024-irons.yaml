description: >
  Announced in 2023 and sold as the '24 model, the Apex CB is the forged tour
  cavity back in Callaway's Apex line, sitting between the Apex MB blade and
  the hollow-bodied Apex Pro. It is a compact 1025 carbon steel forging with a
  thin sole and tungsten weighting, and its lofts are traditional: 34 degrees
  at the 7-iron and 46 at the pitching wedge, four degrees weaker than the Apex
  Pro of the same generation. Figures are the men's standard steel build.
