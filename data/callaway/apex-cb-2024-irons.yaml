faq:
  - q: "What is the loft of a Callaway Apex CB 7-iron?"
    a: "The Callaway Apex CB '24 7-iron has a loft of 34 degrees, a lie of 62.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "Is there a Callaway Apex 23?"
    a: "No. Callaway announced the Apex Pro, Apex CB and Apex MB in 2023 and sold them as the '24 models; there is no iron in the range badged Apex 23."
  - q: "What is the difference between the Apex CB and the Apex Pro?"
    a: "The CB is a solid forged cavity back with traditional lofts — 34 degrees at the 7-iron. The Apex Pro is a hollow-bodied players-distance iron whose 7-iron is 33 degrees with a faster face."
  - q: "What is the pitching wedge loft on the Callaway Apex CB?"
    a: "46 degrees, with a 50-degree approach wedge below it."
