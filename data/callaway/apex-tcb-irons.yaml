faq:
  - q: "What is the loft of a Callaway Apex TCB 7-iron?"
    a: "The Callaway Apex TCB 7-iron has a loft of 34 degrees, a lie of 62.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "When did the Callaway Apex TCB come out?"
    a: "Callaway unveiled it on 12 January 2021 with the Apex 21 range, after prototypes appeared on tour in late 2020. It reached retail on 11 February 2021, sold custom-fit only."
  - q: "Which tour players used the Callaway Apex TCB?"
    a: "Jon Rahm won the 2021 U.S. Open with it, and Xander Schauffele played the TCB for years — Callaway later released a limited run of his raw-finish version."
  - q: "What replaced the Callaway Apex TCB?"
    a: "The Apex CB, announced in 2023 as the forged cavity back of Callaway's '24 tour range alongside the Apex Pro and Apex MB."
