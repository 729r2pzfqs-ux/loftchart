description: >
  The Apex TCB — Tour Cavity Back — is the tour-inspired players cavity back Callaway
  built for its staff professionals, slotting between the Apex MB blade and the Apex Pro.
  Prototypes were on tour from late 2020, and Callaway unveiled it publicly on 12 January
  2021 with the Apex 21 range, selling it custom-fit only from 11 February 2021 in 3-iron
  through pitching wedge with an approach wedge available. The head is a forged 1025 mild
  carbon steel body with metal-injection-moulded tungsten weighting, and lofts are
  traditional: a 34-degree 7-iron and a 46-degree pitching wedge, with very little offset
  in the scoring clubs. Jon Rahm won the 2021 U.S. Open with the TCB and Xander Schauffele
  played it for years afterwards. It left the line when the Apex CB was announced in 2023
  as the cavity back of the '24 Apex tour range. Figures are the men's standard steel
  build; bounce and swing weight were not published and are omitted.
