description: >
  The Elyte X is the higher-launching, more forgiving model in Callaway's 2025 Elyte
  iron family, sitting above the standard Elyte with lofts a degree stronger — a
  28-degree 7-iron and a 41-degree pitching wedge against the Elyte's 29 and 42 —
  and noticeably more offset at 5.6 mm in the 4-iron against 4.2. It uses the same
  Speed Frame construction, which connects the body to the topline so the body stays
  stiff while the face flexes, and the Ai 10x face, built from ten times as many
  control points as the Ai Smart Face before it, plus a tri-sole design with three
  distinct sections for turf interaction. The chart runs from the 4-iron to a
  54-degree sand wedge on the same lie and length progression as the standard Elyte.
  The line lasted a single season: Callaway's Quantum irons replaced the Elyte
  family in January 2026, with the oversized Quantum Max OS taking over the Elyte
  X's slot. Figures are the men's standard steel build.
