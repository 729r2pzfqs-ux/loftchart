faq:
  - q: "What is the loft of a Callaway Elyte X 7-iron?"
    a: "The Callaway Elyte X 7-iron has a loft of 28 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.25 inches."
  - q: "What is the difference between the Callaway Elyte and Elyte X irons?"
    a: "The Elyte X is the more forgiving model: its lofts are one degree stronger through the set (28-degree 7-iron against 29), it carries noticeably more offset (5.6 mm at the 4-iron against 4.2), and it adds a tri-sole design, while lie angles and lengths are identical. The stock steel shaft is also lighter, a Vector 80 against the Elyte's Vector 90."
  - q: "Are the Callaway Elyte X irons discontinued?"
    a: "Yes. The Elyte family lasted one season; Callaway's Quantum iron line replaced it in January 2026, with the oversized Quantum Max OS covering the Elyte X's slot."
