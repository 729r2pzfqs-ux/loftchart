faq:
  - q: "What is the loft of a Callaway Apex MB (2018) 7-iron?"
    a: "The 2018 Callaway Apex MB 7-iron has a loft of 34 degrees, a lie of 62.0 degrees and a length of 37 inches."
  - q: "When were the 2018 Callaway Apex MB irons released?"
    a: "Callaway announced them in October 2017 with US sales from 3 November 2017 and UK retail from 26 January 2018, launched alongside the 2018 X Forged cavity back and sold largely through Callaway's custom order program."
  - q: "What is the difference between the Apex MB (2018) and the Apex MB 21?"
    a: "The 2018 model is a plain one-piece 1025 forging with a 47 degree pitching wedge and a 2-iron in the range. The Apex MB 21 that replaced it added a removable tungsten swing-weight screw, a brushed finish, and a slightly weaker 46 degree pitching wedge, with the range starting at the 3-iron."
  - q: "Did the 2018 Callaway Apex MB come in a 2-iron?"
    a: "Yes. Heads ran from an 18 degree 2-iron through a 51 degree A-wedge, unusually deep for a modern blade, though most sets were sold 3-PW or 4-PW."
