description: >
  The 2018 Apex MB is the muscleback that brought the Apex name to Callaway's tour blade,
  announced in October 2017 with US sales from 3 November alongside the 2018 X Forged
  cavity back, and sold largely through custom order — a 2017 launch catalogued as the
  2018 model, so the year below is the announcement year per this database's convention. It is forged from 1025 carbon steel with 20V grooves, in what was
  Callaway's smallest blade head of recent years, with a thin sole and a crisp leading
  edge. Lofts are traditional — a 34 degree 7-iron and a 47 degree pitching wedge — and
  heads ran unusually deep, from a 2-iron through a 51 degree A-wedge, with 3-PW and 4-PW
  the common set makeups. Specs below are the standard men's steel-shaft numbers.
