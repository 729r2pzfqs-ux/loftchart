sources:
  - "Callaway Golf Pre-Owned Apex MB 18 product specs (callawaygolfpreowned.com/iron-sets/irons-2018-apex-mb.html) — loft, lie, length, offset and swingweight for the 2-iron through A-wedge, plus the 1025 carbon steel forging and 20V grooves"
  - "Driving Range Heroes 'Callaway 2018 Apex MB Irons Review' — independently matches the Callaway table on every loft, lie and length from the 2-iron through the A-wedge, and confirms the 2-PW plus AW head range and the 1025 forging"
  - "GolfWRX 'Callaway (finally) launches new Apex MB and X Forged irons' (first archived 20 October 2017) — October 2017 announcement, US on-sale date of 3 November 2017 and $1,299.99 pricing; Golf Monthly's launch coverage gives 26 January 2018 for UK retail. year_introduced is 2017 on this database's announcement-year convention, though the model is catalogued and marketed as the 2018 Apex MB."
  - "Note on stock shafts: MyGolfSpy's 2018 first look describes the model as sold through Callaway's custom program with Project X (PX, LZ, PXi) among the offered shafts, and period retail listings (GolfClubs4Cash, eBay) consistently show Project X 6.0/6.5 builds — Project X steel is recorded as the standard build with no flex range asserted."
  - "Note: bounce was not published in the sources consulted and is omitted rather than estimated. year_discontinued is 2020, the year the successor Apex MB 21 was announced (13 October 2020)."
