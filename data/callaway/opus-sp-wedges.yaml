description: >
  The Opus SP is the 2025 generation of Callaway's Opus wedge line, announced
  in early August 2025 with US retail from 12 September. The SP stands for
  Spin Pocket — a hollow cavity under the lower face, carried in the 54 to 60
  degree heads, that raises the centre of gravity for a lower, spinnier
  flight — paired with a forged 1025 face plate on a cast 8620 body and the
  Spin Gen 2.0 face with 17-degree groove angle and tighter pitch. The
  matrix runs 24 loft/bounce/grind combinations from 48 to 64 degrees across
  five grinds, including the X grind returned from the Jaws Raw era. The
  Opus SP+ joined the line in 2026 as a high-loft extension rather than a
  replacement. Club lengths are omitted here because published retailer
  charts disagree on the measuring basis.
grinds:
  - code: T
    name: T Grind
    description: >
      Tour-inspired for precise shotmaking — the lowest bounce in the line at
      5 to 6 degrees, for skilled players, firm turf and shallow attack
      angles. The only grind at 62 and 64 degrees.
  - code: C
    name: C Grind
    description: >
      Low-to-mid bounce at 8 degrees with heel and toe relief for maximum
      short-game versatility and shotmaking.
  - code: S
    name: S Grind
    description: >
      The standard mid-bounce full-swing grind at 10 degrees, offered at
      every loft from 48 to 60 — for square-face players and a wide variety
      of swings.
  - code: W
    name: W Grind
    description: >
      Ultra-wide sole with the highest bounce in the line at 12 to 14
      degrees — maximum forgiveness for steep swings and soft conditions.
  - code: X
    name: X Grind
    description: >
      A very narrow sole with extreme heel, toe and trailing-edge relief at
      12 degrees of bounce — versatility with bounce for steeper swingers in
      soft conditions, returned from the 2022 Jaws Raw.
