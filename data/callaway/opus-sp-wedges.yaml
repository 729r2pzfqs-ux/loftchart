faq:
  - q: "What lofts does the Callaway Opus SP come in?"
    a: "The Opus SP is sold from 48 to 64 degrees — 24 loft, bounce and grind combinations, with the 62 and 64 degree heads offered only in the low-bounce T grind."
  - q: "What grinds does the Callaway Opus SP offer?"
    a: "Five: T (5-6 degrees of bounce, 58-64), C (8 degrees, 56-60), S (10 degrees, every loft 48-60), X (12 degrees, 54-60) and W (12-14 degrees, 50-60)."
  - q: "What does SP stand for in Callaway Opus SP?"
    a: "Spin Pocket — a hollow cavity under the lower face of the 54 to 60 degree heads that raises the centre of gravity for a lower, more spinning flight."
  - q: "Did the Opus SP+ replace the Opus SP?"
    a: "No. Callaway positions the 2026 Opus SP+ as an extension of the line — a tungsten-weighted specialist at 54 to 60 degrees — and the Opus SP remains in the current catalogue alongside it."
