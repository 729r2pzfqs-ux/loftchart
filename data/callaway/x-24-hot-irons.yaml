faq:
  - q: "What is the loft of a Callaway X-24 Hot 7-iron?"
    a: "The Callaway X-24 Hot 7-iron has a loft of 31 degrees, with a 62 degree lie and a 37 inch standard steel length."
  - q: "What is the loft of a Callaway X-24 Hot pitching wedge?"
    a: "The X-24 Hot pitching wedge is 45 degrees, with a 50 degree A-wedge and a 55 degree sand wedge."
  - q: "Does the Callaway X-24 Hot come in a 3-iron?"
    a: "No. Callaway's published chart runs from the 22 degree 4-iron to the 55 degree sand wedge, and the set was sold 4-SW."
  - q: "How do X-24 Hot lofts compare with the X-22?"
    a: "The X-24 Hot is two degrees stronger at the 7-iron — 31 degrees against the X-22's 33 — while both sets share a 45 degree pitching wedge, so the strengthening is concentrated in the middle irons."
