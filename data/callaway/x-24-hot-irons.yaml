description: >
  The X-24 Hot followed the X-22 as the game-improvement iron in Callaway's long-running
  X-Series, announced on 4 May 2010 and at retail from 28 May 2010. The face uses
  Callaway's VFT technology and thins progressively from sole to topline to lower the
  centre of gravity, over a 360-degree undercut channel, and the head carries a
  dark Stealth PVD finish. Callaway pitched it as the longest X-Series iron to date,
  with a 31 degree 7-iron and a 45 degree pitching wedge in a 4-SW set. Specs below
  are the standard men's steel-shaft numbers; the graphite build is a quarter inch
  longer at every club and swingweighted lighter.
