faq:
  - q: "What is the loft of a Callaway Rogue ST Max OS Lite 7-iron?"
    a: "The Callaway Rogue ST Max OS Lite 7-iron has a loft of 31.5 degrees, with a 62.5 degree lie and a 37 inch standard length."
  - q: "What is the difference between the Rogue ST Max OS and the Max OS Lite?"
    a: "The Lite uses the same oversized head shape but in a lighter overall build for moderate swing speeds: light Project X Cypher graphite shafts, a D0 swing weight and lofts three degrees weaker through most of the set — a 31.5 degree 7-iron against the Max OS's 28.5."
  - q: "Who are the Callaway Rogue ST Max OS Lite irons for?"
    a: "Callaway aimed them at players with moderate swing speeds who want maximum forgiveness and help getting the ball airborne, which is why the set combines the oversized Max OS head with lighter shafts and weaker lofts."
  - q: "When were the Callaway Rogue ST Max OS Lite irons released?"
    a: "Callaway unveiled the Rogue ST line in January 2022, with pre-orders from 22 January and retail from 18 February 2022."
