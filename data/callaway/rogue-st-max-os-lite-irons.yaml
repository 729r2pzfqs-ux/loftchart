description: >
  The Rogue ST Max OS Lite is the lightweight member of Callaway's 2022 Rogue ST iron
  family, built for players with moderate swing speeds: it pairs the oversized Max OS
  head shape with lighter graphite shafts and a D0 swing weight. The head keeps the
  family's high-strength 450 stainless steel body, A.I.-designed Flash Face Cup,
  high-density tungsten weighting and urethane microspheres, and lofts are three degrees
  weaker than the standard Max OS through most of the set — a 31.5 degree 7-iron against
  28.5 — to help flight the ball. The published range runs from a 4-iron to a 56 degree
  sand wedge, with 4-PW the stock set. Specs below are the standard men's graphite-shaft
  numbers, as the model was sold as a graphite build.
