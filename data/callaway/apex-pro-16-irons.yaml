faq:
  - q: "What is the loft of a Callaway Apex Pro 16 7-iron?"
    a: "The Callaway Apex Pro 16 7-iron has a loft of 34 degrees, with a 62 degree lie and a 37 inch standard steel length."
  - q: "What is the loft of a Callaway Apex Pro 16 pitching wedge?"
    a: "The Apex Pro 16 pitching wedge is 46 degrees, with a 51 degree A-wedge below it."
  - q: "How do Apex Pro 16 lofts compare with the Apex CF16?"
    a: "The Pro is three degrees weaker at the 7-iron — 34 degrees against 31 — and one degree weaker at the pitching wedge, 46 degrees against 45."
  - q: "Are the Apex Pro 16 irons forged?"
    a: "Yes. The head is forged from 1025 mild carbon steel, with tungsten inserts in the 3 through 5 irons to raise launch in the long irons."
