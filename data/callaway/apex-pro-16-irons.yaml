description: >
  Announced in September 2015 for the 2016 model year alongside the Apex CF16, the
  Apex Pro 16 is the compact players iron of the second Apex generation. The head is
  forged from 1025 mild carbon steel, with tungsten inserts in the 3 through 5 irons
  to raise launch while the short irons keep a higher centre of gravity for control —
  Callaway's progressive CG design. Lofts are a degree weaker than the original Apex
  Pro through most of the set, with a 34 degree 7-iron and a 46 degree pitching wedge.
  Specs below are the standard men's steel-shaft numbers.
