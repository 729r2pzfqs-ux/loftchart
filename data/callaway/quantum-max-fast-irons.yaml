faq:
  - q: "What is the loft of a Callaway Quantum Max Fast 7-iron?"
    a: "The Callaway Quantum Max Fast 7-iron has a loft of 28 degrees, a lie of 62 degrees and a length of 37.5 inches — one degree stronger and a quarter inch longer than the standard Quantum Max 7-iron."
  - q: "Who are the Callaway Quantum Max Fast irons for?"
    a: "Players with slower swing speeds. The set is graphite-only with a 40-gram Mitsubishi Vanquish stock shaft, built a quarter inch longer per club than the Quantum Max, with slightly stronger mid-iron lofts to help ball speed and launch."
  - q: "Do the Quantum Max Fast irons come in left handed?"
    a: "No — Callaway lists every head, 5-iron through the 56-degree sand wedge, as right hand only."
  - q: "What clubs come in a Callaway Quantum Max Fast set?"
    a: "The chart runs from the 5-iron to a 56-degree sand wedge, nine heads in total; there is no 4-iron."
