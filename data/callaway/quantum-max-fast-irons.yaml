sources:
  - "Callaway 2026 club spec chart PDF (callawaymedia.com/wp-content/uploads/2026/02/2026_Club-Spec-Charts_final.pdf), Quantum Max Fast Iron table — loft, lie, length, women's length and offset in millimetres for the 5-iron through sand wedge, all listed RH only. Offset is converted to inches here (7-iron 4.67 mm = 0.184 in); the AW, GW and SW share a published 2.06 mm offset."
  - "callawaygolf.com Quantum Max Fast Irons product page (https://www.callawaygolf.com/golf-clubs/irons/irons-2026-quantum-max-fast.html) — matching loft/lie/length/offset table, right-hand-only availability, the Mitsubishi Vanquish 40 IR/HYB graphite stock shaft (Light flex shown as the default configuration) and Lamkin Crossline 360 Black Cap (46g) grip, and the Modern 360° Undercut Cavity / Progressive Tri-Sole / Ai-optimized face / urethane microspheres technology copy."
