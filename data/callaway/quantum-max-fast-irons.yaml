description: >
  Quantum Max Fast is the lightweight model in Callaway's 2026 Quantum iron family,
  built for players with slower swing speeds who need help generating speed and
  launch. It shares the two-piece Modern 360° Undercut cavity, Progressive Tri-Sole
  and Ai-optimized face of the other Quantum irons, but is sold graphite-only and
  right hand only, with a 40-gram Mitsubishi Vanquish stock shaft and each club
  built a quarter inch longer than the standard Quantum Max. Lofts run slightly
  stronger through the middle of the set — 28 degrees at the 7-iron against the
  Max's 29 — before rejoining at the 37-degree 9-iron and 42-degree pitching wedge,
  and the gap wedge and sand wedge sit at 50 and 56 degrees rather than 51 and 55.
  The chart runs 5-iron through sand wedge with no 4-iron; Callaway also publishes
  a women's length column one inch shorter per club. Announced 16 January 2026, at
  US retail from 27 February 2026. The figures below are the standard men's build.
