description: >
  The 2002 Big Bertha irons revived the Big Bertha nameplate as Callaway's
  forgiving mainstream set alongside the Steelhead X-16, eight years after
  the original 1994 Big Bertha irons. The ladder is traditional — a 34 degree
  7-iron and 46 degree pitching wedge — on the upright Callaway lie plane of
  the era topping out at 65 degrees, and the pitching wedge runs a quarter
  inch longer than the X-16's at 35.75 inches. The catalogued range ran
  1-iron to lob wedge including a 50 degree W wedge, recorded here as AW.
