faq:
  - q: "What is the loft of a 2002 Callaway Big Bertha 7-iron?"
    a: "The 2002 Callaway Big Bertha 7-iron is 34 degrees, with a 62.5 degree lie and a 37 inch standard length."
  - q: "How do the 2002 Big Bertha lofts compare with the 1994 original?"
    a: "The 2002 set is a degree stronger through the middle — a 34 degree 7-iron against 33 — and its 42 degree 9-iron matches the original, with both topping out at upright 65 degree wedge lies."
  - q: "What wedges came with the 2002 Callaway Big Bertha irons?"
    a: "A 46 degree pitching wedge, a 50 degree W wedge (an approach wedge), a 54 degree sand wedge and a 58 degree lob wedge."
