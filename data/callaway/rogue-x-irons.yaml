description: >
  Rogue X is the distance model of Callaway's 2018 Rogue iron family, sold alongside
  the standard Rogue and the Rogue Pro from February 2018. It shares the 360 Face Cup
  with Variable Face Thickness, the tungsten weighting and the urethane microspheres
  of the standard model, but in a larger head with a deeper centre of gravity, a
  lighter overall build, longer shafts in the long irons and much stronger lofts —
  the 27 degree 7-iron is three degrees stronger than the standard Rogue's. The set
  was sold 4-SW, without the 3-iron and lob wedge of the standard model. Specs below
  are the standard men's steel-shaft numbers.
