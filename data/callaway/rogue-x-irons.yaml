faq:
  - q: "What is the loft of a Callaway Rogue X 7-iron?"
    a: "The Callaway Rogue X 7-iron has a loft of 27 degrees, with a 62.5 degree lie and a 37.125 inch standard steel length."
  - q: "What is the loft of a Callaway Rogue X pitching wedge?"
    a: "The Rogue X pitching wedge is 41 degrees, with a 46 degree A-wedge, a 51 degree gap wedge and a 56 degree sand wedge."
  - q: "How do the Rogue X lofts compare with the standard Callaway Rogue?"
    a: "They are much stronger. The Rogue X 7-iron is 27 degrees against 30 for the standard Rogue, and the pitching wedge is 41 degrees against 44, with the long irons also built to slightly longer lengths."
  - q: "Does the Callaway Rogue X come in a 3-iron?"
    a: "No. The Rogue X was sold 4-SW. Its 18.5 degree 4-iron carries roughly the loft of a traditional 2-iron, which is why the set starts there."
