description: >
  The Steelhead XR Pro is the compact, better-player addition to the Steelhead XR family,
  announced in January 2017 — a few months after the standard 2016 model — and at retail
  from March 2017. It keeps the family's next-generation 360 Face Cup, steel-infused
  polyurethane layer and hollow bore-through hosel in a smaller head with a thinner top
  line and a narrower sole, finished in non-glare black PVD. Lofts are around a degree
  weaker than the standard Steelhead XR, with a 31 degree 7-iron and a 45 degree pitching
  wedge, and heads ran from a 3-iron to a 50 degree A-wedge. Specs below are the standard
  men's steel-shaft numbers.
