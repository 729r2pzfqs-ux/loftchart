faq:
  - q: "What is the loft of a Callaway Steelhead XR Pro 7-iron?"
    a: "The Callaway Steelhead XR Pro 7-iron has a loft of 31 degrees, a lie of 62.0 degrees and a length of 37 inches."
  - q: "What is the difference between the Callaway Steelhead XR and the Steelhead XR Pro?"
    a: "The Pro is a more compact head with a thinner top line, a narrower sole and less offset, finished in black PVD, and its lofts are around a degree weaker — a 31 degree 7-iron against 30, and a 45 degree pitching wedge against 44."
  - q: "When were the Callaway Steelhead XR Pro irons released?"
    a: "Callaway announced them in January 2017, a few months after the standard 2016 Steelhead XR, and they reached retail on 17 March 2017."
