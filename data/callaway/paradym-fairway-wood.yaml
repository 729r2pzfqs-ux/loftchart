construction: 455 steel face cup on a steel body with carbon crown; forged titanium face on the Triple Diamond
material: C300 maraging steel face cups with Jailbreak batwing frame; tungsten speed cartridge in the Triple Diamond
predecessor: Callaway Rogue ST
successor: Callaway Paradym Ai Smoke
description: >
  The Paradym fairway woods launched in early 2023 with the Paradym drivers.
  The core Paradym runs a seven-loft ladder from the 15° 3-wood to a 27°
  11-wood, including the 20° Heavenwood, with an adjustable hosel on the
  3-wood and 3HL only; the Paradym X is the larger, more upright draw head in
  four lofts; and the Triple Diamond is the compact tour head, sold down to a
  13.5° 3+ wood with every loft adjustable. The Paradym Ai Smoke line
  replaced it in January 2024.
variants:
  - name: Paradym
    description: >
      The core head for most players in seven lofts, 171 cc (3-wood) down to
      133 cc (11-wood), including the 20° Heavenwood. The 3-wood and 3HL carry
      the OptiFit hosel; the rest are bonded. The 3HL, Heavenwood, 9-wood and
      11-wood are right-hand only.
  - name: Paradym X
    description: >
      The larger, more upright-lied head with a higher flight and draw bias —
      177 cc in the 3-wood. Four lofts; only the 3-wood is adjustable, and
      the 3HL and 7-wood are right-hand only.
  - name: Paradym Triple Diamond
    description: >
      The compact low-spin tour head with a deeper face, in three lofts
      including a 13.5° 3+ wood (right-hand only). All three are adjustable,
      at a heavier D4 swing weight with Kai'li White stock shafts.
