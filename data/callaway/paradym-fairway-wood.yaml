hosel:
  system: "OptiFit hosel (3-wood heads; all Triple Diamond lofts)"
  loft_range: "−1° to +2°"
  positions: 8
  lie_effect: >
    The lie cog has two positions: N (neutral, the stated lie) and D (draw, a
    more upright lie — Callaway does not publish the degree change).
  face_note: >
    Changing loft re-orients the head on the shaft, so lower settings sit
    slightly open and higher settings slightly closed at address.
  notes: >
    Callaway's spec sheet marks the core Paradym 3-wood and 3HL, the Paradym X
    3-wood, and every Triple Diamond loft as adjustable; the other lofts are
    bonded. The two-cog OptiFit design is the same one used on the Paradym
    drivers.
  settings:
    - { setting: "−1 / N", loft: "−1°", lie: "neutral" }
    - { setting: "−1 / D", loft: "−1°", lie: "draw (more upright)" }
