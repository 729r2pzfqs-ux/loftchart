faq:
  - q: "What lofts do the Callaway Paradym fairway woods come in?"
    a: "The core Paradym comes in 15, 16.5, 18, 20 (Heavenwood), 21, 24 and 27 degrees; the Paradym X in 15, 16.5, 18 and 21; and the Triple Diamond in 13.5, 15 and 18."
  - q: "Is the Callaway Paradym fairway wood adjustable?"
    a: "Partly. The core Paradym 3-wood and 3HL, the Paradym X 3-wood and every Triple Diamond loft carry the OptiFit hosel (minus 1 to plus 2 degrees with a neutral or draw lie cog); the other lofts are bonded."
  - q: "What is the Paradym 3+ wood?"
    a: "The 13.5 degree Triple Diamond head — a strong-lofted, deep-faced 3-wood built as a tee club for fast swings, right-hand only, playable down to 12.5 or up to 15.5 degrees through the hosel."
