faq:
  - q: "What is the loft of a Callaway X-16 Pro Series 7-iron?"
    a: "The Callaway X-16 Pro Series 7-iron is 34 degrees, with a 62.5 degree lie and a 37 inch standard steel length — the same published numbers as the standard X-16."
  - q: "What is the difference between the X-16 and the X-16 Pro Series?"
    a: "The Pro Series has a more compact, blade-like head with a thinner topline and less offset for better players. The published loft, lie and length ladder is identical to the standard X-16."
  - q: "Are Callaway X-16 Pro Series irons forgiving?"
    a: "Less so than the standard X-16 — the smaller head trades forgiveness for workability and a lower flight, which is why Callaway aimed the Pro Series at low-to-mid handicaps."
