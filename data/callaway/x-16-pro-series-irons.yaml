description: >
  The Steelhead X-16 Pro Series is the better-player version of the 2002
  X-16, with a more compact, blade-like head, a thinner topline and less
  offset for shot-shaping and a lower flight. Callaway kept the published
  ladder identical to the standard X-16 — the same 34 degree 7-iron, the same
  upright 65 degree wedge lies and the same lengths — so the differences are
  in the head, not the chart. The catalogued range ran 1-iron to lob wedge,
  with 3-PW the usual retail set on Constant Weight steel shafts.
