sources:
  - "callawaygolf.com Elyte HL Irons product page specification table (https://www.callawaygolf.com/golf-clubs/irons/irons-2025-elyte-hl.html, retrieved 29 September 2026) — loft, lie, length, offset (in millimetres) and swing weight for the 4-iron through sand wedge, all listed RH / LH, with the Project X Denali Charcoal 65 graphite as the default shaft. Offset is converted to inches here (mm / 25.4; 7-iron 3.3 mm = 0.130 in)."
  - "Callaway Europe Elyte HL Irons product page specification table (https://eu.callawaygolf.com/en/gb/golf-clubs/iron-sets/irons-2025-elyte-hl.html, retrieved 29 September 2026) — an identical loft, lie, length, offset and swing weight table, plus the shaft tables: KBS MAX 80 steel (Regular 86g, Stiff 90g) and Project X Denali Charcoal 55 / 65 / 75 graphite. The steel shaft is taken from the European page; the US page showed only the default graphite configuration."
  - "Note on swing weight: Callaway publishes 'D1/C9'. On the Paradym Ai Smoke HL page the same pair was labelled D1 for steel and C9 for graphite, and D1 is recorded here as the steel figure. Bounce is not published and is omitted rather than estimated."
  - "Callaway Golf press release, 2 January 2025, 'Callaway Golf Announces New Elyte Family of Woods and Irons' (https://callawaymedia.com/wp-content/uploads/2025/01/Elyte-Press-Release-January2.pdf) — the announcement date used for year_introduced, pre-orders from 17 January and iron retail from 7 February 2025, the four iron models (Standard, X, HL and Max Fast), and the Speed Frame, Ai 10x Face and tri-sole construction."
  - "Succession: Callaway announced the Quantum iron family on 16 January 2026 (https://callawaymedia.com/wp-content/uploads/2026/01/Quantum-Press-Release.pdf), so year_discontinued is 2026, as in the other Elyte files. Callaway's 2026 club spec chart (https://callawaymedia.com/wp-content/uploads/2026/02/2026_Club-Spec-Charts_final.pdf) lists three Quantum irons, Max, Max OS and Max Fast, with an 'HL' loft column on the Max and Max OS tables rather than a separate HL head, so successor is null."
  - "Status check, 29 September 2026: not a current model. Still sold by Callaway but marked 'Sale' at a reduced price on its US product page and 'Price Drop' on its European page, with the Quantum line listed as the new range (https://eu.callawaygolf.com/en/gb/golf-clubs/iron-sets/)."
