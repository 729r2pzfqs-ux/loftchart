faq:
  - q: "What is the loft of a Callaway Elyte HL 7-iron?"
    a: "The Callaway Elyte HL 7-iron has a loft of 30 degrees, a lie of 62.25 degrees and a length of 37.50 inches."
  - q: "What is the difference between the Callaway Elyte and Elyte HL?"
    a: "The HL is built to launch higher. It is a degree weaker at the 7-iron and pitching wedge, 30 and 43 degrees against 29 and 42, and a quarter of an inch longer at the 7-iron, 37.5 inches against 37.25."
  - q: "Are Elyte HL lofts the same as the Paradym Ai Smoke HL?"
    a: "From the 7-iron to the pitching wedge, yes: 30, 34, 38 and 43 degrees. The Elyte HL is a degree stronger in the 4-, 5- and 6-irons, at 20, 23 and 26 degrees, and a degree weaker in the three wedges below the pitching wedge, at 48, 52 and 56 degrees."
  - q: "Is there a Callaway Quantum HL iron?"
    a: "Not as a separate model. The Quantum irons that replaced the Elyte family in January 2026 come as Max, Max OS and Max Fast, and HL is an optional loft specification on the Max and Max OS."
