description: >
  HL is the high-launch head in Callaway's 2025 Elyte iron family, announced on
  2 January 2025 alongside the standard Elyte, Elyte X and Elyte Max Fast, and
  follows the Paradym Ai Smoke HL. It is a degree weaker than the standard
  Elyte at the 7-iron and pitching wedge, 30 and 43 degrees against 29 and 42,
  and a quarter of an inch longer at 37.5 inches in the 7-iron. The set runs
  from the 4-iron to a 56-degree sand wedge. Callaway replaced the Elyte family
  with the Quantum irons in January 2026; there is no separate HL model in that
  line, where HL became an optional loft specification on the Quantum Max and
  Quantum Max OS. Figures are the men's standard build, with the steel swing
  weight.
