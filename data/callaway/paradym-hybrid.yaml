category: flagship
construction: steel body with carbon crown and Jailbreak batwing frame; Cutwave sole for turf interaction
material: forged 455 face cup
predecessor: Callaway Rogue ST
successor: Callaway Paradym Ai Smoke
description: >
  The Paradym hybrids launched in early 2023 with the Paradym woods, both
  carrying Callaway's +2°/−1° adjustable hosel — unusual at the time, when
  most hybrid lines were bonded. The core Paradym is the mid-sized head in
  four lofts at D2; the Paradym X is slightly larger and runs a loft deeper
  to a 30° 7-hybrid at a lighter D1, with a higher, more draw-biased flight.
  The Paradym Ai Smoke line replaced it in January 2024.
variants:
  - name: Paradym
    description: >
      The core hybrid in four lofts at a D2 swing weight; the 27° head is
      right-hand only.
  - name: Paradym X
    description: >
      The larger, higher-launching head in five lofts at D1, with the 27° and
      30° heads right-hand only.
