faq:
  - q: "What lofts do the Callaway Paradym hybrids come in?"
    a: "The core Paradym comes in 18, 21, 24 and 27 degrees; the Paradym X in 18, 21, 24, 27 and 30."
  - q: "Are the Callaway Paradym hybrids adjustable?"
    a: "Yes — every loft in both heads carries the OptiFit hosel, with minus 1 to plus 2 degrees of loft and a neutral or draw lie cog."
  - q: "What is the difference between the Paradym and Paradym X hybrids?"
    a: "Same lofts at the strong end, different character: the X is slightly larger, launches higher with more draw bias, builds to a lighter D1 swing weight and adds a 30 degree 7-hybrid the core head does not offer."
