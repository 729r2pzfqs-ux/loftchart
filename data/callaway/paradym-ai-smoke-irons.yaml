faq:
  - q: "What is the loft of a Callaway Paradym Ai Smoke 7-iron?"
    a: "The Callaway Paradym Ai Smoke 7-iron has a loft of 28 degrees, a lie of 62.25 degrees and a steel-shaft length of 37.25 inches."
  - q: "Is there a Callaway iron called just Ai Smoke?"
    a: "No. The 2024 family is Paradym Ai Smoke, with HL and MAX Fast variants. Ai Smoke on its own is the technology name, not a separate iron model."
  - q: "What is the pitching wedge loft on the Paradym Ai Smoke?"
    a: "42 degrees, with 46-, 50- and 54-degree wedges available underneath to keep the gapping usable."
  - q: "What is the Ai Smart Face?"
    a: "A variable-thickness face whose thickness map was generated from recorded golfer data — swing speed, club delivery and face orientation at impact — rather than optimised for a single centred strike."
