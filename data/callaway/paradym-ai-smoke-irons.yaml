description: >
  Paradym Ai Smoke is Callaway's 2024 game-improvement iron and the first to
  use the Ai Smart Face, a variable-thickness face whose geometry was generated
  from swing data — club delivery and face orientation at impact — rather than
  from a single optimisation point. Urethane microspheres behind the face
  control sound and feel. Lofts are strong: 28 degrees at the 7-iron and 42 at
  the pitching wedge, with a four-wedge ladder underneath. Figures are the
  men's standard right-handed steel build.
