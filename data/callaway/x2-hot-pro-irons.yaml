description: >
  The X2 Hot Pro is the compact, better-player version of the X2 Hot, sold alongside the
  standard model with a smaller head, a thinner top line and less offset. It keeps the
  Deep Central Undercut Cavity and internal Stabilizing Arch of the standard head, but on
  lofts around a degree weaker through the scoring clubs — a 31 degree 7-iron and a 45
  degree pitching wedge against the standard model's 30 and 44 — and on half-inch length
  steps rather than the standard set's progressive ladder. Heads ran from a 3-iron to a
  50 degree A-wedge. Callaway announced the X2 Hot line on 12 November 2013 with retail
  from 17 January 2014, so the model is widely known as the 2014 X2 Hot Pro even though
  the year below is the announcement year per this database's convention. Specs below are
  the standard men's steel-shaft numbers.
