faq:
  - q: "What is the loft of a Callaway X2 Hot Pro 7-iron?"
    a: "The Callaway X2 Hot Pro 7-iron has a loft of 31 degrees, a lie of 62.0 degrees and a length of 37 inches."
  - q: "What is the difference between the Callaway X2 Hot and the X2 Hot Pro?"
    a: "The X2 Hot Pro has a smaller head with a thinner top line and less offset, lofts around a degree weaker — a 31 degree 7-iron against 30 — and a heavier Project X 95 Flighted stock shaft in place of the standard model's Speed Step 85."
  - q: "What year are Callaway X2 Hot Pro irons?"
    a: "Callaway announced the X2 Hot line on 12 November 2013 and it went on sale on 17 January 2014, which is why the X2 Hot Pro is usually called a 2014 model."
