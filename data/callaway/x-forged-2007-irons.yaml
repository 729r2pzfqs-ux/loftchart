description: >
  The 2007 X-Forged was the second forged iron Callaway made and the first to
  carry the X Forged name, replacing the X-Tour of 2005. It is forged from
  soft 1020 carbon steel with what Callaway called a Flighted CG design, the
  centre of gravity positioned progressively through the set for trajectory
  control. The loft, lie and length ladder is identical to the X-Tour it
  replaced — a 35 degree 7-iron and 47 degree pitching wedge — with a gentle
  bounce progression from 2 degrees in the long irons to 8 at the wedge.
