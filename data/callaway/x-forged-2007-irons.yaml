faq:
  - q: "What is the loft of a Callaway X Forged (2007) 7-iron?"
    a: "The 2007 Callaway X-Forged 7-iron has a loft of 35 degrees, a lie of 62 degrees and a 37 inch standard length."
  - q: "What are the 2007 Callaway X-Forged irons made of?"
    a: "They are forged from soft 1020 carbon steel, with Callaway's Flighted CG design moving the centre of gravity progressively through the set."
  - q: "How do the 2007 X-Forged lofts compare to the X-Tour?"
    a: "They are identical. The 2007 X-Forged kept the X-Tour's full loft, lie and length ladder, including the 35 degree 7-iron and 47 degree pitching wedge."
