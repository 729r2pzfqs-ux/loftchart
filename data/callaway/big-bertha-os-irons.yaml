faq:
  - q: "What is the loft of a Callaway Big Bertha OS 7-iron?"
    a: "The Callaway Big Bertha OS 7-iron has a loft of 30 degrees, with a 62.5 degree lie and a 37.25 inch standard steel length."
  - q: "What is the loft of a Callaway Big Bertha OS pitching wedge?"
    a: "The Big Bertha OS pitching wedge is 44 degrees, followed by a 49 degree A-wedge and a 54 degree sand wedge."
  - q: "How do the Big Bertha OS and Steelhead XR irons differ?"
    a: "They share the same loft ladder, but the Big Bertha OS head is larger with more offset and a wider sole, and each club is built roughly a quarter to three-eighths of an inch longer with lighter stock shafts."
  - q: "When did the Callaway Big Bertha OS irons come out?"
    a: "Callaway announced them on 7 September 2016 and they reached retail on 30 September 2016 at $1,099 for a steel set."
