description: >
  Announced on 7 September 2016 and at retail from 30 September, the Big Bertha OS was
  Callaway's oversized distance iron of the Steelhead XR generation, at $1,099 in steel and
  $1,299 in graphite. Its Exo-Cage construction stiffens the body so the 360 Face Cup can
  flex more, and a tungsten-loaded internal standing wave positions the centre of gravity
  progressively through the set. The head is large, with wide soles and generous offset, and
  the loft ladder matches the Steelhead XR at 30 degrees in the 7-iron and 44 in the pitching
  wedge, though the build is roughly a quarter to three-eighths of an inch longer per club.
  The published range runs 4-iron through sand wedge. Specs below are the standard men's
  steel-shaft numbers.
