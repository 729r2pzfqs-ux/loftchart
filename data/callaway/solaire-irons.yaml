  - "Note on years: the earliest archive capture of the Solaire set pages is 3 January 2012 and the line is catalogued as a 2012 model; a late-2011 announcement cannot be ruled out. year_discontinued is 2012 because the Solaire II superseded it on Callaway's site within the same year. Specs are the women's graphite build — the set was not offered in steel or in a men's spec. Offset was not published and is omitted."
faq:
  - q: "What irons come in the Callaway Solaire set?"
    a: "The 2012 Solaire 14-piece set includes only an 8-iron and 9-iron plus pitching, approach and sand wedges — the 5-, 6- and 7-irons are replaced by matching hybrids of 26, 29 and 32 degrees."
  - q: "What is the loft of the Callaway Solaire 8-iron?"
    a: "The Solaire 8-iron has a loft of 36 degrees, with a 63.5 degree lie and a 35.75 inch women's graphite length."
  - q: "What are the wedge lofts in the Callaway Solaire set?"
    a: "The pitching wedge is 44 degrees, the approach wedge 49 degrees and the sand wedge 54 degrees, all with a 65 degree lie."
  - q: "Is there a men's version of the Callaway Solaire?"
    a: "No. The Solaire line is women's only and was sold exclusively with light women's-flex graphite shafts, so no men's or steel-shaft spec exists."
