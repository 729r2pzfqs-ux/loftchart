description: >
  The Solaire launched Callaway's long-running women's complete-set line, sold for the
  2012 season as 9-piece and 14-piece packaged sets rather than as an open iron set. In
  the full 14-piece configuration the 5-, 6- and 7-irons are replaced by matching
  hybrids, so the true irons run only from the 8-iron down through pitching, approach and
  sand wedges, on light women's-flex graphite shafts — the only build offered, and the
  spec below. Callaway replaced it with the Solaire II during 2012, keeping the 8- and
  9-iron specs unchanged, and the Solaire name has continued through refreshed
  generations since. A cheaper Solaire II 9-piece starter set used a different iron
  makeup, with a 32 degree 7-iron and a 40 degree 9-iron.
