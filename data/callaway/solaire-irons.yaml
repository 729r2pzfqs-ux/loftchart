sources:
  - "Archived callawaygolf.com Solaire 14-Piece Complete Set specifications page (archive.org capture, 3 January 2012) — loft, lie angle, length and swing weight for the whole set, including the 8-iron through sand wedge and the hybrid replacements for the 5-, 6- and 7-irons"
