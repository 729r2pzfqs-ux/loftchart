faq:
  - q: "What is the loft of a Callaway X-18 Pro Series 7-iron?"
    a: "The Callaway X-18 Pro Series 7-iron is 33 degrees, with a 62.5 degree lie and a 37 inch standard steel length — the same published numbers as the standard X-18."
  - q: "What is the difference between the X-18 and the X-18 Pro Series?"
    a: "The Pro Series has a smaller head, thinner topline and less offset for better players, and was made in right hand only. The published loft, lie and length ladder matches the standard X-18."
  - q: "Were Callaway X-18 Pro Series irons available left-handed?"
    a: "No. Callaway catalogued the X-18 Pro Series in right hand only, unlike the standard X-18."
