description: >
  The X-18 Pro Series is the better-player version of the 2004 X-18, with a
  more compact head, a thinner topline and reduced offset while keeping the
  standard model's published ladder — a 33 degree 7-iron, 46 degree pitching
  wedge and the upright 65 degree wedge lies. Unlike the standard X-18 it was
  catalogued in right hand only. The range ran 2-iron to lob wedge, and the
  X-20 Tour took over the better-player slot when the X-20 generation arrived
  in 2007.
