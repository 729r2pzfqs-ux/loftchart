description: >
  The Great Big Bertha irons are the flagship of Callaway's Great Big Bertha family,
  announced in late October 2022 with retail from 11 November 2022 and catalogued as
  the 2023 line, sitting above the standard Big Bertha at a super-premium price. The head is a hollow two-piece titanium construction — a
  forged titanium face on a commercially pure titanium body — with a tungsten speed
  cartridge of up to 145 grams low in the trailing edge, reviving the titanium-iron
  idea Callaway last sold in the 1990s Great Big Bertha era. Lofts are moderate for
  a distance iron, with a 30 degree 7-iron and a 43 degree pitching wedge, and the
  chart runs from the 4-iron to a 54 degree sand wedge with no gap wedge. Specs
  below are the standard men's numbers.
