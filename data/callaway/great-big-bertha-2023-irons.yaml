sources:
  - "Callaway Golf Pre-Owned Great Big Bertha product specs (callawaygolfpreowned.com/iron-sets/irons-2023-gbb.html) — loft, lie, length and offset for the 4-iron through sand wedge, plus the forged titanium face, CP titanium body and tungsten construction; swingweight is shown only as D0/D1 without a shaft breakdown, so it is omitted rather than guessed"
  - "2nd Swing Golf Callaway Great Big Bertha 23 iron set spec table (2ndswing.com/golf-clubs/iron-sets/callaway-great-big-bertha-23-iron-set) — independently matches on every loft, lie, length and offset"
  - "Golfstead 2023 Great Big Bertha irons review — the UST Mamiya Helium Nanocore graphite and Nippon N.S. Pro 850GH neo steel stock shafts, the 4-PW stock configuration, the up-to-145g tungsten speed cartridge and the well-over-3000-dollar set pricing"
  - "Note on offset: the sources publish offset in millimetres in exact 0.25 mm steps (5.08 mm to 2.54 mm), which convert to round hundredths of an inch (0.200 to 0.100), indicating Callaway authored the ladder in inches; the inch values are recorded. Bounce was not published and is omitted."
  - "Note on years: Callaway announced the Great Big Bertha family — driver, fairway woods, hybrids and irons — in late October 2022, with all pieces at retail from 11 November 2022 (GolfWRX launch coverage; Forbes, 9 November 2022). The family is catalogued as the 2023 line, hence the model name, while year_introduced records the 2022 announcement per this database's convention. year_discontinued and successor are null — no replacement Great Big Bertha iron had been announced in the sources consulted."
