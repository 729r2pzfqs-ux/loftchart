faq:
  - q: "What is the loft of a Callaway Great Big Bertha 7-iron?"
    a: "The 2023 Great Big Bertha 7-iron has a loft of 30 degrees, with a 62.5 degree lie and a 37 inch standard length."
  - q: "What is the difference between the 2023 Big Bertha and Great Big Bertha irons?"
    a: "The Great Big Bertha is the titanium flagship: a forged titanium face on a commercially pure titanium body with up to 145 grams of tungsten, sold at a super-premium price. Its lofts are also weaker — a 30 degree 7-iron and 43 degree pitching wedge against 27 and 42 degrees for the steel-bodied Big Bertha."
  - q: "Are the 2023 Great Big Bertha irons really made of titanium?"
    a: "Yes. The head is a hollow two-piece titanium construction — a forged titanium face on a commercially pure titanium body — with tungsten used to restore mass low in the head. Titanium's light weight is what allows up to 145 grams of tungsten placement."
