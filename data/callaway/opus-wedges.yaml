category: tour
construction: cast, compact tour shape, Spin Gen face with quartz blast
material: 8620 mild carbon steel (per launch coverage)
predecessor: Callaway JAWS Raw
successor: Callaway Opus SP
description: >
  The Opus is the 2024 start of Callaway's current wedge family, replacing
  the JAWS Raw at retail from September 2024 and still in the catalogue
  below the 2025 Opus SP. Spin Gen Face Technology replaced the JAWS groove
  package: more, tighter-spaced grooves, angled micro-grooves that channel
  moisture off an open face, and a quartz face blast for wet-condition
  friction. The line runs 17 loft/bounce/grind combinations from 48 to 60
  degrees across four grinds, in Brushed Chrome and Black Shadow finishes.
  The tungsten-toplined Opus Platinum is a separate model and is not
  included in this chart.
grinds:
  - code: S
    name: S Grind
    description: >
      The core sole, offered at every loft — mid bounce with enough heel
      relief to stay versatile, suiting most players and conditions.
  - code: W
    name: W Grind
    description: >
      The widest sole in the line with the highest bounce, for steep attack
      angles, soft conditions and sand.
  - code: T
    name: T Grind
    description: >
      Low-bounce shot-maker's sole with aggressive heel and toe relief that
      sits snug to the ground with the face straight, open or closed — for
      shallow attack angles and firm turf.
  - code: C
    name: C Grind
    description: >
      Mid-low bounce with heel-toe relief — more forgiving than the T and
      more versatile than the S around the greens.
