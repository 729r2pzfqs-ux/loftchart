faq:
  - q: "What lofts does the Callaway Opus come in?"
    a: "48 to 60 degrees — 17 loft, bounce and grind combinations across the S, W, T and C grinds."
  - q: "What grinds does the Callaway Opus offer?"
    a: "Four: the all-round S at every loft, the wide high-bounce W (50-60), and the low-bounce T (6 degrees) and C (8 degrees) at 58 and 60."
  - q: "What is the difference between the Opus and the Opus Platinum?"
    a: "The Platinum adds a 17-gram tungsten topline weight that raises the centre of gravity for a lower, spinnier flight, comes in Blue Platinum, and offers only S and Z grinds at 54-60 degrees. It is a separate model from this chart."
  - q: "Is the Callaway Opus still sold?"
    a: "Yes — as of October 2026 it remains in Callaway's range below the Opus SP, which took over the top slot in 2025."
