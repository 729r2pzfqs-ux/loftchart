hosel:
  system: "OptiFit hosel (Max, Triple Diamond and Max D — the Max Fast is bonded)"
  loft_range: "−1° to +2°"
  positions: 8
  lie_effect: >
    The lie cog has two positions: N (neutral, the stated lie) and D (draw, a
    more upright lie — Callaway does not publish the degree change).
  face_note: >
    Changing loft re-orients the head on the shaft, so lower settings sit
    slightly open and higher settings slightly closed at address.
  notes: >
    The two-cog OptiFit design is unchanged from the Paradym through the Ai
    Smoke, Elyte and Quantum. The Max Fast is the one head of this era with
    no hosel adjustment at all — its loft is fixed as stamped.
