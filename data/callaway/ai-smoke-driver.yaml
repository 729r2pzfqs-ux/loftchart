faq:
  - q: "What lofts does the Callaway Paradym Ai Smoke come in?"
    a: "The Ai Smoke Max and Max D come in 9, 10.5 and 12 degrees, the Triple Diamond in 8, 9 and 10.5 (8 right-hand only), and the Max Fast in 10.5 and 12."
  - q: "What is the Paradym Ai Smoke adjustment chart?"
    a: "The Max, Triple Diamond and Max D use Callaway's two-cog OptiFit hosel — loft at −1, stated, +1 or +2 degrees, each in a Neutral or Draw lie, eight settings in all. The Max Fast is the exception: its hosel is bonded and not adjustable."
  - q: "Is the Ai Smoke Max Fast adjustable?"
    a: "No. To keep the total build ultralight, Callaway glued the Max Fast's hosel, so it plays its stamped loft only. The following Elyte and Quantum Max Fast models restored the adjustable hosel."
  - q: "Is the Paradym Ai Smoke still in production?"
    a: "No — the Elyte replaced it in early 2025 and the Quantum followed in 2026, so the Ai Smoke is a used-market and closeout buy, typically at a steep discount to the current line."
