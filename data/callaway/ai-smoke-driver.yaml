description: >
  The Paradym Ai Smoke is Callaway's 2024 driver family and the first with
  the Ai Smart Face — a face designed by machine learning against a database
  of real swings, zoned into "micro deflections" that tune launch and spin by
  impact location. The Max is the core head, with sliding perimeter weighting
  claimed to move shot shape up to 19 yards; the 450 cc Triple Diamond is the
  low-spin tour head with 14 g of swappable front/back weighting; the Max D
  is the highest-MOI head of the family with fixed draw weighting; and the
  Max Fast is the ultralight model — notably the one driver of this era that
  Callaway sold with a glued, non-adjustable hosel to save weight. The Elyte
  replaced the family in 2025.
variants:
  - name: Paradym Ai Smoke Max
    head_cc: 460
    description: >
      The core head with adjustable sliding perimeter weighting — up to about
      19 yards of shot-shape correction between its draw and fade settings.
  - name: Paradym Ai Smoke Triple Diamond
    head_cc: 450
    description: >
      The compact low-spin tour head with neutral-to-fade bias; a 14 g weight
      swaps between a front port (lowest spin) and a back port (more MOI).
      8° is right-hand only.
  - name: Paradym Ai Smoke Max D
    head_cc: 460
    description: >
      The highest-MOI head in the family, with fixed rear-heel draw
      weighting and the most upright lie — built for slicers.
  - name: Paradym Ai Smoke Max Fast
    head_cc: 460
    description: >
      The ultralight build for slower swing speeds — and the exception in the
      lineup: its hosel is bonded (non-adjustable) and its rear weight a
      fixed 4 g, both to save mass. Right-hand only.
