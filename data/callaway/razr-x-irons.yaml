description: >
  RAZR X was the mainstream game-improvement iron in the range Callaway announced in
  January 2011 alongside the RAZR X Tour and the forged RAZR X. It pairs an
  integrated cup face and undercut cavity with a low, deep centre of gravity, and the
  bounce climbs steeply through the set — from 2 degrees at the 3-iron to 13.5 at the
  sand wedge. Lengths below are the steel build; the graphite build is a quarter inch
  longer at every club.
