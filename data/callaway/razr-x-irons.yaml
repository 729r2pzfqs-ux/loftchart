faq:
  - q: "What is the loft of a Callaway RAZR X 7-iron?"
    a: "The Callaway RAZR X 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a steel-shaft length of 36.75 inches."
  - q: "When were Callaway RAZR X irons released?"
    a: "Callaway announced the RAZR X line on 20 January 2011 and it reached retail on 18 February 2011."
  - q: "What is the difference between RAZR X and RAZR X Forged?"
    a: "RAZR X is the cast game-improvement model recorded on this page. RAZR X Forged, announced at the same time, is a 1020 carbon steel forging with a tour-shaped head — a different club with its own spec chart."
