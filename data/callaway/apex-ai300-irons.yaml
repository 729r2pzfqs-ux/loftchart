faq:
  - q: "What is the loft of a Callaway Apex Ai300 7-iron?"
    a: "The Callaway Apex Ai300 7-iron has a loft of 29 degrees, a lie of 62.25 degrees and a steel-shaft length of 37.25 inches."
  - q: "Is the Callaway Apex Ai300 a game-improvement iron?"
    a: "Yes. Callaway called it its most complete forged game-improvement iron at launch — a forged cavity back with a slightly larger profile, more offset and longer mid-iron shafts than the players-distance Apex Ai200."
  - q: "Are the Apex Ai300 lofts stronger than the Apex Ai200?"
    a: "No, slightly weaker — 29 degrees at the 7-iron against 30, and a 42-degree pitching wedge against 43 — but the Ai300 plays its mid irons about a quarter inch longer."
