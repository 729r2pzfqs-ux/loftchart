description: >
  The Apex Ai300 is the larger of the two Apex Ai irons Callaway announced on 12 August
  2024, described by Callaway as its most complete forged game-improvement iron, with
  retail from 23 August 2024 at 1,400 dollars for a seven-piece set. It is a forged
  cavity back rather than the Ai200's hollow body, but shares the Forged 455 Face Cup,
  the Ai Smart Face designed from golfer swing data, urethane microspheres and the MIM
  weight system. Lofts sit a degree weaker than the Ai200 through most of the set — a
  29-degree 7-iron and a 42-degree pitching wedge — while the mid-iron shafts run about
  a quarter inch longer on a game-improvement length progression, and offset is
  noticeably greater. The chart runs from the 4-iron to a 47-degree approach wedge.
  Figures are the men's standard steel build; swing weight and bounce were not
  published and are omitted.
