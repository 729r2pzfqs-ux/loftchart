faq:
  - q: "What is the loft of a Callaway Rogue Pro 7-iron?"
    a: "The Callaway Rogue Pro 7-iron has a loft of 31 degrees, a lie of 62.0 degrees and a length of 37 inches."
  - q: "What is the difference between the Callaway Rogue and the Rogue Pro?"
    a: "The Rogue Pro is a more compact head with a thin top line, a shallow cavity and much less offset — 0.165 inches at the 3-iron against the standard Rogue's 0.270 — and its lofts are around a degree weaker, with a 31 degree 7-iron against 30 and a 45 degree pitching wedge against 44."
  - q: "When were the Callaway Rogue Pro irons released?"
    a: "Callaway announced the Rogue iron family in January 2018, with pre-orders from 19 January and retail from 9 February 2018."
