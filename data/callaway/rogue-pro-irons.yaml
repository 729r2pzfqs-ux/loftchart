description: >
  The Rogue Pro is the compact model of Callaway's 2018 Rogue iron family, sold alongside
  the standard Rogue and the distance-oriented Rogue X from February 2018. It shares the
  360 Face Cup with Variable Face Thickness, the tungsten weighting and the urethane
  microspheres of the standard model, but in a smaller head with a thin top line, a
  shallow cavity, a narrower sole and much less offset for workability and feedback.
  Lofts are around a degree weaker than the standard Rogue, with a 31 degree 7-iron and
  a 45 degree pitching wedge, and heads ran from a 3-iron to a 50 degree A-wedge. Specs
  below are the standard men's steel-shaft numbers.
