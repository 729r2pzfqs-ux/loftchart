faq:
  - q: "What is the loft of a Callaway XR Pro 7-iron?"
    a: "The Callaway XR Pro 7-iron has a loft of 31 degrees, a lie of 62.0 degrees and a length of 37 inches."
  - q: "What is the difference between the Callaway XR and the XR Pro?"
    a: "The XR Pro is a smaller head with a thinner top line, a narrower sole and much less offset — 0.165 inches at the 3-iron against the XR's 0.270 — and its lofts are around a degree weaker, with a 31 degree 7-iron against 30. It was also the first Callaway players iron with a forged cup face."
  - q: "What shaft did the Callaway XR Pro come with?"
    a: "The stock steel shaft was the KBS Tour-V 90, a lighter tour-profile shaft, in regular and stiff flexes."
