description: >
  The XR Pro is the compact, better-player version of the 2015 XR, and the first time
  Callaway put its cup-face technology into a players iron — a forged 360 Face Cup on the
  same two-piece, dual-heat-treated body as the standard XR, with an Internal Standing
  Wave positioning mass low and central. The head is smaller than the standard XR, with a
  thinner top line and a narrower sole, and lofts run around a degree weaker, with a 31
  degree 7-iron and a 45 degree pitching wedge against the XR's 30 and 44. Heads ran from
  a 3-iron to a 50 degree A-wedge, and the XR Pro reached retail in the spring of 2015, a
  little after the standard model. Specs below are the standard men's steel-shaft numbers.
