faq:
  - q: "What lofts does the Callaway Opus SP+ come in?"
    a: "The Opus SP+ covers the scoring lofts only — 54 to 60 degrees in 2-degree steps, 11 loft, bounce and grind combinations. For 48 to 52 or 62 to 64 degrees, Callaway points buyers to the standard Opus SP."
  - q: "What grinds does the Callaway Opus SP+ offer?"
    a: "Three: the low-bounce Z (8 degrees, every loft), the all-round S (10 degrees, every loft) and the new X (12 degrees, 56 to 60 degrees)."
  - q: "What is the difference between the Opus SP and the Opus SP+?"
    a: "The SP+ adds a metal-injection-molded face and tungsten high on the topline over a Spin Pocket about a quarter larger, for an even higher centre of gravity, lower flight and more spin. It covers only 54 to 60 degrees and costs more; the SP covers 48 to 64 degrees."
