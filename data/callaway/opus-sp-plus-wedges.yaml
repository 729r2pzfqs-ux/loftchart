description: >
  The Opus SP+ is Callaway's 2026 extension of the Opus SP line, announced
  with pre-orders on 24 February 2026 and at retail from 6 March. It is a
  scoring-loft specialist: a three-piece head adds a metal-injection-molded
  face and tungsten placed high on the topline and flange — exposed on the
  back of the head — over a Spin Pocket about a quarter larger than the Opus
  SP's, pushing the centre of gravity higher still for a lower, penetrating
  flight with more spin. The matrix covers 54 to 60 degrees only, in 11
  loft/bounce/grind combinations across three grinds, and the standard Opus
  SP remains in the line for the full 48 to 64 degree range. Club lengths
  are omitted here because no manufacturer-published length chart could be
  verified.
grinds:
  - code: Z
    name: Z Grind
    description: >
      The friendly low-bounce option at 8 degrees — forgiving for a
      low-bounce sole, offered at every SP+ loft.
  - code: S
    name: S Grind
    description: >
      The all-situations mid-bounce grind at 10 degrees, shared with the
      standard Opus SP and offered at every SP+ loft.
  - code: X
    name: X Grind
    description: >
      The new 12-degree option for maximum greenside versatility — bounce
      with a narrow, relieved sole for steeper swings, offered from 56 to 60
      degrees.
