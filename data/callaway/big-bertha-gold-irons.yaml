faq:
  - q: "What is the loft of a Callaway Big Bertha Gold 7-iron?"
    a: "The Big Bertha Gold 7-iron has a loft of 33 degrees, with a 62.5 degree lie and a 37 inch standard length."
  - q: "What is the difference between the 1994 Big Bertha and the Big Bertha Gold irons?"
    a: "The Gold is the 1996 refresh of the same design: the loft, lie and length ladder is unchanged, with the changes limited to the sole shape and head weighting."
  - q: "What wedges came with the Big Bertha Gold irons?"
    a: "The pitching wedge is 46.5 degrees, followed by a 50.8 degree approach wedge, a 55 degree sand wedge and a 60 degree lob wedge, all at a 65 degree lie."
