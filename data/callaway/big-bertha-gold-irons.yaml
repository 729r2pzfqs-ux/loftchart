description: >
  The Big Bertha Gold irons were the 1996 update of Callaway's original 1994
  Big Bertha, keeping the S2H2 short, straight, hollow hosel and the same
  loft ladder — 33 degree 7-iron, 46.5 degree pitching wedge, 50.8 degree
  approach wedge — while reworking the sole and weight distribution.
  The catalogued range ran from a 16 degree 1-iron to a 60 degree lob wedge
  with Callaway's typically upright 65 degree wedge lies. It gave way to the
  Big Bertha X-12 in 1998.
