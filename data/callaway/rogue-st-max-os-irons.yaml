faq:
  - q: "What is the loft of a Callaway Rogue ST Max OS 7-iron?"
    a: "The Callaway Rogue ST Max OS 7-iron has a loft of 28.5 degrees, with a 62.5 degree lie and a 37 inch standard steel length."
  - q: "What is the loft of a Callaway Rogue ST Max OS pitching wedge?"
    a: "The Rogue ST Max OS pitching wedge is 41 degrees, with a 46 degree A-wedge, a 51 degree gap wedge and a 56 degree sand wedge."
  - q: "What is the difference between the Rogue ST Max and the Max OS?"
    a: "The Max OS has a larger head with a wider sole, more offset and slight draw bias, and its lofts are a degree weaker through the middle of the set — 28.5 degrees at the 7-iron against 27.5 for the Max."
  - q: "When were the Callaway Rogue ST Max OS irons released?"
    a: "Callaway unveiled the Rogue ST line in January 2022, with retail from February 2022."
