description: >
  The Rogue ST Max OS is the oversized model of Callaway's 2022 Rogue ST iron family,
  sitting between the core Max and the ultra-light Max OS Lite. It uses the same
  high-strength 450 stainless steel body and A.I.-designed Flash Face Cup as the Max,
  with up to 49 grams of high-density tungsten, but adds a wider sole, more offset and
  slight draw bias for maximum forgiveness. Lofts are a degree weaker than the Max at
  the 7-iron — 28.5 against 27.5 degrees — but the two share a 41 degree pitching
  wedge. Specs below are the standard men's steel-shaft numbers.
