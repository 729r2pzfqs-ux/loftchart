faq:
  - q: "What lofts does the Callaway JAWS Raw Full Toe come in?"
    a: "Four: 54, 56, 58 and 60 degrees, all with 10 degrees of bounce on the J Grind sole."
  - q: "What is the J Grind on the JAWS Raw Full Toe?"
    a: "A sole designed around the full-toe shape: moderate heel-to-toe camber, a slightly raised heel so the face can open, a pre-worn leading edge and extra width toward the toe. It suits medium divots and softer conditions."
  - q: "How is this different from the standard JAWS Raw?"
    a: "Same raw-face JAWS groove platform, but with a taller toe, grooves across the whole face, a single grind and bounce instead of the standard model's 24-option matrix, and only the four scoring lofts."
