description: >
  The JAWS Raw Full Toe is Callaway's 2023 high-toe specialty wedge, at
  retail from 7 April 2023. It moves the JAWS Full Toe concept onto the
  JAWS Raw platform: sharp full-face grooves on an unplated face that rusts
  into play, with a taller toe for open-face shots. The whole line uses the
  new J Grind — moderate heel-to-toe camber, a slightly raised heel, a
  pre-worn leading edge and a sole that widens toward the toe — at a single
  10-degree bounce across four lofts. It left the range when the Opus
  family replaced Callaway's wedge lineup from late 2024; the full-toe slot
  continued with the Opus-generation full-toe models.
grinds:
  - code: J
    name: J Grind
    description: >
      The only sole on the model — moderate camber from heel to toe, a
      slightly higher heel for open-face versatility, extra camber front to
      back and a pre-worn leading edge. Suits a medium divot and softer
      conditions, and is forgiving from bunkers.
