faq:
  - q: "What is the loft of a Callaway Paradym Star 7-iron?"
    a: "The Callaway Paradym Star 7-iron has a loft of 30 degrees, a lie of 62 degrees and a length of 37.25 inches."
  - q: "What is the difference between Paradym and Paradym Star irons?"
    a: "Star is about 33 grams lighter per club with 50 gram class graphite shafts, runs a quarter inch longer, and its lofts are around a degree weaker — a 30 degree 7-iron against 29 — to help moderate swing speeds launch the ball."
  - q: "Who are Callaway Paradym Star irons for?"
    a: "Golfers with moderate swing speeds who want more distance and height from an ultra-light build without moving to a ladies flex set."
