description: >
  Paradym Star is the ultra-lightweight edition of the 2023 Paradym iron,
  built for golfers with moderate swing speeds. The set is roughly 33 grams
  lighter than the standard Paradym through a lighter head, 50 gram class UST
  ATTAS Speed shafts and a light grip, the shafts run a quarter inch longer
  per club, and the lofts are weaker for launch — a 30 degree 7-iron against
  29 on the standard model, opening to a 45 degree pitching wedge. The stock
  set ran 5-iron through sand wedge.
