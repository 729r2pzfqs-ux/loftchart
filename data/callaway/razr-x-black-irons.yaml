description: >
  RAZR X Black extended the RAZR X iron family for 2012, announced at the PGA
  Merchandise Show on 25 January 2012 and at retail from 16 March 2012 at 799
  dollars for steel sets. It is an advanced game-improvement head in a black
  finish, one degree weaker than the 2011 RAZR X at the 7-iron (31 against 32
  degrees) but a quarter inch longer at the 3-iron, on the same upright lie
  ladder topping out at 65 degrees through the wedges.
