faq:
  - q: "What is the loft of a Callaway RAZR X Black 7-iron?"
    a: "The Callaway RAZR X Black 7-iron has a loft of 31 degrees, a lie of 62.5 degrees and a standard length of 37 inches."
  - q: "When were Callaway RAZR X Black irons released?"
    a: "Callaway announced them at the PGA Merchandise Show on 25 January 2012 and they reached retail on 16 March 2012."
  - q: "What is the difference between the RAZR X and the RAZR X Black irons?"
    a: "The Black is the 2012 refresh in a black finish with lofts a degree weaker through most of the set — a 31 degree 7-iron against 32 — and a 39 inch 3-iron against 38.75 on the 2011 RAZR X steel build."
