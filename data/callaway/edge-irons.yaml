faq:
  - q: "What is the loft of a Callaway Edge 7-iron?"
    a: "The Costco Callaway Edge 7-iron has a loft of 30 degrees, with a 62.5 degree lie and a 37 inch length on the original uniflex steel shaft."
  - q: "What is the loft of the Callaway Edge pitching wedge and sand wedge?"
    a: "The pitching wedge is 44 degrees and the sand wedge is 54 degrees; the boxed set includes no gap wedge between them."
  - q: "Are the Costco Callaway Edge irons the same as a regular Callaway model?"
    a: "They are a Costco-exclusive design, but the original set's iron lofts, lies and loft ladder match Callaway's 2016 Steelhead XR generation exactly, in a simpler cavity-back head."
  - q: "When did the Callaway Edge set come out at Costco?"
    a: "Costco's online listing is archived from April 2018 at $499.99 for the 10-piece set, and it became a recurring, frequently sold-out item as coverage spread through 2019; the set has since been refreshed with new configurations."
