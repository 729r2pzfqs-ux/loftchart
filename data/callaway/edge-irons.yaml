description: >
  The Edge is a Costco-exclusive Callaway line sold only inside a boxed 10-piece set —
  driver, 3-wood, 5-hybrid, 6-iron through pitching wedge, sand wedge and an Odyssey
  putter — on sale by early 2018 at $499.99 and famous for repeatedly selling out
  once coverage of it went viral through 2019. The
  irons are large cavity backs with a stabilizing arch and perimeter weighting, on
  uniflex steel shafts, and their loft ladder mirrors the Steelhead XR generation
  exactly, from a 26 degree 6-iron and 30 degree 7-iron to a 44 degree pitching wedge and
  54 degree sand wedge. The set has been refreshed since — later versions run 12 pieces
  with a revised iron ladder — and the specs below are the original uniflex-steel
  configuration from Costco's official spec chart.
