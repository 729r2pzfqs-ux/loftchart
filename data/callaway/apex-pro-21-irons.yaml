description: >
  Apex Pro 21 is the tour end of Callaway's Apex family: a 1025 carbon steel forging
  with tungsten energy cores, urethane microspheres filling the cavity to damp
  vibration, and a hollow construction through the long irons. Lofts are traditional
  for a players iron — the 7-iron is 33 degrees, four weaker than the Rogue ST Pro of
  the following year — and offset is tight, from 3.56 mm at the 3-iron to 1.65 mm at
  the approach wedge.
