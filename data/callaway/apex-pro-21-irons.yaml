faq:
  - q: "What is the loft of a Callaway Apex Pro 21 7-iron?"
    a: "The Callaway Apex Pro 21 7-iron has a loft of 33 degrees, a lie of 62.0 degrees and a length of 37.0 inches."
  - q: "When were Callaway Apex Pro 21 irons released?"
    a: "Callaway announced them on 12 January 2021 and they reached retail on 11 February 2021."
  - q: "Are Apex Pro 21 lofts strong?"
    a: "No. At 33 degrees the 7-iron is traditional for a players iron, and four degrees weaker than Callaway's own Rogue ST Pro of the following year."
