faq:
  - q: "What lofts do the Callaway Elyte hybrids come in?"
    a: "The core Elyte comes in 19, 22, 24 and 26 degrees; the Elyte X in 18, 21, 25, 29 and 31; and the Elyte Max Fast in 23, 27, 31, 35 and 39."
  - q: "Are the Callaway Elyte hybrids adjustable?"
    a: "Almost all of them — every Elyte X and Max Fast loft and the core Elyte's 19, 22 and 24 degree heads carry the OptiFit hosel (minus 1 to plus 2 degrees with a neutral or draw lie cog). Only the core 26 degree head is bonded."
  - q: "What is the difference between the Elyte and Elyte X hybrids?"
    a: "The X is the compact player's shape with stronger lofts at each slot (18/21/25 against 19/22/24) and a flatter, more iron-like flight; the core Elyte is the larger, easier-launching head. Both build to a D2 swing weight."
