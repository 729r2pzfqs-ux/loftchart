description: >
  The Elyte hybrids launched in early 2025 with the Elyte woods. The core
  Elyte is the mid-sized all-rounder with OptiFit adjustability on the 19°,
  22° and 24° heads plus a bonded 26°; the Elyte X is the compact,
  stronger-lofted player's head, adjustable at every loft from 18° to 31°;
  and the Elyte Max Fast is the lightweight high-launch model for moderate
  swing speeds, adjustable from 23° out to a 39° 8-hybrid at a C9 swing
  weight. The Quantum hybrids replaced the line in 2026.
variants:
  - name: Elyte
    description: >
      The core hybrid at a D2 swing weight: adjustable 19°, 22° and 24° heads
      plus a bonded 26°, all in right- and left-handed.
  - name: Elyte X
    description: >
      The compact player's head, adjustable at every loft — 18, 21, 25, 29
      and 31 degrees — at D2; the 29° and 31° are right-hand only.
  - name: Elyte Max Fast
    description: >
      The lightweight build for moderate swing speeds, adjustable at every
      loft from 23° to a 39° 8-hybrid at a C9 swing weight with more upright
      lies; the 35° and 39° are right-hand only.
