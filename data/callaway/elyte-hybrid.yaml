hosel:
  system: "OptiFit hosel"
  loft_range: "−1° to +2°"
  positions: 8
  lie_effect: >
    The lie cog has two positions: N (neutral, the stated lie) and D (draw, a
    more upright lie — Callaway does not publish the degree change).
  face_note: >
    Changing loft re-orients the head on the shaft, so lower settings sit
    slightly open and higher settings slightly closed at address.
  notes: >
    Every Elyte X and Max Fast loft is adjustable, as are the core Elyte's
    19°, 22° and 24° heads; only the core 26° is bonded. The two-cog OptiFit
    design is the same one used on the Elyte drivers and 3-woods.
