description: >
  The 2018 X Forged is Callaway's tour cavity back of that era: a streamlined
  cavity, a compact profile, a thin top line and minimal offset, forged in
  Callaway's triple-net process from 1025 carbon steel. The sole is tri-level,
  with a bevelled leading and trailing edge, and the face carries 20V grooves.
  Lofts are traditional — 33 degrees at the 7-iron, 46 at the pitching wedge.
  Figures are the men's standard right-handed steel build.
