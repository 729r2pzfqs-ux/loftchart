faq:
  - q: "What is the loft of a Callaway X Forged (2018) 7-iron?"
    a: "The 2018 Callaway X Forged 7-iron has a loft of 33 degrees, a lie of 62.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "When was the 2018 Callaway X Forged made?"
    a: "It was introduced in 2018 and was replaced in October 2020, when Callaway announced the X Forged CB of the 2021 line alongside the Apex MB 21."
  - q: "What is triple-net forging?"
    a: "Callaway's term for forging the head in three successive strikes, each closer to the finished shape, which lets the final form be produced with less material removal and a more consistent grain."
  - q: "Does the Callaway X Forged (2018) come in a 3-iron?"
    a: "Sets were sold as 3-PW and 4-PW, but the published specification chart runs from the 4-iron down, which is what is recorded here."
