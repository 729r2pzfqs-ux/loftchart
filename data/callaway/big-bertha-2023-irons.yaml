description: >
  The 2023 Big Bertha irons continue Callaway's premium game-improvement line above
  the core Paradym family, replacing the Big Bertha B21. Callaway announced them with
  the women's Big Bertha REVA on 18 April 2023, with retail from 26 May 2023 at
  999.99 dollars for a six-piece steel set. The package was refined over the B21 —
  lofts a degree stronger through most of the set, a gap wedge added to the chart and
  the lob wedge dropped — while keeping an A.I.-designed Flash Face Cup, tungsten
  weighting, urethane microspheres and the B21's generous offset, still around 8 mm
  at the 4-iron. Lofts are strong for the category — a 27 degree 7-iron and a 42
  degree pitching wedge — and the chart runs from an 18 degree 4-iron to a 56 degree
  sand wedge. Specs below are the standard men's numbers.
