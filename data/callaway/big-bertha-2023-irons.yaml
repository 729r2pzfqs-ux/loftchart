faq:
  - q: "What is the loft of a 2023 Callaway Big Bertha 7-iron?"
    a: "The 2023 Big Bertha 7-iron has a loft of 27 degrees, with a 62.5 degree lie and a 37 inch standard length."
  - q: "What is the loft of the 2023 Big Bertha pitching wedge?"
    a: "The pitching wedge is 42 degrees, followed by a 47 degree A-wedge, a 52 degree gap wedge and a 56 degree sand wedge."
  - q: "What changed from the Big Bertha B21 to the 2023 Big Bertha?"
    a: "The 2023 model kept the A.I.-designed Flash Face Cup, the tungsten weighting and essentially the B21's offset ladder — both run about 8 mm at the 4-iron — but strengthened the lofts by roughly a degree per club, added a 52 degree gap wedge to the chart and dropped the B21's lob wedge."
