description: >
  The Hawk Eye VFT irons were the last of Callaway's all-titanium iron
  ranges, adding the Variable Face Thickness face of the VFT metalwoods to
  the tungsten-weighted titanium Hawk Eye head. The loft ladder is identical
  to the original Hawk Eye — 33 degree 7-iron, 46.5 degree pitching wedge —
  but the lies return to Callaway's classic 59.2/59.9/60.6/61.3 ladder in
  the long irons. The multi-material premium slot passed to the Big Bertha
  Fusion irons in 2004.
