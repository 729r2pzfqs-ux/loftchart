faq:
  - q: "What is the loft of a Callaway Hawk Eye VFT 7-iron?"
    a: "The Hawk Eye VFT 7-iron has a loft of 33 degrees, with a 62.5 degree lie and a 37 inch standard length."
  - q: "What does VFT mean on the Callaway Hawk Eye VFT irons?"
    a: "Variable Face Thickness — the titanium face is thicker in the centre and thinner toward the edges, enlarging the effective hitting area, a technology carried over from Callaway's VFT metalwoods."
  - q: "What is the difference between the Hawk Eye and Hawk Eye VFT irons?"
    a: "Both are tungsten-weighted titanium heads with the same loft ladder; the VFT adds the variable-thickness face and moves the long-iron lies back to Callaway's classic ladder (59.9 degrees at the 3-iron versus 60 on the original Hawk Eye)."
