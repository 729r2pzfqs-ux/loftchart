faq:
  - q: "What is the loft of a 2006 Callaway Big Bertha 7-iron?"
    a: "The 2006 Callaway Big Bertha 7-iron has a loft of 33 degrees, with a 62.5 degree lie and a 36.75 inch steel-shaft length."
  - q: "What is the pitching wedge loft on the 2006 Big Bertha irons?"
    a: "The 2006 Big Bertha pitching wedge is 45 degrees with 7 degrees of bounce, followed by a 50 degree approach wedge, 55 degree sand wedge and 60 degree lob wedge."
  - q: "How do the 2006 Big Bertha irons differ from the 2008 model?"
    a: "The 2006 set uses the 360-degree undercut channel with notch weighting and slightly longer steel lofts of 45 degrees at PW; the 2008 redesign moved to a wide-sole head with optional i-brid hybrid long irons."
