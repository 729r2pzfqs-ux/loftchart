description: >
  The 2006 Big Bertha irons continued Callaway's volume game-improvement line
  with a 360-degree undercut channel, notch weighting in the sole and a
  Variable Face Thickness face. Lofts are moderately strong for the period
  with a 33 degree 7-iron and 45 degree pitching wedge, and the lie ladder
  keeps Callaway's traditionally upright 65 degree wedges. The catalogued
  range ran 2-iron through lob wedge; specs below are the standard men's
  steel build, with graphite built a quarter inch longer.
