description: >
  The X Series N415 is a value-priced game-improvement set Callaway sold from
  2015 through large golf retailers rather than as part of its premium
  line. A deep undercut cavity spreads ball speed across the face, and the
  build is long and upright for the price class — a 39.125 inch 4-iron, a 30
  degree 7-iron and lies reaching 64 degrees at the wedges. The catalogued
  men's set ran 4-iron to approach wedge on Callaway's own uniflex steel
  shaft, with a graphite build swinging lighter at D0 against D1 for steel.
