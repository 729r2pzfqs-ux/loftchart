faq:
  - q: "What is the loft of a Callaway Epic Forged 7-iron?"
    a: "The Callaway Epic Forged 7-iron has a loft of 27 degrees, a lie of 61.0 degrees and a length of 37.625 inches."
  - q: "When were Callaway Epic Forged irons released?"
    a: "Callaway announced them on 16 July 2019 and they reached retail on 2 August 2019."
  - q: "How strong are Epic Forged lofts?"
    a: "Very. The 27-degree 7-iron is six degrees stronger than the Apex Pro 21 and matches what most makers were calling a 6-iron at the time."
