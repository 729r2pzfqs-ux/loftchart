description: >
  Epic Forged was Callaway's most expensive iron of 2019, a forged hollow body with a
  cup face, tungsten weighting and urethane microspheres behind the face. The lofts
  are among the strongest ever put on a forged iron — 27 degrees at the 7-iron and
  18 at the 4 — and the set runs long, at 39.5 inches for the 4-iron, so the carry
  gaps at the top of the bag are unusually wide.
