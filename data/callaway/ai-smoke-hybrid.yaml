faq:
  - q: "What lofts do the Callaway Paradym Ai Smoke hybrids come in?"
    a: "The core Ai Smoke comes in 18, 21, 24 and 27 degrees; the Ai Smoke HL in 18, 21, 24, 27, 30 and 33; and the MAX Fast in 21, 24, 27, 30 and 33."
  - q: "Are the Callaway Ai Smoke hybrids adjustable?"
    a: "The core Ai Smoke and the HL are adjustable at every loft through the OptiFit hosel (minus 1 to plus 2 degrees with a neutral or draw lie cog). The MAX Fast uses a bonded hosel to save weight."
  - q: "What is the difference between the Ai Smoke and Ai Smoke HL hybrids?"
    a: "The HL is built a half inch or so longer at each loft with flatter lies and a shallower, higher-launching head — closer to a small fairway wood — and extends the ladder to 30 and 33 degrees. The core head is the more compact iron replacement."
