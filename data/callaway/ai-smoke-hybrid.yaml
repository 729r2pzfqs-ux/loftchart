hosel:
  system: "OptiFit hosel (Ai Smoke and HL)"
  loft_range: "−1° to +2°"
  positions: 8
  lie_effect: >
    The lie cog has two positions: N (neutral, the stated lie) and D (draw, a
    more upright lie — Callaway does not publish the degree change).
  face_note: >
    Changing loft re-orients the head on the shaft, so lower settings sit
    slightly open and higher settings slightly closed at address.
  notes: >
    The core Ai Smoke and the HL are adjustable at every loft; the MAX Fast
    replaces the hosel with a bonded one to save weight. The two-cog OptiFit
    design is the same one used on the Ai Smoke drivers and 3-woods.
