predecessor: Callaway Paradym
successor: Callaway Elyte
description: >
  The Paradym Ai Smoke hybrids launched in January 2024 with the Ai Smoke
  woods. The core Ai Smoke is the adjustable iron-replacement head in 18° to
  27°; the Ai Smoke HL is the higher-launching, slightly longer-built
  adjustable head that extends the ladder to 30° and 33°; and the MAX Fast is
  the lightweight bonded model for slower swings, in 21° to 33°. The Elyte
  hybrids replaced the line in early 2025.
variants:
  - name: Paradym Ai Smoke
    description: >
      The core adjustable hybrid in four lofts at a D2 swing weight, with the
      tungsten speed cartridge keeping launch and spin down; the 27° head is
      right-hand only.
  - name: Paradym Ai Smoke HL
    description: >
      The high-launch adjustable head in six lofts from 18° to 33°, built
      slightly longer (41.25 inches at 3H) at a D1 swing weight with flatter
      lies — a half-fairway, half-hybrid for average swing speeds.
  - name: Paradym Ai Smoke MAX Fast
    description: >
      The lightweight model for slower-to-moderate swings: bonded hosel,
      lighter components and the highest launch in the family, in five lofts
      from 21° to 33°.
