faq:
  - q: "What is the loft of a Callaway Hawk Eye 7-iron?"
    a: "The Callaway Hawk Eye 7-iron has a loft of 33 degrees, with a 62.5 degree lie and a 37 inch standard length."
  - q: "What is the Tungsten Weight Matrix in the Hawk Eye irons?"
    a: "It is a hidden port behind the face filled with dense tungsten spheres. The tungsten sits low in the long irons and higher in the short irons, moving the centre of gravity to suit each club's launch."
  - q: "Are the Callaway Hawk Eye irons titanium?"
    a: "Yes — the heads are cast titanium, roughly half the weight of steel, which let Callaway build a larger head and use the tungsten insert to restore mass where it helps forgiveness."
