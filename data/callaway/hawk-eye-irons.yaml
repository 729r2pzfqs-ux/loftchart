description: >
  The Hawk Eye Tungsten Injected Titanium irons were Callaway's second
  generation of titanium irons, following the Great Big Bertha Tungsten
  Titanium. A hidden weight port behind the impact area holds the Tungsten
  Weight Matrix — dense tungsten spheres placed low in the long irons and
  progressively higher in the short irons to tune launch through the set.
  Lofts are traditional with a 33 degree 7-iron and 46.5 degree pitching
  wedge, and the set was catalogued from 1-iron to lob wedge with
  graphite-led stock shafts.
