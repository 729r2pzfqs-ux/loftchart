description: >
  RAZR X Forged was the elite model of the RAZR X line announced on 20
  January 2011, and the only forged head in it: 1020 carbon steel shaped with
  Callaway's Triple Net Forging process, a shallow cavity back and tightly
  spaced Tour CC grooves. It took over from the 2009 X-Forged and carried its
  loft, lie and length ladder forward unchanged — a 35 degree 7-iron and a
  47 degree pitching wedge from the 2-iron down — adding a 51 degree
  approach wedge. The 2013 X Forged replaced it when the X name returned.
