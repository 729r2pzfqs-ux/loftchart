faq:
  - q: "What is the loft of a Callaway RAZR X Forged 7-iron?"
    a: "The Callaway RAZR X Forged 7-iron has a loft of 35 degrees, a lie of 62 degrees and a 37 inch standard length."
  - q: "Are the Callaway RAZR X Forged irons really forged?"
    a: "Yes. Unlike the cast RAZR X and RAZR X Tour, the RAZR X Forged is 1020 carbon steel shaped with Callaway's Triple Net Forging process."
  - q: "How do RAZR X Forged lofts compare to the X-Forged irons?"
    a: "They are identical to the 2009 X-Forged from the 2-iron through pitching wedge — a 35 degree 7-iron and 47 degree pitching wedge — with a 51 degree approach wedge added to the set."
