description: >
  Announced in 2023 and sold as the '24 model, the Apex Pro combines a
  distance-iron long-iron construction — hollow body, cup face, tungsten low in
  the head — with a compact players shape through the scoring irons. Lofts are
  one degree stronger than the Apex CB in the mid irons and a degree stronger
  again at the pitching wedge: 33 degrees at the 7-iron and 45 at the pitching
  wedge. Figures are the men's standard right-handed steel build.
