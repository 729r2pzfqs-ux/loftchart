faq:
  - q: "What is the loft of a Callaway Apex Pro (2024) 7-iron?"
    a: "The Callaway Apex Pro '24 7-iron has a loft of 33 degrees, a lie of 62.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "When was the Callaway Apex Pro '24 announced?"
    a: "In 2023, alongside the Apex CB and Apex MB, and sold as the 2024 range."
  - q: "Are Apex Pro 21 and Apex Pro '24 lofts the same?"
    a: "In the mid and short irons, yes — both are 33 degrees at the 7-iron and 45 at the pitching wedge. The '24 model strengthens the long irons: 19 degrees at the 3-iron against 20.5."
  - q: "Is the Callaway Apex Pro hollow?"
    a: "In the long irons, yes — a hollow body with a high-strength cup face and tungsten weighting. The scoring irons move to a more conventional forged players build."
