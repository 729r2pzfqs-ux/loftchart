faq:
  - q: "What is the loft of a 2008 Callaway Big Bertha 7-iron?"
    a: "The 2008 Big Bertha 7-iron has a loft of 33 degrees, with a 62.5-degree lie and a 37-inch steel-shaft length."
  - q: "What are Callaway i-brid clubs?"
    a: "The 2008 Big Bertha set was the first Callaway iron line offered with i-brids — hybrid-bodied clubs matching the 3-, 4- and 5-iron lofts (20, 23 and 26 degrees) that could replace the standard long irons in the set."
  - q: "When were the 2008 Big Bertha irons made?"
    a: "They launched in 2008 and were the last classic Big Bertha iron run; Callaway's Diablo Edge replaced them in 2010, and the Big Bertha iron name returned in 2014."
