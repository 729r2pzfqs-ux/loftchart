description: >
  The 2008 Big Bertha irons were the last iron run under the plain Big Bertha
  name before Callaway rested it until 2014. It is a wide-sole,
  heavily-offset cavity back, and the first Callaway set offered with i-brid
  long irons — hybrid-bodied replacements for the 3-, 4- and 5-irons that
  could be mixed into the set at fitting. Lofts are moderate for the period
  with a 33-degree 7-iron and 45-degree pitching wedge, and the lie ladder
  runs notably upright, reaching 65 degrees in the wedges. Specs below are
  the standard iron heads in the men's steel build.
