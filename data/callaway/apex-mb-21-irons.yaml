sources:
  - "2nd Swing Golf specification table for the Callaway Apex MB 21 iron set (https://www.2ndswing.com/golf-clubs/iron-sets/callaway-apex-mb-21-iron-set) — supplied every loft, lie, length, offset and swing weight above, the 4-PW stock set and the 1025 carbon steel forging. The pitching wedge lie is printed as 63.3 degrees and reproduced as published, though it is likely a rounding of Callaway's usual 63.25."
  - "Note on offset: the source publishes offset in millimetres (2.92 mm at the 3-iron down to 1.4 mm at the approach wedge), converted to inches here."
  - "golf.com 'First look: Callaway Apex MB, X Forged CB and X Forged UT irons' (13 October 2020) — announcement date, 29 October 2020 retail date, 1025 carbon steel forging, 20V grooves, the swing-weight screw and the US custom-order-only distribution. year_introduced records the 2020 announcement year per this database's convention; the model was sold as the 2021 line, which is why it is catalogued as the Apex MB 21."
  - "Today's Golfer 'FIRST LOOK! New 2021 Callaway Apex MB irons' (October 2020) — brushed finish, removable tungsten swing-weight screw, and Project X steel / Mitsubishi MMT graphite with Golf Pride Z grips as the standard build."
  - "Note on stock shafts: because US sales were custom-order only, golf.com reported no formal stock shaft. Project X LS and Project X IO steel and Mitsubishi MMT graphite are the builds Today's Golfer and retail listings (Carl's Golfland, GolfClubs4Cash, 2nd Swing) consistently show as the no-upcharge configurations; flex ranges are omitted rather than guessed."
  - "year_discontinued is 2023, the year Callaway announced the successor Apex MB of the 2024 line. Confidence is medium because the per-club figures come from a retailer spec table rather than a Callaway spec sheet."
