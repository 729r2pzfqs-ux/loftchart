description: >
  The Apex MB 21 is the muscleback of Callaway's 2021 line, announced on 13 October
  2020 alongside the X Forged CB and X Forged UT and at retail from 29 October 2020 —
  a 2020 announcement sold and catalogued as the 2021 model. It is forged from 1025
  carbon steel in a brushed finish, with 20V grooves and a removable tungsten screw in
  the back of the head that sets swing weight without moving the centre of gravity.
  Lofts are traditional — a 34-degree 7-iron and 46-degree pitching wedge — and heads
  run 3-iron through a 50-degree approach wedge, with 4-PW the stock set. In the US it
  was sold through custom order only.
