faq:
  - q: "What is the loft of a Callaway Apex MB 21 7-iron?"
    a: "The Callaway Apex MB 21 7-iron has a loft of 34 degrees, a lie of 62.0 degrees and a length of 37.0 inches."
  - q: "When were Callaway Apex MB 21 irons released?"
    a: "Callaway announced them on 13 October 2020 and they reached retail on 29 October 2020, sold as part of the 2021 line — hence the Apex MB 21 name."
  - q: "What is the difference between the Apex MB 21 and the Apex Pro 21?"
    a: "The MB is a one-piece 1025 forging with a tungsten swing-weight screw and no cavity, and its lofts run one degree weaker through the scoring clubs — a 34-degree 7-iron against the Apex Pro 21's 33. The Apex Pro 21 adds hollow long irons, tungsten cores and urethane microspheres."
  - q: "Did the Apex MB 21 come in a stock set?"
    a: "The stock set is 4-PW, with heads available from 3-iron through a 50-degree approach wedge. In the US the model was sold through custom order only."
