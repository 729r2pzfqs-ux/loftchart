faq:
  - q: "What is the loft of a 2014 Callaway Big Bertha 7-iron?"
    a: "The 2014 Big Bertha 7-iron has a loft of 30 degrees, with a 62.5 degree lie and a 37.25 inch standard steel length."
  - q: "What is the loft of the 2014 Big Bertha pitching wedge?"
    a: "The pitching wedge is 44 degrees, followed by a 49 degree A-wedge and a 54 degree sand wedge."
  - q: "Were the 2014 Big Bertha irons hollow?"
    a: "Yes. They were among the first mainstream hollow-bodied game-improvement irons, using a 360 Face Cup with the weld line moved behind the face and an internal standing wave ridge to control the centre of gravity."
  - q: "Are these the same as the 1994 Big Bertha irons?"
    a: "No. The 2014 set revived the name two decades later with a completely different hollow, cup-faced construction. The 1994 original was a conventional cast cavity-back built around the S2H2 hosel."
