description: >
  The 2014 Big Bertha irons revived Callaway's most famous name for a
  distance-focused game-improvement set, announced in September 2014 and sold as the
  2015 line above the X2 Hot. They were among the first mainstream hollow-bodied
  irons, pairing the 360 Face Cup — with the weld line moved behind the face so the
  whole face flexes — with an internal standing wave ridge that positions the centre
  of gravity for launch. Lofts are moderate by modern distance-iron standards, with
  a 30 degree 7-iron and a 44 degree pitching wedge, and Callaway published bounce
  for every club. The chart runs from the 4-iron to a 54 degree sand wedge. Specs
  below are the standard men's steel-shaft numbers.
