sources:
  - "Callaway Demandware ProductSpecs feed (ProductSpecs-Get, product code irons-2015-big-bertha), the manufacturer-authored source behind the View Specs panel on callawaygolf.com, archived 18 September 2015 via web.archive.org — loft, lie, length, offset, bounce and D2 steel / D0 graphite swingweight for the 4-iron through sand wedge, plus the True Temper Speed Step 80 (R/S) and UST Recoil 460 (F2/F3/F4) stock shafts and the RH/LH availability of every head"
  - "Golfalot Callaway Big Bertha irons review (October 2014) — corroborates the 20.5 degree 4-iron, 23 degree 5-iron and 49 degree A-wedge, the 360 Face Cup with relocated weld line, the internal standing wave and the longer-than-X2-Hot standard builds"
  - "Note on naming and years: announced late September 2014 with retail from the end of October 2014, but catalogued by Callaway as the 2015 line (product code irons-2015-big-bertha; the spec sheet is titled 'Mens 2015 Big Bertha'). year_introduced uses the 2014 announcement year per this database's convention. year_discontinued is 2016, when the Big Bertha OS was announced as its replacement."
