description: >
  Rogue ST Pro is the compact head in Callaway's 2022 Rogue ST iron family, sitting
  under the Max, Max OS and Max OS Lite. It keeps the hollow body and tungsten
  weighting of the larger models in a shorter blade with less offset — 4.2 mm at the
  3-iron against the Apex Pro's 3.56 at the same club, but on a much stronger loft
  chart, with a 30.5-degree 7-iron.
