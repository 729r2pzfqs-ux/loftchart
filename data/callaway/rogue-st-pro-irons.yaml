faq:
  - q: "What is the loft of a Callaway Rogue ST Pro 7-iron?"
    a: "The Callaway Rogue ST Pro 7-iron has a loft of 30.5 degrees, a lie of 62.0 degrees and a length of 37.0 inches."
  - q: "When were Callaway Rogue ST Pro irons released?"
    a: "Callaway unveiled the Rogue ST line in January 2022, with pre-orders from 22 January and retail from 18 February 2022."
  - q: "How does the Rogue ST Pro compare with the Apex Pro 21?"
    a: "It is two and a half degrees stronger at the 7-iron — 30.5 against 33 — in a hollow-body distance head rather than a forged players head."
