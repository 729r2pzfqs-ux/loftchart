description: >
  The RAZR X Muscleback is the tour blade of the RAZR era, designed by Roger
  Cleveland with tour input and forged from 1020 carbon steel with a white
  chrome finish, a thin topline, narrow sole and minimal offset. It reached
  golfers in mid-2011 through specialist shops, though it is commonly
  catalogued as a 2012 model because the wide release came later. Lofts are
  traditional — a 35 degree 7-iron and 47 degree pitching wedge — on lies
  several degrees flatter than the cast RAZR X, and the catalogued range ran
  2-iron to pitching wedge with 3-PW the usual set.
