faq:
  - q: "What is the loft of a Callaway RAZR X Muscleback 7-iron?"
    a: "The Callaway RAZR X Muscleback 7-iron has a loft of 35 degrees, a lie of 62 degrees and a standard length of 37 inches."
  - q: "Are Callaway RAZR X Muscleback irons forged?"
    a: "Yes. They are forged from 1020 carbon steel with a white chrome finish, designed by Roger Cleveland for highly skilled players."
  - q: "When were Callaway RAZR X Muscleback irons released?"
    a: "They first reached golfers in mid-2011, though many retailers catalogue them as a 2012 model because the wide release came later."
