faq:
  - q: "What is the loft of a Callaway X Forged CB (2021) 7-iron?"
    a: "The 2021 X Forged CB 7-iron has a loft of 33 degrees, with a 62 degree lie and a 37 inch standard steel length."
  - q: "What is the loft of a Callaway X Forged CB (2021) pitching wedge?"
    a: "The X Forged CB pitching wedge is 45 degrees, with a 49 degree A-wedge below it."
  - q: "When were the 2021 Callaway X Forged CB irons released?"
    a: "Callaway announced them on 13 October 2020 alongside the Apex MB and X Forged UT, with retail from 29 October 2020, marketed as the 2021 line."
  - q: "Is the 2021 X Forged CB a one-piece forging?"
    a: "No. Unusually for a tour cavity back, it combines a forged 1025 mild carbon steel body with internal and external MIM'd tungsten weights and a Tour Tuned face plate."
