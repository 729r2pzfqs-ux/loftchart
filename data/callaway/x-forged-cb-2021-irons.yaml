  - "Callaway Golf Pre-Owned X Forged CB product specs (callawaygolfpreowned.com/iron-sets/irons-2021-x-forged-cb.html) — loft, lie, length, offset (in millimetres) and swingweight for the 3-iron through A-wedge, plus the forged 1025 body, the MIM'd tungsten weighting and the Project X IO / Mitsubishi MMT stock shafts"
  - "2nd Swing Golf Callaway X Forged CB 21 iron set spec table (2ndswing.com/golf-clubs/iron-sets/callaway-x-forged-cb-21-iron-set) — independently matches on every loft, lie, length, offset and swingweight, and lists the 4-PW stock set and Golf Pride Z Grip"
  - "Plugged In Golf 'Callaway Announces New X Forged CB and Apex MB Irons' (14 October 2020) — announcement timing, 29 October 2020 retail date, multi-material construction and Tour Tuned face plate. year_introduced records the 2020 announcement year per this database's convention; the model was sold as the 2021 line."
  - "Note on offset: the sources publish offset in millimetres (3.43 mm at the 3-iron down to 2.03 mm at the A-wedge), converted to inches here. Bounce was not published and is omitted."
  - "Note on year_discontinued: recorded as 2023, the year Callaway announced the Apex CB of the 2024 line, which took over the tour cavity back slot; no later X Forged CB followed. That model's named predecessor is the Apex TCB, so no direct successor is recorded here."
