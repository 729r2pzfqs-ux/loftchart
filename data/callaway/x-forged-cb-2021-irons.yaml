description: >
  The 2021 X Forged CB is Callaway's tour cavity back, announced on 13 October 2020
  alongside the Apex MB and X Forged UT and at retail from 29 October 2020, which is
  why it is catalogued to 2020 here despite the 2021 model name. Unlike the typical
  one-piece forging in this category, it pairs a forged 1025 mild carbon steel body
  with custom internal and external MIM'd tungsten weights that centre the CG behind
  the face, and a Tour Tuned face plate. Lofts are traditional — a 33 degree 7-iron
  and a 45 degree pitching wedge with a 49 degree A-wedge. Specs below are the
  standard men's steel-shaft numbers.
