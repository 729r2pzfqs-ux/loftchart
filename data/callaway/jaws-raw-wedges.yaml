faq:
  - q: "What lofts does the Callaway JAWS Raw come in?"
    a: "48 to 62 degrees — 24 loft, bounce and grind combinations, one of the widest tour-wedge matrices of its generation. Several combinations are right-handed only."
  - q: "What grinds does the JAWS Raw offer?"
    a: "Five: the all-round S at every loft from 48 to 60, the wide high-bounce W (50-60), the high-bounce X (54-60), the low-bounce Z (58-62, the only 62-degree option) and the C grind (54-60)."
  - q: "Why is the JAWS Raw face unplated?"
    a: "Callaway leaves the hitting area raw so no plating interferes with the JAWS groove edges; the face rusts with use while the Chrome or Black Plasma body finish protects the rest of the head."
