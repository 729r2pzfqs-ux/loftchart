material: 8620 carbon steel
predecessor: Callaway JAWS MD5
successor: Callaway Opus
description: >
  The JAWS Raw is Callaway's 2022 tour wedge, announced in June 2022, at
  retail from July 2022 and replaced by the Opus in August 2024. It kept the
  JAWS groove package from the MD5 era and left the face unplated so it
  rusts into play, under Chrome and Black Plasma body finishes. The line is
  unusually broad: 24 loft/bounce/grind combinations from 48 to 62 degrees
  across five grinds, several of them right-hand only. Lengths run from
  35.75 inches at 48 degrees to 35 inches at 58 and up, all at a 64-degree
  lie.
grinds:
  - code: S
    name: S Grind
    description: >
      Callaway's most-played sole — medium width with a slight rear ribbon,
      moderate heel relief and a small leading-edge chamfer. Fits a wide
      variety of conditions and swings, offered at every loft from 48 to 60.
  - code: W
    name: W Grind
    description: >
      Wide, full sole with 12 degrees of bounce — the most forgiving grind
      through the turf, for steeper swings, soft conditions and sand.
  - code: X
    name: X Grind
    description: >
      High-bounce performance on a narrower sole for steep attack angles
      that still want to open the face, at 54 to 60 degrees.
  - code: Z
    name: Z Grind
    description: >
      Forgiving low-bounce option with an aggressive leading-edge chamfer
      for clean turf interaction, at 58 to 62 degrees.
  - code: C
    name: C Grind
    description: >
      Classic low-bounce C shape with heel and toe relief for open-face
      shots from firm lies, at 54 to 60 degrees.
