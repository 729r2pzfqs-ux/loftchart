description: >
  The 2013 X Forged returned the X name to Callaway's forged players iron
  after the RAZR X Forged interlude. Designed by Roger Cleveland and shaped
  with the Triple Net Forging process, it pairs a compact cavity back with
  Progressive Dual Notch weighting and flighted centre-of-gravity placement —
  lower in the long irons, higher in the short irons. Its lofts break from
  the traditional 35 degree 7-iron of the earlier X Forged generations,
  running one degree stronger through the scoring clubs at 34 and 46 degrees,
  and it won a Golf Digest Hot List gold medal in 2013.
