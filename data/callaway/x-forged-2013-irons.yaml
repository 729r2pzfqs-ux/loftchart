faq:
  - q: "What is the loft of a Callaway X Forged (2013) 7-iron?"
    a: "The 2013 Callaway X Forged 7-iron has a loft of 34 degrees, a lie of 62 degrees and a 37 inch standard length."
  - q: "How do the 2013 X Forged lofts compare to earlier X Forged irons?"
    a: "They are one degree stronger through the scoring clubs: a 34 degree 7-iron and 46 degree pitching wedge, against 35 and 47 on the 2007 and 2009 X-Forged and the RAZR X Forged."
  - q: "What shaft did the 2013 Callaway X Forged come with?"
    a: "The stock shaft was the Project X PXi, a lighter-weight version of the Project X, offered in 5.5, 6.0 and 6.5 flexes."
