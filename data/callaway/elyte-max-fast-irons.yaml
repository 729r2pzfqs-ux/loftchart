description: >
  The Max Fast is the ultra-lightweight model of Callaway's 2025 Elyte iron family,
  announced in January 2025 alongside the standard Elyte, the Elyte X and the
  high-launch Elyte HL. It pairs the family's Ai10x Face with Speed Frame construction —
  a frame connecting the body to the topline that stiffens the body while freeing the
  face to flex — and is sold graphite-only with a 40 gram Mitsubishi Vanquish stock
  shaft, C9 swingweights and long builds, including a 39 inch 5-iron, for players who
  need help generating speed. Lofts are one to two degrees stronger than the Paradym
  Ai Smoke Max Fast it replaced — 30 degrees at the 7-iron against 31 — and the chart runs
  5-iron through sand wedge with no 4-iron. Specs below are the standard men's
  graphite build.
