faq:
  - q: "What is the loft of a Callaway Elyte Max Fast 7-iron?"
    a: "The Callaway Elyte Max Fast 7-iron has a loft of 30 degrees, with a 62.25 degree lie and a 37.5 inch graphite length."
  - q: "What is the difference between the Elyte Max Fast and the Paradym Ai Smoke Max Fast?"
    a: "The Elyte Max Fast runs about a degree to two degrees stronger through the set — 30 degrees at the 7-iron against 31 — swaps the Ai Smart Face for the Ai10x Face with Speed Frame construction, and moves to a Mitsubishi Vanquish PL 40 stock shaft. Both are graphite-only, C9-swingweight builds with a 39 inch 5-iron."
  - q: "Who are the Callaway Elyte Max Fast irons for?"
    a: "They are built for players with slower swing speeds: 40 gram graphite shafts, C9 swingweights and clubs built roughly half an inch longer than standard help generate clubhead speed and launch."
