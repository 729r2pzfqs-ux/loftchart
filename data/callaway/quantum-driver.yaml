faq:
  - q: "What lofts does the Callaway Quantum come in?"
    a: "Quantum Max and Max D come in 9, 10.5 and 12 degrees, the Triple Diamond in 8, 9 and 10.5, the Triple Diamond Max in 9 and 10.5, and the Max Fast in 10.5 and 12. There is no plain 'Quantum' head — those five variants are the family."
  - q: "What is the Quantum adjustment chart?"
    a: "Quantum uses Callaway's two-cog OptiFit hosel: four loft positions (−1, stated, +1 and +2 degrees) times two lie positions (Neutral and Draw) for eight settings. On a 10.5 degree head that spans 9.5 to 12.5 degrees."
  - q: "Which Quantum driver should a slicer buy?"
    a: "The Quantum Max D is the dedicated draw head, with heel-rear internal weighting and a more upright 59 degree lie. The Quantum Max in its draw weight-and-hosel settings is the milder alternative that keeps more adjustability."
  - q: "Is the Quantum Max Fast adjustable?"
    a: "Yes — unlike the 2024 Ai Smoke Max Fast, which had a glued hosel, the Quantum Max Fast keeps the full eight-setting OptiFit hosel while still using a 40 gram shaft and light grip."
