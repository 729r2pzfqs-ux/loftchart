description: >
  Quantum is Callaway's 2026 driver family, on pre-order from 16 January and
  at retail from 13 February 2026. Its headline is the Tri-Force Face: a
  titanium striking layer roughly 14% thinner than the Elyte's, bonded to a
  carbon-fibre backing by Callaway's "Poly Mesh" polymer, with the Triple
  Diamond heads carried on a 360° carbon chassis. There is no plain
  "Quantum" head — the family is five variants: the high-MOI Max, the
  compact 450 cc Triple Diamond, the 460 cc Triple Diamond Max for fast
  players who need a little more spin and stability, the draw-biased Max D,
  and the ultralight Max Fast, which unlike its Ai Smoke ancestor keeps the
  adjustable OptiFit hosel.
variants:
  - name: Quantum Max
    head_cc: 460
    description: >
      The core high-MOI head for the broadest range of players, with a 10 g
      adjustable back weight (neutral or draw) plus a front port. The 12°
      head is left-hand custom only; a women's build runs 1.25 inches shorter
      with the Eldio 40 L shaft.
  - name: Quantum Triple Diamond
    head_cc: 450
    description: >
      The compact tour head for high-speed, high-spin players — more neutral
      at address than past Triple Diamonds, with a movable rear-heel weight
      that can shift toward the toe for fade bias. 8° is right-hand only.
  - name: Quantum Triple Diamond Max
    head_cc: 460
    description: >
      The Triple Diamond shape and weighting scaled up to 460 cc — for fast
      players who want the TD's flight with slightly more spin and
      forgiveness.
  - name: Quantum Max D
    head_cc: 460
    description: >
      The draw-bias head, built with internal heel-rear weighting rather than
      a movable draw weight. The 12° head is right-hand only.
  - name: Quantum Max Fast
    head_cc: 460
    description: >
      The ultralight build — 40-gram shaft and light grip — for slower swing
      speeds, and the first Max Fast generation to keep the adjustable
      OptiFit hosel. Right-hand only.
