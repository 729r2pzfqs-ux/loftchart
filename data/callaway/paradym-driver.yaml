description: >
  The Paradym is Callaway's 2023 driver family and the first with a 360°
  Carbon Chassis: a Triaxial Carbon crown and Forged Carbon sole replace the
  titanium body entirely, freeing mass that an A.I.-designed forged titanium
  FS2S face and Jailbreak A.I. bracing turn into speed and stability. The
  core Paradym carries a 15 g sliding perimeter weight worth roughly a dozen
  yards of draw-to-fade correction; the Paradym X is the stretched,
  higher-launching forgiveness head with a fixed weight; and the 450 cc
  Triple Diamond is the compact tour head with front/back interchangeable
  weighting. The Ai Smoke generation replaced it in 2024, and the Paradym is
  now one of the better value buys on the used premium-driver market.
variants:
  - name: Paradym
    head_cc: 460
    description: >
      The core head with a 15 g sliding rear perimeter weight for draw,
      neutral or fade bias — about 12 yards of shot-shape swing on average.
  - name: Paradym X
    head_cc: 460
    description: >
      The most forgiving head: a stretched profile, higher launch and slight
      draw bias with fixed weighting and the most upright lie in the family.
      Also the basis of the women's build with the Aldila Ascent PL 40.
  - name: Paradym Triple Diamond
    head_cc: 450
    description: >
      The compact tour head for low spin and low launch with a neutral
      flight; weighting swaps between front and back ports.
