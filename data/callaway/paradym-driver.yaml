faq:
  - q: "What lofts does the Callaway Paradym come in?"
    a: "The Paradym and Paradym X come in 9, 10.5 and 12 degrees; the Paradym Triple Diamond in 8, 9 and 10.5."
  - q: "How do you adjust a Callaway Paradym driver?"
    a: "With the two-cog OptiFit hosel: the loft cog plays −1, stated, +1 or +2 degrees and the lie cog sits in Neutral or Draw, giving eight combinations. A 10.5 degree head spans 9.5 to 12.5 degrees."
  - q: "What is the difference between the Paradym and Paradym X?"
    a: "The core Paradym has a 15 gram sliding weight for draw-to-fade tuning at a 57 degree lie; the Paradym X is larger-profiled, higher-launching and slightly draw-biased with fixed weighting and a 60 degree lie."
  - q: "Is the Callaway Paradym still in production?"
    a: "No — it was replaced by the Paradym Ai Smoke in 2024. It remains plentiful used, where its 360° Carbon Chassis construction makes it a strong value against newer lines."
