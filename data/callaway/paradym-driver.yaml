hosel:
  system: "OptiFit hosel"
  loft_range: "−1° to +2°"
  positions: 8
  lie_effect: >
    The lie cog has two positions: N (neutral, the stated lie) and D (draw, a
    more upright lie — Callaway does not publish the degree change).
  face_note: >
    Changing loft re-orients the head on the shaft, so lower settings sit
    slightly open and higher settings slightly closed at address.
  notes: >
    The two-cog OptiFit design introduced here carried unchanged into the Ai
    Smoke, Elyte and Quantum generations. On a 10.5° head the four loft
    positions play 9.5°, 10.5°, 11.5° and 12.5°.
  settings:
    - { setting: "−1 / N", loft: "−1°", lie: "neutral" }
    - { setting: "−1 / D", loft: "−1°", lie: "draw (more upright)" }
    - { setting: "S / N", loft: "std", lie: "neutral" }
    - { setting: "S / D", loft: "std", lie: "draw (more upright)" }
    - { setting: "+1 / N", loft: "+1°", lie: "neutral" }
    - { setting: "+1 / D", loft: "+1°", lie: "draw (more upright)" }
    - { setting: "+2 / N", loft: "+2°", lie: "neutral" }
    - { setting: "+2 / D", loft: "+2°", lie: "draw (more upright)" }
