description: >
  Unveiled at the Golf Europe show in October 2008 as a 2009 model alongside
  the X-22 and X-22 Tour, the 2009 X-Forged refined the 2007 original after
  feedback from Callaway's tour players: more bounce and camber, a tighter
  sole radius and a cleaner, more classical look. The loft, lie and length
  ladder is unchanged from the 2007 model — a 35 degree 7-iron and a 47
  degree pitching wedge — but the bounce progression is a degree or two
  stronger through most of the set, running from 2 degrees at the 2-iron to
  10 at the wedge.
