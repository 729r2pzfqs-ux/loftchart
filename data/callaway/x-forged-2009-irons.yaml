faq:
  - q: "What is the loft of a Callaway X Forged (2009) 7-iron?"
    a: "The 2009 Callaway X-Forged 7-iron has a loft of 35 degrees, a lie of 62 degrees and a 37 inch standard length."
  - q: "What changed between the 2007 and 2009 Callaway X-Forged irons?"
    a: "Lofts, lies and lengths are identical. The 2009 model added bounce and camber with a tighter sole radius after tour player feedback — the bounce ladder runs 2 to 10 degrees against 2 to 8 on the 2007 model."
  - q: "When was the 2009 Callaway X-Forged released?"
    a: "It was unveiled at the Golf Europe show in October 2008 and sold as a 2009 model, remaining current until the RAZR X Forged replaced it in 2011."
