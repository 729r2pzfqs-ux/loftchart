faq:
  - q: "What is the loft of a Callaway X-20 Tour 7-iron?"
    a: "The Callaway X-20 Tour 7-iron has a loft of 34 degrees, a lie of 62 degrees and a 37 inch standard length."
  - q: "What is the difference between the X-20 and the X-20 Tour?"
    a: "The X-20 Tour has a shorter blade, narrower sole, thinner top line and square toe, with lofts one degree weaker through the scoring clubs — a 34 degree 7-iron against 33 — and flatter short-iron lies (63.5 degrees at the pitching wedge against 65)."
  - q: "Is the Callaway X-20 Tour forged?"
    a: "No. Like the standard X-20 it is investment cast stainless steel; Callaway's forged iron of that generation was the 2007 X-Forged."
