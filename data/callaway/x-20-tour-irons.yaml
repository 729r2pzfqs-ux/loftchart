description: >
  The X-20 Tour is the better-player version of the 2007 X-20, with a shorter
  blade, narrower sole, thinner top line and a square toe for workability
  while keeping the perimeter weighting of the standard head. Its lofts sit
  one degree weaker than the X-20 through the scoring clubs — a 34 degree
  7-iron and 46 degree pitching wedge against 33 and 45 — with flatter lies
  in the short irons and a low 1 to 7 degree bounce ladder. A 2-iron was
  catalogued, which the standard X-20 did not offer at retail.
