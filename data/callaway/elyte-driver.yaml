faq:
  - q: "What lofts does the Callaway Elyte come in?"
    a: "The Elyte and Elyte X come in 9, 10.5 and 12 degrees (X 12 right-hand only), the Elyte Triple Diamond in 8, 9 and 10.5 (8 right-hand only), and the Elyte Max Fast in 10.5 and 12."
  - q: "What is the Elyte adjustment chart?"
    a: "The Elyte uses Callaway's two-cog OptiFit hosel: loft positions of −1, stated, +1 and +2 degrees, each combined with a Neutral or Draw lie cog, for eight settings in all. A 10.5 degree head spans 9.5 to 12.5 degrees."
  - q: "What is the difference between the Elyte and Elyte X?"
    a: "The Elyte is the neutral all-rounder whose 13 gram perimeter weight reaches draw, neutral and fade settings; the Elyte X is bigger-footprinted, higher launching and slightly draw-biased, with a more upright 59 degree lie and no fade setting."
  - q: "Is the Callaway Elyte still in production?"
    a: "Callaway replaced it with the Quantum family in February 2026, so the Elyte is at the end of its retail life — widely available at closeout prices and on the used market, where it is the value pick of the two generations."
