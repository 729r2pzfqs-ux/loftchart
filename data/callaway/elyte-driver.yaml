description: >
  The Elyte is Callaway's 2025 driver family, launched in January 2025 as the
  follow-up to the Paradym Ai Smoke. Its face is the Ai 10x — designed with
  ten times more AI control points than the Ai Smoke's Smart Face — under a
  Thermoforged Carbon crown that saves the paint and overlapping-ply weight
  of a conventional carbon layup. The core Elyte and the Elyte X carry a 13 g
  movable perimeter weight, the 450 cc Triple Diamond is the low-spin tour
  head, and the Max Fast is the ultralight build, which this generation got
  its adjustable OptiFit hosel back. Mid-2025 line extensions added a Triple
  Diamond Max and a limited Triple Diamond Tour Draw. The Quantum family
  replaced the Elyte in February 2026, making it the closeout value pick.
variants:
  - name: Elyte
    head_cc: 460
    description: >
      The mainline head balancing speed and forgiveness, with a 13 g movable
      perimeter weight offering draw, neutral and fade settings.
  - name: Elyte X
    head_cc: 460
    description: >
      The highest-launching, most forgiving head with slight draw bias; its
      13 g weight offers neutral and draw settings only. The 12° head is
      right-hand only; a women's build runs one inch shorter with the Eldio
      40 L shaft.
  - name: Elyte Triple Diamond
    head_cc: 450
    description: >
      The compact low-spin tour head with neutral-to-fade bias. 8° is
      right-hand only.
  - name: Elyte Max Fast
    head_cc: 460
    description: >
      The ultralight high-launch build for slower swing speeds — Vanquish PL
      40 shaft and a 25 g grip — with the adjustable OptiFit hosel restored
      after the Ai Smoke generation dropped it.
