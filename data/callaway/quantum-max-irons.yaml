description: >
  Quantum Max is the core game-improvement iron in Callaway's 2026 Quantum family,
  which replaced the Elyte line. Callaway announced the family on 16 January 2026
  and the irons reached US retail on 27 February 2026. The head is a two-piece
  design whose Modern 360° Undercut cavity fully exposes the undercut for perimeter
  weighting and added face flex, with urethane microspheres for sound and a
  next-generation Ai-optimized face. Lofts carry over from the Elyte exactly — 29
  degrees at the 7-iron and a 42-degree pitching wedge — and the chart runs 4-iron
  through a 55-degree sand wedge in right and left hand. An HL spec is offered that
  adds two degrees of loft at every head (31-degree 7-iron) for higher launch; the
  figures below are the standard spec, men's steel build.
