faq:
  - q: "What is the loft of a Callaway Quantum Max 7-iron?"
    a: "The Callaway Quantum Max 7-iron has a loft of 29 degrees, a lie of 62.25 degrees and a steel-shaft length of 37.25 inches. The optional HL spec raises the 7-iron loft to 31 degrees."
  - q: "When did the Callaway Quantum Max irons come out?"
    a: "Callaway announced the Quantum family on 16 January 2026 and the irons reached US retail on 27 February 2026, replacing the Elyte line."
  - q: "Are Quantum Max lofts different from the Elyte?"
    a: "No — the chart is identical, 19 degrees at the 4-iron through a 42-degree pitching wedge and 55-degree sand wedge. Lie angles moved fractionally flatter (62.25 against 62.5 at the 7-iron) and the sand wedge is now 35.25 inches rather than 35.5."
  - q: "What is the difference between the Quantum Max and Quantum Max OS irons?"
    a: "They share the same loft, lie and length chart. The Max OS is the super-game-improvement version with an oversized head and noticeably more offset — 4.80 mm at the 7-iron against 3.71 mm — and both are offered in an HL spec two degrees weaker throughout."
