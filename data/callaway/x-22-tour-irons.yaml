faq:
  - q: "What is the loft of a Callaway X-22 Tour 7-iron?"
    a: "The Callaway X-22 Tour 7-iron has a loft of 34 degrees, a lie of 62 degrees and a 37 inch standard length."
  - q: "What is the difference between the X-22 and the X-22 Tour?"
    a: "The X-22 Tour has a smaller head, thinner top line, less offset and lofts one degree weaker through the scoring clubs — a 34 degree 7-iron against 33 — with much flatter short-iron lies: 63.5 degrees at the pitching wedge against 65 on the standard X-22."
  - q: "When was the Callaway X-22 Tour released?"
    a: "It was unveiled at the Golf Europe show in October 2008 and sold as a 2009 model, a season after the standard X-22 reached retail."
