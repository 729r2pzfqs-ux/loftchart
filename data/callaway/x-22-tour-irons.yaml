description: >
  The X-22 Tour is the compact, better-player version of the X-22, unveiled
  at the Golf Europe show in October 2008 as a 2009 model alongside the 2009
  X-Forged. It keeps the notched perimeter weighting of the standard head on
  a smaller profile with a thinner top line, less offset and a sleeker hosel
  that lowers the centre of gravity. Lofts run one degree weaker than the
  standard X-22 through the scoring clubs, with a 34 degree 7-iron and a 46
  degree pitching wedge, and the lie ladder tops out at a flat 63.5 degrees
  rather than the standard model's 65.
