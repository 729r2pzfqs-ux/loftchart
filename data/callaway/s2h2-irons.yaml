faq:
  - q: "What is the loft of a Callaway S2H2 7-iron?"
    a: "The Callaway S2H2 7-iron has a loft of 34 degrees, with a 61 degree lie and a 37 inch standard length."
  - q: "What does S2H2 stand for on Callaway irons?"
    a: "Short, Straight, Hollow Hosel — the shortened hollow hosel lets the shaft run to the sole and moves the weight saved from the neck into the clubhead. The design debuted on these irons in 1988 and was carried into Callaway's woods and the Big Bertha era."
  - q: "When were the Callaway S2H2 irons made?"
    a: "Callaway introduced the S2H2 irons in 1988, its first iron line under the Callaway Golf name, and sold them until the original Big Bertha irons arrived in 1994."
