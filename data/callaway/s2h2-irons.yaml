description: >
  The S2H2 irons were Callaway's first modern iron line and the debut of the
  Short, Straight, Hollow Hosel that defined the company's designs for a
  decade: the shaft runs through a hollowed bore to the sole, and the weight
  saved from the neck is moved into the head. Introduced in 1988 and sold
  into the early 1990s, they carry a notably flat lie ladder for a Callaway
  (61 degrees at the 7-iron) and traditional lofts with a 34 degree 7-iron
  and 48 degree pitching wedge. The Big Bertha irons replaced them in 1994.
