description: >
  The Great Big Bertha Tungsten Titanium irons of 1997 were Callaway's first
  titanium irons, pairing a large cast titanium head with a dense tungsten
  insert set low in the deep cavity to keep the centre of gravity down.
  The loft ladder matches the steel Big Bertha irons of the era — 33 degree
  7-iron, 46.5 degree pitching wedge — with Callaway's typically upright
  65 degree wedge lies. They were premium-priced clubs sold mainly with the
  RCH 96 graphite shaft, and were replaced by the Hawk Eye titanium irons.
