faq:
  - q: "What is the loft of a Callaway Great Big Bertha Tungsten Titanium 7-iron?"
    a: "The Great Big Bertha Tungsten Titanium 7-iron has a loft of 33 degrees, with a 62.5 degree lie and a published length of 37 inches."
  - q: "When did the Callaway Great Big Bertha Tungsten Titanium irons come out?"
    a: "They launched in 1997 as Callaway's first titanium irons and were replaced by the Hawk Eye Tungsten Injected Titanium irons."
  - q: "Why do the Great Big Bertha irons combine tungsten and titanium?"
    a: "Titanium is about half the weight of steel, so the head could be made much larger; the dense tungsten insert then concentrates mass low in the cavity to lower the centre of gravity and raise launch."
