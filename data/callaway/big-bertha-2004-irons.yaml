faq:
  - q: "What is the loft of a 2004 Callaway Big Bertha 7-iron?"
    a: "The 2004 Callaway Big Bertha 7-iron is 33 degrees, with a 62.5 degree lie and a 37 inch standard steel length."
  - q: "What changed between the 2002 and 2004 Big Bertha irons?"
    a: "The 2004 set is a degree weaker at every club — a 33 degree 7-iron against 34 and a 17 degree 2-iron against 18 — and Callaway published a bounce ladder for it, running from 0 degrees at the 2-iron to 12 at the sand wedge."
  - q: "What wedges came with the 2004 Callaway Big Bertha irons?"
    a: "A 45 degree pitching wedge, a 50 degree W wedge (an approach wedge), a 55 degree sand wedge and a 60 degree lob wedge."
