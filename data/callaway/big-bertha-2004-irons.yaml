description: >
  The 2004 Big Bertha irons replaced the 2002 set and softened the ladder by
  a degree at every club — a 33 degree 7-iron against 34 and a 45 degree
  pitching wedge against 46 — while keeping the upright 65 degree wedge lies
  and the 35.75 inch pitching wedge of the 2002 model. Every iron head has
  the same wide sole width to keep the centre of gravity low and deep across
  the set. The catalogued range ran 2-iron to lob wedge including a 50 degree
  W wedge, recorded here as AW, and the recorded swing weights are the steel
  build with graphite two to three points lighter.
