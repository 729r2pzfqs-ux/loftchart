description: >
  RAZR X HL is the high-launch companion to the 2011 RAZR X, a cast
  game-improvement iron whose centre of gravity sits lower and deeper so
  shots struck low on the face still climb to full height. Lofts are
  identical to the standard RAZR X — a 32 degree 7-iron and 44 degree
  pitching wedge — but every lie is half a degree more upright, the bounce
  ladder runs higher, and the sand wedge carries a heavy 17 degrees of
  bounce. It was aimed at slower-swinging players who want the RAZR X look
  with more help getting the ball airborne.
