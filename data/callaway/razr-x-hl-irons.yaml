faq:
  - q: "What is the loft of a Callaway RAZR X HL 7-iron?"
    a: "The Callaway RAZR X HL 7-iron has a loft of 32 degrees, a lie of 62.5 degrees and a 37 inch standard length."
  - q: "What is the difference between the RAZR X and the RAZR X HL?"
    a: "Lofts are the same, but the HL's centre of gravity is lower and deeper for a higher launch, every lie is half a degree more upright, and the bounce ladder runs higher — the sand wedge carries 17 degrees."
  - q: "Who are the Callaway RAZR X HL irons for?"
    a: "Golfers with moderate swing speeds who struggle to flight the ball. The HL launches shots higher than the standard RAZR X, even on impacts low on the face."
