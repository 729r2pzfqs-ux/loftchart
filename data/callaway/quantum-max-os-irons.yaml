description: >
  Quantum Max OS is the super-game-improvement model in Callaway's 2026 Quantum iron
  family, announced on 16 January 2026 and at US retail from 27 February 2026. It
  uses the same two-piece Modern 360° Undercut cavity construction, Progressive
  Tri-Sole and Ai-optimized face as the standard Quantum Max, but in an oversized,
  higher-launching head with considerably more offset — 4.80 mm at the 7-iron
  against the Max's 3.71 mm. The loft, lie and length chart is identical to the
  Quantum Max: 29 degrees at the 7-iron, a 42-degree pitching wedge, and heads from
  the 4-iron to a 55-degree sand wedge in right and left hand. An HL spec adds two
  degrees of loft at every head, and Callaway publishes a separate women's length
  column one inch shorter per club. The figures below are the standard-spec men's
  steel build.
