faq:
  - q: "What is the loft of a Callaway Quantum Max OS 7-iron?"
    a: "The Callaway Quantum Max OS 7-iron has a loft of 29 degrees, a lie of 62.25 degrees and a steel-shaft length of 37.25 inches. The optional HL spec raises the 7-iron to 31 degrees."
  - q: "What is the difference between the Quantum Max OS and the standard Quantum Max?"
    a: "The lofts, lies and lengths are identical. The Max OS is oversized with more offset — 4.80 mm (0.189 in) at the 7-iron against the Max's 3.71 mm (0.146 in) — and is aimed at players wanting maximum forgiveness and launch."
  - q: "What is the Quantum Max OS HL spec?"
    a: "A factory option that adds two degrees of loft to every head — 21 degrees at the 4-iron through a 57-degree sand wedge — for higher launch at slower swing speeds."
  - q: "What clubs come in a Callaway Quantum Max OS set?"
    a: "Callaway publishes the chart from the 4-iron to a 55-degree sand wedge, ten heads in total, all available right and left handed."
