description: >
  Elyte is Callaway's 2025 iron and replaces the Paradym Ai Smoke. It pairs the
  Ai 10x face — Callaway's name for a face model built from ten times as many
  control points as the Ai Smart Face it follows — with a Speed Frame body and
  urethane microspheres for sound. Lofts move a degree weaker than the Ai Smoke
  in the mid irons, 29 degrees at the 7-iron against 28, while the pitching
  wedge stays at 42. The set is sold 4-SW. Figures are the men's standard build.
