faq:
  - q: "What is the loft of a Callaway Elyte 7-iron?"
    a: "The Callaway Elyte 7-iron has a loft of 29 degrees, a lie of 62.5 degrees and a steel-shaft length of 37.25 inches."
  - q: "When did the Callaway Elyte irons come out?"
    a: "2025, replacing the Paradym Ai Smoke."
  - q: "Are Elyte lofts weaker than the Paradym Ai Smoke?"
    a: "Slightly, in the mid irons — 29 degrees at the 7-iron against 28, and 33 at the 8-iron against 32. The long irons and the 42-degree pitching wedge are unchanged."
  - q: "How many clubs are in a Callaway Elyte set?"
    a: "Callaway publishes the chart from the 4-iron to a 55-degree sand wedge, ten heads in total, with the 4-PW the usual retail build."
