description: >
  The Diablo Edge was Callaway's maximum-forgiveness iron of 2010, announced on
  11 January 2010 and at retail from 15 January, positioned below the X-Series and
  sold alongside the compact Diablo Forged. It combines VFT face technology with a
  360-degree undercut channel and a low, deep centre of gravity that puts the sweet
  spot in line with where most amateurs actually strike the face, over a wide
  Solid Impact sole. Lofts are a degree stronger than the X-24 Hot through the middle
  of the set — a 32 degree 7-iron and a 44 degree pitching wedge — in a deep 3-LW
  chart. Specs below are the standard men's steel-shaft numbers; the graphite build
  is swingweighted lighter at D0 to D3.
