faq:
  - q: "What is the loft of a Callaway Diablo Edge 7-iron?"
    a: "The Callaway Diablo Edge 7-iron has a loft of 32 degrees, with a 62.5 degree lie and a 37 inch standard steel length."
  - q: "What is the loft of a Callaway Diablo Edge pitching wedge?"
    a: "The Diablo Edge pitching wedge is 44 degrees, with a 49 degree A-wedge, a 54 degree sand wedge and a 59 degree lob wedge."
  - q: "When were Callaway Diablo Edge irons released?"
    a: "Callaway announced them on 11 January 2010 and they reached retail on 15 January 2010, at $599 for a steel-shafted set."
  - q: "Are the Diablo Edge irons forged?"
    a: "No. The Diablo Edge is a cast stainless steel game-improvement iron; the forged model sold alongside it was the separate Diablo Forged."
