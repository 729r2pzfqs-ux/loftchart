faq:
  - q: "What is the loft of a Callaway Apex Ai150 7-iron?"
    a: "The Callaway Apex Ai150 7-iron has a loft of 31 degrees, a lie of 62.0 degrees and a steel-shaft length of 37.00 inches."
  - q: "When did the Callaway Apex Ai150 irons come out?"
    a: "Callaway launched them in July 2025, with pre-orders from 10 July and retail from 25 July 2025, as the replacement for the Apex Pro."
  - q: "Are Apex Ai150 lofts stronger than the Apex Pro?"
    a: "Yes. The Ai150 is two degrees stronger through the middle of the set, 31 degrees at the 7-iron against 33 on the Apex Pro '24, and one degree stronger at the pitching wedge, 44 degrees against 45."
  - q: "What is the difference between the Apex Ai150 and the Apex Ai200?"
    a: "The Ai150 is the more compact of the two and its lofts are a degree weaker: 31 degrees at the 7-iron and 44 at the pitching wedge, against 30 and 43 on the Ai200. It also carries less offset, 0.093 inches at the 7-iron against 0.122."
