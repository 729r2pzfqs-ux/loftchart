description: >
  The Apex Ai150 is the compact players-distance iron in Callaway's Apex Ai
  range, launched in July 2025 as the replacement for the Apex Pro, with
  pre-orders from 10 July and retail from 25 July 2025. It is a forged 1025
  hollow body with a 455 face cup in the 3- to 7-irons and a 17-4 face from the
  8-iron down, and uses the Ai10x face. Lofts are two degrees stronger than the
  Apex Pro through the middle of the set, 31 degrees at the 7-iron against 33,
  and one degree weaker than the Apex Ai200, with a 44-degree pitching wedge.
  Figures are the men's standard right-handed steel build; the 3-iron is made
  right-handed only, and swing weight and bounce are not published.
