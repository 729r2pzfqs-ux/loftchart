sources:
  - "callawaygolf.com Apex Ai150 Irons product page specification table (https://www.callawaygolf.com/golf-clubs/irons/irons-2025-apex-ai150.html, retrieved 29 September 2026) — loft, lie, length and offset (in millimetres, to one decimal) for the 3-iron through approach wedge, the 3-iron listed RH only, the True Temper Dynamic Gold MID 115 steel stock shaft and the Golf Pride Z Grip Grey Cap (46g) grip. Callaway's European product page carries the identical table (https://eu.callawaygolf.com/en/gb/golf-clubs/iron-sets/irons-2025-apex-ai150.html)."
  - "Callaway Apex Ai150 sell sheet (https://callawaymedia.com/wp-content/uploads/2025/06/2025-Apex-Ai-150-Sell-Sheet.pdf, retrieved 29 September 2026) — the same lofts, lies and lengths for the 3-iron through pitching wedge, offset in millimetres to two decimals (3.35, 3.18, 3, 2.72, 2.36, 2.01, 1.65, 1.52, 1.4), the construction (1025 forged hollow body, 455 face cup 3i-7i, 17-4 face 8i-W) and both stock shafts. The offsets recorded here are these two-decimal figures converted to inches (mm / 25.4); the product page rounds the same figures to one decimal."
  - "Conflict on the approach wedge loft: both Callaway product pages give 49 degrees, while the sell sheet and Callaway's 2026 club spec chart PDF (https://callawaymedia.com/wp-content/uploads/2026/02/2026_Club-Spec-Charts_final.pdf) give 48 degrees. Every other figure agrees across all four documents. 49 degrees is recorded, following the live product pages, which are where the club is sold and configured."
  - "golf.com 'Callaway Apex Ai150 irons: 4 things to know', published 10 July 2025 (https://golf.com/gear/irons/callaway-apex-ai150-irons-4-things-know/) — the announcement date used for year_introduced, pre-orders from 10 July 2025 and retail from 25 July 2025, the Ai150 as the replacement for the Apex Pro, and a matching 7-iron of 31 degrees, 62-degree lie and 37 inches. Callaway's media page (https://callawaymedia.com/portfolio/apex-ai150-irons/) gives the same pre-sale and retail dates."
  - "Note: bounce and swing weight are not published in any of the Callaway documents consulted and are omitted rather than estimated."
  - "Status check, 29 September 2026: confirmed as a current model with no replacement announced. On sale at full price (1,649.99 dollars) on Callaway's own product page (https://www.callawaygolf.com/golf-clubs/irons/irons-2025-apex-ai150.html) and listed on Callaway Europe's iron sets page (https://eu.callawaygolf.com/en/gb/golf-clubs/iron-sets/)."
