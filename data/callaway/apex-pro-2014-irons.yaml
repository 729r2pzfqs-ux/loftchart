faq:
  - q: "What is the loft of a Callaway Apex Pro (2014) 7-iron?"
    a: "The original Callaway Apex Pro 7-iron has a loft of 33 degrees, with a 62 degree lie and a 37 inch standard steel length."
  - q: "What is the loft of a Callaway Apex Pro (2014) pitching wedge?"
    a: "The 2014 Apex Pro pitching wedge is 46 degrees, with a 51 degree A-wedge below it."
  - q: "How do the 2014 Apex Pro lofts compare with the 2014 Apex?"
    a: "The Pro is weaker in the scoring clubs — a 33 degree 7-iron against 31, and a 46 degree pitching wedge against 45 — with the gap coming from its traditional players loft chart."
  - q: "Was the 2014 Callaway Apex Pro available in a 2-iron?"
    a: "Yes. The published chart ran from an 18 degree 2-iron to a 51 degree A-wedge, although the standard set make-up was 3-PW."
