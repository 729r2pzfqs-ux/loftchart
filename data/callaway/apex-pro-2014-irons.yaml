description: >
  The original Apex Pro is the compact players iron Callaway sold alongside the 2014
  Apex, announced in November 2013 and at retail in early 2014. It is a one-piece
  forging from soft 1020 carbon steel with high-density tungsten weights in the soles
  of the 2 through 5 irons for easier launch, a soft polymer insert behind the lower
  face, and a face 17 percent thinner than the preceding X Forged. Lofts are
  traditional — a 33 degree 7-iron and a 46 degree pitching wedge — and the chart ran
  from an 18 degree 2-iron to a 51 degree A-wedge around the standard 3-PW set.
  Specs below are the standard men's steel-shaft numbers.
