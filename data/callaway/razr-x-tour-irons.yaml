faq:
  - q: "What is the loft of a Callaway RAZR X Tour 7-iron?"
    a: "The Callaway RAZR X Tour 7-iron has a loft of 33 degrees, a lie of 62 degrees and a 37 inch standard length."
  - q: "What is the difference between the RAZR X and the RAZR X Tour?"
    a: "The RAZR X Tour has a more compact head with lofts a degree weaker through most of the set — a 33 degree 7-iron against 32 — and flatter short-iron lies of 63.5 degrees against 65 on the standard RAZR X."
  - q: "Is the Callaway RAZR X Tour forged?"
    a: "No, it is a cast stainless steel head. The forged iron in the 2011 RAZR line was the RAZR X Forged, a separate model with its own specifications."
