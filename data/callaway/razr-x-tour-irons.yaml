description: >
  RAZR X Tour was the better-player model in the RAZR X line Callaway
  announced on 20 January 2011, sitting between the game-improvement RAZR X
  and the forged RAZR X Forged. It is a cast iron for low-to-mid handicap
  players, with a more compact head than the RAZR X and lofts a degree
  weaker through most of the set — a 33 degree 7-iron and 45 degree pitching
  wedge — on the same 63.5 degree short-iron lie plane as Callaway's earlier
  Tour models rather than the upright 65 degrees of the standard head. A 50
  degree approach wedge extended the set.
