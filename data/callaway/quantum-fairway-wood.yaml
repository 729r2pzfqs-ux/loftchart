hosel:
  system: "OptiFit 4"
  loft_range: "7 loft/lie configurations"
  notes: >
    OptiFit 4 replaces the long-running two-cog OptiFit on the Quantum
    woods: a multi-cog system whose two rotating cogs each have three
    settings (+, − and neutral), giving seven unique loft and lie
    configurations with independent loft and lie movement — including, for
    the first time on a Callaway fairway, flat as well as upright lie
    settings of up to 2°. Callaway publishes the system as +/− markings
    rather than a degree-by-degree chart, so no settings table is
    reproduced here. Only the heads marked adjustable carry the hosel
    (generally the 3-wood, 3HL and 5-wood of each model); higher lofts are
    bonded.
