faq:
  - q: "What lofts do the Callaway Quantum fairway woods come in?"
    a: "The Quantum Max comes in 15, 16.5, 18, 21, 24 and 27 degrees plus the 20 degree Heavenwood; the Max D in 15, 16.5, 18 and 21.5; the Max Fast in 16, 19, 22 and 25; the Triple Diamond in 15, 18 and 21; and the Quantum Ti in 15 and 18."
  - q: "Are the Callaway Quantum fairway woods adjustable?"
    a: "The lower lofts are. The 3-wood, 3HL and 5-wood heads carry the new OptiFit 4 hosel — seven loft and lie configurations with up to 2 degrees of upright or flat lie — while the higher lofts are bonded. The Quantum Ti adds heel-toe weight adjustability."
  - q: "What is the difference between the Quantum Max and Quantum Triple Diamond fairway woods?"
    a: "The Max is the high-launch forgiveness head in seven lofts with 57-60 degree lies. The Triple Diamond is the compact tour head with a deeper face, much flatter 55-56 degree lies and a Ventus Black stock shaft, in three lofts."
  - q: "What replaced the Callaway Elyte fairway woods?"
    a: "These — the Quantum fairway woods replaced the Elyte line at retail on 13 February 2026."
