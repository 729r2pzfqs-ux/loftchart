description: >
  The Quantum fairway woods reached retail on 13 February 2026 with the
  Quantum hybrids, replacing the Elyte line. Callaway moved its tungsten
  Speed Wave weight to a heavier 40 g second-generation version, added a
  Step Sole for turf interaction, and swapped the two-cog OptiFit for the
  new multi-cog OptiFit 4 hosel on the adjustable heads. Five models cover
  the range: the core Quantum Max in seven lofts including the 20°
  Heavenwood, the draw-biased Quantum Max D, the ultralight Quantum Max
  Fast, the compact Quantum Triple Diamond tour head, and the premium
  full-titanium Quantum Ti.
variants:
  - name: Quantum Max
    description: >
      The core head for easy, high launch and forgiveness, in seven lofts
      from a 160 cc 3-wood to a 125 cc 11-wood, including the 20°
      Heavenwood. The 3-wood, 3HL and 5-wood carry the OptiFit 4 hosel; the
      rest are bonded. The 3HL, Heavenwood, 9-wood and 11-wood are
      right-hand only.
  - name: Quantum Max D
    description: >
      The draw-biased forgiveness head on a larger 190 cc 3-wood footprint
      with more upright lies. Four lofts, with the OptiFit 4 hosel on all
      but the bonded 21.5° 7-wood; the 3HL and 7-wood are right-hand only.
  - name: Quantum Max Fast
    description: >
      The lightest build in the line for moderate swing speeds — 40 g class
      Vanquish stock shaft and a shallow, high-MOI head — in four
      half-club-weak lofts from 16°, right-hand only, with the hosel on the
      3- and 5-woods. A women's Eldio-shafted build is also offered.
  - name: Quantum Triple Diamond
    description: >
      The compact tour head with flat 55-56° lies and a deeper face, in
      three lofts with the hosel on the 15° and 18° heads; the 21° 7-wood is
      bonded and right-hand only.
  - name: Quantum Ti
    description: >
      The premium full-titanium model with heel-toe weight adjustability on
      top of the OptiFit 4 hosel, in 15° and 18° (the 5-wood left-handed by
      custom order only).
