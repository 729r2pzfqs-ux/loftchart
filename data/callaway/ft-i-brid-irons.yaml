faq:
  - q: "What is the loft of a Callaway FT i-brid 7-iron?"
    a: "The FT i-brid 7-iron has a loft of 32 degrees, with a 62.5 degree lie and a 37 inch standard length."
  - q: "What are the i-brid clubs in the Callaway FT i-brid set?"
    a: "The 3-, 4- and 5-irons (19, 22 and 25 degrees) are full hybrid-bodied i-brids built at 39.75, 39 and 38.25 inches; from the 6-iron down the set transitions to iron-profile heads."
  - q: "Are the Callaway FT i-brid irons good for high handicappers?"
    a: "Yes — the FT i-brid is a super-game-improvement design: hybrid long clubs, weak lofts, upright 65 degree wedge lies and heavy perimeter weighting make it one of the easiest-launching sets Callaway made."
