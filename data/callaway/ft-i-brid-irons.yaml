description: >
  The FT i-brid was the last iron of Callaway's Fusion era, a
  super-game-improvement set in which the 3-, 4- and 5-irons are full i-brid
  hybrid-bodied clubs and the rest of the set carries hybrid-like weighting
  in an iron profile. It used a modified Tru-Bore design with a polycarbonate
  tip plug at the end of the shaft to damp vibration. Lofts are weak by
  modern standards with a 32 degree 7-iron and 44 degree pitching wedge, and
  the i-brid long clubs run noticeably longer than conventional irons.
