faq:
  - q: "What is the loft of a Callaway Epic Forged Star 7-iron?"
    a: "The Callaway Epic Forged Star 7-iron has a loft of 26 degrees, a lie of 60.5 degrees and a length of 37.625 inches."
  - q: "What is the difference between Epic Forged and Epic Forged Star irons?"
    a: "Star is the ultra-lightweight build for slower and moderate swing speeds: lighter head, 40-50 gram graphite shafts and a 43 gram grip, with lofts two to three degrees weaker through the scoring clubs than the standard Epic Forged."
  - q: "Who are Callaway Epic Forged Star irons for?"
    a: "Callaway built them for golfers with slower or moderate swing speeds who want maximum distance and launch from an ultra-light package. They were sold as a custom-order set."
