description: >
  Epic Forged Star is the ultra-lightweight build of the 2019 Epic Forged,
  announced with the Epic Star family on 16 July 2019 for golfers with slower
  and moderate swing speeds. A lighter head, 40 and 50 gram class UST ATTAS
  Speed shafts and a 43 gram grip cut the total weight, lofts are two to three
  degrees weaker than the standard Epic Forged for launch (a 26 degree 7-iron
  against 27, but a 38 degree pitching wedge against 41), and the set was sold
  as a custom-order 5-iron through sand wedge with four wedges closing the
  gaps.
