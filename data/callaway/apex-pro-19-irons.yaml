description: >
  The Apex Pro 19 is the compact players companion to the Apex 19, sold from the 2019
  season as the third generation of Callaway's forged Apex Pro. The body is forged from
  1025 mild carbon steel with roughly 50 grams of tungsten placed club by club to set
  the centre of gravity, and urethane microspheres behind the face to damp vibration.
  Lofts are traditional for a players iron — a 33 degree 7-iron and a 45 degree pitching
  wedge, four and a half degrees weaker than the Apex 19's short irons — and the loft,
  lie and length chart carried over unchanged to the Apex Pro 21 that replaced it.
  Specs below are the standard men's steel-shaft numbers.
