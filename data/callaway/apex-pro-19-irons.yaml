faq:
  - q: "What is the loft of a Callaway Apex Pro 19 7-iron?"
    a: "The Callaway Apex Pro 19 7-iron has a loft of 33 degrees, with a 62 degree lie and a 37 inch standard steel length."
  - q: "What is the loft of a Callaway Apex Pro 19 pitching wedge?"
    a: "The Apex Pro 19 pitching wedge is 45 degrees, with a 50 degree A-wedge below it."
  - q: "How do Apex Pro 19 lofts compare with the standard Apex 19?"
    a: "The Pro is noticeably weaker through the set. Its 7-iron is 33 degrees against the Apex 19's 30.5, and its pitching wedge 45 degrees against 43, reflecting its traditional players positioning."
  - q: "Did the lofts change from the Apex Pro 19 to the Apex Pro 21?"
    a: "No. The Apex Pro 21 kept the same loft, lie and length chart, from the 20.5 degree 3-iron to the 50 degree A-wedge."
