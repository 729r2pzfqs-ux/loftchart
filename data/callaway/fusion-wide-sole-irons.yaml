faq:
  - q: "What is the loft of a Callaway Fusion Wide Sole 7-iron?"
    a: "The Fusion Wide Sole 7-iron has a loft of 33 degrees, with a 62.5 degree lie and a 36.75 inch steel-shaft length."
  - q: "What year did the Callaway Fusion Wide Sole irons come out?"
    a: "Callaway announced the Fusion Wide Sole in late 2006 and sold it as its 2007-season super-game-improvement iron, replacing the original Big Bertha Fusion."
  - q: "Who are the Fusion Wide Sole irons for?"
    a: "They are super-game-improvement irons: the wide sole, multi-material head and upright 65 degree wedge lies are aimed at mid- and high-handicap golfers who want maximum forgiveness."
