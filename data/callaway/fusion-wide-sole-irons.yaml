description: >
  The Fusion Wide Sole took the multi-material Big Bertha Fusion concept and
  added a much wider sole for maximum forgiveness from turf and sand, aimed
  squarely at mid- and high-handicap golfers. It was announced in late 2006
  and sold as Callaway's 2007-season super-game-improvement iron. The loft
  ladder is identical to the original Fusion with a 33 degree 7-iron and a
  46 degree pitching wedge. Specs below are the standard men's steel build
  with the NS Pro 990 shaft; graphite was built a quarter inch longer.
