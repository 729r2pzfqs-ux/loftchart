description: >
  The 565MC is Tom Wishon's second-generation update to his 560MC forged
  cavity back, introduced in January 2016 and announced on GolfWRX with a
  cosmetic change designer Tom Wishon explained directly in the thread: the
  cavity badge medallion was dropped in favor of a fully CNC-machined
  surface milling pattern across the cavity floor and muscle weight, made
  possible by advances in the forging and machining process since the
  original 560MC. A center cavity half-moon weighting increases solid,
  on-center feel and adds a very slight increase in trajectory versus the
  560MC, while the fully CNC-machined back cavity holds a precise centre of
  gravity position at every loft. Low offset (2 mm throughout the 5-9 irons)
  and a slightly thinner topline than the 560MC keep the look compact and
  traditional; early buyers on GolfWRX noted the head carries comparatively
  little bounce. Double nickel chrome pearl plating with a glass bead blast
  highlight, USGA/R&A-compliant CNC grooves. Sold as bare heads or custom
  builds (3-PW/AW) through Wishon-authorized clubmakers rather than retail,
  at $140-225 per head depending on volume.
