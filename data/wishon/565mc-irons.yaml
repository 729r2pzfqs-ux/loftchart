faq:
  - q: "What is the loft of a Wishon 565MC 7-iron?"
    a: "The Wishon 565MC 7-iron has a loft of 34 degrees, a lie of 61 degrees and a standard length of 37 inches."
  - q: "How does the Wishon 565MC differ from the 560MC?"
    a: "It is Tom Wishon's second-generation update: the cavity badge medallion is replaced by a fully CNC-machined surface milling pattern, a center cavity half-moon weighting adds solid feel and a touch more trajectory, and the topline runs slightly thinner than the original 560MC."
  - q: "How do you buy Wishon 565MC irons?"
    a: "As bare heads or custom-built sets through Wishon-authorized clubmakers - there is no off-the-rack retail version - priced from $140 to $225 per head depending on volume, available 3-iron through pitching wedge and approach wedge in right hand only."
