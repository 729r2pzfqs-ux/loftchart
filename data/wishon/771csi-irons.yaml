faq:
  - q: "What is the loft of a Wishon 771CSI 7-iron?"
    a: "The Wishon 771CSI 7-iron has a loft of 34 degrees, a lie of 62 degrees and a standard steel length of 37 inches."
  - q: "Is the Wishon 771CSI forged or cast?"
    a: "The body is investment cast from 1020C carbon steel; a separately forged, CNC-machined variable-thickness HS300 high-strength steel face is fitted to it for a high 0.830 COR."
  - q: "How do you buy Wishon 771CSI irons?"
    a: "As bare heads or custom-built sets through Wishon-authorized clubmakers - there is no off-the-rack retail version - available right-handed #4 through AW and left-handed #5 through PW."
