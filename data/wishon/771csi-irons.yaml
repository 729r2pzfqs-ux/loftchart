description: >
  The 771CSI is Tom Wishon's high-COR, thin-face game-improvement iron, a
  carbon-steel evolution of the earlier 771 design. Its 1020C carbon-steel
  body allows a wider range of loft and lie bending for custom fitting than
  the 17-4 stainless bodies Wishon's earlier high-COR thin-face designs used,
  paired with a CNC-machined variable-thickness HS300 high-strength steel face
  (as thin as roughly 2 mm) for a 0.830 COR rating - near the USGA/R&A limit -
  and extra ball speed on off-centre hits. It was a Golf Digest 2014 Hot List
  winner. Sold as bare heads or custom builds through Wishon-authorized
  clubmakers rather than retail, in a fully radiused sole with a rounded
  leading edge and bright satin nickel-chrome electroplate finish, USGA/R&A-
  compliant CNC grooves, and up to plus-or-minus 4 degrees of loft/lie
  adjustment in either direction.
