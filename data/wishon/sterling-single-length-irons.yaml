faq:
  - q: "What is the loft of a Sterling Single Length 7-iron?"
    a: "The Sterling 7-iron has a loft of 31 degrees — but unlike a conventional set it is built to 36.5 inches on a 63-degree lie, the same length and lie as every other club in the set."
  - q: "How long are Wishon Sterling single-length irons?"
    a: "Every club is built to the same length — 36.5 inches standard, roughly an 8-iron's length, with 36.75 or 37 inches as fitting options — with identical 274-gram heads and 63-degree lies."
  - q: "How do Sterling long irons keep their distance at 8-iron length?"
    a: "The 4-iron through 7-iron use a high-COR construction: HS300 variable-thickness high-strength steel faces welded to 8620 carbon steel bodies, recovering the ball speed lost to the shorter shaft. The 8-iron through lob wedge are conventional one-piece castings."
  - q: "Are Wishon Sterling irons still made?"
    a: "No. They were discontinued when the Wishon EQ1-NX — marketed as the Sterling's second generation — arrived in 2021, though used sets remain common in the single-length community."
