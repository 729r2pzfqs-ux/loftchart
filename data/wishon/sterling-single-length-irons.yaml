description: >
  The Sterling Irons were the design that carried single-length golf into
  the mainstream conversation alongside Bryson DeChambeau's rise: every
  club in the set is built to the same 8-iron-like length — 36.5 inches
  standard, with 36.75 or 37 as fitting options — on the same 63-degree
  lie and the same 274-gram head weight, so one swing repeats through the
  bag. Tom Wishon designed them with single-length advocate Jaacob Bowden
  and introduced them in early 2016, when the first run sold out
  immediately. Because short shafts cost long irons speed, the 4-iron
  through 7-iron use a high-COR construction — HS300 variable-thickness
  high-strength steel faces welded to 8620 carbon steel bodies — while
  the 8-iron through wedges are conventional one-piece 8620 castings; a
  5-hybrid on the same length was offered in place of the 5-iron. Lofts
  run 19 to 60 degrees across a 4-iron-through-LW head range with wider
  gaps in the scoring clubs to preserve distance spacing. Sold through
  independent clubmakers, as all Wishon designs are, until the EQ1-NX —
  marketed as the Sterling's second generation — replaced it in 2021.
